# B"H
# Boruch Hashem
# Blessed be He
# Production truth is public truth: this workflow waits for main to converge on awtsmoos.com
# and proves the exact tunnel/mission contract instead of treating one obsolete SSH probe as reality.
name: Verify Awtsmoos Production Convergence

on:
  push:
    branches:
      - main

concurrency:
  group: awtsmoos-production-main
  cancel-in-progress: false

jobs:
  verify-production:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Wait for public production convergence
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          verify_public() {
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' RETURN
            curl -fsS --max-time 20 https://awtsmoos.com/Shliach/ -o "$tmp/shliach.html"
            curl -fsS --max-time 20 https://awtsmoos.com/apps/tunnel-control/js/features/missionRooms/visibilityBoard.js -o "$tmp/visibilityBoard.js"
            curl -fsS --max-time 20 https://awtsmoos.com/apps/tunnel-control/js/features/missionRooms/roomLobby.js -o "$tmp/roomLobby.js"
            grep -Fq 'Every serious mission becomes visible' "$tmp/shliach.html"
            grep -Fq 'TUNNEL MISSION REGISTRY' "$tmp/visibilityBoard.js"
            grep -Fq 'visibilityPayload' "$tmp/roomLobby.js"
            curl -fsS --max-time 20 https://awtsmoos.com/api/tunnel/control/bootstrap -o "$tmp/bootstrap.json"
            curl -fsS --max-time 20 https://awtsmoos.com/api/tunnel/control/agent-manifest -o "$tmp/manifest.json"
            node - "$tmp/bootstrap.json" "$tmp/manifest.json" <<'NODE'
          const fs = require("node:fs");
          const bootstrap = JSON.parse(fs.readFileSync(process.argv[2], "utf8"));
          const manifest = JSON.parse(fs.readFileSync(process.argv[3], "utf8"));
          const behavior = (bootstrap.agentBehavior || []).join("\n");
          if (!bootstrap.missionPlanning) throw new Error("bootstrap_mission_planning_missing");
          if (!/missionVisibilityList/.test(behavior) || !/passes 1, 2, and 3/i.test(behavior)) throw new Error("bootstrap_agent_guidance_stale");
          if (manifest.version !== "1.6.0") throw new Error(`manifest_version_${manifest.version}`);
          if (!manifest.missionPlanning) throw new Error("manifest_mission_planning_missing");
          if (manifest.transportLaw?.postAllowed !== false) throw new Error("post_must_remain_forbidden");
          NODE
            node scripts/verifyTunnelPublicRelease.mjs >/dev/null
          }
          for attempt in $(seq 1 36); do
            if verify_public; then
              echo "B\"H PRODUCTION_CONVERGED sha=$EXPECTED_SHA attempt=$attempt"
              exit 0
            fi
            echo "B\"H production not converged yet sha=$EXPECTED_SHA attempt=$attempt" >&2
            sleep 10
          done
          echo "B\"H production did not converge to the required public contract" >&2
          exit 1
