# B"H
# Boruch Hashem
# Blessed is He
# The Awtsmoos binds one tested pushed SHA to one immutable production shore.
name: Deploy to Hetzner Awtsmoos

on:
  push:
    branches:
      - main

concurrency:
  group: awtsmoos-production-main
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact pushed SHA
        uses: actions/checkout@v4

      - name: Use production Node generation
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run release-critical contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          node --check scripts/verifyHomeProduction.mjs
          node --test scripts/runtime_quality/*.test.mjs
          node --test scripts/production/*.test.cjs scripts/production/*.test.mjs scripts/production/test/*.test.mjs
          node --test geelooy/games/city-of-light/tests/releaseSurface.test.mjs
          node --test ayzarim/awtsmoosDynamicServer/tests/staticAssetRepresentation.test.js ayzarim/awtsmoosDynamicServer/static/HtmlProductMetadata.test.js
          npm run test:routes
          npm run test:css-quality
          npm run repo:hygiene
          npm run test:concurrency-failure
          node --test geelooy/apps/rebbe/test/*.test.mjs
          node --test \
            geelooy/heichelos/post/test/postReaderNodeDom.test.mjs \
            geelooy/heichelos/post/test/torahReaderAuthority.test.mjs \
            geelooy/heichelos/post/test/readerPreferenceLocalization.test.mjs \
            geelooy/heichelos/post/test/initialContentSemanticVerses.test.mjs \
            tests/livingLibraryShellContract.test.mjs \
            tests/basicUiUxRegression.test.mjs
          node --test \
            geelooy/heichelos/heichel/modules/test/heichelDesktopCollapseContract.test.mjs \
            geelooy/heichelos/heichel/modules/test/heichelSemanticFallbackPolicy.test.mjs \
            geelooy/heichelos/heichel/modules/test/ikarBilingualPathRepair.test.mjs \
            geelooy/heichelos/heichel/modules/test/ikarCardGeometryRegression.test.mjs \
            geelooy/heichelos/heichel/modules/test/ikarTanachTitleRegistry.test.mjs \
            geelooy/heichelos/heichel/modules/test/livingPathBlueprintContract.test.mjs \
            tests/geelooy/ikarPerformanceContract.test.mjs \
            tests/geelooy/ikarPremiumVisionContract.test.mjs

  deploy:
    needs: quality
    runs-on: ubuntu-latest
    env:
      EXPECTED_SHA: ${{ github.sha }}
      DEPLOY_HOST: ${{ secrets.SERVER_IP }}
      DEPLOY_USER: ${{ secrets.SERVER_USER }}
      DEPLOY_PASSWORD: ${{ secrets.AWTSMOOS_PASSWORD }}
    steps:
      - name: Verify deployment inputs
        shell: bash
        run: |
          set -Eeuo pipefail
          for name in EXPECTED_SHA DEPLOY_HOST DEPLOY_USER DEPLOY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required deployment input: $name"
              exit 1
            fi
          done
          case "$EXPECTED_SHA" in
            *[!0-9a-f]*|'') echo "::error::Invalid GitHub source SHA"; exit 1 ;;
          esac
          test "${#EXPECTED_SHA}" -eq 40

      - name: Execute canonical production deployment over SSH
        uses: appleboy/ssh-action@v1.2.5
        env:
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.AWTSMOOS_PASSWORD }}
          port: 22
          envs: EXPECTED_SHA
          timeout: 30s
          command_timeout: 30m
          script: |
            set -Eeuo pipefail
            repo="${AWTSMOOS_PRODUCTION_REPO:-/mnt/HC_Volume_102267213/git/awtsmoos.com}"
            git -C "$repo" rev-parse --git-dir >/dev/null
            test "$(git -C "$repo" branch --show-current)" = "main"
            git -C "$repo" fetch --prune --tags origin main
            test "$(git -C "$repo" rev-parse origin/main^{commit})" = "$EXPECTED_SHA"
            git -C "$repo" reset --hard "$EXPECTED_SHA"
            git -C "$repo" clean -fd
            test -z "$(git -C "$repo" status --porcelain)"
            test "$(git -C "$repo" rev-parse HEAD^{commit})" = "$EXPECTED_SHA"
            bash "$repo/scripts/production/canonical-server-activate.sh" "$EXPECTED_SHA"
            node "$repo/scripts/verifyHomeProduction.mjs"
            node "$repo/scripts/verifyTunnelPublicRelease.mjs"
            test "$(git -C "$repo" rev-parse HEAD^{commit})" = "$EXPECTED_SHA"
