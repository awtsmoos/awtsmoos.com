# B"H
# Boruch Hashem
# Blessed is He
# The Awtsmoos proves each gate before the public is asked to trust.
name: Deploy and Verify Awtsmoos Production
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: awtsmoos-production-main
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout exact proposed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Select Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verify frontend API contracts
        run: bash geelooy/apps/tunnel-control/tests/api-smoke.sh
      - name: Verify backend ownership and installer rollback
        run: bash geelooy/apps/tunnel-control/tests/backend-certification.sh
      - name: Verify candidate-source browser controls
        run: bash scripts/production/tunnel-predeploy-browser.sh
  deploy:
    needs: quality
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ github.sha }}
      SERVER_USER: root
      SSH_PRIVATE_KEY: ${{ secrets.AWTSMOOS_PRODUCTION_DEPLOY_KEY }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Select release-verifier Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Canonical production deploy with bounded retries
        run: |
          set -Eeuo pipefail
          : "${SERVER_USER:?SERVER_USER is not configured}"
          : "${SSH_PRIVATE_KEY:?AWTSMOOS_PRODUCTION_DEPLOY_KEY is not configured}"
          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null' EXIT
          if ! printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add - >/dev/null 2>&1; then
            echo "::error title=Invalid production SSH key::The dedicated GitHub Actions SSH key could not be loaded."
            exit 1
          fi
          unset SSH_PRIVATE_KEY
          ssh-add -l >/dev/null
          deploy_once() {
            local attempt="$1"
            local log
            local code
            log="$(mktemp)"
            set +e
            ssh \
              -o BatchMode=yes \
              -o PreferredAuthentications=publickey \
              -o PasswordAuthentication=no \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=2 \
              "$SERVER_USER@awtsmoos.com" \
              "EXPECTED_SHA='$EXPECTED_SHA' bash /mnt/HC_Volume_102267213/git/awtsmoos.com/scripts/production/remote-deploy-entry.sh '$EXPECTED_SHA'" \
              >"$log" 2>&1
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              cat "$log"
              rm -f "$log"
              return 0
            fi
            if grep -Eqi 'permission denied|authentication failed|COMMAND_REJECTED|SHA_MISMATCH' "$log"; then
              echo "::error title=Production SSH authorization rejected::The dedicated deployment identity or SHA gate failed on attempt $attempt."
            elif grep -Eqi 'timed out|no route to host|connection refused|network is unreachable' "$log"; then
              echo "::error title=Production SSH network failure::GitHub runner could not establish SSH to awtsmoos.com on attempt $attempt."
            else
              echo "::error title=Production activation failed::Authenticated deploy entered the server but activation failed on attempt $attempt."
              sed -E 's/[^[:print:]\t]//g' "$log" | tail -n 80
            fi
            rm -f "$log"
            return "$code"
          }
          for attempt in 1 2 3; do
            if deploy_once "$attempt"; then
              echo 'B"H canonical deployment succeeded'
              exit 0
            fi
            sleep $((attempt * 8))
          done
          exit 1
      - name: Verify public production contract
        run: bash scripts/production/tunnel-public-verify.sh
