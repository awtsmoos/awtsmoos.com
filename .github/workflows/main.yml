# B"H
# Boruch Hashem
# Blessed be He
# The Awtsmoos sends one exact main SHA through a diagnosable SSH lane, then proves public truth.
name: Deploy and Verify Awtsmoos Production

on:
  push:
    branches:
      - main

concurrency:
  group: awtsmoos-production-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      EXPECTED_SHA: ${{ github.sha }}
      SERVER_USER: ${{ secrets.SERVER_USER }}
      AWTSMOOS_PASSWORD: ${{ secrets.AWTSMOOS_PASSWORD }}
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Prepare SSH client
        run: |
          set -Eeuo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Canonical production deploy with bounded retries
        run: |
          set -Eeuo pipefail
          deploy_once() {
            local attempt="$1"
            local log
            log="$(mktemp)"
            set +e
            SSHPASS="$AWTSMOOS_PASSWORD" sshpass -e ssh \
              -o PreferredAuthentications=password \
              -o PubkeyAuthentication=no \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=20 \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=2 \
              "$SERVER_USER@awtsmoos.com" \
              "EXPECTED_SHA='$EXPECTED_SHA' bash /mnt/HC_Volume_102267213/git/awtsmoos.com/scripts/production/remote-deploy-entry.sh '$EXPECTED_SHA'" \
              >"$log" 2>&1
            code=$?
            set -e
            if [ "$code" -eq 0 ]; then
              cat "$log"
              rm -f "$log"
              return 0
            fi
            if grep -Eqi 'permission denied|authentication failed' "$log"; then
              echo "::error title=Production SSH authentication failed::SERVER_USER/AWTSMOOS_PASSWORD were rejected by awtsmoos.com on attempt $attempt."
            elif grep -Eqi 'timed out|no route to host|connection refused|network is unreachable' "$log"; then
              echo "::error title=Production SSH network failure::GitHub runner could not establish SSH to awtsmoos.com on attempt $attempt."
            else
              echo "::error title=Production activation failed::SSH connected or began negotiation, but canonical activation failed on attempt $attempt."
              sed -E 's/[^[:print:]\t]//g' "$log" | tail -n 80
            fi
            rm -f "$log"
            return "$code"
          }
          for attempt in 1 2 3; do
            if deploy_once "$attempt"; then
              echo "B\"H canonical deployment succeeded on attempt $attempt"
              exit 0
            fi
            sleep $((attempt * 8))
          done
          exit 1

      - name: Verify public production contract
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 30); do
            tmp="$(mktemp -d)"
            if curl -fsS --max-time 20 https://awtsmoos.com/api/tunnel/control/bootstrap -o "$tmp/b.json" \
              && curl -fsS --max-time 20 https://awtsmoos.com/api/tunnel/control/agent-manifest -o "$tmp/m.json" \
              && node - "$tmp/b.json" "$tmp/m.json" <<'NODE'
          const fs=require('node:fs');
          const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const m=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          const behavior=(b.agentBehavior||[]).join('\n');
          if(!String(m.version||'').startsWith('1.')||!m.missionPlanning||!b.missionPlanning) process.exit(1);
          if(!/missionVisibilityList/.test(behavior)||!/planning passes 1, 2, and 3/i.test(behavior)) process.exit(1);
          if(m.transportLaw?.postAllowed!==false) process.exit(1);
          NODE
            then
              rm -rf "$tmp"
              node scripts/verifyTunnelPublicRelease.mjs
              echo "B\"H PRODUCTION_RELEASE_VERIFIED sha=$EXPECTED_SHA"
              exit 0
            fi
            rm -rf "$tmp"
            sleep 5
          done
          exit 1
