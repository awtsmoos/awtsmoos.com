# B"H
# Boruch Hashem
# Blessed be He
# The Awtsmoos sends one exact main SHA through bounded deployment attempts, then proves public truth.
name: Deploy and Verify Awtsmoos Production

on:
  push:
    branches:
      - main

concurrency:
  group: awtsmoos-production-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout exact main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Deploy attempt 1
        id: deploy1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.5
        env:
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: awtsmoos.com
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.AWTSMOOS_PASSWORD }}
          port: 22
          envs: EXPECTED_SHA
          timeout: 30s
          command_timeout: 30m
          script: |
            set -Eeuo pipefail
            repo="${AWTSMOOS_PRODUCTION_REPO:-/mnt/HC_Volume_102267213/git/awtsmoos.com}"
            bash "$repo/scripts/production/remote-deploy-entry.sh" "$EXPECTED_SHA"

      - name: Deploy attempt 2
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.2.5
        env:
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: awtsmoos.com
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.AWTSMOOS_PASSWORD }}
          port: 22
          envs: EXPECTED_SHA
          timeout: 45s
          command_timeout: 30m
          script: |
            sleep 8
            set -Eeuo pipefail
            repo="${AWTSMOOS_PRODUCTION_REPO:-/mnt/HC_Volume_102267213/git/awtsmoos.com}"
            bash "$repo/scripts/production/remote-deploy-entry.sh" "$EXPECTED_SHA"

      - name: Deploy attempt 3
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: appleboy/ssh-action@v1.2.5
        env:
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: awtsmoos.com
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.AWTSMOOS_PASSWORD }}
          port: 22
          envs: EXPECTED_SHA
          timeout: 60s
          command_timeout: 30m
          script: |
            sleep 15
            set -Eeuo pipefail
            repo="${AWTSMOOS_PRODUCTION_REPO:-/mnt/HC_Volume_102267213/git/awtsmoos.com}"
            bash "$repo/scripts/production/remote-deploy-entry.sh" "$EXPECTED_SHA"

      - name: Verify public production contract
        run: |
          set -Eeuo pipefail
          for attempt in $(seq 1 30); do
            tmp="$(mktemp -d)"
            if curl -fsS --max-time 20 https://awtsmoos.com/api/tunnel/control/bootstrap -o "$tmp/b.json" \
              && curl -fsS --max-time 20 https://awtsmoos.com/api/tunnel/control/agent-manifest -o "$tmp/m.json" \
              && node - "$tmp/b.json" "$tmp/m.json" <<'NODE'
          const fs=require('node:fs');
          const b=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const m=JSON.parse(fs.readFileSync(process.argv[3],'utf8'));
          const behavior=(b.agentBehavior||[]).join('\n');
          if(m.version!=='1.6.0'||!m.missionPlanning||!b.missionPlanning) process.exit(1);
          if(!/missionVisibilityList/.test(behavior)||!/planning passes 1, 2, and 3/i.test(behavior)) process.exit(1);
          if(m.transportLaw?.postAllowed!==false) process.exit(1);
          NODE
            then
              rm -rf "$tmp"
              node scripts/verifyTunnelPublicRelease.mjs
              echo "B\"H PRODUCTION_RELEASE_VERIFIED sha=${{ github.sha }}"
              exit 0
            fi
            rm -rf "$tmp"
            sleep 5
          done
          exit 1
