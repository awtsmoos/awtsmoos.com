        <script>
            //B"H
            (() => {
                const bindGlobalMenu = () => {
                    const button = document.getElementById("menuButton");
                    const sidebar = document.getElementById("awtsmoosGlobalSidebar");
                    if (!button || !sidebar || button.dataset.awtsmoosBound === "true") return;
                    button.dataset.awtsmoosBound = "true";

                    const setOpen = open => {
                        sidebar.classList.toggle("offscreen", !open);
                        button.setAttribute("aria-expanded", open ? "true" : "false");
                        button.setAttribute("aria-label", open ? "Close Awtsmoos menu" : "Open Awtsmoos menu");
                    };

                    button.addEventListener("click", event => {
                        event.preventDefault();
                        setOpen(sidebar.classList.contains("offscreen"));
                    });

                    document.addEventListener("keydown", event => {
                        if (event.key === "Escape") setOpen(false);
                    });

                    document.addEventListener("pointerdown", event => {
                        if (sidebar.classList.contains("offscreen")) return;
                        if (sidebar.contains(event.target) || button.contains(event.target)) return;
                        setOpen(false);
                    }, true);
                };

                if (document.readyState === "loading") {
                    document.addEventListener("DOMContentLoaded", bindGlobalMenu, { once: true });
                } else {
                    bindGlobalMenu();
                }
            })();
        </script>
