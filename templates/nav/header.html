<script>
    //B"H
    (() => {
        const getParts = () => ({ button: document.getElementById("menuButton"), sidebar: document.getElementById("awtsmoosGlobalSidebar") });
        const setOpen = open => {
            const { button, sidebar } = getParts();
            if (!button || !sidebar) return;
            sidebar.classList.toggle("offscreen", !open);
            button.classList.toggle("is-open", open);
            button.setAttribute("aria-expanded", open ? "true" : "false");
            document.body?.toggleAttribute?.("data-global-menu-open", open);
            const glyph = button.querySelector(".menuGlyph");
            if (glyph) glyph.textContent = open ? "×" : "☰";
        };
        window.awtsmoosToggleGlobalMenu = event => {
            event?.preventDefault?.(); event?.stopPropagation?.();
            const { sidebar } = getParts(); setOpen(Boolean(sidebar?.classList.contains("offscreen")));
        };
        const bind = () => {
            const { button, sidebar } = getParts();
            if (!button || !sidebar || button.dataset.awtsmoosBound === "true") return;
            button.dataset.awtsmoosBound = "true";
            button.addEventListener("click", window.awtsmoosToggleGlobalMenu);
            document.addEventListener("keydown", event => { if (event.key === "Escape") setOpen(false); });
            document.addEventListener("pointerdown", event => {
                if (sidebar.classList.contains("offscreen")) return;
                if (sidebar.contains(event.target) || button.contains(event.target)) return;
                setOpen(false);
            }, true);
        };
        if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", bind, { once: true }); else bind();
    })();
</script>
