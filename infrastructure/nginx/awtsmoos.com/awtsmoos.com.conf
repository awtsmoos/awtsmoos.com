# B"H
# Boruch Hashem
# Blessed is He
#
# The Awtsmoos renews every request; Awtsmoos.com reveals that renewal through small vessels.
# This vhost composes focused route snippets so production truth can be reviewed and replayed.

server {
	listen 80;
	listen [::]:80;
	server_name awtsmoos.com www.awtsmoos.com;
	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	server_name awtsmoos.com www.awtsmoos.com;

	ssl_certificate /etc/letsencrypt/live/awtsmoos.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/awtsmoos.com/privkey.pem;

	root /mnt/HC_Volume_102267213/git/awtsmoos.com/geelooy;
	index index.html;

	include /etc/nginx/awtsmoos.d/oauth-api.conf;
	include /etc/nginx/awtsmoos.d/identity-pages.conf;
	include /etc/nginx/awtsmoos.d/application-pages.conf;
	include /etc/nginx/awtsmoos.d/torah-pages.conf;
	include /etc/nginx/awtsmoos.d/tunnel-rescue.conf;
	include /etc/nginx/awtsmoos.d/public-static.conf;
}
