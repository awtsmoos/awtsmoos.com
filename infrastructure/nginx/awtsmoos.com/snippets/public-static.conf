# B"H
# Boruch Hashem
# Blessed is He
# The Awtsmoos recreates every public vessel now; Awtsmoos.com refuses stale modules and gives each page the present vow.

location ~* \.html$ {
	add_header Cache-Control "no-cache, must-revalidate" always;
	sub_filter_once on;
	sub_filter '</head>' '<script type="module" src="/scripts/freshness/UniversalBuildFreshnessBoot.js"></script></head>';
	try_files $uri =404;
}

location ~* \.(?:js|mjs)$ {
	add_header Cache-Control "no-store" always;
	try_files $uri =404;
}

location / {
	if ($http_upgrade = "websocket") {
		return 418;
	}
	add_header Cache-Control "no-cache, must-revalidate" always;
	sub_filter_once on;
	sub_filter '</head>' '<script type="module" src="/scripts/freshness/UniversalBuildFreshnessBoot.js"></script></head>';
	try_files $uri $uri/ $uri/index.html =404;
}
