# B"H
# Boruch Hashem
# Blessed is He
# The Awtsmoos carries identity and API speech; Awtsmoos.com forwards each vessel without deceit.
# Modern MCP discovery reaches the same protected light through its exact RFC 9728 path,
# while guarded proxy timeouts and temp vessels preserve the large deeds already alive.

location = /.well-known/oauth-protected-resource {
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_pass http://127.0.0.1:8080;
}

location = /.well-known/oauth-protected-resource/api/tunnel/control/mcp {
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_pass http://127.0.0.1:8080;
}

location = /.well-known/oauth-authorization-server {
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_pass http://127.0.0.1:8080;
}

location = /api/tunnel/control/mcp {
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_pass http://127.0.0.1:8080/api/tunnel/control/mcp/;
}

location ^~ /api/tunnel/control/write-large/ {
	client_max_body_size 96m;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_pass http://127.0.0.1:8080;
	proxy_read_timeout 300s;
	proxy_send_timeout 300s;
	proxy_connect_timeout 10s;
}

location ^~ /api/ {
	proxy_temp_path /mnt/HC_Volume_102267213/nginx-tmp/proxy;
	client_body_temp_path /mnt/HC_Volume_102267213/nginx-tmp/client-body;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	proxy_pass http://127.0.0.1:8080;
	proxy_read_timeout 300s;
	proxy_send_timeout 300s;
	proxy_connect_timeout 10s;
}

location = /__awtsmoos_emergency_health {
	proxy_pass http://127.0.0.1:8080;
}
