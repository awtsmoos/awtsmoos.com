# B"H
# Boruch Hashem
# Blessed is He
# The Awtsmoos renews each public doorway; Awtsmoos.com keeps an old sha'ar pointed toward its living way.

location ~ ^/worlds/?$ {
	return 308 /?worlds=1;
}

location ~ ^/(?:torah|apps/torah|ikar)/?$ {
	return 308 /heichelos/ikar$is_args$args;
}

location ~ ^/music/?$ {
	return 308 /apps/piano$is_args$args;
}

location ~ ^/tunnel/?$ {
	return 308 /apps/tunnel-control/$is_args$args;
}

location ~ ^/apps/(?:kavannah|kavanah-ai)/?$ {
	return 308 /games/KAVANAH/$is_args$args;
}

location = /favicon.ico {
	return 308 /favicon.svg;
}

location ~ ^/APPS/?$ {
	return 308 /apps/$is_args$args;
}

location ~ ^/apps/encyclopedia/?$ {
	return 308 /encyclopedia/$is_args$args;
}

location ~ ^/library/?$ {
	return 308 /mawgawl/sefarim/$is_args$args;
}

location ~ ^/code/?$ {
	return 308 /apps/code$is_args$args;
}

location = /encyclopedia/browse.html {
	return 308 /encyclopedia/;
}

location = /encyclopedia/categories.html {
	return 308 /encyclopedia/#categories;
}

location = /encyclopedia/a-z.html {
	return 308 /encyclopedia/#az;
}
