# B"H
# Boruch Hashem
# Blessed is He
# The Awtsmoos gives each living application its doorway; Awtsmoos.com forwards the revealed way.

location ^~ /heichelos/ {
	proxy_pass http://127.0.0.1:8080;
}

location ^~ /view/ {
	proxy_pass http://127.0.0.1:8080;
}

location = /prof {
	return 301 /profile/;
}

location = /prof/ {
	return 301 /profile/;
}

location ^~ /mawgawl/ {
	proxy_pass http://127.0.0.1:8080;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

