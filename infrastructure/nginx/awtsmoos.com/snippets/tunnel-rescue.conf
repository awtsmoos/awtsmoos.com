# B"H
# Boruch Hashem
# Blessed is He
# The Awtsmoos keeps the tunnel alive through website restarts; Awtsmoos.com preserves the hidden bridge of hearts.

error_page 418 = @awtsmoos_tunnel_ws;

location = /api/tunnel/ws {
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	proxy_connect_timeout 3s;
	proxy_read_timeout 3600s;
	proxy_send_timeout 3600s;
	proxy_buffering off;
	proxy_pass http://127.0.0.1:47475;
}

location @awtsmoos_tunnel_ws {
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
	proxy_pass http://127.0.0.1:8080;
}

location ^~ /__awtsmoos_chatgpt_rescue/ {
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_pass http://127.0.0.1:18090/;
}

location ^~ /__awtsmoos_ai_rescue_7f3b/ {
	proxy_pass http://127.0.0.1:18081/;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}
