<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="theme-color" content="#07110f">
	<meta name="description" content="Awtsmoos Drive — browse real files, upload, organize, share, and open the Builder when creation needs a deeper workspace.">
	<title>Awtsmoos Drive</title>
	<link rel="stylesheet" href="/apps/drive/styles/drive-v5.css?v=46fbf78804">
	<link rel="modulepreload" href="/apps/drive/js/app.js?v=9b1f6e0990">
	<style>
		/* B"H — First-paint critical styles: the Drive v5 cascade loads through an
		   @import chain and the app shell mounts via JS modules, so paint the dark
		   Drive vessel immediately. Colors match drive-v5-tokens.css tokens. */
		html { background: #040a09; }
		body[data-awtsmoos-drive] { background: #07110f; color: #f5faf8; margin: 0; }
		.drive-boot-hint {
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			margin: 0;
			color: #a8bfb8;
			font: 500 1rem/1.5 Inter, ui-sans-serif, system-ui, sans-serif;
		}
	</style>
	<script type="module" src="./driveEntry.js?v=dea8586889"></script>
</head>
<body data-awtsmoos-drive data-drive-view="home">
	<a class="drive-skip-link" href="#drive-browser">Skip to files</a>
	<div id="drive-root"><p class="drive-boot-hint">Loading Awtsmoos Drive&hellip;</p></div>
	<noscript><p>Awtsmoos Drive needs JavaScript to connect your files, folders, sharing, and Builder.</p></noscript>
</body>
</html>
