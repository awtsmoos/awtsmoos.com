<!-- B"H — Geelooy signal center, connected to the real social API. -->
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="description" content="Search and manage comments, mentions, submissions, and system signals for a Geelooy alias.">
	<meta name="theme-color" content="#050914">
	<title>Signals — Geelooy</title>
	<link rel="stylesheet" href="/style/geelooy-app/index.css?v=app-001">
</head>
<body data-notifications-page>
	<a class="g-sr-only" href="#list">Skip to signal list</a>
	<main class="g-page geelooy-content-region g-page-stack" aria-labelledby="notifications-title">
		<section class="g-panel g-page-hero">
			<div>
				<p class="g-kicker">Signal center</p>
				<h1 id="notifications-title">Notifications</h1>
				<p>Comments, mentions, submissions, and system activity—automatically opened for your default alias.</p>
			</div>
			<button id="markAll" class="g-button" type="button">Mark all read</button>
		</section>

		<form id="filters" class="notifications-console" aria-label="Notification filters" aria-busy="false">
			<label><span>Alias</span><input name="aliasId" autocomplete="off" placeholder="Default alias loads automatically" required></label>
			<label><span>Search signals</span><input name="search" type="search" autocomplete="off" placeholder="Comment, mention, title…"></label>
			<label><span>Type</span><select name="type"><option value="">All types</option><option value="submission_created">Submissions</option><option value="comment">Comments</option><option value="mention">Mentions</option><option value="system">System</option></select></label>
			<button class="g-button g-button-primary" type="submit">Load signals</button>
		</form>

		<section id="summary" class="notifications-summary" aria-live="polite">Finding your default alias…</section>
		<section id="list" class="notifications-list" aria-live="polite" aria-label="Notification results">
			<article class="notification state"><h2>Opening the signal stream</h2><p>Your default alias will load automatically.</p></article>
		</section>
		<button id="more" class="g-button" type="button" hidden>Load more</button>
	</main>
	<script type="module" src="/scripts/awtsmoos/social/shell/boot.js?v=app-001"></script>
	<script type="module" src="./app.js?v=app-001"></script>
</body>
</html>
