<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="theme-color" content="#071022">
	<title>Geelooy OS — Awtsmoos</title>
	<link rel="stylesheet" href="./styles.css?v=revelation-3">
	<link rel="stylesheet" href="./civilization/styles.css?v=revelation-3">
	<link rel="stylesheet" href="./styles/native-executable-accessibility.css?v=revelation-3">
	<link rel="stylesheet" href="./styles/revelation/tokens.css?v=revelation-3">
	<link rel="stylesheet" href="./styles/revelation/shell.css?v=revelation-3">
	<link rel="stylesheet" href="./styles/revelation/dock.css?v=revelation-3">
	<link rel="stylesheet" href="./styles/revelation/dock-pinned.css?v=revelation-3">
	<link rel="stylesheet" href="./styles/revelation/windows.css?v=revelation-3">
	<link rel="stylesheet" href="./styles/revelation/overlays.css?v=revelation-3">
	<link rel="stylesheet" href="./styles/revelation/command.css?v=revelation-3">
	<link rel="stylesheet" href="./styles/revelation/launcher.css?v=revelation-3">
	<link rel="stylesheet" href="./styles/revelation/launcher-records.css?v=revelation-3">
	<link rel="stylesheet" href="./styles/revelation/responsive.css?v=revelation-3">
	<link rel="stylesheet" href="./styles/revelation/responsive-mobile.css?v=revelation-3">
	<link rel="stylesheet" href="./styles/revelation/accessibility.css?v=revelation-3">
</head>
<body>
	<div class="main">
		<header id="awtsmoos-shell-topbar" aria-label="Geelooy system controls">
			<div class="shell-brand">
				<span class="shell-brand-mark" aria-hidden="true">✦</span>
				<span class="shell-brand-copy">Geelooy OS</span>
			</div>
			<span id="shell-status" class="shell-chip" role="status">Starting…</span>
			<div class="shell-topbar-actions">
				<button id="shell-command-button" class="shell-chip" type="button">Search <kbd>⌘⇧K</kbd></button>
				<time id="shell-clock" class="shell-chip">--:--</time>
				<button id="shell-quick-settings-button" class="shell-icon-button" type="button" aria-label="Quick settings" aria-expanded="false">⚙️</button>
				<div id="loginHolder" class="login-area"></div>
			</div>
		</header>
		<main id="desktop" class="desktop" aria-label="Geelooy desktop"></main>
		<nav id="start-bar" aria-label="Applications and running tasks">
			<button id="start-button" type="button" aria-label="Open Apps" aria-controls="start-menu" aria-expanded="false">
				<span class="start-button-label">Apps</span>
			</button>
			<div id="shell-pinned-apps" class="shell-pinned-apps" aria-label="Pinned applications"></div>
			<span class="shell-dock-divider" aria-hidden="true"></span>
			<div id="task-area" aria-label="Running applications"></div>
		</nav>
	</div>
	<section id="start-menu" class="hidden" hidden aria-label="Apps and actions">
		<div class="start-menu-grabber" aria-hidden="true"></div>
		<div id="menu-items"></div>
	</section>
	<aside id="shell-quick-settings" class="shell-panel" hidden aria-label="Quick settings">
		<div class="shell-setting-grid">
			<button class="shell-setting" type="button" data-shell-setting="highContrast" aria-pressed="false">◐<span>High contrast</span></button>
			<button class="shell-setting" type="button" data-shell-setting="calm" aria-pressed="false">≈<span>Calm motion</span></button>
			<button class="shell-setting" type="button" data-shell-setting="fullscreen">⛶<span>Fullscreen</span></button>
			<button class="shell-setting" type="button" data-shell-setting="apps-code">⌘<span>Apps Code</span></button>
		</div>
	</aside>
	<div id="shell-command-palette" hidden role="dialog" aria-modal="true" aria-label="Command palette">
		<div class="shell-command-card">
			<input id="shell-command-input" type="search" autocomplete="off" placeholder="Search apps and actions">
			<div id="shell-command-results" role="listbox"></div>
		</div>
	</div>
	<div id="shell-live-region" class="shell-live-region" aria-live="polite"></div>
	<script type="module" src="./script.js?v=revelation-3"></script>
</body>
</html>
