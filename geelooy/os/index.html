<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="theme-color" content="#071022">
	<meta name="description" content="Geelooy OS is the Awtsmoos project workspace for files, AwtsmoosDB APIs, code, previews, supervised runtime, telemetry, and connected machines.">
	<title>Geelooy OS — Files, AwtsmoosDB, Runtime & Control</title>
	<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23071022'/%3E%3Ctext x='32' y='43' font-size='38' text-anchor='middle' fill='%23ffffff'%3E%E2%9C%A6%3C/text%3E%3C/svg%3E">
	<link rel="stylesheet" href="./styles.css?v=revelation-8">
	<link rel="stylesheet" href="./civilization/styles.css?v=revelation-8">
	<link rel="stylesheet" href="./native-executable-accessibility.css?v=revelation-8">
	<link rel="stylesheet" href="./styles/revelation/tokens.css?v=revelation-8">
	<link rel="stylesheet" href="./styles/revelation/icon-language.css?v=revelation-8">
	<link rel="stylesheet" href="./styles/revelation/shell.css?v=revelation-8">
	<link rel="stylesheet" href="./styles/revelation/dock.css?v=revelation-8">
	<link rel="stylesheet" href="./styles/revelation/dock-pinned.css?v=revelation-8">
	<link rel="stylesheet" href="./styles/revelation/windows.css?v=revelation-8">
	<link rel="stylesheet" href="./styles/revelation/overlays.css?v=revelation-8">
	<link rel="stylesheet" href="./styles/revelation/command.css?v=revelation-8">
	<link rel="stylesheet" href="./styles/revelation/launcher.css?v=revelation-8">
	<link rel="stylesheet" href="./styles/revelation/launcher-records.css?v=revelation-8">
	<link rel="stylesheet" href="./styles/revelation/feedback.css?v=revelation-8">
	<link rel="stylesheet" href="./styles/revelation/responsive.css?v=revelation-8">
	<link rel="stylesheet" href="./styles/revelation/responsive-mobile.css?v=revelation-8">
	<link rel="stylesheet" href="./styles/revelation/accessibility.css?v=revelation-8">
	<link rel="stylesheet" href="./styles/revelation/skip-link.css?v=revelation-8">
</head>
<body>
	<a class="g-sr-only g-skip-link" href="#desktop">Skip to desktop</a>
	<div class="main">
		<header id="awtsmoos-shell-topbar" aria-label="Geelooy system controls">
			<div class="shell-brand">
				<span class="shell-brand-mark emoji" aria-hidden="true">✦</span>
				<span class="shell-brand-copy">Geelooy OS · Files · DB · Runtime</span>
			</div>
			<span id="shell-status" class="shell-chip" role="status" aria-live="polite">Starting Project Command Center…</span>
			<div class="shell-topbar-actions">
				<button id="shell-command-button" class="shell-chip" type="button" data-os-icon="command" aria-haspopup="dialog">Command <kbd>⌘⇧K</kbd></button>
				<time id="shell-clock" class="shell-chip" aria-label="Current time">--:--</time>
				<button id="shell-quick-settings-button" class="shell-icon-button" type="button" data-os-icon="settings" aria-label="Quick settings" aria-controls="shell-quick-settings" aria-expanded="false"></button>
				<div id="loginHolder" class="login-area"></div>
			</div>
		</header>
		<main id="desktop" class="desktop" tabindex="-1" aria-label="Geelooy project desktop"></main>
		<nav id="start-bar" aria-label="Platform applications and running tasks">
			<button id="start-button" type="button" data-os-icon="apps" aria-label="Open Apps" aria-controls="start-menu" aria-expanded="false">
				<span class="start-button-emoji emoji" aria-hidden="true">✨</span>
				<span class="start-button-label">Apps</span>
			</button>
			<div id="shell-pinned-apps" class="shell-pinned-apps" aria-label="Pinned applications"></div>
			<span class="shell-dock-divider" aria-hidden="true"></span>
			<div id="task-area" aria-label="Running applications"></div>
		</nav>
	</div>
	<section id="start-menu" class="hidden" hidden aria-label="Apps and actions">
		<div class="start-menu-grabber" aria-hidden="true"></div>
		<div id="menu-items"></div>
	</section>
	<aside id="shell-quick-settings" class="shell-panel" hidden aria-label="Quick settings">
		<div class="shell-setting-grid">
			<button class="shell-setting" type="button" data-shell-setting="highContrast" data-os-icon="contrast" aria-pressed="false"><span>High contrast</span></button>
			<button class="shell-setting" type="button" data-shell-setting="calm" data-os-icon="motion" aria-pressed="false"><span>Calm motion</span></button>
			<button class="shell-setting" type="button" data-shell-setting="fullscreen" data-os-icon="fullscreen"><span>Fullscreen</span></button>
			<button class="shell-setting" type="button" data-shell-setting="apps-code" data-os-icon="code"><span>Apps Code</span></button>
		</div>
	</aside>
	<div id="shell-command-palette" hidden role="dialog" aria-modal="true" aria-label="Command palette">
		<div class="shell-command-card">
			<label class="shell-command-search" data-os-icon="search">
				<span class="g-sr-only">Search platform apps and actions</span>
				<input id="shell-command-input" type="search" autocomplete="off" placeholder="Search apps, files, runtime, actions…" aria-controls="shell-command-results">
			</label>
			<div id="shell-command-results" role="listbox" aria-label="Command results"></div>
		</div>
	</div>
	<div id="shell-live-region" class="shell-live-region" aria-live="polite" aria-atomic="true"></div>
	<script type="module" src="./script.js?v=revelation-8"></script>
</body>
</html>
