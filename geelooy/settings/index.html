Boruch Hashem

Social sweep (2026-11-09): /settings/ was a bare 404 — no settings
directory existed, even though people naturally type the address.
Awtsmoos keeps settings in two real places and has no single global
settings page, so this page names both instead of guessing a redirect:
account and alias settings live on your profile, and each Heichel's
community settings live on that Heichel's settings page.
-->
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Settings — Awtsmoos</title>
</head>
<body>
	<main>
		<h1>Settings</h1>
		<p>Awtsmoos keeps settings where they belong:</p>
		<ul>
			<li><a href="/profile/">Your profile</a> — account and alias settings.</li>
			<li><a href="/heichelos/">Heichelos</a> — open a Heichel to reach its community settings.</li>
		</ul>
	</main>
</body>
</html>
