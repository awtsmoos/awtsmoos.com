
<!-- B"H -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Merkava Eternal VM // Console</title>
    <link rel="stylesheet" href="merkava-console.css">
</head>
<body>
<header>
    <div class="logo">Merkava // Eternal</div>
    <div id="vm-status" style="font-size: 0.8rem; color: var(--accent-teal); letter-spacing: 2px;">READY</div>
</header>

<div class="main">
    <div class="panel">
        <div class="panel-header">Orchestrations</div>
        <div class="test-list" id="test-list"></div>
    </div>
    
    <div class="panel">
        <div class="panel-header">Source Code // Divine Logic</div>
        <textarea id="editor" spellcheck="false" placeholder="// B&quot;H - Enter the light..."></textarea>
    </div>
    
    <div class="panel">
        <div class="panel-header">Monitor // Emanations</div>
        <div id="output"></div>
        <div class="panel-header">Visual Projection</div>
        <div id="canvas-container">
            <canvas id="vm-canvas" width="400" height="300"></canvas>
        </div>
    </div>
</div>

<div class="controls">
    <button id="ignite-btn" onclick="ignite()">IGNITE ENGINE</button>
    <button onclick="clearMonitor()">WIPE MONITOR</button>
    
    <div style="margin-left: auto; display: flex; gap: 15px;">
        <div class="stat-badge">RAM: <b id="stat-ram">0</b> objects</div>
        <div class="stat-badge">THREADS: <b id="stat-threads">0</b></div>
    </div>
</div>

<script src="merkava-sdk.js"></script>
<script src="tests.js"></script>

<script>
/**
 * B"H
 * The Console Controller.
 */
let currentRun = null;
let activeTestKey = null;

const monitor = document.getElementById('output');
const igniteBtn = document.getElementById('ignite-btn');
const statusText = document.getElementById('vm-status');

function log(msg, type = 'log-vm') {
    const line = document.createElement('div');
    line.className = 'log-line ' + type;
    line.innerText = typeof msg === 'string' ? msg : JSON.stringify(msg, (k,v) => typeof v === 'bigint' ? v.toString()+'n' : v);
    monitor.appendChild(line);
    monitor.scrollTop = monitor.scrollHeight;
}

function clearMonitor() { monitor.innerHTML = ''; }

async function initTests() {
    const list = document.getElementById('test-list');
    
    if (!window.MERKAVA_TESTS_REGISTRY) return;

    for (const key of window.MERKAVA_TESTS_REGISTRY) {
        try {
            await new Promise((res, rej) => {
                const s = document.createElement('script');
                s.src = `tests/${key}.js`;
                s.onload = res;
                s.onerror = rej;
                document.head.appendChild(s);
            });
        } catch(e) {}
    }

    Object.keys(window.MERKAVA_TESTS).forEach(key => {
        const test = window.MERKAVA_TESTS[key];
        const item = document.createElement('div');
        item.className = 'test-item';
        item.innerText = test.name || key.toUpperCase();
        item.onclick = () => selectTest(key);
        item.id = 'test-' + key;
        list.appendChild(item);
    });
    
    const first = Object.keys(window.MERKAVA_TESTS)[0];
    if (first) selectTest(first);
}

function selectTest(key) {
    if (activeTestKey) {
        const old = document.getElementById('test-' + activeTestKey);
        if (old) old.classList.remove('active');
    }
    activeTestKey = key;
    const item = document.getElementById('test-' + key);
    if (item) item.classList.add('active');
    
    const test = window.MERKAVA_TESTS[key];
    document.getElementById('editor').value = test.orchestrator || '';
}

async function ignite() {
    if (currentRun) currentRun.stop();

    igniteBtn.disabled = true;
    statusText.innerText = "IGNITING...";
    clearMonitor();
    log("B\"H - Starting Divine Execution...", "log-sys");

    const container = document.getElementById('canvas-container');
    const oldCvs = document.getElementById('vm-canvas');
    const newCvs = document.createElement('canvas');
    newCvs.id = 'vm-canvas';
    newCvs.width = 400;
    newCvs.height = 300;
    container.replaceChild(newCvs, oldCvs);

    try {
        await window.Merkava.init();
        const test = window.MERKAVA_TESTS[activeTestKey];
        if (!test) throw new Error("No test selected.");

        const tools = {
            canvas: newCvs,
            log: (m, ...args) => log(args.length ? m + " " + args.join(" ") : m, "log-vm"),
            sysLog: (m) => log(m, "log-sys")
        };

        currentRun = await test.run(window.Merkava, tools);
        statusText.innerText = "RUNNING";
        
        const result = await currentRun.done;
        statusText.innerText = result.status;
        log("Execution State: " + result.status, "log-sys");
    } catch(e) {
        log("Shevirah (Fatal): " + (e.message || e), "log-err");
        statusText.innerText = "ERROR";
    } finally {
        igniteBtn.disabled = false;
    }
}

window.onload = initTests;
</script>
</body>
</html>
