<!-- B"H -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Merkava Eternal VM</title>
    <style>
        :root { --bg-dark: #0b0c10; --accent-teal: #45a29e; --text-main: #c5c6c7; }
        body { background: var(--bg-dark); color: var(--text-main); font-family: monospace; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        header { padding: 10px; border-bottom: 2px solid var(--accent-teal); display: flex; justify-content: space-between; }
        .main { display: grid; grid-template-columns: 1fr 1fr; height: 100%; gap: 1px; background: #333; }
        .panel { background: var(--bg-dark); padding: 10px; display: flex; flex-direction: column; }
        textarea { flex: 1; background: #111; color: #fff; border: 1px solid #444; resize: none; }
        #output { flex: 1; overflow-y: auto; white-space: pre-wrap; font-size: 13px; }
        .controls { padding: 10px; display: flex; gap: 10px; }
        select { background: #000; color: var(--accent-teal); border: 1px solid #444; padding: 5px; }
        canvas { border: 1px solid #444; margin-top: 10px; background: #000; display: none; }
    </style>
</head>
<body>
<header>
    <h1>Merkava VM</h1>
    <select id="test-select" onchange="loadTest()">
        <option value="intro">1. Intro (Sefer Yetzirah)</option>
        <option value="canvas">2. Canvas 2D (Sacred Geometry)</option>
        <option value="webgl">3. WebGL (Void Render)</option>
        <option value="workers">4. Workers (Parallel Emanation)</option>
        <option value="atomics">5. Atomics (Shared Memory)</option>
        <option value="modules">6. Imports/Exports</option>
        <option value="scripts">7. ImportScripts (Dynamic)</option>
    </select>
</header>

<div class="main">
    <div class="panel">
        <textarea id="editor"></textarea>
    </div>
    <div class="panel">
        <div id="output"></div>
        <canvas id="vm-canvas" width="300" height="200"></canvas>
    </div>
</div>

<div class="controls">
    <button onclick="runCode()">RUN</button>
    <button onclick="clearOut()">CLEAR</button>
</div>

<script src="merkava-sdk.js"></script>
<script>
const TESTS = {
    intro: `// B"H - Sefer Yetzirah Logic
let nodes = [{v:1}, {v:2}, {v:6}];
let light = 0;
let i = 0;
while(i < nodes.length) {
  let n = nodes[i];
  if(n.v % 2 == 0) light = light + n.v * 10;
  else light = light + n.v;
  syscall(0, "Node:", n.v, "Light:", light);
  i++;
}`,
    canvas: `// B"H - Sacred Geometry (Canvas)
// 1. Get Context
let cvs = document.getElementById('vm-canvas');
let ctx = cvs.getContext('2d');
syscall(0, "Context Acquired:", ctx);

// 2. Clear & Background
ctx.fillStyle = '#000000';
ctx.fillRect(0, 0, 300, 200);

// 3. Draw Red Filled Circles (Sefirot)
ctx.fillStyle = '#FF0000'; // Bright Red
let x = 50;

while(x < 250) {
  syscall(0, "Drawing at X:", x);
  ctx.beginPath();
  ctx.arc(x, 100, 20, 0, 6.28);
  ctx.fill(); // Fill is easier to see than stroke
  x = x + 50;
}
syscall(0, "Canvas Painted.");`,
    webgl: `// B"H - WebGL Void
let cvs = document.getElementById('vm-canvas');
let gl = cvs.getContext('webgl');

if (!gl) syscall(0, "WebGL not supported");
else {
  gl.clearColor(0.2, 0.0, 0.4, 1.0); // Purple Void
  gl.clear(gl.COLOR_BUFFER_BIT);
  syscall(0, "WebGL Buffer Cleared.");
}`,
    workers: `// B"H - Worker Simulation
syscall(0, "Spawning Worker...");

// In a real environment, this would spawn a thread.
// Here we verify the API structure.
if (typeof Worker !== 'undefined') {
  syscall(0, "Worker API exists.");
  let w = new Worker('worker.js');
  w.postMessage({cmd: 'ignite'});
} else {
  syscall(0, "Worker API missing.");
}`,
    atomics: `// B"H - Atomics
let sab = new SharedArrayBuffer(1024);
let int32 = new Int32Array(sab);

// Atomic Operation
Atomics.add(int32, 0, 10);
let res = Atomics.load(int32, 0);

syscall(0, "Atomic Result (Should be 10):", res);`,
    modules: `// B"H - Modules
// Testing Export Syntax (Mocked)
export const ALEPH = 1;
export function say() { return "Light"; }

import { BET } from './other.js';
syscall(0, "Module parsed successfully.");`,
    scripts: `// B"H - ImportScripts
// Dynamic loading
try {
  importScripts('lib.js');
  syscall(0, "Scripts imported.");
} catch(e) {
  syscall(0, "Import failed (Expected in simulation).");
}`
};

function loadTest() {
    const key = document.getElementById('test-select').value;
    document.getElementById('editor').value = TESTS[key];
    document.getElementById('vm-canvas').style.display = (key === 'canvas' || key === 'webgl') ? 'block' : 'none';
}

function clearOut() { document.getElementById('output').innerHTML = ''; }

async function runCode() {
    clearOut();
    const src = document.getElementById('editor').value;
    const output = document.getElementById('output');
    const log = (...args) => output.innerHTML += args.join(' ') + '\n';
    
    // Auto-clear canvas in DOM to ensure fresh paint
    const cvs = document.getElementById('vm-canvas');
    if (cvs.offsetParent !== null) {
        cvs.width = cvs.width; // Reset canvas
    }
    
    try {
        await window.Merkava.run(src, {
            context: { 
                document, window, console, 
                SharedArrayBuffer: window.SharedArrayBuffer,
                Atomics: window.Atomics
            },
            hostAPI: { 0: log }
        });
    } catch(e) {
        log("Error:", e.message);
    }
}

// Init
loadTest();
</script>
</body>
</html>
