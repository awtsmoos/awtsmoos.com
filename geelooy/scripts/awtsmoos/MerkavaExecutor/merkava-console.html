<!-- B"H -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merkava VM Console</title>
    <style>
        :root {
            --bg-dark: #0b0c10;
            --bg-panel: #1f2833;
            --text-main: #c5c6c7;
            --accent-cyan: #66fcf1;
            --accent-teal: #45a29e;
            --font-mono: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: var(--font-mono);
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        header {
            background-color: var(--bg-panel);
            padding: 15px;
            border-bottom: 2px solid var(--accent-teal);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 { margin: 0; font-size: 1.5rem; color: var(--accent-cyan); text-shadow: 0 0 5px var(--accent-cyan); }
        
        .status-indicator {
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.8rem;
            background: #333;
            color: #888;
        }
        .status-running { background: var(--accent-teal); color: #000; }
        .status-paused { background: #ffcc00; color: #000; }
        .status-error { background: #ff4444; color: #fff; }

        .main-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 2fr 1fr;
            height: 100%;
            gap: 1px;
            background-color: var(--accent-teal);
        }

        .panel {
            background-color: var(--bg-dark);
            padding: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-header {
            color: var(--accent-teal);
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        /* EDITOR */
        #editor {
            flex: 1;
            background: #111;
            color: #fff;
            border: 1px solid #333;
            padding: 10px;
            font-family: inherit;
            resize: none;
            font-size: 14px;
            line-height: 1.4;
        }

        /* OUTPUT */
        #output {
            flex: 1;
            overflow-y: auto;
            font-size: 13px;
            white-space: pre-wrap;
        }
        .log-line { border-bottom: 1px solid #222; padding: 2px 0; }
        .log-sys { color: #888; font-style: italic; }
        .log-out { color: var(--accent-cyan); }
        .log-err { color: #ff6b6b; }

        /* CONTROLS */
        .control-bar {
            grid-column: 1 / -1;
            background-color: var(--bg-panel);
            padding: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        button {
            background: var(--accent-teal);
            color: #000;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            font-family: inherit;
            text-transform: uppercase;
        }
        button:hover { background: var(--accent-cyan); }
        button:disabled { background: #444; color: #888; cursor: not-allowed; }

        /* DEBUG CONSOLE */
        .debug-panel {
            grid-column: 1 / -1;
            border-top: 2px solid var(--accent-teal);
        }
        
        #debug-input-line {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }
        
        #debug-input {
            flex: 1;
            background: #000;
            border: 1px solid var(--accent-teal);
            color: var(--accent-cyan);
            padding: 8px;
            font-family: inherit;
        }

    </style>
</head>
<body>

<header>
    <h1>B"H Merkava Eternal VM</h1>
    <div id="vm-status" class="status-indicator">OFFLINE</div>
</header>

<div class="main-layout">
    <!-- CODE EDITOR -->
    <div class="panel">
        <div class="panel-header">Source Code</div>
        <textarea id="editor" spellcheck="false">
// B"H - Simple Test Script

// 1. Use Global Scope
let counter = 0;

// 2. Function Definition
function increment(amount) {
  counter = counter + amount;
  return counter;
}

// 3. Loop and System Calls
while (counter < 50) {
  let val = increment(10);
  
  // SYSCALL 0 is mapped to console.log
  syscall(0, "Current Value:", val);
}

// 4. Return final result
syscall(0, "Done!");
counter;
        </textarea>
    </div>

    <!-- LIVE OUTPUT -->
    <div class="panel">
        <div class="panel-header">
            <span>VM Output</span>
            <button onclick="clearOutput()" style="font-size:0.7rem; padding:2px 5px;">Clear</button>
        </div>
        <div id="output"></div>
    </div>

    <!-- DEBUG CONSOLE -->
    <div class="panel debug-panel">
        <div class="panel-header">Debug Commander</div>
        <div id="debug-output" style="flex:1; overflow-y:auto; color:#ccc; font-size:12px; margin-bottom:5px;">
            Welcome. Type 'help' for commands.
        </div>
        <div id="debug-input-line">
            <span style="color:var(--accent-cyan); padding-top:8px;">></span>
            <input type="text" id="debug-input" placeholder="Enter command..." disabled>
        </div>
    </div>
</div>

<div class="control-bar">
    <button id="btn-run" onclick="runCode()">RUN (Compile & Exec)</button>
    <button id="btn-pause" onclick="pauseVM()" disabled>Pause</button>
    <button id="btn-resume" onclick="resumeVM()" disabled>Resume</button>
    <button id="btn-step" onclick="stepVM()" disabled>Step</button>
    <div style="margin-left:auto; font-size:0.8rem;">
        RAM Usage: <span id="ram-usage">0</span> objs
    </div>
</div>

<!-- Load the SDK -->
<script src="merkava-sdk.js"></script>

<script>
    // UI References
    const outputDiv = document.getElementById('output');
    const debugOutDiv = document.getElementById('debug-output');
    const debugInput = document.getElementById('debug-input');
    const statusBadge = document.getElementById('vm-status');
    const ramBadge = document.getElementById('ram-usage');
    
    // Active Runtime State
    let activeContext = null; 
    let updateTimer = null;

    // --- SYSTEM LOGGING ---
    function log(msg, type = 'log-out') {
        const div = document.createElement('div');
        div.className = `log-line ${type}`;
        div.textContent = typeof msg === 'object' ? JSON.stringify(msg) : msg;
        outputDiv.appendChild(div);
        outputDiv.scrollTop = outputDiv.scrollHeight;
    }

    function debugLog(msg) {
        const div = document.createElement('div');
        div.textContent = msg;
        debugOutDiv.appendChild(div);
        debugOutDiv.scrollTop = debugOutDiv.scrollHeight;
    }

    function clearOutput() {
        outputDiv.innerHTML = '';
    }

    function setStatus(status) {
        statusBadge.className = 'status-indicator';
        statusBadge.textContent = status;
        if (status === 'RUNNING') statusBadge.classList.add('status-running');
        if (status === 'PAUSED') statusBadge.classList.add('status-paused');
        if (status === 'CRASHED') statusBadge.classList.add('status-error');
        
        // Toggle Buttons
        const isRunning = status === 'RUNNING';
        document.getElementById('btn-pause').disabled = !isRunning;
        document.getElementById('btn-resume').disabled = isRunning;
        document.getElementById('btn-step').disabled = isRunning;
        document.getElementById('debug-input').disabled = false; // Always allow debug interaction if context exists
    }

    // --- RUN HANDLER ---
    async function runCode() {
        const source = document.getElementById('editor').value;
        
        log("--- B\"H Starting New Process ---", 'log-sys');
        setStatus("INITIALIZING");

        // Cancel previous run checks
        if (updateTimer) clearInterval(updateTimer);

        try {
            // Initialize SDK
            if (!window.Merkava) throw new Error("SDK not loaded");
            
            activeContext = await window.Merkava.run(source, {
                debug: true,
                ramLimit: 500,
                // B"H - PASS THE CONTEXT HERE
                context: {
                    document: document,
                    window: window,
                    console: console, 
                    // B"H - Wrapper to debug the Fetch call
                    fetch: window.fetch.bind(window),
                    // B"H - Give the VM the Laws of Physics
                    
                },
                // B"H - HANDLE IMPORTS
                importResolver: async (specifier) => {
                    log(`[Import] Loading ${specifier}...`);
                    return { env: "production" }; // Mock module return
                },
                // B"H - HANDLE EXPORTS
                exportHandler: (name, value) => {
                    log(`[Export] ${name} = ${value}`, 'log-sys');
                },
                hostAPI: {
                    0: (...args) => log(args.join(' '))
                }
            });

            // Setup UI Update Loop (Monitor RAM and Status)
            updateTimer = setInterval(() => {
                if (activeContext && activeContext.memory) {
                    ramBadge.textContent = activeContext.memory.ram.size;
                }
            }, 500);

            setStatus("RUNNING");

            // Wait for completion
            activeContext.done.then(async (result) => { // B"H - Make this async
                setStatus("SAVING...");
                
                // B"H - THE CRITICAL FIX:
                // Flush all dirty memory from RAM to IndexedDB to prevent data loss.
                await activeContext.memory.flush();

                setStatus("COMPLETED");
                log(`Process Finished: ${result.status}`, 'log-sys');
                clearInterval(updateTimer);
            }).catch(err => {
                setStatus("CRASHED");
                log(`Runtime Error: ${err.message || err}`, 'log-err');
                console.error(err);
            });

        } catch (e) {
            setStatus("ERROR");
            log(`Startup Failed: ${e.message}`, 'log-err');
        }
    }

    // --- DEBUG CONTROL ---
    function pauseVM() {
        if (activeContext && activeContext.debugger) {
            activeContext.debugger.pause();
            setStatus("PAUSED");
            debugLog("VM Paused by user.");
        }
    }

    function resumeVM() {
        if (activeContext && activeContext.debugger) {
            activeContext.debugger.resume();
            setStatus("RUNNING");
            debugLog("VM Resumed.");
        }
    }

    function stepVM() {
        // Note: Our simple run loop in SDK might not support single-step granularity 
        // unless we implemented the Promise pause logic in the SDK loop. 
        // For V1, step logic is complex to wire to the loop. 
        // Assuming SDK loop checks 'PAUSED_BY_DEBUGGER' and waits?
        debugLog("Step not fully implemented in V1 Loop.");
    }

    // --- DEBUG CONSOLE CLI ---
    debugInput.addEventListener('keydown', async (e) => {
        if (e.key === 'Enter') {
            const cmd = debugInput.value.trim();
            debugInput.value = '';
            if (!cmd) return;

            debugLog(`> ${cmd}`);
            if (!activeContext) {
                debugLog("Error: No active VM context.");
                return;
            }

            const args = cmd.split(' ');
            const action = args[0].toLowerCase();

            try {
                switch (action) {
                    case 'help':
                        debugLog("Commands: threads, inspect [id], scan [val], snap (snapshot)");
                        break;

                    case 'threads':
                        const threads = activeContext.vm.threads;
                        debugLog(`Active Threads: ${threads.length}`);
                        threads.forEach(t => {
                            debugLog(`#${t.id} - Status: ${t.status} IP:${t.ip}`);
                        });
                        break;

                    case 'inspect':
                        // Inspect Thread #1 by default
                        const tid = parseInt(args[1] || "1");
                        const info = activeContext.debugger.inspectThread(tid);
                        debugLog(JSON.stringify(info, null, 2));
                        break;

                    case 'scan':
                        // Scan for a numeric value
                        const val = parseFloat(args[1]);
                        if (isNaN(val)) { debugLog("Please provide a number."); break; }
                        
                        debugLog(`Scanning RAM and Disk for value: ${val}...`);
                        const results = await activeContext.debugger.scanMemory(obj => {
                            // Basic heuristic: check if object has a value property matching
                            // or is an array containing it.
                            return JSON.stringify(obj).includes(String(val));
                        });
                        
                        debugLog(`Found ${results.length} matches.`);
                        if (results.length > 0) {
                            console.log("Scan Results:", results); // Detailed log to browser console
                            debugLog("Details logged to Browser DevTools Console.");
                        }
                        break;
                        
                    case 'snap':
                        debugLog("Creating Checkpoint...");
                        const snap = await activeContext.debugger.createCheckpoint();
                        console.log(snap);
                        debugLog(`Snapshot created (${snap.length} bytes). Logged to DevTools.`);
                        break;

                    default:
                        debugLog("Unknown command.");
                }
            } catch (err) {
                debugLog(`Cmd Error: ${err.message}`);
            }
        }
    });

</script>

</body>
</html>
