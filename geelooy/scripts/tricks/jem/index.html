<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awtsmoos Jemizier</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="awtsmoospage">
        <!-- Sidebar: Years -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>Jemizier</h3>
                <small>Audio Browser</small>
            </div>
            <div class="year-list" id="yearList">
                <!-- Years injected via JS -->
            </div>
        </div>

        <!-- Main Content -->
        <div class="main">
            <div class="content-header">
                <h2 id="currentViewTitle">Select a Year</h2>
                <div id="statusIndicator"></div>
            </div>

            <!-- Events List -->
            <div class="events-container" id="eventsContainer">
                <div class="placeholder-text">
                    <p>Select a year from the sidebar 5708-5752.</p>
                </div>
            </div>

            <!-- Console Output -->
            <div class="console-log" id="consoleOutput">
                <div>> System Initialized... B"H</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
