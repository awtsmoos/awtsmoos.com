<!-- B"H -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awtsmoos Jemizier Browser</title>
    <style>
        :root {
            --bg-dark: #0f1115;
            --bg-panel: #181b21;
            --primary: #6d28d9;
            --primary-hover: #5b21b6;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border: #2d3748;
            --success: #10b981;
            --error: #ef4444;
        }

        body, html {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100%;
            overflow: hidden;
        }

        /* Main Containers */
        .awtsmoospage {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        .sidebar {
            width: 250px;
            background-color: var(--bg-panel);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Sidebar Styling */
        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border);
            text-align: center;
        }
        
        .sidebar-header h3 { margin: 0; color: var(--primary); }
        .sidebar-header small { color: var(--text-muted); font-size: 0.8em; }

        .year-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .year-btn {
            display: block;
            width: 100%;
            padding: 10px;
            margin-bottom: 5px;
            background: transparent;
            border: 1px solid transparent;
            color: var(--text-muted);
            text-align: left;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .year-btn:hover {
            background-color: rgba(255,255,255,0.05);
            color: var(--text-main);
        }

        .year-btn.active {
            background-color: var(--primary);
            color: white;
        }

        /* Content Area Styling */
        .content-header {
            padding: 20px;
            background-color: var(--bg-panel);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .events-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
        }

        /* Event Cards */
        .event-card {
            background-color: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 15px;
            transition: transform 0.2s;
        }

        .event-card:hover {
            border-color: var(--primary);
        }

        .event-title {
            font-size: 1.1em;
            font-weight: bold;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
        }

        .event-date {
            color: var(--text-muted);
            font-size: 0.9em;
            margin-bottom: 15px;
        }

        .track-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 10px;
            border-top: 1px solid var(--border);
            padding-top: 10px;
        }

        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.2);
            padding: 8px 12px;
            border-radius: 4px;
        }

        .track-info {
            font-size: 0.9em;
        }

        /* Buttons */
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85em;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .btn-download {
            background-color: var(--primary);
            color: white;
        }

        .btn-download:hover { background-color: var(--primary-hover); }
        .btn-download:disabled { background-color: var(--text-muted); cursor: not-allowed; opacity: 0.5; }

        /* Logger */
        .console-log {
            height: 150px;
            background-color: #000;
            color: #33ff00;
            font-family: monospace;
            padding: 10px;
            overflow-y: auto;
            border-top: 1px solid var(--border);
            font-size: 12px;
        }

        /* Loader */
        .spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div class="awtsmoospage">
        <!-- Sidebar: Years -->
        <div class="sidebar">
            <div class="sidebar-header">
                <h3>Jemizier</h3>
                <small>Audio Browser & Downloader</small>
            </div>
            <div class="year-list" id="yearList">
                <!-- Years injected here -->
            </div>
        </div>

        <!-- Main Content -->
        <div class="main">
            <div class="content-header">
                <h2 id="currentViewTitle">Select a Year</h2>
                <div id="statusIndicator"></div>
            </div>

            <div class="events-container" id="eventsContainer">
                <div style="text-align: center; color: var(--text-muted); margin-top: 50px;">
                    <p>Select a year from the sidebar to begin.</p>
                </div>
            </div>

            <!-- Console Log Output -->
            <div class="console-log" id="consoleOutput">
                <div>> System Initialized... B"H</div>
            </div>
        </div>
    </div>

    <script>
        // B"H
        // Client-side Logic adapted from the Jemizier Script

        const DOM = {
            years: document.getElementById('yearList'),
            container: document.getElementById('eventsContainer'),
            title: document.getElementById('currentViewTitle'),
            log: document.getElementById('consoleOutput')
        };

        const API_BASE = "https://5qlaecnhel.execute-api.us-east-1.amazonaws.com/prod/ashreinu/api/v1";

        // --- Logging Utility ---
        function log(msg, type='info') {
            const div = document.createElement('div');
            div.textContent = `> ${msg}`;
            if(type === 'error') div.style.color = 'var(--error)';
            if(type === 'success') div.style.color = 'var(--success)';
            DOM.log.appendChild(div);
            DOM.log.scrollTop = DOM.log.scrollHeight;
        }

        // --- Proxy Fetcher (The "Special API") ---
        async function awtsFetch(targetUrl, method = "GET", body = null) {
            try {
                const response = await fetch("/api/fetch", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        url: targetUrl,
                        method: method,
                        body: body,
                        // Mimic a browser to avoid some bot detection
                        headers: { "User-Agent": "Mozilla/5.0 AwtsmoosJem" }
                    })
                });

                const result = await response.json();

                if (result.error) {
                    if(result.status === 401) {
                        log("Error: You must be logged into Awtsmoos.com to use this tool.", "error");
                        alert("Please log in to Awtsmoos.com");
                    } else {
                        log(`Proxy Error: ${result.error}`, "error");
                    }
                    throw new Error(result.error);
                }
                return result;

            } catch (e) {
                log(`Network Error: ${e.message}`, "error");
                throw e;
            }
        }

        // --- Ashreinu API Wrappers (Using Proxy) ---
        async function getYearEvents(year) {
            log(`Fetching events for year ${year}...`);
            const url = `${API_BASE}/events?year=${year}&has=audio`;
            
            // Note: Ashreinu API returns JSON. Proxy returns { data: "base64" (maybe) or data: "json string" }
            const res = await awtsFetch(url);
            
            try {
                // If proxy returned text/json
                if (!res.isBinary && typeof res.data === 'string') {
                    return JSON.parse(res.data);
                }
                // If proxy auto-parsed it (unlikely in current implementation but good safeguard)
                return res.data;
            } catch(e) {
                log("Failed to parse year data", "error");
                return null;
            }
        }

        async function getEventData(eventId) {
            const url = `${API_BASE}/event/${eventId}`;
            const res = await awtsFetch(url);
            try {
                if (!res.isBinary && typeof res.data === 'string') {
                    return JSON.parse(res.data);
                }
                return res.data;
            } catch(e) {
                return null;
            }
        }

        // --- Audio Resolution Logic (From original script) ---
        // This figures out the exact AWS S3 link for the mp3/opus
        async function tryToGetRightAudioFile(eventData, index=0, type="aud") {
            let audios = eventData.audio_recordings;
            
            if(type == "sub") {
                const subs = eventData.sub_events;
                if(subs && subs.length) {
                    audios = subs.map(q => q.audio_recordings?.[0]).filter(Boolean);
                }
            }

            if(!audios || !audios.length) return { error: "No audio recordings found." };
            
            const cur = audios[index];
            if(!cur) return { error: "Audio index out of bounds." };

            const asset = cur?.assets?.[0];
            if(!asset) return { error: "No asset link." };

            const assetURI = asset.uri;
            const uri = new URL(assetURI);
            const extDot = uri.pathname.lastIndexOf(".");
            
            if(extDot < 0) return { error: "No extension found." };

            const assetDefaultFormat = asset.file_format;
            const mainPart = uri.pathname.substring(0, extDot);
            
            // Construct the clean URL (origin + path)
            const cleanUrl = uri.origin + mainPart + "." + assetDefaultFormat;

            return {
                url: cleanUrl,
                filename: cur.title || `Track-${index+1}`,
                format: assetDefaultFormat,
                meta: cur
            };
        }

        // --- UI Rendering ---

        function init() {
            // Render Years 5708 - 5752
            for (let y = 5708; y <= 5752; y++) {
                const btn = document.createElement('button');
                btn.className = 'year-btn';
                btn.textContent = `Year ${y}`;
                btn.onclick = () => loadYear(y, btn);
                DOM.years.appendChild(btn);
            }
        }

        async function loadYear(year, btnElement) {
            // UI Updates
            document.querySelectorAll('.year-btn').forEach(b => b.classList.remove('active'));
            btnElement.classList.add('active');
            DOM.title.textContent = `Events for ${year}`;
            DOM.container.innerHTML = '<div style="padding:20px;">Fetching Data... <div class="spinner"></div></div>';

            const data = await getYearEvents(year);
            DOM.container.innerHTML = '';

            if(!data || !data.events || data.events.length === 0) {
                DOM.container.innerHTML = '<div style="padding:20px;">No audio events found for this year.</div>';
                return;
            }

            // Render Events
            for (const event of data.events) {
                // Filter basic info first
                const card = document.createElement('div');
                card.className = 'event-card';
                card.innerHTML = `
                    <div class="event-title">
                        <span>${event.name_he || event.name_en || "Untitled Event"}</span>
                        <button class="btn btn-download" onclick="expandEvent('${event.id}', this)">
                            Load Tracks
                        </button>
                    </div>
                    <div class="event-date">
                        ${event.date_he || ""} | ${event.date_en || ""}
                    </div>
                    <div class="track-container"></div>
                `;
                DOM.container.appendChild(card);
            }
            log(`Loaded ${data.events.length} events.`);
        }

        async function expandEvent(eventId, btn) {
            const card = btn.closest('.event-card');
            const trackContainer = card.querySelector('.track-container');
            
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> Loading...';

            const fullData = await getEventData(eventId);
            
            if(!fullData) {
                btn.textContent = "Error";
                return;
            }

            // Determine structure (Sub events vs regular recordings)
            const list = document.createElement('div');
            list.className = 'track-list';

            // Logic to collect playable items
            let itemsToRender = [];

            // Case 1: Sub Events (Farbrengens often split into sichos)
            if(fullData.sub_events && fullData.sub_events.length) {
                for(let i=0; i<fullData.sub_events.length; i++) {
                    const info = await tryToGetRightAudioFile(fullData, i, "sub");
                    if(!info.error) itemsToRender.push(info);
                }
            } 
            // Case 2: Standard Recordings
            else if (fullData.audio_recordings) {
                for(let i=0; i<fullData.audio_recordings.length; i++) {
                    const info = await tryToGetRightAudioFile(fullData, i, "aud");
                    if(!info.error) itemsToRender.push(info);
                }
            }

            if(itemsToRender.length === 0) {
                trackContainer.innerHTML = '<div style="padding:10px; color:var(--text-muted)">No playable audio assets found.</div>';
                btn.remove();
                return;
            }

            itemsToRender.forEach(track => {
                const row = document.createElement('div');
                row.className = 'track-item';
                
                // Sanitize filename
                let safeName = (track.filename || "Audio").replace(/[^a-z0-9\u0590-\u05ff ]/gi, '_');

                row.innerHTML = `
                    <div class="track-info">
                        <strong>${safeName}</strong>
                        <span style="color:#666; font-size:0.8em">.${track.format}</span>
                    </div>
                    <button class="btn btn-download" onclick="downloadTrack('${track.url}', '${safeName}.${track.format}', this)">
                        Download
                    </button>
                `;
                list.appendChild(row);
            });

            trackContainer.innerHTML = '';
            trackContainer.appendChild(list);
            btn.style.display = 'none'; // Hide load button after loading
        }

        // --- The Core Downloader ---
        async function downloadTrack(url, filename, btn) {
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.innerHTML = '<div class="spinner"></div> Fetching...';
            
            log(`Starting download for: ${filename}`);

            try {
                // 1. Request Binary Data via Proxy
                const res = await awtsFetch(url, "GET");

                if(!res.isBinary || !res.data) {
                    throw new Error("Server returned non-binary data");
                }

                log(`Received ${res.usageInfo.mbUsed}MB. Processing Blob...`);

                // 2. Convert Base64 to Blob
                const byteCharacters = atob(res.data);
                const byteNumbers = new Array(byteCharacters.length);
                for (let i = 0; i < byteCharacters.length; i++) {
                    byteNumbers[i] = byteCharacters.charCodeAt(i);
                }
                const byteArray = new Uint8Array(byteNumbers);
                
                // Mime type detection
                let mime = res.headers['content-type'] || 'audio/mpeg';
                const blob = new Blob([byteArray], { type: mime });

                // 3. Trigger Download
                const blobUrl = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.style.display = 'none';
                a.href = blobUrl;
                a.download = filename;
                document.body.appendChild(a);
                a.click();
                
                // Cleanup
                window.URL.revokeObjectURL(blobUrl);
                setTimeout(() => document.body.removeChild(a), 100);
                
                log("Download started successfully.", "success");
                btn.textContent = "Done";
                btn.style.backgroundColor = "var(--success)";

            } catch(e) {
                log(`Download Failed: ${e.message}`, "error");
                btn.textContent = "Failed";
                btn.style.backgroundColor = "var(--error)";
                setTimeout(() => {
                    btn.disabled = false;
                    btn.textContent = originalText;
                    btn.style.backgroundColor = "";
                }, 3000);
            }
        }

        // Initialize App
        init();

    </script>
</body>
</html>
