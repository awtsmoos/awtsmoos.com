<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Awtsmoos Jemizier</title>
    <link rel="stylesheet" href="style.css">
    <!-- Icon set for slick UI -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>

    <div class="awtsmoospage">
        <!-- Mobile Overlay -->
        <div class="overlay" id="overlay"></div>

        <!-- Sidebar -->
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h3><i class="fas fa-music"></i> Jemizier</h3>
            </div>
            <div class="year-list" id="yearList">
                <!-- Years injected via JS -->
            </div>
        </div>

        <!-- Main Content -->
        <div class="main">
            <div class="content-header">
                <button class="mobile-toggle" id="menuToggle">
                    <i class="fas fa-bars"></i>
                </button>
                <h2 id="currentViewTitle">Select a Year</h2>
                <div style="width:24px"></div> <!-- Spacer for balance -->
            </div>

            <!-- Events List -->
            <div class="events-container" id="eventsContainer">
                <div class="placeholder-text">
                    <i class="fas fa-headphones-alt" style="font-size: 3rem; margin-bottom: 20px; color: var(--primary);"></i>
                    <p>Select a year from the menu.</p>
                </div>
            </div>

            <!-- Console Output -->
            <div class="console-log" id="consoleOutput">
                <div>> System Initialized... B"H</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
