<!-- B"H — Heichel ownership cockpit. IDs preserved for script.js. -->
<link rel="stylesheet" type="text/css" href="/style/social/heichelos/manage-alias-heichelos.css?v=social-os-002">
<main class="heichel-manage-page" aria-labelledby="h-header">
  <section class="heichel-manage-hero">
    <a id="bckb" class="heichel-back" href="/heichelos">← Back</a>
    <p class="heichel-kicker">World builder</p>
    <h1 id="h-header">Manage Heichel</h1>
    <p>Create, update, or retire a Heichel for the active alias. This cockpit preserves the existing social API form contract while making ownership feel deliberate.</p>
    <nav class="heichel-route-dock" aria-label="Connected Geelooy routes">
      <a href="/">Home</a><a href="/profile">Profile</a><a href="/heichelos">Heichelos</a><a href="/notifications">Alerts</a>
    </nav>
  </section>

  <section class="heichel-form-card" aria-label="Heichel details">
    <form id="heichel-form">
      <label for="heichel-name">Heichel name</label>
      <input type="text" id="heichel-name" name="heichel-name" autocomplete="off" required>

      <label for="heichel-description">Heichel description</label>
      <textarea id="heichel-description" name="heichel-description" rows="7" placeholder="What world is this Heichel revealing?"></textarea>

      <div class="optional-id">
        <label for="heichel-id">Custom Heichel ID</label>
        <input type="text" id="heichel-id" name="heichel-id" autocomplete="off" aria-describedby="id-validation heichel-id-help">
        <button class="tooltip" type="button" aria-describedby="heichel-id-help" aria-label="Explain custom Heichel ID">?</button>
        <div class="tooltiptext" id="heichel-id-help" role="tooltip">Optional. If left empty, the ID is generated from the Heichel name.</div>
      </div>

      <span id="id-validation" class="id-validation" aria-live="polite"></span>
      <div class="form-btns">
        <button type="submit">Save Heichel</button>
        <button class="delete hidden" id="delete" type="button">Delete</button>
      </div>
    </form>
  </section>
</main>
<script type="module" src="script.js"></script>
