<div class="typography-details hidden-details" id="typographyDetails" role="region" aria-label="Reader settings" aria-hidden="true">
	<div class="typography-content">
		<div class="settings-group scribe-lens-head">
			<div class="scribe-lens-title-row">
				<div class="control-label scribe-lens-title">Settings</div>
				<button type="button" id="scribeLensClose" class="scribe-lens-close" aria-label="Close settings">✕</button>
			</div>
		</div>
		<div class="settings-group">
			<div class="control-label">Text Scale</div>
			<div class="text-controls">
				<button type="button" class="font-adjust-btn" id="fontDecreaseBtn" aria-label="Decrease text size">−</button>
				<div class="font-size-display" aria-live="polite">Aa</div>
				<button type="button" class="font-adjust-btn" id="fontIncreaseBtn" aria-label="Increase text size">+</button>
			</div>
		</div>
		<div class="settings-group auto-scroll-settings">
			<div class="auto-scroll-heading">
				<div class="control-label">Auto Scroll</div>
				<output id="autoScrollStatus" data-auto-scroll-status>Off</output>
			</div>
			<button id="autoScrollSettingsToggle" class="auto-scroll-settings-toggle" type="button" data-auto-scroll-toggle aria-pressed="false">
				<span class="awtsmoos-auto-scroll-icon" data-auto-scroll-icon aria-hidden="true">↓</span>
				<span class="awtsmoos-auto-scroll-label" data-auto-scroll-label>Start</span>
				<span class="awtsmoos-auto-scroll-speed" data-auto-scroll-pace>0.35×</span>
			</button>
			<div class="speed-control-row">
				<span class="speed-word">Still</span>
				<input type="range" id="autoScrollSpeedRange" min="0.05" max="8" step="0.05" value="0.35" aria-label="Auto scroll speed" aria-describedby="autoScrollSpeedDisplay">
				<span class="speed-word">Fast</span>
			</div>
			<div class="speed-readout-row">
				<span>Speed</span>
				<output id="autoScrollSpeedDisplay" for="autoScrollSpeedRange">0.35× · Slow reading · 28 px/s</output>
			</div>
		</div>
		<div class="settings-group">
			<label class="control-label" for="themeSelector">Theme</label>
			<div class="theme-controls settings-group">
				<select id="themeSelector">
					<option value="light">Light</option>
					<option value="dark">Dark</option>
				</select>
			</div>
		</div>
	</div>
	<div class="reset-section">
		<button type="button" id="resetDefaultsBtn" class="danger-outline">Reset</button>
	</div>
</div>
