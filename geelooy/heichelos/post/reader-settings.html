<!-- B"H
Boruch Hashem
Blessed is He
The Awtsmoos gives the reader a few clear vessels; Awtsmoos.com keeps the text first and hides secondary appearance craft until it is wanted.
-->
<div class="settings-content scribe-lens-simple">
	<section class="setting-item focus-mode-setting">
		<h3>Scribe's Lens</h3>
		<label class="settings-toggle-row" for="focusModeToggle">
			<span>Focus Mode</span>
			<input type="checkbox" id="focusModeToggle" class="awtsmoos-toggle font-selector" aria-label="Focus mode">
			<span class="awtsmoos-toggle-label control-label" aria-hidden="true"></span>
		</label>
	</section>

	<section class="setting-item text-size-setting">
		<h3>Text Size</h3>
		<div class="text-size-controls">
			<button id="decreaseFontSize" type="button" aria-label="Decrease text size">−</button>
			<output id="fontSizeDisplay" aria-live="polite">68px</output>
			<button id="increaseFontSize" type="button" aria-label="Increase text size">+</button>
		</div>
	</section>

	<section class="setting-item auto-scroll-settings" data-auto-scroll-control="true">
		<h3>Auto Scroll</h3>
		<button id="autoScrollToggle" type="button" data-auto-scroll-control="true" data-auto-scroll-toggle="true" aria-pressed="false">
			<span class="auto-scroll-toggle-icon" data-auto-scroll-icon aria-hidden="true">↓</span>
			<span class="auto-scroll-toggle-label" data-auto-scroll-label>Start</span>
			<span class="auto-scroll-toggle-speed" data-auto-scroll-pace></span>
		</button>
	</section>

	<details class="settings-advanced appearance-settings">
		<summary>Appearance</summary>
		<section class="setting-item">
			<label class="control-label" for="fontSelector">Font</label>
			<select id="fontSelector" class="font-selector">
				<option value="default">Default</option>
				<option value="serif">Serif</option>
				<option value="sans-serif">Sans Serif</option>
				<option value="monospace">Monospace</option>
			</select>
		</section>
		<section class="setting-item">
			<label class="control-label" for="themeSelector">Theme</label>
			<select id="themeSelector">
				<option value="default">Default</option>
				<option value="dark">Dark</option>
				<option value="sepia">Sepia</option>
				<option value="light">Light</option>
			</select>
		</section>
		<section class="setting-item color-customizer">
			<h3>Colors</h3>
			<label>Text <input id="textColorPicker" type="color"></label>
			<label>Background <input id="backgroundColorPicker" type="color"></label>
			<label>Accent <input id="accentColorPicker" type="color"></label>
		</section>
		<button id="resetSettings" type="button" class="reset-settings">Reset appearance</button>
	</details>
</div>
