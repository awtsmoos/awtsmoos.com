<!--B"H
Boruch Hashem
Blessed be He
Daily Chitas beautiful loading overlay: a Jewish-art-inspired radial medallion.
Purely visual — server-rendered Torah text sits beneath it (SEO-safe, no-JS
readable). Fades on reader-ready; CSS-only fallback fades it if JS never runs.
-->
<div id="chitas-loader-overlay" class="chitas-loader-overlay" data-js="false" role="status" aria-label="Loading daily study">
  <div class="chitas-loader-medallion" aria-hidden="true">
    <svg viewBox="0 0 200 200">
      <defs>
        <path id="chitas-orbit-path" d="M 100,100 m -88,0 a 88,88 0 1,1 176,0 a 88,88 0 1,1 -176,0" fill="none"/>
      </defs>
      <g class="chitas-loader-orbit-group">
        <text class="chitas-loader-orbit-text">
          <textPath href="#chitas-orbit-path" startOffset="0">א ב ג ד ה ו ז ח ט י כ ל מ נ ס ע פ צ ק ר ש ת &#10022;</textPath>
        </text>
      </g>
      <circle class="chitas-loader-ring-mid" cx="100" cy="100" r="72"/>
      <g class="chitas-loader-star">
        <polygon class="tri-up" points="100,52 140,122 60,122"/>
        <polygon class="tri-down" points="100,148 60,78 140,78"/>
      </g>
      <circle class="chitas-loader-track" cx="100" cy="100" r="66"/>
      <circle class="chitas-loader-bar" cx="100" cy="100" r="66"/>
      <text class="chitas-loader-center-letter" x="100" y="117" text-anchor="middle">&#1488;</text>
    </svg>
  </div>
  <p class="chitas-loader-he" dir="rtl" lang="he">מכין את לימודך היומי</p>
  <p class="chitas-loader-en">Preparing your daily study&hellip;</p>
</div>
