	<link rel="stylesheet" href="/heichelos/heichel/submit/style.css?v=create-005">

<body class="submit-shell" data-geelooy-create-page>
	<a class="g-sr-only" href="#createTitle">Skip to composer</a>
	<main class="submit-page geelooy-content-region" aria-labelledby="createTitle">
		<section class="submit-hero compact-card">
			<p class="eyebrow g-kicker">Composer</p>
			<h1 id="createTitle">What do you want to share?</h1>
			<p>Post quickly to your default Heichel, or choose a destination when the thought belongs somewhere specific.</p>
			<div id="targetSummary" class="target-summary" role="status">Finding your posting home…</div>
			<a id="backBtn" class="text-link" href="/heichelos">Back to browsing</a>
		</section>
		<section class="composer-card compact-card geelooy-composer" aria-label="Post composer">
			<input id="postId" type="hidden">
			<input id="contentType" type="hidden" value="post">
			<label class="field-label" for="aliasId">Posting as</label>
			<input id="aliasId" class="text-input" autocomplete="username" placeholder="Your alias loads automatically when available">
			<label class="field-label" for="title">Headline</label>
			<input id="title" class="text-input" autocomplete="off" placeholder="Give it a clear title">
			<div class="kind-pills" role="group" aria-label="Content type">
				<button class="kind-pill active" data-kind="post" type="button">Post</button>
				<button class="kind-pill" data-kind="question" type="button">Question</button>
			</div>
			<div class="editor-wrapper main-editor-wrapper">
				<div id="mainContentEditor" class="content-editor" contenteditable="true" role="textbox" aria-label="Post body" aria-multiline="true" data-placeholder="Write it here. Add media or sections only if the post needs them."></div>
				<div id="mainContentToolbarContainer" class="toolbar-slot"></div>
			</div>
			<div class="composer-actions" aria-label="Composer tools">
				<button id="toggleMainContentToolbarBtn" class="soft-btn" type="button">Format</button>
				<button id="uploadImageMainBtn" class="soft-btn" type="button">Attach</button>
				<button id="toggleMainContentHtmlViewBtn" class="soft-btn" type="button">HTML</button>
			</div>
		</section>
		<details class="simple-advanced-drawer compact-card">
			<summary>Advanced: destination, series, verses</summary>
			<label class="field-label" for="targetHeichelId">Specific Heichel ID</label>
			<input id="targetHeichelId" class="text-input" placeholder="Optional destination">
			<label class="field-label" for="newHeichelName">Create a new Heichel while posting</label>
			<input id="newHeichelName" class="text-input" placeholder="Optional new space name">
			<label class="field-label" for="targetSeriesId">Series ID</label>
			<input id="targetSeriesId" class="text-input" placeholder="root">
			<label class="field-label" for="bulkText">Long text to split into verses</label>
			<textarea id="bulkText" class="bulk-text" placeholder="Optional: paste long text and generate verses"></textarea>
			<label class="field-label" for="mainSectionDelimiters">Verse delimiters</label>
			<input id="mainSectionDelimiters" class="text-input" placeholder="Custom delimiters, comma separated">
			<div class="composer-actions">
				<button id="generateSectionsFromBulk" class="soft-btn" type="button">Split paste</button>
				<button id="generateSectionsFromMainEditor" class="soft-btn" type="button">Split body</button>
				<button id="addSection" class="soft-btn" type="button">Add verse</button>
			</div>
			<div id="sectionsArea" class="sections-area"></div>
		</details>
		<section class="status-card compact-card" aria-live="polite"><p id="submitStatusMessage">Ready.</p></section>
	</main>
	<button id="submitPost" class="publish-button" type="button">Post now</button>
