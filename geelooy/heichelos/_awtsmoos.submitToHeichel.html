<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create | Geelooy</title>
  <link rel="stylesheet" href="/heichelos/heichel/submit/style.css?v=simple-002" />
</head>
<body class="submit-shell">
  <?Awtsmoos return await getT("nav/header.html") ?>
  <main class="submit-page" aria-labelledby="createTitle">
    <section class="submit-hero compact-card">
      <p class="eyebrow">Create</p>
      <h1 id="createTitle">Post now</h1>
      <p>Write, attach, and publish. If you do not pick a heichel, Geelooy uses your own default posting home.</p>
      <div id="targetSummary" class="target-summary">Resolving alias and default destination...</div>
      <a id="backBtn" class="text-link" href="/heichelos">Back</a>
    </section>
    <section class="composer-card compact-card">
      <input type="hidden" id="postId" />
      <input type="hidden" id="contentType" value="post" />
      <label class="field-label" for="title">Title</label>
      <input id="title" class="text-input" autocomplete="off" placeholder="What are you sharing?" />
      <label class="field-label" for="aliasId">Posting alias</label>
      <input id="aliasId" class="text-input" placeholder="Choose an alias in Profile/Me" />
      <div class="kind-pills" role="group" aria-label="Content type">
        <button class="kind-pill active" data-kind="post" type="button">Post</button>
        <button class="kind-pill" data-kind="question" type="button">Question</button>
      </div>
      <div class="editor-wrapper main-editor-wrapper">
        <div id="mainContentEditor" class="content-editor" contenteditable="true" data-placeholder="Write here..."></div>
        <div id="mainContentToolbarContainer" class="toolbar-slot"></div>
      </div>
      <div class="composer-actions">
        <button id="toggleMainContentToolbarBtn" type="button" class="soft-btn">Format</button>
        <button id="toggleMainContentHtmlViewBtn" type="button" class="soft-btn">HTML</button>
        <button id="uploadImageMainBtn" type="button" class="soft-btn">Attach</button>
      </div>
    </section>
    <details class="simple-advanced-drawer compact-card">
      <summary>Advanced destination, series, and sections</summary>
      <label class="field-label" for="targetHeichelId">Specific heichel ID</label>
      <input id="targetHeichelId" class="text-input" placeholder="Leave blank for My Posts" />
      <label class="field-label" for="newHeichelName">Create new heichel inline</label>
      <input id="newHeichelName" class="text-input" placeholder="Optional name" />
      <label class="field-label" for="targetSeriesId">Series ID</label>
      <input id="targetSeriesId" class="text-input" placeholder="root" />
      <textarea id="bulkText" class="bulk-text" placeholder="Optional: paste text and generate sections"></textarea>
      <input id="mainSectionDelimiters" class="text-input" placeholder="Section delimiters" />
      <div id="sectionsArea" class="sections-area"></div>
      <button id="generateSectionsFromBulk" type="button" class="soft-btn">Generate from paste</button>
      <button id="generateSectionsFromMainEditor" type="button" class="soft-btn">Generate from body</button>
      <button id="addSection" type="button" class="soft-btn">Add section</button>
    </details>
    <section class="status-card compact-card"><p id="submitStatusMessage">Ready.</p></section>
  </main>
  <nav class="mobile-create-nav" aria-label="Create shortcuts"><a href="/">Home</a><a href="/search">Search</a><a class="active" href="/heichelos/submit">Create</a><a href="/mail">Mail</a><a href="/profile">Me</a></nav>
  <button id="submitPost" class="publish-button" type="button">Post now</button>
  <div id="imageUploadModal" class="modal" role="dialog" aria-modal="true"><div class="modal-card"><button id="closeModalBtn" type="button" class="modal-close">×</button><h2>Attach media or file</h2><div id="dropZone" class="drop-zone">Drop file here or tap to choose</div><input id="fileInput" type="file" accept="image/*,audio/*,.pdf,.txt,.md,.doc,.docx,.zip" /><button id="uploadImageBtn" type="button" class="soft-btn">Attach file</button></div></div>
  <template id="toolbarTemplate"><div class="editor-toolbar"><button type="button" data-command="bold">Bold</button><button type="button" data-command="italic">Italic</button><button type="button" data-command="createLink">Link</button></div></template>
  <template id="sectionTemplate"><article class="section"><h3 class="section-title-dynamic">Verse</h3><input class="section-id-input text-input" placeholder="id" /><input class="section-label-input text-input" placeholder="label" /><input class="section-verse-input text-input" placeholder="verse" /><input class="section-order-input text-input" placeholder="order" /><select class="section-type-select"><option value="verse">Verse</option></select><div class="editor-wrapper"><div class="section-content content-editor" contenteditable="true"></div><div class="editor-toolbar-container"></div></div><button class="toggle-toolbar-btn soft-btn" type="button">Format</button><button class="toggle-html-view-btn soft-btn" type="button">HTML</button><button class="upload-image-section-btn soft-btn" type="button">Attach</button><button class="add-before-btn soft-btn" type="button">Before</button><button class="add-after-btn soft-btn" type="button">After</button><button class="remove-section-btn soft-btn" type="button">Remove</button><div class="subsection-manager"><textarea class="subsection-bulk-text"></textarea><input class="subsection-delimiters text-input" /><button class="generate-subsections-btn soft-btn" type="button">Generate segments</button><button class="add-subsection-btn soft-btn" type="button">Add segment</button></div><div class="sub-sections-area"></div></article></template>
  <template id="subSectionTemplate"><article class="sub-section"><h4 class="section-title-dynamic">Segment</h4><input class="section-id-input text-input" /><input class="section-label-input text-input" /><input class="section-verse-input text-input" /><input class="section-order-input text-input" /><select class="section-type-select"><option value="segment">Segment</option></select><div class="editor-wrapper"><div class="section-content content-editor" contenteditable="true"></div><div class="editor-toolbar-container"></div></div><button class="toggle-toolbar-btn soft-btn" type="button">Format</button><button class="toggle-html-view-btn soft-btn" type="button">HTML</button><button class="upload-image-section-btn soft-btn" type="button">Attach</button><button class="add-before-btn soft-btn" type="button">Before</button><button class="add-after-btn soft-btn" type="button">After</button><button class="remove-section-btn soft-btn" type="button">Remove</button></article></template>
  <script type="module" src="/heichelos/heichel/submit/script.js?v=simple-002"></script>
</body>
</html>
