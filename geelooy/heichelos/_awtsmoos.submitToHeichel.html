<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B"H - Wicked Post Submitter</title>
    <link rel="stylesheet" href="/heichelos/heichel/submit/style.css"> <!-- Or style.css if you compile SCSS -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Roboto+Mono:wght@300;400;700&family=Russo+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="all awtsmoospage">
    <?Awtsmoos
      return await getT("nav/header.html")
    ?>
    <div class="main">
    <div class="post-creator-container">
        <a id="backBtn" href="#" class="back-button-stylized"><i class="fas fa-atom"></i> Back to Heichelos</a>
        
        <header class="creator-header">
            <h1 class="page-title-glow"><span>INSANE</span> POST CREATOR</h1>
            <div class="meta-inputs">
                <div class="input-group">
                    <label for="title"><i class="fas fa-heading"></i> Title</label>
                    <input type="text" id="title" placeholder="Your Epic Post Title">
                </div>
                <div class="input-group">
                    <label for="aliasId"><i class="fas fa-fingerprint"></i> Alias ID</label>
                    <input type="text" id="aliasId" placeholder="Your Awtsmoos Alias (auto-filled)" readonly>
                </div>
            </div>
        </header>
        <metadata>
            <!-- returnURL link will be prepended here by JS if present -->
        </metadata>

        <!-- Main Content Editor -->
        <div class="main-content-editor-area editor-wrapper" id="mainContentWrapper">
            <h2 class="editor-area-title"><i class="fas fa-brain"></i> Main Content Core</h2>
            <div class="editor-controls-bar">
                <button class="control-btn" id="toggleMainContentToolbarBtn" title="Toggle Main Content Toolbar"><i class="fas fa-tools"></i> Toolbar</button>
                <button class="control-btn" id="toggleMainContentHtmlViewBtn" title="Toggle HTML View"><i class="fas fa-code"></i> HTML</button>
                <button class="control-btn" id="uploadImageMainBtn" title="Add Image to Main Content"><i class="fas fa-image"></i> Image</button>
            </div>
            <div class="editor-toolbar-container" id="mainContentToolbarContainer">
                <!-- Main content toolbar will be injected here -->
            </div>
            <div id="mainContentEditor" class="content-editor main-editor" contenteditable="true" data-placeholder="Unleash your primary thoughts here..."></div>
        </div>

        <!-- Bulk Text / Section Generation -->
        <div class="section-generator-controls editor-wrapper">
            <h2 class="editor-area-title"><i class="fas fa-magic"></i> Section Alchemist</h2>
            <textarea id="bulkText" class="bulk-text-area" placeholder="Paste bulk text here... newlines will become sections, or use custom delimiters below."></textarea>
            <div class="delimiter-input-group">
                <input type="text" id="mainSectionDelimiters" placeholder="Custom delimiters for sections (e.g., ---, ***, . ) comma-separated">
            </div>
            <div class="generator-buttons">
                <button id="generateSectionsFromBulk" class="action-button"><i class="fas fa-stream"></i> Generate Sections from Text Area</button>
                <button id="generateSectionsFromMainEditor" class="action-button"><i class="fas fa-recycle"></i> Generate Sections from Main Editor</button>
            </div>
        </div>

        <!-- Sections Area -->
        <div id="sectionsArea" class="sections-container">
            <h2 class="editor-area-title"><i class="fas fa-cubes"></i> Content Sections</h2>
            <!-- Sections will be appended here by JS -->
        </div>
        <button id="addSection" class="add-global-section-btn action-button"><i class="fas fa-plus-circle"></i> Add Blank Section</button>

        <button id="submitPost" class="submit-post-btn"><i class="fas fa-rocket"></i> LAUNCH POST TO THE COSMOS!</button>
    </div>

    <!-- Toolbar Template (hidden) -->
    <div id="toolbarTemplate" class="editor-toolbar" style="display: none;">
        <button class="toolbar-btn" data-command="bold" title="Bold"><i class="fas fa-bold"></i></button>
        <button class="toolbar-btn" data-command="italic" title="Italic"><i class="fas fa-italic"></i></button>
        <button class="toolbar-btn" data-command="underline" title="Underline"><i class="fas fa-underline"></i></button>
        <button class="toolbar-btn" data-command="strikeThrough" title="Strikethrough"><i class="fas fa-strikethrough"></i></button>
        <div class="toolbar-separator"></div>
        <button class="toolbar-btn" data-command="formatBlock" data-value="H1" title="Header 1">H1</button>
        <button class="toolbar-btn" data-command="formatBlock" data-value="H2" title="Header 2">H2</button>
        <button class="toolbar-btn" data-command="formatBlock" data-value="H3" title="Header 3">H3</button>
        <button class="toolbar-btn" data-command="formatBlock" data-value="P" title="Paragraph">P</button>
        <div class="toolbar-separator"></div>
        <button class="toolbar-btn" data-command="createLink" title="Insert Link"><i class="fas fa-link"></i></button>
        <button class="toolbar-btn" data-command="unlink" title="Remove Link"><i class="fas fa-unlink"></i></button>
        <div class="toolbar-separator"></div>
        <button class="toolbar-btn" data-command="insertUnorderedList" title="Unordered List"><i class="fas fa-list-ul"></i></button>
        <button class="toolbar-btn" data-command="insertOrderedList" title="Ordered List"><i class="fas fa-list-ol"></i></button>
        <div class="toolbar-separator"></div>
        <button class="toolbar-btn" data-command="formatBlock" data-value="BLOCKQUOTE" title="Blockquote"><i class="fas fa-quote-right"></i></button>
        <button class="toolbar-btn" data-command="removeFormat" title="Clear Formatting"><i class="fas fa-eraser"></i></button>
        <!-- <button class="toolbar-btn" data-command="insertHTML" data-value="<script>alert(' sécurisé! ');</script>" title="Insert Script (Caution!)"><i class="fas fa-code"></i> Script</button> -->
    </div>

    <!-- Section Template (for JS to clone) -->
    <template id="sectionTemplate">
        <div class="section editor-wrapper">
            <div class="section-header">
                <span class="section-drag-handle"><i class="fas fa-grip-vertical"></i></span>
                <h3 class="section-title-dynamic">Section</h3>
            </div>
            <div class="editor-controls-bar">
                <button class="control-btn add-before-btn" title="Add Section Before"><i class="fas fa-arrow-up"></i><i class="fas fa-plus"></i></button>
                <button class="control-btn toggle-toolbar-btn" title="Toggle Toolbar"><i class="fas fa-tools"></i></button>
                <button class="control-btn upload-image-section-btn" title="Add Image"><i class="fas fa-image"></i></button>
                <button class="control-btn toggle-html-view-btn" title="Toggle HTML View"><i class="fas fa-code"></i></button>
                <button class="control-btn remove-section-btn destructive" title="Remove Section"><i class="fas fa-trash-alt"></i></button>
                <button class="control-btn add-after-btn" title="Add Section After"><i class="fas fa-arrow-down"></i><i class="fas fa-plus"></i></button>
            </div>
            <div class="editor-toolbar-container section-toolbar-container"></div>
            <div class="section-content content-editor" contenteditable="true" data-placeholder="Craft this section's essence..."></div>
            
            <div class="subsection-manager">
                <h4 class="subsection-title"><i class="fas fa-sitemap"></i> Sub-sections Portal</h4>
                <textarea class="subsection-bulk-text bulk-text-area" placeholder="Material for sub-sections... custom delimiters apply."></textarea>
                <div class="delimiter-input-group">
                     <input type="text" class="subsection-delimiters" placeholder="Custom delimiters for sub-sections (e.g., ---, .)">
                </div>
                <div class="generator-buttons">
                    <button class="generate-subsections-btn action-button mini"><i class="fas fa-cogs"></i> Generate Sub-sections</button>
                    <button class="add-subsection-btn action-button mini"><i class="fas fa-plus-square"></i> Add Blank Sub-section</button>
                </div>
            </div>
            <div class="sub-sections-area">
                <!-- Sub-sections will be appended here -->
            </div>
        </div>
    </template>

    <!-- Sub-section Template (for JS to clone) -->
    <template id="subSectionTemplate">
        <div class="sub-section editor-wrapper">
             <div class="section-header">
                <span class="section-drag-handle"><i class="fas fa-grip-vertical"></i></span>
                <h4 class="section-title-dynamic">Sub-Section</h4>
            </div>
            <div class="editor-controls-bar">
                <button class="control-btn add-before-btn" title="Add Sub-Section Before"><i class="fas fa-arrow-up"></i><i class="fas fa-plus"></i></button>
                <button class="control-btn toggle-toolbar-btn" title="Toggle Toolbar"><i class="fas fa-tools"></i></button>
                <button class="control-btn upload-image-section-btn" title="Add Image"><i class="fas fa-image"></i></button>
                <button class="control-btn toggle-html-view-btn" title="Toggle HTML View"><i class="fas fa-code"></i></button>
                <button class="control-btn remove-section-btn destructive" title="Remove Sub-Section"><i class="fas fa-trash-alt"></i></button>
                <button class="control-btn add-after-btn" title="Add Sub-Section After"><i class="fas fa-arrow-down"></i><i class="fas fa-plus"></i></button>
            </div>
            <div class="editor-toolbar-container subsection-toolbar-container"></div>
            <div class="section-content content-editor" contenteditable="true" data-placeholder="Detail this sub-dimension..."></div>
        </div>
    </template>

    <!-- Image Upload Modal -->
    <div id="imageUploadModal" class="modal" style="display:none;">
        <div class="modal-content-stylized">
            <button id="closeModalBtn" class="close-button-stylized"><i class="fas fa-times-circle"></i></button>
            <h2 class="modal-title-glow">IMAGE UPLOAD PORTAL</h2>
            <div class="input-group">
                <label for="imgbbApiKey"><i class="fas fa-key"></i> ImgBB API Key</label>
                <input type="text" id="imgbbApiKey" placeholder="Your ImgBB API Key (will be saved)">
            </div>
            <div id="dropZone" class="drop-zone-stylized">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>Drag & drop image here, or click to select file</p>
                <input type="file" id="fileInput" accept="image/*" style="display:none;">
            </div>
            <button id="uploadImageBtn" class="action-button modal-action-btn"><i class="fas fa-upload"></i> Upload to ImgBB</button>
        </div>
    </div>
</div>
</div>
   
    <script src="/heichelos/script.js" type="module"></script>
</body>
</html>
