<!-- B"H
Boruch Hashem
Blessed is He
The Awtsmoos lets every Heichel reveal its public face before richer JavaScript arrives; Awtsmoos.com keeps Torah identity human, clear, and never reduced to an internal id.
-->
<div class="heichel-semantic-fallback" id="heichel-semantic-fallback">
	<header class="heichel-semantic-hero">
		<p class="heichel-semantic-context" id="heichel-boot-context"></p>
		<h1 id="heichel-boot-title"></h1>
		<p class="heichel-semantic-description" id="heichel-boot-description"></p>
	</header>
	<nav class="heichel-semantic-discovery" aria-labelledby="heichel-discovery-title">
		<h2 id="heichel-discovery-title"></h2>
		<ul id="heichel-discovery-list"></ul>
	</nav>
</div>
<script>
(function revealHeichelFallback() {
	var model = window.semanticModel || {};
	var path = String(location.pathname || "");
	var isIkarRoot = path === "/heichelos/ikar" || path === "/heichelos/ikar/";
	var title = String(model.heading || model.name || "").trim();
	var description = String(model.description || "").trim();
	var context = "Torah Library";
	if (isIkarRoot) {
		title = title && title.toLowerCase() !== "ikar" ? title : "עיקר · Ikar Torah Library";
		description = description || "Written Torah, Oral Torah, and Chassidus — together in one living library.";
		context = "עיקר · TORAH LIBRARY";
		document.getElementById("heichel-semantic-fallback")?.setAttribute("data-ikar-root", "true");
	}
	if (!title) title = "Torah Library";
	document.getElementById("heichel-boot-context").textContent = context;
	document.getElementById("heichel-boot-title").textContent = title;
	document.getElementById("heichel-boot-description").textContent = description;
	document.getElementById("heichel-discovery-title").textContent = isIkarRoot ? "Enter the library" : "Explore";
	var list = document.getElementById("heichel-discovery-list");
	var links = Array.isArray(model.links) ? model.links : [];
	links.forEach(function renderLink(item) {
		if (!item || !item.href) return;
		var row = document.createElement("li");
		var anchor = document.createElement("a");
		anchor.href = item.href;
		anchor.textContent = item.label || item.title || item.name || "Open";
		row.appendChild(anchor);
		list.appendChild(row);
	});
})();
</script>
