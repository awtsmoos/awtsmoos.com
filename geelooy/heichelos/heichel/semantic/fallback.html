The Awtsmoos reveals identity through the real Heichel record; Awtsmoos.com adds atmosphere around the data, never a replacement name or invented description.
-->
<div class="heichel-semantic-fallback" id="heichel-semantic-fallback" data-heichel-semantic-fallback="true">
	<header class="heichel-semantic-hero">
		<p class="heichel-semantic-context" id="heichel-boot-context">TORAH · LIVING LIBRARY</p>
		<h1 id="heichel-boot-title"></h1>
		<p class="heichel-semantic-description" id="heichel-boot-description"></p>
	</header>
	<nav class="heichel-semantic-discovery" aria-labelledby="heichel-discovery-title">
		<h2 id="heichel-discovery-title">Explore</h2>
		<ul id="heichel-discovery-list"></ul>
	</nav>
</div>
<script>
(function revealHeichelFallback() {
	var serverSemantic = typeof semantic === "object" && semantic ? semantic : null;
	var model = serverSemantic || window.semanticModel || {};
	var path = String(location.pathname || "");
	var isIkarRoot = path === "/heichelos/ikar" || path === "/heichelos/ikar/";
	var title = String(model.title || model.name || model.heading || "").trim();
	var description = String(model.description || "").trim();
	var root = document.getElementById("heichel-semantic-fallback");
	if (isIkarRoot) {
		root?.setAttribute("data-ikar-root", "true");
	}
	document.getElementById("heichel-boot-title").textContent = title;
	var descriptionNode = document.getElementById("heichel-boot-description");
	descriptionNode.textContent = description;
	descriptionNode.hidden = !description;
	document.getElementById("heichel-discovery-title").textContent = isIkarRoot ? "Enter the library" : "Explore";
	var list = document.getElementById("heichel-discovery-list");
	var links = Array.isArray(model.links) ? model.links : [];
	links.forEach(function renderLink(item) {
		if (!item || !item.href) return;
		var row = document.createElement("li");
		var anchor = document.createElement("a");
		anchor.href = item.href;
		anchor.textContent = item.label || item.title || item.name || "Open";
		row.appendChild(anchor);
		list.appendChild(row);
	});
})();
</script>
