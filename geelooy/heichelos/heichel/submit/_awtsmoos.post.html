<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<title>Geelooy | Create Post</title>
	<link rel="stylesheet" href="/heichelos/heichel/submit/style.css?v=clean-003">
</head>
<body class="submit-shell">
	<div class="all awtsmoospage">
		<?Awtsmoos return await getT("nav/header.html") ?>
		<main class="main" aria-labelledby="createTitle">
			<div id="editorContainer" class="post-creator-container">
				<header class="page-header submit-hero">
					<p class="eyebrow">Create</p>
					<h1 id="createTitle" class="page-title-glow">Write a post</h1>
					<p>Draft, structure, attach, and publish without leaving the editor.</p>
				</header>
				<div class="top-controls"><a id="backBtn" class="btn secondary small">Back to Heichel</a></div>
				<section class="composer-card" aria-label="Post basics">
					<input id="postId" type="hidden">
					<div class="input-group"><label for="aliasId">Posting alias</label><input id="aliasId" type="text" disabled placeholder="Authenticating..."></div>
					<div class="input-group"><label for="contentType">Content type</label><select id="contentType" class="segment-select"><option value="post">Post</option><option value="question">Question</option></select></div>
					<div class="input-group"><label for="title">Title</label><input id="title" type="text" placeholder="What are you sharing?"></div>
					<div class="kind-pills" role="group" aria-label="Content type shortcuts"><button class="kind-pill active" data-kind="post" type="button">Post</button><button class="kind-pill" data-kind="question" type="button">Question</button></div>
				</section>
				<section class="editor-wrapper main-wrapper" aria-label="Main content editor">
					<div class="editor-label">Body</div>
					<div class="editor-controls-bar">
						<button id="toggleMainContentToolbarBtn" class="btn icon-btn" title="Toolbar" type="button">Format</button>
						<button id="toggleMainContentHtmlViewBtn" class="btn icon-btn" title="HTML Source" type="button">HTML</button>
						<button id="uploadImageMainBtn" class="btn icon-btn" title="Upload Image" type="button">Attach</button>
					</div>
					<div id="mainContentToolbarContainer" class="editor-toolbar-container"></div>
					<div id="mainContentEditor" class="content-editor" contenteditable="true" role="textbox" aria-label="Post body" aria-multiline="true" data-placeholder="Write here..."></div>
				</section>
				<details class="collapsible-section input-group">
					<summary class="collapsible-header">Advanced structure</summary>
					<div class="collapsible-content" id="collapsibleContent">
						<label for="bulkText">Bulk text</label><textarea id="bulkText" placeholder="Paste text here. Each paragraph or delimiter can become a section."></textarea>
						<label for="mainSectionDelimiters">Section delimiters</label><input id="mainSectionDelimiters" type="text" placeholder="Optional delimiters">
						<label for="targetSeriesId">Series ID</label><input id="targetSeriesId" type="text" placeholder="root">
						<div class="composer-actions">
							<button id="generateSectionsFromBulk" class="soft-btn" type="button">Generate from paste</button>
							<button id="generateSectionsFromMainEditor" class="soft-btn" type="button">Generate from body</button>
							<button id="addSection" class="soft-btn" type="button">Add section</button>
						</div>
					</div>
				</details>
				<section id="sectionsArea" class="sections-area" aria-label="Generated sections"></section>
				<section class="status-card compact-card" aria-live="polite"><p id="submitStatusMessage">Ready.</p></section>
			</div>
		</main>
	</div>
	<nav class="mobile-create-nav" aria-label="Create shortcuts"><a href="/">Home</a><a href="/heichelos">Spaces</a><a class="active" href="/heichelos/submit">Create</a><a href="/email">Mail</a><a href="/profile">Profile</a></nav>
	<button id="submitPost" class="publish-button" type="button">Publish</button>
	<?Awtsmoos return await getT("heichelos/heichel/submit/partials/upload-dialog.html") ?>
	<?Awtsmoos return await getT("heichelos/heichel/submit/partials/toolbar-template.html") ?>
	<?Awtsmoos return await getT("heichelos/heichel/submit/partials/section-template.html") ?>
	<?Awtsmoos return await getT("heichelos/heichel/submit/partials/subsection-template.html") ?>
	<script type="module" src="/heichelos/heichel/submit/script.js?v=clean-003"></script>
</body>
</html>
