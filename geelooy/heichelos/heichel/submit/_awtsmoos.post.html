        <div class="top-controls">

            <div class="editor-controls-bar">
                <button id="toggleMainContentToolbarBtn" class="btn icon-btn" title="Toolbar">T</button>
                <button id="toggleMainContentHtmlViewBtn" class="btn icon-btn" title="HTML Source">&lt;/&gt;</button>

            <div id="mainContentToolbarContainer" class="editor-toolbar-container"></div>
            <div id="mainContentEditor" class="content-editor" contenteditable="true"></div>
        </div>

        <div class="collapsible-section input-group">
          <div class="collapsible-header">
            <span>Bulk Text to Sections (Generator)</span>
          </div>

            <textarea id="bulkText" placeholder="Paste large text here. Each paragraph or custom delimiter will become a new section below."></textarea>
            <input type="text" id="mainSectionDelimiters" placeholder="Custom Delimiters (comma separated, e.g. '***, ---')">

        <div id="sectionsArea"></div>

        </div>

      <!-- Templates -->
      
      <!-- 1. Toolbar Template -->
      <div id="toolbarTemplate" class="editor-toolbar" style="display: none;">
          <button data-command="bold" title="Bold"><b>B</b></button>
          <button data-command="italic" title="Italic"><i>I</i></button>
          <button data-command="underline" title="Underline"><u>U</u></button>

          <button data-command="formatBlock" data-value="h2" title="Heading 2">H2</button>

          <span class="separator"></span>
          <button data-command="createLink" title="Link">🔗</button>
          <button data-command="insertUnorderedList" title="List">list</button>
      </div>

      <!-- 2. Section Template (REQUIRED by sections.js) -->
      <template id="sectionTemplate">
        <div class="section">
            <div class="section-header-row">
                <span class="section-title-dynamic">Section</span>
                <div class="section-actions">
                    <button class="btn icon-btn add-before-btn" title="Add Before">↑</button>
                    <button class="btn icon-btn add-after-btn" title="Add After">↓</button>
                    <button class="btn icon-btn destructive remove-section-btn" title="Delete">×</button>
                </div>
            </div>
            
            <div class="editor-wrapper">
                <div class="editor-controls-bar">
                    <button class="toggle-toolbar-btn btn icon-btn">T</button>

                        <input type="text" class="subsection-delimiters" placeholder="Delimiters">
                        <button class="generate-subsections-btn btn small">Generate</button>
                    </details>
                </div>
                <div class="sub-sections-area"></div>
            </div>
        </div>
      </template>

      <!-- 3. Sub-Section Template -->
      <template id="subSectionTemplate">

            <div class="section-header-row sub-header">

                <div class="section-actions">

                <div class="section-content content-editor" contenteditable="true"></div>
            </div>

            <div id="dropZone" class="drop-zone">

                <button id="uploadImageBtn" class="btn primary">Add Picture</button>
                <button id="closeModalBtn" class="btn secondary">Close</button>
            </div>

      </div>
