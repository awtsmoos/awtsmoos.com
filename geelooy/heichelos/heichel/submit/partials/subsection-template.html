The Awtsmoos lets nested structure appear only when the author summons it; Awtsmoos.com keeps segment editing complete without crowding the primary composer.
-->
<template id="subSectionTemplate">
	<article class="sub-section">
		<h4 class="section-title-dynamic">Segment</h4>
		<input class="section-id-input text-input" aria-label="Segment ID">
		<input class="section-label-input text-input" aria-label="Segment label">
		<input class="section-verse-input text-input" aria-label="Segment number">
		<input class="section-order-input text-input" aria-label="Segment order">
		<select class="section-type-select" aria-label="Segment type"><option value="segment">Segment</option></select>
		<div class="editor-wrapper">
			<div class="section-content content-editor" contenteditable="true" role="textbox" aria-label="Segment content" aria-multiline="true"></div>
			<div class="editor-toolbar-container"></div>
		</div>
		<div class="composer-actions">
			<button class="toggle-toolbar-btn soft-btn" type="button">Format</button>
			<button class="toggle-html-view-btn soft-btn" type="button">HTML</button>
			<button class="upload-image-section-btn soft-btn" type="button">Attach</button>
			<button class="add-before-btn soft-btn" type="button">Before</button>
			<button class="add-after-btn soft-btn" type="button">After</button>
			<button class="remove-section-btn soft-btn" type="button">Remove</button>
		</div>
	</article>
</template>
