<!-- B"H
Boruch Hashem
Blessed is He
The Awtsmoos opens one bounded media doorway; Awtsmoos.com keeps upload power reachable without letting the dialog dominate the writing surface.
-->
<div id="imageUploadModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="uploadTitle">
	<div class="modal-card">
		<button id="closeModalBtn" class="modal-close" type="button" aria-label="Close upload dialog">×</button>
		<h2 id="uploadTitle">Attach media or file</h2>
		<div id="dropZone" class="drop-zone">Drop a file here or tap to choose</div>
		<label class="g-sr-only" for="fileInput">Choose a file to attach</label>
		<input id="fileInput" type="file" accept="image/*,audio/*,.pdf,.txt,.md,.doc,.docx,.zip">
		<button id="uploadImageBtn" class="soft-btn" type="button">Attach file</button>
	</div>
</div>
