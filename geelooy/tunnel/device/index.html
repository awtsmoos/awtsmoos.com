<!DOCTYPE html>
<!-- B"H — Awtsmoos Tunnel: headless device approval (Yaakov 2026-10-12) -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Approve a device — Awtsmoos Tunnel</title>
<style>
:root {
	--awt-bg: #0b0e14;
	--awt-surface: #121722;
	--awt-surface-2: #18202f;
	--awt-text: #eef2f9;
	--awt-muted: #9aa7bd;
	--awt-gold: #e8b93c;
	--awt-green: #3ddc84;
	--awt-red: #ff6b6b;
	--awt-cyan: #56c8f5;
	--awt-border: #26314a;
	--awt-radius: 14px;
	color-scheme: dark;
}
@media (prefers-color-scheme: light) {
	:root {
		--awt-bg: #f5f7fb;
		--awt-surface: #ffffff;
		--awt-surface-2: #eef1f7;
		--awt-text: #172033;
		--awt-muted: #5a6a86;
		--awt-border: #dde3ef;
		color-scheme: light;
	}
}
* { box-sizing: border-box; }
body {
	margin: 0;
	font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
	background: var(--awt-bg);
	color: var(--awt-text);
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 24px;
}
.card {
	width: 100%;
	max-width: 560px;
	background: var(--awt-surface);
	border: 1px solid var(--awt-border);
	border-radius: var(--awt-radius);
	padding: 32px;
	box-shadow: 0 24px 70px rgb(0 0 0 / 28%);
}
.brand {
	color: var(--awt-gold);
	font-weight: 700;
	letter-spacing: 0.14em;
	font-size: 13px;
	margin: 0 0 6px;
}
h1 { font-size: 26px; margin: 0 0 10px; line-height: 1.25; }
p { color: var(--awt-muted); line-height: 1.6; margin: 0 0 14px; }
p strong { color: var(--awt-text); }
.btn {
	display: inline-block;
	border: 1px solid transparent;
	border-radius: 10px;
	padding: 13px 26px;
	font-size: 16px;
	font-weight: 600;
	cursor: pointer;
	background: var(--awt-green);
	color: #06130c;
	transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
}
.btn:hover { transform: translateY(-1px); box-shadow: 0 10px 28px rgb(61 220 132 / 30%); }
.btn:focus-visible { outline: 3px solid var(--awt-cyan); outline-offset: 2px; }
.btn:active { transform: translateY(0); box-shadow: none; }
.btn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; box-shadow: none; }
.btn.deny {
	background: transparent;
	color: var(--awt-text);
	border-color: var(--awt-border);
}
.btn.deny:hover { border-color: var(--awt-red); box-shadow: 0 10px 28px rgb(255 107 107 / 18%); }
.code {
	font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
	background: var(--awt-surface-2);
	border: 1px solid var(--awt-border);
	border-radius: 8px;
	padding: 10px 14px;
	word-break: break-all;
	font-size: 14px;
	color: var(--awt-text);
}
.row { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
.hint { font-size: 13px; }
.error { color: var(--awt-red); font-weight: 600; }
.ok { color: var(--awt-green); font-weight: 600; }
.hidden { display: none; }
label { display: block; font-size: 13px; color: var(--awt-muted); margin: 12px 0 4px; }
input[type="text"] {
	width: 100%;
	padding: 11px 13px;
	border-radius: 10px;
	border: 1px solid var(--awt-border);
	background: var(--awt-surface-2);
	color: var(--awt-text);
	font-size: 15px;
}
input[type="text"]:focus { outline: 3px solid var(--awt-cyan); outline-offset: 1px; border-color: var(--awt-cyan); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 14px 0; font-size: 14px; }
.kv dt { color: var(--awt-muted); }
.kv dd { margin: 0; color: var(--awt-text); word-break: break-all; }
</style>
</head>
<body>
<main class="card">
<p class="brand">✦ AWTSMOOS TUNNEL</p>
<div id="app"><p class="hint">Loading…</p></div>
</main>
<script>
(function () {
	"use strict";
	var params = new URLSearchParams(location.search);
	var presetCode = (params.get("code") || "").trim();
	var app = document.getElementById("app");

	function esc(s) {
		return String(s == null ? "" : s).replace(/&/g, "&amp;")
			.replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
	}

	function post(path, payload) {
		return fetch(path, {
			method: "POST",
			headers: { "Content-Type": "application/json" },
			credentials: "same-origin",
			body: JSON.stringify(payload || {})
		}).then(function (r) { return r.json().then(function (d) { return { status: r.status, data: d }; }); });
	}

	function enterCodeView(message) {
		app.innerHTML =
			'<h1>Approve a headless device</h1>' +
			'<p>A machine with no browser is asking to join your tunnel. ' +
			'Type the <strong>8-letter code</strong> shown on its screen.</p>' +
			(message ? '<p class="error">' + esc(message) + '</p>' : '') +
			'<label for="user-code">Device code</label>' +
			'<input type="text" id="user-code" maxlength="9" placeholder="ABCD-1234" value="' + esc(presetCode) + '" autocapitalize="characters" autocomplete="off" spellcheck="false">' +
			'<div class="row"><button class="btn secondary" id="lookup-btn" type="button">Look up device</button></div>';
		document.getElementById("lookup-btn").addEventListener("click", function () {
			var code = document.getElementById("user-code").value;
			lookup(code);
		});
	}

	function lookup(code) {
		app.innerHTML = '<p class="hint">Looking up…</p>';
		post("/api/tunnel/control/device-login/describe", { code: code }).then(function (res) {
			if (!res.data.ok) {
				enterCodeView(res.status === 404 ? "No pending login matches that code. Check the code and try again." : ("Lookup failed: " + (res.data.error || "unknown")));
				return;
			}
			approveView(res.data, code);
		}).catch(function (e) {
			enterCodeView("Lookup failed: " + e.message);
		});
	}

	function approveView(info, code) {
		var expiresIn = Math.max(0, Math.round((info.expiresAt - Date.now()) / 1000));
		app.innerHTML =
			'<h1>Approve this device?</h1>' +
			'<p>Only approve if <strong>you</strong> just ran the installer on this machine.</p>' +
			'<dl class="kv">' +
			'<dt>Device</dt><dd>' + esc(info.deviceName || "headless box") + '</dd>' +
			'<dt>Tunnel</dt><dd>' + esc(info.tunnelId || "—") + '</dd>' +
			'<dt>Code</dt><dd><span class="code">' + esc(info.userCode) + '</span></dd>' +
			'<dt>Expires in</dt><dd>' + expiresIn + 's</dd>' +
			'</dl>' +
			'<div class="row">' +
			'<button class="btn" id="approve-btn" type="button">Approve &amp; connect</button>' +
			'<button class="btn deny" id="deny-btn" type="button">Deny</button>' +
			'</div><p class="hint error" id="act-error" role="alert"></p>';
		document.getElementById("approve-btn").addEventListener("click", function () {
			act("/api/tunnel/control/device-login/approve", code, "Device approved. It will finish connecting on its own now.");
		});
		document.getElementById("deny-btn").addEventListener("click", function () {
			act("/api/tunnel/control/device-login/deny", code, "Device denied. It can no longer use this code.");
		});
	}

	function act(path, code, doneMessage) {
		var errEl = document.getElementById("act-error");
		errEl.textContent = "";
		post(path, { code: code }).then(function (res) {
			if (res.status === 401) {
				app.innerHTML = '<h1>Sign in first</h1><p>You need to be signed in as the tunnel owner to approve devices.</p>';
				return;
			}
			if (!res.data.ok) {
				errEl.textContent = "Failed: " + (res.data.error || "unknown");
				return;
			}
			app.innerHTML = '<h1 class="ok">Done</h1><p>' + esc(doneMessage) + '</p>';
		}).catch(function (e) {
			errEl.textContent = "Failed: " + e.message;
		});
	}

	// If a code came in the URL, skip straight to lookup.
	if (presetCode) {
		lookup(presetCode);
	} else {
		enterCodeView("");
	}
})();
</script>
</body>
</html>
