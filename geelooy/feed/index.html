<!-- B"H -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<script>
/* B"H — set data-theme before any CSS paints (site convention). */
(function () {
	try {
		var t = localStorage.getItem('awtsmoos-theme');
		document.documentElement.setAttribute('data-theme', (t === 'dark' || t === 'light') ? t : 'dark');
	} catch (e) {
		document.documentElement.setAttribute('data-theme', 'dark');
	}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Awtsmoos River — a smart ranked social feed of Torah voices.">
<meta name="theme-color" content="#0b0d12">
<title>Awtsmoos River — Social Feed</title>
<link rel="stylesheet" href="/style/awtsmoos-tokens.css?v=277746350e">
<link rel="stylesheet" href="/feed/css/feed.css?v=1649cdcf4e">
<link rel="stylesheet" href="/feed/css/anchoredComments.css?v=1">
<link rel="stylesheet" href="/feed/css/streaks.css?v=1">
<link rel="stylesheet" href="/feed/css/theme-dark-immersive.css?v=1">
<link rel="stylesheet" href="/feed/css/theme-light-parchment.css?v=1">
<link rel="stylesheet" href="/feed/css/theme-classic.css?v=1">
<link rel="stylesheet" href="/feed/css/theme-parchment-aged.css?v=1">
<link rel="stylesheet" href="/feed/css/theme-parchment-clean.css?v=1">
<link rel="stylesheet" href="/feed/css/theme-parchment-night.css?v=1">
<link rel="stylesheet" href="/feed/css/theme-parchment-golden.css?v=1">
<link rel="stylesheet" href="/feed/css/learning.css?v=1">
</head>
<body>
<div class="feed-stage" id="feed-stage" data-feed-theme="dark-immersive">
	<header class="feed-topbar">
		<a class="feed-brand" href="/" aria-label="Awtsmoos home">
			<svg class="feed-brand-mark" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
				<path d="M16 2v28M2 16h28M6 6l20 20M26 6 6 26" stroke-linecap="round"/>
				<circle cx="16" cy="16" r="4.5" fill="currentColor" stroke="none"/>
			</svg>
			<span>Awtsmoos</span>
		</a>
		<button type="button" class="feed-ic-btn feed-filter-toggle" id="feed-filter-toggle" aria-label="Toggle filters" aria-expanded="true" title="Filters">
			<svg class="feed-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M4 5.5h16l-6.2 7.2v5.1l-3.6 2v-7.1z"/></svg>
			<span class="feed-ic-btn-label">Filters</span>
			<span class="feed-filter-count" id="feed-filter-count" hidden></span>
		</button>
		<label class="feed-search">
			<svg class="feed-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.8-3.8"/></svg>
			<input type="search" id="feed-search-input" placeholder="Search posts, people, topics…" aria-label="Search the river">
		</label>
		<div class="feed-theme-drop" id="feed-theme-drop">
			<button type="button" class="feed-ic-btn feed-theme-drop-btn" id="feed-theme-drop-btn" aria-haspopup="menu" aria-expanded="false" title="Feed theme">
				<span class="feed-theme-swatch" id="feed-theme-drop-swatch" aria-hidden="true"></span>
				<span class="feed-ic-btn-label" id="feed-theme-drop-label">Theme</span>
				<svg class="feed-ic feed-theme-drop-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m6 9.5 6 6 6-6"/></svg>
			</button>
		</div>
	</header>

	<div class="feed-layout">
		<aside class="feed-side" id="feed-side" aria-label="Feed filters">
			<div class="feed-side-head">
				<span class="feed-side-title">River controls</span>
				<button type="button" class="feed-ic-btn feed-side-close" id="feed-side-close" aria-label="Hide filters">
					<svg class="feed-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
				</button>
			</div>
			<div class="feed-filter-panel" id="feed-filter-panel"></div>
		</aside>

		<div class="feed-main">
			<nav class="feed-tabs" id="feed-tabs" aria-label="Feed rivers"></nav>

			<main class="feed-river" id="feed-river" aria-live="polite" aria-label="Social feed"></main>

			<p class="feed-status" id="feed-status" role="status"></p>

			<div class="feed-sentinel-wrap">
				<button type="button" class="feed-sentinel" id="feed-sentinel">Load more live posts</button>
			</div>
		</div>
	</div>
</div>

<script type="module">
import { createFeedRiver } from '/feed/js/feed.js?v=river-001';

const river = createFeedRiver({
	river: document.getElementById('feed-river'),
	sentinel: document.getElementById('feed-sentinel'),
	tabsEl: document.getElementById('feed-tabs'),
	statusEl: document.getElementById('feed-status')
});
river.attach();

// Anchored comments: select text in any card body -> floating Comment button.
import { initAnchoredComments } from '/feed/js/anchoredComments.js?v=1';
initAnchoredComments();

// B"H — Yaakov 2026-10-14: TRACK A quick wins — daily learning streaks.
import { initStreaks } from '/feed/js/streaks.js?v=1';
initStreaks();

// B"H — Yaakov 2026-10-13: learning track hub (plans, siyum, sheets, challenges, shiur).
import { initLearningHub } from '/feed/js/learningHub.js?v=1';
initLearningHub();

// Benchmark hook: ?bench=1 runs the perf ledger summary to console + title.
if (new URLSearchParams(location.search).get('bench') === '1') {
	const report = () => {
		const s = river.perfLedger.summary();
		console.log('[feed-bench]', JSON.stringify(s));
		document.title = 'BENCH ' + JSON.stringify(s);
	};
	setInterval(report, 5000);
	window.__feedBench = () => river.perfLedger.summary();
}

// Search jumps to the social search page.
document.getElementById('feed-search-input').addEventListener('keydown', (event) => {
	if (event.key === 'Enter' && event.target.value.trim()) {
		location.href = '/social/?q=' + encodeURIComponent(event.target.value.trim());
	}
});

// B"H — Yaakov 2026-10-13: feed theme dropdown (7 themes incl. 4 parchment variants).
// Retractable: outside click or Escape closes it.
(function initFeedTheme() {
	const stage = document.getElementById('feed-stage');
	const dropBtn = document.getElementById('feed-theme-drop-btn');
	const dropWrap = document.getElementById('feed-theme-drop');
	const swatch = document.getElementById('feed-theme-drop-swatch');
	const label = document.getElementById('feed-theme-drop-label');
	const KEY = 'awtsmoos-feed-theme';
	const THEMES = [
		{ id: 'dark-immersive', name: 'Immersive', swatch: ['#0b0d12', '#d4a94e'] },
		{ id: 'light-parchment', name: 'Parchment', swatch: ['#f4ead2', '#7a5a1a'] },
		{ id: 'classic', name: 'Classic', swatch: ['#101318', '#5bddff'] },
		{ id: 'parchment-aged', name: 'Aged', swatch: ['#e3cfa0', '#7a5a1a'] },
		{ id: 'parchment-clean', name: 'Clean', swatch: ['#f7f0dd', '#8a6f42'] },
		{ id: 'parchment-night', name: 'Night', swatch: ['#1c1710', '#d4a94e'] },
		{ id: 'parchment-golden', name: 'Golden', swatch: ['#f0dfa8', '#a31621'] }
	];
	let openMenu = null;
	function closeMenu() {
		if (openMenu) { openMenu.remove(); openMenu = null; }
		dropBtn.setAttribute('aria-expanded', 'false');
		document.removeEventListener('click', onDocClick, true);
		document.removeEventListener('keydown', onDocKey);
	}
	function onDocClick(e) {
		if (openMenu && !openMenu.contains(e.target) && !dropWrap.contains(e.target)) closeMenu();
	}
	function onDocKey(e) { if (e.key === 'Escape') closeMenu(); }
	function paint(theme) {
		const t = THEMES.find(x => x.id === theme) || THEMES[0];
		swatch.style.background = `linear-gradient(135deg, ${t.swatch[0]} 50%, ${t.swatch[1]} 50%)`;
		label.textContent = t.name;
	}
	function apply(theme) {
		if (!THEMES.some(x => x.id === theme)) theme = 'dark-immersive';
		stage.setAttribute('data-feed-theme', theme);
		paint(theme);
		try { localStorage.setItem(KEY, theme); } catch (e) {}
	}
	let saved = 'dark-immersive';
	try { saved = localStorage.getItem(KEY) || saved; } catch (e) {}
	apply(saved);
	dropBtn.addEventListener('click', (event) => {
		event.stopPropagation();
		if (openMenu) { closeMenu(); return; }
		const current = stage.getAttribute('data-feed-theme');
		const menu = document.createElement('div');
		menu.className = 'feed-menu feed-theme-menu';
		menu.setAttribute('role', 'menu');
		menu.setAttribute('aria-label', 'Feed theme');
		menu.innerHTML = '<p class="feed-menu-head">Feed theme</p>' + THEMES.map(t => {
			const active = t.id === current;
			return `<button type="button" class="feed-menu-item${active ? ' is-active' : ''}" data-theme-opt="${t.id}" role="menuitemradio" aria-checked="${active}">
				<span class="feed-menu-check">${active ? '<svg class="feed-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>' : ''}</span>
				<span class="feed-theme-swatch" style="background:linear-gradient(135deg, ${t.swatch[0]} 50%, ${t.swatch[1]} 50%)" aria-hidden="true"></span>
				<span>${t.name}</span></button>`;
		}).join('');
		dropWrap.append(menu);
		openMenu = menu;
		dropBtn.setAttribute('aria-expanded', 'true');
		menu.querySelectorAll('[data-theme-opt]').forEach(btn => {
			btn.addEventListener('click', (ev) => { ev.stopPropagation(); apply(btn.dataset.themeOpt); closeMenu(); });
		});
		document.addEventListener('click', onDocClick, true);
		document.addEventListener('keydown', onDocKey);
	});
})();
</script>
</body>
</html>
