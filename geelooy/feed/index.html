<script>
/* B"H — set data-theme before any CSS paints (site convention). */
(function () {
	try {
		var t = localStorage.getItem('awtsmoos-theme');
		document.documentElement.setAttribute('data-theme', (t === 'dark' || t === 'light') ? t : 'dark');
	} catch (e) {
		document.documentElement.setAttribute('data-theme', 'dark');
	}
})();
</script>

// B"H — Yaakov 2026-10-13: feed theme dropdown (7 themes incl. 4 parchment variants).
// Retractable: outside click or Escape closes it.
(function initFeedTheme() {
	const stage = document.getElementById('feed-stage');
	const dropBtn = document.getElementById('feed-theme-drop-btn');
	const dropWrap = document.getElementById('feed-theme-drop');
	const swatch = document.getElementById('feed-theme-drop-swatch');
	const label = document.getElementById('feed-theme-drop-label');
	const KEY = 'awtsmoos-feed-theme';
	const THEMES = [
		{ id: 'dark-immersive', name: 'Immersive', swatch: ['#0b0d12', '#d4a94e'] },
		{ id: 'light-parchment', name: 'Parchment', swatch: ['#f4ead2', '#7a5a1a'] },
		{ id: 'classic', name: 'Classic', swatch: ['#101318', '#5bddff'] },
		{ id: 'parchment-aged', name: 'Aged', swatch: ['#e3cfa0', '#7a5a1a'] },
		{ id: 'parchment-clean', name: 'Clean', swatch: ['#f7f0dd', '#8a6f42'] },
		{ id: 'parchment-night', name: 'Night', swatch: ['#1c1710', '#d4a94e'] },
		{ id: 'parchment-golden', name: 'Golden', swatch: ['#f0dfa8', '#a31621'] }
	];
	let openMenu = null;
	function closeMenu() {
		if (openMenu) { openMenu.remove(); openMenu = null; }
		dropBtn.setAttribute('aria-expanded', 'false');
		document.removeEventListener('click', onDocClick, true);
		document.removeEventListener('keydown', onDocKey);
	}
	function onDocClick(e) {
		if (openMenu && !openMenu.contains(e.target) && !dropWrap.contains(e.target)) closeMenu();
	}
	function onDocKey(e) { if (e.key === 'Escape') closeMenu(); }
	function paint(theme) {
		const th = THEMES.find(x => x.id === theme) || THEMES[0];
		swatch.style.background = `linear-gradient(135deg, ${th.swatch[0]} 50%, ${th.swatch[1]} 50%)`;
		label.textContent = t('theme.name.' + th.id);
	}
	function apply(theme) {
		if (!THEMES.some(x => x.id === theme)) theme = 'dark-immersive';
		stage.setAttribute('data-feed-theme', theme);
		paint(theme);
		try { localStorage.setItem(KEY, theme); } catch (e) {}
	}
	let saved = 'dark-immersive';
	try { saved = localStorage.getItem(KEY) || saved; } catch (e) {}
	apply(saved);
	dropBtn.addEventListener('click', (event) => {
		event.stopPropagation();
		if (openMenu) { closeMenu(); return; }
		const current = stage.getAttribute('data-feed-theme');
		const menu = document.createElement('div');
		menu.className = 'feed-menu feed-theme-menu';
		menu.setAttribute('role', 'menu');
		menu.setAttribute('aria-label', t('theme.menuHead'));
		menu.innerHTML = '<p class="feed-menu-head">' + t('theme.menuHead') + '</p>' + THEMES.map(th => {
			const active = th.id === current;
			return `<button type="button" class="feed-menu-item${active ? ' is-active' : ''}" data-theme-opt="${th.id}" role="menuitemradio" aria-checked="${active}">
				<span class="feed-menu-check">${active ? '<svg class="feed-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>' : ''}</span>
				<span class="feed-theme-swatch" style="background:linear-gradient(135deg, ${th.swatch[0]} 50%, ${th.swatch[1]} 50%)" aria-hidden="true"></span>
				<span>${t('theme.name.' + th.id)}</span></button>`;
		}).join('');
		dropWrap.append(menu);
		openMenu = menu;
		dropBtn.setAttribute('aria-expanded', 'true');
		menu.querySelectorAll('[data-theme-opt]').forEach(btn => {
			btn.addEventListener('click', (ev) => { ev.stopPropagation(); apply(btn.dataset.themeOpt); closeMenu(); });
		});
		document.addEventListener('click', onDocClick, true);
		document.addEventListener('keydown', onDocKey);
	});
})();

// B"H — Yaakov 2026-10-13 (TRACK E): language switcher. Six languages for
// the UI chrome only (Torah content untouched). Hebrew/Yiddish flip the
// feed stage to RTL via i18n.js. Retractable: outside click or Escape.
(function initFeedLang() {
	const dropBtn = document.getElementById('feed-lang-drop-btn');
	const dropWrap = document.getElementById('feed-lang-drop');
	const label = document.getElementById('feed-lang-drop-label');
	if (!dropBtn || !dropWrap) return;
	let openMenu = null;
	const CHECK = '<svg class="feed-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>';
	function closeMenu() {
		if (openMenu) { openMenu.remove(); openMenu = null; }
		dropBtn.setAttribute('aria-expanded', 'false');
		document.removeEventListener('click', onDocClick, true);
		document.removeEventListener('keydown', onDocKey);
	}
	function onDocClick(e) {
		if (openMenu && !openMenu.contains(e.target) && !dropWrap.contains(e.target)) closeMenu();
	}
	function onDocKey(e) { if (e.key === 'Escape') closeMenu(); }
	function paintLabel() {
		label.textContent = langInfo(currentLang()).native;
	}
	paintLabel();
	dropBtn.addEventListener('click', (event) => {
		event.stopPropagation();
		if (openMenu) { closeMenu(); return; }
		const current = currentLang();
		const menu = document.createElement('div');
		menu.className = 'feed-menu feed-lang-menu';
		menu.setAttribute('role', 'menu');
		menu.setAttribute('aria-label', t('lang.menuHead'));
		menu.innerHTML = '<p class="feed-menu-head">' + t('lang.menuHead') + '</p>' + LANGS.map(l => {
			const active = l.code === current;
			return `<button type="button" class="feed-menu-item${active ? ' is-active' : ''}" data-lang-opt="${l.code}" role="menuitemradio" aria-checked="${active}">
				<span class="feed-menu-check">${active ? CHECK : ''}</span>
				<span class="feed-lang-native" lang="${l.code}">${l.native}</span>
				<span class="feed-lang-name">${l.name}</span></button>`;
		}).join('');
		dropWrap.append(menu);
		openMenu = menu;
		dropBtn.setAttribute('aria-expanded', 'true');
		menu.querySelectorAll('[data-lang-opt]').forEach(btn => {
			btn.addEventListener('click', async (ev) => {
				ev.stopPropagation();
				closeMenu();
				await setLang(btn.dataset.langOpt);
			});
		});
		document.addEventListener('click', onDocClick, true);
		document.addEventListener('keydown', onDocKey);
	});
	// Static chrome repaints on language change; the theme button's label is
	// owned by the theme painter, so repaint it with the translated theme
	// name AFTER paintStatic (which would reset it to the generic "Theme").
	onLangChange(() => {
		paintLabel();
		paintStatic();
		const themeLabel = document.getElementById('feed-theme-drop-label');
		const theme = document.getElementById('feed-stage')?.getAttribute('data-feed-theme');
		if (themeLabel && theme) themeLabel.textContent = t('theme.name.' + theme);
	});
})();
</script>
