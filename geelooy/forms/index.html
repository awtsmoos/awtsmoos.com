<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Awtsmoos Forms — Awtsmoos</title>
	<meta http-equiv="refresh" content="0;url=/apps/forms/">
	<link rel="canonical" href="/apps/forms/">
	<script>
		const destination = new URL('/apps/forms/', location.origin);
		destination.search = location.search;
		destination.hash = location.hash;
		location.replace(destination);
	</script>
</head>
<body>
	<main>
		<h1>Awtsmoos Forms</h1>
		<p>This path continues into the form builder.</p>
