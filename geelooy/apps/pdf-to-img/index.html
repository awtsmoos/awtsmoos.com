<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Res PDF to Image Converter</title>
    <!-- PDF.js Library  -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
        <link rel="stylesheet" href="./styles.css">
        <link rel="stylesheet" href="../styles/awp-polish.css?v=awp-001">
    </head>
<body class="pdf-glass awp-app awp-app-pdf">
    <div class="awp-ambient" aria-hidden="true"></div>

    <div class="container">
        <header class="awp-reveal">
            <h1 class="awp-title-glow">PDF to Hi-Res Image</h1>
            <p class="subtitle">Drop files below. Maximum resolution. No stretching.</p>
        </header>

        <div class="drop-zone awp-card-lift" id="drop-zone">
            <i class="fa-regular fa-file-pdf"></i>
            <h3>Drag & Drop PDFs here</h3>
            <p>or click to browse</p>
            <input type="file" id="file-input" multiple accept="application/pdf">
        </div>

        <div class="controls" id="controls">
            <div class="stats" id="status-text">0 files loaded</div>
            <button class="btn awp-cta" id="convert-btn">
                <i class="fa-solid fa-bolt"></i> Convert & Download
            </button>
        </div>

        <div class="progress-container" id="progress-container">
            <div class="progress-bar" id="progress-bar"></div>
        </div>

        <div class="file-grid" id="file-grid">
            <!-- Items injected here -->
        </div>
    </div>

    <!-- Hidden canvas for heavy lifting -->
    <canvas id="hidden-canvas"></canvas>

    <script>
        // Setup PDF.js Worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const fileGrid = document.getElementById('file-grid');
        const controls = document.getElementById('controls');
        const statusText = document.getElementById('status-text');
        const convertBtn = document.getElementById('convert-btn');
        const progressBar = document.getElementById('progress-bar');
        const progressContainer = document.getElementById('progress-container');
        const hiddenCanvas = document.getElementById('hidden-canvas');
        const ctx = hiddenCanvas.getContext('2d');

        // Store loaded PDF data
        let pdfQueue = [];

        // --- Event Listeners ---

        dropZone.addEventListener('click', () => fileInput.click());
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        convertBtn.addEventListener('click', startConversion);

        // --- Core Logic ---

        async function handleFiles(files) {
            if (!files.length) return;

            for (let file of files) {
                if (file.type !== 'application/pdf') continue;
                
                // Read file
                const arrayBuffer = await file.arrayBuffer();
                
                try {
                    // Load PDF document
                    const loadingTask = pdfjsLib.getDocument(arrayBuffer);
                    const pdf = await loadingTask.promise;
                    
                    const id = Date.now() + Math.random().toString(36).substr(2, 9);
                    
                    const pdfData = {
                        id: id,
                        file: file,
                        pdfObj: pdf,
                        numPages: pdf.numPages,
                        fileName: file.name.replace('.pdf', '')
                    };

                    pdfQueue.push(pdfData);
                    
                    // Render UI Card
                    await createCard(pdfData);
                    
                } catch (error) {
                    console.error("Error loading PDF", error);
                    alert(`Could not load ${file.name}`);
                }
            }

            updateControls();
        }

        async function createCard(data) {
            const div = document.createElement('div');
            div.className = 'file-card awp-reveal';
            div.id = `card-${data.id}`;

            // Create canvas for thumbnail (Page 1 only)
            const canvas = document.createElement('canvas');
            const page = await data.pdfObj.getPage(1);
            
            // Thumbnail Scale (Low res for UI)
            const viewport = page.getViewport({ scale: 0.5 });
            canvas.width = viewport.width;
            canvas.height = viewport.height;

            await page.render({
                canvasContext: canvas.getContext('2d'),
                viewport: viewport
            }).promise;

            div.innerHTML = `
                <div class="preview-wrapper">
                    <!-- Canvas appended below -->
                </div>
                <div class="file-info">${data.fileName}</div>
                <div class="file-meta">
                    <span>${data.numPages} Pages</span>
                    <span style="color:var(--primary)">Ready</span>
                </div>
            `;
            
            div.querySelector('.preview-wrapper').appendChild(canvas);
            fileGrid.appendChild(div);
        }

        function updateControls() {
            if (pdfQueue.length > 0) {
                controls.classList.add('visible');
                const totalPages = pdfQueue.reduce((acc, item) => acc + item.numPages, 0);
                statusText.textContent = `${pdfQueue.length} Files (${totalPages} Total Pages)`;
            }
        }

        // --- Conversion Logic ---

        async function startConversion() {
            if (pdfQueue.length === 0) return;

            convertBtn.disabled = true;
            convertBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Processing...`;
            progressContainer.style.display = 'block';

            let totalPagesProcessed = 0;
            const globalTotalPages = pdfQueue.reduce((acc, item) => acc + item.numPages, 0);

            // Process Queue
            for (const item of pdfQueue) {
                const pdf = item.pdfObj;

                for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                    const page = await pdf.getPage(pageNum);
                    
                    // High Res Scale (3.0 = ~300 DPI for standard docs)
                    // This ensures max resolution without crashing browser memory
                    const viewport = page.getViewport({ scale: 3.0 });

                    hiddenCanvas.width = viewport.width;
                    hiddenCanvas.height = viewport.height;

                    // Render to hidden canvas
                    await page.render({
                        canvasContext: ctx,
                        viewport: viewport
                    }).promise;

                    // Convert to image blob
                    const blob = await new Promise(resolve => hiddenCanvas.toBlob(resolve, 'image/png'));
                    
                    // Download
                    downloadBlob(blob, `${item.fileName}_page-${pageNum}.png`);

                    // Update Progress
                    totalPagesProcessed++;
                    const pct = (totalPagesProcessed / globalTotalPages) * 100;
                    progressBar.style.width = `${pct}%`;

                    // Small delay to prevent browser freezing/blocking downloads
                    await new Promise(r => setTimeout(r, 200));
                }
            }

            // Reset
            convertBtn.disabled = false;
            convertBtn.innerHTML = `<i class="fa-solid fa-check"></i> Done!`;
            setTimeout(() => {
                convertBtn.innerHTML = `<i class="fa-solid fa-bolt"></i> Convert & Download`;
                progressBar.style.width = '0%';
                progressContainer.style.display = 'none';
            }, 3000);
        }

        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

    </script>
</body>
</html>
