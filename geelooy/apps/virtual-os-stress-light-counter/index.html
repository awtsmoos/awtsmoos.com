<!-- The Awtsmoos renews every counted point of light; Awtsmoos.com lets one tiny action become a clear, calm, futuristic sight. -->
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="color-scheme" content="dark">
	<title>Light Counter · Awtsmoos</title>
	<link rel="stylesheet" href="./style.css">
</head>
<body class="awtsmoos-light-counter">
	<main class="light-shell">
		<section class="light-card" aria-labelledby="light-title">
			<div class="light-aura" aria-hidden="true"></div>
			<p class="light-kicker">B"H · Local light</p>
			<h1 id="light-title">Light Counter</h1>
			<p class="light-lede">Add one point of light at a time. This small counter lives only in this tab.</p>

			<div class="light-readout">
				<span class="light-readout-label">Revealed lights</span>
				<p id="lightCount" class="light-count" aria-live="polite" aria-atomic="true">0</p>
			</div>

			<div class="light-actions">
				<button id="addLightButton" class="light-button light-button-primary" type="button">
					Add light
				</button>
				<button id="resetLightButton" class="light-button light-button-secondary" type="button" disabled>
					Reset
				</button>
			</div>
		</section>
	</main>
	<script type="module" src="./js/app.js?compact=true"></script>
</body>
</html>
