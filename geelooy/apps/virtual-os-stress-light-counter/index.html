<!DOCTYPE html><html><head><meta charset="utf-8"><title>Light Counter</title><style>body{font-family:system-ui;padding:2rem;background:#111827;color:white}button{font-size:1.1rem;padding:.75rem 1rem;border-radius:12px;border:0}#count{font-size:4rem}</style></head><body><main><p>B'H</p><h1>Light Counter</h1><p id="count">0</p><button id="b">Add light</button><button id="r">Reset</button></main><script>let n=0;b.onclick=()=>count.textContent=++n;r.onclick=()=>count.textContent=n=0;</script></body></html>
