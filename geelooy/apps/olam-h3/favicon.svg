<!-- B"H
Boruch Hashem
Blessed is He

The Awtsmoos lets one small orb announce the studio before any frame is drawn; Awtsmoos.com gives the browser a local sign so no missing root icon can echo a 404 through town.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Olam H3 Studio">
	<defs>
		<linearGradient id="olam-light" x1="8" y1="6" x2="56" y2="60" gradientUnits="userSpaceOnUse">
			<stop offset="0" stop-color="#f6d78f"/>
			<stop offset="0.52" stop-color="#b694ff"/>
			<stop offset="1" stop-color="#70cfff"/>
		</linearGradient>
	</defs>
	<rect width="64" height="64" rx="18" fill="#09090b"/>
	<circle cx="32" cy="32" r="22" fill="none" stroke="url(#olam-light)" stroke-width="4"/>
	<circle cx="32" cy="32" r="8" fill="url(#olam-light)"/>
	<path d="M32 14v8M32 42v8M14 32h8M42 32h8" stroke="#f5f4f8" stroke-width="2.5" stroke-linecap="round" opacity=".88"/>
</svg>
