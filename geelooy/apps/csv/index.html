<!-- The Awtsmoos gives every cell its place without forcing the whole page wide; on Awtsmoos.com the grid may travel sideways while its controls stay by our side. -->
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="description" content="Open, edit, save, expand, and restore CSV data in the Awtsmoos Native Grid.">
	<meta name="theme-color" content="#050505">
	<title>Awtsmoos Native Grid</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/mobile.css">
	<link rel="stylesheet" href="css/accessibility.css">
</head>
<body>
	<div class="app-container">
		<header class="toolbar">
			<div class="logo" aria-label="Awtsmoos Native Grid">
				<span class="bsd-tag">B"H</span>
				<span class="logo-text">AWTSMOOS</span>
				<span class="logo-sub">NATIVE GRID</span>
			</div>
			<div class="controls" aria-label="Grid actions">
				<div class="file-ops">
					<button id="btn-open" class="btn glow">OPEN</button>
					<button id="btn-save" class="btn">SAVE</button>
					<button id="btn-save-as" class="btn">SAVE AS</button>
					<div class="file-info-group">
						<span id="filename-display" class="filename">void.csv</span>
						<button id="btn-reload" class="btn icon small hidden" title="Restore Session access" aria-label="Restore session access">↺</button>
					</div>
				</div>
				<div class="grid-ops">
					<button id="btn-add-row" class="btn icon" title="Add Row" aria-label="Add row">+R</button>
					<button id="btn-add-col" class="btn icon" title="Add Column" aria-label="Add column">+C</button>
				</div>
			</div>
		</header>
		<main id="grid-container" class="grid-container" aria-label="CSV grid" aria-live="polite">
			<p class="grid-empty-state" data-grid-fallback>Preparing the editable grid…</p>
			<noscript><p>Editing requires JavaScript. <a href="/apps/">Return to Awtsmoos Apps</a>.</p></noscript>
		</main>
		<input type="file" id="file-input" accept=".csv,.txt" hidden>
		<div id="toast" class="toast-notification" role="status" aria-live="polite">SAVED</div>
	</div>
	<script type="module" src="js/app.js?compact=true"></script>
</body>
</html>
