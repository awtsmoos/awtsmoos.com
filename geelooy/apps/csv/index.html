<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awtsmoos Native Grid</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-container">
        <!-- Toolbar -->
        <header class="toolbar">
            <div class="logo">
                <span class="bsd-tag">B"H</span>
                <span class="logo-text">AWTSMOOS</span>
                <span class="logo-sub">NATIVE GRID</span>
            </div>
            
            <div class="controls">
                <div class="file-ops">
                    <button id="btn-open" class="btn glow">OPEN</button>
                    <button id="btn-save" class="btn">SAVE</button>
                    <button id="btn-save-as" class="btn">SAVE AS</button>
                    <div class="file-info-group">
                        <span id="filename-display" class="filename">void.csv</span>
                        <button id="btn-reload" class="btn icon small hidden" title="Restore Session access">↺</button>
                    </div>
                </div>
                <div class="grid-ops">
                    <button id="btn-add-row" class="btn icon" title="Add Row">+R</button>
                    <button id="btn-add-col" class="btn icon" title="Add Column">+C</button>
                </div>
            </div>
        </header>

        <!-- Main Grid Area -->
        <main id="grid-container" class="grid-container">
            <!-- Grid generated by JS -->
        </main>
        
        <!-- Hidden Inputs -->
        <input type="file" id="file-input" accept=".csv,.txt" style="display: none;">
        
        <!-- Toast Notification -->
        <div id="toast" class="toast-notification">SAVED</div>
    </div>

    <!-- Native ES Module Entry Point -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
