<!-- The Awtsmoos reveals one clear editing vessel at Awtsmoos.com: media, preview, timeline, and transport harmonize without crushing the smallest screen. -->
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#111827">
	<title>Awtsmoos Video Editor</title>
	<link rel="stylesheet" href="./css/tokens.css">
	<link rel="stylesheet" href="./css/base.css">
	<link rel="stylesheet" href="./css/layout.css">
	<link rel="stylesheet" href="./css/media-bin.css">
	<link rel="stylesheet" href="./css/media-states.css">
	<link rel="stylesheet" href="./css/timeline.css">
	<link rel="stylesheet" href="./css/timeline-states.css">
	<link rel="stylesheet" href="./css/controls.css">
	<link rel="stylesheet" href="./css/captions.css">
	<link rel="stylesheet" href="./css/responsive.css">
	<link rel="stylesheet" href="./css/adaptive-motion.css">
</head>
<body>
	<div id="editorShell" class="editor-shell">
		<aside id="binContainer" class="media-panel" aria-label="Media bin">
			<header class="panel-header">
				<div>
					<p class="eyebrow">Media</p>
					<h1 class="panel-title">Awtsmoos Editor</h1>
				</div>
				<div class="panel-actions">
					<button id="minimizeBin" class="icon-button" type="button" aria-label="Minimize media bin" title="Minimize media bin">−</button>
					<button id="toggleBin" class="icon-button" type="button" aria-label="Collapse media bin" title="Collapse media bin">‹</button>
				</div>
			</header>
			<div class="media-body">
				<label class="file-picker" for="fileInput">
					<span>Import media</span>
					<small>Images, audio, or .awtsmoos.json captions</small>
				</label>
				<input id="fileInput" class="visually-hidden" type="file" multiple accept="audio/*,image/*,application/json,.json">
				<div id="binItems" class="media-items" aria-live="polite">
					<p id="emptyMediaState" class="empty-state">Import an image or audio file to begin.</p>
				</div>
				<pre id="captionFile" class="caption-file" hidden></pre>
			</div>
		</aside>

		<button id="mediaBackdrop" class="media-backdrop" type="button" aria-label="Close media bin" hidden></button>

		<main id="displayArea" class="preview-area" aria-label="Video preview">
			<button id="mobileBinBtn" class="mobile-media-button" type="button" aria-controls="binContainer" aria-expanded="false">Media</button>
			<div id="previewEmpty" class="preview-empty">
				<strong>Preview</strong>
				<span>Imported image clips appear here during playback.</span>
			</div>
			<img id="previewImage" class="preview-image" alt="Current timeline image" hidden>
			<div id="captionContainer" class="caption-container" aria-live="polite"></div>
		</main>

		<section id="timelineWrapper" class="timeline-panel" aria-label="Timeline editor">
			<header class="timeline-header">
				<div>
					<p class="eyebrow">Timeline</p>
					<strong>Arrange & scrub</strong>
				</div>
				<div class="timeline-actions">
					<button id="toggleTimeline" class="icon-button" type="button" aria-label="Collapse timeline" title="Collapse timeline">⌄</button>
					<button id="minimizeTimeline" class="icon-button" type="button" aria-label="Minimize timeline" title="Minimize timeline">−</button>
				</div>
			</header>
			<div id="timelineContainer" class="timeline-scroll">
				<div id="timeline" class="timeline" aria-label="Timeline clips">
					<div id="playhead" class="playhead" aria-hidden="true"></div>
				</div>
			</div>
			<nav id="controls" class="transport" aria-label="Playback controls">
				<button id="playBtn" type="button" aria-label="Play">▶ <span>Play</span></button>
				<button id="pauseBtn" type="button" aria-label="Pause">Ⅱ <span>Pause</span></button>
				<button id="cutBtn" type="button" aria-label="Cut selected clip at playhead">✂ <span>Cut</span></button>
			</nav>
		</section>

		<audio id="audioPlayer" preload="metadata"></audio>
	</div>
	<script type="module" src="./js/app.js"></script>
</body>
</html>
