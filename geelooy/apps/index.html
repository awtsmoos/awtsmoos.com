<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Awtsmoos Apps - UNSTABLE CORE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@800&display=swap" rel="stylesheet">

    <style>
        /*
        ================================================================================
        I. CORE AESTHETICS - EXTREME & UNSTABLE
        - I will not style body/html directly to ensure template purity,
          but will use a pseudo-element for the background.
        ================================================================================
        */
        :root {
            --color-core-1: #ff4800; /* Molten Orange */
            --color-core-2: #ff8c00; /* Dark Orange */
            --color-bg-1: #12000a;   /* Deepest Magenta */
            --color-bg-2: #2e081c;
            --color-text: #f0f0f0;
            --font-main: 'Exo 2', sans-serif;
        }

        /* The background is a fixed pseudo-element on the root. */
        html::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: 0;
            background: radial-gradient(circle at center, var(--color-bg-2), var(--color-bg-1));
            background-size: 200% 200%;
            animation: roil 20s ease-in-out infinite alternate;
        }

        /* A second pseudo-element for the interactive cursor flare */
        html::after {
            content: '';
            position: fixed;
            top: var(--y, 50%); left: var(--x, 50%);
            transform: translate(-50%, -50%);
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(255, 140, 0, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
            transition: top 0.1s linear, left 0.1s linear;
        }
        
        @keyframes roil {
            from { background-position: 0% 50%; }
            to { background-position: 100% 50%; }
        }

        

        /*
        ================================================================================
        III. CONTENT STYLES (INSIDE .main) - PURE CHAOS
        ================================================================================
        */
        
        /* THE LOGO - CRACKING, MOLTEN, AND EXTREME */
        .main .logo {
            font-family: var(--font-main);
            font-weight: 800;
            font-size: clamp(3rem, 10vw, 7rem);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-text);
            margin-bottom: 4rem;
            position: relative;
            /* Multi-layered shadow for a hot, pulsing glow from within */
            text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--color-core-1), 0 0 30px var(--color-core-1);
            animation: pulse 4s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--color-core-1), 0 0 30px var(--color-core-1); }
            50% { text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px var(--color-core-2), 0 0 40px var(--color-core-2); }
        }
        
        /* Animated cracking texture overlay */
        .main .logo::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: repeating-linear-gradient(45deg,
                transparent 0, transparent 20px,
                rgba(0,0,0,0.5) 20px, rgba(0,0,0,0.5) 22px);
            mix-blend-mode: multiply;
            opacity: 0.8;
            animation: crackle 30s linear infinite;
        }
        @keyframes crackle {
            from { background-position: 0 0; }
            to { background-position: 1000px 0; }
        }


        /* THE NAVIGATION - SHATTERED VOLCANIC SHARDS */
        .main .about {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 1.5rem;
        }
        
        .main .about a {
            font-family: var(--font-main);
            font-weight: 800;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            text-transform: uppercase;
            padding: 1.25rem 2.5rem;
            position: relative;
            border: 2px solid rgba(255,100,0,0.5);
            background: linear-gradient(135deg, #1a1a1a, #0d0d0d);
            transition: transform 0.2s ease, box-shadow 0.2s ease, color 0.2s ease;

            /* The EXTREME shattered shape */
            clip-path: polygon(0 15%, 100% 0, 100% 85%, 0 100%);
        }

        /* Staggered shapes for a more chaotic look */
        .main .about a:nth-child(2n) {
            clip-path: polygon(0 0, 100% 15%, 100% 100%, 0 85%);
        }

        .main .about a:hover {
            color: #ffffff;
            transform: scale(1.1) rotate(1deg);
            /* IGNITE on hover */
            box-shadow: 0 0 20px var(--color-core-1), 0 0 30px var(--color-core-1);
            border-color: var(--color-core-2);
            animation: jitter 0.2s infinite;
        }
        
        @keyframes jitter {
            0% { transform: scale(1.1) translate(1px, -1px) rotate(1deg); }
            50% { transform: scale(1.1) translate(-1px, 1px) rotate(-1deg); }
            100% { transform: scale(1.1) translate(1px, -1px) rotate(1deg); }
        }

    </style>
</head>

    <script>
        // Tiny script for the EXTREME reactive cursor flare. No libraries.
        document.addEventListener('mousemove', (e) => {
            document.documentElement.style.setProperty('--x', `${e.clientX}px`);
            document.documentElement.style.setProperty('--y', `${e.clientY}px`);
        });
    </script>
