<head>
    <meta charset="UTF-8">

    <title>Chrystalis Interface (Corrected)</title>
    
    
    <style>
        /*
        ================================================================================
        I. CORE SETUP & SERVER TEMPLATE COMPATIBILITY
        - Body/HTML styles are minimal.
        - The .main div is now the primary container for layout and effects.
        ================================================================================
        */
        :root {
            --color-background: #04020a;
            --color-crystal-dark: #100a1f;
            --color-glow-1: #ff00c1;
            --color-glow-2: #00e5ff;
            --font-main: 'Exo 2', sans-serif;
            
            --turbulence-frequency: 0.02;
            --turbulence-octaves: 1;
        }

        

        
        
       

        /*
        ================================================================================
        II. THE CHRYSTALIS MATERIAL & ELEMENTS (UNCHANGED LOGIC, SCOPED TO .main)
        - All elements are visible on load, contained within .main.
        ================================================================================
        */

        .svg-filter-container {
            position: absolute; width: 0; height: 0; visibility: hidden;
        }

        .chrystalis-element {
            position: relative;
            text-transform: uppercase;
            text-align: center;
            font-weight: 800;
            filter: url(#chrystalis-surface);
          }
        
        .chrystalis-title {
            font-size: clamp(2.5rem, 10vw, 4rem);
            letter-spacing: 0.1em;
        }

        .chrystalis-nav {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.5rem;
        }

        .chrystalis-button {
            width: 100%;
            padding: 1.5rem 2rem;
            font-size: 1.25rem;
            letter-spacing: 0.05em;
            text-decoration: none;
            color: white;
            background-color: var(--color-crystal-dark);
            border: 2px solid rgba(255, 255, 255, 0.4);
                   transition: 
                transform 0.2s ease, 
                      --turbulence-frequency 0.3s ease;
        }

        /* FRACTURED EDGES (Default Subtle Glitch) */
        .chrystalis-element::before,
        .chrystalis-element::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--color-background);
            overflow: hidden;
        }
        .chrystalis-button::before,
        .chrystalis-button::after {
             background: var(--color-crystal-dark);
        }

        .chrystalis-element::before {
            nimation: glitch-subtle-1 3s infinite linear alternate-reverse;
        }

        .chrystalis-element::after {
             animation: glitch-subtle-2 2s infinite linear alternate-reverse;
        }

        @keyframes glitch-subtle-1 {
            0% { clip-path: inset(85% 0 10% 0); } 100% { clip-path: inset(10% 0 85% 0); }
        }
        @keyframes glitch-subtle-2 {
            0% { clip-path: inset(5% 0 90% 0); } 100% { clip-path: inset(90% 0 5% 0); }
        }

        /*
        ================================================================================
        III. THE INTERACTION: THE CATALYST (HOVER & ACTIVE STATE)
        ================================================================================
        */
        
        .chrystalis-button:is(:hover, :active) {
            cursor: pointer;
            transform: translateY(-5px) scale(1.02);
            box-shadow: inset 0 0 30px var(--color-glow-2), 0 0 25px var(--color-glow-1);
            --turbulence-frequency: 0.1;
            --turbulence-octaves: 5;
        }

        .chrystalis-element:is(:hover, :active)::before {
            text-shadow: -2px 0 var(--color-glow-1);
            animation: glitch-intense-1 0.5s infinite linear;
        }

        .chrystalis-element:is(:hover, :active)::after {
            text-shadow: 2px 0 var(--color-glow-2);
            animation: glitch-intense-2 0.7s infinite linear;
        }

        @keyframes glitch-intense-1 {
            0% { clip-path: inset(45% 0 50% 0); transform: translate(-5px, 0); } 20% { clip-path: inset(10% 0 85% 0); transform: translate(3px, 2px); } 40% { clip-path: inset(70% 0 20% 0); transform: translate(-2px, -3px); } 60% { clip-path: inset(95% 0 2% 0); transform: translate(5px, 0); } 80% { clip-path: inset(30% 0 45% 0); transform: translate(1px, 4px); } 100% { clip-path: inset(60% 0 35% 0); transform: translate(-3px, -1px); }
        }
        @keyframes glitch-intense-2 {
            0% { clip-path: inset(80% 0 10% 0); transform: translate(5px, -3px); } 15% { clip-path: inset(20% 0 75% 0); transform: translate(-1px, 2px); } 30% { clip-path: inset(55% 0 40% 0); transform: translate(3px, -1px); } 45% { clip-path: inset(5% 0 90% 0); transform: translate(-5px, 2px); } 60% { clip-path: inset(85% 0 5% 0); transform: translate(2px, -3px); } 75% { clip-path: inset(40% 0 58% 0); transform: translate(-3px, 1px); } 100% { clip-path: inset(70% 0 25% 0); transform: translate(1px, -2px); }
        }
        
        /*
        ================================================================================
        IV. THE ACTIVATION: THE SHATTER (NOW CONFINED TO .main)
        ================================================================================
        */
        .shatter-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            overflow: hidden; /* Redundant due to .main's overflow, but good practice */
        }
        
        .shard {
            position: absolute;
            width: 10px; height: 10px;
            background: white;
            clip-path: polygon(50% 0%, 100% 100%, 0% 100%);
            animation: shatter-fly 1s ease-out forwards;
        }
        
        @keyframes shatter-fly {
            0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
            100% { transform: var(--shard-end-transform); opacity: 0; }
        }
    </style>
</head>
