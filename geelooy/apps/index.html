
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awtsmoos - Quantum Foam</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@500;700&display=swap" rel="stylesheet">

    <style>
        /*
        ================================================================================
        I. CORE SETUP & THEME
        - Defines the foundational colors, fonts, and timings for the entire experience.
        ================================================================================
        */
        :root {
            --color-void: #020008;
            --color-light: #f0f8ff; /* Alice Blue - a very light, slightly cool white */
            --color-noise-1: #ff005d;
            --color-noise-2: #00ffff;
            
            --font-main: 'Exo 2', sans-serif;

            /* These are updated by JavaScript to track the user's focus */
            --cursor-x: 50vw;
            --cursor-y: 50vh;
            --cursor-size: 150px;
        }

        /* Basic reset and page setup */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevent scrollbars */
            background-color: var(--color-void);
            font-family: var(--font-main);
            color: var(--color-light);
        }

        /*
        ================================================================================
        II. THE ENVIRONMENT: THE SEA OF POTENTIAL & THE COHERENCE FIELD
        - The body's pseudo-elements create the core environmental effects.
        ================================================================================
        */

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* Layer 1: The Quantum Foam (Chromatic Noise) */
        body::before {
            content: '';
            position: absolute;
            inset: -50%; /* Make it huge to avoid edge artifacts when animating */
            z-index: 0;
            background-image:
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10"><rect width="10" height="10" fill="none" /><circle cx="1" cy="1" r="0.5" fill-opacity="0.5" fill-rule="evenodd" fill="%23ff005d" /><circle cx="5" cy="8" r="0.5" fill-opacity="0.5" fill-rule="evenodd" fill="%2300ffff" /><circle cx="8" cy="2" r="0.5" fill-opacity="0.5" fill-rule="evenodd" fill="%23f0f8ff" /></svg>');
            animation: foam-shimmer 0.2s linear infinite;
            opacity: 0.5;
        }

        @keyframes foam-shimmer {
            0% { transform: translate(0, 0); }
            10% { transform: translate(-1px, 1px); }
            20% { transform: translate(1px, -1px); }
            /* ... add more steps for more randomness ... */
            100% { transform: translate(0px, 1px); }
        }

        /* Layer 2: The Coherence Field (The User's Focus) */
        body::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: 1;
            /* A radial gradient that is transparent at the cursor and solid everywhere else */
            background: radial-gradient(
                circle at var(--cursor-x) var(--cursor-y),
                rgba(2, 0, 8, 0) 0,
                rgba(2, 0, 8, 0) var(--cursor-size),
                var(--color-void) calc(var(--cursor-size) + 50px)
            );
            transition: --cursor-size 0.3s ease; /* Animate the field size for effect */
        }
        
        /* On mobile, the "cursor" size is smaller */
        @media (max-width: 768px) {
            :root {
                --cursor-size: 75px;
            }
        }


        /*
        ================================================================================
        III. CONTENT & NAVIGATION
        - The main content container that sits above the foam.
        - The probability clouds and their transformation on observation.
        ================================================================================
        */
        .main-content {
            position: relative;
            z-index: 2; /* Sits above the foam and field */
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4rem;
            text-align: center;
        }

        .logo {
            font-weight: 700;
            font-size: clamp(2rem, 8vw, 4rem);
            text-transform: uppercase;
            letter-spacing: 0.2em;
            /* The prismatic effect: sharp, multi-colored shadows */
            text-shadow:
                2px 2px 0 var(--color-noise-1),
                -2px -2px 0 var(--color-noise-2);
        }

        .app-navigation {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2.5rem;
        }

        /* THE PROBABILITY CLOUDS (Default State) */
        .probability-cloud {
            position: relative;
            width: 180px;
            height: 100px;
            color: transparent; /* Text is hidden by default */
            text-decoration: none;
            
            /* The nebulous, blurry shape */
            background: radial-gradient(circle, rgba(240, 248, 255, 0.1), transparent 60%);
            border-radius: 50%;
            filter: blur(12px);
            opacity: 0.6;
            
            /* A slow, gentle pulse */
            animation: cloud-pulse 8s ease-in-out infinite alternate;
            
            /* This is the key: a very fast transition for the collapse */
            transition: all 0.2s cubic-bezier(0.2, 1, 0.2, 1);
        }

        @keyframes cloud-pulse {
            from { transform: scale(0.95); opacity: 0.5; }
            to { transform: scale(1.05); opacity: 0.7; }
        }

        /* THE ACT OF OBSERVATION (Hover State) */
        .app-navigation:has(.probability-cloud:hover) .probability-cloud:not(:hover) {
            /* When observing one cloud, the others fade into the background */
            filter: blur(20px);
            opacity: 0.2;
            transform: scale(0.9);
        }
        
        .probability-cloud:hover {
            /* The state collapses into a definite form */
            filter: blur(0);
            opacity: 1;
            background: transparent;
            border-radius: 0;
            transform: scale(1.1); /* Pop slightly to reward the user */
            
            /* The Hexagonal shape, formed by clip-path */
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            animation: none; /* Stop the pulsing animation */
        }
        
        /* The glowing border that appears on observation */
        .probability-cloud:hover::before {
            content: '';
            position: absolute;
            inset: 0;
            clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%);
            border: 2px solid var(--color-light);
            box-shadow: 0 0 15px var(--color-light), inset 0 0 10px var(--color-noise-2);
            animation: border-flicker 2s linear infinite;
        }

        /* The text that appears inside, from the data-text attribute */
        .probability-cloud:hover::after {
            content: attr(data-text);
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            
            color: var(--color-light);
            font-weight: 500;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            text-shadow: 0 0 8px var(--color-light);
        }
        
        @keyframes border-flicker {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        /*
        ================================================================================
        IV. ACTIVATION: THE QUANTUM TUNNEL
        - This class is added by JavaScript on click to trigger the transition.
        ================================================================================
        */
        .tunnel-effect {
            position: fixed; /* Take over the whole screen */
            z-index: 9999;
            animation: quantum-tunnel 0.7s cubic-bezier(0.8, 0, 0.2, 1) forwards;
        }

        @keyframes quantum-tunnel {
            0% {
                transform: scale(1.1);
                opacity: 1;
            }
            100% {
                transform: scale(100);
                opacity: 0;
            }
        }

    </style>
</head>
<body>

    <main class="main-content">
        <h1 class="logo">Awtsmoos Apps</h1>

        <nav class="app-navigation">
            <a href="./code" class="probability-cloud" data-text="Code Editor"></a>
            <a href="./piano" class="probability-cloud" data-text="Piano/Synth"></a>
            <a href="/os" class="probability-cloud" data-text="Awtsmoos OS"></a>
        </nav>
    </main>

    <script>
        // This script handles the interactive parts: the Coherence Field and the Quantum Tunnel.
        
        const body = document.body;

        // 1. UPDATE THE COHERENCE FIELD ON USER MOVEMENT
        function updateCoherenceField(e) {
            // For touch events, use the first touch point
            const x = e.touches ? e.touches[0].clientX : e.clientX;
            const y = e.touches ? e.touches[0].clientY : e.clientY;

            body.style.setProperty('--cursor-x', `${x}px`);
            body.style.setProperty('--cursor-y', `${y}px`);
        }

        window.addEventListener('mousemove', updateCoherenceField);
        window.addEventListener('touchmove', updateCoherenceField);
        window.addEventListener('touchstart', updateCoherenceField);


        // 2. TRIGGER THE QUANTUM TUNNEL ON CLICK
        document.querySelectorAll('.probability-cloud').forEach(link => {
            link.addEventListener('click', function(e) {
                // Prevent the browser from navigating immediately
                e.preventDefault();
                
                const destination = this.href;

                // Clone the element to create the tunnel effect without affecting the original
                const tunnel = this.cloneNode(true);
                
                // Get its position to place the clone exactly on top
                const rect = this.getBoundingClientRect();
                tunnel.style.position = 'fixed';
                tunnel.style.left = `${rect.left}px`;
                tunnel.style.top = `${rect.top}px`;
                tunnel.style.margin = '0'; // Reset any margins

                // Add the tunnel to the body and trigger the animation
                body.appendChild(tunnel);
                tunnel.classList.add('tunnel-effect');

                // After the animation finishes, navigate to the page
                setTimeout(() => {
                    window.location.href = destination;
                }, 700); // Must match the animation duration
            });
        });

    </script>
</body>
</html>
