<head>

    <title>Awtsmoos Apps - UNSTABLE CORE v3 (Singularity)</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@900&display=swap" rel="stylesheet">

    <style>
        /*
        ================================================================================
        I. CORE AESTHETICS - SINGULARITY EVENT
        - The environment is now a multi-layered cosmic event, adding scanlines
          and a global "power surge" animation for a more immersive, unstable feel.
        ================================================================================
        */
        :root {
            --color-core-1: #ff2a00;      /* Plasma Red */
            --color-core-2: #ff8c00;      /* Fusion Orange */
            --color-accent: #7f00ff;      /* Aether Violet */
            --color-glitch: #00e5ff;     /* Cherenkov Blue */
            --color-bg-1: #0a000c;        /* Void Black */
            --color-bg-2: #1a021f;        /* Deep Space Purple */
            --font-main: 'Exo 2', sans-serif;
        }

        /* Layer 1: The roiling nebula background */
        html::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -3;
            background: radial-gradient(circle at center, var(--color-bg-2), var(--color-bg-1));
            background-size: 200% 200%;
            animation: roil 20s ease-in-out infinite alternate;
        }

        /* Layer 2: Drifting starfield */
        html::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><circle fill="%23FFF" cx="150" cy="150" r="1.5"/><circle fill="%23FFF" cx="800" cy="200" r="1"/><circle fill="%23FFF" cx="500" cy="900" r="1.2"/><circle fill="%23FFF" cx="300" cy="750" r="0.8"/><circle fill="%23FFF" cx="900" cy="650" r="1.1"/><circle fill="%23FFF" cx="50" cy="500" r="1.3"/><circle fill="%23FFF" cx="450" cy="300" r="0.9"/><circle fill="%23FFF" cx="700" cy="800" r="1.4"/></svg>');
            background-size: 500px 500px;
            opacity: 0.1;
            animation: drift 100s linear infinite;
        }
        
        /* NEW - Layer 3: Unstable scanlines overlay */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            background: linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 100% 3px;
            animation: scanlines 0.3s linear infinite;
        }
        
        /* NEW - Global power surge effect */
        body {
            animation: power-surge 15s ease-in-out infinite;
        }

        @keyframes roil {
            from { background-position: 0% 50%; }
            to { background-position: 100% 50%; }
        }

        @keyframes drift {
            from { transform: translate(0, 0); }
            to { transform: translate(-500px, 500px); }
        }
        
        @keyframes scanlines {
            from { background-position: 0 0; }
            to { background-position: 0 3px; }
        }
        
        @keyframes power-surge {
            0%, 100% { filter: brightness(1) saturate(1); }
            50% { filter: brightness(1.1) saturate(1.2); }
            52% { filter: brightness(0.9) saturate(1); }
            54% { filter: brightness(1.2) saturate(1.1); }
        }

        /*
        ================================================================================
        III. CONTENT STYLES - COLLAPSING REALITY
        ================================================================================
        */
        
        /* THE LOGO - A FRACTURED, GLITCHING STAR */
        .main .logo {
            font-family: var(--font-main);
            font-weight: 900;
            font-size: clamp(3.5rem, 12vw, 9rem);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-text);
            margin-bottom: 6rem;
            position: relative;
            text-align: center;
            animation: logo-flicker 5s infinite ease-in-out;
        }
        
        /* Primary text is now the source of the chromatic aberration */
        @keyframes logo-flicker {
            0%, 100% {
                text-shadow: 0 0 5px #fff, 0 0 15px var(--color-core-1), 0 0 25px var(--color-core-1);
            }
            50% {
                text-shadow: 0 0 8px #fff, 0 0 20px var(--color-core-2), 0 0 35px var(--color-core-2);
            }
            50.1% { /* NEW - Add a split-second chromatic aberration flash */
                text-shadow: 2px 0px 1px var(--color-glitch), -2px 0px 1px var(--color-accent);
                color: #ddd;
            }
        }
        
        /* Glitch Layer 1 */
        .main .logo::before {
            content: attr(data-text);
            position: absolute;
            left: 0; right: 0;
            text-shadow: -2px 0 var(--color-accent);
            mix-blend-mode: screen;
            animation: glitch-1 4s infinite linear alternate-reverse;
        }
        
        /* Glitch Layer 2 */
        .main .logo::after {
            content: attr(data-text);
            position: absolute;
            left: 0; right: 0;
            text-shadow: 2px 0 var(--color-glitch);
            mix-blend-mode: screen;
            animation: glitch-2 6s infinite linear alternate-reverse;
        }

        @keyframes glitch-1 {
            0% { clip-path: inset(45% 0 50% 0); transform: translate(0.05em, -0.01em); }
            20% { clip-path: inset(10% 0 85% 0); transform: translate(-0.02em, 0.02em); }
            40% { clip-path: inset(70% 0 20% 0); transform: translate(0.01em, -0.03em); }
            60% { clip-path: inset(95% 0 2% 0); transform: translate(-0.03em, 0.01em); }
            80% { clip-path: inset(30% 0 45% 0); transform: translate(0.02em, -0.01em); }
            100% { clip-path: inset(60% 0 35% 0); transform: translate(-0.01em, 0.03em); }
        }
        @keyframes glitch-2 {
            0% { clip-path: inset(80% 0 10% 0); transform: translate(-0.04em, 0.03em); }
            15% { clip-path: inset(20% 0 75% 0); transform: translate(0.01em, -0.02em); }
            30% { clip-path: inset(55% 0 40% 0); transform: translate(0.03em, 0.01em); }
            45% { clip-path: inset(5% 0 90% 0); transform: translate(-0.01em, 0.02em); }
            60% { clip-path: inset(85% 0 5% 0); transform: translate(0.02em, -0.03em); }
            75% { clip-path: inset(40% 0 58% 0); transform: translate(-0.03em, 0.01em); }
            100% { clip-path: inset(70% 0 25% 0); transform: translate(0.01em, -0.02em); }
        }

        /* THE NAVIGATION - FLOATING, UNSTABLE REALITY SHARDS */
        .main .about {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2.5rem;
            perspective: 1000px;
        }
        
        .main .about a {
            font-family: var(--font-main);
            font-weight: 900;
            font-size: clamp(1rem, 2.2vw, 1.2rem);
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            text-transform: uppercase;
            padding: 1.5rem 3rem;
            position: relative;
            border: 2px solid rgba(255,255,255,0.1);
            background: linear-gradient(145deg, rgba(31, 1, 34, 0.4), rgba(13, 0, 15, 0.4));
            backdrop-filter: blur(8px);
            transition: transform 0.3s cubic-bezier(0.2, 1, 0.2, 1);
            transform-style: preserve-3d;
            /* NEW - Add a subtle floating animation */
            animation: float 8s ease-in-out infinite;
        }
        
        /* Make each shard float on a slightly different cycle */
        .main .about a:nth-child(2) { animation-delay: -2s; }
        .main .about a:nth-child(3) { animation-delay: -4s; }
        .main .about a:nth-child(4) { animation-delay: -6s; }

        @keyframes float {
            0%, 100% { transform: translateZ(0) translateY(0) rotateX(0); }
            50% { transform: translateZ(10px) translateY(-8px) rotateX(2deg); }
        }

        /* The glowing border effect, now more intense */
        .main .about a::before {
            content: '';
            position: absolute;
            inset: -2px;
            z-index: -1;
            background: conic-gradient(from var(--angle), transparent 40%, var(--color-core-1), var(--color-glitch), var(--color-accent));
            filter: blur(2px);
            animation: spin 5s linear infinite;
            --angle: 0deg;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        
        .main .about a:hover::before {
            opacity: 1;
        }
        
        .main .about a:hover {
            color: #ffffff;
            /* NEW - A more violent, "insane" hover animation */
            animation: float 8s ease-in-out infinite, shard-activate 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        
        @keyframes shard-activate {
            0% { transform: translateZ(10px) translateY(-8px) scale(1); }
            100% { transform: translateZ(50px) translateY(-10px) scale(1.1) rotateX(5deg) rotateY(-2deg); }
        }
        
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }
        
        @keyframes spin {
            to { --angle: 360deg; }
        }
    </style>
