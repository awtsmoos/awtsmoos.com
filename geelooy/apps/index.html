    <style>
        /*
        ================================================================================
        I. CORE AESTHETICS - REFINED CHAOS & INTENSE ENERGY
        - The foundational aesthetic is now more dynamic, with multiple layers of
          animation to create a sense of deep, cosmic instability.
        ================================================================================
        */
        :root {
            --color-core-1: #ff3c00;      /* Blazing Sun Orange */
            --color-core-2: #ff7b00;      /* Supernova Gold */
            --color-accent: #e500ff;      /* Volatile Violet */
            --color-bg-1: #0d000f;        /* Abyssal Purple */
            --color-bg-2: #1f0122;        /* Deep Nebula */
            --color-text: #fafafa;
            --font-main: 'Exo 2', sans-serif;
        }

        /* The background is a fixed pseudo-element on the root. */
        html::before {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -2;
            background: radial-gradient(circle at center, var(--color-bg-2), var(--color-bg-1));
            background-size: 200% 200%;
            animation: roil 25s ease-in-out infinite alternate;
        }

        /* A second pseudo-element for a cosmic dust/starfield effect */
        html::after {
            content: '';
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            background-image: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000"><circle fill="%23FFF" cx="150" cy="150" r="1.5"/><circle fill="%23FFF" cx="800" cy="200" r="1"/><circle fill="%23FFF" cx="500" cy="900" r="1.2"/><circle fill="%23FFF" cx="300" cy="750" r="0.8"/><circle fill="%23FFF" cx="900" cy="650" r="1.1"/><circle fill="%23FFF" cx="50" cy="500" r="1.3"/><circle fill="%23FFF" cx="450" cy="300" r="0.9"/><circle fill="%23FFF" cx="700" cy="800" r="1.4"/></svg>');
            background-size: 500px 500px;
            opacity: 0.15;
            animation: drift 120s linear infinite;
        }
        
        @keyframes roil {
            from { background-position: 0% 50%; }
            to { background-position: 100% 50%; }
        }

        @keyframes drift {
            from { transform: translate(0, 0); }
            to { transform: translate(-500px, -500px); }
        }

        /*
        ================================================================================
        III. CONTENT STYLES - PROFOUND & INSANE
        ================================================================================
        */
        
        /* THE LOGO - A SINGULARITY OF POWER */
        .main .logo {
            font-family: var(--font-main);
            font-weight: 900;
            font-size: clamp(3.5rem, 12vw, 8rem);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-text);
            margin-bottom: 5rem;
            position: relative;
            text-align: center;
            animation: core-flicker 8s infinite ease-in-out;
            transform-style: preserve-3d; /* Enable 3D transformations */
        }
        
        /* Static base glow */
        .main .logo::before {
            content: attr(data-text); /* Use data-text for duplication */
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: -1;
            color: var(--color-core-1);
            filter: blur(15px);
            opacity: 0.8;
        }
        
        /* The unstable, glitching energy layer */
        .main .logo::after {
            content: attr(data-text);
            position: absolute;
            top: 0; left: 0; right: 0;
            z-index: -2;
            color: var(--color-accent);
            text-shadow: -3px 0 var(--color-core-2), 3px 0 var(--color-accent);
            mix-blend-mode: screen;
            animation: glitch 5s linear infinite alternate-reverse;
        }

        @keyframes core-flicker {
            0%, 100% {
                text-shadow: 0 0 5px #fff, 0 0 15px var(--color-core-1), 0 0 25px var(--color-core-1);
                transform: scale(1) perspective(1000px) rotateY(0deg);
            }
            50% {
                text-shadow: 0 0 10px #fff, 0 0 20px var(--color-core-2), 0 0 35px var(--color-core-2);
                transform: scale(1.02) perspective(1000px) rotateY(1deg);
            }
        }
        
        @keyframes glitch {
            0% { clip-path: inset(45% 0 50% 0); transform: translate(-0.05em, 0.02em); }
            20% { clip-path: inset(80% 0 15% 0); transform: translate(0.02em, -0.01em); }
            40% { clip-path: inset(20% 0 70% 0); transform: translate(-0.01em, 0.03em); }
            60% { clip-path: inset(90% 0 5% 0); transform: translate(0.03em, -0.02em); }
            80% { clip-path: inset(40% 0 45% 0); transform: translate(-0.02em, 0.01em); }
            100% { clip-path: inset(60% 0 30% 0); transform: translate(0.01em, -0.03em); }
        }

        /* THE NAVIGATION - CRYSTALLIZED ENERGY SHARDS */
        .main .about {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2rem;
            perspective: 800px; /* Create a 3D space for the items */
        }
        
        .main .about a {
            font-family: var(--font-main);
            font-weight: 900;
            font-size: clamp(1rem, 2.2vw, 1.2rem);
            color: rgba(255, 255, 255, 0.8);
            text-decoration: none;
            text-transform: uppercase;
            padding: 1.5rem 3rem;
            position: relative;
            border: 2px solid transparent;
            background: linear-gradient(145deg, rgba(31, 1, 34, 0.5), rgba(13, 0, 15, 0.5));
            backdrop-filter: blur(5px);
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1), color 0.4s, background 0.4s;
            transform-style: preserve-3d;
        }

        /* The glowing, crystalline border effect */
        .main .about a::before,
        .main .about a::after {
            content: '';
            position: absolute;
            inset: -2px;
            z-index: -1;
            background: conic-gradient(from var(--angle), transparent 50%, var(--color-core-1), var(--color-accent));
            animation: spin 6s linear infinite;
            --angle: 0deg;
            transition: opacity 0.4s;
        }
        
        .main .about a::after {
            filter: blur(15px);
        }
        
        /* Initially hide the glow */
        .main .about a:not(:hover)::before,
        .main .about a:not(:hover)::after {
            opacity: 0;
        }

        .main .about a:hover {
            color: #ffffff;
            transform: translateZ(40px) scale(1.05); /* Push forward in 3D space */
            background: linear-gradient(145deg, rgba(31, 1, 34, 0.8), rgba(13, 0, 15, 0.8));
            cursor: pointer;
        }
        
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }
        
        @keyframes spin {
            to { --angle: 360deg; }
        }
    </style>
