    <script>
        /*
        ================================================================================
        JAVASCRIPT - DYNAMIC SUNLIGHT REFLECTIONS
        - This script creates a subtle, chaotic "caustic" light effect that
          simulates intense sunlight reflecting off an uneven surface.
        - It's lightweight and designed to be an atmospheric background element.
        ================================================================================
        */
        const canvas = document.getElementById('reflection-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let points = [];
        const pointer = { x: width / 2, y: height / 2 };
        
        const options = {
            pointCount: 30,
            maxDist: 150, // How far points connect
            speed: 0.1
        };

        class Point {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * options.speed;
                this.vy = (Math.random() - 0.5) * options.speed;
            }

            update() {
                // Interaction with the pointer
                const dx = this.x - pointer.x;
                const dy = this.y - pointer.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if(dist < 200) {
                    this.vx += (dx / dist) * 0.5; // Gently push away from pointer
                    this.vy += (dy / dist) * 0.5;
                }

                this.x += this.vx;
                this.y += this.vy;
                
                // Damping
                this.vx *= 0.98;
                this.vy *= 0.98;

                // Edge wrapping
                if(this.x > width) this.x = 0;
                if(this.x < 0) this.x = width;
                if(this.y > height) this.y = 0;
                if(this.y < 0) this.y = height;
            }
        }

        function setup() {
            points = [];
            for (let i = 0; i < options.pointCount; i++) {
                points.push(new Point());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, width, height);
            
            for(let i = 0; i < points.length; i++) {
                points[i].update();
                for(let j = i + 1; j < points.length; j++) {
                    const dx = points[i].x - points[j].x;
                    const dy = points[i].y - points[j].y;
                    const dist = Math.sqrt(dx*dx + dy*dy);

                    if(dist < options.maxDist) {
                        const opacity = 1 - (dist / options.maxDist);
                        ctx.beginPath();
                        ctx.moveTo(points[i].x, points[i].y);
                        ctx.lineTo(points[j].x, points[j].y);
                        ctx.strokeStyle = `rgba(255, 255, 224, ${opacity * 0.5})`; // Light yellow for sunlight
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }

            requestAnimationFrame(animate);
        }

        // --- Event Listeners ---
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            setup();
        });

        window.addEventListener('mousemove', e => {
            pointer.x = e.clientX;
            pointer.y = e.clientY;
        });

        // --- Initialization ---
        setup();
        animate();
    </script>
