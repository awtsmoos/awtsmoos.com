        /*

        :root {

        /*

        /* THE LOGO - Designed to be "insane" and profoundly glitchy */
        .main .logo {

        }
        
        /* We use pseudo-elements for persistent, chaotic glitch layers */
        .main .logo::before,
        .main .logo::after {
            content: attr(data-text);

            top: 0;
            left: 0;

        .main .logo::before {

        .main .logo::after {

        /* Keyframes for a more extreme, jarring glitch effect using clip-path */
        @keyframes extreme-glitch-1 {
            0% { clip-path: inset(45% 0 50% 0); transform: translate(-0.05em, 0.02em); }
            20% { clip-path: inset(15% 0 70% 0); transform: translate(0.02em, -0.01em); }

            100% { clip-path: inset(5% 0 90% 0); transform: translate(0.04em, 0.01em); }
        }

        @keyframes extreme-glitch-2 {
            0% { clip-path: inset(80% 0 5% 0); transform: translate(0.05em, -0.05em); }

    <script>
        const canvas = document.getElementById('interactive-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        let particles = [];
        const pointer = { x: width / 2, y: height / 2, active: false };

        // Configuration for a MORE EXTREME particle vortex effect
        const options = {
            particleCount: 500,
            particleSize: 1.5,
            attractionForce: 0.02, // Force pulling particles to center
            repulsionForce: 200,   // "Explosive" force from the cursor
            repulsionRadius: 250,  // How far the cursor's force reaches
            maxSpeed: 50,          // Maximum particle speed
            trailLength: 0.1,      // Lower value = longer, more intense trails
        };

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = 0;
                this.vy = 0;
                this.hue = Math.random() * 60 + 180; // Hues of cyan/blue
            }

            update() {
                // Attraction to the center of the screen
                const dxCenter = width / 2 - this.x;
                const dyCenter = height / 2 - this.y;
                this.vx += dxCenter * options.attractionForce;
                this.vy += dyCenter * options.attractionForce;

                // Extreme repulsion from the user's cursor
                if (pointer.active) {
                    const dx = this.x - pointer.x;
                    const dy = this.y - pointer.y;
                    const distSq = dx * dx + dy * dy;

                    if (distSq < options.repulsionRadius * options.repulsionRadius) {
                        const dist = Math.sqrt(distSq);
                        const force = (options.repulsionRadius - dist) / options.repulsionRadius;
                        const angle = Math.atan2(dy, dx);
                        this.vx += Math.cos(angle) * force * options.repulsionForce;
                        this.vy += Math.sin(angle) * force * options.repulsionForce;
                    }
                }

                // Clamp speed to prevent insane velocities
                const speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                if (speed > options.maxSpeed) {
                    this.vx = (this.vx / speed) * options.maxSpeed;
                    this.vy = (this.vy / speed) * options.maxSpeed;
                }

                this.x += this.vx;
                this.y += this.vy;

                // Friction/damping to slow particles down
                this.vx *= 0.95;
                this.vy *= 0.95;

                // Screen wrapping
                if (this.x < 0) this.x = width;
                if (this.x > width) this.x = 0;
                if (this.y < 0) this.y = height;
                if (this.y > height) this.y = 0;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, options.particleSize, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue}, 100%, 50%)`;
                ctx.fill();
            }
        }

        function setup() {
            particles = [];
            for (let i = 0; i < options.particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.fillStyle = `rgba(0, 0, 0, ${options.trailLength})`;
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        // --- Event Listeners ---
        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            setup();
        });

        const updatePointer = (e) => {
            pointer.x = e.clientX || (e.touches && e.touches[0].clientX);
            pointer.y = e.clientY || (e.touches && e.touches[0].clientY);
            pointer.active = true;
        };

        const deactivatePointer = () => {
            pointer.active = false;
        };

        window.addEventListener('mousemove', updatePointer);
        window.addEventListener('touchmove', e => { e.preventDefault(); updatePointer(e); }, { passive: false });
        window.addEventListener('mouseleave', deactivatePointer);
        window.addEventListener('touchend', deactivatePointer);

        // --- Initialization ---
        setup();
        animate();
    </script>
