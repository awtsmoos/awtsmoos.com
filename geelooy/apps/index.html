<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awtsmoos Apps - Dynamic Reality</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800&display=swap" rel="stylesheet">

    <style>
        /*
        ================================================================================
        I. CORE SYSTEM - DYNAMIC DAY/NIGHT THEME
        ================================================================================
        */
        :root {
            --font-main: 'Inter', sans-serif;
            --transition-speed: 0.8s; /* Slower for smooth ambient transitions */
        }

        /* DAY THEME */
        .day-theme {
            --bg-grad-1: #87CEEB; /* Sky Blue */
            --bg-grad-2: #4682B4; /* Steel Blue */
            --panel-bg: rgba(255, 255, 255, 0.4);
            --panel-glow: rgba(255, 255, 255, 0.5);
            --text-color: #1a2a3a;
            --logo-grad-1: #2c3e50;
            --logo-grad-2: #4682B4;
            --button-bg: rgba(255, 255, 255, 0.7);
            --button-hover-bg: rgba(255, 255, 255, 1);
        }

        /* NIGHT THEME */
        .night-theme {
            --bg-grad-1: #0f0c29; /* Deep Purple */
            --bg-grad-2: #0d253f; /* Deep Blue */
            --panel-bg: rgba(15, 25, 50, 0.4);
            --panel-glow: rgba(0, 255, 255, 0.2);
            --text-color: #e0e5ff;
            --logo-grad-1: #00ffff;
            --logo-grad-2: #8a2be2;
            --button-bg: rgba(10, 20, 40, 0.7);
            --button-hover-bg: rgba(20, 30, 60, 1);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; font-family: var(--font-main);
            background: linear-gradient(135deg, var(--bg-grad-1), var(--bg-grad-2));
            transition: background var(--transition-speed) ease-in-out;
        }

        /*
        ================================================================================
        II. BACKGROUND ANIMATIONS - SUN, MOON, AURORAS
        ================================================================================
        */
        .emoji-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: none;
        }
        .emoji {
            position: absolute; font-size: 2rem;
            animation: drift 20s linear infinite alternate;
            opacity: 0; transition: opacity 1s;
        }
        .day-theme .sun, .night-theme .moon { opacity: 0.8; }
        .emoji:nth-child(1) { top: 10%; left: 10%; animation-duration: 25s; }
        .emoji:nth-child(2) { top: 20%; left: 80%; animation-duration: 30s; }
        .emoji:nth-child(3) { top: 80%; left: 20%; animation-duration: 22s; }
        .emoji:nth-child(4) { top: 70%; left: 90%; animation-duration: 28s; }
        @keyframes drift {
            from { transform: translate(0, 0) rotate(0deg); }
            to { transform: translate(40px, 60px) rotate(360deg); }
        }

        .aurora {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(ellipse at 20% 20%, rgba(0, 255, 127, 0.2) 0%, transparent 50%),
                        radial-gradient(ellipse at 80% 70%, rgba(138, 43, 226, 0.2) 0%, transparent 50%);
            animation: aurora-flow 20s infinite alternate;
            z-index: 0; opacity: 0; transition: opacity 2s;
        }
        .night-theme .aurora { opacity: 1; }
        @keyframes aurora-flow {
            from { transform: scale(1) rotate(0deg); }
            to { transform: scale(1.5) rotate(20deg); }
        }

        /*
        ================================================================================
        III. SERVER TEMPLATE STYLES (Unmodified)
        ================================================================================
        */
        .awtsmoospage { position: relative; z-index: 2; height: 100%; }
        .main {
            display: flex; flex-direction: column; justify-content: center;
            align-items: center; height: 100vh; text-align: center; padding: 1rem;
        }

        /*
        ================================================================================
        IV. CONTENT STYLES (INSIDE .main) - "Insane" Glassmorphism & Functionality
        ================================================================================
        */
        .app-panel {
            width: 90%; max-width: 500px;
            height: 80vh; max-height: 700px;
            background: var(--panel-bg);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 2rem;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex; flex-direction: column;
            transition: background var(--transition-speed) ease-in-out;
            /* Inner glow effect */
            position: relative;
        }
        .app-panel::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
            border-radius: 2rem;
            box-shadow: inset 0 0 100px var(--panel-glow);
            transition: box-shadow var(--transition-speed) ease-in-out;
        }

        /* The re-designed, properly sized logo */
        .app-panel .logo {
            font-size: clamp(2rem, 8vw, 2.5rem);
            font-weight: 800; text-transform: uppercase;
            padding: 1.5rem; flex-shrink: 0;
            background: linear-gradient(45deg, var(--logo-grad-1), var(--logo-grad-2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            transition: background var(--transition-speed) ease-in-out;
        }

        /* THE SCROLLABLE BUTTON LIST - This fixes the core problem */
        .app-panel .list {
            flex-grow: 1; overflow-y: auto;
            padding: 0 1.5rem 1.5rem 1.5rem;
            display: flex; flex-direction: column; gap: 1rem;
        }
        /* Custom scrollbar for a professional look */
        .app-panel .list::-webkit-scrollbar { width: 8px; }
        .app-panel .list::-webkit-scrollbar-track { background: transparent; }
        .app-panel .list::-webkit-scrollbar-thumb { background-color: rgba(255,255,255,0.3); border-radius: 10px; }

        .app-panel a {
            display: block; width: 100%; padding: 1.25rem;
            text-decoration: none; color: var(--text-color);
            background: var(--button-bg);
            border-radius: 1rem; font-weight: 500; font-size: 1rem;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transform: scale(1);
            transition: transform 0.2s ease, background 0.2s ease, color var(--transition-speed) ease-in-out;
        }
        .app-panel a:hover {
            transform: scale(1.05);
            background: var(--button-hover-bg);
        }
        .app-panel a:active {
            transform: scale(0.98);
        }

    </style>
</head>
<body class="day-theme"> <!-- Starts with Day Theme -->

    <div class="emoji-container">
        <div class="emoji sun">☀️</div> <div class="emoji sun">☀️</div>
        <div class="emoji sun">☀️</div> <div class="emoji sun">☀️</div>
        <div class="emoji moon">🌙</div> <div class="emoji moon">🌙</div>
        <div class="emoji moon">🌙</div> <div class="emoji moon">🌙</div>
    </div>
    <div class="aurora"></div>

    <!-- SERVER TEMPLATE STRUCTURE (Unmodified) -->
    <div class="all awtsmoospage">
        <div class="main">
            <!-- CONTENT WITHIN .main (Completely Rebuilt) -->
            <div class="app-panel">
                <header class="logo">Awtsmoos Apps</header>
                <nav class="list">
                    <a href="./code">Awtsmoos Code Editor</a>
                    <a href="./piano">Piano/Synthesizer</a>
                    <a href="/os">Awtsmoos OS</a>
                    <a href="/ayin">Awtsmoos Recorder</a>
                    <!-- Add more links here and watch it scroll! -->
                    <a href="#">Another App</a>
                    <a href="#">And Another</a>
                    <a href="#">Example App Link</a>
                </nav>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const body = document.body;
            let isDay = true;

            // Automatically switch themes every 30 seconds for a dynamic feel
            setInterval(() => {
                if (isDay) {
                    body.classList.remove('day-theme');
                    body.classList.add('night-theme');
                } else {
                    body.classList.remove('night-theme');
                    body.classList.add('day-theme');
                }
                isDay = !isDay;
            }, 30000);
        });
    </script>

</body>
</html>
