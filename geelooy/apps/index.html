    <style>
        :root {
            --primary-color: #ff00ff; /* Neon Pink */

        body, html {

            color: var(--primary-color);

        }

        #insane-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;

            z-index: 1;
        }

        .all {
            position: relative;
            z-index: 2;
            height: 100%;
        }

        .main {
            display: flex;
            flex-direction: column;

            align-items: center;
            height: 100vh;

            padding: 1rem;

        }

        .logo {

            margin-bottom: 2rem;
            letter-spacing: 0.5rem;
            z-index: 3;
        }

        .about a {
            font-size: clamp(1.2rem, 5vw, 2rem);
            color: var(--secondary-color);
            text-decoration: none;
            margin: 0.5rem 1rem;
            display: inline-block;
            border: 3px solid var(--secondary-color);
            padding: 0.75rem 1.5rem;

        }

        .about a:hover {
            background-color: var(--secondary-color);
            color: var(--background-color);
            text-shadow: 0 0 15px var(--primary-color);
        }

        .glitch {
            position: relative;
            text-shadow: 
                -3px -3px 0 var(--primary-color), 
                3px 3px 0 var(--secondary-color);
            animation: glitch-main 5s infinite linear alternate-reverse;
        }

        .glitch::before,
        .glitch::after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--background-color);
            overflow: hidden;
            clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        }

        .glitch::before {
            left: -3px;
            text-shadow: -3px 0 var(--primary-color);
            animation: glitch-before 3s infinite linear alternate-reverse;
        }

        .glitch::after {
            left: 3px;
            text-shadow: -3px 0 var(--secondary-color);
            animation: glitch-after 2s infinite linear alternate-reverse;
        }

        @keyframes glitch-main {
            0% { transform: translate(0); }
            10% { transform: translate(-7px, 7px); }
            20% { transform: translate(7px, -7px); }
            30% { transform: translate(-7px, -7px); }
            40% { transform: translate(7px, 7px); }
            50% { transform: translate(0); }
            100% { transform: translate(0); }
        }

        @keyframes glitch-before {
            0% { clip-path: polygon(0 2%, 100% 2%, 100% 5%, 0 5%); }
            10% { clip-path: polygon(0 15%, 100% 15%, 100% 15%, 0 15%); }
            20% { clip-path: polygon(0 10%, 100% 10%, 100% 20%, 0 20%); }
            30% { clip-path: polygon(0 1%, 100% 1%, 100% 2%, 0 2%); }
            40% { clip-path: polygon(0 33%, 100% 33%, 100% 33%, 0 33%); }
            50% { clip-path: polygon(0 44%, 100% 44%, 100% 44%, 0 44%); }
            60% { clip-path: polygon(0 50%, 100% 50%, 100% 20%, 0 20%); }
            70% { clip-path: polygon(0 70%, 100% 70%, 100% 70%, 0 70%); }
            80% { clip-path: polygon(0 80%, 100% 80%, 100% 80%, 0 80%); }
            90% { clip-path: polygon(0 50%, 100% 50%, 100% 55%, 0 55%); }
            100% { clip-path: polygon(0 60%, 100% 60%, 100% 70%, 0 70%); }
        }

        @keyframes glitch-after {
            0% { clip-path: polygon(0 5%, 100% 5%, 100% 6%, 0 6%); }
            10% { clip-path: polygon(0 8%, 100% 8%, 100% 8%, 0 8%); }
            20% { clip-path: polygon(0 20%, 100% 20%, 100% 25%, 0 25%); }
            30% { clip-path: polygon(0 25%, 100% 25%, 100% 25%, 0 25%); }
            40% { clip-path: polygon(0 40%, 100% 40%, 100% 42%, 0 42%); }
            50% { clip-path: polygon(0 52%, 100% 52%, 100% 59%, 0 59%); }
            60% { clip-path: polygon(0 60%, 100% 60%, 100% 65%, 0 65%); }
            70% { clip-path: polygon(0 75%, 100% 75%, 100% 75%, 0 75%); }
            80% { clip-path: polygon(0 85%, 100% 85%, 100% 90%, 0 90%); }
            90% { clip-path: polygon(0 95%, 100% 95%, 100% 96%, 0 96%); }
            100% { clip-path: polygon(0 98%, 100% 98%, 100% 100%, 0 100%); }
        }

<body>
    <canvas id="insane-canvas"></canvas>

    <div class="all awtsmoospage">

        <div class="main">
            <div class="logo glitch" data-text="Awtsmoos Apps">Awtsmoos Apps</div>
            <div class="about list">
                <a href="./code" class="glitch" data-text="Awtsmoos Code Editor">Awtsmoos Code Editor</a>
                <a href="./piano" class="glitch" data-text="Piano/Synthesizer">Piano/Synthesizer</a>

                <a href="/ayin" class="glitch" data-text="Awtsmoos Recorder">Awtsmoos Recorder</a>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('insane-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let particles = [];
        let pointer = { x: width / 2, y: height / 2 };

        const options = {
            particleCount: 500,
            particleSize: 2,
            speed: 15,
            trailLength: 0.1,
            hue: 170 // Start hue for cyan
        };

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * options.speed;
                this.vy = (Math.random() - 0.5) * options.speed;
            }

            update() {
                const dx = this.x - pointer.x;
                const dy = this.y - pointer.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                const angle = Math.atan2(dy, dx);

                if (dist > 1) {
                    this.x -= Math.cos(angle) * (1 + 100 / dist);
                    this.y -= Math.sin(angle) * (1 + 100 / dist);
                }
                
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > width) this.vx *= -1;
                if (this.y < 0 || this.y > height) this.vy *= -1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, options.particleSize, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${options.hue}, 100%, 50%)`;
                ctx.fill();
            }
        }

        function setup() {
            particles = [];
            for (let i = 0; i < options.particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.fillStyle = `rgba(0, 0, 0, ${options.trailLength})`;
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            options.hue += 0.5;

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            setup();
        });

        window.addEventListener('mousemove', (e) => {
            pointer.x = e.clientX;
            pointer.y = e.clientY;
        });
        
        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            pointer.x = e.touches[0].clientX;
            pointer.y = e.touches[0].clientY;
        });

        setup();
        animate();
    </script>
</body>
