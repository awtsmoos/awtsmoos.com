<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="theme-color" content="#040711" />
	<title>🦅 AWTSMOOS STUDIO</title>
	<style>
		#studioLoadingScreen{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#040711;color:#eefcff;font-family:system-ui,sans-serif;transition:opacity .18s ease}
		#studioLoadingScreen.is-ready{opacity:0;pointer-events:none}
		#studioLoadingScreen.is-error{background:#14070b}
		.studio-loading-card{width:min(88vw,360px);padding:24px;border:1px solid #244250;border-radius:20px;background:#08111bcc;box-shadow:0 18px 70px #0008;text-align:center}
		.studio-loading-mark{font-size:32px;line-height:1}
		.studio-loading-title{margin:12px 0 6px;font-size:18px}
		.studio-loading-status{margin:0;color:#9fd8d0;font-size:13px}
		.studio-loading-line{height:2px;margin-top:18px;overflow:hidden;border-radius:999px;background:#142831}
		.studio-loading-line::after{content:"";display:block;width:38%;height:100%;background:#83ffe7;animation:studio-load 1s ease-in-out infinite alternate}
		@keyframes studio-load{from{transform:translateX(-20%)}to{transform:translateX(180%)}}
		@media(prefers-reduced-motion:reduce){#studioLoadingScreen{transition:none}.studio-loading-line::after{animation:none;width:100%}}
	</style>
	<link rel="stylesheet" href="./style.css" />
</head>
<body>
	<div id="studioLoadingScreen" role="status" aria-live="polite" aria-label="Opening AWTSMOOS STUDIO">
		<div class="studio-loading-card">
			<div class="studio-loading-mark" aria-hidden="true">🦅</div>
			<h1 class="studio-loading-title">AWTSMOOS STUDIO</h1>
			<p id="studioLoadingStatus" class="studio-loading-status">Opening Canvas…</p>
			<div class="studio-loading-line" aria-hidden="true"></div>
		</div>
	</div>
	<div id="appRoot"></div>
	<script type="module" src="./main.js?compact=true&amp;v=awtsmoos-lazy-20260902"></script>
</body>
</html>
