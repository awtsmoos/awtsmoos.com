<!doctype html>
<html lang="en" data-audit="pending">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Nesher Realistic WebGL Runtime Audit</title>
	<link rel="stylesheet" href="../style.css" />
	<style>
		*, *::before, *::after {
			animation: none !important;
			transition: none !important;
		}
		body {
			padding: 12px;
		}
		#auditResult {
			position: fixed;
			inset: auto 0 0;
			z-index: 999;
			max-height: 26vh;
			overflow: hidden;
			background: #02050c;
			color: white;
			font-size: 10px;
		}
	</style>
</head>
<body>
	<section class="audio-page workspace-page is-active" data-studio-page="audio">
		<div class="audio-lab-grid">
			<article class="audio-canvas-card">
				<div class="audio-canvas-stack">
					<canvas id="audioLabCanvas"></canvas>
					<canvas id="audioGlyphCanvas"></canvas>
				</div>
			</article>
			<section class="audio-control-rack workspace-deck" data-workspace-deck="audioControls">
				<div class="deck-tabs" data-deck-tabs>
					<button class="active" aria-selected="true">Looks</button>
					<button>Motion</button>
					<button>Signal</button>
				</div>
				<div class="deck-stack" data-deck-stack>
					<div class="deck-panel active">
						<div class="preset-grid">
							<button class="preset-card active"><span>Galaxy</span><small>Deep orbit</small></button>
							<button class="preset-card"><span>River</span><small>Flow</small></button>
							<button class="preset-card"><span>Orbit</span><small>Ring</small></button>
							<button class="preset-card"><span>Ribbon</span><small>Wave</small></button>
							<button class="preset-card"><span>Vortex</span><small>Tunnel</small></button>
							<button class="preset-card"><span>Spectrum</span><small>Energy</small></button>
							<button class="preset-card"><span>Petals</span><small>Bloom</small></button>
							<button class="preset-card"><span>Spokes</span><small>Radial</small></button>
							<button class="preset-card"><span>Rain</span><small>Fall</small></button>
							<button class="preset-card"><span>Columns</span><small>Bars</small></button>
						</div>
						<label>Flow <output>1.10</output><input type="range" value="72" /></label>
						<div class="frequency-meters">
							<div>Bass<i style="width:72%"></i></div>
							<div>Mid<i style="width:58%"></i></div>
							<div>Treble<i style="width:64%"></i></div>
						</div>
					</div>
				</div>
			</section>
		</div>
	</section>
	<pre id="auditResult"></pre>
	<script type="module">
		import {
			PARTICLE_FRAGMENT_SHADER,
			PARTICLE_VERTEX_SHADER
		} from '../modules/audioLab/shaders.js';

		const output = document.querySelector('#auditResult');
		try {
			const shaderReport = compileAndDraw();
			const cssReport = inspectCss();
			const report = {
				passed: shaderReport.passed && cssReport.passed,
				shaderReport,
				cssReport
			};
			output.textContent = JSON.stringify(report);
			document.documentElement.dataset.audit = report.passed ? 'pass' : 'fail';
		} catch (error) {
			output.textContent = JSON.stringify({
				passed: false,
				error: String(error?.stack || error)
			});
			document.documentElement.dataset.audit = 'error';
		}

		function compileAndDraw() {
			const canvas = document.querySelector('#audioLabCanvas');
			canvas.width = 640;
			canvas.height = 360;
			const gl = canvas.getContext('webgl2', {
				alpha: true,
				antialias: false,
				preserveDrawingBuffer: true
			});
			if (!gl) return { passed: false, reason: 'WebGL2 unavailable' };
			const vertex = compile(gl, gl.VERTEX_SHADER, PARTICLE_VERTEX_SHADER);
			const fragment = compile(gl, gl.FRAGMENT_SHADER, PARTICLE_FRAGMENT_SHADER);
			const program = gl.createProgram();
			gl.attachShader(program, vertex);
			gl.attachShader(program, fragment);
			gl.linkProgram(program);
			const linked = gl.getProgramParameter(program, gl.LINK_STATUS);
			const programLog = gl.getProgramInfoLog(program) || '';
			if (!linked) return { passed: false, linked, programLog };
			gl.viewport(0, 0, canvas.width, canvas.height);
			gl.enable(gl.BLEND);
			gl.blendFuncSeparate(gl.SRC_ALPHA, gl.ONE, gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
			gl.useProgram(program);
			gl.bindVertexArray(gl.createVertexArray());
			setFloat(gl, program, 'u_time', 2.4);
			setFloat(gl, program, 'u_flow', 1.1);
			setFloat(gl, program, 'u_bass', .72);
			setFloat(gl, program, 'u_mid', .58);
			setFloat(gl, program, 'u_treble', .64);
			setFloat(gl, program, 'u_energy', .78);
			setFloat(gl, program, 'u_pulse', .66);
			setFloat(gl, program, 'u_aspect', 16 / 9);
			setFloat(gl, program, 'u_quality', 1);
			gl.uniform1i(gl.getUniformLocation(program, 'u_mode'), 9);
			gl.uniform3fv(gl.getUniformLocation(program, 'u_primary'), [.38, 1, .82]);
			gl.uniform3fv(gl.getUniformLocation(program, 'u_secondary'), [.58, .32, 1]);
			gl.clearColor(0, 0, 0, 0);
			gl.clear(gl.COLOR_BUFFER_BIT);
			gl.drawArrays(gl.POINTS, 0, 12000);
			gl.finish();
			const pixels = new Uint8Array(canvas.width * canvas.height * 4);
			gl.readPixels(0, 0, canvas.width, canvas.height, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
			let nonzeroPixels = 0;
			for (let index = 3; index < pixels.length; index += 4) {
				if (pixels[index] > 0) nonzeroPixels += 1;
			}
			return {
				passed: linked && nonzeroPixels > 100,
				linked,
				programLog,
				nonzeroPixels,
				renderer: gl.getParameter(gl.RENDERER),
				version: gl.getParameter(gl.VERSION)
			};
		}

		function compile(gl, type, source) {
			const shader = gl.createShader(type);
			gl.shaderSource(shader, source);
			gl.compileShader(shader);
			if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
				throw new Error(gl.getShaderInfoLog(shader) || 'Shader compilation failed.');
			}
			return shader;
		}

		function setFloat(gl, program, name, value) {
			gl.uniform1f(gl.getUniformLocation(program, name), value);
		}

		function inspectCss() {
			const card = document.querySelector('.audio-canvas-card');
			const rack = document.querySelector('.audio-control-rack');
			const preset = document.querySelector('.preset-card');
			const canvas = document.querySelector('#audioLabCanvas');
			const cardStyle = getComputedStyle(card);
			const rackStyle = getComputedStyle(rack);
			const presetStyle = getComputedStyle(preset);
			return {
				passed: cardStyle.boxShadow !== 'none'
					&& rackStyle.backgroundImage !== 'none'
					&& presetStyle.boxShadow !== 'none'
					&& canvas.clientWidth > 0
					&& canvas.clientHeight > 0,
				presetCount: document.querySelectorAll('.preset-card').length,
				canvasBox: [canvas.clientWidth, canvas.clientHeight],
				cardShadow: cardStyle.boxShadow,
				rackBackground: rackStyle.backgroundImage,
				presetShadow: presetStyle.boxShadow
			};
		}
	</script>
</body>
</html>
