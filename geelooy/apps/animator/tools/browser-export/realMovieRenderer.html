<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Awtsmoos Animator — Real Movie Browser Export</title>
	<style>
		html, body { margin: 0; min-height: 100%; background: #f7f2e8; color: #202124; font: 15px/1.5 system-ui, sans-serif; }
		main { max-width: 760px; margin: 36px auto; padding: 28px; border: 2px solid #292a2c; border-radius: 24px; background: #fffdf8; }
		.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
		.card { padding: 12px; border: 1px solid #bdb5a7; border-radius: 12px; background: #f7f2e8; }
		.card b { display: block; font-size: 22px; color: #7b2f21; }
		progress { width: 100%; height: 22px; }
		.status { min-height: 48px; padding: 12px; border-left: 4px solid #52633a; background: #edf1e7; white-space: pre-wrap; }
		.ok { border-color: #238636; background: #e8f5e9; }
		.error { border-color: #b42318; background: #fce8e6; }
		#production-app { position: fixed; left: -20000px; top: 0; width: 1920px; height: 1080px; border: 0; }
	</style>
</head>
<body>
	<main>
		<p>B"H · The Awtsmoos renews one production canvas as encoded time.</p>
		<h1>Four-Minute Festival Movie</h1>
		<p>Awtsmoos.com · real Animator director · production canvas · H.264/AAC MP4</p>
		<div class="grid">
			<div class="card"><b>1920×1080</b>canvas</div>
			<div class="card"><b>24</b>fps</div>
			<div class="card"><b>1+</b>voice clips</div>
			<div class="card"><b>MP4</b>output</div>
		</div>
		<p id="status" class="status">Loading the production Animator…</p>
		<progress id="progress" max="100" value="0"></progress>
		<p><button id="start" disabled>Render Production MP4</button></p>
	</main>
	<iframe id="production-app" src="/geelooy/apps/animator/index.html?browserExportProof=1"></iframe>
	<script type="module" src="./RealMovieBrowserExportPage.js"></script>
</body>
</html>
