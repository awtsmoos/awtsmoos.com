<!-- B"H -->
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Awtsmoos Animator — Browser MP4 Renderer</title>
	<style>
		html, body {
			margin: 0;
			min-height: 100%;
			background: radial-gradient(circle at 30% 20%, #25164d, #050713 60%);
			color: #f8fafc;
			font: 15px/1.5 system-ui, sans-serif;
		}
		main {
			max-width: 860px;
			margin: 36px auto;
			padding: 28px;
			border: 1px solid #475569;
			border-radius: 22px;
			background: #0b1221ee;
			box-shadow: 0 30px 90px #000b;
		}
		.grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
		.card { padding: 12px; border: 1px solid #334155; border-radius: 12px; background: #111827; }
		.card b { display: block; font-size: 22px; color: #f8c44f; }
		progress { width: 100%; height: 22px; }
		.status { min-height: 48px; padding: 12px; border-left: 4px solid #8b5cf6; background: #1e1b4b; }
		.ok { border-color: #22c55e; background: #123524; }
		.error { border-color: #ef4444; background: #40181d; }
	</style>
</head>
<body>
	<main>
		<p>B"H · Piano-derived browser muxing</p>
		<h1>The Forecast That Stole Tuesday</h1>
		<p>WebCodecs H.264 · browser AAC · MediaBunny MP4 · native AIFF decoding</p>
		<div class="grid">
			<div class="card"><b>8</b>worlds</div>
			<div class="card"><b>32</b>shots</div>
			<div class="card"><b>5</b>voices</div>
			<div class="card"><b>24</b>lines</div>
		</div>
		<p id="status" class="status">Ready to render.</p>
		<progress id="progress" max="100" value="0"></progress>
		<p><button id="start">Render Browser MP4</button></p>
	</main>
	<script type="module">
		import { FourMinuteFestivalMovie } from '/geelooy/apps/animator/src/scenes/FourMinuteFestivalMovie.js';
		import { AnimatorBrowserExportController } from '/geelooy/apps/animator/src/studio/export/browser/AnimatorBrowserExportController.js';

		const status = document.getElementById('status');
		const progress = document.getElementById('progress');
		const start = document.getElementById('start');
		const query = new URLSearchParams(location.search);
		const durationMs = Number(query.get('durationMs')) || 240000;
		window.__AWTSMOOS_BROWSER_EXPORT__ = { state: 'ready', durationMs };

		function updateState(value) {
			window.__AWTSMOOS_BROWSER_EXPORT__ = {
				...window.__AWTSMOOS_BROWSER_EXPORT__,
				...value,
				durationMs
			};
		}

		async function renderMovie() {
			start.disabled = true;
			status.className = 'status';
			updateState({ state: 'rendering', percent: 0, completedFrames: 0 });
			try {
				const result = await AnimatorBrowserExportController.export(
					FourMinuteFestivalMovie.create(),
					{
						durationMs,
						fileName: durationMs < 240000
							? 'the-forecast-that-stole-tuesday-browser-proof.mp4'
							: 'the-forecast-that-stole-tuesday-browser.mp4',
						onStatus: message => {
							status.textContent = message;
							updateState({ statusMessage: message });
						},
						onProgress: value => {
							progress.value = value.percent;
							status.textContent = `Rendering frame ${value.completedFrames} of ${value.totalFrames} (${value.percent}%)`;
							updateState({ state: 'rendering', ...value });
						}
					}
				);
				progress.value = 100;
				status.className = 'status ok';
				status.textContent = `Complete: ${result.blob.size.toLocaleString()} browser-created MP4 bytes.`;
				updateState({
					state: 'complete',
					percent: 100,
					bytes: result.blob.size,
					type: result.blob.type,
					fileName: result.fileName,
					durationSeconds: result.durationSeconds,
					frameCount: result.frameCount,
					voiceClipCount: result.voiceClips.length,
					capabilities: result.capabilities,
					codecPath: result.codecPath
				});
			} catch (error) {
				status.className = 'status error';
				status.textContent = error.stack || error.message;
				updateState({ state: 'error', error: error.stack || error.message });
				start.disabled = false;
			}
		}

		start.addEventListener('click', renderMovie);
		if (query.get('autostart') === '1') {
			renderMovie();
		}
	</script>
</body>
</html>
