<!-- B"H -->
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Awtsmoos Browser MP4 Muxer Proof</title>
	<style>
		html,body{margin:0;min-height:100%;background:#050713;color:#f8fafc;font:16px/1.5 system-ui,sans-serif}
		main{max-width:760px;margin:48px auto;padding:28px;border:1px solid #475569;border-radius:20px;background:#0f172a}
		progress{width:100%;height:18px}.ok{color:#86efac}.error{color:#fca5a5}code{color:#c4b5fd}
	</style>
</head>
<body>
	<main>
		<h1>B"H Browser MP4 Proof</h1>
		<p id="status">Starting Piano-derived browser muxer…</p>
		<progress id="progress" max="100" value="0"></progress>
		<p>Production encoder: <code>WebCodecs + MediaBunny + IndexedDB range target</code></p>
	</main>
	<script type="module">
		const status = document.getElementById('status');
		const progress = document.getElementById('progress');
		const worker = new Worker(`./muxer-proof-worker.js?bh=${Date.now()}`);
		window.__AWTSMOOS_MUXER_PROOF__ = { state: 'starting' };

		worker.onmessage = event => {
			const { type, payload } = event.data || {};
			if (type === 'STATUS_UPDATE') {
				status.textContent = payload.message;
				progress.value = Math.min(90, progress.value + 8);
				return;
			}
			if (type === 'FATAL_ERROR') {
				status.className = 'error';
				status.textContent = payload.message;
				window.__AWTSMOOS_MUXER_PROOF__ = { state: 'error', error: payload.message };
				return;
			}
			if (type !== 'VIDEO_COMPLETE') {
				return;
			}
			const url = URL.createObjectURL(payload.blob);
			const anchor = Object.assign(document.createElement('a'), {
				href: url,
				download: payload.fileName
			});
			document.body.appendChild(anchor);
			anchor.click();
			anchor.remove();
			status.className = 'ok';
			status.textContent = `Complete: ${payload.blob.size} browser-created bytes`;
			progress.value = 100;
			window.__AWTSMOOS_MUXER_PROOF__ = {
				state: 'complete',
				bytes: payload.blob.size,
				type: payload.blob.type,
				durationSeconds: payload.durationSeconds,
				fileName: payload.fileName
			};
			setTimeout(() => URL.revokeObjectURL(url), 30000);
			worker.terminate();
		};

		worker.onerror = event => {
			window.__AWTSMOOS_MUXER_PROOF__ = { state: 'error', error: event.message };
			status.className = 'error';
			status.textContent = event.message;
		};
		worker.postMessage({ type: 'START_PROOF' });
	</script>
</body>
</html>
