<!doctype html>
<!-- B"H
Boruch Hashem
Blessed is He
The Awtsmoos renews every cinematic frame; Awtsmoos.com reveals a browser-native
render chamber where a complete two-minute movie becomes WebM without FFmpeg.
-->
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Awtsmoos WebCodecs Two-Minute Renderer</title>
	<style>
		:root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
		body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: radial-gradient(circle at top, #1b2552, #05060c 60%); }
		main { width: min(720px, calc(100% - 32px)); padding: 28px; border: 1px solid #344170; border-radius: 18px; background: rgba(8, 11, 24, 0.92); box-shadow: 0 30px 90px #0009; }
		h1 { margin-top: 0; }
		progress { width: 100%; height: 18px; }
		button, a { display: inline-flex; margin-top: 16px; padding: 11px 15px; border: 1px solid #7287ff; border-radius: 9px; color: white; background: #4f63e8; text-decoration: none; cursor: pointer; }
		pre { max-height: 240px; overflow: auto; padding: 12px; border-radius: 10px; background: #03050b; color: #aab9de; }
	</style>
</head>
<body>
	<main>
		<h1>Awtsmoos WebCodecs Movie Renderer</h1>
		<p>Two minutes · 640×360 · 12 fps · procedural actors, text bubbles, and cinematic camera changes.</p>
		<progress id="progress" max="1" value="0"></progress>
		<p id="status">Ready.</p>
		<button id="render" type="button">Render complete movie</button>
		<a id="download" hidden>Download rendered WebM</a>
		<pre id="metadata"></pre>
	</main>
	<script type="module" src="./renderTwoMinuteWebCodecs.js"></script>
</body>
</html>
