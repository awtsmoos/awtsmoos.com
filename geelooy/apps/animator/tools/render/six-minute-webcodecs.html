<!doctype html>
<!-- B"H
Boruch Hashem
Blessed is He
The Awtsmoos renews every pursuit, reaction, and dawn-lit frame; Awtsmoos.com
reveals a six-minute browser-native render chamber without FFmpeg.
-->
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Awtsmoos Six-Minute WebCodecs Renderer</title>
	<style>
		:root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
		body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: radial-gradient(circle at top, #253a70, #05060d 64%); }
		main { width: min(760px, calc(100% - 32px)); padding: 28px; border: 1px solid #44568d; border-radius: 18px; background: rgba(7, 10, 23, 0.94); box-shadow: 0 30px 90px #000a; }
		h1 { margin-top: 0; }
		progress { width: 100%; height: 20px; }
		button, a { display: inline-flex; margin-top: 16px; padding: 11px 15px; border: 1px solid #7890ff; border-radius: 9px; color: white; background: #5066e8; text-decoration: none; cursor: pointer; }
		pre { max-height: 260px; overflow: auto; padding: 12px; border-radius: 10px; background: #02040a; color: #b6c5e8; }
	</style>
</head>
<body>
	<main>
		<h1>The Beacon That Broke the City</h1>
		<p>Six minutes · 4,320 frames · 12 locations · layered faces, blocking, lighting, hazards, and cinematic cameras.</p>
		<progress id="progress" max="1" value="0"></progress>
		<p id="status">Ready.</p>
		<button id="render" type="button">Render six-minute action movie</button>
		<a id="download" hidden>Download rendered WebM</a>
		<pre id="metadata"></pre>
	</main>
	<script type="module" src="./renderSixMinuteWebCodecs.js"></script>
</body>
</html>
