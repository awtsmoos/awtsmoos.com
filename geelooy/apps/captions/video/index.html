<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awtsmoos Ein Sof [Quantum V5]</title>
    
    <!-- Modular CSS -->
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/effects.css">
</head>
<body>

    <div class="app-container">
        
        <!-- Left Panel: Controls -->
        <aside id="controls-wrapper" class="glass-panel">
            <header>
                <div class="logo-area">
                    <h1>EIN SOF</h1>
                    <span class="version">V5.0</span>
                </div>
                <div class="header-actions">
                     <select id="preset-select"><option value="">Load Preset...</option></select>
                     <button id="save-preset-btn" class="icon-btn" title="Save">💾</button>
                     <button id="delete-preset-btn" class="icon-btn" title="Delete">🗑️</button>
                     <button id="randomize-all-btn" class="icon-btn" title="Chaos Mode">🎲</button>
                </div>
            </header>

            <div id="controls" class="scroll-area">
                
                <!-- Section 1: Mode & Dimensions -->
                <fieldset>
                    <legend>Merkabah (Core)</legend>
                    <div class="row">
                        <div class="form-group half">
                            <label>Mode</label>
                            <select id="renderMode">
                                <option value="image">Image Batch</option>
                                <option value="video">Video</option>
                            </select>
                        </div>
                        <div class="form-group half">
                            <label>FPS</label>
                            <input type="number" id="frameRate" value="24" min="1" max="60">
                        </div>
                    </div>
                    <div class="row">
                        <div class="form-group half">
                            <label>Width</label><input type="number" id="videoWidth" value="1920">
                        </div>
                        <div class="form-group half">
                            <label>Height</label><input type="number" id="videoHeight" value="1080">
                        </div>
                    </div>
                </fieldset>

                <!-- Section 2: Source Content -->
                <fieldset>
                    <legend>Kelim (Input)</legend>
                    <div class="form-group">
                        <label>Header Text</label>
                        <input type="text" id="headerText" placeholder="Top Title...">
                    </div>
                    
                    <div class="tabs">
                        <label class="tab"><input type="radio" name="capSrc" value="simple" checked onclick="document.getElementById('captionSource').value='simple';"> Simple</label>
                        <label class="tab"><input type="radio" name="capSrc" value="srt" onclick="document.getElementById('captionSource').value='srt';"> SRT</label>
                    </div>
                    <!-- Hidden Select to maintain compatibility with js logic -->
                    <select id="captionSource" style="display:none;"><option value="simple">Simple</option><option value="srt">SRT</option></select>

                    <div id="simple-caption-controls">
                        <textarea id="mainCaptions" placeholder="Enter captions (double spacing)..."></textarea>
                        <div class="row">
                            <label class="toggle-switch">
                                <input type="checkbox" id="dualCaptionToggle"> Dual Language
                            </label>
                        </div>
                        <textarea id="translationCaptions" class="hidden-control" placeholder="Translation captions..."></textarea>
                    </div>

                    <div id="srt-caption-controls" class="hidden-control">
                        <input type="file" id="srtFile" class="file-input" data-label="Primary SRT">
                        <input type="file" id="translationSrtFile" class="file-input" data-label="Trans SRT">
                    </div>
                    
                    <div class="form-group">
                        <label>Audio Source</label>
                        <input type="file" id="audioFile" class="file-input" accept="audio/*">
                    </div>
                </fieldset>

                <!-- Section 3: Visuals -->
                <fieldset>
                    <legend>Olam (Visuals)</legend>
                    <span class="fieldset-randomize">🎲</span>
                    
                    <div class="form-group bg-selector">
                        <label>Background Image</label>
                        <input type="file" id="backgroundImageInput" class="file-input" accept="image/*">
                        <div class="slider-group" data-control-name="backgroundOpacity">
                            <label>Opacity</label>
                            <input type="range" id="backgroundOpacity" min="0" max="1" step="0.05" value="1.0">
                        </div>
                    </div>

                    <div class="control-group" data-control-name="basePaletteColor">
                        <label>Base Color</label>
                        <div class="color-picker-wrapper">
                            <input type="color" id="basePaletteColor" value="#8A2BE2">
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label>Floating Portals</label>
                        <input type="file" id="portalImages" class="file-input" accept="image/*" multiple>
                    </div>
                </fieldset>

                <!-- Section 4: FX (THE NEW STUFF) -->
                <fieldset>
                    <legend>Tohu (Chaos FX)</legend>
                    <span class="fieldset-randomize">🎲</span>
                    
                    <div class="fx-grid">
                        <label class="toggle-card">
                            <input type="checkbox" id="enableMirrorMode">
                            <span>Mirror Mode</span>
                        </label>
                        <label class="toggle-card">
                            <input type="checkbox" id="enableSepia">
                            <span>Sepia Tone</span>
                        </label>
                        <label class="toggle-card">
                            <input type="checkbox" id="enableAnalogNoise">
                            <span>Analog Noise</span>
                        </label>
                        <label class="toggle-card">
                            <input type="checkbox" id="enableRGBPulse">
                            <span>RGB Pulse</span>
                        </label>
                        <label class="toggle-card">
                            <input type="checkbox" id="enableLensDistortion">
                            <span>Lens Distort</span>
                        </label>
                        <label class="toggle-card">
                            <input type="checkbox" id="enableSimpleBorder">
                            <span>Border</span>
                        </label>
                        <label class="toggle-card">
                            <input type="checkbox" id="enableTextGlitch">
                            <span>Text Glitch</span>
                        </label>
                        <label class="toggle-card">
                            <input type="checkbox" id="enableWaveform">
                            <span>Waveform</span>
                        </label>
                        <label class="toggle-card">
                            <input type="checkbox" id="enableVCRStamp">
                            <span>VCR Date</span>
                        </label>
                        <label class="toggle-card">
                            <input type="checkbox" id="enableScanLines">
                            <span>Scanlines</span>
                        </label>
                        <label class="toggle-card">
                            <input type="checkbox" id="enableVignette" checked>
                            <span>Vignette</span>
                        </label>
                        <label class="toggle-card">
                            <input type="checkbox" id="enableChromaticAberration">
                            <span>Aberration</span>
                        </label>
                        
                        <label class="toggle-card">
                            <input type="checkbox" id="dynamicBackgroundToggle" checked>
                            <span>Anim. BG</span>
                        </label>
                    </div>

                    <div class="control-group" data-control-name="cinematicBarHeight">
                        <label>Cinema Bars %</label>
                        <input type="range" id="cinematicBarHeight" min="0" max="20" value="0">
                    </div>
                </fieldset>

                <!-- Section 5: Output -->
                <fieldset>
                    <legend>Output</legend>
                    <div class="form-group">
                        <label class="toggle-switch">
                            <input type="checkbox" id="enableImageDownload">
                            Download Generated Images
                        </label>
                    </div>
                    <div id="image-download-folder-controls" class="hidden-control">
                        <button id="selectDownloadFolderButton" class="secondary-btn">Select Folder</button>
                        <div id="selectedDownloadFolderDisplay" class="status-text">None selected</div>
                    </div>
                </fieldset>
            </div>

            <!-- Footer Actions -->
            <footer id="actions-footer">
                <div id="status">System Idle</div>
                <div id="progressContainer"><div id="progressBar"></div></div>
                <div class="main-buttons">
                    <!-- Preview is now automatic, but button kept for forced refresh -->
                    <button id="previewButton" class="secondary-btn">Refresh</button>
                    <button id="renderButton" class="primary-btn">RENDER</button>
                </div>
            </footer>
        </aside>

        <!-- Right Panel: Preview -->
        <main id="preview-wrapper">
            <div id="preview-container">
                <canvas id="previewCanvas"></canvas>
                <video id="outputVideo" controls loop playsinline></video>
                <div id="render-overlay">
                    <div class="loader"></div>
                    <button id="cancelButton">ABORT</button>
                </div>
            </div>
        </main>

    </div>
    
    <script type="module" src="main.js"></script>
</body>
</html>
