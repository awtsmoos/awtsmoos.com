<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Awtsmoos Ein Sof Engine [Quantum Core v5.0]</title>
    <link rel="stylesheet" href="style.css" type="text/css">
</head>
<body>

    <div id="controls-wrapper">
        <div id="controls">
            <div id="settings-container">
                <h4>B"H</h4>
                <h2>Awtsmoos Ein Sof</h2>

                <div class="header-actions">
                     <select id="preset-select"><option value="">Load Preset...</option></select>
                     <button id="save-preset-btn">Save</button>
                     <button id="delete-preset-btn">Delete</button>
                     <button id="randomize-all-btn">Randomize All</button>
                </div>
    
                <fieldset>
                    <legend>Merkabah (Mode)</legend>
                    <div class="form-group"><label for="renderMode">Render Mode</label><select id="renderMode"><option value="video">Video</option><option value="image">Image Batch</option></select></div>
                </fieldset>
                
                <fieldset>
                    <legend>Kelim (Content)</legend>
                    <div class="form-group"><label for="headerText">Frame Header</label><input type="text" id="headerText" placeholder="Top Header Text"></div>
                    
                    <div id="simple-caption-controls">
                        <div class="form-group"><label for="mainCaptions">Captions</label><textarea id="mainCaptions" placeholder="Enter captions here..."></textarea></div>
                        <div class="form-group hidden-control" id="translation-controls"><label for="translationCaptions">Translation</label><textarea id="translationCaptions" placeholder="Translation..."></textarea></div>
                    </div>

                     <div id="srt-caption-controls" class="hidden-control">
                        <div class="form-group"><label>Primary SRT</label><input type="file" id="srtFile" accept=".srt,.txt"></div>
                        <textarea id="srtPreview" readonly placeholder="SRT content..."></textarea>
                        <div class="form-group" style="margin-top:20px;"><label>Translation SRT</label><input type="file" id="translationSrtFile" accept=".srt,.txt"></div>
                    </div>
                    
                    <label class="toggle-switch hidden-control" id="dual-caption-toggle-container" style="margin-top:10px;">
                        <input type="checkbox" id="dualCaptionToggle"> Enable Translation
                    </label>
                </fieldset>
    
                <fieldset class="hidden-control" id="timing-controls">
                    <legend>Orot (Timing)</legend>
                    <div class="form-group"><label>Source</label><select id="captionSource"><option value="simple">Simple Split</option><option value="srt">SRT File</option></select></div>
                    <div class="form-group" id="simple-timing-controls"><label>Secs/Caption</label><input type="number" id="captionDuration" value="2.5" step="0.1"></div>
                    <div class="form-group"><label>Audio (Optional)</label><input type="file" id="audioFile" accept="audio/*"></div>
                    <div class="form-group" id="fps-controls"><label>FPS</label><input type="number" id="frameRate" value="24" min="1" max="60"></div>
                </fieldset>

                <!-- NEW: Background Image Section -->
                <fieldset>
                    <legend>Olam (World)</legend>
                    <span class="fieldset-randomize" title="Randomize">🎲</span>
                    
                    <div class="form-group" style="border: 1px solid #444; padding: 10px; border-radius: 8px; background: #222;">
                        <label style="color: #00f2ea;">Background Image (Base)</label>
                        <input type="file" id="backgroundImageInput" accept="image/*">
                        <div style="margin-top:5px; font-size: 11px; color: #888;">Overrides Nebula if set.</div>
                    </div>
                    
                    <div class="control-group" data-control-name="backgroundOpacity">
                        <label>BG Opacity <span class="value-display" id="backgroundOpacityValue">1.0</span></label>
                        <input type="range" id="backgroundOpacity" min="0" max="1" step="0.05" value="1.0">
                    </div>

                    <div class="form-group"><label class="toggle-switch"><input type="checkbox" id="dynamicBackgroundToggle" checked> Dynamic Colors</label></div>
                    <div class="control-group" data-control-name="basePaletteColor">
                        <label>Base Color</label><span class="randomize-toggle">🌱</span>
                        <input type="color" id="basePaletteColor" value="#8A2BE2">
                    </div>
                </fieldset>
    
                <!-- Portals Section -->
                <fieldset>
                    <legend>Portals (Floating)</legend>
                    <span class="fieldset-randomize" title="Randomize">🎲</span>
                    <div class="form-group">
                        <label>Floating Images</label>
                        <input type="file" id="portalImages" accept="image/*" multiple>
                    </div>
                </fieldset>
    
                <fieldset>
                    <legend>Effects & Glitch</legend>
                    <span class="fieldset-randomize" title="Randomize">🎲</span>
                    <div class="form-group"><label class="toggle-switch"><input type="checkbox" id="enableTextGlitch"> Enable Text Glitch</label></div>
                    <div class="form-group"><label class="toggle-switch"><input type="checkbox" id="enableWaveform"> Enable Audio Waveform</label></div>
                    <div class="form-group"><label class="toggle-switch"><input type="checkbox" id="enableVCRStamp"> VCR Date Stamp</label></div>
                    
                    <div class="control-group" data-control-name="cinematicBarHeight">
                        <label>Cinematic Bars % <span class="value-display" id="cinematicBarHeightValue">0</span></label>
                        <input type="range" id="cinematicBarHeight" min="0" max="20" value="0">
                    </div>

                    <div class="form-group"><label class="toggle-switch"><input type="checkbox" id="enableScanLines"> Scan Lines</label></div>
                    <div class="form-group"><label class="toggle-switch"><input type="checkbox" id="enableVignette" checked> Vignette</label></div>
                    <div class="form-group"><label class="toggle-switch"><input type="checkbox" id="enableChromaticAberration"> Chromatic Aberration</label></div>
                </fieldset>

                <fieldset>
                    <legend>Output</legend>
                    <div class="form-group"><label>Resolution</label>
                        <div style="display:flex; gap:10px;">
                            <input type="number" id="videoWidth" value="1920" placeholder="W">
                            <input type="number" id="videoHeight" value="1080" placeholder="H">
                        </div>
                    </div>
                    <div class="form-group">
                        <label class="toggle-switch"><input type="checkbox" id="enableImageDownload"> Download Images</label>
                    </div>
                    <div class="form-group hidden-control" id="image-download-folder-controls">
                        <button id="selectDownloadFolderButton">Select Output Folder</button>
                        <div id="selectedDownloadFolderDisplay" style="font-size:12px; margin-top:5px; color:#aaa;">No folder selected</div>
                    </div>
                </fieldset>
            </div>
            <div id="actions-footer">
                <div id="status">Ready.</div>
                <div id="progressContainer" class="progress-bar-container"><div id="progressBar" class="progress-bar"></div></div>
                <div class="button-group">
                    <button id="previewButton" title="Quick Preview">👁️</button>
                    <button id="renderButton">R E N D E R</button>
                </div>
            </div>
        </div>
        <div id="render-overlay">
            <button id="cancelButton">STOP</button>
        </div>
    </div>

    <div id="preview-container">
        <canvas id="previewCanvas"></canvas>
        <video id="outputVideo" controls loop playsinline></video>
    </div>
    
    <script src="main.js"></script>
</body>
</html>
