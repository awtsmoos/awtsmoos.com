<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Awtsmoos Ein Sof [Quantum V5.2]</title>
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/effects.css">
</head>
<body>
    <div class="app-container">
        <!-- CONTROLS -->
        <aside id="controls-wrapper" class="glass-panel">
            <header>
                <div class="logo-area"><h1>EIN SOF</h1><span class="version">V5.2</span></div>
                <div class="header-actions">
                     <select id="preset-select"><option value="">Presets...</option></select>
                     <button id="save-preset-btn" class="icon-btn" title="Save">💾</button>
                     <button id="randomize-all-btn" class="icon-btn" title="Chaos">🎲</button>
                </div>
            </header>

            <div id="controls" class="scroll-area">
                
                <!-- CORE SETTINGS -->
                <fieldset>
                    <legend>Merkabah (Core)</legend>
                    <div class="row">
                        <div class="form-group half"><label>Mode</label><select id="renderMode"><option value="image">Image Batch</option><option value="video">Video</option></select></div>
                        <div class="form-group half"><label>FPS</label><input type="number" id="frameRate" value="24" min="1" max="60"></div>
                    </div>
                    <div class="row">
                        <div class="form-group half"><label>Width</label><input type="number" id="videoWidth" value="1080"></div>
                        <div class="form-group half"><label>Height</label><input type="number" id="videoHeight" value="1920"></div>
                    </div>
                </fieldset>

                <!-- INPUT SETTINGS -->
                <fieldset>
                    <legend>Kelim (Input)</legend>
                    <div class="form-group"><label>Header Text</label><input type="text" id="headerText" placeholder="Top Title..."></div>
                    
                    <div class="tabs">
                        <label class="tab"><input type="radio" name="capSrc" value="simple" checked onclick="document.getElementById('captionSource').value='simple';"> Simple</label>
                        <label class="tab"><input type="radio" name="capSrc" value="srt" onclick="document.getElementById('captionSource').value='srt';"> SRT</label>
                    </div>
                    <select id="captionSource" style="display:none;"><option value="simple">Simple</option><option value="srt">SRT</option></select>

                    <div id="simple-caption-controls">
                        <textarea id="mainCaptions" placeholder="Enter captions..."></textarea>
                        <div class="row" id="dual-caption-toggle-container">
                            <label class="toggle-switch"><input type="checkbox" id="dualCaptionToggle"> Dual Language</label>
                        </div>
                        <textarea id="translationCaptions" class="hidden-control" placeholder="Translation..."></textarea>
                    </div>

                    <div id="srt-caption-controls" class="hidden-control">
                        <label class="file-label">Primary SRT <input type="file" id="srtFile"></label>
                        <label class="file-label">Trans SRT <input type="file" id="translationSrtFile"></label>
                    </div>
                    <div class="form-group">
                        <label class="file-label">Audio Source <input type="file" id="audioFile" accept="audio/*"></label>
                    </div>
                </fieldset>

                <!-- PARTICLE SYSTEM (RESTORED!) -->
                <fieldset>
                    <legend>Olam Yetzirah (Particles)</legend>
                    <span class="fieldset-randomize">🎲</span>
                    
                    <div class="control-group" data-control-name="particleDensity">
                        <label>Density <span class="value-display" id="particleDensityValue">150</span></label>
                        <input type="range" id="particleDensity" min="0" max="300" value="150">
                    </div>
                    
                    <div class="row">
                        <div class="control-group half" data-control-name="minParticleSize">
                            <label>Min Size</label>
                            <input type="range" id="minParticleSize" min="1" max="50" value="5">
                        </div>
                        <div class="control-group half" data-control-name="maxParticleSize">
                            <label>Max Size</label>
                            <input type="range" id="maxParticleSize" min="5" max="150" value="80">
                        </div>
                    </div>

                    <div class="control-group" data-control-name="particleSpeed">
                        <label>Warp Speed <span class="value-display" id="particleSpeedValue">1.0</span></label>
                        <input type="range" id="particleSpeed" min="0" max="5" step="0.1" value="1.0">
                    </div>

                    <div class="control-group" data-control-name="particleColorShift">
                        <label>Color Shift</label>
                        <input type="range" id="particleColorShift" min="0" max="180" value="30">
                    </div>

                    <div class="form-group">
                        <label>Characters</label>
                        <input type="text" id="particleChars" value="אבגדהוזחטיכלמנסעפצקרשת•">
                    </div>
                </fieldset>

                <!-- VISUALS -->
                <fieldset>
                    <legend>Olam HaBa (Visuals)</legend>
                    <span class="fieldset-randomize">🎲</span>
                    
                    <div class="form-group">
                        <label class="file-label">Background Image <input type="file" id="backgroundImageInput" accept="image/*"></label>
                        <div class="slider-group" data-control-name="backgroundOpacity" style="margin-top:10px;">
                            <label>Opacity</label><input type="range" id="backgroundOpacity" min="0" max="1" step="0.05" value="1.0">
                        </div>
                    </div>

                    <div class="control-group" data-control-name="basePaletteColor">
                        <label>Base Color</label><input type="color" id="basePaletteColor" value="#8A2BE2">
                    </div>
                    
                    <div class="form-group">
                        <label class="file-label">Floating Portals <input type="file" id="portalImages" accept="image/*" multiple></label>
                    </div>
                </fieldset>

                <!-- EFFECTS -->
                <fieldset>
                    <legend>Tohu (FX)</legend>
                    <span class="fieldset-randomize">🎲</span>
                    <div class="fx-grid">
                        <label class="toggle-card"><input type="checkbox" id="enableMirrorMode"><span>Mirror</span></label>
                        <label class="toggle-card"><input type="checkbox" id="enableSepia"><span>Sepia</span></label>
                        <label class="toggle-card"><input type="checkbox" id="enableAnalogNoise"><span>Noise</span></label>
                        <label class="toggle-card"><input type="checkbox" id="enableRGBPulse"><span>Pulse</span></label>
                        <label class="toggle-card"><input type="checkbox" id="enableLensDistortion"><span>Distort</span></label>
                        <label class="toggle-card"><input type="checkbox" id="enableSimpleBorder"><span>Border</span></label>
                        <label class="toggle-card"><input type="checkbox" id="enableTextGlitch"><span>Glitch</span></label>
                        <label class="toggle-card"><input type="checkbox" id="enableWaveform"><span>Audio</span></label>
                        <label class="toggle-card"><input type="checkbox" id="enableVCRStamp"><span>VCR</span></label>
                        <label class="toggle-card"><input type="checkbox" id="enableScanLines"><span>Scan</span></label>
                        <label class="toggle-card"><input type="checkbox" id="enableVignette" checked><span>Vignette</span></label>
                        <label class="toggle-card"><input type="checkbox" id="enableChromaticAberration"><span>RGB</span></label>
                        <label class="toggle-card"><input type="checkbox" id="dynamicBackgroundToggle" checked><span>Anim BG</span></label>
                    </div>
                    <div class="control-group" data-control-name="cinematicBarHeight">
                        <label>Cinema Bars %</label><input type="range" id="cinematicBarHeight" min="0" max="20" value="0">
                    </div>
                </fieldset>

                <!-- OUTPUT -->
                <fieldset>
                    <legend>Output</legend>
                    <div class="form-group">
                        <label class="toggle-switch"><input type="checkbox" id="enableImageDownload"> Download Images</label>
                    </div>
                    <div id="image-download-folder-controls" class="hidden-control">
                        <button id="selectDownloadFolderButton" class="secondary-btn">Select Folder</button>
                        <div id="selectedDownloadFolderDisplay" class="status-text">None selected</div>
                    </div>
                </fieldset>
            </div>

            <footer id="actions-footer">
                <div id="status">Ready</div>
                <div id="progressContainer"><div id="progressBar"></div></div>
                <div class="main-buttons">
                    <button id="previewButton" class="secondary-btn">👁️ Preview<
