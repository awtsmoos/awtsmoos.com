<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ein Sof Engine [Omega Engine v11.1]</title>
<style>
:root {
--bg-color: #0c0c10;
--widget-bg: #1a1a22;
--text-color: #e8e8f0;
--primary-color: #ff3c78;
--secondary-color: #00f2ea;
--border-color: #2a2a33;
--font-display: 'Teko', sans-serif;
--font-mono: 'Fira Code', monospace;
}
@import url('https://fonts.googleapis.com/css2?family=Teko:wght@700&family=Fira+Code&display=swap');



* { box-sizing: border-box; }

    body {
        font-family: var(--font-mono);
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 30px;
        background-color: var(--bg-color);
        padding: 20px;
        margin: 0;
        color: var(--text-color);
        overflow-x: hidden;
    }

    #controls {
        width: 500px;
        padding: 20px;
        background-color: var(--widget-bg);
        border-radius: 16px;
        border: 1px solid var(--border-color);
        box-shadow: 0 20px 70px rgba(0,0,0,0.9);
        overflow-y: auto;
        max-height: 95vh;
    }
    
    #controls::-webkit-scrollbar { width: 8px; }
    #controls::-webkit-scrollbar-track { background: var(--bg-color); }
    #controls::-webkit-scrollbar-thumb { background-color: var(--secondary-color); border-radius: 4px; border: 2px solid var(--bg-color); }

    h2 {
        font-family: var(--font-display);
        font-size: 3em;
        color: var(--text-color);
        text-align: center;
        letter-spacing: 4px;
        text-transform: uppercase;
        margin: 10px 0 30px 0;
        text-shadow: 0 0 15px var(--secondary-color), 0 0 5px #fff;
    }

    fieldset {
        border: 1px solid var(--border-color);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 30px;
    }

    legend {
        font-family: var(--font-display);
        color: var(--secondary-color);
        letter-spacing: 3px;
        font-size: 2em;
        text-transform: uppercase;
        padding: 0 15px;
        text-shadow: 0 0 10px var(--secondary-color);
    }

    .control-group { margin-bottom: 20px; }
    .randomize-controls { display: none; margin-top: 10px; padding-left: 20px; border-left: 2px solid var(--border-color); }
    .randomize-toggle:checked ~ .randomize-controls { display: block; }

    label {
        display: block;
        font-weight: 500;
        margin-bottom: 10px;
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: #ccc;
    }
    
    .value-display { font-weight: bold; color: var(--secondary-color); float: right; }
    .label-with-random { display: flex; justify-content: space-between; align-items: center; }
    .randomize-toggle { margin-left: 10px; accent-color: var(--secondary-color); }
    
    input[type="range"] { width: 100%; margin-top: 5px; -webkit-appearance: none; background: transparent; }
    input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: var(--border-color); border-radius: 2px;}
    input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; background: var(--secondary-color); border-radius: 50%; border: 2px solid var(--bg-color); margin-top: -8px; box-shadow: 0 0 10px var(--secondary-color); cursor: pointer; }
    
    input, textarea, select, button.util-btn {
        width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px;
        background-color: #0c0c10; color: var(--text-color); font-size: 16px; font-family: var(--font-mono);
    }
    input[type="color"] { height: 40px; padding: 2px; }
    input[type="checkbox"] { width: auto; }
    textarea { height: 150px; resize: vertical; line-height: 1.6; }
    
    .util-btn-group { display: flex; gap: 10px; margin-bottom: 10px; }
    button.util-btn { cursor: pointer; background: var(--widget-bg); color: var(--secondary-color); transition: background-color 0.2s, color 0.2s; }
    button.util-btn:hover { background: var(--secondary-color); color: var(--bg-color); }
    
    #generateBtn {
        width: 100%; padding: 20px; font-size: 28px; font-weight: 700; color: #000;
        background: linear-gradient(45deg, var(--secondary-color), #f9c80e); border: none; border-radius: 10px;
        cursor: pointer; transition: all 0.3s ease-in-out; letter-spacing: 4px; font-family: var(--font-display);
        margin-top: 10px; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); animation: pulse-glow 2.5s infinite ease-in-out;

    @keyframes pulse-glow { 0%, 100% { box-shadow: 0 0 20px rgba(0, 242, 234, 0.4); } 50% { box-shadow: 0 0 35px rgba(0, 242, 234, 0.8); } }
    #generateBtn:hover:not(:disabled) { transform: translateY(-5px) scale(1.05); }
    #generateBtn:disabled { background: #444; color: #888; cursor: not-allowed; transform: none; box-shadow: none; animation: none;}
    
    #processingStatus { display: none; text-align: center; margin-top: 20px; font-size: 20px; font-family: var(--font-display); letter-spacing: 2px; color: var(--primary-color); animation: status-flicker 1.2s infinite; }
    @keyframes status-flicker { 0%, 100% { opacity: 1; text-shadow: 0 0 8px var(--primary-color); } 50% { opacity: 0.7; text-shadow: none; } }
    
    #preview-container {

        background-color: #000; border-radius: 16px; overflow: hidden; border: 2px solid var(--border-color); flex-shrink: 0;

    }
    #previewCanvas { width: 100%; height: 100%; display: block; }

    @media (max-width: 1100px) {
        body { flex-direction: column; align-items: center; padding: 10px; }
        #controls { width: 95vw; max-height: none; padding: 15px; }
        #preview-container { width: 95vw; height: calc(95vw * 1.7777); }
    }
</style>

<!-- Omega Engine Worker v11.1 -->
<script id="workerScript" type="javascript/worker">
    const PARTICLE_COLORS = ['#ff5c78', '#00f2ea', '#f9c80e', '#be73ff', '#ffffff'];

    // --- UTILITY FUNCTIONS ---
    function hexToRgb(hex) {
        const r = parseInt(hex.substring(1, 3), 16);
        const g = parseInt(hex.substring(3, 5), 16);
        const b = parseInt(hex.substring(5, 7), 16);
        return {r: r, g: g, b: b};
    }
    function hexToRgba(hex, alpha) {
        const rgb = hexToRgb(hex);
        return 'rgba(' + rgb.r + ',' + rgb.g + ',' + rgb.b + ',' + alpha + ')';
    }
    // Psuedo-random number generator for seeded randomness
    function PRNG(seed) {
        this.seed = seed % 2147483647;
        if (this.seed <= 0) this.seed += 2147483646;
    }
    PRNG.prototype.next = function() {
        return this.seed = this.seed * 16807 % 2147483647;
    };
    PRNG.prototype.random = function() {
        return (this.next() - 1) / 2147483646;
    };

    // --- RENDER PIPELINE ORCHESTRATOR ---
    function BorehOlam(mainCtx, caption, header, initialSettings, resolution) {
        const seed = Math.random();
        const rng = new PRNG(seed * 10000);
        const settings = randomizeSettings(initialSettings, rng);

        // Layer Setup
        const baseLayer = new OffscreenCanvas(resolution.width, resolution.height);
        const baseCtx = baseLayer.getContext('2d');
        const particleLayer = new OffscreenCanvas(resolution.width, resolution.height);
        const particleCtx = particleLayer.getContext('2d');
        const glowLayer = new OffscreenCanvas(resolution.width, resolution.height);
        const glowCtx = glowLayer.getContext('2d');
        const compositeLayer = new OffscreenCanvas(resolution.width, resolution.height);
        const compositeCtx = compositeLayer.getContext('2d');
        const uiLayer = new OffscreenCanvas(resolution.width, resolution.height);
        const uiCtx = uiLayer.getContext('2d');
        
        // 1. Render static background elements
        renderBackground(baseCtx, settings, resolution, seed);
        renderNebulas(baseCtx, settings, resolution, rng);
        renderFractalRifts(baseCtx, settings, resolution, rng);
        renderCelestialBodies(baseCtx, glowCtx, settings, resolution, rng);

        // 2. Render all particles to their own layer
        const universe = generateUniverse(settings, resolution, rng);
        renderParticles(particleCtx, glowCtx, universe.particles, settings);
        
        // 3. Composite the background and time-stuttered particles
        compositeCtx.drawImage(baseLayer, 0, 0);
        if (settings.stutterEchoes > 0) {
            compositeCtx.save();
            compositeCtx.globalAlpha = 1.0 / (settings.stutterEchoes + 1);
            for (let i = settings.stutterEchoes; i >= 0; i--) {
                const timeOffset = i * settings.stutterDilation;
                const tempParticleCanvas = new OffscreenCanvas(resolution.width, resolution.height);
                const tempParticleCtx = tempParticleCanvas.getContext('2d');
                applyWindToParticles(tempParticleCtx, particleLayer, settings, timeOffset);
                compositeCtx.drawImage(tempParticleCanvas, 0, 0);
            }
            compositeCtx.restore();
        } else {
             applyWindToParticles(compositeCtx, particleLayer, settings, 0);
        }
        
        // 4. Draw final composite to main canvas and apply bloom
        // *** FIX: Draw the CANVAS (compositeLayer), not the context (compositeCtx) ***
        mainCtx.drawImage(compositeLayer, 0, 0);
        applyBloom(mainCtx, glowLayer);
        
        // 5. Apply final post-processing to the entire universe
        applyPostProcessing(mainCtx, rng, settings, resolution);
        
        // 6. Render the pristine UI layer on top of the finished universe
        renderHologram(uiLayer, caption, header, settings, resolution, rng);
        renderCornerText(uiLayer, resolution);
        mainCtx.drawImage(uiLayer, 0, 0);
    }

    function randomizeSettings(initialSettings, rng) {
        const settings = {};
        for (const key in initialSettings) {
            const setting = initialSettings[key];
            if (setting && setting.randomize) {
                const min = parseFloat(setting.min);
                const max = parseFloat(setting.max);
                const val = min + rng.random() * (max - min);
                const isInt = Number.isInteger(parseFloat(setting.value));
                settings[key] = isInt ? Math.round(val) : val;
            } else {
                settings[key] = setting.value;
            }
        }
        return settings;
    }

    function generateUniverse(settings, resolution, rng) {
        const particles = [];
        const chars = Array.from(settings.particleChars).length > 0 ? Array.from(settings.particleChars) : ['•'];
        for (let i = 0; i < settings.particleDensity; i++) {
            const z = rng.random();
            particles.push({
                x: rng.random() * resolution.width, y: rng.random() * resolution.height, z: z,
                size: (settings.minParticleSize + (settings.maxParticleSize - settings.minParticleSize) * z * z),
                char: chars[Math.floor(rng.random() * chars.length)],
                color: PARTICLE_COLORS[Math.floor(rng.random() * PARTICLE_COLORS.length)],
            });
        }
        particles.sort((a, b) => a.z - b.z);
        return { particles: particles };
    }
    
    function renderBackground(ctx, settings, resolution, seed) {
        const p = new Array(512);

    function renderFractalRifts(ctx, settings, resolution, rng) {
        if (settings.riftCount <= 0) return;
        ctx.save();
        ctx.strokeStyle = 'rgba(200, 220, 255, 0.1)';
        ctx.shadowColor = 'rgba(180, 210, 255, 1)';
        ctx.shadowBlur = 15;
        ctx.lineWidth = 2;
        
        function drawRift(x, y, angle, length, depth) {
            if (depth <= 0 || length < 5) return;
            ctx.beginPath();
            ctx.moveTo(x, y);
            const x2 = x + Math.cos(angle) * length;
            const y2 = y + Math.sin(angle) * length;
            ctx.lineTo(x2, y2);
            ctx.stroke();
            
            const angleChange = (rng.random() - 0.5) * 1.5;
            const lengthScale = 0.7 + rng.random() * 0.2;
            drawRift(x2, y2, angle + angleChange, length * lengthScale, depth - 1);
            if (rng.random() > 0.6) {
                const branchAngle = angle + (rng.random() > 0.5 ? 1 : -1) * (Math.PI / 3);
                drawRift(x2, y2, branchAngle, length * 0.6, depth - 1);
            }
        }
        for(let i=0; i<settings.riftCount; i++) {
            drawRift(rng.random() * resolution.width, rng.random() * resolution.height, rng.random() * Math.PI * 2, resolution.height / 4, 10);
        }
        ctx.restore();
    }

    function renderCelestialBodies(ctx, glowCtx, settings, resolution, rng) {
        if (settings.celestialBodyCount <= 0) return;
        for (let i = 0; i < settings.celestialBodyCount; i++) {
            const size = (rng.random() * 0.8 + 0.2) * (resolution.width / 8);
            const x = rng.random() * resolution.width;
            const y = rng.random() * resolution.height;
            const color = [settings.nebulaColor1, settings.nebulaColor2, settings.nebulaColor3][Math.floor(rng.random() * 3)];
            const rgb = hexToRgb(color);

            // Draw main body
            ctx.save();
            const bodyGrad = ctx.createRadialGradient(x - size * 0.2, y - size * 0.2, size * 0.1, x, y, size);
            bodyGrad.addColorStop(0, `rgba(${rgb.r+80}, ${rgb.g+80}, ${rgb.b+80}, 1)`);
            bodyGrad.addColorStop(0.8, `rgba(${rgb.r}, ${rgb.g}, ${rgb.b}, 1)`);
            bodyGrad.addColorStop(1, `rgba(${rgb.r/2}, ${rgb.g/2}, ${rgb.b/2}, 1)`);
            ctx.fillStyle = bodyGrad;

            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.fill();

            glowCtx.save();
            const glowGrad = glowCtx.createRadialGradient(x, y, size * 0.8, x, y, size * 2.5);
            glowGrad.addColorStop(0, hexToRgba(color, 0.4));
            glowGrad.addColorStop(1, hexToRgba(color, 0));
            glowCtx.fillStyle = glowGrad;
            glowCtx.beginPath();
            glowCtx.arc(x, y, size * 2.5, 0, Math.PI * 2);

            ctx.fillStyle = hexToRgba(p.color, alpha);

    function applyWindToParticles(ctx, particleLayer, settings, timeOffset) {
        if (timeOffset === 0 && settings.windStrength === 0) {
             ctx.drawImage(particleLayer, 0, 0);
             return;

        const angleRad = settings.windAngle * (Math.PI / 180);
        const windX = Math.cos(angleRad) * settings.windStrength * (timeOffset / 100);
        const windY = Math.sin(angleRad) * settings.windStrength * (timeOffset / 100);
        ctx.setTransform(1, 0, 0, 1, windX, windY);
        ctx.drawImage(particleLayer, 0, 0);
        ctx.setTransform(1, 0, 0, 1, 0, 0); // Reset transform
    }
    
    function renderHologram(ctx, caption, header, settings, resolution, rng) {
        const w = resolution.width;
        const h = resolution.height;
        const boxW = w * (settings.boxWidth / 100);
        const boxH = h * (settings.boxHeight / 100);
        const boxX = (w - boxW) / 2;
        const boxY = (h - boxH) / 2;
        
        ctx.save();
        ctx.translate(boxX, boxY);
        
        // Apply Skew
        ctx.transform(1, 0, settings.hologramSkew, 1, -settings.hologramSkew * (boxH/2), 0);
        
        // Draw Box and Scanlines
        ctx.strokeStyle = '#00f2ea';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#00f2ea';
        ctx.shadowBlur = 20;
        ctx.strokeRect(0, 0, boxW, boxH);
        ctx.lineWidth = 1;
        ctx.shadowBlur = 5;
        for (let i = 0; i < boxH; i += 4) {
            ctx.beginPath();
            ctx.moveTo(0, i);
            ctx.lineTo(boxW, i);
            ctx.globalAlpha = 0.1 + rng.random() * 0.2;
            ctx.stroke();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur = 0;
        
        // Draw Text
        const padding = 40;
        const textMaxWidth = boxW - padding * 2;
        const textMaxHeight = boxH - padding * 2 - (header ? 60 : 0);
        const { fontSize, lines } = calculateOptimalFontSize(ctx, caption, textMaxWidth, textMaxHeight);
        
        const lightX = (settings.lightX / 100) * boxW;
        const lightY = (settings.lightY / 100) * boxH;

        // Draw Header
        if(header) {
             drawTextWithAberration(ctx, header, boxW / 2, padding, fontSize * 1.2, true, lightX, lightY);
        }
        
        // Draw Main Text
        const totalTextHeight = lines.length * fontSize * 1.5;
        let currentY = (boxH - totalTextHeight) / 2 + (header ? 30 : 0);
        
        lines.forEach(line => {
            drawTextWithAberration(ctx, line, boxW / 2, currentY, fontSize, false, lightX, lightY);
            currentY += fontSize * 1.5;
        });
        
        ctx.restore();
    }

    function calculateOptimalFontSize(ctx, text, maxWidth, maxHeight) {
        let fontSize = 200;
        let lines = [];
        
        while (fontSize > 10) {
            ctx.font = `bold ${fontSize}px Fira Code`;
            const words = text.split(' ');
            lines = [];
            let currentLine = words[0];

            for (let i = 1; i < words.length; i++) {
                const word = words[i];
                const testLine = currentLine + " " + word;
                const metrics = ctx.measureText(testLine);
                if (metrics.width > maxWidth && i > 0) {
                    lines.push(currentLine);
                    currentLine = word;
                } else {
                    currentLine = testLine;
                }
            }
            lines.push(currentLine);
            
            const totalHeight = lines.length * fontSize * 1.5;
            if (totalHeight <= maxHeight) {
                return { fontSize, lines };
            }
            fontSize -= 2;
        }
        return { fontSize: 10, lines };
    }

    function drawTextWithAberration(ctx, text, x, y, size, isHeader, lightX, lightY) {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = `${isHeader ? 'bold' : ''} ${size}px ${isHeader ? 'Teko' : 'Fira Code'}`;
        if(isHeader) ctx.textTransform = 'uppercase';

        // Base text with gradient
        const gradient = ctx.createLinearGradient(x-size*2, y-size, x+size*2, y+size);
        const dist = Math.sqrt(Math.pow(x - lightX, 2) + Math.pow(y - lightY, 2));
        const brightness = Math.max(0.2, 1 - dist / 1000);
        gradient.addColorStop(0, `rgba(255, 255, 255, ${brightness})`);
        gradient.addColorStop(0.5, `rgba(200, 255, 255, ${brightness})`);
        gradient.addColorStop(1, `rgba(180, 240, 230, ${brightness})`);
        ctx.fillStyle = gradient;

        // Chromatic aberration
        const offset = size / 50;
        ctx.globalCompositeOperation = 'lighter';
        ctx.fillStyle = 'rgba(255, 0, 100, 0.8)';
        ctx.fillText(text, x - offset, y);
        ctx.fillStyle = 'rgba(0, 255, 255, 0.8)';
        ctx.fillText(text, x + offset, y);
        
        // Base text on top
        ctx.globalCompositeOperation = 'source-over';
        ctx.fillStyle = gradient;
        ctx.shadowColor = '#00f2ea';
        ctx.shadowBlur = 15;
        ctx.fillText(text, x, y);
        
        ctx.restore();
    }

    function renderCornerText(ctx, resolution) {
        ctx.save();
        ctx.font = "24px Teko";
        ctx.fillStyle = "rgba(0, 242, 234, 0.5)";
        ctx.textAlign = "left";
        ctx.fillText("OMEGA ENGINE v11.1 // EIN SOF", 20, 30);
        ctx.textAlign = "right";
        ctx.fillText("STATUS: ACTIVE // BorehOlam()", resolution.width - 20, resolution.height - 20);
        ctx.restore();
    }
    
    function applyBloom(ctx, glowLayer) {
        ctx.save();
        ctx.globalCompositeOperation = 'lighter';
        ctx.globalAlpha = 0.8;
        ctx.filter = 'blur(15px)';
        ctx.drawImage(glowLayer, 0, 0);
        ctx.globalAlpha = 0.5;
        ctx.filter = 'blur(40px)';
        ctx.drawImage(glowLayer, 0, 0);
        ctx.restore();
    }

    function applyPostProcessing(mainCtx, rng, settings, resolution) {
        // Vignette
        const gradient = mainCtx.createRadialGradient(
            resolution.width/2, resolution.height/2, resolution.height/2,
            resolution.width/2, resolution.height/2, resolution.height
        );
        gradient.addColorStop(0, 'rgba(0,0,0,0)');
        gradient.addColorStop(1, 'rgba(0,0,0,0.5)');
        mainCtx.fillStyle = gradient;
        mainCtx.fillRect(0, 0, resolution.width, resolution.height);

        // Lens Distortion
        if (settings.lensDistortion > 0) {
            mainCtx.save();
            const centerX = resolution.width / 2;
            const centerY = resolution.height / 2;
            const scale = 1.0 + settings.lensDistortion;
            mainCtx.translate(centerX, centerY);
            mainCtx.scale(scale, scale);
            mainCtx.translate(-centerX, -centerY);
            mainCtx.drawImage(mainCtx.canvas, 0, 0); // draw the already-drawn canvas onto itself with distortion
            mainCtx.restore();
        }
    }

    self.onmessage = function(event) {
        const { settings, captions, resolution } = event.data;
        const canvas = new OffscreenCanvas(resolution.width, resolution.height);
        const context = canvas.getContext('2d', { willReadFrequently: true });
        
        const processCaptions = async function() {
            for (let i = 0; i < captions.length; i++) {
                self.postMessage({ type: 'progress', message: 'INITIATING VISION ' + (i + 1) + '/' + captions.length, index: i });
                await new Promise(resolve => setTimeout(resolve, 20));
                BorehOlam(context, captions[i], settings.headerInput.value, settings, resolution);
                self.postMessage({ type: 'progress', message: 'TRANSMITTING VISION ' + (i + 1) + '/' + captions.length, index: i });
                const imageBitmap = canvas.transferToImageBitmap();
                self.postMessage({ type: 'result', imageBitmap: imageBitmap, index: i }, [imageBitmap]);
            }
            self.postMessage({ type: 'complete', message: 'ASCENSION COMPLETE' });
        };
        processCaptions();

            const allControls = document.querySelectorAll('input, select, textarea');

                if (control) {
                    const id = control.id;

                    if (group.dataset.controlName) {
                        settings[controlName] = {

                            randomize: group.querySelector('.randomize-toggle').checked,

                   if (this.elements[key + '_min']) this.elements[key + '_min'].value = data.min;

            grad.addColorStop(1, '#0c0c10');
            pCtx.fillStyle = grad;
            pCtx.fillRect(0, 0, res.width, res.height);
            pCtx.font = "700 150px 'Teko', sans-serif";
            pCtx.textAlign = 'center';
            pCtx.textBaseline = 'middle';
            pCtx.fillStyle = 'rgba(0, 242, 234, 0.8)';
            pCtx.shadowColor = 'rgba(0, 242, 234, 1)';
            pCtx.shadowBlur = 25;
            pCtx.fillText("OMEGA ENGINE", res.width / 2, res.height / 2 - 50);
            pCtx.shadowBlur = 0;
            pCtx.font = "40px 'Teko', sans-serif";
            pCtx.fillStyle = 'rgba(255,255,255,0.7)';
            pCtx.fillText("QUANTUM CORE v11.1. AWAITING COMMAND.", res.width / 2, res.height / 2 + 100);
        }
    };

    const Persistence = {
        db: null,
        initPromise: null,
        DB_NAME: 'EinSofEngineDB_v11',
        STORE_NAME: 'settingsStore_v11',
        KEY: 'current_settings',
        
        init: function() {
            if (this.initPromise) return this.initPromise;
            this.initPromise = new Promise((resolve, reject) => {
                if (!window.indexedDB) {
                    console.warn("IndexedDB not supported. Falling back to localStorage.");
                    return reject("No IndexedDB support.");
                }
                const request = indexedDB.open(this.DB_NAME, 1);
                request.onupgradeneeded = event => {
                    const db = event.target.result;
                    if (!db.objectStoreNames.contains(this.STORE_NAME)) {
                        db.createObjectStore(this.STORE_NAME);
                    }
                };
                request.onerror = event => {
                    console.error("IndexedDB Error:", event.target.error);
                    reject("Failed to open database.");
                };
                request.onsuccess = event => {
                    this.db = event.target.result;
                    resolve(this.db);
                };
            });
            return this.initPromise;
        },

        save: async function(settingsObject) {
            try {
                const db = await this.init();
                const transaction = db.transaction(this.STORE_NAME, 'readwrite');
                const store = transaction.objectStore(this.STORE_NAME);
                store.put(JSON.stringify(settingsObject), this.KEY);
            } catch (error) {
                console.warn("IndexedDB save failed, falling back to LocalStorage.", error);
                try { localStorage.setItem(this.KEY, JSON.stringify(settingsObject)); } catch (e) { console.error("LocalStorage save also failed.", e); }
            }
        },

        load: async function() {
            try {
                const db = await this.init();
                return await new Promise((resolve, reject) => {
                    const transaction = db.transaction(this.STORE_NAME, 'readonly');
                    const store = transaction.objectStore(this.STORE_NAME);
                    const request = store.get(this.KEY);
                    request.onsuccess = () => resolve(JSON.parse(request.result || JSON.stringify(DEFAULT_SETTINGS)));
                    request.onerror = e => reject(e.target.error);
                });
            } catch (error) {
                console.warn("IndexedDB load failed, falling back to LocalStorage.", error);
                try { return JSON.parse(localStorage.getItem(this.KEY) || JSON.stringify(DEFAULT_SETTINGS)); } catch (e) { console.error("LocalStorage load also failed.", e); return DEFAULT_SETTINGS; }
            }
        }
    };

    const App = {
        worker: null,
        directoryHandle: null,
        generationTimestamp: 0,
        
        start: async function() {
            UI.init();
            this.initWorker();
            try {
                const savedSettings = await Persistence.load();
                UI.applySettings(savedSettings);
            } catch (error) {
                console.error("Failed to load settings, using defaults:", error);
                UI.applySettings(DEFAULT_SETTINGS);
            }
        },

        initWorker: function() {
            try {
                const workerScriptElement = document.getElementById('workerScript');
                const workerCode = workerScriptElement.textContent;
                const blob = new Blob([workerCode], { type: 'application/javascript' });
                this.worker = new Worker(URL.createObjectURL(blob));
                this.worker.onmessage = (event) => this.handleWorkerMessage(event.data);
            } catch (e) {
                console.error("Worker Initialization Failed:", e);
                UI.updateStatus("CRITICAL: WORKER FAILED TO START", true);
            }
        },

        handleWorkerMessage: function(data) {
            const { type, message, imageBitmap, index } = data;
            switch(type) {
                case 'progress': 
                    UI.updateStatus(message); 
                    if (message.startsWith('INITIATING')) {
                       const canvas = UI.elements.previewCanvas;
                       const ctx = canvas.getContext('2d');
                       ctx.fillStyle = 'black';
                       ctx.fillRect(0,0, canvas.width, canvas.height);
                       ctx.fillStyle = 'white';
                       ctx.font = "50px Teko";
                       ctx.textAlign = "center";
                       ctx.fillText(message, canvas.width/2, canvas.height/2);
                    }
                    break;
                case 'result':
                    const canvas = UI.elements.previewCanvas;
                    canvas.getContext('2d').drawImage(imageBitmap, 0, 0);
                    this.downloadCanvas(canvas, index);
                    break;
                case 'complete':
                    UI.updateStatus(message);
                    this.directoryHandle = null;
                    UI.hideProcessing();
                    break;
            }
        },

        generate: async function() {
            const captions = (UI.elements.batchInput.value.trim() || " ").split(/\n\s*\n/).map(b => b.trim()).filter(Boolean);
            if (captions.length === 0) {
                alert("Please provide some text in the Input field.");
                return;
            }

            UI.showProcessing();
            this.generationTimestamp = Date.now();
            this.directoryHandle = null; // Reset handle for each new batch
            
            if (UI.elements.useFolderPicker.checked && window.showDirectoryPicker) {
                try {
                     this.directoryHandle = await window.showDirectoryPicker();
                } catch (err) {
                    console.info("User cancelled folder picker. Files will be downloaded individually.");
                    UI.updateStatus("FOLDER PICKER CANCELLED", true);
                }
            }
            
            const settings = UI.getSettings();
            const resolution = { width: 1080, height: 1920 };
            this.worker.postMessage({ settings: settings, captions: captions, resolution: resolution });
        },
        
        saveSettings: async function() {
            const settings = UI.getSettings();
            await Persistence.save(settings);
        },
        
        copySettings: async function() {
             try {
                const settingsString = JSON.stringify(UI.getSettings(), null, 2);
                await navigator.clipboard.writeText(settingsString);
                UI.updateStatus("SETTINGS COPIED TO CLIPBOARD", true);
            } catch (err) {
                console.error('Failed to copy settings: ', err);
                UI.updateStatus("FAILED TO COPY SETTINGS", true);
            }
        },
        
        pasteSettings: async function() {
            try {
                const text = await navigator.clipboard.readText();
                const settings = JSON.parse(text);
                UI.applySettings(settings);
                await this.saveSettings();
                UI.updateStatus("SETTINGS PASTED FROM CLIPBOARD", true);
            } catch (err) {
                console.error('Failed to paste settings: ', err);
                 UI.updateStatus("INVALID SETTINGS IN CLIPBOARD", true);
            }
        },

        downloadCanvas: async function(canvas, index) {
            try {
                const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.95));
                const captions = (UI.elements.batchInput.value.trim() || "vision").split(/\n\s*\n/);
                const sanitizedCaption = (captions[index] || 'vision').substring(0, 20).replace(/[^a-z0-9]/gi, '_').toLowerCase();
                const filename = `BH_${this.generationTimestamp}_${sanitizedCaption}_${(index + 1)}.jpg`;

                if (this.directoryHandle) {
                    const fileHandle = await this.directoryHandle.getFileHandle(filename, { create: true });
                    const writable = await fileHandle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                } else {
                    const link = document.createElement('a');
                    link.download = filename;
                    link.href = URL.createObjectURL(blob);
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(link.href);
                }
            } catch (error) {
                console.error("Download failed:", error);
                UI.updateStatus(`DOWNLOAD ERROR: ${error.name}`, true);
                // On folder picker error, nullify the handle to revert to single downloads for the rest of the batch.
                if(error.name === 'NotAllowedError' || error.name === 'NotFoundError') {
                    this.directoryHandle = null; 
                }
            }
        }
    };
    App.start();
});
</script>
