<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ein Sof Engine [Quantum Core v2]</title>
    <style>
        :root {
            --bg-color: #0c0c10;
            --widget-bg: #1a1a22;
            --text-color: #e8e8f0;
            --primary-color: #ff3c78;
            --secondary-color: #00f2ea;
            --border-color: #2a2a33;
            --font-display: 'Teko', sans-serif;
            --font-mono: 'Fira Code', monospace;
        }
        @import url('https://fonts.googleapis.com/css2?family=Teko:wght@700&family=Fira+Code&display=swap');
        
        * { box-sizing: border-box; }

        body {
            font-family: var(--font-mono);
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 30px;
            background-color: var(--bg-color);
            padding: 20px;
            margin: 0;
            color: var(--text-color);
            overflow-x: hidden;
        }

        #controls {
            width: 500px;
            padding: 20px;
            background-color: var(--widget-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 20px 70px rgba(0,0,0,0.9);
            overflow-y: auto;
            max-height: 95vh;
        }
        
        /* Custom Scrollbar */
        #controls::-webkit-scrollbar { width: 8px; }
        #controls::-webkit-scrollbar-track { background: var(--bg-color); }
        #controls::-webkit-scrollbar-thumb { background-color: var(--secondary-color); border-radius: 4px; border: 2px solid var(--bg-color); }

        h2 {
            font-family: var(--font-display);
            font-size: 3em;
            color: var(--text-color);
            text-align: center;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin: 10px 0 30px 0;
            text-shadow: 0 0 15px var(--secondary-color), 0 0 5px #fff;
        }

        fieldset {
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        legend {
            font-family: var(--font-display);
            color: var(--secondary-color);
            letter-spacing: 3px;
            font-size: 2em;
            text-transform: uppercase;
            padding: 0 15px;
            text-shadow: 0 0 10px var(--secondary-color);
        }

        .control-group { margin-bottom: 20px; }
        
        label {
            display: block;
            font-weight: 500;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #ccc;
        }
        
        .value-display { font-weight: bold; color: var(--secondary-color); float: right; }
        
        input[type="range"] { width: 100%; margin-top: 5px; -webkit-appearance: none; background: transparent; }
        input[type="range"]::-webkit-slider-runnable-track { height: 4px; background: var(--border-color); border-radius: 2px;}
        input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; background: var(--secondary-color); border-radius: 50%; border: 2px solid var(--bg-color); margin-top: -8px; box-shadow: 0 0 10px var(--secondary-color); cursor: pointer; }
        
        input[type="color"] { height: 40px; padding: 2px; width: 100%; border: 1px solid var(--border-color); border-radius: 8px; background-color: var(--bg-color);}
        
        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background-color: #0c0c10;
            color: var(--text-color);
            font-size: 16px;
            font-family: var(--font-mono);
        }
        
        textarea { height: 150px; resize: vertical; line-height: 1.6; }
        
        #generateBtn {
            width: 100%;
            padding: 20px;
            font-size: 28px;
            font-weight: 700;
            color: #000;
            background: linear-gradient(45deg, var(--secondary-color), #f9c80e);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease-in-out;
            letter-spacing: 4px;
            font-family: var(--font-display);
            margin-top: 10px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
            animation: pulse-glow 2.5s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 242, 234, 0.4); }
            50% { box-shadow: 0 0 35px rgba(0, 242, 234, 0.8); }
        }

        #generateBtn:hover:not(:disabled) { transform: translateY(-5px) scale(1.05); }
        #generateBtn:disabled { background: #444; color: #888; cursor: not-allowed; transform: none; box-shadow: none; animation: none;}
        
        #processingStatus { display: none; text-align: center; margin-top: 20px; font-size: 20px; font-family: var(--font-display); letter-spacing: 2px; color: var(--primary-color); animation: status-flicker 1.2s infinite; }
        
        @keyframes status-flicker { 0%, 100% { opacity: 1; text-shadow: 0 0 8px var(--primary-color); } 50% { opacity: 0.7; text-shadow: none; } }
        
        #preview-container {
            width: 540px;
            height: 960px;
            position: relative;
            box-shadow: 0 10px 60px rgba(0,0,0,0.9);
            background-color: #000;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid var(--border-color);
            flex-shrink: 0;
        }
        #previewCanvas { width: 100%; height: 100%; display: block; }

        /* Mobile Responsive Styles */
        @media (max-width: 1100px) {
            body {
                flex-direction: column;
                align-items: center;
                padding: 10px;
            }
            #controls {
                width: 95vw;
                max-height: none;
                padding: 15px;
            }
            #preview-container {
                width: 95vw;
                height: calc(95vw * 1.7777); /* Maintain 9:16 aspect ratio */
            }
            h2 { font-size: 2.5em; }
            legend { font-size: 1.8em; }
        }
    </style>
</head>
<body>

    <div id="controls">
        <h2>Ein Sof Engine</h2>
        
        <fieldset>
            <legend>Gevulot (Boundaries)</legend>
            <div class="control-group">
                <label for="batchInput">Input (Single or Batch)</label>
                <textarea id="batchInput" placeholder="Enter text here. Separate paragraphs with a blank line for batch generation."></textarea>
            </div>
            <div class="control-group">
                <label for="headerInput">Header Text</label>
                <input type="text" id="headerInput" placeholder="Optional: Appears above caption">
            </div>
        </fieldset>
        
        <fieldset>
            <legend>Tzimtzum (Contraction)</legend>
            <div class="control-group">
                 <label for="boxColor">Box Color</label>
                 <input type="color" id="boxColor" value="#101018">
            </div>
            <div class="control-group">
                <label for="boxOpacity">Box Opacity <span class="value-display" id="boxOpacityValue">0.75</span></label>
                <input type="range" id="boxOpacity" min="0" max="1" step="0.05" value="0.75">
            </div>
            <div class="control-group">
                <label for="boxPadding">Padding <span class="value-display" id="boxPaddingValue">50</span></label>
                <input type="range" id="boxPadding" min="0" max="200" value="50">
            </div>
            <div class="control-group">
                <label for="boxRadius">Border Radius <span class="value-display" id="boxRadiusValue">20</span></label>
                <input type="range" id="boxRadius" min="0" max="300" value="20">
            </div>
        </fieldset>

        <fieldset>
            <legend>Olam Yetzirah (Formation)</legend>
            <div class="control-group">
                <label for="particleDensity">Density <span class="value-display" id="particleDensityValue">1800</span></label>
                <input type="range" id="particleDensity" min="100" max="5000" value="1800">
            </div>
             <div class="control-group">
                <label for="minParticleSize">Min Particle Size <span class="value-display" id="minParticleSizeValue">10</span></label>
                <input type="range" id="minParticleSize" min="1" max="50" value="10">
            </div>
            <div class="control-group">
                <label for="maxParticleSize">Max Particle Size <span class="value-display" id="maxParticleSizeValue">90</span></label>
                <input type="range" id="maxParticleSize" min="10" max="150" value="90">
            </div>
            <div class="control-group">
                <label for="particleStyle">Particle Style</label>
                <select id="particleStyle">
                    <option value="fragmented">Fragmented</option>
                    <option value="full">Full</option>
                </select>
            </div>
            <div class="control-group">
                <label for="particleChars">Particle Characters</label>
                <textarea id="particleChars" style="height: 100px;">אבגדהוזחטיכלמנסעפצקרשת</textarea>
            </div>
        </fieldset>
        
        <fieldset>
            <legend>Kavim v'Sefirot (Connections)</legend>
            <div class="control-group">
                <label for="networkType">Algorithm</label>
                <select id="networkType">
                    <option value="web">Fine Web</option>
                    <option value="arcs">Energy Arcs</option>
                    <option value="synapse">Neural Synapse</option>
                    <option value="none">None</option>
                </select>
            </div>
            <div class="control-group">
                <label for="connectionDensity">Connection Density <span class="value-display" id="connectionDensityValue">4</span></label>
                <input type="range" id="connectionDensity" min="0" max="10" value="4">
            </div>
        </fieldset>

        <fieldset>
            <legend>Marot Elokim (Visions)</legend>
            <div class="control-group">
                <label for="baseBgColor">Base Background Color</label>
                <input type="color" id="baseBgColor" value="#0A0814">
            </div>
            <div class="control-group">
                <label for="filmGrain">Film Grain Intensity <span class="value-display" id="filmGrainValue">25</span></label>
                <input type="range" id="filmGrain" min="0" max="50" value="25">
            </div>
             <div class="control-group">
                <label for="bloomIntensity">Bloom Intensity <span class="value-display" id="bloomIntensityValue">10</span></label>
                <input type="range" id="bloomIntensity" min="0" max="30" value="10">
            </div>
        </fieldset>

        <button id="generateBtn">A S C E N D</button>
        <div id="processingStatus">AWAITING COMMAND</div>
    </div>

    <div id="preview-container">
        <canvas id="previewCanvas"></canvas>
    </div>

    <script>
    // --- EMBEDDED WEB WORKER ---
    const workerScript = `
        const PARTICLE_COLORS = ['#ff5c98', '#00f2ea', '#f9c80e', '#be73ff', '#6f6f6f', '#ffffff'];

        // Core rendering orchestration
        function BorehOlam(ctx, caption, header, settings, resolution) {
            // Setup multiple layers for advanced effects
            const baseLayer = new OffscreenCanvas(resolution.width, resolution.height);
            const baseCtx = baseLayer.getContext('2d');
            const glowLayer = new OffscreenCanvas(resolution.width, resolution.height);
            const glowCtx = glowLayer.getContext('2d');

            const universe = generateUniqueUniverse(settings, resolution);
            
            // 1. Render the foundational layers
            renderBackground(baseCtx, settings, resolution);
            renderParticles(baseCtx, glowCtx, universe.particles, settings);
            renderNetwork(baseCtx, glowCtx, universe.particles, settings, resolution);
            
            // 2. Composite the glow layer onto the base layer
            applyBloom(baseCtx, glowLayer, settings);

            // 3. Render the UI text box on top
            renderText(baseCtx, caption, header, settings, resolution);
            
            // 4. Render corner text overlays
            renderCornerText(baseCtx, resolution);

            // 5. Apply final pixel-level post-processing
            applyPostProcessing(baseCtx, settings, resolution);

            // 6. Final draw to the main context
            ctx.drawImage(baseLayer, 0, 0);
        }
        
        function generateUniqueUniverse(settings, resolution) {
            const particles = [];
            const chars = Array.from(settings.particleChars);
            if (chars.length === 0) chars.push('•');
            for (let i = 0; i < settings.particleDensity; i++) {
                const z = Math.random();
                particles.push({
                    x: Math.random() * resolution.width, y: Math.random() * resolution.height, z,
                    size: (settings.minParticleSize + (settings.maxParticleSize - settings.minParticleSize) * z * z),
                    char: chars[Math.floor(Math.random() * chars.length)],
                    color: PARTICLE_COLORS[Math.floor(Math.random() * PARTICLE_COLORS.length)],
                });
            }
            particles.sort((a, b) => a.z - b.z);
            return { particles };
        }

        function renderBackground(ctx, settings, resolution) {
            ctx.fillStyle = settings.baseBgColor;
            ctx.fillRect(0, 0, resolution.width, resolution.height);

            // More complex nebula effect
            const createNebula = (x, y, radius, color) => {
                const gradient = ctx.createRadialGradient(x, y, 0, x, y, radius);
                gradient.addColorStop(0, color);
                gradient.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, resolution.width, resolution.height);
            };

            ctx.globalCompositeOperation = 'lighter';
            createNebula(resolution.width * 0.2, resolution.height * 0.3, resolution.width * 0.7, 'rgba(80, 90, 200, 0.15)');
            createNebula(resolution.width * 0.8, resolution.height * 0.7, resolution.width * 0.6, 'rgba(200, 80, 150, 0.12)');
            ctx.globalCompositeOperation = 'source-over';
        }
        
        function renderParticles(ctx, glowCtx, particles, settings) {
            particles.forEach(p => {
                const opacity = 0.2 + p.z * 0.8;
                const isBright = p.color === '#ffffff' || p.color === '#f9c80e' || p.color === '#00f2ea';
                
                if (isBright) {
                    glowCtx.font = \`\${p.size}px sans-serif\`;
                    glowCtx.fillStyle = p.color;
                    glowCtx.textAlign = 'center'; glowCtx.textBaseline = 'middle';
                    glowCtx.globalAlpha = opacity * 0.9;
                    glowCtx.fillText(p.char, p.x, p.y);
                }
                
                ctx.globalAlpha = opacity;
                ctx.font = \`\${p.size}px sans-serif\`;
                ctx.fillStyle = p.color;
                ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                
                if (settings.particleStyle === 'fragmented') {
                    ctx.save();
                    ctx.beginPath();
                    const angle = Math.random() * Math.PI * 2;
                    ctx.rect(
                        p.x - p.size / 2 + Math.cos(angle) * p.size / 4,
                        p.y - p.size / 2 + Math.sin(angle) * p.size / 4,
                        p.size, p.size
                    );
                    ctx.clip();
                    ctx.fillText(p.char, p.x, p.y);
                    ctx.restore();
                } else {
                    ctx.fillText(p.char, p.x, p.y);
                }
            });
            ctx.globalAlpha = 1.0;
        }

        function renderNetwork(ctx, glowCtx, particles, settings, resolution) {
             const connectable = particles.filter(p => p.z > 0.4);
             connectable.forEach(p1 => {
                let neighbors = connectable.filter(p2 => p1 !== p2)
                    .sort((a, b) => Math.hypot(p1.x - a.x, p1.y - a.y) - Math.hypot(p1.x - b.x, p1.y - b.y))
                    .slice(0, settings.connectionDensity);
                
                neighbors.forEach(p2 => {
                    if (Math.hypot(p1.x - p2.x, p1.y - p2.y) > 400) return;
                    const opacity = Math.min(p1.z, p2.z) * 0.8;
                    const color = p1.color;
                    
                    const drawFunc = (targetCtx) => {
                        switch(settings.networkType) {
                            case 'web': drawWeb(targetCtx, p1.x, p1.y, p2.x, p2.y, color, opacity); break;
                            case 'arcs': drawLightning(targetCtx, p1.x, p1.y, p2.x, p2.y, color, opacity); break;
                            case 'synapse': drawSynapse(targetCtx, p1.x, p1.y, p2.x, p2.y, color, opacity); break;
                        }
                    };
                    drawFunc(glowCtx);
                    drawFunc(ctx);
                });
            });
        }
        
        function renderText(ctx, caption, header, settings, resolution) {
            const targetBox = { width: resolution.width * 0.9, height: resolution.height * 0.4 };
            const fullCaption = header ? \`\${header}\\n\\n\${caption}\` : caption;
            const { lines } = calculateOptimalFontSize(ctx, fullCaption, header, targetBox.width - settings.boxPadding * 2, targetBox.height - settings.boxPadding * 2);

            if (lines.length === 0) return;

            let maxLineWidth = 0;
            lines.forEach(line => {
                ctx.font = \`700 \${line.fontSize}px 'Teko', sans-serif\`;
                maxLineWidth = Math.max(maxLineWidth, ctx.measureText(line.text).width);
            });
            const totalTextHeight = lines.reduce((acc, line) => acc + line.height, 0);

            const boxWidth = maxLineWidth + settings.boxPadding * 2;
            const boxHeight = totalTextHeight + settings.boxPadding * 2;
            const boxX = (resolution.width - boxWidth) / 2;
            const boxY = (resolution.height - boxHeight) / 2;
            
            const snap = ctx.getImageData(boxX, boxY, boxWidth, boxHeight);
            const blurCanvas = new OffscreenCanvas(boxWidth, boxHeight);
            const blurCtx = blurCanvas.getContext('2d');
            blurCtx.putImageData(snap, 0, 0);
            blurCtx.filter = 'blur(15px) brightness(0.8)';
            blurCtx.drawImage(blurCanvas, 0, 0);

            ctx.save();
            ctx.beginPath();
            ctx.roundRect(boxX, boxY, boxWidth, boxHeight, settings.boxRadius);
            ctx.clip();
            ctx.drawImage(blurCanvas, boxX, boxY);
            ctx.fillStyle = hexToRgba(settings.boxColor, settings.boxOpacity);
            ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
            ctx.restore();
            
            ctx.strokeStyle = 'rgba(0, 242, 234, 0.5)';
            ctx.lineWidth = 2;
            ctx.shadowColor = 'rgba(0, 242, 234, 1)';
            ctx.shadowBlur = 15;
            ctx.beginPath();
            ctx.roundRect(boxX, boxY, boxWidth, boxHeight, settings.boxRadius);
            ctx.stroke();
            ctx.shadowColor = 'transparent';

            let currentY = boxY + settings.boxPadding;
            lines.forEach(line => {
                const y = currentY + line.height / 2;
                drawTextWithBorder(ctx, line.text, resolution.width/2, y, line.fontSize, line.isHeader ? 'rgba(220,220,255,0.9)' : '#FFFFFF', line.fontSize * 0.1);
                currentY += line.height;
            });
        }
        
        function renderCornerText(ctx, resolution) {
            ctx.font = "700 40px 'Teko', sans-serif";
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('B"H', 35, 35);
            
            ctx.textAlign = 'right';
            ctx.fillText('ב"ה', resolution.width - 35, 35);
        }

        function applyBloom(ctx, glowLayer, settings) {
            ctx.save();
            ctx.globalCompositeOperation = 'lighter';
            
            // Apply a wide, soft glow first
            ctx.filter = \`blur(\${settings.bloomIntensity * 2}px)\`;
            ctx.globalAlpha = 0.6;
            ctx.drawImage(glowLayer, 0, 0);

            // Apply a tighter, brighter glow on top
            ctx.filter = \`blur(\${settings.bloomIntensity * 0.5}px)\`;
            ctx.globalAlpha = 1.0;
            ctx.drawImage(glowLayer, 0, 0);

            ctx.restore();
        }

        function applyPostProcessing(ctx, settings, resolution) {
            const imageData = ctx.getImageData(0, 0, resolution.width, resolution.height);
            const pixels = imageData.data;
            const srcPixels = new Uint8ClampedArray(pixels);

            const centerX = resolution.width / 2;
            const centerY = resolution.height / 2;
            const maxDist = Math.hypot(centerX, centerY);

            for (let i = 0; i < pixels.length; i += 4) {
                const x = (i / 4) % resolution.width;
                const y = Math.floor((i / 4) / resolution.width);
                const dist = Math.hypot(x - centerX, y - centerY);
                
                // Vignette & Scanlines
                const vAmount = Math.pow(dist / maxDist, 2.0) * 0.98;
                const scanLine = (y % 3 === 0) ? 0.95 : 1.0;
                
                // Film Grain
                const grain = (Math.random() - 0.5) * settings.filmGrain;
                
                // Chromatic Aberration
                const caOffset = Math.pow(dist / maxDist, 2.5) * 12;
                const rIndex = ((y * resolution.width + (x - Math.floor(caOffset))) * 4);
                const bIndex = ((y * resolution.width + (x + Math.floor(caOffset))) * 4);
                
                const r = srcPixels[rIndex] || srcPixels[i];
                const g = srcPixels[i + 1];
                const b = srcPixels[bIndex + 2] || srcPixels[i + 2];

                pixels[i]   = Math.max(0, r * (1 - vAmount) * scanLine + grain);
                pixels[i+1] = Math.max(0, g * (1 - vAmount) * scanLine + grain);
                pixels[i+2] = Math.max(0, b * (1 - vAmount) * scanLine + grain);
            }
            ctx.putImageData(imageData, 0, 0);
        }

        // Helper functions
        function calculateOptimalFontSize(ctx, fullText, header, maxWidth, maxHeight) {
            for (let fs = 250; fs > 10; fs-=2) {
                const headerSize = fs * 0.55;
                let currentY = 0;
                let lines = [];
                const blocks = fullText.split('\\n\\n');
                
                for(const block of blocks) {
                    const isHeaderBlock = header && lines.length === 0 && block.startsWith(header);
                    const fontSize = isHeaderBlock ? headerSize : fs;
                    const lineHeight = fontSize * 1.1;
                    ctx.font = \`700 \${fontSize}px 'Teko', sans-serif\`;
                    
                    const words = block.split(' ');
                    let currentLine = '';
                    for (const word of words) {
                        const testLine = currentLine ? \`\${currentLine} \${word}\` : word;
                        if (ctx.measureText(testLine).width > maxWidth && currentLine) {
                            lines.push({ text: currentLine, height: lineHeight, fontSize: fontSize, isHeader: isHeaderBlock });
                            currentY += lineHeight;
                            currentLine = word;
                        } else { currentLine = testLine; }
                    }
                    lines.push({ text: currentLine, height: lineHeight, fontSize: fontSize, isHeader: isHeaderBlock });
                    currentY += lineHeight;
                }
                if (currentY <= maxHeight) return { optimalFontSize: fs, lines };
            }
            return { optimalFontSize: 0, lines: [] };
        }
        function drawTextWithBorder(ctx, text, x, y, size, color, borderWidth) { ctx.font = \`700 \${size}px 'Teko', sans-serif\`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round'; ctx.strokeStyle = 'rgba(0,0,0,0.7)'; ctx.lineWidth = borderWidth; ctx.strokeText(text, x, y); ctx.fillStyle = color; ctx.fillText(text, x, y); }
        function drawWeb(ctx, x1, y1, x2, y2, color, opacity) { ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.strokeStyle = hexToRgba(color, opacity * 0.6); ctx.lineWidth = 0.5 + opacity; ctx.stroke(); }
        function drawLightning(ctx, x1, y1, x2, y2, color, opacity) { let p=[[x1,y1]],d=Math.hypot(x1-x2,y1-y2); for(let i=0;i<d/15;i++){let r=Math.random();p.push([x1+(x2-x1)*r,y1+(y2-y1)*r])} p.push([x2,y2]);p.sort((a,b)=>Math.hypot(a[0]-x1,a[1]-y1)-Math.hypot(b[0]-x1,b[1]-y1)); for(let i=1;i<p.length-1;i++){p[i][0]+=(Math.random()-0.5)*20;p[i][1]+=(Math.random()-0.5)*20} ctx.beginPath();ctx.moveTo(p[0][0],p[0][1]);p.forEach(pt=>ctx.lineTo(pt[0],pt[1]));ctx.strokeStyle=hexToRgba(color,opacity);ctx.lineWidth=1+opacity*3;ctx.stroke();}
        function drawSynapse(ctx, x1, y1, x2, y2, color, opacity) { const grad=ctx.createLinearGradient(x1,y1,x2,y2); grad.addColorStop(0,hexToRgba(color,opacity*0.2)); grad.addColorStop(0.5,hexToRgba(color,opacity)); grad.addColorStop(1,hexToRgba(color,opacity*0.2)); ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=grad;ctx.lineWidth=1+opacity;ctx.stroke();const s=3+opacity*6;ctx.fillStyle=hexToRgba(color,opacity);ctx.globalAlpha=opacity;ctx.beginPath();ctx.arc(x1,y1,s,0,2*Math.PI);ctx.fill();ctx.beginPath();ctx.arc(x2,y2,s,0,2*Math.PI);ctx.fill();ctx.globalAlpha=1;}
        function hexToRgba(hex, alpha) { const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16); return \`rgba(\${r},\${g},\${b},\${alpha})\`;}

        // --- Worker Entry Point ---
        self.onmessage = async (e) => {
            const { settings, captions, resolution } = e.data;
            const offscreenCanvas = new OffscreenCanvas(resolution.width, resolution.height);
            const offscreenCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });
            
            for (let i = 0; i < captions.length; i++) {
                postMessage({ type: 'progress', message: \`INITIATING VISION \${i + 1}/\${captions.length}\` });
                await new Promise(r => setTimeout(r, 20));
                BorehOlam(offscreenCtx, captions[i], settings.headerInput, settings, resolution);
                
                postMessage({ type: 'progress', message: \`TRANSMITTING VISION \${i + 1}/\${captions.length}\` });
                const imageBitmap = offscreenCanvas.transferToImageBitmap();
                postMessage({ type: 'result', imageBitmap, index: i + 1 }, [imageBitmap]);
            }
            postMessage({ type: 'complete', message: 'ASCENSION COMPLETE' });
        };
    `;
    
    document.addEventListener('DOMContentLoaded', () => {
        // --- UI AND MAIN THREAD LOGIC ---
        const previewCanvas = document.getElementById('previewCanvas');
        const pCtx = previewCanvas.getContext('2d');
        const resolution = { width: 1080, height: 1920 };
        previewCanvas.width = resolution.width;
        previewCanvas.height = resolution.height;

        const controls = {};
        const controlIds = [
            'batchInput', 'headerInput', 'networkType', 'particleChars', 'generateBtn', 'processingStatus',
            'particleDensity', 'minParticleSize', 'maxParticleSize', 'connectionDensity',
            'particleStyle', 'boxColor', 'boxOpacity', 'boxPadding', 'boxRadius',
            'baseBgColor', 'filmGrain', 'bloomIntensity'
        ];
        controlIds.forEach(id => controls[id] = document.getElementById(id));

        let worker;
        function initializeWorker() {
            const blob = new Blob([workerScript], { type: 'application/javascript' });
            worker = new Worker(URL.createObjectURL(blob));
            worker.onmessage = handleWorkerMessage;
        }
        
        function handleWorkerMessage(e) {
            const { type, message, imageBitmap, index } = e.data;
            switch(type) {
                case 'progress':
                    controls.processingStatus.textContent = message;
                    break;
                case 'result':
                    pCtx.drawImage(imageBitmap, 0, 0);
                    downloadCanvas(previewCanvas, index);
                    break;
                case 'complete':
                    controls.processingStatus.textContent = message;
                    setTimeout(() => {
                        controls.processingStatus.style.display = 'none';
                        controls.generateBtn.disabled = false;
                    }, 2000);
                    break;
            }
        }

        function handleBatchGenerate() {
            controls.generateBtn.disabled = true;
            controls.processingStatus.style.display = 'block';

            const settings = {};
            for (const id in controls) {
                const el = controls[id];
                if (el && typeof el.value !== 'undefined') {
                    const value = el.type === 'range' ? parseFloat(el.value) : el.value;
                    settings[id.replace('Value', '')] = value;
                }
            }
            const captions = parseInput(settings.batchInput);
            
            worker.postMessage({ settings, captions, resolution });
        }
        
        function setupEventListeners() {
            controls.generateBtn.addEventListener('click', handleBatchGenerate);
            document.querySelectorAll('input[type="range"]').forEach(slider => {
                const display = document.getElementById(`${slider.id}Value`);
                if (display) { slider.addEventListener('input', () => { display.textContent = slider.value; }); }
            });
        }
        
        function parseInput(text) { if (!text.trim()) return [" "]; const blocks = text.split(/\n\s*\n/); return blocks.map(block => block.trim()).filter(block => block.length > 0); }
        
        async function downloadCanvas(canvas, index) {
            const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.92));
            const link = document.createElement('a');
            const sanitizedCaption = parseInput(document.getElementById('batchInput').value)[index-1] || 'vision';
            const filename = sanitizedCaption.substring(0, 20).replace(/[^a-z0-9]/gi, '_').toLowerCase();
            link.download = `EinSof_${filename}_${index}.jpg`;
            link.href = URL.createObjectURL(blob);
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function drawInitialState() {
            const grad = pCtx.createLinearGradient(0,0,0,resolution.height);
            grad.addColorStop(0, '#1a1a22');
            grad.addColorStop(1, '#0c0c10');
            pCtx.fillStyle = grad;
            pCtx.fillRect(0,0,resolution.width, resolution.height);
            
            pCtx.font = "700 150px 'Teko', sans-serif";
            pCtx.textAlign = 'center';
            pCtx.textBaseline = 'middle';
            pCtx.fillStyle = 'rgba(0, 242, 234, 0.8)';
            pCtx.shadowColor = 'rgba(0, 242, 234, 1)';
            pCtx.shadowBlur = 25;
            pCtx.fillText("EIN SOF ENGINE", resolution.width/2, resolution.height/2 - 50);
            pCtx.shadowBlur = 0;
            
            pCtx.font = "40px 'Teko', sans-serif";
            pCtx.fillStyle='rgba(255,255,255,0.7)';
            pCtx.fillText("QUANTUM CORE v2. AWAITING COMMAND.", resolution.width/2, resolution.height/2 + 100);
        }

        initializeWorker();
        setupEventListeners();
        drawInitialState();
    });
    </script>
