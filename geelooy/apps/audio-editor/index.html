<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Trimmer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>B"H Audio Trimmer</h1>
        <div id="upload-section">
            <p>Select an audio file from your device to begin.</p>
            <input type="file" id="audio-file-input" accept="audio/*">
        </div>

        <div id="trimmer-section" class="hidden">
            <div id="waveform-container">
                <canvas id="waveform-canvas"></canvas>
                <div id="selection-overlay"></div>
                <div class="trim-handle" id="start-handle"></div>
                <div class="trim-handle" id="end-handle"></div>
            </div>
            <div id="controls">
                 <audio id="audio-player" controls></audio>
                 <div class="zoom-controls">
                    <label for="zoom-slider">Zoom:</label>
                    <input type="range" id="zoom-slider" min="1" max="200" value="1">
                </div>
            </div>
            <div class="export-controls">
                <button id="export-button" disabled>Export Trimmed Audio</button>
                <div id="format-selection">
                    <label><input type="checkbox" name="format" value="audio/mpeg"> MP3</label>
                    <label><input type="checkbox" name="format" value="audio/wav" checked> WAV</label>
                    <label><input type="checkbox" name="format" value="audio/ogg"> OGG</label>
                </div>
            </div>
        </div>
         <div id="status-message"></div>
    </div>

    <script src="main.js"></script>
<script src="/register.js"></script>
      
</body>
</html>
