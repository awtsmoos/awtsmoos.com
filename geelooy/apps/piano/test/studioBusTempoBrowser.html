<!doctype html>
<!--B"H-->
<html><head><meta charset="utf-8"><title>Studio bus inserts + tempo map fixture</title></head>
<body><div id="result">RUNNING</div>
<script type="module">
const result = document.querySelector('#result');
try {
	const M = '../modules/workstation/song/multitrack/';
	const { createMultitrackProject, createMultitrackTrack } = await import(M + 'multitrackProject.js');
	const { createMidiRegion } = await import(M + 'multitrackMidiRegion.js');
	const { renderMultitrackOffline } = await import(M + 'multitrackOfflineMix.js');
	const { beatsToSeconds, secondsToBeats, normalizeTempoMap } = await import(M + 'multitrackTempoMap.js');
	const emptyStore = { getBuffer: () => null };
	const peak = b => { let p = 0; for (let c = 0; c < b.numberOfChannels; c++) for (const v of b.getChannelData(c)) p = Math.max(p, Math.abs(v)); return p; };
	const region = createMidiRegion({ name: 'Lead', timelineStart: 0, duration: 1, notes: [{ pitch: 69, start: 0, duration: .8, velocity: 110 }] });
	const dry = createMultitrackProject({ tracks: [createMultitrackTrack({ kind: 'midi', midiRegions: [region] })] });
	const withBus = (effects, enabled) => createMultitrackProject({
		buses: [{ id: 'bus1', name: 'Verb', gain: 1, effects, enabled }],
		tracks: [createMultitrackTrack({ kind: 'midi', midiRegions: [region], sends: [{ busId: 'bus1', gain: .5 }] })]
	});
	const dryPeak = peak(await renderMultitrackOffline(dry, emptyStore, 44100));
	const bypassPeak = peak(await renderMultitrackOffline(withBus({ highpass: 2000 }, false), emptyStore, 44100));
	const hpPeak = peak(await renderMultitrackOffline(withBus({ highpass: 2000 }, true), emptyStore, 44100));
	if (!(bypassPeak > dryPeak * 1.3)) throw Error(`Bypassed bus send too quiet: dry ${dryPeak} bypass ${bypassPeak}`);
	if (!(hpPeak < bypassPeak * .85)) throw Error(`Bus highpass did not attenuate: bypass ${bypassPeak} hp ${hpPeak}`);
	if (!(hpPeak > dryPeak * .8)) throw Error(`Bus highpass ate the dry path: dry ${dryPeak} hp ${hpPeak}`);
	// Project round-trip keeps the insert.
	const round = createMultitrackProject(withBus({ highpass: 2000 }, false));
	if (round.buses[0].effects.highpass !== 2000 || round.buses[0].enabled !== false) throw Error('Bus insert did not persist in project model');
	// Tempo map conversions in the browser module graph.
	const map = normalizeTempoMap([{ beat: 4, bpm: 60 }, { beat: 0, bpm: 120 }]);
	if (beatsToSeconds(map, 6) !== 4) throw Error('beatsToSeconds mid-map wrong');
	if (secondsToBeats(map, 3) !== 5) throw Error('secondsToBeats mid-map wrong');
	result.textContent = `PASS bus dry ${dryPeak.toFixed(3)} bypass ${bypassPeak.toFixed(3)} highpass ${hpPeak.toFixed(3)} tempo-ok`;
} catch (error) {
	result.textContent = 'FAIL ' + (error?.stack || error);
}
</script></body></html>
