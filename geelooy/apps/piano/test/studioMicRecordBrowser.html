<!doctype html>
<!--B"H-->
<html><head><meta charset="utf-8"><title>Studio simultaneous mic record fixture</title></head>
<body><div id="result">RUNNING</div><div id="host"></div>
<script type="module">
const result = document.querySelector('#result');
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
try {
	const M = '../modules/workstation/song/multitrack/';
	const { AudioState, initAudio } = await import('../modules/audio.js');
	await initAudio();
	const { MultitrackStudioDaas } = await import(M + 'multitrackState.js');
	const { createMultitrackProject, createMultitrackTrack } = await import(M + 'multitrackProject.js');
	const { multitrackAudioStore } = await import(M + 'multitrackAudioStore.js');
	const { multitrackPlayback } = await import(M + 'multitrackPlayback.js');
	const { bindMicControls } = await import(M + 'multitrackMicControls.js');
	// Existing arrangement: a 3-second tone clip on track 1.
	const offline = new OfflineAudioContext(1, 44100 * 3, 44100);
	const tone = offline.createBuffer(1, 44100 * 3, 44100);
	const data = tone.getChannelData(0);
	for (let i = 0; i < data.length; i++) data[i] = 0.4 * Math.sin(2 * Math.PI * 220 * i / 44100);
	multitrackAudioStore.setBuffer('backing', tone, 'Backing');
	const state = new MultitrackStudioDaas();
	state.project = createMultitrackProject({ tracks: [
		createMultitrackTrack({ name: 'Backing', clips: [{ bufferId: 'backing', duration: 3, timelineStart: 0 }] }),
		createMultitrackTrack({ name: 'Vocals', clips: [] })
	] });
	const panel = bindMicControls(state);
	document.querySelector('#host').appendChild(panel);
	panel.open = true;
	const mode = panel.querySelector('.multitrack-mic-mode');
	const monitor = panel.querySelector('.multitrack-mic-monitor');
	const record = panel.querySelector('.multitrack-mic-record');
	// Speakers mode must make monitoring impossible in the real UI.
	mode.value = 'speakers';
	mode.dispatchEvent(new Event('change'));
	monitor.checked = true;
	monitor.dispatchEvent(new Event('change'));
	if (monitor.checked || !monitor.disabled) throw Error('Speakers mode did not force monitoring off');
	mode.value = 'headphones';
	mode.dispatchEvent(new Event('change'));
	// Arm the Vocal track and record over the playing arrangement.
	panel.querySelector('.multitrack-mic-arm').value = state.project.tracks[1].id;
	panel.querySelector('.multitrack-mic-arm').dispatchEvent(new Event('change'));
	record.click();
	await wait(500);
	if (!panel.take.recording) throw Error('Take did not start');
	const playingDuring = multitrackPlayback.isPlaying();
	await wait(900);
	record.click();
	await wait(400);
	const vocals = state.project.tracks[1];
	if (vocals.clips.length !== 1) throw Error(`Expected 1 recorded clip, got ${vocals.clips.length}`);
	const clip = vocals.clips[0];
	const buffer = multitrackAudioStore.getBuffer(clip.bufferId);
	if (!buffer) throw Error('Recorded clip has no buffer');
	const samples = buffer.getChannelData(0);
	let sum = 0;
	for (const value of samples) sum += value * value;
	const rms = Math.sqrt(sum / samples.length);
	if (rms < 0.01) throw Error(`Fake-mic signal missing from take (rms ${rms})`);
	if (clip.timelineStart < 0 || clip.timelineStart > 0.6) throw Error(`Clip placed at ${clip.timelineStart}s`);
	if (clip.duration < 0.8) throw Error(`Clip too short: ${clip.duration}s`);
	if (typeof clip.latencyCompensation !== 'number') throw Error('Latency compensation not stored on clip');
	if (panel.take.capture.stream !== null) throw Error('Microphone stream was not released');
	if (state.project.tracks[0].clips.length !== 1) throw Error('Backing track was disturbed');
	result.textContent = `PASS playing-during=${playingDuring} rms=${rms.toFixed(3)} start=${clip.timelineStart.toFixed(3)} dur=${clip.duration.toFixed(2)} comp=${Math.round(clip.latencyCompensation * 1000)}ms`;
} catch (error) {
	result.textContent = 'FAIL ' + (error?.stack || error);
}
</script></body></html>
