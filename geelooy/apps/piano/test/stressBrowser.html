<!doctype html>
<!--B"H-->
<html><head><meta charset="utf-8"><title>Long-session stress fixture</title></head>
<body><div id="result">RUNNING</div>
<button id="record-audio-button">Record Audio</button>
<button id="mic-button">Enable Mic</button>
<script type="module">
const result = document.querySelector('#result');
const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
try {
	const startedAt = performance.now();
	const { AudioState, initAudio } = await import('../modules/audio.js');
	await initAudio();
	const context = AudioState.context;
	// 1) Rapid note stress through the real note path — zero stuck notes.
	const { startExecutedNote, stopExecutedNote } = await import('../modules/performance/noteExecution.js');
	const tap = context.createAnalyser(); tap.fftSize = 2048;
	AudioState.masterGain.connect(tap);
	const samples = new Float32Array(2048);
	const masterRms = () => { tap.getFloatTimeDomainData(samples); let s = 0; for (const v of samples) s += v * v; return Math.sqrt(s / samples.length); };
	const names = ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5', 'E5', 'G5'];
	let started = 0;
	for (let round = 0; round < 30; round++) {
		const ids = [];
		for (let i = 0; i < 10; i++) {
			const id = `stress-${round}-${i}`;
			if (startExecutedNote(names[i], id, {}, { triggerChord: false })) { started++; ids.push(id); }
		}
		await wait(30);
		for (const id of ids) stopExecutedNote(id, { ignoreSustain: true });
	}
	if (started < 250) throw Error(`Too few notes started (${started}/300)`);
	await wait(700);
	const stuckRms = masterRms();
	if (stuckRms > 0.004) throw Error(`Stuck notes suspected: master RMS ${stuckRms.toFixed(4)} after all notes stopped`);
	// 2) 10,000-clip project: normalization + lookahead scheduling stays bounded.
	const { createMultitrackProject } = await import('../modules/workstation/song/multitrack/multitrackProject.js');
	const { createLookahead, needsLookahead } = await import('../modules/workstation/song/multitrack/multitrackLookahead.js');
	const tracks = Array.from({ length: 100 }, (_, t) => ({
		id: `t${t}`, name: `Track ${t}`,
		clips: Array.from({ length: 100 }, (_, i) => ({ id: `c${t}-${i}`, bufferId: 'sil', timelineStart: i * 2 + t * 0.01, duration: 1 }))
	}));
	const t0 = performance.now();
	const project = createMultitrackProject({ tracks });
	const normalizeMs = performance.now() - t0;
	if (!needsLookahead(project, 0)) throw Error('10k project did not engage lookahead');
	const silence = context.createBuffer(1, context.sampleRate, context.sampleRate);
	const runtime = createLookahead({
		project, context, destination: context.createGain(), offset: 0,
		audioStore: { getBuffer: () => silence },
		setTimer: (fn, ms) => setTimeout(fn, ms), clearTimer: id => clearTimeout(id),
		onError: error => { throw error; }
	});
	const scheduled = runtime.voices.length;
	// The horizon is time-based: ~4 clips per track land in the first 8s,
	// so a few hundred voices is correct — the invariant is that the
	// other ~9,600 clips are NOT scheduled.
	if (scheduled < 100 || scheduled > 600) throw Error(`Lookahead scheduling out of bounds: ${scheduled} of 10000`);
	runtime.close();
	if (runtime.voices.length !== 0) throw Error('Lookahead voices not released on close');
	// 3) Repeated record/stop cycles — heap and backend stability.
	const { MicCaptureSession } = await import('../modules/recording/micCapture.js');
	const heapBefore = performance.memory?.usedJSHeapSize || 0;
	let backend = 'unknown', frames = 0;
	for (let cycle = 0; cycle < 12; cycle++) {
		const session = new MicCaptureSession({});
		const info = await session.start({ context, mode: 'speakers', monitor: false });
		backend = info.backend;
		await wait(120);
		const stopped = await session.stop();
		frames += stopped.buffer.length;
		if (session.stream !== null) throw Error('Mic stream not released after stop');
	}
	const heapAfter = performance.memory?.usedJSHeapSize || 0;
	if (frames < 12 * 4000) throw Error(`Capture cycles returned too few frames: ${frames}`);
	const seconds = ((performance.now() - startedAt) / 1000).toFixed(1);
	result.textContent = `PASS stress notes=${started}/300 stuckRms=${stuckRms.toFixed(4)} clips=10000 normalizeMs=${normalizeMs.toFixed(0)} lookaheadVoices=${scheduled} cycles=12 frames=${frames} backend=${backend} heapDeltaMB=${((heapAfter - heapBefore) / 1048576).toFixed(1)} elapsed=${seconds}s`;
} catch (error) {
	result.textContent = 'FAIL ' + (error?.stack || error);
}
</script></body></html>
