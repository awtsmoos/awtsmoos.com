    <style>
        :root {
            --primary-color: #00ffff; /* Electric Cyan */
            --secondary-color: #ff00ff; /* Vibrant Magenta */

            --text-color: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: 'Orbitron', sans-serif; /* A futuristic, clean font */
        }

        #interactive-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        .all {
            position: relative;
            z-index: 2;
            height: 100%;
        }

        .main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
            padding: 1rem;
            text-transform: uppercase;
        }

        .logo {
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 700;
            margin-bottom: 3rem;
            letter-spacing: 0.5rem;
            color: var(--primary-color);
            text-shadow: 0 0 10px var(--primary-color), 0 0 20px var(--primary-color);
            position: relative;
        }

        .about a {
            font-size: clamp(1rem, 4vw, 1.5rem);
            color: var(--text-color);
            text-decoration: none;
            margin: 1rem;
            display: inline-block;
            border: 2px solid var(--primary-color);
            padding: 1rem 2rem;
            position: relative;
            overflow: hidden;
            transition: color 0.3s ease-in-out;
        }

        .about a:hover {
            color: var(--secondary-color);
        }

        .about a::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, var(--secondary-color), transparent);
            transition: left 0.4s ease-in-out;
        }

        .about a:hover::before {
            left: 100%;
        }
        
        /* Cyber-Glyph Text Effect */
        .cyber-glitch {
            position: relative;
        }

        .cyber-glitch:hover:before, .cyber-glitch:hover:after {
            content: attr(data-text);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--background-color);
            opacity: 0.8;
        }

        .cyber-glitch:hover:before {
            color: var(--secondary-color);
            z-index: -1;
            animation: glitch-anim-1 0.3s infinite;
        }

        .cyber-glitch:hover:after {
            color: var(--primary-color);
            z-index: -2;
            animation: glitch-anim-2 0.3s infinite;
        }
        
        @keyframes glitch-anim-1 {
            0% { transform: translate(3px, 3px); }
            25% { transform: translate(-3px, -3px); }
            50% { transform: translate(3px, -3px); }
            75% { transform: translate(-3px, 3px); }
            100% { transform: translate(3px, 3px); }
        }

        @keyframes glitch-anim-2 {
            0% { transform: translate(-3px, -3px); }
            25% { transform: translate(3px, 3px); }
            50% { transform: translate(-3px, 3px); }
            75% { transform: translate(3px, -3px); }
            100% { transform: translate(-3px, -3px); }
        }

    </style>

</head>

    <script>
        const canvas = document.getElementById('interactive-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;
        let particles = [];
        let pointer = { x: width / 2, y: height / 2, active: false };

        const options = {
            particleCount: 1000,
            particleSize: 1.5,
            defaultSpeed: 1,
            interactiveSpeed: 15,
            trailLength: 0.05,
        };

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.vx = (Math.random() - 0.5) * options.defaultSpeed;
                this.vy = (Math.random() - 0.5) * options.defaultSpeed;
                this.hue = Math.random() * 60 + 180; // Hues of cyan and blue
            }

            update() {
                if(pointer.active) {
                    const dx = this.x - pointer.x;
                    const dy = this.y - pointer.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    if(dist < 200) {
                        const angle = Math.atan2(dy, dx);
                        const force = (200 - dist) / 200;
                        this.vx += Math.cos(angle) * force * options.interactiveSpeed;
                        this.vy += Math.sin(angle) * force * options.interactiveSpeed;
                    }
                }

                this.x += this.vx;
                this.y += this.vy;
                
                this.vx *= 0.95;
                this.vy *= 0.95;

                if (this.x < 0) { this.x = width; }
                if (this.x > width) { this.x = 0; }
                if (this.y < 0) { this.y = height; }
                if (this.y > height) { this.y = 0; }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, options.particleSize, 0, Math.PI * 2);
                ctx.fillStyle = `hsl(${this.hue}, 100%, 50%)`;
                ctx.fill();
            }
        }

        function setup() {
            particles = [];
            for (let i = 0; i < options.particleCount; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.fillStyle = `rgba(0, 0, 0, ${options.trailLength})`;
            ctx.fillRect(0, 0, width, height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            setup();
        });

        window.addEventListener('mousemove', (e) => {
            pointer.x = e.clientX;
            pointer.y = e.clientY;
            pointer.active = true;
        });
        
        window.addEventListener('mouseleave', () => {
            pointer.active = false;
        });

        window.addEventListener('touchmove', (e) => {
            e.preventDefault();
            pointer.x = e.touches[0].clientX;
            pointer.y = e.touches[0].clientY;
            pointer.active = true;
        });
        
        window.addEventListener('touchend', () => {
            pointer.active = false;
        });

        setup();
        animate();
    </script>
</body>
