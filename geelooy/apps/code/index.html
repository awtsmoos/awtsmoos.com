<!-- B"H -->
<!DOCTYPE html>

<html lang="en" class="theme-vivid-dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚡ VIVID X // Profound Edition ⚡</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
        



<style>
    /* --- THEME & VARIABLES (VIVID X - EXTREME NEON EDITION v2) --- */
    :root {
    --font-ui: 'Inter', sans-serif;
    --font-code: 'Fira Code', monospace;
    --timing-fast: 0.15s;
    --timing-med: 0.3s;
    --radius-sm: 4px;
    --radius-md: 8px;
    --shadow-color: rgba(0, 0, 0, 0.6);

    /* --- NEW EXTREME COLOR PALETTE --- */
    --neon-cyan: #00f6ff;
    --neon-magenta: #ff00ff;
    --neon-lime: #a8ff00;
    
    --glow-cyan: rgba(0, 246, 255, 0.5);
    --glow-magenta: rgba(255, 0, 255, 0.4);
    --glow-lime: rgba(168, 255, 0, 0.6);

    /* B"H - SERIOUSLY BRIGHTER BACKGROUNDS, NO MORE JOKES */
    --color-bg-deep: #191c29;      /* Was #02040a */
    --color-bg-primary: #2c3047;   /* Was #0a0c14 */
    --color-bg-secondary: #383e5e; /* Was #121522 */
    --color-bg-tertiary: #505886;  /* Was #22273d */
    --color-border: #626AAE;       /* Was #2a2f4a */
    --color-border-accent: var(--neon-cyan);
    
    /* B"H - BRIGHTER TEXT & ICONS */
    --color-text-primary: #ffffff; 
    --color-text-secondary: #d1d9ff; /* Was #c0d0ff */
    --color-text-tertiary: #a0a8d0;   /* Was #5f6b8a - HUGE JUMP FOR ICONS */
    
    --color-accent-primary: var(--neon-cyan); 
    --color-accent-secondary: var(--neon-lime); 
    --color-accent-danger: #f75d65;
    --color-backdrop: rgba(26, 29, 46, 0.6); /* Matched to new bg */
}


    .theme-vivid-dark { /* Keep class for compatibility */
        /* All variables are now defined in :root */
    }
    
    /* --- BASE & LAYOUT --- */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { 
        height: 100%; margin: 0; font-family: var(--font-ui); 
        background-color: var(--color-bg-deep); color: var(--color-text-primary); 
        overflow: hidden; -webkit-font-smoothing: antialiased; font-synthesis: none;
        font-size: 16px;
    }
    body {
         background-color: #000;
         background-image:
            linear-gradient(var(--neon-cyan) 1px, transparent 1px),
            linear-gradient(to right, var(--neon-cyan) 1px, transparent 1px);
         background-size: 40px 40px;
         background-position: -1px -1px;
         animation: bg-flicker 10s infinite linear;
    }
    @keyframes bg-flicker {
        0%, 100% { background-color: rgba(2, 4, 10, 0.9); }
        50% { background-color: rgba(10, 12, 20, 0.95); }
    }
    .app-container { 
        display: grid; grid-template-rows: auto 1fr auto; 
        grid-template-columns: 300px 1fr; height: 100vh; height: 100dvh; 
        background-color: var(--color-bg-primary); 
        opacity: 0; animation: appFadeIn 0.5s ease forwards;
    }
    @keyframes appFadeIn { to { opacity: 1; } }

    .top-panel { 
        grid-row: 1 / 2; grid-column: 1 / 3; display: flex; flex-direction: column; 
        background-color: var(--color-bg-secondary); 
        border-bottom: 2px solid var(--color-border);
        box-shadow: 0 5px 25px rgba(0,0,0,0.5);
        z-index: 100;
    }
    .menu-bar { display: flex; align-items: center; height: 52px; padding: 0 12px; flex-shrink: 0; gap: 8px; }
    .tab-bar { display: flex; overflow-x: auto; align-items: flex-end; }
    
    .main-content { 
        grid-row: 2 / 3; grid-column: 2 / 3; position: relative; 
        display: flex; flex-direction: column; 
        overflow: hidden; 
    }
    
    
    
    .editor-area { 
        flex-grow: 1; /* B"H - CRITICAL: This tells the editor to take up all available vertical space */
        display: flex; 
        position: relative; 
        overflow-y: auto; /* B"H - CRITICAL: This enables vertical scrolling ONLY within this area */
        background-color: transparent; 
    }
    
    
    .status-bar { 
        grid-row: 3 / 4; grid-column: 1 / 3; height: 28px; 
        background: linear-gradient(90deg, var(--neon-cyan), var(--neon-magenta));
        color: var(--color-bg-deep); 
        display: flex; align-items: center; justify-content: space-between; 
        padding: 0 16px; font-size: 0.9em; font-weight: 700; user-select: none; z-index: 100;
        
        letter-spacing: 1px;
    }
    
    /* --- SIDEBAR & VISUAL AUDIO GUIDE EXPLORER --- */
    .sidebar { 
    grid-row: 1 / 4; grid-column: 1 / 2;
    /* B"H - Replaced the flat dark color with a subtle vertical gradient for more depth! */
    background: linear-gradient(to bottom, #191d30, #121522);
    display: flex; flex-direction: column; 
    border-right: 2px solid var(--color-border);
    transition: transform var(--timing-med) ease, width var(--timing-med) ease; flex-shrink: 0;
    position: relative;
    z-index: 3200;
    box-shadow: 10px 0 30px rgba(0,0,0,0.4);
}
    .sidebar-header { 
        display: flex; justify-content: space-between; align-items: center; 
        padding: 0 8px 0 16px; height: 52px; 
        border-bottom: 2px solid var(--color-border); 
        flex-shrink: 0;  font-size: 0.9em; letter-spacing: 2px; user-select: none; font-weight: 700;
        color: var(--neon-cyan);
        /* --- BRIGHTER HEADER GLOW --- */
        text-shadow: 0 0 12px var(--glow-cyan), 0 0 4px var(--neon-cyan);
    }
    .workspaces-container { 
        flex-grow: 1; overflow-y: auto; padding: 8px;
    }
    
    /* --- NEW VERTICAL HIERARCHY STYLES --- */
    .workspace-header { 
    display: flex; align-items: center; justify-content: space-between; 
    padding: 12px; font-weight: 700; cursor: pointer; user-select: none; 
    border-radius: var(--radius-sm); transition: all var(--timing-fast);
    position: relative; overflow: hidden;
    
    letter-spacing: 1px;
    /* B"H - Made the background a brighter and more saturated blue/purple */
    background-color: #252a4a;
    /* B"H - Gave it a vivid cyan border and a subtle inner glow! */
    border: 1px solid rgba(0, 246, 255, 0.4);
    box-shadow: inset 0 0 15px rgba(0, 246, 255, 0.2);
    margin-bottom: 8px; /* Space between workspaces */
    /* --- BRIGHTER WORKSPACE HEADER --- */
    color: var(--color-text-secondary);
}
    .workspace-header:hover { 
        background-color: var(--color-border); 
        color: var(--neon-cyan);
        border-color: var(--neon-cyan);
        text-shadow: 0 0 8px var(--glow-cyan);
    }
    
    .tree-item {
        display: flex;
        flex-direction: column; /* Children (UL) will stack below the name-wrap */
        align-items: stretch;
        position: relative;
        user-select: none;
    }
    .tree-item-name-wrap {
        display: flex; align-items: center; flex-grow: 1;
        min-height: 40px;
        cursor: pointer;
        padding: 6px 8px;
        border-radius: var(--radius-sm);
        transition: background-color var(--timing-fast);
    }
    
    /* --- INSANE BRIGHTNESS & GLOW ON HOVER --- */
    .tree-item > .tree-item-name-wrap:hover {
        background-color: var(--color-bg-tertiary);
    }
    .tree-item > .tree-item-name-wrap:hover .tree-item-name {
        color: var(--neon-lime);
        text-shadow: 0 0 10px var(--glow-lime);
        transform: scale(1.02);
    }
    .tree-item.context-active > .tree-item-name-wrap .tree-item-name {
        color: var(--neon-magenta);
        text-shadow: 0 0 10px var(--glow-magenta);
    }

    .tree-item-arrow { 
        width: 20px; text-align: center; display: inline-block; 
        transition: transform var(--timing-fast) ease; user-select: none; 
        color: var(--color-text-tertiary);
        font-size: 1.2em;
    }
    .tree-item.expanded > .tree-item-name-wrap > .tree-item-arrow { transform: rotate(90deg); }
    
    .tree-item-name { 
        margin-left: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.95em;
        /* --- BRIGHTER FILE NAMES BY DEFAULT --- */
        font-weight: 600;
        color: var(--color-text-primary);
        transition: all var(--timing-fast) ease;
    }

    /* This is the key for the new layout */
    .tree-item > ul {
        margin: 4px 0 4px 20px; /* Indent the entire child block */
        padding-left: 15px; /* Add space from the guide line */
        border-left: 1px solid var(--color-border); /* The vertical guide line */
        list-style: none; /* remove default list styles */
    }
    .tree-item > ul:hover {
        border-left-color: var(--neon-cyan);
    }


    /* --- TABS --- */
    .tab-bar::-webkit-scrollbar { height: 4px; } 
    .tab-bar::-webkit-scrollbar-thumb { background: var(--color-border-accent); border-radius: 4px; }
    .tab { 
        display: inline-flex; align-items: center; padding: 0 16px;
        min-height: 48px; max-width: 240px; 
        border-top: 4px solid transparent;
        border-right: 1px solid var(--color-border); 
        cursor: pointer; position: relative;
        color: var(--color-text-secondary); 
        background: linear-gradient(to top, var(--color-bg-primary) 95%, transparent);
        transition: all var(--timing-fast) ease; 
    }
    .tab:hover { 
        background-color: var(--color-bg-primary); 
        color: var(--color-text-primary); 
        text-shadow: 0 0 5px var(--glow-cyan);
    }
    .tab.active { 
        background-color: var(--color-bg-primary); 
        border-top-color: var(--color-border-accent); 
        color: var(--color-text-primary); 
        font-weight: 700;
        text-shadow: 0 0 12px var(--glow-cyan);
        box-shadow: inset 0 10px 20px -10px var(--color-bg-deep);
    }
    .tab.dirty .tab-name::after { content: ' ●'; color: var(--neon-magenta); font-size: 0.9em; }
    .tab-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; padding-right: 24px; }
    .close-tab-btn { 
        position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
        border-radius: var(--radius-sm); width: 24px; height: 24px; display: flex; align-items: center; justify-content: center;
    }
    .close-tab-btn:hover { background-color: var(--color-bg-tertiary); color: var(--neon-magenta); }

    /* --- EDITOR --- */
    #editor-wrapper { display: flex; flex-grow: 1; height: 100%; position: relative; }
    #line-numbers { 
        font-family: var(--font-code); padding: 16px 8px; font-size: 1em; line-height: 1.7; 
        color: var(--color-text-tertiary); text-align: right; user-select: none; 
        background-color: transparent; border-right: 1px solid var(--color-border);
        overflow-y: hidden; white-space: pre; 
    }
    #editor { 
        flex-grow: 1; height: 100%; border: none; background: transparent; color: var(--color-text-primary); 
        font-family: var(--font-code); font-size: 1em; line-height: 1.7; 
        padding: 16px; resize: none; outline: none; white-space: pre; overflow: auto;
    }
    .empty-editor-message { 
        position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%); 
        color: var(--color-text-secondary); text-align: center; user-select: none; opacity: 0.6; padding: 16px;
        letter-spacing: 4px;
    }
    
    /* --- OVERLAYS & DIALOGS --- */
    .hidden { display: none !important; } 
    .visible { display: flex !important; }
    .svg-icon { width: 1.25em; height: 1.25em; fill: currentColor; vertical-align: middle; }
    .dialog-overlay { 
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
        background-color: rgba(2, 4, 10, 0.7); z-index: 2000; justify-content: center; align-items: center; 
        backdrop-filter: blur(10px) saturate(150%); animation: fadeIn var(--timing-fast) ease; 
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .dialog-content { 
        background-color: var(--color-bg-secondary); 
        border: 2px solid var(--color-border-accent); 
        border-radius: var(--radius-md); padding: 30px; width: 90%; max-width: 500px; 
        display: flex; flex-direction: column; gap: 15px; 
        box-shadow: 0 0 40px var(--glow-cyan); 
        transform: scale(0.95); animation: scaleUp var(--timing-med) cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
    }
    @keyframes scaleUp { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
    #context-menu, #main-menu { 
        position: fixed; z-index: 10000; background-color: var(--color-backdrop); 
        border: 1px solid var(--color-border); backdrop-filter: blur(15px); border-radius: var(--radius-md); 
        padding: 8px; min-width: 260px; display: none; 
        box-shadow: 0 10px 40px var(--shadow-color), 0 0 15px var(--glow-magenta);
        transform-origin: top left; animation: scaleUp var(--timing-fast) ease forwards;
    }
    #loading-overlay { 
        position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); 
        z-index: 9999; display: none; justify-content: center; align-items: center; 
        color: var(--neon-cyan); font-size: 1.5em; backdrop-filter: blur(5px); 
        text-shadow: 0 0 10px var(--glow-cyan);
        
        letter-spacing: 2px;
    }
    .toast-container { 
        position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%); z-index: 10001; 
        display: flex; flex-direction: column; align-items: center; gap: 10px; pointer-events: none;
    }
    .toast { 
        color: white; padding: 14px 22px; border-radius: var(--radius-md); opacity: 0; 
        transform: translateY(20px); transition: all var(--timing-med) ease; box-shadow: 0 5px 20px var(--shadow-color); 
        font-weight: 600; text-align: center; backdrop-filter: blur(10px);
    }
    .toast.show { opacity: 1; transform: translateY(0); }
    .toast.error { background-color: rgba(247, 93, 101, 0.8); border: 1px solid var(--color-accent-danger); box-shadow: 0 0 15px rgba(247, 93, 101, 0.6); } 
    .toast.success { background-color: rgba(168, 255, 0, 0.8); border: 1px solid var(--neon-lime); color: var(--color-bg-deep); box-shadow: 0 0 15px rgba(168, 255, 0, 0.6);} 
    .toast.info { background-color: rgba(0, 246, 255, 0.8); border: 1px solid var(--neon-cyan); color: var(--color-bg-deep); box-shadow: 0 0 15px var(--glow-cyan);}
    
    /* --- BUTTONS & INPUTS --- */
    button, .button { font-family: var(--font-ui); cursor: pointer; border: none; transition: all var(--timing-fast) ease; user-select: none; }
    .icon-button { 
        background: none; color: var(--color-text-secondary); font-size: 1.2em;
        line-height: 1; vertical-align: middle; padding: 10px; border-radius: var(--radius-md); 
        width: 44px; height: 44px; display: inline-flex; justify-content: center; align-items: center;
    }
    .icon-button:hover:not(:disabled) { 
        background-color: var(--color-bg-tertiary); color: var(--neon-cyan); 
        transform: scale(1.1); text-shadow: 0 0 8px var(--glow-cyan);
    }
    .primary-btn { 
        background: linear-gradient(45deg, var(--neon-cyan), var(--neon-magenta));
        color: white; border:none; 
        padding: 12px 20px; border-radius: var(--radius-sm); font-weight: bold; min-height: 44px;
        text-shadow: 1px 1px 5px rgba(0,0,0,0.4);
    }
    .primary-btn:hover:not(:disabled) { 
        filter: brightness(1.2); 
        box-shadow: 0 0 20px -2px var(--glow-magenta); 
        transform: translateY(-2px); 
    }
    .secondary-btn { 
        background-color: transparent; color: var(--color-text-primary); 
        border:1px solid var(--color-border); 
        padding: 12px 20px; border-radius: var(--radius-sm); min-height: 44px;
    }
    .secondary-btn:hover:not(:disabled) { 
        background-color: var(--color-border); border-color: var(--neon-cyan);
        color: var(--neon-cyan);
    }
    .menu-button { 
        display: flex; align-items: center; gap: 12px; width: 100%; background: none; color: var(--color-text-primary); 
        padding: 12px 16px; text-align: left; font-size: 1em; border-radius: var(--radius-sm); min-height: 44px;
    }
    .menu-button:hover:not(:disabled) { 
        background-color: var(--color-accent-primary); 
        color: var(--color-bg-deep); 
        text-shadow: none;
    }
    .menu-separator { border: none; border-top: 1px solid var(--color-border); margin: 8px 0; }
    input[type="text"], input[type="password"], textarea { 
        background: var(--color-bg-deep); border: 1px solid var(--color-border); 
        color: var(--color-text-primary); padding: 12px; border-radius: var(--radius-sm); 
        font-family: var(--font-ui); width: 100%; font-size: 1em;
    }
    input:focus, textarea:focus { 
        outline: none; border-color: var(--color-border-accent);
        box-shadow: 0 0 15px -2px var(--glow-cyan);
    }
    
    #find-replace-panel { 
        position: absolute; top: 12px; right: 12px; z-index: 100; 
        background-color: var(--color-backdrop); 
        border: 1px solid var(--color-border); 
        padding: 12px; border-radius: var(--radius-md); 
        box-shadow: 0 5px 30px var(--shadow-color); 
        width: calc(100% - 24px); max-width: 380px; display: none; 
        grid-template-columns: 1fr; gap: 8px; animation: fadeIn var(--timing-fast); 
        backdrop-filter: blur(10px);
    }
    .fr-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    #find-replace-panel .button-group { display: flex; gap: 4px; }
    
    /* --- CUSTOM SCROLLBARS & MOBILE --- */
    ::-webkit-scrollbar { width: 12px; height: 12px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { 
        background-color: var(--color-bg-tertiary); 
        border-radius: 10px; 
        border: 3px solid var(--color-bg-primary); 
    }
    ::-webkit-scrollbar-thumb:hover { background-color: var(--neon-cyan); }
    
    
    
        /* --- KEYBOARD HELPER --- */
    .keyboard-helper {
        display: none; /* Hidden by default */
        flex-shrink: 0;
        background-color: var(--color-bg-deep);
        padding: 6px 8px;
        gap: 6px;
        overflow-x: auto;
        border-bottom: 2px solid var(--color-border);
    }
    /* Add this class with JS to show the bar */
    .keyboard-helper.is-visible {
        display: flex;
    }
    .kh-btn {
        font-family: var(--font-code);
        background-color: var(--color-bg-secondary);
        color: var(--color-text-secondary);
        border: 1px solid var(--color-border);
        border-radius: var(--radius-sm);
        padding: 8px 12px;
        font-size: 1.1em;
        font-weight: 600;
        cursor: pointer;
        transition: all var(--timing-fast) ease;
    }
    .kh-btn:hover {
        background-color: var(--color-border);
        color: var(--neon-cyan);
        border-color: var(--neon-cyan);
    }
    .kh-separator {
        border-left: 2px solid var(--color-border);
        margin: 0 4px;
    }
    
    
    
    /* --- MOBILE RESPONSIVENESS (UNCHANGED LOGIC) --- */
    @media (max-width: 768px) {
        .app-container { grid-template-columns: 1fr; }
        .sidebar {
            grid-row: 1 / 4; position: fixed; top: 0; left: 0; height: 100%; width: 85%; max-width: 320px;
            transform: translateX(-100%); z-index: 1100; box-shadow: 10px 0 40px var(--shadow-color);
        }
        .sidebar.is-open { transform: translateX(0); }
        .sidebar-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 1099;
            opacity: 0; transition: opacity var(--timing-med) ease; pointer-events: none;
        }
        .sidebar-overlay.is-visible { opacity: 0; }
        .main-content { grid-column: 1 / 2; }
        .top-panel { grid-column: 1 / 2; }
        .status-bar { font-size: 0.8em; }
    }
    #hamburger-sidebar-toggle { display: none; }
    
    
    @media (max-width: 768px) {
        #hamburger-sidebar-toggle { display: inline-flex; }
    }
</style>

 
</head>
<body>
    <!-- SVG Icon Definitions -->
    <svg width="0" height="0" class="hidden">
      <symbol xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" id="icon-menu"><path d="M3 4h18v2H3V4zm0 7h18v2H3v-2zm0 7h18v2H3v-2z"/></symbol>
      <symbol xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" id="icon-folder"><path d="M10 4H4c-1.11 0-2 .89-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8c0-1.11-.9-2-2-2h-8l-2-2z"/></symbol>

    // --- CORE MODULES ---

    /**
     * UI Module: Handles all UI updates like dialogs, toasts, and loading indicators.
     */
    const UI = {
        showLoading: (msg = 'Processing...') => {
            DOM.loadingOverlay.querySelector('span').textContent = msg;
            DOM.loadingOverlay.style.display = 'flex';
        },
        hideLoading: () => {
            DOM.loadingOverlay.style.display = 'none';
        },
        showToast: (message, type = 'info', duration = 3000) => {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = message;
            DOM.toastContainer.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('show');
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, duration);
            }, 10);
        },
        showDialog: ({ title, message, hasInput = false, inputType = 'text', placeholder = '', hasTextarea = false, textareaContent = '', okText = 'OK', cancelText = 'Cancel', contentHTML = '' }) => {
            return new Promise(resolve => {
                const dialog = DOM.genericDialog;
                dialog.innerHTML = `
                    <div class="dialog-content" id="dialog-content">
                        <h3>${title}</h3>
                        ${message ? `<p>${message}</p>` : ''}
                        ${contentHTML}
                        ${hasInput ? `<input type="${inputType}" id="dialog-input" placeholder="${placeholder}">` : ''}
                        ${hasTextarea ? `<textarea id="dialog-textarea" rows="5">${textareaContent}</textarea>` : ''}
                        <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px;">
                            ${cancelText ? `<button class="secondary-btn" id="dialog-cancel-btn">${cancelText}</button>` : ''}
                            ${okText ? `<button class="primary-btn" id="dialog-ok-btn">${okText}</button>` : ''}
                        </div>
                    </div>`;
                
                const input = dialog.querySelector('#dialog-input');
                const textarea = dialog.querySelector('#dialog-textarea');
                const okBtn = dialog.querySelector('#dialog-ok-btn');
                const cancelBtn = dialog.querySelector('#dialog-cancel-btn');

                const cleanupAndResolve = (value) => {
                    dialog.classList.remove('visible');
                    document.removeEventListener('keydown', keydownHandler);
                    resolve(value);
                };

                const keydownHandler = (e) => {
                    if (e.key === 'Enter' && hasInput && !hasTextarea) { e.preventDefault(); okBtn.click(); }
                    else if (e.key === 'Escape' && cancelBtn) { cancelBtn.click(); }
                    // B"H - ADD THIS ELSE IF BLOCK
                else if (e.key === 'Tab') {
                    e.preventDefault(); // Stop focus from moving to the next element
                    const editor = DOM.editor;
                    const start = editor.selectionStart;
                    const end = editor.selectionEnd;
                    editor.setRangeText(App.getTabString(), start, end, 'end');
                    editor.dispatchEvent(new Event('input', { bubbles: true }));
                }
                };
                
                dialog.onclick = (e) => {
                    if (e.target.id === 'generic-dialog' && cancelBtn) cancelBtn.click();
                };

                if(okBtn) okBtn.onclick = () => cleanupAndResolve(hasInput ? input.value : (hasTextarea ? textarea.value : true));
                if(cancelBtn) cancelBtn.onclick = () => cleanupAndResolve(null);
                
                dialog.classList.add('visible');
                if (input) input.focus();
                if (textarea) textarea.focus();
                document.addEventListener('keydown', keydownHandler);
            });
        },
        updateLineNumbers: () => {
            if (DOM.editorWrapper.classList.contains('hidden')) return;
            const lineCount = DOM.editor.value.split('\n').length || 1;
            const numbersText = Array.from({ length: lineCount }, (_, i) => i + 1).join('\n');
            if (DOM.lineNumbers.innerText !== numbersText) {
                DOM.lineNumbers.innerText = numbersText;
            }
        },
        syncScroll: () => DOM.lineNumbers.scrollTop = DOM.editor.scrollTop
    };
    
    function getExt(name) {
        var ld=name.lastIndexOf(".")
        if(ld<0) return "";
        var last = name. substring (ld)
        return last;
    }

    /**
     * Editor Module: Manages the main text editor area.
     */
    const Editor = {
    
        currentHighlighter: null, // B"H - Add this line to track the instance
        setContent: (content = "", filename = "") => {
        setContent: (content = "", filename = "") => {
            DOM.editor.value = content;
            UI.updateLineNumbers();
            StatusBar.updateLanguage(filename);
            setTimeout(() => { 
                UI.syncScroll(); 
                Editor.focus();

                // B"H --- THE FIX IS HERE ---
                // 1. If a highlighter from a previous file exists, destroy it first.
                if (Editor.currentHighlighter) {
                    Editor.currentHighlighter.destroy();
                }

                var ext=getExt(filename);
                var real ={
                    ".js":"js",
                    ".css":"css",
                    ".html":"html"
                }
                var f = real[ext];

                // 2. Create the new instance and SAVE it to our tracking variable.
                Editor.currentHighlighter = new pnimi(DOM.editor, f || "js");

            }, 0);
        },
        getContent: () => DOM.editor.value,
        getCursorInfo: () => {
            try {
                const textLines = DOM.editor.value.substring(0, DOM.editor.selectionStart).split("\n");
                return { line: textLines.length, col: textLines[textLines.length - 1].length + 1 };
            } catch (e) { return { line: 1, col: 1 }; }
        },
        focus: () => DOM.editor.focus(),
    };

    /**
     * StatusBar Module: Controls the bottom status bar.
     */
    const StatusBar = {
        update: () => {
            const { line, col } = Editor.getCursorInfo();
            DOM.statusLeft.textContent = `Ln ${line}, Col ${col}`;
            const activeTab = State.tabs.find(t => t.id === State.activeTabId);
            if(activeTab) {
                StatusBar.updateLanguage(activeTab.item.name);
                if (activeTab.item.type === 'github') {
                   StatusBar.updateGit(activeTab.item.branch);
                }
            } else { StatusBar.clear(); }
        },
        updateLanguage: (filename) => {
            const extension = filename ? filename.split('.').pop().toLowerCase() : '';
            const langMap = { js: 'JavaScript', html: 'HTML', css: 'CSS', md: 'Markdown', json: 'JSON', py: 'Python', default: 'Plain Text' };
            DOM.statusRight.textContent = langMap[extension] || langMap.default;
        },
        updateGit: (branch) => { if(branch) DOM.statusRight.textContent += `  |  ${branch}`; },
        clear: () => { DOM.statusLeft.textContent = ''; DOM.statusRight.textContent = ''; }
    };
    
    /**
     * FileSystemProvider: An abstraction layer for different file systems (Local, IndexedDB, GitHub).
     */
    const FileSystemProvider = {
        async list(item) {
            try {
                switch(item.type) {
                    case 'local': return this.Local.list(item);
                    case 'indexeddb': return this.IndexedDB.list(item);
                    case 'github': return this.GitHub.list(item);
                    default: throw new Error('Unsupported workspace type');
                }
            } catch (e) { console.error(`[FS LIST FAILED]`, e); throw e; }
        },
        async read(item) {
            try {
                switch(item.type) {
                    case 'local': return this.Local.read(item);
                    case 'indexeddb': return this.IndexedDB.read(item);
                    case 'github': return this.GitHub.read(item);
                }
            } catch (e) { console.error(`[FS READ FAILED]`, e); throw e; }
        },
        async write(item, content, commitMessage) {
             try {
                switch(item.type) {
                    case 'local': return this.Local.write(item, content);
                    case 'indexeddb': return this.IndexedDB.write(item, content);
                    case 'github': return this.GitHub.write(item, content, commitMessage);
                }
            } catch (e) { console.error(`[FS WRITE FAILED]`, e); throw e; }
        },
        async create(parentDir, name, kind) {
             try {
                switch(parentDir.type) {
                    case 'local': return this.Local.create(parentDir, name, kind);
                    case 'indexeddb': return this.IndexedDB.create(parentDir, name, kind);
                    case 'github': return this.GitHub.create(parentDir, name, kind);
                }
            } catch (e) { console.error(`[FS CREATE FAILED]`, e); throw e; }
        },
        async delete(item) {
             try {
                switch(item.type) {
                    case 'local': return this.Local.delete(item);
                    case 'indexeddb': return this.IndexedDB.delete(item);
                    case 'github': return this.GitHub.delete(item);
                }
            } catch (e) { console.error(`[FS DELETE FAILED]`, e); throw e; }
        },

        Local: {
            async getHandle(rootHandle, path, { kind, create = false } = {}) {
                let currentHandle = rootHandle;
                if (!path || path === '/') return currentHandle;
                const parts = path.split('/').filter(p => p);
                for (let i = 0; i < parts.length; i++) {
                    const part = parts[i];
                    const isLast = i === parts.length - 1;
                    if (isLast && kind === 'file') {
                        return await currentHandle.getFileHandle(part, { create });
                    }
                    currentHandle = await currentHandle.getDirectoryHandle(part, { create });
                }
                return currentHandle;
            },
            async list({ handle, path }) {
                const dirHandle = await this.getHandle(handle, path);
                const entries = [];
                for await (const entry of dirHandle.values()) {
                    entries.push({ 
                        name: entry.name, kind: entry.kind, 
                        path: `${path === '/' ? '' : path}/${entry.name}`, 
                    });
                }
                return entries;
            },
            async read({ handle, path }) { 
                const fileHandle = await this.getHandle(handle, path, { kind: 'file' });
                const file = await fileHandle.getFile();
                return file.text(); 
            },
            async write({ handle, path }, content) {
                const fileHandle = await this.getHandle(handle, path, { kind: 'file' });
                const writable = await fileHandle.createWritable();
                await writable.write(content);
                await writable.close();
            },
            async create({ handle, path }, name, kind) {
                const parentHandle = await this.getHandle(handle, path, { kind: 'directory' });
                if (kind === 'file') await parentHandle.getFileHandle(name, { create: true });
                else await parentHandle.getDirectoryHandle(name, { create: true });
            },
            async delete({ handle, path }) {
                const parentPath = path.substring(0, path.lastIndexOf('/')) || '/';
                const name = path.substring(path.lastIndexOf('/') + 1);
                const parentHandle = await this.getHandle(handle, parentPath);
                await parentHandle.removeEntry(name, { recursive: true });
            }
        },
        IndexedDB: {
            DB_NAME: "VIVID_X_FS_PROFOUND", STORE_NAME: "files",
            init: () => new Promise((resolve, reject) => {
                if(State.db) return resolve(State.db);
                const request = indexedDB.open(this.DB_NAME, 1);
                request.onupgradeneeded = e => e.target.result.createObjectStore(this.STORE_NAME, { keyPath: "path" });
                request.onsuccess = e => { State.db = e.target.result; resolve(State.db); };
                request.onerror = e => reject(e.target.error);
            }),
            list: ({ path }) => new Promise((resolve, reject) => {
                const store = State.db.transaction(this.STORE_NAME).objectStore(this.STORE_NAME);
                const request = store.getAll();
                request.onerror = e => reject(e.target.error);
                request.onsuccess = () => {
                    const children = new Map();
                    const dirPrefix = path === '/' ? '' : path + '/';
                    request.result.forEach(item => {
                        if (item.path.startsWith(dirPrefix) && item.path !== path) {
                             const relativePath = item.path.substring(dirPrefix.length);
                            const segment = relativePath.split('/')[0];
                            if (!segment) return;
                            if (!children.has(segment)) {
                                const isDir = relativePath.includes('/') || item.isDir;
                                children.set(segment, { 
                                    name: segment, kind: isDir ? 'directory' : 'file', 
                                    path: dirPrefix + segment
                                });
                            }
                        }
                    });
                    resolve(Array.from(children.values()));
                };
            }),
            read: ({ path }) => new Promise((resolve, reject) => {
                const req = State.db.transaction(this.STORE_NAME).objectStore(this.STORE_NAME).get(path);
                req.onsuccess = e => resolve(e.target.result?.content ?? '');
                req.onerror = e => reject(e.target.error);
            }),
            write: ({ path }, content) => new Promise((resolve, reject) => {
                const tx = State.db.transaction(this.STORE_NAME, "readwrite");
                const store = tx.objectStore(this.STORE_NAME);
                const req = store.get(path);
                req.onsuccess = () => {
                    const data = req.result || { path, isDir: false };
                    data.content = content;
                    store.put(data);
                };
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
            }),
            create: ({ path }, name, kind) => {
                const newPath = path === '/' ? name : `${path}/${name}`;
                return new Promise((resolve, reject) => {
                    const tx = State.db.transaction(this.STORE_NAME, "readwrite");
                    tx.objectStore(this.STORE_NAME).put({ path: newPath, content: '', isDir: kind === 'directory' });
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                });
            },
            delete: ({ path, kind }) => new Promise((resolve, reject) => {
                const tx = State.db.transaction(this.STORE_NAME, "readwrite");
                const store = tx.objectStore(this.STORE_NAME);
                if (kind === 'directory') {
                    const range = IDBKeyRange.bound(path, path + '\uffff');
                    store.delete(range);
                } else {
                    store.delete(path);
                }
                tx.oncomplete = resolve;
                tx.onerror = () => reject(tx.error);
            }),
        },
        GitHub: {
            api: async (endpoint, options = {}) => {
                if (!State.githubToken) throw new Error("GitHub token not set.");
                const headers = { 'Authorization': `Bearer ${State.githubToken}`, 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28', ...options.headers };
                const response = await fetch(`https://api.github.com${endpoint}`, { ...options, headers });
                if (!response.ok) {
                    const err = await response.json().catch(() => ({ message: response.statusText }));
                    throw new Error(err.message || `GitHub API Error: ${response.status}`);
                }
                return response.status === 204 ? null : response.json();
            },
            utf8_to_b64: str => btoa(unescape(encodeURIComponent(str))),
            b64_to_utf8: str => decodeURIComponent(escape(atob(str))),
            async list({ repoInfo, branch, path }) {
                const contents = await this.api(`/repos/${repoInfo.owner}/${repoInfo.repo}/contents/${path === '/' ? '' : path}?ref=${branch}`);
                return contents.map(c => ({ 
                    name: c.name, kind: c.type === 'dir' ? 'directory' : 'file', path: c.path, sha: c.sha
                }));
            },
            async read({ repoInfo, sha }) {
                const blob = await this.api(`/repos/${repoInfo.owner}/${repoInfo.repo}/git/blobs/${sha}`);
                if (blob.encoding !== 'base64') throw new Error("Unsupported encoding from GitHub");
                return this.b64_to_utf8(blob.content);
            },
            async write(item, content, commitMessage) {
                const { repoInfo, branch, path, name } = item;
                let existingSha;
                try {
                    const fileData = await this.api(`/repos/${repoInfo.owner}/${repoInfo.repo}/contents/${path}?ref=${branch}`);
                    existingSha = fileData.sha;
                } catch (e) { /* File doesn't exist, which is fine */ }

                const result = await this.api(`/repos/${repoInfo.owner}/${repoInfo.repo}/contents/${path}`, {
                    method: 'PUT',
                    body: JSON.stringify({ 
                        message: commitMessage || `B"H
Boruch Hashem!
Biezras Hashem 
Blessed is He
update ${name}
At ${new Date()}`, 
                        content: this.utf8_to_b64(content), sha: existingSha, branch 
                    })
                });
                item.sha = result.content.sha;
            },
            async create({ repoInfo, branch, path }, name, kind) {
                const newPath = (path === '/' ? name : `${path}/${name}`) + (kind === 'directory' ? '/.gitkeep' : '');
                const message = `B"H
Boruch Hashem!
Biezras Hashem 
Blessed is He
At ${new Date()}: create ${kind} '${name}'`;
                await this.api(`/repos/${repoInfo.owner}/${repoInfo.repo}/contents/${newPath}`, {
                    method: 'PUT',
                    body: JSON.stringify({ message, content: kind === 'directory' ? '' : this.utf8_to_b64(''), branch })
                });
            },
            async delete({ repoInfo, branch, path, name, sha, kind }) {
                if(kind === 'directory') throw new Error("Deleting non-empty folders via API is complex and not supported in this version.");
                const message = `B"H
Boruch Hashem!
Biezras Hashem 
Blessed is He
update ${name}
At ${new Date()}: delete ${name}`;
                await this.api(`/repos/${repoInfo.owner}/${repoInfo.repo}/contents/${path}`, {
                    method: 'DELETE',
                    body: JSON.stringify({ message, sha, branch })
                });
            }
        }
    };
    
    /**
     * Tabs Module: Manages all aspects of file tabs.
     */
    const Tabs = {
        getUniquePath: (item) => `${item.workspaceId}::${item.path}`,
        create(item) {
            const uniquePath = this.getUniquePath(item);
            const existingTab = State.tabs.find(t => t.uniquePath === uniquePath);
            if (existingTab) {
                this.activate(existingTab.id);
                return;
            }
            const newTab = { id: State.nextTabId++, item, content: null, isDirty: false, uniquePath };
            State.tabs.push(newTab);
            this.activate(newTab.id);
        },
        async activate(tabId) {
            State.activeTabId = tabId;
            const tab = State.tabs.find(t => t.id === tabId);

            if (!tab) {
                DOM.editorWrapper.classList.add('hidden');
                DOM.emptyEditorMessage.classList.remove('hidden');
                StatusBar.clear();
                this.render();
                return;
            }

            DOM.editorWrapper.classList.remove('hidden');
            DOM.emptyEditorMessage.classList.add('hidden');

            if (tab.content === null) {
                UI.showLoading(`Opening ${tab.item.name}...`);
                try {
                    tab.content = await FileSystemProvider.read(tab.item);
                } catch (e) {
                    UI.showToast(`Error opening ${tab.item.name}: ${e.message}`, 'error');
                    this.close(tab.id, true); // Force close if opening failed
                    return;
                } finally { UI.hideLoading(); }
            }
            Editor.setContent(tab.content, tab.item.name);
            this.render();
        },
        async close(tabId, force = false) {
            const tabIndex = State.tabs.findIndex(t => t.id === tabId);
            if (tabIndex === -1) return;

            const tabToClose = State.tabs[tabIndex];
            if (tabToClose.isDirty && !force) {
                const choice = await new Promise(resolve => {
                    UI.showDialog({ 
                        title: "Unsaved Changes", 
                        message: `Do you want to save the changes you made to "${tabToClose.item.name}"?`,
                        contentHTML: `<div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 10px;">
                            <button class="secondary-btn" id="dialog-custom-dont-save">Don't Save</button>
                            <button class="secondary-btn" id="dialog-custom-cancel">Cancel</button>
                            <button class="primary-btn" id="dialog-custom-save">Save</button>
                        </div>`,
                        okText: '', cancelText: ''
                    });
                    document.getElementById('dialog-custom-save').onclick = () => resolve('save');
                    document.getElementById('dialog-custom-dont-save').onclick = () => resolve('dont-save');
                    document.getElementById('dialog-custom-cancel').onclick = () => resolve('cancel');
                });

                DOM.genericDialog.classList.remove('visible');

                if (choice === 'save') await this.save(tabToClose);
                else if (choice === 'cancel') return;
            }

            State.tabs.splice(tabIndex, 1);
            if (State.activeTabId === tabId) {
                const nextTab = State.tabs[tabIndex] || State.tabs[tabIndex - 1] || null;
                await this.activate(nextTab ? nextTab.id : null);
            } else {
                // If closing a background tab, just re-render without changing activation
                this.render();
            }
        },
        async saveActive() {
            const tab = State.tabs.find(t => t.id === State.activeTabId);
            if (!tab) return UI.showToast('No active file to save.', 'info');
            if (!tab.isDirty) return UI.showToast('No changes to save.', 'info');
            await this.save(tab);
        },
        async save(tab) {
            UI.showLoading(`Saving ${tab.item.name}...`);
            try {
                // Ensure the editor content is up-to-date in the tab state
                if (tab.id === State.activeTabId) {
                    tab.content = Editor.getContent();
                }

                let commitMessage;
                if (tab.item.type === 'github') {
                    commitMessage = await UI.showDialog({ 
                        title: 'Commit Changes', hasTextarea: true, 
                        textareaContent: `B"H
Boruch Hashem!
Biezras Hashem 
Blessed is He
At ${new Date()}, updated ${tab.item.name}`, 
                        okText: 'Commit & Save',
                        message: `Enter a commit message for changes to "${tab.item.name}".`
                    });
                    if (!commitMessage) throw new Error("Save cancelled.");
                }

                await FileSystemProvider.write(tab.item, tab.content, commitMessage);
                tab.isDirty = false;
                UI.showToast(`Saved "${tab.item.name}"`, 'success');
                this.render();
            } catch (e) {
                UI.showToast(`Save failed: ${e.message}`, 'error');
            } finally { UI.hideLoading(); }
        },
        render() {
            DOM.tabBar.innerHTML = '';
            State.tabs.forEach(tab => {
                const tabEl = document.createElement('div');
                tabEl.className = `tab ${tab.id === State.activeTabId ? 'active' : ''} ${tab.isDirty ? 'dirty' : ''}`;
                tabEl.dataset.tabId = tab.id;
                tabEl.title = tab.item.path;
                tabEl.innerHTML = `
                    <span class="tab-name">${tab.item.name}</span>
                    <button class="icon-button close-tab-btn" title="Close"><svg class="svg-icon" style="width:0.8em;height:0.8em;"><use href="#icon-x"/></svg></button>`;
                
                tabEl.onclick = (e) => {
                    if (e.target.closest('.close-tab-btn')) {
                        e.stopPropagation(); this.close(tab.id);
                    } else if (State.activeTabId !== tab.id) {
                        this.activate(tab.id);
                    }
                };
                DOM.tabBar.appendChild(tabEl);
            });
            const activeTabEl = DOM.tabBar.querySelector('.tab.active');
            if (activeTabEl) activeTabEl.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            StatusBar.update();
        },
    };

    /**
     * Workspaces Module: Manages the file explorer tree view.
     */
    const Workspaces = {
        add(ws) {
            const newWs = { id: State.nextWorkspaceId++, isCollapsed: false, ...ws };
            State.workspaces.push(newWs);
            this.render(); // Re-render the entire sidebar to add the new workspace
        },
        render() {
            DOM.workspacesContainer.innerHTML = '';
            State.domItemMap.clear();
            if (State.workspaces.length === 0) {
                 DOM.workspacesContainer.innerHTML = `<div style="padding: 20px; text-align: center; color: var(--color-text-secondary);">Add a workspace to get started.</div>`;
                return;
            }

            State.workspaces.forEach(ws => {
                const wsRoot = document.createElement('div');
                wsRoot.className = 'workspace-root';
                
                const iconMap = { local: 'laptop', github: 'github', indexeddb: 'brain' };
                wsRoot.innerHTML = `
                    <div class="workspace-header">
                        <strong><svg class="svg-icon" style="margin-right:8px;"><use href="#icon-${iconMap[ws.type]}"></use></svg>${ws.name}</strong>
                    </div>
                    <ul class="workspace-tree ${ws.isCollapsed ? 'hidden' : ''}"></ul>`;
                
                const header = wsRoot.querySelector('.workspace-header');
                const tree = wsRoot.querySelector('.workspace-tree');
                
                header.onclick = () => {
                    ws.isCollapsed = !ws.isCollapsed;
                    tree.classList.toggle('hidden', ws.isCollapsed);
                    // Load tree content only when expanded for the first time
                    if (!ws.isCollapsed && !tree.hasChildNodes()) {
                        this.renderTree(tree, { ...ws, path: '/', workspaceId: ws.id, kind: 'directory' }, 1);
                    }
                };
                header.oncontextmenu = (e) => Menus.show(e, { ...ws, path: '/', kind: 'directory' });

                DOM.workspacesContainer.appendChild(wsRoot);
                const rootItem = { ...ws, path: '/', workspaceId: ws.id };
                State.domItemMap.set(`${ws.id}::/`, { el: wsRoot, item: rootItem });
                if (!ws.isCollapsed) {
                   this.renderTree(tree, { ...rootItem, kind: 'directory' }, 1);
                }
            });
        },
        async renderTree(parentElement, parentItem, depth) {
            parentElement.innerHTML = `<li class="tree-item" style="--depth:${depth}; color: var(--color-text-tertiary);">Loading...</li>`;
            try {
                const children = await FileSystemProvider.list(parentItem);
                
                parentElement.innerHTML = '';
                children.sort((a, b) => (a.kind === b.kind) ? a.name.localeCompare(b.name) : (a.kind === 'directory' ? -1 : 1));
                
                if (children.length === 0) {
                    parentElement.innerHTML = `<li class="tree-item" style="--depth:${depth}; color: var(--color-text-tertiary); font-style: italic;">Empty</li>`;
                    return;
                }

                children.forEach(child => {
                    const li = document.createElement('li');
                    li.className = 'tree-item';
                    li.style.setProperty('--depth', depth);
                    
                    const workspace = State.workspaces.find(ws => ws.id === parentItem.workspaceId);
                    const fullChildItem = { ...workspace, ...child, workspaceId: workspace.id };
                    li.title = fullChildItem.path;
                    State.domItemMap.set(`${workspace.id}::${child.path}`, { el: li, item: fullChildItem });

                    const icon = child.kind === 'directory' ? 'folder' : 'file';
                    const arrow = child.kind === 'directory' ? `<span class="tree-item-arrow">▶</span>` : `<span class="tree-item-arrow" style="opacity:0;">•</span>`;

                    li.innerHTML = `
                        <div class="tree-item-name-wrap">
                            ${arrow}
                            <svg class="svg-icon" style="flex-shrink:0; margin-right:2px;"><use href="#icon-${icon}"/></svg>
                            <span class="tree-item-name">${child.name}</span>
                        </div>`;
                    
                    const nameWrap = li.querySelector('.tree-item-name-wrap');
                    nameWrap.onclick = (e) => {
                        e.stopPropagation();
                        if (child.kind === 'directory') {
                            const subList = li.querySelector('ul');
                            if (subList) { 
                                subList.remove(); li.classList.remove('expanded');
                            } else {
                                li.classList.add('expanded');
                                const newUl = document.createElement('ul');
                                li.appendChild(newUl);
                                this.renderTree(newUl, fullChildItem, depth + 1);
                            }
                        } else { Tabs.create(fullChildItem); }
                    };
                    li.oncontextmenu = (e) => Menus.show(e, fullChildItem);
                    parentElement.appendChild(li);
                });
            } catch (e) {
                parentElement.innerHTML = `<li class="tree-item" style="color: var(--color-accent-danger); --depth:${depth};">Error: ${e.message}</li>`;
            }
        },
        async refreshNode(item) {
            const mapKey = `${item.workspaceId}::${item.path}`;
            const entry = State.domItemMap.get(mapKey);
            if (!entry) return;

            const isDir = item.kind === 'directory';
            const nodeToRefresh = isDir ? entry : State.domItemMap.get(`${item.workspaceId}::${item.path.substring(0, item.path.lastIndexOf('/')) || '/'}`);
            
            if (nodeToRefresh) {
                const parentEl = nodeToRefresh.el;
                const ul = parentEl.querySelector('ul');
                if (ul) {
                    const depth = (nodeToRefresh.item.path.match(/\//g) || []).length;
                    this.renderTree(ul, nodeToRefresh.item, depth + 1);
                } else if (nodeToRefresh.item.path === '/') { // It's a workspace root
                    const tree = parentEl.querySelector('.workspace-tree');
                    if(tree) this.renderTree(tree, nodeToRefresh.item, 1);
                }
            }
        }
    };



















    /**
     * Clipboard Module: Handles copying text with fallback for older browsers/insecure contexts.
     */
    const Clipboard = {
        async write(text) {
            try {
                // Try the modern, preferred API first. It's cleaner and asynchronous.
                await navigator.clipboard.writeText(text);
                return true; // Indicates success
            } catch (err) {
                console.warn("navigator.clipboard.writeText failed, falling back to execCommand.", err);
                // If the modern API fails (e.g., due to permissions), use the classic method.
                try {
                    const tempTextarea = document.createElement('textarea');
                    // Hide the temporary element from view
                    tempTextarea.style.position = 'absolute';
                    tempTextarea.style.left = '-9999px';
                    tempTextarea.value = text;
                    document.body.appendChild(tempTextarea);
                    tempTextarea.select();
                    const success = document.execCommand('copy');
                    document.body.removeChild(tempTextarea);
                    
                    if (!success) throw new Error('execCommand returned false.');
                    return true; // Indicates success
                } catch (fallbackErr) {
                    console.error("Fallback copy method also failed.", fallbackErr);
                    return false; // Indicates failure
                }
            }
        }
    };

            const btnRect = DOM.hamburgerMenuBtn.getBoundingClientRect();
