    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
            <span>Explorer</span>
            <button id="sidebar-collapse-btn" title="Collapse Sidebar" class="icon-button"><svg class="svg-icon"><use href="#icon-arrow-left"></use></svg></button>
                
                <button id="add-workspace-btn" title="Add Workspace" class="icon-button"><svg class="svg-icon"><use href="#icon-plus"></use></svg></button>
            </div>
            <div id="workspaces-container" class="workspaces-container"></div>
        </div>
        
        <div class="top-panel">
            <div class="menu-bar">
                 <button class="icon-button" id="sidebar-toggle-btn" title="Toggle Explorer">
        <svg class="svg-icon"><use href="#icon-sidebar"></use></svg>
    </button>
    <!-- This button will ALWAYS open the main menu -->
    <button class="icon-button" id="main-menu-btn" title="Main Menu">
        <svg class="svg-icon"><use href="#icon-menu"></use></svg>
    </button>
    <button class="icon-button hidden" id="view-console-btn" title="View Console">
        <svg class="svg-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-2 .9-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zM8 16.5a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm4 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zm4 0a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0zM8.41 11.59L10.83 9l-2.42-2.59L7 7l3.41 3.41L12.83 12l-2.42 2.42z"/></svg>
    </button>
    
            
            </div>
            <div id="tab-bar" class="tab-bar"></div>
        </div>
        
        <div class="main-content">
        <!-- B"H - NEW KEYBOARD HELPER BAR -->
            <div id="keyboard-helper" class="keyboard-helper">
                <button class="kh-btn" data-key="tab" title="Insert Tab (4 spaces)">Tab</button>
                <button class="kh-btn" data-key="left" title="Move cursor left">◀</button>
                <button class="kh-btn" data-key="up" title="Move cursor up">▲</button>
                <button class="kh-btn" data-key="down" title="Move cursor down">▼</button>
                <button class="kh-btn" data-key="right" title="Move cursor right">▶</button>
                <span class="kh-separator"></span>
                <button class="kh-btn" data-pair="{}" title="Insert curly braces">{ }</button>
                <button class="kh-btn" data-pair="[]" title="Insert square brackets">[ ]</button>
                <button class="kh-btn" data-pair="<>" title="Insert angle brackets">< ></button>
                <button class="kh-btn" data-pair='""' title="Insert double quotes">" "</button>
            </div>
            <div class="editor-area">
            <div id="previewer" class="hidden"></div>
            
            	<div id="console-host" class="hidden"></div>
    		<div id="iframe-cache" class="hidden" style="display:none;"></div>
            
                <div id="editor-wrapper" class="hidden">
                    <div id="line-numbers">1</div>
                    <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" rows="1"></textarea>
                </div>
                <div id="find-replace-panel">
                    <div class="fr-row">
                        <input type="text" id="find-input" placeholder="Find">
                        <div class="button-group">
                            <button id="find-prev-btn" class="secondary-btn" title="Previous">&lt;</button>
                            <button id="find-next-btn" class="secondary-btn" title="Next">&gt;</button>
                            <button id="find-close-btn" class="icon-button" title="Close"><svg class="svg-icon"><use href="#icon-x"/></svg></button>
                        </div>
                    </div>
                     <div class="fr-row">
                        <input type="text" id="replace-input" placeholder="Replace">
                        <div class="button-group">
                            <button id="replace-btn" class="secondary-btn">Replace</button>
                            <button id="replace-all-btn" class="secondary-btn">All</button>
                        </div>
                    </div>
                </div>
                <div id="empty-editor-message" class="empty-editor-message">
                    <h2>Awtsmoos Code Editor</h2>
                    <p>Add a workspace to begin</p>
                </div>
            </div>
        </div>
        
        <div class="status-bar">
            <div id="status-left"></div>
            <div id="status-right"></div>
        </div>
    </div>

    <!-- Overlays -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>
    <div id="loading-overlay" class="loading-overlay"><span>Processing...</span></div>
    <div id="toast-container" class="toast-container"></div>
    <div id="main-menu"></div>
    <div id="context-menu"></div>
    <!-- B"H - ADD THIS NEW ELEMENT -->
<div id="selection-menu" class="selection-menu-bar"></div>
    
    <div id="generic-dialog" class="dialog-overlay"></div>

<script type="module" src="js/main.js">
</script>
