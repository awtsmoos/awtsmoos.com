
<!-- B"H -->
<!DOCTYPE html>
<html lang="en" class="theme-vivid-dark">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin" />
    <meta http-equiv="Cross-Origin-Embedder-Policy" content="require-corp" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>⚡ Awtsmoos Editor ⚡</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- CORE -->
    <link href="css/variables.css" rel="stylesheet">
    <link href="css/base.css" rel="stylesheet">
    <link href="css/layout.css" rel="stylesheet">
    <link href="css/components.css" rel="stylesheet">
    
    <!-- UI SUBMODULES -->
    <link href="css/ui/menus.css" rel="stylesheet">
    <link href="css/ui/notifications.css" rel="stylesheet">
    <link href="css/ui/dialogs.css" rel="stylesheet">
    <link href="css/ui/selection-menu.css" rel="stylesheet">

    <!-- VIEWS -->
    <link href="css/views/workspace.css" rel="stylesheet">
    <link href="css/views/tabs.css" rel="stylesheet">
    <link href="css/views/editor.css" rel="stylesheet">
    <link href="css/views/tools.css" rel="stylesheet">
    <link href="css/views/git.css" rel="stylesheet">
    <link href="css/views/terminal.css" rel="stylesheet"> 

    <!-- FEATURES -->
    <link href="css/zip-explorer.css" rel="stylesheet">
    <link href="css/tab-manager.css" rel="stylesheet">
    <link href="css/search.css" rel="stylesheet"> 
    
    <!-- FILE COMMANDER (MODULARIZED) -->
    <link href="css/file-commander/layout.css" rel="stylesheet">
    <link href="css/file-commander/grid.css" rel="stylesheet">
    <link href="css/file-commander/details.css" rel="stylesheet">
    
    <!-- VIBE -->
    <link href="css/vibe/layout.css" rel="stylesheet">
    <link href="css/vibe/sidebar.css" rel="stylesheet">
    <link href="css/vibe/chat.css" rel="stylesheet">

    <!-- EFFECTS -->
    <link href="css/effects.css" rel="stylesheet"> 
    <link href="css/visuals.css" rel="stylesheet"> 
</head>  
<body>
    
    <div id="visual-layer" class="visual-layer">
        <canvas id="canvas-bg"></canvas>
        <canvas id="canvas-ui"></canvas>
    </div>

    <div class="app-container">
        <div class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span>Explorer</span>
                <div style="display:flex; gap: 4px;">
                    <button id="sidebar-search-btn" title="Search" class="icon-button"><svg class="svg-icon"><use href="#icon-search"></use></svg></button>
                    <button id="sidebar-collapse-btn" title="Collapse" class="icon-button"><svg class="svg-icon"><use href="#icon-arrow-left"></use></svg></button>
                </div>
            </div>
            <div class="sidebar-sub-header" style="padding: 0 10px 5px 10px; display:flex; justify-content:space-between; border-bottom: 1px solid var(--color-border);">
                 <button id="file-commander-btn" title="File Commander" class="icon-button"><svg class="svg-icon"><use href="#icon-folder"></use></svg></button>
                 <button id="add-workspace-btn" title="Add Workspace" class="icon-button"><svg class="svg-icon"><use href="#icon-plus"></use></svg></button>
            </div>
            <div id="workspaces-container" class="workspaces-container"></div>
        </div>
        <div id="sidebar-resizer" class="sidebar-resizer"></div>
        <div class="top-panel">
            <div class="menu-bar">
                <button class="icon-button" id="sidebar-toggle-btn" title="Toggle Explorer"><svg class="svg-icon"><use href="#icon-sidebar"></use></svg></button>
                <button class="icon-button" id="main-menu-btn" title="Main Menu"><svg class="svg-icon"><use href="#icon-menu"></use></svg></button>
                <div id="custom-menu-container"></div>
            </div>
            <div class="tab-bar-wrapper">
                <div id="tab-bar" class="tab-bar"></div>
                <button id="tab-manager-btn" class="icon-button" title="Tab Manager"><svg class="svg-icon"><use href="#icon-list"></use></svg></button>
            </div>
        </div>
        <div class="main-content">
            <div class="editor-area">
                <canvas id="canvas-overlay" class="editor-canvas"></canvas>
                <canvas id="minimap-canvas" class="minimap-canvas"></canvas>
                <div id="hud-stats" class="hud-stats"></div>

                <div id="previewer" class="hidden"></div>
                <div id="console-host" class="hidden"></div>
                <div id="hex-editor-wrapper" class="hidden"></div>
                <div id="zip-editor-wrapper" class="hidden"></div>
                <div id="vibe-editor-wrapper" class="hidden"></div>
                <div id="file-commander-wrapper" class="hidden"></div>
                <div id="terminal-wrapper" class="hidden"></div>

                <div id="editor-wrapper" class="hidden">
                    <div id="line-numbers">1</div>
                    <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" rows="1"></textarea>
                </div>
                
                <div id="data-altar-container" class="hidden"></div>

                <div id="find-replace-panel">
                    <div class="fr-row">
                        <div class="find-input-container">
                            <input type="text" id="find-input" placeholder="Find">
                        </div>
                        <div class="button-group">
                            <button id="find-prev-btn" class="secondary-btn">&lt;</button>
                            <button id="find-next-btn" class="secondary-btn">&gt;</button>
                            <button id="find-close-btn" class="icon-button"><svg class="svg-icon"><use href="#icon-x"/></svg></button>
                        </div>
                    </div>
                    <div class="fr-row">
                        <input type="text" id="replace-input" placeholder="Replace">
                        <div class="button-group">
                            <button id="replace-btn" class="secondary-btn">Replace</button>
                            <button id="replace-all-btn" class="secondary-btn">All</button>
                        </div>
                    </div>
                    <!-- B"H - Added Missing Options Row -->
                    <div class="fr-row" style="padding-top: 5px;">
                        <label style="display: flex; align-items: center; gap: 5px; font-size: 0.8em; color: var(--color-text-secondary); cursor: pointer;">
                            <input type="checkbox" id="fr-case-sensitive" style="width: auto;">
                            Case Sensitive
                        </label>
                    </div>
                </div>

                <div id="empty-editor-message" class="empty-editor-message"><h2>Awtsmoos Editor</h2><p>Add a workspace</p></div>
            </div>
        </div>
        <div class="status-bar">
            <div id="status-left"></div>
            <div id="status-right"></div>
        </div>
    </div>

    <!-- Divine Overlays & Menus -->
    <div id="loading-overlay" class="loading-overlay"><span>Processing...</span></div>
    <div id="toast-container"></div>
    <div id="main-menu"></div>
    <div id="context-menu"></div>
    
    <div id="selection-menu" class="selection-menu-bar"></div>
    
    <div id="graph-nav-overlay" class="graph-nav-overlay hidden">
        <button id="graph-nav-close" class="icon-button"><svg class="svg-icon"><use href="#icon-x"></use></svg></button>
        <canvas id="graph-canvas"></canvas>
    </div>
    <div id="tab-manager-overlay" class="tab-manager-overlay hidden">
        <div class="tm-header">
            <h2>Open Tabs</h2>
            <div class="tm-controls">
                <input type="text" id="tm-search" placeholder="Filter tabs...">
                <button id="tm-select-mode-btn" class="secondary-btn">Select...</button>
                <button id="tm-close-overlay" class="icon-button"><svg class="svg-icon"><use href="#icon-x"></use></svg></button>
            </div>
        </div>
        <div id="tm-grid" class="tm-grid"></div>
        <div id="tm-selection-bar" class="tm-selection-bar hidden">
            <div class="tm-selection-info"><span id="tm-selection-count">0 Selected</span></div>
            <div class="tm-selection-actions">
                <button id="tm-select-all" class="secondary-btn">Select All</button>
                <button id="tm-close-selected" class="secondary-btn danger">Close Selected</button>
                <button id="tm-cancel-selection" class="icon-button"><svg class="svg-icon"><use href="#icon-x"/></svg></button>
            </div>
        </div>
        <div id="tm-context-menu" class="tm-context-menu hidden">
            <button data-action="open">Open</button>
            <button data-action="select">Select</button>
            <button data-action="pin">Pin</button>
            <hr class="menu-separator">
            <button data-action="close" class="danger">Close</button>
        </div>
    </div>
    <div id="generic-dialog" class="dialog-overlay"></div>

    <script type="module" src="js/main.js"></script>
    <script src="/register.js"></script>
</body>
</html>
