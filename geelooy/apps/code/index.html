            document.querySelectorAll('.context-active').forEach(el => el.classList.remove('context-active'));
            // This is the crucial part: we clean up the listener.
            document.removeEventListener('click', this.handleDocumentClick);
        },
        positionAndDisplay(menu, coords) {
             const { clientX: x, clientY: y } = coords;
            menu.style.display = 'block';
            const menuRect = menu.getBoundingClientRect();
            const adjustedX = (x + menuRect.width > window.innerWidth) ? window.innerWidth - menuRect.width - 5 : x;
            const adjustedY = (y + menuRect.height > window.innerHeight) ? window.innerHeight - menuRect.height - 5 : y;
            menu.style.left = `${adjustedX}px`;
            menu.style.top = `${adjustedY}px`;
        },
        async handleAction(action) {
            const item = State.contextTarget;
            this.hideAll();

            try {
                switch(action) {
                    case 'save': Tabs.saveActive(); break;
                    case 'find-replace': FindReplace.show(); break;
                    case 'settings': App.showSettings(); break;

case 'select-all': {
                        const activeTab = State.tabs.find(t => t.id === State.activeTabId);
                        if (activeTab) {
                            DOM.editor.focus();
                            DOM.editor.select();
                        }
                        break;
                    }
                    case 'copy': {
                        const selectedText = DOM.editor.value.substring(DOM.editor.selectionStart, DOM.editor.selectionEnd);
                        if (selectedText) {
                            const success = await Clipboard.write(selectedText);
                            UI.showToast(success ? 'Selection copied!' : 'Copy failed!', success ? 'success' : 'error');
                        }
                        break;
                    }
                    case 'copy-all': {
                        const activeTab = State.tabs.find(t => t.id === State.activeTabId);
                        if (activeTab && DOM.editor.value) {
                            const success = await Clipboard.write(DOM.editor.value);
                            UI.showToast(success ? 'All content copied!' : 'Copy failed!', success ? 'success' : 'error');
                        }
                        break;
                    }
                    
                    
                    case 'toggle-keyboard-helper': // <-- ADD THIS CASE BLOCK
                        DOM.keyboardHelper.classList.toggle('is-visible');
                        break;




                    case 'new-file':
                    case 'new-folder': {
                        if(!item) break;
                        const kind = action.split('-')[1];
                        const name = await UI.showDialog({ title: `Create New ${kind}`, hasInput: true, placeholder: `Enter ${kind} name...` });
                        if (name) {
                            UI.showLoading(`Creating ${kind}...`);
                            await FileSystemProvider.create(item, name, kind);
                            UI.showToast(`${kind} '${name}' created.`, 'success');
                            await Workspaces.refreshNode(item);
                        }
                        break;
                    }
case 'delete-workspace': {
                        if (!item || item.path !== '/') break;
                         const confirmed = await UI.showDialog({ title: 'Remove Workspace', message: `Are you sure you want to remove '${item.name}'? This does not delete the actual files.`, okText: 'Remove', cancelText: 'Cancel' });
                        if(confirmed) {
                            UI.showLoading('Removing workspace...');
                            const wsId = item.workspaceId;
                            const tabsToClose = State.tabs.filter(t => t.item.workspaceId === wsId);
                            for(const tab of tabsToClose) await Tabs.close(tab.id, true);
                            State.workspaces = State.workspaces.filter(ws => ws.id !== wsId);
                            Workspaces.render();
                            UI.showToast(`Workspace removed.`, 'success');
                        }
                        break;
                    }
                    case 'delete': {
                        if(!item) break;
                        const confirmed = await UI.showDialog({ title: 'Confirm Deletion', message: `Are you sure you want to permanently delete '${item.name}'?`, okText: 'Delete', cancelText: 'Cancel' });
                        if(confirmed) {
                            UI.showLoading('Deleting...');
                            const tab = State.tabs.find(t => t.uniquePath === Tabs.getUniquePath(item));
                            if (tab) await Tabs.close(tab.id, true);
                            await FileSystemProvider.delete(item);
                            UI.showToast(`'${item.name}' deleted.`, 'success');
                            
                            const parentPath = item.path.substring(0, item.path.lastIndexOf('/')) || '/';
                            const parentItem = { ...item, path: parentPath, kind: 'directory' };
                            await Workspaces.refreshNode(parentItem);
                        }
                        break;
                    }
                }
            } catch(e) { UI.showToast(`Error: ${e.message}`, 'error'); } 
              finally { UI.hideLoading(); }
        }
    };















    



















    /**
     * FindReplace Module: Controls the find/replace panel in the editor.
     */
    const FindReplace = {
        panel: DOM.findReplacePanel,
        findInput: DOM.findReplacePanel.querySelector('#find-input'),
        replaceInput: DOM.findReplacePanel.querySelector('#replace-input'),
        
        show() { this.panel.style.display = 'grid'; this.findInput.focus(); this.findInput.select(); },
        hide() { this.panel.style.display = 'none'; Editor.focus(); },
        find(reverse = false) {
            const query = this.findInput.value; if(!query) return;
            const body = DOM.editor.value;
            let from = DOM.editor.selectionEnd;
            let index = -1;

            if (reverse) {
                from = DOM.editor.selectionStart - 1;
                index = body.lastIndexOf(query, from);
            } else {
                index = body.indexOf(query, from);
            }

            if (index !== -1) {
                DOM.editor.setSelectionRange(index, index + query.length);
                DOM.editor.focus();
                DOM.editor.scrollTo(0, DOM.editor.scrollTop); // Hack to force viewport update
            } else {
                UI.showToast('No more occurrences found.', 'info');
            }
        },
        replace() {
            const query = this.findInput.value; const replacement = this.replaceInput.value;
            if (!query) return;
            const selectedText = DOM.editor.value.substring(DOM.editor.selectionStart, DOM.editor.selectionEnd);
            if (selectedText.toLowerCase() === query.toLowerCase()) {
                DOM.editor.setRangeText(replacement, DOM.editor.selectionStart, DOM.editor.selectionEnd, 'end');
                this.find();
            } else { this.find(); }
        },
        replaceAll() {
            const query = this.findInput.value; const replacement = this.replaceInput.value;
            if (!query) return;
            const originalValue = DOM.editor.value;
            const newValue = originalValue.replaceAll(query, replacement);
            if(originalValue !== newValue) {
                DOM.editor.value = newValue;
                UI.showToast(`Replaced all occurrences.`, 'success');
                DOM.editor.dispatchEvent(new Event('input'));
            } else {
                UI.showToast(`No occurrences of "${query}" found.`, 'info');
            }
        },
        init() {
            DOM.findReplacePanel.querySelector('#find-next-btn').onclick = () => this.find();
            DOM.findReplacePanel.querySelector('#find-prev-btn').onclick = () => this.find(true);
            DOM.findReplacePanel.querySelector('#find-close-btn').onclick = () => this.hide();
            DOM.findReplacePanel.querySelector('#replace-btn').onclick = () => this.replace();
            DOM.findReplacePanel.querySelector('#replace-all-btn').onclick = () => this.replaceAll();
        }
    };
    
    /**
     * App Module: Main application controller and initializer.
     */
    const App = {
        getTabString: () => State.useTabs ? '\t' : '    ',
        async initialize() {
            UI.showLoading("VIVID X Initializing...");
            this.setupEventListeners();
            this.loadSettings();
            
            try { await FileSystemProvider.IndexedDB.init(); } 
            catch (e) { UI.showToast("Browser Storage (IndexedDB) failed.", 'error'); }
            
            Workspaces.render();
            Tabs.activate(null);
            FindReplace.init();
            
            UI.hideLoading();
            UI.showToast("Welcome to VIVID X // Profound Edition", 'success');
        },
        saveSettings: () => {
             // B"H - Now saves the githubToken AND the useTabs preference
             localStorage.setItem('vividX_settings_profound', JSON.stringify({ 
                 githubToken: State.githubToken,
                 useTabs: State.useTabs 
             }));
        },
        loadSettings: () => {
             const settings = JSON.parse(localStorage.getItem('vividX_settings_profound') || '{}');
             State.githubToken = settings.githubToken || null;
             // B"H - Load the useTabs setting, defaulting to false if not found
             State.useTabs = settings.useTabs ?? false;
        },
        setupEventListeners() {
            DOM.editor.addEventListener('input', () => {
                const activeTab = State.tabs.find(t => t.id === State.activeTabId);
                if (activeTab && !activeTab.isDirty) {
                    activeTab.isDirty = true;
                    Tabs.render();
                }
                UI.updateLineNumbers();
            });
            DOM.editor.addEventListener('scroll', UI.syncScroll);
            DOM.editor.addEventListener('keyup', StatusBar.update);
            DOM.editor.addEventListener('click', StatusBar.update);
            new ResizeObserver(UI.updateLineNumbers).observe(DOM.editor);
            
            document.addEventListener('click', (e) => {
                if(!DOM.contextMenu.contains(e.target) && !DOM.mainMenu.contains(e.target)) Menus.hideAll();
            });
            DOM.contextMenu.addEventListener('click', (e) => {
                const button = e.target.closest('button');
                if (button) Menus.handleAction(button.dataset.action);
            });
            DOM.mainMenu.addEventListener('click', (e) => {
                const button = e.target.closest('button');
                if (button && !button.disabled) Menus.handleAction(button.dataset.action);
            });
            DOM.hamburgerMenuBtn.onclick = (e) => Menus.showMainMenu(e);
            DOM.addWorkspaceBtn.onclick = () => this.showAddWorkspaceDialog();



// Prevent clicks inside the sidebar from bubbling up to the document,
            // which stops the global click listener from incorrectly collapsing the UI.
            DOM.sidebar.addEventListener('click', (e) => {
                e.stopPropagation();
            });


            DOM.mobileSidebarToggle.onclick = () => {
                DOM.sidebar.classList.toggle('is-open');
                DOM.sidebarOverlay.classList.toggle('is-visible');
            };
            const closeMobileSidebar = () => {
                DOM.sidebar.classList.remove('is-open');
                DOM.sidebarOverlay.classList.remove('is-visible');
                // Clean up the master listener when the sidebar is closed.
                document.removeEventListener('click', handleOutsideClick);
            };

            const handleOutsideClick = (e) => {
                // If the click is NOT inside the sidebar, close it.
                if (!e.target.closest('#sidebar')) {
                    closeMobileSidebar();
                }
            };

            DOM.mobileSidebarToggle.onclick = (e) => {
                // Stop this button click from being immediately caught by our new listener.
                e.stopPropagation(); 
                
                const isOpen = DOM.sidebar.classList.contains('is-open');

                if (isOpen) {
                    closeMobileSidebar();
                } else {
                    DOM.sidebar.classList.add('is-open');
                    DOM.sidebarOverlay.classList.add('is-visible');
                    // Add a master listener to the whole page to watch for the next click.
                    document.addEventListener('click', handleOutsideClick);
                }
            };

            window.addEventListener('keydown', (e) => {
                const hasModifier = e.ctrlKey || e.metaKey;
                if (hasModifier && e.key.toLowerCase() === 's') { e.preventDefault(); Tabs.saveActive(); }
                if (hasModifier && e.key.toLowerCase() === 'f') { e.preventDefault(); FindReplace.show(); }
                if (e.key === 'Escape') {
                    if (DOM.genericDialog.classList.contains('visible')) return;
                    if (DOM.findReplacePanel.style.display !== 'none') FindReplace.hide();
                    else Menus.hideAll();
                }
            });
            
            
            
            // B"H - Enable Tab key in Find/Replace inputs
            const handleTabInInputs = (e) => {
                if (e.key === 'Tab') {
                    e.preventDefault(); // Prevent focus change
                    const input = e.target;
                    const start = input.selectionStart;
                    const end = input.selectionEnd;
                    // Use setRangeText which is available on input elements too
                    input.setRangeText(App.getTabString(), start, end, 'end');
                }
            };
            DOM.findInput.addEventListener('keydown', handleTabInInputs);
            DOM.replaceInput.addEventListener('keydown', handleTabInInputs);

// B"H - ADDING SMART INDENT ON ENTER KEY
            DOM.editor.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault(); // Stop the default newline action

                    const editor = DOM.editor;
                    const fullText = editor.value;
                    const cursorPosition = editor.selectionStart;

                    // Find the start of the line the cursor is on
                    const lineStartPos = fullText.substring(0, cursorPosition).lastIndexOf('\n') + 1;
                    
                    // Find the end of that same line
                    let lineEndPos = fullText.indexOf('\n', cursorPosition);
                    if (lineEndPos === -1) {
                        lineEndPos = fullText.length;
                    }
                    
                    // Extract the full text of the current line
                    const currentLineText = fullText.substring(lineStartPos, lineEndPos);
                    
                    // Get the leading whitespace (spaces or tabs) from that line
                    const leadingWhitespaceMatch = currentLineText.match(/^\s*/);
                    const indent = leadingWhitespaceMatch ? leadingWhitespaceMatch[0] : '';
                    
                    const textToInsert = '\n' + indent;

                    // Insert the newline and the captured indentation at the cursor
                    editor.setRangeText(textToInsert, cursorPosition, editor.selectionEnd, 'end');
                    
                    // Manually trigger an input event so UI elements like line numbers update correctly
                    editor.dispatchEvent(new Event('input', { bubbles: true }));
                }
            });
            
            
            
            
            // B"H - KEYBOARD HELPER FUNCTIONALITY
            DOM.keyboardHelper.addEventListener('click', (e) => {
                const button = e.target.closest('button.kh-btn');
                if (!button) return;

                const editor = DOM.editor;
                const key = button.dataset.key;
                const pair = button.dataset.pair;
                const start = editor.selectionStart;
                const end = editor.selectionEnd;

                if (pair) {
                    const [charStart, charEnd] = pair;
                    const selectedText = editor.value.substring(start, end);
                    const textToInsert = charStart + selectedText + charEnd;
                    editor.setRangeText(textToInsert, start, end, 'select');
                    // Place cursor inside for empty pairs
                    if (start === end) {
                        editor.selectionStart = editor.selectionEnd = start + 1;
                    }
                } else if (key) {
                    switch (key) {
                        case 'tab':
                            // B"H - Uses the new configurable tab string
                            editor.setRangeText(App.getTabString(), start, end, 'end');
                            break;
                        case 'left':
                            editor.selectionStart = editor.selectionEnd = Math.max(0, start - 1);
                            break;
                        case 'right':
                            editor.selectionStart = editor.selectionEnd = Math.min(editor.value.length, start + 1);
                            break;
                        // Note: Up/Down are simplified for reliability.
                        case 'up':
                            const upPos = editor.value.substring(0, start).lastIndexOf('\n');
                            editor.selectionStart = editor.selectionEnd = Math.max(0, upPos);
                            break;
                        case 'down':
                            const downPos = editor.value.indexOf('\n', start);
                            editor.selectionStart = editor.selectionEnd = (downPos > -1) ? downPos + 1 : editor.value.length;
                            break;
                    }
                }
                editor.focus(); // Always return focus to the editor
                editor.dispatchEvent(new Event('input', { bubbles: true }));
            });

            window.onbeforeunload = (e) => {
                if (State.tabs.some(t => t.isDirty)) {
                    e.preventDefault(); e.returnValue = ''; return '';
                }
            };
        },

















        async showAddWorkspaceDialog() {
            const contentHTML = `
                <div id="workspace-options">
                    <button class="menu-button" data-action="local"><svg class="svg-icon"><use href="#icon-laptop"></use></svg> Local Folder</button>
                    <button class="menu-button" data-action="github"><svg class="svg-icon"><use href="#icon-github"></use></svg> GitHub Repository</button>
                    <button class="menu-button" data-action="idb"><svg class="svg-icon"><use href="#icon-brain"></use></svg> Browser Storage</button>
                </div>
            `;
            
            // Show a dialog that only displays content and has its own close button.
            // We will handle all actions manually to avoid event conflicts.
            UI.showDialog({ 
                title: 'Add New Workspace', 
                contentHTML, 
                okText: '', // Remove the default OK button
                cancelText: 'Cancel' // Use the default cancel button for closing
            });

            // The logic MUST be attached to a unique element inside the dialog content.
            const optionsContainer = document.getElementById('workspace-options');
            if (!optionsContainer) return; // Safety check

            // Use a single event listener to handle all button clicks within the container.
            optionsContainer.addEventListener('click', (e) => {
                const button = e.target.closest('button');
                if (!button) return;

                const action = button.dataset.action;
                
                // IMPORTANT: First, always close the dialog cleanly.
                DOM.genericDialog.classList.remove('visible');

                // Second, perform the action.
                switch (action) {
                    case 'local':
                        this.addLocalWorkspace();
                        break;
                    case 'github':
                        this.addGithubWorkspace();
                        break;
                    case 'idb':
                        this.addIdbWorkspace();
                        break;
                }
            });
        },




        async addLocalWorkspace() {
            DOM.genericDialog.classList.remove('visible'); // Close the selection dialog
            try {
                // `showDirectoryPicker` must be called in response to a user gesture
                const handle = await window.showDirectoryPicker();
                // Check for readwrite permission
                if (await handle.queryPermission({ mode: 'readwrite' }) !== 'granted') {
                    if (await handle.requestPermission({ mode: 'readwrite' }) !== 'granted') {
                         throw new Error('Permission to write to directory was denied.');
                    }
                }
                Workspaces.add({ name: `💻 ${handle.name}`, type: 'local', handle, kind: 'directory' });
            } catch (e) {
                // AbortError is common if user cancels the picker, so we ignore it
                if (e.name !== 'AbortError') UI.showToast(`Could not open directory: ${e.message}`, 'error');
            }
        },
        async addIdbWorkspace() {
            DOM.genericDialog.classList.remove('visible');
            Workspaces.add({ name: '🧠 Browser Storage', type: 'indexeddb', kind: 'directory' });
        },
        async addGithubWorkspace() {
            DOM.genericDialog.classList.remove('visible');
            if (!State.githubToken) {
                const token = await UI.showDialog({ title: "GitHub Personal Access Token", message: "Enter a PAT with 'repo' scope to access your repositories:", hasInput: true, inputType: 'password', placeholder: "ghp_..." , cancelText: 'Cancel'});
                if (token) { State.githubToken = token; this.saveSettings(); } else return;
            }
            UI.showLoading("Fetching repositories...");
            try {
                const repos = await FileSystemProvider.GitHub.api('/user/repos?sort=updated&per_page=100');
                const repoListHTML = repos.map(repo => `<button class="menu-button" data-repo-full-name="${repo.full_name}">${repo.full_name}</button>`).join('');
                
                UI.showDialog({ title: 'Select a Repository', contentHTML: `<div style="max-height: 50vh; overflow-y: auto;">${repoListHTML}</div>`, okText: '', cancelText: 'Cancel'});
                
                const dialogContent = document.getElementById('dialog-content');
                dialogContent.querySelectorAll('.menu-button').forEach(btn => {
                    btn.onclick = () => {
                        const fullName = btn.dataset.repoFullName;
                        const [owner, repoName] = fullName.split('/');
                        const repoData = repos.find(r => r.full_name === fullName);
                        Workspaces.add({ name: `📦 ${fullName}`, type: 'github', repoInfo: { owner, repo: repoName }, kind: 'directory', branch: repoData.default_branch });
                        DOM.genericDialog.classList.remove('visible');
                    };
                });
            } catch (e) {
                UI.showToast(`Failed to fetch repos: ${e.message}`, 'error');
                const clearToken = await UI.showDialog({title: "Authentication Error", message: "Your GitHub token may be invalid or expired. Clear the saved token and try again?", okText: "Clear Token", cancelText: "Cancel"});
                if (clearToken) { State.githubToken = null; this.saveSettings(); UI.showToast("GitHub token cleared.", "info"); }
            } finally { UI.hideLoading(); }
        },
        async showSettings() {
            // B"H - Added a checkbox for the new setting
            const contentHTML = `
                <label for="github-token-input" style="font-weight: 600; margin-bottom: -8px;">GitHub Personal Access Token</label>
                <input type="password" id="github-token-input" value="${State.githubToken || ''}" placeholder="ghp_...">
                <div style="display: flex; align-items: center; gap: 10px; margin-top: 15px;">
                    <input type="checkbox" id="use-tabs-checkbox" ${State.useTabs ? 'checked' : ''} style="width: auto;">
                    <label for="use-tabs-checkbox">Use Tab Characters (instead of spaces)</label>
                </div>
            `;
            const result = await UI.showDialog({ title: 'Settings', contentHTML, okText: 'Save', cancelText: 'Cancel' });

            if (result) {
                const token = document.getElementById('github-token-input').value;
                State.githubToken = token || null;
                // B"H - Read the checkbox value on save
                State.useTabs = document.getElementById('use-tabs-checkbox').checked;
                this.saveSettings();
                UI.showToast('Settings saved.', 'success');
            }
        },
    };
    	
        

    // --- INITIALIZE THE APPLICATION ---
    App.initialize();
    
});
</script>
