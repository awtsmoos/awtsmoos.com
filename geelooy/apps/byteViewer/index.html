<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hex Viewer of the Awtsmoos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Hex Viewer</h1>
        <label for="fileInput" class="drop-zone" id="dropZone">
            Drop a File Here
        </label>
        <input type="file" id="fileInput" style="display: none;" />
        <div id="hexViewer"></div>
        <div class="controls">
            <button id="scrollUp">Scroll Up</button>
            <button id="scrollDown">Scroll Down</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
