	registerRuntime({ id: "rt-mac", mode: "native", activeRoot: "/Users/test/proj", tunnel: { name: "awt-awtsmoos-2184", connected: false }, mountedCapabilities: {} });

		return { detailVisible: vis(document.getElementById("actionDetail")), actionName: document.getElementById("actionName")?.value, runVisible: vis(document.getElementById("runActionBtn")), mismatches };

	R.feed = { rows: rows.length, counts: rows.map(r => r.count) };

	R.meshHealthText = card.textContent.replace(/\s+/g, " ").trim();
} catch (error) { R.error = String(error.stack || error); }
const out = document.createElement("pre"); out.id = "audit"; out.textContent = JSON.stringify(R, null, 1);
