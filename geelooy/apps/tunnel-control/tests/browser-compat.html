<!doctype html><html><head><meta charset="utf-8"></head><body data-status="loading"><pre id="report">Loading browser module test</pre>
<script type="module">
import { liveRoom } from "./js/features/liveRoom.js";
import { h } from "./js/ui/core/html.js";
try {
	const room = liveRoom();
	document.body.append(room);
	const ids = ["liveRoomPanel", "liveRoomRoster", "liveRoomFeed", "liveRoomName", "liveRoomText", "liveRoomKind", "liveRoomJoin", "liveRoomSend"];
	const missing = ids.filter(id => !document.getElementById(id));
	let clicks = 0;
	const example = h("button", { id: "testButton", on: { click: () => clicks++ }, text: "Test" });
	document.body.append(example);
	example.click();
	if (missing.length || clicks !== 1 || !room.querySelector(".awt-room-grid")) throw Error(JSON.stringify({ missing, clicks }));
	document.body.dataset.status = "pass";
	document.getElementById("report").textContent = `PASS: ${ids.length} Live Room controls, child markup and event handler`;
} catch (error) {
	document.body.dataset.status = "fail";
	document.getElementById("report").textContent = String(error);
}
</script></body></html>
