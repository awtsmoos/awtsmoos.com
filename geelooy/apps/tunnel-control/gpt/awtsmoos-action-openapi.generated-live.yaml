              - chromeType
              - chromeEval
              - chromeLogs
              - chromeSnapshot
              - chromeRunScript
              - chromeScreenshot
              - chromeNetwork
              - chromeAccessibilitySnapshot
              - chromeTestUrl
              - chromeCookies
              - chromeCookieSet
              - chromeCookieDelete
              - chromeStorage
              - chromeStorageSet
              - chromeStorageDelete
              - chromeSessionExport
              - chromeSessionImport
              - chromeUseHttpCookies
        - { name: p, in: query, schema: { type: string, default: . } }
        - { name: path, in: query, schema: { type: string } }
        - { name: paths, in: query, schema: { type: string }, description: "Plain newline/comma/JSON list of paths." }
        - { name: files, in: query, schema: { type: string }, description: "Plain JSON/text file list or file map, depending on action." }
        - { name: writes, in: query, schema: { type: string }, description: "Plain JSON/text write list or path-content map." }
        - { name: edits, in: query, schema: { type: string }, description: "Plain JSON/text edit list." }
