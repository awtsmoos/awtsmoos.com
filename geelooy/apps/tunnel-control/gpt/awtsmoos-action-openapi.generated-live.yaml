        - { name: ext, in: query, schema: { type: string } }
        - { name: shell, in: query, schema: { type: string } }
        - { name: expectedSha256, in: query, schema: { type: string } }
        - { name: expectedSourceSha256, in: query, schema: { type: string } }
        - { name: sha256, in: query, schema: { type: string } }
        - { name: startLine, in: query, schema: { type: integer } }
        - { name: endLine, in: query, schema: { type: integer } }
        - { name: startColumn, in: query, schema: { type: integer } }
        - { name: endColumn, in: query, schema: { type: integer } }
        - { name: offsetChars, in: query, schema: { type: integer, default: 0 } }
        - { name: maxChars, in: query, schema: { type: integer, default: 12000 } }
        - { name: totalMaxChars, in: query, schema: { type: integer, default: 24000 } }
        - { name: offsetBytes, in: query, schema: { type: integer, default: 0 } }
        - { name: maxBytes, in: query, schema: { type: integer, default: 24000 } }
        - { name: maxFiles, in: query, schema: { type: integer, default: 5 } }
        - { name: maxRanges, in: query, schema: { type: integer, default: 20 } }
        - { name: maxEntries, in: query, schema: { type: integer, default: 3000 } }
        - { name: maxResults, in: query, schema: { type: integer, default: 80 } }
        - { name: maxFileBytes, in: query, schema: { type: integer, default: 800000 } }
        - { name: sinceMinutes, in: query, schema: { type: integer, default: 120 } }
        - { name: minBytes, in: query, schema: { type: integer, default: 500000 } }
        - { name: modifiedAfterMs, in: query, schema: { type: integer, default: 0 } }
        - { name: depth, in: query, schema: { type: integer, default: 2 } }
        - { name: limit, in: query, schema: { type: integer, default: 150 } }
        - { name: timeoutMs, in: query, schema: { type: integer, default: 240000 } }
        - { name: waitMs, in: query, schema: { type: integer, default: 0 } }
        - { name: selectorTimeoutMs, in: query, schema: { type: integer, default: 10000 } }
        - { name: maxLogs, in: query, schema: { type: integer, default: 200 } }
        - { name: maxText, in: query, schema: { type: integer, default: 4000 } }
        - { name: maxHtml, in: query, schema: { type: integer, default: 0 } }
        - { name: maxRedirects, in: query, schema: { type: integer, default: 5 } }
        - { name: maxSteps, in: query, schema: { type: integer, default: 50 } }
        - { name: maxIterations, in: query, schema: { type: integer, default: 20 } }
        - { name: maxStepOutputChars, in: query, schema: { type: integer, default: 12000 } }
        - { name: indent, in: query, schema: { type: integer, default: 2 } }
        - { name: regex, in: query, schema: { type: boolean, default: false } }
        - { name: replaceAll, in: query, schema: { type: boolean, default: true } }
        - { name: dryRun, in: query, schema: { type: boolean, default: true } }
        - { name: confirm, in: query, schema: { type: boolean, default: false } }
        - { name: includeDirs, in: query, schema: { type: boolean, default: false } }
        - { name: write, in: query, schema: { type: boolean, default: false } }
        - { name: snapshot, in: query, schema: { type: boolean, default: true } }
        - { name: assertNoConsoleErrors, in: query, schema: { type: boolean, default: false } }
        - { name: headless, in: query, schema: { type: boolean, default: false } }
        - { name: clearLogs, in: query, schema: { type: boolean, default: false } }
        - { name: fullPage, in: query, schema: { type: boolean, default: true } }
        - { name: failedOnly, in: query, schema: { type: boolean, default: true } }
        - { name: useCookies, in: query, schema: { type: boolean, default: true } }
        - { name: saveCookies, in: query, schema: { type: boolean, default: true } }
        - { name: followRedirects, in: query, schema: { type: boolean, default: true } }
        - { name: keepServer, in: query, schema: { type: boolean, default: false } }
        - { name: keepSandbox, in: query, schema: { type: boolean, default: false } }
        - { name: includeValues, in: query, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyResponse"
        "400": { description: Bad Request }
        "401": { description: Unauthorized }
        "403": { description: Forbidden }
        "413": { description: Payload Too Large }
  /api/tunnel/control/preview/{tunnelName}:
    get:
      operationId: awtsmoosPreviewProxy
      summary: Fetch preview through tunnel.
      security:
        - OAuth2: [profile, tunnel.read]
      parameters:
        - { name: tunnelName, in: path, required: true, schema: { type: string } }
        - { name: url, in: query, schema: { type: string } }
        - { name: maxChars, in: query, schema: { type: integer, default: 500000 } }
        - { name: timeoutMs, in: query, schema: { type: integer, default: 30000 } }
      responses:
        "200":
          description: Preview response body
          content:
            text/html: { schema: { type: string } }
            text/plain: { schema: { type: string } }
            application/json:
              schema:
                $ref: "#/components/schemas/AnyResponse"
components:
  schemas:
    AnyResponse:
      type: object
      additionalProperties: true
      properties:
        BH: { type: string }
        ok: { type: boolean }
        error: { type: string }
        message: { type: string }
        tunnelName: { type: string }
        action: { type: string }
        path: { type: string }
        content: { type: string }
        items:
          type: array
          items: {}
        results:
          type: array
          items: {}
      required: [ok]
  securitySchemes:
    OAuth2:
      type: oauth2
      description: OAuth authorization for Awtsmoos Tunnel Control.
      flows:
        authorizationCode:
          authorizationUrl: https://awtsmoos.com/api/oauth/start
          tokenUrl: https://awtsmoos.com/api/oauth/token
          scopes:
            profile: Basic identity access.
            tunnel.read: Read filesystem, runtime, browser, and tunnel state.
            tunnel.write: Modify filesystem and apply patches.
            tunnel.command: Execute commands and runtime diagnostics.
            tunnel.browser: Browser automation access.
            tunnel.admin: Administrative tunnel operations.
