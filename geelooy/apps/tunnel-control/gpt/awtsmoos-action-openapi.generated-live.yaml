openapi: 3.1.0
info:
  title: Awtsmoos Tunnel Control GPT Actions Live Agent Surface
  version: 5.1.0-live
  description: >
    B"H. Generated from the connected agent routeAudit on 2026-05-18.
    GET-only transport. Plain UTF-8 query parameters are preferred.
    This file intentionally excludes actions that the connected agent rejected,
    including syntaxCheck and lineReplace. Base64 parameters are omitted from
    this generated surface to keep the GPT action focused on plain transport.
servers:
  - url: https://awtsmoos.com
paths:
  /api/tunnel/control/bootstrap:
    get:
      operationId: awtsmoosBootstrap
      summary: Get setup instructions.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyResponse"
  /api/tunnel/control/my-device:
    get:
      operationId: awtsmoosMyDevice
      summary: Discover active connected tunnel.
      security:
        - OAuth2: [profile, tunnel.read]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnyResponse"
        "401": { description: Unauthorized }
        "404": { description: No connected tunnel }
        "409": { description: Multiple connected tunnels }
  /api/tunnel/control/fs/{tunnelName}:
    get:
      operationId: awtsmoosTunnelAction
      summary: Unified tunnel action endpoint.
      description: >
        Filesystem, project cognition, guarded editing, runtime diagnostics,
        workflows, local command diagnostics, HTTP/cookie helpers, static servers,
        previews, and Chrome automation. Use small GET requests and split large work.
      security:
        - OAuth2: [profile, tunnel.read, tunnel.write, tunnel.command, tunnel.browser, tunnel.admin]
      parameters:
        - name: tunnelName
          in: path
          required: true
          schema: { type: string }
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - configGet
              - configSet
              - roots
              - rootBrowse
              - rootSelect
              - openRoot
              - stat
              - list
              - tree
              - read
              - readLines
              - readManyLines
              - readBytes
              - read64
              - md
              - bulk
              - grep
              - bulkSearch
              - bulkSearchPage
              - selectString
              - findFiles
              - fileHashes
              - symbolOutline
              - semanticSearch
              - astOutline
              - connectedFiles
              - jsonValidate
              - jsonFormat
              - packageInfo
              - projectOverview
              - dependencyGraph
              - recentFiles
              - largeFiles
              - duplicateBasenames
              - textStats
              - routeAudit
              - agentSelfTest
              - mkdirp
              - ensureFile
              - touch
              - copyFile
              - copyTree
              - moveFile
              - moveTree
              - deleteFile
              - deleteTree
              - emptyDir
              - httpRequest
              - httpJson
