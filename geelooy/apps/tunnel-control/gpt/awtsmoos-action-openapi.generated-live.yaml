              - staticServerLogs
              - isolatedJsTest
              - isolatedNodeCheck
              - isolatedHtmlTest
              - isolatedCleanup
              - workflowRun
              - workflowList
              - workflowGet
              - workflowValidate
              - simulateRuntime
              - runtimeWorkflow
              - merkavaWorkflowRun
              - aiWorkflowRun
              - aiCommandBatch
              - testRuntimeOnce
              - inspectRuntime
              - launchPreview
              - listPreviews
              - previewLogs
              - stopPreview
              - restartPreview
              - semanticDiff
              - detectConceptClusters
              - simulateFailure
              - generateRepairPlan
              - superviseRuntime
              - inferArchitecture
              - detectAbstractionLeaks
              - runtimeEntityGraph
              - semanticRefactor
              - inspectRenderStorms
              - runtimeContractRegistry
              - semanticSearchRuntime
              - previewBranchMatrix
              - inferBusinessRules
              - stateTimeMachine
              - detectDeadConcepts
              - semanticMerge
              - runtimeIntrospectionStream
              - architectureScore
              - intentDriftDetector
              - semanticPackageGenerator
              - selfHealPreview
              - generateTestUniverse
              - inspectHumanConfusion
              - orchestrationGraph
