                p: { type: string }
                path: { type: string }
                cwd: { type: string }
                root: { type: string }
                content: { type: string }
                content64: { type: string }
                find: { type: string }
                find64: { type: string }
                replace: { type: string }
                replace64: { type: string }
                query: { type: string }
                query64: { type: string }
                command: { type: string }
                command64: { type: string }
                text: { type: string }
                text64: { type: string }
                goal: { type: string }
                goal64: { type: string }
                params: { type: string }
                params64: { type: string }
                actions: { type: string }
                actions64: { type: string }
                actionsJson: { type: string }
                actionsJson64: { type: string }
                writes: { type: string }
                writes64: { type: string }
                files: { type: string }
