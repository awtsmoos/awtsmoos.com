        - { name: steps, in: query, schema: { type: string } }
        - { name: params, in: query, schema: { type: string } }
        - { name: probes, in: query, schema: { type: string } }
        - { name: interactions, in: query, schema: { type: string } }
        - { name: url, in: query, schema: { type: string } }
        - { name: urlPath, in: query, schema: { type: string } }
        - { name: method, in: query, schema: { type: string, default: GET } }
        - { name: headers, in: query, schema: { type: string } }
        - { name: body, in: query, schema: { type: string } }
        - { name: bodyEncoding, in: query, schema: { type: string, default: utf8 } }
        - { name: cookieJarName, in: query, schema: { type: string } }
        - { name: jar, in: query, schema: { type: string } }
        - { name: name, in: query, schema: { type: string } }
        - { name: value, in: query, schema: { type: string } }
        - { name: domain, in: query, schema: { type: string } }
        - { name: expires, in: query, schema: { type: string } }
        - { name: sameSite, in: query, schema: { type: string } }
        - { name: storageType, in: query, schema: { type: string } }
        - { name: localStorage, in: query, schema: { type: string } }
        - { name: sessionStorage, in: query, schema: { type: string } }
        - { name: cookies, in: query, schema: { type: string } }
        - { name: selector, in: query, schema: { type: string } }
        - { name: chromePath, in: query, schema: { type: string } }
        - { name: userDataDir, in: query, schema: { type: string } }
        - { name: host, in: query, schema: { type: string, default: 127.0.0.1 } }
        - { name: port, in: query, schema: { type: integer, default: 9222 } }
        - { name: index, in: query, schema: { type: string, default: index.html } }
