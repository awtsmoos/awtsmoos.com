                vars: { type: string }
                vars64: { type: string }
                url: { type: string }
                conversationUrl: { type: string }
                chatgptUrl: { type: string }
                sessionId: { type: string }
                chatgptSessionId: { type: string }
                conversationId: { type: string }
                selector: { type: string }
                targetVessel: { type: string }
                vessel: { type: string }
                fallback: { type: string }
                routeReference: { type: string }
                treeId: { type: string }
                outputId: { type: string }
                jobId: { type: string }
                taskId: { type: string }
                actionId: { type: string }
                processKey: { type: string }
                receiptId: { type: string }
                workerId: { type: string }
                stream: { type: string }
                controlRequestId: { type: string }
                originalControlRequestId: { type: string }
                clientRequestId: { type: string }
                requestedAction: { type: string }
                requestAction: { type: string }
                resumeToken: { type: string }
                continuationPrompt: { type: string }
                continuationPrompt64: { type: string }
                multipleChoiceAnswer: { type: string }
                choice: { type: string }
                answer: { type: string }
                missionId: { type: string }
                websiteMissionId: { type: string }
                parentWebsiteMissionId: { type: string }
                parentMissionId: { type: string }
                projectRoot: { type: string }
                logicalAgentId: { type: string }
                agentSessionId: { type: string }
                agentId: { type: string }
                parentAgentId: { type: string }
                agentName: { type: string }
                claimId: { type: string }
