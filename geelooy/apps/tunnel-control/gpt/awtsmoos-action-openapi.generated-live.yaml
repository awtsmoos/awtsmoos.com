    get:
      operationId: awtsmoosTunnelTransferGet
      summary: Stage, resume, verify, commit, or read large files through bounded GET fragments.
      description: Use this operation for large text/files before generic write, bulkWrite, or actionBatch would exceed a safe URI. Raw upload fragments must stay within the server GET fallback limit.
      security: [{ OAuth2: [profile, tunnel.read, tunnel.write] }]
      parameters:
        - { name: tunnelName, in: path, required: true, schema: { type: string } }
        - name: action
          in: query
          required: true
          schema: { type: string, enum: [sourceInfo, sourceProof, read, create, status, write, commit, cancel] }
        - { name: p, in: query, schema: { type: string } }
        - { name: path, in: query, schema: { type: string } }
        - { name: transfer_id, in: query, schema: { type: string } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: max_bytes, in: query, schema: { type: integer, minimum: 1 } }
        - { name: total_bytes, in: query, schema: { type: integer, minimum: 0 } }
        - { name: chunk_bytes, in: query, schema: { type: integer, minimum: 1 } }
        - { name: expected_sha256, in: query, schema: { type: string } }
        - { name: sha256, in: query, schema: { type: string } }
        - { name: overwrite, in: query, schema: { type: boolean, default: true } }
        - { name: content64, in: query, schema: { type: string } }
      responses:
        '200': { description: Transfer operation result. }
        '400': { description: Invalid transfer request or oversized fragment. }
        '401': { description: Authentication required. }
        '403': { description: Required tunnel scope missing. }
  /api/tunnel/control/preview/{tunnelName}:
    get:
      operationId: awtsmoosPreviewProxy
      summary: Fetch preview through tunnel.
      security: [{ OAuth2: [profile, tunnel.read] }]
      parameters:
        - { name: tunnelName, in: path, required: true, schema: { type: string } }
        - { name: url, in: query, schema: { type: string } }
        - { name: maxChars, in: query, schema: { type: integer, default: 500000 } }
      responses:
        "200": { description: Preview response body }
components:
  schemas:
    AnyResponse:
      type: object
      additionalProperties: true
      properties:
        ok: { type: boolean }
        error: { type: string }
        action: { type: string }
        responseFocus: { type: object, additionalProperties: true }
  securitySchemes:
    SimpleClientKey:
      type: apiKey
      in: header
      name: x-awtsmoos-simple-client-key
      description: Separate configured high-entropy client credential, never in URL.
    SimpleSignedUrl:
      type: apiKey
      in: query
      name: sig
      description: HMAC signature also binds purpose, agent ID, command hash or result ID, five-minute expiry and nonce.
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://awtsmoos.com/api/oauth/authorize
          tokenUrl: https://awtsmoos.com/api/oauth/token
          scopes:
            profile: "Basic identity access."
            tunnel.read: "Read tunnel state."
            tunnel.write: "Modify authorized files."
            tunnel.command: "Execute command diagnostics."
            tunnel.browser: "Control authorized browser sessions."
            tunnel.mission: "Coordinate delegated mission agents."
            tunnel.room: "Create and mutate shared mission rooms."
            tunnel.admin: "Perform administrative tunnel operations."
            awtsmoos.api: "Call Awtsmoos application APIs (social, heichelos, series, posts) through the tunnel gateway."
