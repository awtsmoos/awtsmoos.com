# B"H
# Boruch Hashem
# Blessed is He
openapi: 3.1.0
info:
  title: Awtsmoos Tunnel Control GPT Actions
  version: 8.1.0-compact-transfer
  description: "B'H. Read responseFocus before continuing. Answer multipleChoiceSelfInterrogation before unrelated actions. Use one public capability name in action and the exact internal tunnel operation in operation. Examples: action=files operation=read; action=command operation=commandRun; action=status operation=agentDoctor; action=recover operation=nativeGenerationReplace. Legacy direct operation names may remain compatible for older clients but are not public tools. Never place multi-megabyte text, binary files, writes64, actions64, or giant content64 values in the generic action URL. Use awtsmoosTunnelTransferGet to create a resumable transfer, send bounded content64 fragments with per-chunk SHA-256, inspect status when needed, then commit only after the final expected SHA-256 matches. For large transactional batches, stage each large file first and send only compact transfer references to the batch commit path. ChatGPT URL workflow: when given a ChatGPT conversation URL, use action=browser with operation=chatgptSeasonSaveAndContinue. It registers the URL, verifies navigation, waits for the visible conversation to be idle, prunes heavy DOM, sends through the visible UI, waits for completion, journals, and writes receipts. Website-agent workflow: use action=agent with operation=aiAgentSpawnWebsiteMission and parentWebsiteMissionId, parentAgentId, requestKey, role, scope, and childPrompt. Report progress with operation=websiteAgentMissionMessage and mark complete only with evidence."
servers:
  - url: https://awtsmoos.com
paths:
  /api/tunnel/control/bootstrap:
    get:
      operationId: awtsmoosBootstrap
      summary: Get setup instructions.
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AnyResponse" } } } }
  /api/tunnel/control/my-device:
    get:
      operationId: awtsmoosMyDevice
      summary: Discover active connected tunnel.
      security: [{ OAuth2: [profile, tunnel.read] }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AnyResponse" } } } }
  /api/tunnel/control/fs/awtsmoos-os:
    get:
      operationId: awtsmoosHostedSafeAction
      summary: Run a hosted Virtual OS read-only command or bounded public HTTP GET.
      description: Hosted commands run only against account-owned VFS (not native shell); HTTP GET pins public DNS and blocks internal targets and unsafe redirects.
      security: [{ OAuth2: [profile, tunnel.read] }, { OAuth2: [profile, tunnel.command] }]
      parameters:
        - { name: action, in: query, required: true, schema: { type: string, enum: [httpGet, commandRun] } }
        - { name: url, in: query, schema: { type: string, format: uri } }
        - { name: command, in: query, schema: { type: string, maxLength: 4096 } }
        - { name: cwd, in: query, schema: { type: string } }
        - { name: timeoutMs, in: query, schema: { type: integer, minimum: 100, maximum: 30000 } }
        - { name: maxBytes, in: query, schema: { type: integer, minimum: 1, maximum: 2000000 } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AnyResponse" } } } }
  /api/tunnel/control/simple/cmd:
    get:
      operationId: awtsmoosSimpleEnqueue
      summary: Enqueue a limited native command with a private client header or expiring signed URL.
      description: GET-only clients must use expires, nonce and HMAC sig; never embed long-lived keys in URLs. Agent ID is required and commands are policy-gated on the agent.
      security: [{ SimpleClientKey: [] }, { SimpleSignedUrl: [] }]
      parameters:
        - { name: agentId, in: query, required: true, schema: { type: string } }
        - { name: command, in: query, required: true, schema: { type: string, maxLength: 4096 } }
        - { name: expires, in: query, schema: { type: integer } }
        - { name: nonce, in: query, schema: { type: string } }
        - { name: sig, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AnyResponse" } } } }
  /api/tunnel/control/simple/result:
    get:
      operationId: awtsmoosSimpleResult
      summary: Poll and consume a simple command's authenticated output.
      security: [{ SimpleClientKey: [] }, { SimpleSignedUrl: [] }]
      parameters:
        - { name: id, in: query, required: true, schema: { type: string } }
        - { name: expires, in: query, schema: { type: integer } }
        - { name: nonce, in: query, schema: { type: string } }
        - { name: sig, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AnyResponse" } } } }
  /api/tunnel/control/simple/status:
    get:
      operationId: awtsmoosSimpleStatus
      summary: Read authenticated aggregate queue counters, not command content.
      security: [{ SimpleClientKey: [] }, { SimpleSignedUrl: [] }]
      responses:
        '200': { description: Authorized queue status or structured denial }
  /api/tunnel/control/fs/{tunnelName}:
    get:
      operationId: awtsmoosTunnelAction
      summary: Run one compact tunnel capability and exact internal operation.
      description: "B'H. Read responseFocus before continuing. Answer multipleChoiceSelfInterrogation before unrelated actions. Use one public capability name in action and the exact internal tunnel operation in operation. Examples: action=files operation=read; action=command operation=commandRun; action=status operation=agentDoctor; action=recover operation=nativeGenerationReplace. Legacy direct operation names may remain compatible for older clients but are not public tools. Never place multi-megabyte text, binary files, writes64, actions64, or giant content64 values in the generic action URL. Use awtsmoosTunnelTransferGet to create a resumable transfer, send bounded content64 fragments with per-chunk SHA-256, inspect status when needed, then commit only after the final expected SHA-256 matches. For large transactional batches, stage each large file first and send only compact transfer references to the batch commit path. ChatGPT URL workflow: when given a ChatGPT conversation URL, use action=browser with operation=chatgptSeasonSaveAndContinue. It registers the URL, verifies navigation, waits for the visible conversation to be idle, prunes heavy DOM, sends through the visible UI, waits for completion, journals, and writes receipts. Website-agent workflow: use action=agent with operation=aiAgentSpawnWebsiteMission and parentWebsiteMissionId, parentAgentId, requestKey, role, scope, and childPrompt. Report progress with operation=websiteAgentMissionMessage and mark complete only with evidence."
      security: [{ OAuth2: [profile, tunnel.read, tunnel.write, tunnel.command, tunnel.browser, tunnel.mission, tunnel.room, tunnel.admin] }]
      parameters:
        - { name: tunnelName, in: path, required: true, schema: { type: string } }
        - name: action
          in: query
          required: true
          schema:
            type: string
            enum:
              - agent
              - batch
              - browser
              - command
              - files
              - git
              - mission
              - preview
              - recover
              - runtime
              - status
              - system
              - test
              - web
        - { name: operation, in: query, required: true, schema: { type: string } }
        - { name: p, in: query, schema: { type: string } }
        - { name: path, in: query, schema: { type: string } }
        - { name: cwd, in: query, schema: { type: string } }
        - { name: root, in: query, schema: { type: string } }
        - { name: content, in: query, schema: { type: string } }
        - { name: content64, in: query, schema: { type: string } }
        - { name: find, in: query, schema: { type: string } }
        - { name: find64, in: query, schema: { type: string } }
        - { name: replace, in: query, schema: { type: string } }
        - { name: replace64, in: query, schema: { type: string } }
        - { name: query, in: query, schema: { type: string } }
        - { name: query64, in: query, schema: { type: string } }
        - { name: command, in: query, schema: { type: string } }
        - { name: command64, in: query, schema: { type: string } }
        - { name: text, in: query, schema: { type: string } }
        - { name: text64, in: query, schema: { type: string } }
        - { name: goal, in: query, schema: { type: string } }
        - { name: goal64, in: query, schema: { type: string } }
        - { name: params, in: query, schema: { type: string } }
        - { name: params64, in: query, schema: { type: string } }
        - { name: actions, in: query, schema: { type: string } }
        - { name: actions64, in: query, schema: { type: string } }
        - { name: actionsJson, in: query, schema: { type: string } }
        - { name: actionsJson64, in: query, schema: { type: string } }
        - { name: writes, in: query, schema: { type: string } }
        - { name: writes64, in: query, schema: { type: string } }
        - { name: files, in: query, schema: { type: string } }
        - { name: files64, in: query, schema: { type: string } }
        - { name: paths, in: query, schema: { type: string } }
        - { name: paths64, in: query, schema: { type: string } }
        - { name: tree, in: query, schema: { type: string } }
        - { name: tree64, in: query, schema: { type: string } }
        - { name: vars, in: query, schema: { type: string } }
        - { name: vars64, in: query, schema: { type: string } }
        - { name: url, in: query, schema: { type: string } }
        - { name: conversationUrl, in: query, schema: { type: string } }
        - { name: chatgptUrl, in: query, schema: { type: string } }
        - { name: sessionId, in: query, schema: { type: string } }
        - { name: chatgptSessionId, in: query, schema: { type: string } }
        - { name: conversationId, in: query, schema: { type: string } }
        - { name: selector, in: query, schema: { type: string } }
        - { name: targetVessel, in: query, schema: { type: string } }
        - { name: vessel, in: query, schema: { type: string } }
        - { name: fallback, in: query, schema: { type: string } }
        - { name: routeReference, in: query, schema: { type: string } }
        - { name: treeId, in: query, schema: { type: string } }
        - { name: outputId, in: query, schema: { type: string } }
        - { name: jobId, in: query, schema: { type: string } }
        - { name: taskId, in: query, schema: { type: string } }
        - { name: actionId, in: query, schema: { type: string } }
        - { name: processKey, in: query, schema: { type: string } }
        - { name: receiptId, in: query, schema: { type: string } }
        - { name: workerId, in: query, schema: { type: string } }
        - { name: stream, in: query, schema: { type: string } }
        - { name: controlRequestId, in: query, schema: { type: string } }
        - { name: originalControlRequestId, in: query, schema: { type: string } }
        - { name: clientRequestId, in: query, schema: { type: string } }
        - { name: requestedAction, in: query, schema: { type: string } }
        - { name: requestAction, in: query, schema: { type: string } }
        - { name: resumeToken, in: query, schema: { type: string } }
        - { name: continuationPrompt, in: query, schema: { type: string } }
        - { name: continuationPrompt64, in: query, schema: { type: string } }
        - { name: multipleChoiceAnswer, in: query, schema: { type: string } }
        - { name: choice, in: query, schema: { type: string } }
        - { name: answer, in: query, schema: { type: string } }
        - { name: missionId, in: query, schema: { type: string } }
        - { name: websiteMissionId, in: query, schema: { type: string } }
        - { name: parentWebsiteMissionId, in: query, schema: { type: string } }
        - { name: parentMissionId, in: query, schema: { type: string } }
        - { name: projectRoot, in: query, schema: { type: string } }
        - { name: logicalAgentId, in: query, schema: { type: string } }
        - { name: agentSessionId, in: query, schema: { type: string } }
        - { name: agentId, in: query, schema: { type: string } }
        - { name: parentAgentId, in: query, schema: { type: string } }
        - { name: agentName, in: query, schema: { type: string } }
        - { name: claimId, in: query, schema: { type: string } }
        - { name: delegationId, in: query, schema: { type: string } }
        - { name: requestKey, in: query, schema: { type: string } }
        - { name: spawnRequestKey, in: query, schema: { type: string } }
        - { name: provider, in: query, schema: { type: string } }
        - { name: providerId, in: query, schema: { type: string } }
        - { name: model, in: query, schema: { type: string } }
        - { name: apiKey, in: query, schema: { type: string } }
        - { name: apiKey64, in: query, schema: { type: string } }
        - { name: message, in: query, schema: { type: string } }
        - { name: message64, in: query, schema: { type: string } }
        - { name: prompt, in: query, schema: { type: string } }
