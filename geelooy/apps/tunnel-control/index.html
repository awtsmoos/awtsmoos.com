<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Awtsmoos Tunnel Control connects ChatGPT to a local project through a secure browser session and active tunnel agent.">
  <title>Awtsmoos Tunnel Control</title>
  <link rel="stylesheet" href="./css/app.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body class="awt-gated awt-preboot">
  <section class="awt-login-gate" aria-labelledby="awt-preboot-title">
    <div class="awt-login-card">
      <div class="awt-mini-kicker">B&quot;H Tunnel Control</div>
      <h1 id="awt-preboot-title">Awtsmoos Tunnel Control is opening</h1>
      <p>The panel is checking your secure browser session, then it will discover the connected local tunnel and reveal the project workspace.</p>
      <div class="awt-login-actions" aria-label="Tunnel Control actions">
        <a class="button-link primary awt-primary-link" href="/login">Login</a>
        <button class="button-link" type="button" data-awt-command="irm https://awtsmoos.com/api/tunnel/install/windows | iex">Windows install command</button>
        <button class="button-link" type="button" data-awt-command="curl -fsSL https://awtsmoos.com/api/tunnel/install/unix | bash">Mac / Linux install command</button>
      </div>
      <pre id="awt-install-command" class="awt-install-command" hidden aria-live="polite"></pre>
      <noscript><p>JavaScript is required for copy buttons. Mac / Linux: curl -fsSL https://awtsmoos.com/api/tunnel/install/unix | bash</p></noscript>
    </div>
  </section>
  <script>
    document.addEventListener("click", async event => {
      const button = event.target.closest("[data-awt-command]");
      if (!button) return;
      const command = button.getAttribute("data-awt-command") || "";
      const box = document.getElementById("awt-install-command");
      if (box) {
        box.hidden = false;
        box.textContent = command + "\n\nCopy and paste this line into your terminal.";
      }
      try { await navigator.clipboard?.writeText(command); } catch (_) {}
    });
  </script>
</body>
</html>
