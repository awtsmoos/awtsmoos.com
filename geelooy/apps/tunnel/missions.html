<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Awtsmoos Tunnel — Active Missions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <link rel="stylesheet" href="/geelooy/style/awtsmoos-tokens.css">
  <link rel="stylesheet" href="./css/tunnel.css">
  <style>
    .mission-card { margin-bottom: 1.25rem; }
    .mission-card h3 { margin: 0 0 .25rem; color: var(--text); }
    .mission-meta { color: var(--muted); font-size: .85rem; margin-bottom: .5rem; }
    .mission-desc { white-space: pre-wrap; line-height: 1.55; color: var(--text); }
    .mission-lists { display: grid; gap: .75rem; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); margin-top: .75rem; }
    .mission-lists h4 { margin: 0 0 .25rem; font-size: .9rem; color: var(--text); }
    .mission-lists ul { margin: 0; padding-left: 1.1rem; font-size: .9rem; color: var(--muted); }
    .mission-lists li { color: var(--muted); }
    .status-pill { display: inline-block; padding: .1rem .6rem; border-radius: 999px; border: 1px solid var(--accent); font-size: .8rem; color: var(--accent); background: transparent; }
    .tunnel-input { max-width: 220px; width: 100%; border: 1px solid var(--line); border-radius: 14px; padding: 9px 12px; background: rgba(0,0,0,0.28); color: var(--text); font: inherit; font-size: 13px; }
    .tunnel-input:hover { border-color: var(--accent); }
    .tunnel-input:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
    .tunnel-input:active { border-color: var(--accent2); }
    .tunnel-input:disabled { opacity: 0.5; cursor: not-allowed; }
    .progress-note { margin-top: .5rem; }
    .empty-note { color: var(--muted); }
    .empty-note code { color: var(--text); }
    @media (prefers-color-scheme: light) {
      .tunnel-input { background: rgba(255,255,255,0.7); color: #1d2733; }
      .status-pill { color: #1f6fb2; border-color: #1f6fb2; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">✦</span>
      <span class="brand-name"><strong>Awtsmoos</strong><small>Tunnel Missions</small></span>
    </div>
    <div class="topbar-right">
      <a class="button small" href="./index.html">Console</a>
    </div>
  </header>
  <main class="page">
    <section class="hero">
      <div class="hero-glow"></div>
      <p class="eyebrow">B"H • Awtsmoos Unified Tunnel</p>
      <h1>Active missions.</h1>
      <p class="lead">One glance: every mission the tunnel knows about, with the full story of what we're doing and why. Agents register here instead of scattering .ai-thoughts folders.</p>
      <div class="copy-row">
        <code id="tunnelLabel">tunnel: ?</code>
        <input class="tunnel-input" id="tunnelInput" placeholder="tunnel name" aria-label="Tunnel name">
        <button class="button small" id="loadBtn">Load</button>
      </div>
    </section>
    <section class="panel">
      <div class="panel-head"><div><p class="eyebrow">Registry</p><h2 id="countTitle">Loading…</h2></div>
      <button class="button small" id="refreshBtn">Refresh</button></div>
      <div id="missions"></div>
    </section>
  </main>
  <script type="module" src="./js/missions.js"></script>
</body>
</html>
