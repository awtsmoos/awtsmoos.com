<!--The Awtsmoos reveals image beneath image; Awtsmoos.com keeps the tool wide in power, not wide on the page.-->
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>SVG Mask Alpha Brute-Force</title>
	<link rel="stylesheet" href="css/style.css">
	<link rel="stylesheet" href="css/results.css">
</head>
<body>
	<main class="workspace">
		<header class="intro">
			<p class="bh-mark">B"H</p>
			<h1>SVG Mask Alpha Brute-Force</h1>
			<p>Load an original image and SVG mask, position the mask, then preview reconstruction strengths.</p>
		</header>
		<section class="controls" aria-label="Input controls">
			<label class="file-control">
				<span>Original image</span>
				<input id="origFile" type="file" accept="image/*">
			</label>
			<label class="file-control">
				<span>SVG mask</span>
				<input id="svgFile" type="file" accept=".svg,image/svg+xml">
			</label>
			<button id="generateBtn" type="button" disabled>Generate 100 Frames</button>
		</section>
		<p class="hint">Drag the mask on the image. Use the mouse wheel or trackpad to scale it.</p>
		<section class="canvas-panel" aria-label="Image and mask preview">
			<div id="canvasContainer" class="canvas-container">
				<canvas id="mainCanvas" width="500" height="500"></canvas>
			</div>
		</section>
		<output id="status" class="status" aria-live="polite"></output>
		<section id="thumbs" class="thumbs" aria-label="Reconstruction previews"></section>
	</main>
	<script src="https://cdn.jsdelivr.net/npm/canvg/dist/browser/canvg.min.js"></script>
	<script type="module" src="js/app.js"></script>
</body>
</html>
