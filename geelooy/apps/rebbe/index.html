<!--B"H-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWTSMOOS // OMEGA</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- BACKGROUND LAYERS -->
    <canvas id="viz-canvas"></canvas>
    <canvas id="fx-canvas"></canvas> <!-- NEW FX LAYER -->
    <div class="scanlines"></div>
    <div class="vignette"></div>
    <div class="noise"></div>

    <!-- UI ROOT -->
    <div id="app-root">
        
        <!-- HEADER -->
        <header>
            <div class="brand">
                <span class="brand-glitch" data-text="AWTSMOOS">AWTSMOOS</span>
                <span class="brand-sub">ARCHIVE // OMEGA</span>
            </div>
            <div class="sys-controls">
                <div id="sys-status" class="sys-stat">CORE: ONLINE</div>
                <button id="btn-search" class="btn-icon">🔍</button> <!-- SEARCH BTN -->
                <button id="btn-settings" class="btn-icon">⚙</button>
            </div>
        </header>

        <!-- MAIN INTERFACE -->
        <div id="main-grid">
            <!-- Col 1: Years -->
            <div id="col-years" class="panel open">
                <div class="p-head">
                    <span class="p-title">TIMELINE</span>
                    <div class="p-dec">///</div>
                </div>
                <div id="list-years" class="list-content custom-scroll"></div>
            </div>

            <!-- Col 2: Folders -->
            <div id="col-folders" class="panel">
                <div class="p-head">
                    <span class="p-title">EVENTS</span>
                    <button id="btn-close-folders" class="btn-close">×</button>
                </div>
                <div id="list-folders" class="list-content custom-scroll"></div>
            </div>

            <!-- Col 3: Tracks -->
            <div id="col-tracks" class="panel">
                <div class="p-head">
                    <span class="p-title">AUDIO DATA</span>
                    <button id="btn-close-tracks" class="btn-close">×</button>
                </div>
                <div id="list-tracks" class="list-content custom-scroll"></div>
            </div>
        </div>

        <!-- TERMINAL LOG -->
        <div id="terminal-wrap">
            <div id="terminal" class="custom-scroll">
                <div class="log-line">> SYSTEM BOOT SEQUENCE INITIATED...</div>
            </div>
        </div>

        <!-- AUDIO DECK -->
        <footer id="deck">
            <div class="scrubber-container" id="scrubber">
                <div class="scrubber-track"></div>
                <div class="scrubber-fill" id="fill"></div>
                <div class="scrubber-thumb"></div>
            </div>
            
            <div class="deck-main">
                <div class="controls">
                    <button id="btn-prev" class="btn-ctrl">⏮</button>
                    <button id="btn-play" class="btn-ctrl btn-play">▶</button>
                    <button id="btn-next" class="btn-ctrl">⏭</button>
                </div>

                <div class="track-info">
                    <div id="track-name" class="t-title">AWAITING INPUT</div>
                    <div id="track-time" class="t-meta">00:00:00</div>
                </div>
            </div>
        </footer>
    </div>

    <!-- OVERLAYS / MODALS -->
    <div id="overlay-layer" class="overlay-layer hidden">
        
        <!-- Search Modal -->
        <div id="modal-search" class="modal hidden">
            <div class="modal-head">MATRIX ACCESS // SEARCH</div>
            <div class="modal-body">
                <div class="search-grid">
                    <div class="search-field">
                        <label>HEBREW MONTH</label>
                        <select id="inp-month" class="cyber-input">
                            <option value="">ANY VECTOR</option>
                            <option value="1">TISHREI</option>
                            <option value="2">CHESHVAN</option>
                            <option value="3">KISLEV</option>
                            <option value="4">TEVES</option>
                            <option value="5">SHEVAT</option>
                            <option value="6">ADAR</option>
                            <option value="7">NISAN</option>
                            <option value="8">IYAR</option>
                            <option value="9">SIVAN</option>
                            <option value="10">TAMUZ</option>
                            <option value="11">AV</option>
                            <option value="12">ELUL</option>
                        </select>
                    </div>
                    <div class="search-field">
                        <label>DAY (1-30)</label>
                        <input type="number" id="inp-day" class="cyber-input" min="1" max="30" placeholder="ANY">
                    </div>
                </div>
                <button id="btn-exec-search" class="btn-action full-width">INITIATE SCAN</button>
                
                <div id="search-results" class="search-results custom-scroll">
                    <div class="search-placeholder">WAITING FOR COORDINATES...</div>
                </div>
            </div>
            <div class="modal-foot">
                <button id="btn-close-search" class="btn-danger">TERMINATE</button>
            </div>
        </div>

        <!-- Settings Modal -->
        <div id="modal-settings" class="modal hidden">
            <div class="modal-head">SYSTEM CONFIG</div>
            <div class="modal-body">
                <p>STORAGE MANAGEMENT</p>
                <div class="setting-row">
                    <span>INDEXED DB STORAGE</span>
                    <button id="btn-clear-db" class="btn-danger">PURGE CORE DATA</button>
                </div>
                <p class="warn-text">WARNING: PURGING WILL REMOVE ALL OFFLINE CONTENT.</p>
            </div>
            <div class="modal-foot">
                <button id="btn-close-settings" class="btn-action">CLOSE</button>
            </div>
        </div>
    </div>

    <!-- CONTEXT MENU (Dynamic) -->
    <div id="ctx-menu" class="ctx-menu hidden"></div>

    <!-- MODULES -->
    <script type="module" src="gl-engine.js"></script>
    <script type="module" src="fx.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
