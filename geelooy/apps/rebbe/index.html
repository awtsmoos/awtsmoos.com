<!-- B"H
Boruch Hashem
Blessed is He
-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>AWTSMOOS ARCHIVE // OMEGA</title>
    <link rel="stylesheet" href="styles/core.css?v=cd0f4ed886">
    <link rel="stylesheet" href="styles/main.css?v=519442db83">
    <link rel="stylesheet" href="styles/launch.css?v=7859fcf51d">
    <link rel="stylesheet" href="styles/ui.css?v=ea1b909baa">
    <link rel="stylesheet" href="styles/studio.css?v=3a0d2f271e">
    <link rel="stylesheet" href="styles/mobile-polish.css?v=efbc422a2a">
</head>
<body>
    <header>
        <div class="logo">AWTSMOOS <span>ARCHIVE</span></div>
        <div class="tools">
            <button class="tool-btn" id="btn-share" title="Share Link">
                <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="18" cy="5" r="2.5"/><circle cx="6" cy="12" r="2.5"/><circle cx="18" cy="19" r="2.5"/><path d="M8.2 10.8l7.6-4.3"/><path d="M8.2 13.2l7.6 4.3"/></g></svg>
            </button>
            <button class="tool-btn" id="btn-search" title="Search Archive">
                <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M15.8 15.8L20.5 20.5"/></g><circle cx="8.6" cy="8.6" r="1" fill="currentColor" opacity=".55"/></svg>
            </button>
            <button class="tool-btn" id="btn-term-toggle" title="Toggle Terminal">
                <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M7 9.5l3 3-3 3"/><path d="M12.5 15.5H17"/></g></svg>
            </button>
            <button class="tool-btn" id="btn-settings" title="System Settings">
                <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></g></svg>
            </button>
        </div>
    </header>

    <main>
        <div class="col open" id="col-years">
            <div class="col-head">TIMELINE</div>
            <div class="col-list" id="list-years"></div>
        </div>
        <div class="col" id="col-folders">
            <div class="col-head">
                <button class="btn-back mobile-only" id="back-folders">←</button>
                EVENTS
            </div>
            <div class="col-list" id="list-folders"></div>
        </div>
        <div class="col" id="col-tracks">
            <div class="col-head">
                <button class="btn-back mobile-only" id="back-tracks">←</button>
                <span id="header-tracks-title">AUDIO DATA</span>
            </div>
            <div class="col-list" id="list-tracks"></div>
        </div>
    </main>

    <footer id="player-bar">
        <button class="player-toggle" id="btn-player-toggle" type="button" title="Expand player" aria-label="Expand player" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14.5l6-6 6 6"/></g></svg>
        </button>
        <div class="controls">
            <div class="ctrl-btn" id="btn-prev">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="6" width="2.6" height="12" rx="1.3" fill="currentColor"/><path d="M19.5 6.8v10.4a.9.9 0 0 1-1.4.7L9 12.7a.9.9 0 0 1 0-1.5l9.1-5.2a.9.9 0 0 1 1.4.8z" fill="currentColor"/></svg>
            </div>
            <div class="ctrl-btn" id="btn-play">
                <svg viewBox="0 0 24 24" id="icon-play" aria-hidden="true"><path d="M8 5.4v13.2a.9.9 0 0 0 1.4.7l10-6.6a.9.9 0 0 0 0-1.5l-10-6.6a.9.9 0 0 0-1.4.8z" fill="currentColor"/></svg>
                <svg viewBox="0 0 24 24" id="icon-pause" class="hidden" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2" fill="currentColor"/></svg>
            </div>
            <div class="ctrl-btn" id="btn-next">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="16.4" y="6" width="2.6" height="12" rx="1.3" fill="currentColor"/><path d="M4.5 6.8v10.4a.9.9 0 0 0 1.4.7L15 12.7a.9.9 0 0 0 0-1.5L5.9 6a.9.9 0 0 0-1.4.8z" fill="currentColor"/></svg>
            </div>
            <div class="ctrl-btn" id="btn-slice" title="Open Studio">
                <svg viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6.5" r="2.3"/><circle cx="6" cy="17.5" r="2.3"/><path d="M8.2 7.8L20 19"/><path d="M8.2 16.2L20 5"/></g><circle cx="14" cy="12" r="1" fill="currentColor"/></svg>
            </div>
        </div>
        <div class="info">
            <div class="track-title" id="player-track-title">AWAITING INPUT</div>
            <div class="progress-container" id="player-seeker">
                <div class="progress-fill" id="player-fill"></div>
            </div>
            <div class="time-display">
                <span id="player-time">00:00 / 00:00</span>
                <span style="color:var(--c-cyan);">MP3 // VBR</span>
            </div>
        </div>
    </footer>

    <div id="terminal-wrap" class="hidden">
        <div class="term-head">SYSTEM LOG</div>
        <div id="terminal"></div>
    </div>

    <!-- INSANE LOADING OVERLAY -->
    <div id="loading-overlay" class="hidden">
        <div class="loader-core">
            <div class="ring r1"></div>
            <div class="ring r2"></div>
            <div class="ring r3"></div>
            <div class="core-text">LOADING</div>
            <div class="core-sub" id="loader-text">ACCESSING MAINFRAME...</div>
        </div>
    </div>

    <!-- OVERLAY & MODALS -->
    <div id="overlay-layer" class="hidden">
        
        <!-- SEARCH MODAL -->
        <div class="modal hidden" id="modal-search">
            <h2>SEARCH ARCHIVE</h2>
            <input type="text" id="inp-search" placeholder="ENTER KEYWORDS..." class="cyber-input">
            <div class="search-res" id="search-results"></div>
            <div style="text-align:right;">
                <button class="modal-btn modal-close">CANCEL</button>
            </div>
        </div>

        <!-- SETTINGS MODAL -->
        <div class="modal hidden" id="modal-settings">
            <h2>SYSTEM CONFIG</h2>
            <div style="padding:10px; border:1px solid #333;">
                <div style="margin-bottom:5px; font-weight:bold; color:#888;">DATABASE MANAGEMENT</div>
                <p style="font-size:12px; color:#666; margin-bottom:10px;">Purge local audio files and search indexes.</p>
                <button class="modal-btn danger" id="btn-action-clear" style="width:100%">PURGE ALL DATA</button>
            </div>
            <div style="text-align:right; margin-top:20px;">
                <button class="modal-btn modal-close">CLOSE</button>
            </div>
        </div>

        <!-- VIDEO GEN MODAL -->
        <div class="modal hidden" id="modal-video">
            <h2>VIDEO GEN</h2>
            <div class="modal-body" style="padding:0">
                <div style="display:flex; gap:10px; margin-bottom:15px;">
                    <div style="flex:1">
                        <label style="font-size:12px; color:#888;">START (s)</label>
                        <input type="number" id="vid-start" value="0" class="cyber-input">
                    </div>
                    <div style="flex:1">
                         <label style="font-size:12px; color:#888;">DURATION (s)</label>
                         <input type="number" id="vid-duration" value="15" class="cyber-input">
                    </div>
                </div>
                <div style="margin-bottom:20px;">
                    <label style="font-size:12px; color:#888;">RESOLUTION</label>
                    <select id="vid-res" class="cyber-input">
                        <option value="portrait">PORTRAIT (9:16)</option>
                        <option value="landscape">LANDSCAPE (16:9)</option>
                        <option value="square">SQUARE (1:1)</option>
                    </select>
                </div>
                
                <div id="vid-status-text" style="color:var(--c-cyan); font-weight:bold; margin-bottom:5px;">READY</div>
                <div style="width:100%; height:8px; background:#111; margin-bottom:20px; border:1px solid #333;">
                    <div id="vid-progress-fill" style="height:100%; width:0%; background:var(--c-magenta);"></div>
                </div>
                
                <div style="display:flex; flex-direction:column; gap:10px;">
                    <button class="modal-btn" id="btn-generate-analyze" style="background:var(--c-cyan); color:black;">OPEN STUDIO</button>
                    <button class="modal-btn" id="btn-download-audio">DL AUDIO SLICE</button>
                    <button class="modal-btn modal-close">CANCEL</button>
                </div>
            </div>
        </div>

        <!-- STUDIO MODAL -->
        <div class="modal hidden" id="modal-studio">
            <div class="studio-top">
                <div class="studio-props" id="studio-props">
                    <!-- JS Injects Here -->
                </div>
                <div class="studio-preview-wrapper" id="studio-preview-wrapper">
                    <canvas id="studio-preview-canvas"></canvas>
                    <div class="studio-stat" id="studio-status">READY</div>
                    <div class="studio-help-hint">DRAG TO PAN • SCROLL TO ZOOM</div>
                </div>
            </div>
            
            <!-- RESIZER -->
            <div id="studio-resizer" title="Drag to resize"></div>

            <div class="studio-bottom" id="studio-bottom">
                 <div class="studio-toolbar">
                     <button class="modal-btn mobile-only" id="btn-toggle-props" style="background:#222; border:1px solid #444; color:#ccc;">PROPS</button>
                     <div class="mobile-only" style="width:1px; height:20px; background:#333; margin:0 5px;"></div>
                     
                     <button class="modal-btn" id="st-play" style="min-width:60px;" aria-label="Play"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M8 5.4v13.2a.9.9 0 0 0 1.4.7l10-6.6a.9.9 0 0 0 0-1.5l-10-6.6a.9.9 0 0 0-1.4.8z" fill="currentColor"/></svg></button>
                     <button class="modal-btn" id="st-stop" aria-label="Stop"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg></button>
                     <button class="modal-btn" id="st-split" title="Split" aria-label="Split"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6.5" r="2.3"/><circle cx="6" cy="17.5" r="2.3"/><path d="M8.2 7.8L20 19"/><path d="M8.2 16.2L20 5"/></g><circle cx="14" cy="12" r="1" fill="currentColor"/></svg></button>
                     <button class="modal-btn danger" id="st-delete" title="Delete" aria-label="Delete"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></g></svg></button>
                     
                     <div style="width:1px; height:20px; background:#333; margin:0 5px;"></div>
                     
                     <div style="display:flex; flex-direction:column; justify-content:center; gap:2px;">
                         <input type="range" id="st-zoom" min="10" max="300" value="100" style="width:70px; height:4px;" title="Zoom">
                     </div>

                     <div style="width:1px; height:20px; background:#333; margin:0 5px;"></div>

                     <button class="modal-btn" id="st-detect-beats">BEATS</button>
                     <button class="modal-btn" id="st-gen-caps">CAPS</button>
                     <button class="modal-btn" id="st-gen-img">IMG</button>
                     <label class="modal-btn" style="cursor:pointer;" title="Import">
                         IMP <input type="file" id="st-upload" hidden>
                     </label>
                     <div style="flex:1"></div>
                     <button class="modal-btn danger" id="st-export">EXPORT</button>
                     <button class="modal-btn" id="btn-minimize" title="Minimize">_</button>
                     <button class="modal-btn modal-close" id="btn-close-studio">EXIT</button>
                 </div>
                 <div class="timeline-header">
                     <div class="track-head">TRACKS</div>
                     <div class="ruler-container" id="timeline-ruler"></div>
                 </div>
                 <div class="timeline-tracks" id="timeline-tracks">
                     <!-- Tracks Injected Here -->
                 </div>
            </div>
        </div>
    </div>
    
    <!-- MINIMIZED STUDIO FAB -->
    <div id="studio-fab" class="hidden">
        <span style="display:inline-flex; width:20px; height:20px; color:var(--c-cyan);"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M13 2.5L4.5 13.5H11l-1 8 8.5-11H12l1-8z" fill="currentColor"/></svg></span> STUDIO ACTIVE
    </div>
    
    <div id="ctx-menu" class="hidden" style="position:fixed; background:#000; border:1px solid var(--c-cyan); padding:10px; z-index:500; box-shadow:0 0 10px rgba(0,255,255,0.2);"></div>
    <canvas id="matrix-bg" style="position:fixed; top:0; left:0; width:100%; height:100%; z-index:-1; pointer-events:none; opacity:0.1;"></canvas>

    <script type="module" src="boot-entry.js?v=543a49bb77"></script>
</body>
</html>
