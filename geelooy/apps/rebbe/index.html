<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Awtsmoos Archive // EXTREME</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Background WebGL Canvas -->
    <canvas id="viz-canvas"></canvas>

    <!-- UI Overlay -->
    <div id="app-container">
      
      <!-- Top Bar -->
      <header class="cyber-header">
        <h1 class="glitch-text" data-text="AWTSMOOS ARCHIVE">AWTSMOOS ARCHIVE</h1>
        <div id="player-status">READY</div>
        <button id="layout-toggle" class="cyber-btn">☰ VIEW</button>
      </header>

      <!-- Main Layout -->
      <div id="main-layout">
        
        <!-- Column 1: Years -->
        <nav id="year-panel" class="panel expanded">
          <div class="panel-header">YEARS // SHANIM</div>
          <div id="year-list" class="scroll-content"></div>
        </nav>

        <!-- Column 2: Events/Folders -->
        <nav id="folder-panel" class="panel collapsed">
          <div class="panel-header">
            EVENTS // INYANIM
            <button class="close-panel">×</button>
          </div>
          <div id="folder-list" class="scroll-content"></div>
        </nav>

        <!-- Column 3: Tracks -->
        <main id="track-panel" class="panel collapsed">
          <div class="panel-header">
            TRACKS // NIGGUNIM
            <button class="close-panel">×</button>
            <button id="download-folder-btn" class="action-btn" style="display:none;">DOWNLOAD SET</button>
          </div>
          <div id="track-list" class="scroll-content"></div>
        </main>
      </div>

      <!-- Bottom Player Controls -->
      <footer id="player-controls" class="cyber-footer">
        <div class="track-info">
          <span id="current-track-name">NO TRACK SELECTED</span>
          <div class="time-display">
            <span id="current-time">00:00</span> / <span id="total-time">00:00</span>
          </div>
        </div>
        
        <div class="controls-row">
          <button id="btn-prev" class="ctrl-btn">⏮</button>
          <button id="btn-play" class="ctrl-btn play-btn">▶</button>
          <button id="btn-next" class="ctrl-btn">⏭</button>
        </div>

        <div class="progress-container">
          <div id="progress-bar">
            <div id="progress-fill"></div>
          </div>
        </div>
        
        <div class="volume-container">
          <span>VOL</span>
          <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
        </div>
      </footer>

    </div>

    <!-- Modules -->
    <script type="module" src="viz.js"></script>
    <script type="module" src="audio.js"></script>
    <script type="module" src="main.js"></script>
  </body>
</html>
