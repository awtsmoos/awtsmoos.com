<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="theme-color" content="#0b0c12">
	<title>Awtsmoos Slides</title>
	<link rel="icon" href="https://awtsmoos.com/api/social/drive/public/awtsfixmvplwhac/repo-image-archive/sha256/1afecf265fe345484e5efacc05e44f66ef7671969bfb8dbf07c53a0652a33ac4/asset">
	<link rel="stylesheet" href="./styles/tokens.css?v=942e8a2297">
	<link rel="stylesheet" href="./styles/shell.css?v=8ceb96f0a5">
	<link rel="stylesheet" href="./styles/stage.css?v=6d36c44f82">
	<link rel="stylesheet" href="./styles/selection.css?v=405a22e421">
	<link rel="stylesheet" href="./styles/snap.css?v=dd05d606da">
	<link rel="stylesheet" href="./styles/controls.css?v=562882f75f">
	<link rel="stylesheet" href="./styles/details.css?v=1b9254ccd6">
	<link rel="stylesheet" href="./styles/notes.css?v=772fe320b6">
	<link rel="stylesheet" href="./styles/player.css?v=114ceb258b">
	<link rel="stylesheet" href="./styles/mobileDock.css?v=d78ea068af">
	<link rel="stylesheet" href="./styles/mobileCommandBar.css?v=8c97e2c733">
	<link rel="stylesheet" href="./styles/commandSheet.css?v=83a582d02b">
	<link rel="stylesheet" href="./styles/commandSheetItems.css?v=47e6c0a6d5">
	<link rel="stylesheet" href="./styles/responsive.css?v=924972d2c3">
</head>
<body>
	<div class="slides-app" data-app>
		<header class="topbar">
			<div class="brand-lockup">
				<button class="icon-button" data-action="toggle-left" aria-label="Toggle slide rail" aria-expanded="false">☰</button>
				<span class="brand-mark">א</span>
				<input class="deck-title" data-deck-title aria-label="Presentation title" maxlength="160">
			</div>
			<div class="topbar-actions" aria-label="Presentation actions">
				<span class="live-pill" data-collab-status>Local</span>
				<button data-action="undo" title="Undo">↶</button>
				<button data-action="redo" title="Redo">↷</button>
				<button data-action="share">👥 Share</button>
				<button data-action="present" class="primary">▶ Present</button>
				<button class="icon-button" data-action="toggle-right" aria-label="Toggle inspector" aria-expanded="false">⌘</button>
			</div>
		</header>

		<div class="workspace">
			<aside class="slide-rail" data-left-panel aria-label="Slides">
				<div class="panel-heading">
					<strong>📚 Slides</strong>
					<button data-action="add-slide" class="small-button" aria-label="Add slide">＋</button>
				</div>
				<div class="thumbnail-list" data-thumbnails></div>
				<div class="panel-footer">
					<div class="file-actions" aria-label="Reorder active slide">
						<button data-action="move-slide-up" aria-label="Move slide up" title="Move slide up">↑</button>
						<button data-action="move-slide-down" aria-label="Move slide down" title="Move slide down">↓</button>
					</div>
					<button data-action="duplicate-slide">📑 Duplicate</button>
					<button data-action="delete-slide">🗑 Delete</button>
				</div>
			</aside>

			<main class="stage-area">
				<nav class="insert-bar" aria-label="Insert elements">
					<button data-insert="heading">🔠 Title</button>
					<button data-insert="text">✍️ Text</button>
					<button data-insert="rect">▭ Rectangle</button>
					<button data-insert="circle">◯ Circle</button>
					<button data-action="pick-image">🖼 Image</button>
				</nav>
				<div class="stage-viewport" data-stage-viewport>
					<section class="slide-stage" data-stage aria-label="Editable slide"></section>
				</div>
				<footer class="stage-footer">
					<span data-slide-status>Slide 1 of 1</span>
					<div class="file-actions">
						<button data-action="import">📥 Import</button>
						<button data-action="download-json">💾 Deck</button>
						<button data-action="download-html">🌐 HTML</button>
					</div>
				</footer>
				<details class="speaker-notes-panel">
					<summary>📝 Speaker notes</summary>
					<textarea data-speaker-notes maxlength="50000" aria-label="Speaker notes" placeholder="Add private notes for this slide…"></textarea>
				</details>
			</main>

			<aside class="inspector" data-right-panel aria-label="Inspector">
				<div class="panel-heading">
					<strong>🎨 Design</strong>
					<span data-selection-label>Slide</span>
				</div>
				<div class="inspector-body" data-inspector></div>
			</aside>
		</div>

		<input data-image-input type="file" accept="image/*" hidden>
		<input data-import-input type="file" accept=".awtslides,application/json" hidden>
		<div class="toast" data-toast role="status" aria-live="polite"></div>
		<div class="player-overlay" data-player hidden aria-hidden="true"></div>
	</div>
	<script type="module" src="./src/App.js?v=4bf4aa397f"></script>
</body>
</html>
