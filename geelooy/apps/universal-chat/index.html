<!-- The Awtsmoos is present before network, module, stylesheet, or socket can become a delay; Awtsmoos.com paints one useful doorway immediately and hydrates deeper communication afterward. -->
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="description" content="Private conversations, community discovery, voice notes, and public Torah learning in the Awtsmoos messaging workspace.">
	<meta name="theme-color" content="#07100c">
	<title>Messages & Torah Chat | Awtsmoos.com</title>
	<link rel="stylesheet" href="./critical.css?v=messaging-boot-003">
	<link rel="stylesheet" href="../styles/awp-polish.css?v=awp-001">
	<style>
		/* B"H — last-resort fallback if critical.css cannot load: never a blank page. */
		html,body{margin:0;min-height:100%;background:#020a06;color:#edf6f0;
			font-family:ui-sans-serif,system-ui,sans-serif;}
		body[data-messaging-page]{min-height:100dvh;}
		.messaging-loading-state{display:grid;place-items:center;gap:1rem;
			min-height:100dvh;padding:1.25rem;text-align:center;}
		.messaging-empty-state{max-width:470px;color:#a9baaf;}
		.messaging-empty-state h1{color:#fff7e5;font-family:Georgia,serif;}
		.messaging-empty-action{display:inline-block;margin:.25rem;padding:.65rem .9rem;
			border:1px solid #2c5b43;border-radius:999px;color:#e9f6ee;text-decoration:none;}
	</style>
</head>
<body data-messaging-page class="awp-app awp-app-chat">
	<div class="messaging-page-glow" aria-hidden="true"></div>
	<div id="messagingAppRoot">
		<main class="messaging-loading-state" aria-busy="true" aria-labelledby="messaging-fallback-title">
			<div class="messaging-loading-heading" role="status" aria-live="polite">
				<span class="messaging-loading-mark" aria-hidden="true"></span>
				<span>Opening Awtsmoos communications…</span>
			</div>
			<section class="messaging-empty-state awp-reveal">
				<div class="messaging-empty-mark" aria-hidden="true">א</div>
				<h1 id="messaging-fallback-title">Messages & Torah Chat</h1>
				<p>The doorway is ready. Live conversations and Torah sources are connecting now.</p>
				<nav aria-label="Messaging fallback navigation">
					<a class="messaging-empty-action awp-cta" href="/">Awtsmoos home</a>
					<a class="messaging-empty-action awp-cta" href="/social-hub/">Social Hub</a>
					<a class="messaging-empty-action awp-cta" href="/heichelos/">Explore Heichelos</a>
				</nav>
				<noscript><p>Live messaging requires JavaScript, but public Awtsmoos routes remain available above.</p></noscript>
			</section>
		</main>
	</div>
	<script defer src="./MessagingStyleBootstrap.js?v=messaging-boot-003"></script>
	<script type="module" src="./app.js?v=messaging-boot-003"></script>
	<script defer src="../../register.js?v=messaging-boot-002"></script>
</body>
</html>
