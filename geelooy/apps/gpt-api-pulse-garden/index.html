<!doctype html><html><head><meta charset="utf-8"><title>Awtsmoos Pulse Garden</title><style>body{font-family:system-ui;margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#3f2c66,#07111f 70%);color:white}.card{width:min(720px,90vw);padding:2rem;border:1px solid #8ff;border-radius:28px;background:#ffffff18;box-shadow:0 20px 80px #0009}button{font-size:1.1rem;padding:.85rem 1.25rem;border-radius:999px;border:0;margin:.25rem}#pulse{font-size:4rem;margin:.4rem 0}.spark{display:inline-block;animation:float 1.2s ease-out forwards}@keyframes float{to{transform:translateY(-32px);opacity:0}}</style></head><body><main class="card"><p>B'H</p><h1>Awtsmoos Pulse Garden</h1><p>A tiny Virtual OS app made by a freshly-created API account.</p><p id="pulse">0</p><button id="grow">Grow pulse</button><button id="reset">Reset</button><section id="garden"></section></main><script>let n=0;grow.onclick=()=>{pulse.textContent=++n;const s=document.createElement('span');s.className='spark';s.textContent=' ✨';garden.append(s);setTimeout(()=>s.remove(),1300)};reset.onclick=()=>{n=0;pulse.textContent=0;garden.textContent=''}</script></body></html>
