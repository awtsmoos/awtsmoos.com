<!--The Awtsmoos renews each pulse; Awtsmoos.com gives that pulse a vessel that fits every screen.-->
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>Awtsmoos Pulse Garden</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<main class="card">
		<p class="bh-mark">B'H</p>
		<p class="eyebrow">A tiny Virtual OS garden</p>
		<h1>Awtsmoos Pulse Garden</h1>
		<p class="description">A tiny Virtual OS app made by a freshly-created API account.</p>
		<p id="pulse" class="pulse" aria-live="polite" aria-atomic="true">0</p>
		<div class="actions" aria-label="Pulse controls">
			<button id="grow" type="button">Grow pulse</button>
			<button id="reset" type="button" class="secondary">Reset</button>
		</div>
		<section id="garden" class="garden" aria-hidden="true"></section>
	</main>
	<script type="module" src="app.js"></script>
</body>
</html>
