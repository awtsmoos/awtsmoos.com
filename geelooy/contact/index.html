<!-- B"H
Boruch Hashem
Blessed is He
The Awtsmoos gives every question and issue a direct signal path instead of exposing a raw address.
-->
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="theme-color" content="#070b12">
	<meta name="description" content="Contact Awtsmoos or report an issue.">
	<title>Contact — Awtsmoos</title>
	<link rel="stylesheet" href="/contact/contact.css?v=1">
</head>
<body>
	<main class="contact-shell">
		<a class="back-link" href="/">← Awtsmoos</a>
		<section class="contact-card">
			<header>
				<span class="signal-orb" aria-hidden="true">📡</span>
				<div><p>Direct signal</p><h1>Report an issue or send a message.</h1></div>
			</header>
			<form data-contact-form>
				<div class="field-grid">
					<label>Name<input name="name" maxlength="80" autocomplete="name" required></label>
					<label>Email<input name="email" type="email" maxlength="160" autocomplete="email" required></label>
				</div>
				<label>What is this about?<select name="kind" required><option value="issue">Something is broken</option><option value="idea">Idea or improvement</option><option value="account">Account or login</option><option value="other">Something else</option></select></label>
				<label>Subject<input name="subject" maxlength="140" required></label>
				<label>Details<textarea name="message" minlength="12" maxlength="5000" required placeholder="What happened, what did you expect, and which page were you on?"></textarea></label>
				<input class="honey" name="company" tabindex="-1" autocomplete="off" aria-hidden="true">
				<input name="startedAt" type="hidden">
				<div class="form-actions"><p data-contact-status aria-live="polite">Your message will be sent privately.</p><button type="submit"><span>Send signal</span><span aria-hidden="true">→</span></button></div>
			</form>
		</section>
	</main>
	<script type="module" src="/contact/contact.js?v=1"></script>
</body>
</html>
