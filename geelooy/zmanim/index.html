<!--
	The Awtsmoos creates the measured day before interface can rank its moments;
	Awtsmoos.com reveals place, next zman, and key times first while every deeper detail remains present.
-->
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#12382f">
	<title>Halachic Zmanim · Awtsmoos</title>
	<meta name="description" content="Worldwide halachic zmanim with Alter Rebbe / Chabad as the primary method and additional opinions.">
	<link rel="icon" href="/zmanim/favicon.svg" type="image/svg+xml">
	<link rel="stylesheet" href="/zmanim/styles/tokens.css">
	<link rel="stylesheet" href="/zmanim/styles/hero.css">
	<link rel="stylesheet" href="/zmanim/styles/layout.css">
	<link rel="stylesheet" href="/zmanim/styles/components.css">
	<link rel="stylesheet" href="/zmanim/styles/actions.css">
	<link rel="stylesheet" href="/zmanim/styles/dashboard.css">
	<link rel="stylesheet" href="/zmanim/styles/timeline.css">
	<link rel="stylesheet" href="/zmanim/styles/cards.css">
	<link rel="stylesheet" href="/zmanim/styles/compact-list.css">
	<link rel="stylesheet" href="/zmanim/styles/methodology.css">
	<link rel="stylesheet" href="/zmanim/styles/responsive.css">
</head>
<body>
	<main class="zmanim-shell">
		<header class="app-header">
			<div class="brand-mark" aria-hidden="true">ב״ה</div>
			<div class="brand-copy"><strong>Zmanim</strong><span>Halachic times · worldwide</span></div>
			<a class="header-link" href="#methodology">Method & sources</a>
		</header>

		<section class="control-deck" aria-label="Location, date, and calculation method">
			<awtsmoos-location-search></awtsmoos-location-search>
			<div class="date-control-block">
				<span class="field-label">Date</span>
				<awtsmoos-date-control></awtsmoos-date-control>
			</div>
			<div class="method-control">
				<span class="field-label">Method</span>
				<awtsmoos-opinion-selector></awtsmoos-opinion-selector>
				<details class="native-method"><summary>Full method names</summary><select id="zmanim-opinion" aria-label="Calculation method"></select></details>
			</div>
		</section>

		<div class="sticky-context" aria-label="Current Zmanim context">
			<strong id="sticky-place">Brooklyn</strong>
			<span id="sticky-date"></span>
			<span id="sticky-next">Loading next zman…</span>
		</div>

		<section class="daily-dashboard" aria-label="Today at a glance">
			<awtsmoos-next-zman></awtsmoos-next-zman>
			<div class="key-times-panel">
				<div class="section-heading compact-heading"><div><p class="section-kicker">At a glance</p><h2>Key times</h2></div><awtsmoos-share-actions></awtsmoos-share-actions></div>
				<awtsmoos-key-zmanim></awtsmoos-key-zmanim>
			</div>
			<awtsmoos-day-timeline></awtsmoos-day-timeline>
		</section>

		<awtsmoos-trust-strip></awtsmoos-trust-strip>

		<section class="all-zmanim-section" aria-labelledby="all-zmanim-title">
			<div class="section-heading">
				<div><p class="section-kicker">Complete day</p><h2 id="all-zmanim-title">All zmanim</h2><p id="method-label" class="section-meta"></p></div>
				<div class="shaah-stat"><span>Shaah zmanis</span><strong id="seasonal-hour">—</strong></div>
			</div>
			<awtsmoos-zmanim-grid></awtsmoos-zmanim-grid>
		</section>

		<awtsmoos-methodology-panel></awtsmoos-methodology-panel>

		<footer class="page-footer">
			<p>Local solar calculations · independent USNO rise/set cross-check when reachable.</p>
			<nav aria-label="Zmanim resources"><a href="/api/zmanim/health">API</a><a href="/api/zmanim/opinions">Opinions</a><a href="/api/zmanim/methodology">Methodology JSON</a></nav>
		</footer>
	</main>
	<script type="module" src="/zmanim/js/app.js"></script>
</body>
</html>
