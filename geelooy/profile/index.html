<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<title>Profile — Awtsmoos</title>
	<link rel="stylesheet" href="/style/geelooy-app/index.css?v=profile-static-001">
	<link rel="stylesheet" href="/css/awp-polish.css?v=awp-001">
	<link rel="stylesheet" href="/style/civilization/core-tokens.css?v=profile-static-001">
	<link rel="stylesheet" href="/style/civilization/core-base.css?v=profile-static-001">
	<link rel="stylesheet" href="/style/civilization/core-components.css?v=profile-static-001">
	<link rel="stylesheet" href="/style/civilization/profile-identity.css?v=profile-static-001">
	<link rel="stylesheet" href="/style/civilization/profile-content.css?v=profile-static-001">
</head>
<body data-geelooy-route="profile">
	<main class="geelooy-profile-shell geelooy-content-region" data-profile>
		<section class="profile-hero-card awp-panel awp-entrance" aria-labelledby="profile-title">
			<div class="profile-identity-row"><div class="profile-avatar-orb geelooy-avatar awp-avatar-ring" aria-hidden="true">א</div>
				<div class="profile-identity-copy"><p class="profile-kicker g-kicker awp-eyebrow">Personal chamber</p><h1 id="profile-title" class="awp-title-glow">Your profile</h1><p class="g-muted">Aliases, Heichelos, identity and recent account activity.</p></div>
				<a class="profile-primary-action awp-btn" href="./alias-manage/">Create alias</a>
			</div>
			<section class="profile-inline-actions" aria-label="Profile actions">
				<button type="button" class="awp-btn-ghost" data-profile-action="alias">Alias <small>Create or switch</small></button>
				<button type="button" class="awp-btn-ghost" data-profile-action="notifications">Signals <small>Preview activity</small></button>
				<button type="button" class="awp-btn-ghost" data-profile-action="heichel">Heichel <small>Create a space</small></button>
			</section>
			<div class="profile-stat-grid" aria-label="Profile stats"><article><strong data-profile-stat="aliases">—</strong><span>Aliases</span></article><article><strong data-profile-stat="heichelos">—</strong><span>Heichelos</span></article><article><strong data-profile-stat="defaultAlias">—</strong><span>Default</span></article></div>
			<p class="profile-status" data-profile-status="loading" aria-live="polite">Loading profile…</p>
		</section>
		<section class="profile-command-panel awp-panel" aria-label="Profile sections">
			<nav class="profile-tabs" role="tablist"><button id="profile-tab-aliases" class="active" type="button" role="tab" aria-selected="true" data-profile-tab="aliases">Aliases</button><button id="profile-tab-heichelos" type="button" role="tab" aria-selected="false" data-profile-tab="heichelos">Heichelos</button><button id="profile-tab-about" type="button" role="tab" aria-selected="false" data-profile-tab="about">About</button></nav>
			<div class="profile-panel-body">
				<section id="profile-panel-aliases" class="profile-tab-panel" role="tabpanel" data-profile-panel="aliases"><div class="panel-title-row"><h2>Aliases</h2><a class="g-button" href="./alias-manage/">Add alias</a></div><div class="alias-list social-card-list"><div class="g-state">Loading aliases…</div></div></section>
				<section id="profile-panel-heichelos" class="profile-tab-panel hidden" role="tabpanel" data-profile-panel="heichelos" hidden><div class="panel-title-row"><h2>Heichelos</h2><a class="g-button" href="/heichelos/manage-alias-heichelos/">Manage</a></div><div class="heichel-list social-card-list"></div></section>
				<section id="profile-panel-about" class="profile-tab-panel hidden" role="tabpanel" data-profile-panel="about" hidden><div class="g-grid"><article class="g-card"><h3>Identity</h3><p>Your public aliases and communities live here.</p></article></div></section>
			</div>
		</section>
		<section class="profile-action-drawer" data-profile-action-drawer hidden aria-live="polite"></section>
	</main>
	<script>
	/* B"H - profile boot watchdog (plain script, runs even if the module graph below fails).
	 * The module sets window.__profileBootState to 'booting', then 'ready' or 'failed'.
	 * If it is still 'pending' after 20s, the module never executed (import failure,
	 * syntax error, blocked script): replace the stuck "Loading..." with a visible
	 * error and a reload button so the page is never dead-silent. */
	(function () {
		window.__profileBootState = window.__profileBootState || 'pending';
		setTimeout(function () {
			try {
				if (window.__profileBootState !== 'pending') return;
				window.__profileBootState = 'failed';
				var status = document.querySelector('[data-profile-status]');
				if (status) {
					status.textContent = 'Profile failed to load. Check your connection and reload the page.';
					status.setAttribute('data-profile-status', 'error');
					if (!document.getElementById('profile-retry-boot')) {
						var btn = document.createElement('button');
						btn.id = 'profile-retry-boot';
						btn.type = 'button';
						btn.className = 'awp-btn';
						btn.textContent = 'Reload profile';
						btn.addEventListener('click', function () { location.reload(); });
						status.parentNode.insertBefore(btn, status.nextSibling);
					}
				}
				var aliasState = document.querySelector('.alias-list .g-state');
				if (aliasState && /loading/i.test(aliasState.textContent || '')) {
					aliasState.textContent = 'Aliases could not load. Reload the page to try again.';
				}
			} catch (e) { /* the watchdog itself must never throw */ }
		}, 20000);
	})();
	</script>
	<script type="module" src="./script.js?v=profile-static-001"></script>
	<script type="module" src="/scripts/awtsmoos/social/shell/boot.js?v=shared-shell-003"></script>
</body>
</html>
