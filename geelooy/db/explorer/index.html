<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AWTSMOOS DB INTERFACE - HYPERDRIVE EDITION</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&family=Turret+Road:wght@300;500;800&display=swap" rel="stylesheet">
</head>
<body>
    
    <div id="main-container">
        <h4>B"H</h4><br>
        <header id="header">
            
            <div id="logo">AWTDB<span class="glitch" data-text="X">X</span></div>
            <div id="breadcrumb-container">
                <!-- Breadcrumbs will be populated here -->
            </div>
            <div id="auth-status">
                <span id="auth-indicator"></span>
                <button id="check-auth-btn">Auth Check</button>
            </div>
        </header>

        <div id="content-area">
            <div id="directory-view" class="view-panel active-panel">
                <!-- Directory items will be populated here -->
            </div>

            <div id="json-viewer-container" class="view-panel">
                <div id="json-controls">
                    <button id="edit-json-btn" class="action-btn" disabled>Edit</button>
                    <button id="save-json-btn" class="action-btn" style="display:none;">Save Update</button>
                    <button id="create-json-btn" class="action-btn" style="display:none;">Save New</button>
                    <button id="cancel-edit-btn" class="action-btn" style="display:none;">Cancel</button>
                    <button id="delete-entry-btn" class="action-btn" disabled>Delete Entry</button>
                </div>
                <div id="json-data-display">
                    <!-- JSON data will be rendered here -->
                </div>
                <textarea id="json-edit-area" style="display:none;"></textarea>
            </div>
        </div>
        
        <div id="action-bar">
             <input type="text" id="new-entry-name" placeholder="New entry name (e.g., data.awtsmoosJSON)">
             <button id="initiate-create-btn" class="action-btn" disabled>Create New Entry</button>
        </div>

        <footer id="status-bar">
            <span id="current-path-display">Path: /</span>
            <span id="message-area">Welcome to the Hyperdrive Interface!</span>
        </footer>
    </div>

    <div id="loading-overlay">
        <div class="loader"></div>
        <p>ACCESSING MATRIX...</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
