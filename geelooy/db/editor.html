<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>⚡ Awtsmoos API Editor ⚡</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html, body {
            margin: 0;
            padding: 0;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            background-color: #0a0c14; /* Match editor's background */
        }
        #editor-iframe, #editor-holder{
            width: 100%;
            height: 100%;
            border: none;
        }
        #status-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(10, 12, 20, 0.9);
            color: #d1d9ff;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            font-size: 1.5em;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div id="status-overlay">Authenticating with API...</div>

    <!--
      This iframe loads your original, unmodified editor.
      The "?env=postmessage" query parameter is critical. It tells the
      editor's code to activate its "OS Folder" communication mode.
    -->
    <div id="editor-holder"></div>
  
    <!--
      This script is the bridge. It handles authorization and translates
      messages between the iframe and your backend API.
    -->
    <script type="module" src="api-bridge.js"></script>

</body>
</html>
