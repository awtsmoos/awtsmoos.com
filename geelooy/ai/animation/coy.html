            ctx.fillText(line, lineX, m.screenY + m.paddingScreen + i * (m.cfg.fontSizeScreen * m.cfg.lineHeightFactor));
        });
    }

    _wrapTextScreen(text, maxWidthScreen) {
        const words = text.split(' '); let lines = [];
        if (!words.length || words[0] === "") return [""]; // Return empty line if no text
        let currentLine = words[0];
        for (let i = 1; i < words.length; i++) {
            const word = words[i];
            const testLine = currentLine + " " + word;
            if (this.ctx.measureText(testLine).width < maxWidthScreen || currentLine === "") {
                currentLine = testLine;
            } else { lines.push(currentLine); currentLine = word; }
        }
        lines.push(currentLine); return lines;
    }

    _worldToScreen(worldX, worldY) {
        const screenX = (worldX - this.cameraState.x) * this.cameraState.zoom + this.canvas.width / 2;
        const screenY = (worldY - this.cameraState.y) * this.cameraState.zoom + this.canvas.height / 2;
        return [screenX, screenY];
    }

    _drawObjectInstance(objInstance) {
        if (!objInstance || !objInstance.blueprint) return;
        const ctx = this.ctx;
        ctx.save();
        ctx.translate(objInstance.x, objInstance.y);
        ctx.rotate(objInstance.rotation * Math.PI / 180);
        const scaleX = objInstance.scale?.x ?? 1;
        const scaleY = objInstance.scale?.y ?? 1;
        ctx.scale(scaleX, scaleY);

        objInstance.blueprint.components.forEach((comp, index) => {
            if (!comp) return;
            const effectiveComp = {...comp}; // Start with blueprint component
            // Apply instance-level overrides
            if (objInstance.fillColor !== undefined) effectiveComp.fillColor = objInstance.fillColor;
            if (objInstance.strokeColor !== undefined) effectiveComp.strokeColor = objInstance.strokeColor;
            if (objInstance.lineWidth !== undefined) effectiveComp.lineWidth = objInstance.lineWidth;
            // Instance texture can override blueprint texture
            if (objInstance.texture !== undefined) effectiveComp.texture = objInstance.texture;


            this._drawComponent(effectiveComp); 
            if (index === 0 && objInstance.isTargetedByLook) { // Highlight based on original component definition
                this._drawObjectHighlight(comp); // Highlight original component shape/size
            }
        });
        ctx.restore();
    }
    _drawObjectHighlight(comp) { // comp is the original blueprint component
        const ctx = this.ctx;
        ctx.save();
        // Apply component's own transform if it has one (relative to object instance origin)
        if (comp.x !== undefined && comp.y !== undefined) ctx.translate(comp.x, comp.y);
        if (comp.rotation) ctx.rotate(comp.rotation * Math.PI / 180);
        const compScaleX = comp.scale?.x ?? (typeof comp.scale === 'number' ? comp.scale : 1);
        const compScaleY = comp.scale?.y ?? (typeof comp.scale === 'number' ? comp.scale : 1);
        ctx.scale(compScaleX, compScaleY);


        const highlightColor = "rgba(255, 255, 100, 0.5)"; // Brighter yellow highlight
        const highlightLineWidth = Math.max(2, (comp.lineWidth || 1) + 5 / this.cameraState.zoom); // Make highlight thicker & scale-invariant
        ctx.strokeStyle = highlightColor;
        ctx.lineWidth = highlightLineWidth;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        // Draw highlight slightly larger than the component
        const outset = highlightLineWidth / 2; 

        switch (comp.shape) {
            case 'rect':
                ctx.strokeRect(-comp.width / 2 - outset, -comp.height / 2 - outset, comp.width + 2*outset, comp.height + 2*outset);
                break;
            case 'circle':
                ctx.beginPath();
                ctx.arc(0, 0, comp.radius + outset, 0, Math.PI * 2);
                ctx.stroke();
                break;
            case 'path': // Path highlighting is complex, use AABB for now
                if (comp.pathData && comp.pathData.length > 0) {
                    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                    comp.pathData.forEach(p => { 
                        if (p.x !== undefined) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); }
                        if (p.y !== undefined) { minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); }
                        // Consider control points for curves for more accurate AABB if needed
                    });
                    if (isFinite(minX) && isFinite(minY) && isFinite(maxX) && isFinite(maxY)) {
                        ctx.strokeRect(minX - outset, minY - outset, (maxX - minX) + 2*outset, (maxY - minY) + 2*outset);
                    }
                }
                break;
        }
        ctx.restore();
    }

    _drawComponent(comp) { // comp here is the effective component with overrides
        const ctx = this.ctx;
        ctx.save();
        if (comp.x !== undefined && comp.y !== undefined) ctx.translate(comp.x, comp.y);
        if (comp.rotation) ctx.rotate(comp.rotation * Math.PI / 180);
        const compScaleX = comp.scale?.x ?? (typeof comp.scale === 'number' ? comp.scale : 1);
        const compScaleY = comp.scale?.y ?? (typeof comp.scale === 'number' ? comp.scale : 1);
        ctx.scale(compScaleX, compScaleY);

        ctx.fillStyle = comp.fillColor || 'gray'; 
        ctx.strokeStyle = comp.strokeColor || 'black';
        ctx.lineWidth = comp.lineWidth || 1;

        let localBounds; // For texture drawing
        switch (comp.shape) {
            case 'rect':
                const rectX = -comp.width / 2; const rectY = -comp.height / 2;
                localBounds = {x: rectX, y: rectY, width: comp.width, height: comp.height};
                if (comp.texture && comp.texture.type !== 'none') this._drawProceduralTexture(comp.texture, localBounds);
                else if (comp.fillColor && comp.fillColor !== 'none') ctx.fillRect(rectX, rectY, comp.width, comp.height);
                
                if (comp.strokeColor && comp.strokeColor !== 'none' && comp.lineWidth > 0) ctx.strokeRect(rectX, rectY, comp.width, comp.height);
                break;
            case 'circle':
                localBounds = {x: -comp.radius, y: -comp.radius, width: comp.radius*2, height: comp.radius*2};
                ctx.beginPath(); ctx.arc(0, 0, comp.radius, 0, Math.PI * 2);
                if (comp.texture && comp.texture.type !== 'none') { ctx.save(); ctx.clip(); this._drawProceduralTexture(comp.texture, localBounds); ctx.restore(); }
                else if (comp.fillColor && comp.fillColor !== 'none') ctx.fill();
                
                if (comp.strokeColor && comp.strokeColor !== 'none' && comp.lineWidth > 0) ctx.stroke();
                break;
            case 'path':
                if (comp.pathData && comp.pathData.length > 0) {
                    ctx.beginPath();
                    comp.pathData.forEach(p => {
                        switch(p.cmd.toUpperCase()) {
                            case 'M': ctx.moveTo(p.x, p.y); break;
                            case 'L': ctx.lineTo(p.x, p.y); break;
                            case 'Q': ctx.quadraticCurveTo(p.x1, p.y1, p.x, p.y); break;
                            case 'C': ctx.bezierCurveTo(p.x1, p.y1, p.x2, p.y2, p.x, p.y); break;
                            case 'A': ctx.arcTo(p.x1, p.y1, p.x2, p.y2, p.radius); break;
                            case 'Z': ctx.closePath(); break;
                        }
                    });
                    if (comp.fillColor && comp.fillColor !== 'none') ctx.fill();
                    if (comp.strokeColor && comp.strokeColor !== 'none' && comp.lineWidth > 0) ctx.stroke();
                }
                break;
        }
        ctx.restore();
    }

    _drawProceduralTexture(textureConfig, bounds) {
        const ctx = this.ctx;
        if (!bounds || !textureConfig || textureConfig.type === 'none') return; 

        ctx.save();
        // Clip to the component's bounds before drawing texture
        // This is important if the component shape is not a rect (e.g. circle)
        // The caller (_drawComponent for circle) should set up clipping.
        // For rects, fillRect will respect current transform.

        const baseColor = textureConfig.baseColor || '#CCCCCC';
        const patternColor = textureConfig.patternColor || '#AAAAAA';
        
        // Fill with base color first
        ctx.fillStyle = baseColor;
        ctx.fillRect(bounds.x, bounds.y, bounds.width, bounds.height); 

        ctx.fillStyle = patternColor;
        ctx.strokeStyle = patternColor; 

        const density = Math.max(1, textureConfig.density || 10); // Ensure density is at least 1

        switch (textureConfig.type) {
            case 'stripes':
                const stripeWidth = Math.max(1, bounds.width / (density * 2)); 
                for (let i = 0; i < density * 2; i += 2) {
                    ctx.fillRect(bounds.x + i * stripeWidth, bounds.y, stripeWidth, bounds.height);
                }
                break;
            case 'dots':
                const dotRadius = Math.max(1, Math.min(bounds.width, bounds.height) / (density * 3));
                const spacingX = bounds.width / density;
                const spacingY = bounds.height / density;
                for (let i = 0; i < density; i++) {
                    for (let j = 0; j < density; j++) {
                        ctx.beginPath();
                        ctx.arc(bounds.x + spacingX * (i + 0.5), bounds.y + spacingY * (j + 0.5), dotRadius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                break;
            case 'checkered':
                const cellWidth = bounds.width / density;
                const cellHeight = bounds.height / density;
                for (let i = 0; i < density; i++) {
                    for (let j = 0; j < density; j++) {
                        if ((i + j) % 2 === 0) { 
                            ctx.fillRect(bounds.x + i * cellWidth, bounds.y + j * cellHeight, cellWidth, cellHeight);
                        }
                    }
                }
                break;
        }
        ctx.restore(); 
    }

    exportAnimation() {
        if (!this.animationData) {
            this.ui.statusDiv.textContent = "No animation data to export.";
            return;
        }
        const htmlContent = document.documentElement.outerHTML;
        
        // Ensure main script is fully included
        let finalHtml = htmlContent.replace(/<script id="mainAnimationScript">[\s\S]*?<\/script>/, 
                                            `<script id="mainAnimationScript">${document.getElementById('mainAnimationScript').textContent.replace(/<\/script>/g, '<\\/script>')}<\/script>`);
        
        const animationDataString = JSON.stringify(this.animationData, null, 2).replace(/<\/script>/g, '<\\/script>');
        const existingDataJson = /<script id="animationDataJson" type="application\/json">[\s\S]*?<\/script>/;

        if (finalHtml.match(existingDataJson)) {
            finalHtml = finalHtml.replace(existingDataJson, 
                `<script id="animationDataJson" type="application/json">${animationDataString}<\/script>`);
        } else {
            finalHtml = finalHtml.replace('</body>', 
                `<script id="animationDataJson" type="application/json">${animationDataString}<\/script>\n</body>`);
        }
        
        const minimalStyleOverride = `
        body.exported-body { justify-content: center; align-items: center; min-height: 100vh; padding-top: 20px; }
        h1.exported-h1 { margin-bottom: 10px; font-size: 1.6em; }
        #inputContainer { display: none !important; } 
        #exportBtn { display: none !important; } 
        #playbackControlsContainer { /* Optionally hide all controls or just export button */ }
        `;
        if (finalHtml.includes('/* Exported player minimal style overrides */')) { 
             finalHtml = finalHtml.replace('/* Exported player minimal style overrides */', 
                `/* Exported player minimal style overrides */\n${minimalStyleOverride}`);
        } else if (finalHtml.includes('</style>')) { 
            finalHtml = finalHtml.replace('</style>', `${minimalStyleOverride}\n</style>`);
        }


        const blob = new Blob([finalHtml], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'animation_export_revamp_v2.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
        this.ui.statusDiv.textContent = "Animation exported as HTML file.";
    }
} // End of Animator Class

document.addEventListener('DOMContentLoaded', () => {
    const uiElements = {
        jsonInput: document.getElementById('jsonInput'), jsonFileUpload: document.getElementById('jsonFileUpload'),
        loadJsonBtn: document.getElementById('loadJsonBtn'), statusDiv: document.getElementById('status'),
        animationCanvas: document.getElementById('animationCanvas'),
        playbackControlsContainer: document.getElementById('playbackControlsContainer'),
        playStopBtn: document.getElementById('playStopBtn'), restartBtn: document.getElementById('restartBtn'),
        exportBtn: document.getElementById('exportBtn'),
        inputContainer: document.getElementById('inputContainer')
    };
    window.animatorInstance = new Animator(uiElements.animationCanvas, uiElements);
});
</script>
