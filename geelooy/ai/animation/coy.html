                        return false; // Remove action
                     }
                }
                return true; // Keep action
            });
            // Handle emphasis tied to non-TTS dialogue specifically
            if (char.behaviors.emphasis.active && !char.isSpeakingTTS && char.behaviors.emphasis.endTime && now >= char.behaviors.emphasis.endTime) {
                this._setExpression(char, char.behaviors.emphasis.originalExpression);
                char.behaviors.emphasis.active = false;
            }
        });
    }

    _updateCameraTarget(immediate = false) {
        let explicitPanOverride = false;
        let explicitZoomOverride = false;

        // Check active camera events in the current group
        if (this.activeEventGroup) {
            for (let i = this.activeEventGroup.length - 1; i >= 0; i--) { // Check most recent camera event first
                const event = this.activeEventGroup[i];
                const status = this.activeEventGroupStatus[event._instanceId];
                if (event.type === 'camera' && status && !status.completed) { // Only consider *active* camera events
                    if (event.panTarget) explicitPanOverride = true;
                    if (event.zoom !== undefined) explicitZoomOverride = true;
                    // if an active camera event is found, its settings (already applied to targetX/Y/Zoom by _applyCameraEvent) take precedence
                    break; 
                }
            }
        }
        
        if (this.cameraState.focusEntities && this.cameraState.focusEntities.length > 0 && (!explicitPanOverride || !explicitZoomOverride)) {
            let focusBounds = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity, count: 0 };
            
            this.cameraState.focusEntities.forEach(entityId => {
                const character = this.charactersState[entityId];
                const object = this.objectsState[entityId];
                let entityWorldMinX, entityWorldMinY, entityWorldMaxX, entityWorldMaxY;

                if (character) {
                    const charHeight = this.FIGURE_BASE_HEIGHT * character.size;
                    const charWidthApproximation = charHeight * 0.6; // Approx width for bounding box
                    entityWorldMinX = character.x - charWidthApproximation * 0.5; 
                    entityWorldMaxX = character.x + charWidthApproximation * 0.5;
                    entityWorldMinY = character.y - charHeight;      
                    entityWorldMaxY = character.y;                  
                } else if (object && object.blueprint) {
                    let objWidth = 100 * (object.scale?.x || 1); 
                    let objHeight = 100 * (object.scale?.y || 1); 
                    if (object.blueprint.components && object.blueprint.components.length > 0) {
                        const mainComp = object.blueprint.components[0]; // Use first component for bounds
                        if (mainComp.width && mainComp.height) { 
                           objWidth = mainComp.width * (object.scale?.x || 1);
                           objHeight = mainComp.height * (object.scale?.y || 1);
                        } else if (mainComp.radius) { 
                           objWidth = mainComp.radius * 2 * (object.scale?.x || 1);
                           objHeight = mainComp.radius * 2 * (object.scale?.y || 1);
                        }
                    }
                    // Object's x,y is its center
                    entityWorldMinX = object.x - objWidth / 2; entityWorldMaxX = object.x + objWidth / 2;
                    entityWorldMinY = object.y - objHeight / 2; entityWorldMaxY = object.y + objHeight / 2;
                 }

                if (entityWorldMinX !== undefined) { // Check if entity was found and bounds calculated
                    focusBounds.minX = Math.min(focusBounds.minX, entityWorldMinX);
                    focusBounds.minY = Math.min(focusBounds.minY, entityWorldMinY);
                    focusBounds.maxX = Math.max(focusBounds.maxX, entityWorldMaxX);
                    focusBounds.maxY = Math.max(focusBounds.maxY, entityWorldMaxY);
                    focusBounds.count++;
                }
            });

            if (focusBounds.count > 0) {
                if (!explicitPanOverride) {
                    this.cameraState.targetX = (focusBounds.minX + focusBounds.maxX) / 2;
                    this.cameraState.targetY = (focusBounds.minY + focusBounds.maxY) / 2; // Center on Y too
                }
                
                if (!explicitZoomOverride) {
                    const paddingFactor = 0.25; // Increased padding
                    const bboxWidth = Math.max(100, focusBounds.maxX - focusBounds.minX) * (1 + paddingFactor * 2); // Ensure min width
                    const bboxHeight = Math.max(100, focusBounds.maxY - focusBounds.minY) * (1 + paddingFactor * 2); // Ensure min height
                    
                    const zoomToFitWidth = this.canvas.width / bboxWidth;
                    const zoomToFitHeight = this.canvas.height / bboxHeight;
                    let targetZoomVal = Math.min(zoomToFitWidth, zoomToFitHeight);
                    this.cameraState.targetZoom = Math.min(this.cameraState.maxZoom, Math.max(this.cameraState.minZoom, targetZoomVal));
                }
            }
        }
        // If immediate, snap current camera to target (already handled by caller _applyCameraEvent)
    }

    drawScene() {
        if (!this.animationData) {
            // Draw a placeholder or clear if no data
            this.ctx.fillStyle = this.canvas.style.backgroundColor || "#F0F8FF";
            this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
            return;
        }
        this.ctx.fillStyle = this.canvas.style.backgroundColor || "#F0F8FF";
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);

        const entitiesToDraw = [];
        Object.values(this.objectsState).forEach(obj => { if (obj) entitiesToDraw.push({ type: 'object', entity: obj, y: obj.y, layerName: obj.layer || this.defaultLayerName }); });
        Object.values(this.charactersState).forEach(char => { if (char) entitiesToDraw.push({ type: 'character', entity: char, y: char.y, layerName: char.layer || this.defaultLayerName }); });
        
        this.sceneLayers.forEach(layerConfig => {
            if (!layerConfig) return;
            const entitiesInLayer = entitiesToDraw
                .filter(item => item.layerName === layerConfig.name)
                .sort((a, b) => a.y - b.y); // Y-sort within layer for pseudo-3D

            this.ctx.save();
            const parallax = layerConfig.parallaxFactor !== undefined ? layerConfig.parallaxFactor : 1.0;
            const camX = this.cameraState.x;
            const camY = this.cameraState.y;
            const camZoom = this.cameraState.zoom;

            // Standard transform: translate to screen center, scale by zoom, then translate by negated camera world pos (with parallax)
            this.ctx.translate(this.canvas.width / 2, this.canvas.height / 2);
            this.ctx.scale(camZoom, camZoom);
            this.ctx.translate(-camX * parallax, -camY * parallax);
            
            entitiesInLayer.forEach(item => {
                if (item.type === 'character') this._drawCharacter(item.entity);
                else if (item.type === 'object') this._drawObjectInstance(item.entity);
            });
            this.ctx.restore();
        });

        // Draw speech bubbles on top of everything, in screen space (after all layers and restores)
        this.ctx.save(); // New save for screen space drawing
        Object.values(this.charactersState).forEach(char => {
            if (char && char.dialogueText) { 
                this._drawSpeechBubbleScreenSpace(char);
            }
        });
        this.ctx.restore();
    }

    _getCharacterPoseDetails(char) {
        if (!char) return null;
        const H = this.FIGURE_BASE_HEIGHT * char.size;
        
        // Use visual state from turning behavior if active, otherwise character's base state
        const turningBehav = char.behaviors.turning;
        const currentVisualFacingSign = turningBehav.isActive ? turningBehav.visualFacingSign : (char.facing === 'left' ? -1 : 1);
        const currentVisualFacingMode = turningBehav.isActive ? turningBehav.visualFacingMode : char.facingMode;

        const p_y_levels = {
            hipCenterY: char.y - (this.LEG_UPPER_F + this.LEG_LOWER_F) * H,
            neckBaseY: char.y - (this.LEG_UPPER_F + this.LEG_LOWER_F + this.BODY_LENGTH_F) * H,
            headCenterY: char.y - (this.LEG_UPPER_F + this.LEG_LOWER_F + this.BODY_LENGTH_F + this.NECK_LENGTH_F + this.HEAD_RADIUS_F) * H,
            shoulderY: char.y - (this.LEG_UPPER_F + this.LEG_LOWER_F + this.BODY_LENGTH_F * 0.9) * H, // Shoulder slightly below neck base top
        };
        
        const facingModeFactors = { // [profile, threeQuarter, front]
            shoulderWidth: [1.0, 0.75, 0.35], // How much of base width is visible
            hipWidth:      [1.0, 0.65, 0.3],
            limbXCompress: [0.7, 0.85, 1.0], // How much X-component of limbs is shown (less in profile due to foreshortening)
        };
        const facingModeIndex = currentVisualFacingMode === 'profile' ? 0 : (currentVisualFacingMode === 'threeQuarter' ? 1 : 2);

        const shoulderWidthActual = this.SHOULDER_WIDTH_F * H * facingModeFactors.shoulderWidth[facingModeIndex];
        const hipWidthActual = this.HIP_WIDTH_F * H * facingModeFactors.hipWidth[facingModeIndex];
        const limbXCompression = facingModeFactors.limbXCompress[facingModeIndex];
        
        const p_origins = {
            // Origins are relative to char.x (centerline)
            l_arm_sx: char.x - shoulderWidthActual * 0.5 * currentVisualFacingSign,
            l_arm_sy: p_y_levels.shoulderY,
            r_arm_sx: char.x + shoulderWidthActual * 0.5 * currentVisualFacingSign,
            r_arm_sy: p_y_levels.shoulderY,
            l_leg_hx: char.x - hipWidthActual * 0.5 * currentVisualFacingSign,
            l_leg_hy: p_y_levels.hipCenterY,
            r_leg_hx: char.x + hipWidthActual * 0.5 * currentVisualFacingSign,
            r_leg_hy: p_y_levels.hipCenterY,
            head_center_x: char.x, // Base head X before lean/offsets
            head_center_y: p_y_levels.headCenterY,
            neck_base_x: char.x,
            neck_base_y: p_y_levels.neckBaseY,
            hip_center_x: char.x,
            hip_center_y: p_y_levels.hipCenterY,
        };
        
        const phase = char.posePhase;
        
        let activePName = char.activePoseName;
        if (typeof activePName === 'string') {
            if (activePName === 'talk' && char.currentTalkPose) activePName = char.currentTalkPose;
            if (activePName === 'idle' && char.behaviors.idleBehavior.currentIdleVariation) activePName = char.behaviors.idleBehavior.currentIdleVariation;
        } else { activePName = 'idle_default'; }
        
        let prevPName = char.previousPoseName;
         if (typeof prevPName === 'string') {
            if (prevPName === 'talk' && char.currentTalkPose) prevPName = char.currentTalkPose; // Use current talk if transitioning from generic talk
            if (prevPName === 'idle' && char.behaviors.idleBehavior.currentIdleVariation) prevPName = char.behaviors.idleBehavior.currentIdleVariation;
        } else { prevPName = 'idle_default'; }

        // Ensure pose names are valid before fetching definitions
        if (!this.poseDefinitions[activePName]) activePName = 'idle_default';
        if (!this.poseDefinitions[prevPName]) prevPName = 'idle_default';

        const sPoseDataCurrent = this._getSpecificPoseData(char, prevPName, H, p_origins, p_y_levels, currentVisualFacingSign, limbXCompression, phase, currentVisualFacingMode);
        const sPoseDataTarget = this._getSpecificPoseData(char, activePName, H, p_origins, p_y_levels, currentVisualFacingSign, limbXCompression, phase, currentVisualFacingMode);
        
        const specificPoseData = this._interpolatePoseDetails(sPoseDataCurrent, sPoseDataTarget, char.poseTransitionProgress);        
        
        const shoulderOffsetY = specificPoseData.shoulderOffsetY || 0;
        p_origins.l_arm_sy += shoulderOffsetY; // Apply dynamic shoulder offset
        p_origins.r_arm_sy += shoulderOffsetY;
        p_y_levels.neckBaseY += shoulderOffsetY; // Neck base also moves with shoulders for shrugs

        let poseDefinedHeadTilt = specificPoseData.headTilt; // Tilt from pose definition
        let finalHeadTiltWithLookAt = poseDefinedHeadTilt;
        if (char.behaviors.lookAt.isActive) {
            finalHeadTiltWithLookAt += char.behaviors.lookAt.currentHeadAngle;
        }
        finalHeadTiltWithLookAt = Math.max(-85, Math.min(85, finalHeadTiltWithLookAt)); // Clamp final visual tilt

        // Body lean affects upper body points
        const currentBodyLean = specificPoseData.bodyLean || 0;
        const bodyTopX = p_origins.neck_base_x + currentBodyLean + (specificPoseData.bodyX2Offset || 0);

        let pose = {
            head: { x: bodyTopX, y: p_y_levels.headCenterY, r: this.HEAD_RADIUS_F * H, 
                    headTilt: finalHeadTiltWithLookAt, rawTilt: poseDefinedHeadTilt /* Store pose tilt for accessory sway */ },
            body: { x1: p_origins.hip_center_x, y1: p_y_levels.hipCenterY, 
                    x2: bodyTopX, y2: p_y_levels.neckBaseY },
            l_arm: { sx: p_origins.l_arm_sx + currentBodyLean, sy: p_origins.l_arm_sy, ...specificPoseData.l_arm },
            r_arm: { sx: p_origins.r_arm_sx + currentBodyLean, sy: p_origins.r_arm_sy, ...specificPoseData.r_arm },
            l_leg: { hx: p_origins.l_leg_hx, hy: p_origins.l_leg_hy, ...specificPoseData.l_leg },
            r_leg: { hx: p_origins.r_leg_hx, hy: p_origins.r_leg_hy, ...specificPoseData.r_leg }
        };

        let bobOffset = typeof specificPoseData.bobOffset === 'number' ? specificPoseData.bobOffset : 0;
        const partsToBob = [pose.head, pose.body, pose.l_arm, pose.r_arm, pose.l_leg, pose.r_leg];
        partsToBob.forEach(part => {
            if (!part) return;
            for (const key in part) {
                if ((key.endsWith('y') || key.endsWith('y1') || key.endsWith('y2') || 
                     key.endsWith('sy') || key.endsWith('ey') || key.endsWith('hy') || 
                     key.endsWith('ky') || key.endsWith('fy')) && typeof part[key] === 'number') {
                    part[key] -= bobOffset; // Apply bobbing by subtracting offset
                }
            }
        });
        
        return pose;
    }

    _getSpecificPoseData(char, poseName, H, p_origins, p_y_levels, facingSign, limbXCompress, phase, visualFacingMode) {
        const A_U = this.ARM_UPPER_F * H; const A_L = this.ARM_LOWER_F * H;
        const L_U = this.LEG_UPPER_F * H; const L_L = this.LEG_LOWER_F * H;
        const { l_arm_sx, l_arm_sy, r_arm_sx, r_arm_sy, l_leg_hx, l_leg_hy, r_leg_hx, r_leg_hy } = p_origins;

        let outputPoseData = { headTilt: 0, bobOffset: 0, bodyX2Offset: 0, bodyLean: 0, shoulderOffsetY:0, l_arm: {}, r_arm: {}, l_leg: {}, r_leg: {} };
        
        const pDef = this.poseDefinitions[poseName] || this.poseDefinitions['idle_default'];

        const evalParam = (param, p, H_val, chr_val) => typeof param === 'function' ? param(p, H_val, chr_val) : param;

        if (pDef.headTilt) outputPoseData.headTilt = evalParam(pDef.headTilt, phase, H, char); // Base tilt, facingSign applied later if needed by specific drawing
        if (pDef.bobOffset) outputPoseData.bobOffset = evalParam(pDef.bobOffset, phase, H, char);
        if (pDef.bodyX2Offset) outputPoseData.bodyX2Offset = evalParam(pDef.bodyX2Offset, phase, H, char) * facingSign;
        if (pDef.bodyLean) outputPoseData.bodyLean = evalParam(pDef.bodyLean, phase, H, char) * facingSign;
        if (pDef.shoulderOffsetYDynamic) outputPoseData.shoulderOffsetY = evalParam(pDef.shoulderOffsetYDynamic, phase, H, char);
        else if (pDef.shoulderOffsetY) outputPoseData.shoulderOffsetY = pDef.shoulderOffsetY;

        const currentBodyLean = outputPoseData.bodyLean || 0; // For IK targets relative to leaned body
        const bodyCenterAllowance = H * 0.03 * (visualFacingMode === 'front' ? 0.1 : 1); // Smaller allowance in front view to prevent crossing

        if (poseName === 'walk' || poseName === 'run') {
            const isRunning = poseName === 'run';
            const cycle = Math.sin(phase * 0.5); 
            const absCycle = Math.abs(cycle);

            let legAngleRange = isRunning ? { fwd: 75, back: 60, kneeLift: 65 } : { fwd: 60, back: 45, kneeLift: 45 };
            let armAngleRange = isRunning ? { fwd: 75, back: 65 } : { fwd: 60, back: 50 };
            
            // Left Leg (advancing when cycle > 0)
            let lLegAngleDeg = cycle * (cycle > 0 ? legAngleRange.fwd : legAngleRange.back);
            let lKneeBendFactor = (isRunning ? 0.4 : 0.3) + absCycle * (isRunning ? 0.7 : 0.6); // More bend when leg is mid-swing
            outputPoseData.l_leg.kx = l_leg_hx + L_U * Math.sin(lLegAngleDeg * Math.PI/180 * 0.6 * lKneeBendFactor) * facingSign * limbXCompress;
            outputPoseData.l_leg.ky = l_leg_hy + L_U * Math.cos(lLegAngleDeg * Math.PI/180 * 0.6 * lKneeBendFactor);
            outputPoseData.l_leg.fx = outputPoseData.l_leg.kx + L_L * Math.sin(lLegAngleDeg * Math.PI/180) * facingSign * limbXCompress;
            outputPoseData.l_leg.fy = outputPoseData.l_leg.ky + L_L * Math.cos(lLegAngleDeg * Math.PI/180);

            // Right Leg (advancing when cycle < 0)
            let rLegAngleDeg = -cycle * (cycle < 0 ? legAngleRange.fwd : legAngleRange.back); // Opposite phase
            let rKneeBendFactor = (isRunning ? 0.4 : 0.3) + absCycle * (isRunning ? 0.7 : 0.6);
            outputPoseData.r_leg.kx = r_leg_hx + L_U * Math.sin(rLegAngleDeg * Math.PI/180 * 0.6 * rKneeBendFactor) * facingSign * limbXCompress;
            outputPoseData.r_leg.ky = r_leg_hy + L_U * Math.cos(rLegAngleDeg * Math.PI/180 * 0.6 * rKneeBendFactor);
            outputPoseData.r_leg.fx = outputPoseData.r_leg.kx + L_L * Math.sin(rLegAngleDeg * Math.PI/180) * facingSign * limbXCompress;
            outputPoseData.r_leg.fy = outputPoseData.r_leg.ky + L_L * Math.cos(rLegAngleDeg * Math.PI/180);
            
            // Arms oppose legs: Right arm swings with Left leg
            let rArmAngleDeg = cycle * (cycle > 0 ? armAngleRange.fwd : armAngleRange.back);
            outputPoseData.r_arm.ex = r_arm_sx + A_U * Math.sin(rArmAngleDeg * Math.PI/180 * 0.7) * facingSign * limbXCompress;
            outputPoseData.r_arm.ey = r_arm_sy + A_U * Math.cos(rArmAngleDeg * Math.PI/180 * 0.7);
            outputPoseData.r_arm.hx = outputPoseData.r_arm.ex + A_L * Math.sin(rArmAngleDeg * Math.PI/180) * facingSign * limbXCompress;
            outputPoseData.r_arm.hy = outputPoseData.r_arm.ey + A_L * Math.cos(rArmAngleDeg * Math.PI/180);
            
            let lArmAngleDeg = -cycle * (cycle < 0 ? armAngleRange.fwd : armAngleRange.back);
            outputPoseData.l_arm.ex = l_arm_sx + A_U * Math.sin(lArmAngleDeg * Math.PI/180 * 0.7) * facingSign * limbXCompress;
            outputPoseData.l_arm.ey = l_arm_sy + A_U * Math.cos(lArmAngleDeg * Math.PI/180 * 0.7);
            outputPoseData.l_arm.hx = outputPoseData.l_arm.ex + A_L * Math.sin(lArmAngleDeg * Math.PI/180) * facingSign * limbXCompress;
            outputPoseData.l_arm.hy = outputPoseData.l_arm.ey + A_L * Math.cos(lArmAngleDeg * Math.PI/180);

        } else { // For non-walk/run poses
            ['l_arm', 'r_arm'].forEach(limbKey => {
                const armDef = pDef[limbKey];
                if (!armDef) return;

                const S_X = (limbKey === 'l_arm' ? l_arm_sx : r_arm_sx) + currentBodyLean; // Apply bodyLean to shoulder origin
                const S_Y = limbKey === 'l_arm' ? l_arm_sy : r_arm_sy; // Shoulder Y already includes dynamic offset
                const preferClockwiseBend = (limbKey === 'r_arm'); // Standard IK bend preference

                if (armDef.type === 'ik_target') {
                    let targetX_abs, targetY_abs;
                    const targetEntityId = armDef.targetId;
                    const targetPointDef = armDef.targetPoint;
                    
                    if (targetEntityId === 'body') { // Target relative to own body
                        const refX = p_origins.hip_center_x + currentBodyLean; // IK target usually relative to hip or neck after lean
                        const refY_hip = p_origins.hip_center_y;
                        const refY_neck = p_origins.neck_base_y; // Neck Y already includes shoulder offset

                        if (typeof targetPointDef === 'string') {
                            if (targetPointDef === 'hip_left') { targetX_abs = p_origins.l_leg_hx + currentBodyLean; targetY_abs = p_origins.l_leg_hy; }
                            else if (targetPointDef === 'hip_right') { targetX_abs = p_origins.r_leg_hx + currentBodyLean; targetY_abs = p_origins.r_leg_hy; }
                            else { targetX_abs = refX; targetY_abs = refY_hip; } // Default to hip center
                        } else { // {xF, yF} object
                            targetX_abs = refX + evalParam(targetPointDef.xF, phase, H, char) * H * facingSign;
                            // yF usually relative to neck for upper body targets, hip for lower
                            const yBaseForTarget = (targetPointDef.yF < -0.1) ? refY_neck : refY_hip;
                            targetY_abs = yBaseForTarget + evalParam(targetPointDef.yF, phase, H, char) * H;
                        }
                    } else if (targetEntityId === 'head') { // Target relative to own head
                        targetX_abs = p_origins.head_center_x + currentBodyLean; // Head X already includes body lean
                        targetY_abs = p_origins.head_center_y; // Head Y is absolute for now
                        if (targetPointDef === 'chin') {
                             targetY_abs += this.HEAD_RADIUS_F * H * 0.8;
                        } else if (targetPointDef === 'chin_side') {
                            targetX_abs += (this.HEAD_RADIUS_F * H * 0.3 * facingSign * limbXCompress);
                            targetY_abs += this.HEAD_RADIUS_F * H * 0.7;
                        }
                    } else { // Default fallback if targetId is unknown (should not happen)
                        targetX_abs = S_X + 0.1 * H * facingSign; targetY_abs = S_Y + 0.1 * H;
                    }

                    let handOffsetX = 0, handOffsetY = 0;
                    const offsetDef = armDef.handOffset || armDef.handOffsetDynamic;
                    if (offsetDef) {
                        handOffsetX = evalParam(offsetDef.xF, phase, H, char) * H * facingSign;
                        handOffsetY = evalParam(offsetDef.yF, phase, H, char) * H;
                    }
                    
                    const handTargetX = targetX_abs + handOffsetX;
                    const handTargetY = targetY_abs + handOffsetY;

                    const armSolution = this._solveArmIK(S_X, S_Y, handTargetX, handTargetY, A_U, A_L, preferClockwiseBend, facingSign);
                    outputPoseData[limbKey].ex = armSolution.elbow.x;
                    outputPoseData[limbKey].ey = armSolution.elbow.y;
                    outputPoseData[limbKey].hx = armSolution.hand.x;
                    outputPoseData[limbKey].hy = armSolution.hand.y;

                } else if (armDef.type === 'factors') { 
                    outputPoseData[limbKey].ex = S_X + armDef.exF * A_U * facingSign * limbXCompress;
                    outputPoseData[limbKey].ey = S_Y + armDef.eyF * A_U;
                    outputPoseData[limbKey].hx = outputPoseData[limbKey].ex + armDef.hxF * A_L * facingSign * limbXCompress;
                    outputPoseData[limbKey].hy = outputPoseData[limbKey].ey + armDef.hyF * A_L;
                }
                
                // Prevent arms from crossing body unnaturaly in non-profile views
                if (visualFacingMode !== 'profile') {
                    const bodyCenterXWithLean = p_origins.hip_center_x + currentBodyLean;
                    // Check elbow
                    if ((outputPoseData[limbKey].ex - bodyCenterXWithLean) * facingSign < -bodyCenterAllowance) { // Left arm went too far right, or right arm too far left
                           outputPoseData[limbKey].ex = bodyCenterXWithLean - bodyCenterAllowance * facingSign;
                    }
                    // Check hand
                    if ((outputPoseData[limbKey].hx - bodyCenterXWithLean) * facingSign < -bodyCenterAllowance) {
                           outputPoseData[limbKey].hx = bodyCenterXWithLean - bodyCenterAllowance * facingSign;
                    }
                }
            });

            ['l_leg', 'r_leg'].forEach(limbKey => {
                const legDef = pDef[limbKey] || this.poseDefinitions.idle_default[limbKey];
                if (!legDef) return;
                const H_X = limbKey === 'l_leg' ? l_leg_hx : r_leg_hx;
                const H_Y = limbKey === 'l_leg' ? l_leg_hy : r_leg_hy;
                
                const kxF = evalParam(legDef.kxF || legDef.kxFDynamic, phase, H, char);
                const kyF = evalParam(legDef.kyF || legDef.kyFDynamic, phase, H, char);
                const fxF = evalParam(legDef.fxF || legDef.fxFDynamic, phase, H, char);
                const fyF = evalParam(legDef.fyF || legDef.fyFDynamic, phase, H, char);

                outputPoseData[limbKey].kx = H_X + kxF * L_U * facingSign * limbXCompress;
                outputPoseData[limbKey].ky = H_Y + kyF * L_U;
                outputPoseData[limbKey].fx = outputPoseData[limbKey].kx + fxF * L_L * facingSign * limbXCompress;
                outputPoseData[limbKey].fy = outputPoseData[limbKey].ky + fyF * L_L;
            });
        }
        return outputPoseData;
    }
    
    _interpolatePoseDetails(poseA, poseB, t) {
        const interpolated = { headTilt: 0, bobOffset: 0, bodyX2Offset:0, bodyLean:0, shoulderOffsetY:0, l_arm: {}, r_arm: {}, l_leg: {}, r_leg: {} };
        // Smoothstep for t for nicer transitions
        const eased_t = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

        const lerp = (a, b, time) => {
            if (a === undefined && b === undefined) return 0;
            if (a === undefined) return b || 0;
            if (b === undefined) return a || 0;
            return a + (b - a) * time;
        };

        interpolated.headTilt = lerp(poseA.headTilt, poseB.headTilt, eased_t);
        interpolated.bobOffset = lerp(poseA.bobOffset, poseB.bobOffset, eased_t);
        interpolated.bodyX2Offset = lerp(poseA.bodyX2Offset, poseB.bodyX2Offset, eased_t);
        interpolated.bodyLean = lerp(poseA.bodyLean, poseB.bodyLean, eased_t);
        interpolated.shoulderOffsetY = lerp(poseA.shoulderOffsetY, poseB.shoulderOffsetY, eased_t);

        ['l_arm', 'r_arm'].forEach(limbKey => {
            ['ex', 'ey', 'hx', 'hy'].forEach(coordKey => {
                interpolated[limbKey][coordKey] = lerp(poseA[limbKey]?.[coordKey], poseB[limbKey]?.[coordKey], eased_t);
            });
        });
        ['l_leg', 'r_leg'].forEach(limbKey => {
            ['kx', 'ky', 'fx', 'fy'].forEach(coordKey => {
                interpolated[limbKey][coordKey] = lerp(poseA[limbKey]?.[coordKey], poseB[limbKey]?.[coordKey], eased_t);
            });
        });
        return interpolated;
    }

    _solveArmIK(sx, sy, hx_target, hy_target, L1, L2, preferClockwiseBend, facingSign) {
        let dx = hx_target - sx;
        let dy = hy_target - sy;
        let d_sq = dx * dx + dy * dy;
        let d = Math.sqrt(d_sq);
        const epsilon = 0.01; // Slightly larger epsilon for stability

        let hx_actual = hx_target;
        let hy_actual = hy_target;

        if (d > L1 + L2 - epsilon) { // Target too far, extend fully
            const ratio = (L1 + L2) / (d < epsilon ? epsilon : d); 
            hx_actual = sx + dx * ratio;
            hy_actual = sy + dy * ratio;
            d = L1 + L2; // Update distance to clamped
        } else if (d < Math.abs(L1 - L2) + epsilon) { // Target too close, fold along L1-L2 line
             const min_reach_dist = Math.abs(L1 - L2);
             if (d < epsilon && min_reach_dist < epsilon) { // Target at shoulder & L1~L2 (fully folded)
                // Default bend: elbow slightly outward/backward based on facing
                const defaultBendX = L1 * 0.1 * facingSign;
                const defaultBendY = L1 * 0.9; // Slight bend downwards
                return { elbow: { x: sx + defaultBendX, y: sy + defaultBendY }, hand: { x: sx, y: sy } };
            }
            const ratio = min_reach_dist / (d < epsilon ? epsilon : d);
            hx_actual = sx + dx * ratio;
            hy_actual = sy + dy * ratio;
            d = min_reach_dist; 
        }
        
        dx = hx_actual - sx; // Update dx, dy based on potentially clamped hand position
        dy = hy_actual - sy;

        if (d < epsilon) { // Hand is effectively at shoulder after clamping
            const defaultBendX = L1 * 0.1 * facingSign;
            const defaultBendY = L1 * 0.9 * (preferClockwiseBend ? 1 : -1); // Simple default bend
            return { elbow: { x: sx + defaultBendX, y: sy + defaultBendY }, hand: { x: sx, y: sy } };
        }

        const a = (L1*L1 - L2*L2 + d*d) / (2 * d);
        let h_sq = L1*L1 - a*a;
        if (h_sq < 0) h_sq = 0; // Clamp due to precision for straight arms
        const h = Math.sqrt(h_sq);

        const p_mid_x = sx + a * (dx / d);
        const p_mid_y = sy + a * (dy / d);
        
        // Bend direction: preferClockwiseBend (true for right arm) means elbow "outward" or "downward" from shoulder-hand line.
        // The sign of 'h' determines which side of the shoulder-hand line the elbow goes.
        // For right arm (CW): elbow_x = mid_x + h * dy/d, elbow_y = mid_y - h * dx/d
        // For left arm (CCW): elbow_x = mid_x - h * dy/d, elbow_y = mid_y + h * dx/d
        const bendDirSign = preferClockwiseBend ? 1 : -1; 
        
        // If facing left, the perceived "clockwise" might flip for the viewer if not careful.
        // However, the IK is in world space, so `preferClockwiseBend` refers to the character's own right/left.
        // Let's use a convention where positive bendDirSign means elbow goes "down" relative to horizontal shoulder-hand.
        // This usually looks natural.
        
        const ex = p_mid_x + bendDirSign * h * (dy / d);
        const ey = p_mid_y - bendDirSign * h * (dx / d);
        
        return { elbow: { x: ex, y: ey }, hand: { x: hx_actual, y: hy_actual } };
    }


    _drawCharacter(char) {
        if (!char || !char.behaviors) return;
        const d = this._getCharacterPoseDetails(char); 
        if (!d) return; // Could not get pose details

        const ctx = this.ctx;
        const lineW = Math.max(1.5, this.STICK_THICKNESS_BASE * char.size);
        ctx.strokeStyle = char.color; ctx.fillStyle = char.color;
        ctx.lineWidth = lineW; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

        ctx.beginPath(); ctx.moveTo(d.body.x1, d.body.y1); ctx.lineTo(d.body.x2, d.body.y2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(d.l_leg.hx, d.l_leg.hy); ctx.lineTo(d.l_leg.kx, d.l_leg.ky); ctx.lineTo(d.l_leg.fx, d.l_leg.fy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(d.r_leg.hx, d.r_leg.hy); ctx.lineTo(d.r_leg.kx, d.r_leg.ky); ctx.lineTo(d.r_leg.fx, d.r_leg.fy); ctx.stroke();
        
        if (char.appearance.hasTzitzit) this._drawCharacterTzitzit(char, d);

        ctx.beginPath(); ctx.moveTo(d.l_arm.sx, d.l_arm.sy); ctx.lineTo(d.l_arm.ex, d.l_arm.ey); ctx.lineTo(d.l_arm.hx, d.l_arm.hy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(d.r_arm.sx, d.r_arm.sy); ctx.lineTo(d.r_arm.ex, d.r_arm.ey); ctx.lineTo(d.r_arm.hx, d.r_arm.hy); ctx.stroke();

        ctx.save();
        ctx.translate(d.head.x, d.head.y);
        ctx.rotate(d.head.headTilt * Math.PI / 180); // Apply final visual head tilt
        ctx.beginPath(); ctx.arc(0, 0, d.head.r, 0, Math.PI * 2);
        ctx.fillStyle = char.color; ctx.fill();
        
        const activeExpression = this._getActiveExpression(char);
        // Use visual state from turning behavior or character's base state for drawing
        const turningBehav = char.behaviors.turning;
        const visualFacingMode = turningBehav.isActive ? turningBehav.visualFacingMode : char.facingMode;
        const visualFacingSign = turningBehav.isActive ? turningBehav.visualFacingSign : (char.facing === 'left' ? -1 : 1);

        this._drawCharacterFace(char, d.head.r, activeExpression, visualFacingMode, visualFacingSign); 
        this._drawCharacterHair(char, d.head.r, visualFacingMode, visualFacingSign);
        // Accessories sway with pose tilt (d.head.rawTilt), not full visual tilt
        this._drawCharacterAccessories(char, d.head.r, d.head.rawTilt, visualFacingMode, visualFacingSign);
        ctx.restore();
    }

    _drawCharacterTzitzit(char, poseDetails) {
        const ctx = this.ctx;
        const H = this.FIGURE_BASE_HEIGHT * char.size;
        const tzitzitLength = this.TZITZIT_LENGTH_F * H;
        const hipY = poseDetails.body.y1; 

        const turningBehav = char.behaviors.turning;
        const visualFacingMode = turningBehav.isActive ? turningBehav.visualFacingMode : char.facingMode;
        const visualFacingSign = turningBehav.isActive ? turningBehav.visualFacingSign : (char.facing === 'left' ? -1 : 1);
        
        const facingModeFactors = { 'profile': 0.4, 'threeQuarter': 0.8, 'front': 1.0 };
        const bodyActualWidthAtHip = this.HIP_WIDTH_F * H * (facingModeFactors[visualFacingMode] || 1.0);
        const tzitzitAnchorOffset = bodyActualWidthAtHip * this.TZITZIT_HIP_ANCHOR_X_FACTOR * 0.5; // Reduced offset for less spread

        const stringCount = 2; 
        const spreadFromAnchor = H * 0.01;

        const swayAmplitude = char.behaviors.accessorySway.currentTzitzitSwayAmplitude;
        const baseSwayPhase = char.swayPhase; 

        ctx.save();
        ctx.strokeStyle = char.appearance.tzitzitColor || 'white';
        ctx.lineWidth = Math.max(1, char.size * 1.2); 
        ctx.lineCap = 'butt'; // Straighter ends for tzitzit strings

        const bodyLeanEffect = poseDetails.bodyLean || 0; // This might be specific to upper body, adjust if hip lean is different

        // Right side (character's right)
        const rightSideAnchorX = poseDetails.body.x1 + tzitzitAnchorOffset * visualFacingSign + bodyLeanEffect;
        for (let i = 0; i < stringCount; i++) {
            ctx.beginPath();
            const individualSwayPhase = baseSwayPhase + i * 0.5; 
            const swayOffsetX = Math.sin(individualSwayPhase) * swayAmplitude * char.size * (0.8 + Math.random()*0.4);
            const startX = rightSideAnchorX + ( (i - (stringCount-1)/2) * spreadFromAnchor * visualFacingSign );
            ctx.moveTo(startX, hipY + H*0.01); 
            const endX = startX + (swayOffsetX * visualFacingSign) + (Math.random()-0.5)*spreadFromAnchor*0.3*visualFacingSign;
            ctx.lineTo(endX, hipY + tzitzitLength + (Math.random()-0.5)*H*0.02);
            ctx.stroke();
        }

        // Left side (character's left)
        const leftSideAnchorX = poseDetails.body.x1 - tzitzitAnchorOffset * visualFacingSign + bodyLeanEffect;
        for (let i = 0; i < stringCount; i++) {
            ctx.beginPath();
            const individualSwayPhase = baseSwayPhase + i * 0.5 + Math.PI/4; 
            const swayOffsetX = Math.sin(individualSwayPhase) * swayAmplitude * char.size * (0.8 + Math.random()*0.4);
            const startX = leftSideAnchorX + ( (i - (stringCount-1)/2) * spreadFromAnchor * visualFacingSign );
            ctx.moveTo(startX, hipY + H*0.01);
            const endX = startX + (swayOffsetX * visualFacingSign) + (Math.random()-0.5)*spreadFromAnchor*0.3*visualFacingSign;
            ctx.lineTo(endX, hipY + tzitzitLength + (Math.random()-0.5)*H*0.02);
            ctx.stroke();
        }
        ctx.restore();
    }
    
    _getExpressionDefinition(expressionName) {
        const baseExpressions = {
            'neutral': { eyebrowTilt: 0, eyebrowRaiseF: 0, eyeOpenF: 1.0, pupilSizeF: 1.0, mouthDefaultShape: 'neutral' },
            'happy': { eyebrowTilt: -15, eyebrowRaiseF: -0.2, eyeOpenF: 0.85, pupilSizeF: 1.0, mouthDefaultShape: 'smile' },
            'sad': { eyebrowTilt: 20, eyebrowRaiseF: 0.05, eyeOpenF: 0.8, pupilSizeF: 1.0, mouthDefaultShape: 'frown_subtle' },
            'angry': { 
                eyebrowTilt: (chr, vfm, vfs) => (vfm === 'front' ? (vfs > 0 ? -25: 25) : (vfs === -1 ? 30 : -30)), // Inner brows down
                eyebrowRaiseF: 0.1, eyeOpenF: 0.7, pupilSizeF: 0.9, mouthDefaultShape: 'frown_large' 
            },
            'surprised': { eyebrowTilt: -10, eyebrowRaiseF: -0.45, eyeOpenF: 1.25, pupilSizeF: 0.75, mouthDefaultShape: 'o_large' },
            'focused': { 
                eyebrowTilt: (chr, vfm, vfs) => (vfm === 'front' ? (vfs > 0 ? -15: 15) : (vfs === -1 ? 15 : -15)),
                eyebrowRaiseF: 0.05, eyeOpenF: 0.85, pupilSizeF: 0.9, mouthDefaultShape: 'neutral' 
            },
            'subtle_emphasis': { eyebrowTilt: -8, eyebrowRaiseF: -0.15, eyeOpenF: 1.05, pupilSizeF: 1.0, mouthDefaultShape: 'slight_open' },
            'skeptical': { 
                // One eyebrow up, one neutral or slightly down
                eyebrowTilt: (chr, vfm, vfs) => (vfs === -1 ? -25 : 5), // e.g. Left up if facing left, or main side up
                eyebrowRaiseF: (chr, vfm, vfs) => (vfs === -1 ? -0.35 : -0.05),
                eyeOpenF: 0.9, pupilSizeF: 1.0, mouthDefaultShape: 'neutral' // Mouth can be asymmetric too, e.g. slight smirk
            },
        };
        return baseExpressions[expressionName] || baseExpressions['neutral'];
    }

    _getActiveExpression(char) {
        if (!char || !char.behaviors) return this._getExpressionDefinition('neutral'); // Safe fallback
        const turningBehav = char.behaviors.turning;
        const visualFacingMode = turningBehav.isActive ? turningBehav.visualFacingMode : char.facingMode;
        const visualFacingSign = turningBehav.isActive ? turningBehav.visualFacingSign : (char.facing === 'left' ? -1 : 1);

        const defA = this._getExpressionDefinition(char.previousExpressionName);
        const defB = this._getExpressionDefinition(char.activeExpressionName);
        const t = char.expressionTransitionProgress;
        // Smoothstep for t
        const eased_t = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

        const lerp = (a, b, time) => {
            if (a === undefined && b === undefined) return 0;
            if (a === undefined) return b || 0;
            if (b === undefined) return a || 0;
            return a + (b - a) * time;
        };

        let interpolated = { 
            name: char.activeExpressionName, 
            mouthDefaultShape: (eased_t < 0.5 ? defA.mouthDefaultShape : defB.mouthDefaultShape) || 'neutral' 
        };

        for (const key in defA) { // Iterate over keys of a base definition
            if (key === 'mouthDefaultShape' || key === 'name') continue;

            const valA_raw = defA[key];
            const valB_raw = defB[key]; // B might not have all custom func keys if A is more complex
            
            const valA = typeof valA_raw === 'function' ? valA_raw(char, visualFacingMode, visualFacingSign) : valA_raw;
            // Ensure B's value is also resolved if it's a function, or use A's resolved if B doesn't have the func
            const valB = typeof valB_raw === 'function' ? valB_raw(char, visualFacingMode, visualFacingSign) : (valB_raw !== undefined ? valB_raw : valA) ; 
            
            interpolated[key] = lerp(valA, valB, eased_t);
        }
        return interpolated;
    }


    _drawCharacterFace(char, headR, activeExpression, visualFacingMode, visualFacingSign) {
        const ctx = this.ctx;
        this._drawEyes(char, headR, activeExpression, ctx, visualFacingMode, visualFacingSign);
        this._drawEyebrows(char, headR, activeExpression, ctx, visualFacingMode, visualFacingSign);
        this._drawMouthAndNose(char, headR, activeExpression, ctx, visualFacingMode, visualFacingSign);
    }

    _drawEyes(char, headR, expression, ctx, visualFacingMode, visualFacingSign) {
        const app = char.appearance;
        const blinkBehav = char.behaviors.blinking;
        const dartBehav = char.behaviors.eyeDarts;
        
        let intensityFactor = 1.0;
        if (char.behaviors.emphasis.active) intensityFactor = this.EXPRESSION_INTENSITY_FACTOR * (char.behaviors.emphasis.intensity / 1.5);

        // fpf (feature perspective factor) for X offset and separation
        const fpfMap = {'profile': 0.8, 'threeQuarter': 0.6, 'front': 0.45}; 
        let xOffsetFactor = fpfMap[visualFacingMode] || 0.8;

        const eyeR_base = headR * 0.22;
        const pupilRBase = eyeR_base * 0.55; // Slightly larger pupils
        const eyeYPos = -headR * 0.18; // Slightly higher eyes
        
        // Main eye X position based on head radius and facing mode
        // In profile, eye is on contour. In 3/4 and front, it's offset from center.
        let mainEyeX = headR * 0.33 * xOffsetFactor * visualFacingSign;
        let farEyeX = 0;
        let drawFarEye = false;

        if (visualFacingMode === 'threeQuarter') {
            mainEyeX = headR * 0.25 * visualFacingSign; // Closer eye more towards center
            farEyeX = headR * 0.55 * visualFacingSign;  // Far eye further out, more compressed
            drawFarEye = true;
        } else if (visualFacingMode === 'front') {
            const eyeSeparationFront = headR * 0.30;
            mainEyeX = eyeSeparationFront * visualFacingSign;
            farEyeX = -eyeSeparationFront * visualFacingSign; // Symmetrical
            drawFarEye = true;
        }
        // If profile, mainEyeX is already set to be on the contour, no far eye.
        // mainEyeX will be headR * 0.33 * 0.8 * visualFacingSign = headR * 0.264 * visualFacingSign

        let pupilR = pupilRBase * expression.pupilSizeF;
        let eyeOpenFactor = expression.eyeOpenF * intensityFactor;
        
        if (expression.name === 'surprised') pupilR *= Math.max(0.8, 1 / intensityFactor); 
        if (expression.name === 'angry') eyeOpenFactor = Math.max(0.1, eyeOpenFactor / intensityFactor);
        if (expression.name === 'sad') eyeOpenFactor = Math.max(0.1, eyeOpenFactor / intensityFactor);

        if (blinkBehav.isBlinking) {
            const currentBlinkPhase = blinkBehav.blinkProgress < 1 ? blinkBehav.blinkProgress : 2 - blinkBehav.blinkProgress;
            eyeOpenFactor *= (1 - Math.sin(currentBlinkPhase * Math.PI * 0.5) * 0.99); // Nearly full close
        }
        eyeOpenFactor = Math.max(0.01, eyeOpenFactor); // Ensure eye is at least a slit

        const finalPupilShiftX = dartBehav.currentPupilShiftX;
        const finalPupilShiftY = dartBehav.currentPupilShiftY + (expression.name === 'sad' ? eyeR_base * 0.1 * intensityFactor : 0);

        // Draw far eye first if visible
        if (drawFarEye) {
            ctx.fillStyle = this.adjustColor(app.eyeColor || 'white', (visualFacingMode === 'threeQuarter' ? -0.1 : -0.05) ); // Far eye slightly darker
            const farEyeRadiusFactor = (visualFacingMode === 'threeQuarter') ? 0.80 : 0.95; // Far eye smaller in 3/4
            const farEyeOpenFactor = eyeOpenFactor * ((visualFacingMode === 'threeQuarter') ? 0.85 : 0.95);
            ctx.beginPath(); 
            ctx.ellipse(farEyeX, eyeYPos, eyeR_base * farEyeRadiusFactor, eyeR_base * farEyeOpenFactor * farEyeRadiusFactor, 0, 0, Math.PI*2); 
            ctx.fill();
            if (farEyeOpenFactor > 0.1) {
                ctx.fillStyle = this.adjustColor(app.pupilColor || 'black', -0.05);
                ctx.beginPath(); 
                ctx.arc(farEyeX + finalPupilShiftX * 0.7, eyeYPos + finalPupilShiftY, pupilR * farEyeRadiusFactor * 0.9, 0, Math.PI*2); 
                ctx.fill();
                 // Highlight for far eye
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                const farHighlightR = pupilR * farEyeRadiusFactor * 0.9 * 0.3;
                ctx.beginPath(); 
                ctx.arc(farEyeX + finalPupilShiftX * 0.7 + pupilR * farEyeRadiusFactor * 0.9 *0.25, 
                        eyeYPos + finalPupilShiftY - pupilR * farEyeRadiusFactor * 0.9 *0.25, 
                        farHighlightR, 0, Math.PI*2); 
                ctx.fill();
            }
        }
        
        // Draw main/front eye
        ctx.fillStyle = app.eyeColor || 'white';
        ctx.beginPath(); 
        ctx.ellipse(mainEyeX, eyeYPos, eyeR_base, eyeR_base * eyeOpenFactor, 0, 0, Math.PI*2); 
        ctx.fill();

        if (eyeOpenFactor > 0.1) {
            ctx.fillStyle = app.pupilColor || 'black';
            ctx.beginPath(); 
            ctx.arc(mainEyeX + finalPupilShiftX, eyeYPos + finalPupilShiftY, pupilR, 0, Math.PI*2); 
            ctx.fill();
            
            // Main eye highlight
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            const highlightR = pupilR * 0.35;
            ctx.beginPath(); 
            ctx.arc(mainEyeX + finalPupilShiftX + pupilR*0.3, eyeYPos + finalPupilShiftY - pupilR*0.3, highlightR, 0, Math.PI*2); 
            ctx.fill();
        }
    }

    _drawEyebrows(char, headR, expression, ctx, visualFacingMode, visualFacingSign) {
        const app = char.appearance;
        
        // Eyebrow positions relative to eye positions
        const eyeR_base = headR * 0.22; // Reference for positioning
        const eyeYPos = -headR * 0.18;  // Match eye Y
        const fpfMap = {'profile': 0.8, 'threeQuarter': 0.6, 'front': 0.45};
        let xOffsetFactor = fpfMap[visualFacingMode] || 0.8;

        let mainEyeX = headR * 0.33 * xOffsetFactor * visualFacingSign;
        let farEyeX = 0;
        let drawFarBrow = false;

        if (visualFacingMode === 'threeQuarter') {
            mainEyeX = headR * 0.25 * visualFacingSign;
            farEyeX = headR * 0.55 * visualFacingSign;
            drawFarBrow = true;
        } else if (visualFacingMode === 'front') {
            const eyeSeparationFront = headR * 0.30;
            mainEyeX = eyeSeparationFront * visualFacingSign;
            farEyeX = -eyeSeparationFront * visualFacingSign;
            drawFarBrow = true;
        }

        ctx.strokeStyle = app.hairColor || app.beardColor || char.color || 'black';
        ctx.lineWidth = Math.max(1.5, headR * 0.085); // Slightly thicker eyebrows
        
        const eyebrowYBase = eyeYPos - eyeR_base * 1.1; // Base Y pos above eye line
        const eyebrowLengthBase = headR * 0.32; 
        
        let eyebrowTilt = typeof expression.eyebrowTilt === 'function' ? expression.eyebrowTilt(char, visualFacingMode, visualFacingSign) : expression.eyebrowTilt;
        let eyebrowRaise = (typeof expression.eyebrowRaiseF === 'function' ? expression.eyebrowRaiseF(char, visualFacingMode, visualFacingSign) : expression.eyebrowRaiseF) * eyeR_base;

        if (drawFarBrow) {
            const farBrowLengthFactor = (visualFacingMode === 'threeQuarter') ? 0.80 : 0.95;
            let farTilt = eyebrowTilt;
            // For asymmetric expressions like skeptical, or angry in front view, far brow might have different tilt.
            if (expression.name === 'skeptical') { // Example: if main brow up, far brow less so or neutral
                farTilt = (visualFacingSign === 1 ? 5 : -25); // Opposite effect for skeptical
            } else if (visualFacingMode === 'front' && expression.name === 'angry'){
                farTilt = -eyebrowTilt; // Angry front view, brows pinch inwards
            }
            this._drawOneEyebrow(ctx, farEyeX, eyebrowYBase + eyebrowRaise * 0.9, eyebrowLengthBase * farBrowLengthFactor, farTilt, visualFacingSign, visualFacingMode, true);
        }
        // Draw main/front eyebrow
        this._drawOneEyebrow(ctx, mainEyeX, eyebrowYBase + eyebrowRaise, eyebrowLengthBase, eyebrowTilt, visualFacingSign, visualFacingMode, false);
    }

    _drawOneEyebrow(ctx, eyeCenterX, yBase, length, tiltDegrees, characterVisualSign, visualFacingMode, isFarSide) {
        ctx.save();
        ctx.translate(eyeCenterX, yBase);
        
        let finalTiltDegrees = tiltDegrees;
        // In profile, tilt is straightforward. In 3/4 and front, tilt needs to consider perspective.
        // If it's not front view, the tilt is relative to the character's facing direction.
        if (visualFacingMode !== 'front') {
            finalTiltDegrees *= characterVisualSign;
        }
        // If it IS front view, tiltDegrees is absolute (e.g. -15 is inner down for left brow if char facingSign is 1)

        ctx.rotate(finalTiltDegrees * Math.PI / 180);
        
        ctx.beginPath();
        ctx.moveTo(-length / 2, 0);
        const curveIntensity = 0.15 * (1 + Math.abs(tiltDegrees) / 60); // More curve for stronger tilts
        ctx.quadraticCurveTo(0, -length * curveIntensity * (tiltDegrees > 0 ? 1 : (tiltDegrees < 0 ? 0.5 : 0.2)) , length/2, 0); // Curve upwards mostly
        ctx.stroke();
        ctx.restore();
    }

    _drawMouthAndNose(char, headR, expression, ctx, visualFacingMode, visualFacingSign) {
        const app = char.appearance;
        const mouthCharCfg = app.mouth; // Character's specific mouth colors
        const eyeYPos = -headR * 0.18;
        // Nose position
        const noseBaseXOffset = headR * 0.40 * visualFacingSign; // Further out for profile
        const noseYLine = -headR * 0.05; // Approx between eyes and mouth
        
        if (app.nose && visualFacingMode !== 'front') { // No nose in direct front view for this style
            ctx.strokeStyle = this.adjustColor(char.color, -0.15);
            ctx.lineWidth = Math.max(1, headR * 0.035);
            ctx.beginPath();
            const noseBridgeY = eyeYPos + headR * 0.1; // Start nose bridge near eye level
            const noseTipY = headR * 0.20;
            
            let noseRootX = 0;
            let noseTipX = 0;

            if (visualFacingMode === 'profile') {
                noseRootX = headR * 0.30 * visualFacingSign; // Start closer to "center"
                noseTipX = headR * 0.45 * visualFacingSign;  // Tip at contour
                ctx.moveTo(noseRootX, noseBridgeY);
                ctx.quadraticCurveTo(noseTipX * 0.8, noseBridgeY + (noseTipY - noseBridgeY) * 0.4, noseTipX, noseTipY);
                ctx.lineTo(noseTipX - headR * 0.04 * visualFacingSign, noseTipY + headR * 0.06); // Nostril indication
            } else if (visualFacingMode === 'threeQuarter') {
                noseRootX = headR * 0.15 * visualFacingSign;
                noseTipX = headR * 0.30 * visualFacingSign;
                ctx.moveTo(noseRootX, noseBridgeY);
                ctx.quadraticCurveTo(noseTipX * 0.9, noseBridgeY + (noseTipY - noseBridgeY) * 0.5, noseTipX, noseTipY);
            }
            ctx.stroke();
        }

        // Mouth position
        const mouthBaseX = headR * (visualFacingMode === 'profile' ? 0.30 : (visualFacingMode === 'threeQuarter' ? 0.15 : 0)) * visualFacingSign;
        const mouthY = headR * 0.42; // Mouth Y position
        
        const mouthBehav = char.behaviors.mouth;
        let baseShapeKey = mouthBehav.currentShape;
        if (mouthBehav.shapeTransitionProgress < 1 && Animator.MOUTH_SHAPES[mouthBehav.targetShape]) { // Transitioning
            baseShapeKey = mouthBehav.targetShape; 
        }
        if (!Animator.MOUTH_SHAPES[baseShapeKey]) baseShapeKey = 'neutral'; // Fallback

        const mouthShapeDef = Animator.MOUTH_SHAPES[baseShapeKey];
        
        let intensity = 1.0;
        if (char.behaviors.emphasis.active) intensity = this.EXPRESSION_INTENSITY_FACTOR;
        if (expression.name === 'surprised') intensity *= 1.2;

        // Dynamic animation for talking, if shape supports it (e.g. animFactor for height/width)
        let animScalar = (char.isSpeakingTTS || ( (typeof char.activePoseName === 'string' && (char.activePoseName === 'talk' || char.activePoseName.startsWith("talk_"))) && char.dialogueText) ) 
                       ? (0.5 + Math.sin(mouthBehav.animPhase * Math.PI * 2) * 0.5) : 0;
        if (mouthShapeDef.noAnim) animScalar = 0;


        ctx.strokeStyle = mouthCharCfg.color || char.color;
        ctx.lineWidth = Math.max(1, headR * 0.045); // Slightly thicker mouth lines
        ctx.fillStyle = mouthCharCfg.color || char.color; // Default fill for simple lines

        let mouthWidth = headR * mouthShapeDef.wF * intensity * (1 + animScalar * (mouthShapeDef.wFAnimFactor || 0));
        let mouthHeight = headR * mouthShapeDef.hF * intensity * (1 + animScalar * (mouthShapeDef.hFAnimFactor || 0));
        let curveFactor = mouthShapeDef.cF * intensity;

        // Perspective for mouth width
        if (visualFacingMode === 'profile') mouthWidth *= 0.65;
        else if (visualFacingMode === 'threeQuarter') mouthWidth *= 0.80;
        
        ctx.beginPath();
        if (mouthShapeDef.oval) {
            ctx.ellipse(mouthBaseX, mouthY + mouthHeight * 0.1, mouthWidth * 0.5, mouthHeight * 0.5, 0, 0, Math.PI * 2);
            const fillStyle = (mouthShapeDef.tongue && mouthShapeDef.tongue !== 'none') ? mouthCharCfg.tongueColor : this.adjustColor(mouthCharCfg.color || char.color, 0.5);
            ctx.fillStyle = fillStyle;
            ctx.fill();
        } else { // Path-based mouth
            const yTop = mouthY - mouthHeight * 0.5;
            const yBottom = mouthY + mouthHeight * 0.5;
            const cpYOffset = curveFactor * headR * 0.1 * intensity;

            ctx.moveTo(mouthBaseX - mouthWidth * 0.5, mouthY); // Start left corner
            ctx.quadraticCurveTo(mouthBaseX, mouthY + cpYOffset + mouthHeight * 0.5, mouthBaseX + mouthWidth * 0.5, mouthY); // Bottom lip curve to right corner
            
            // If mouth has height (is open), draw top lip and close path
            if (mouthHeight > headR * 0.015 || mouthShapeDef.teeth || mouthShapeDef.tongue) {
                ctx.quadraticCurveTo(mouthBaseX, mouthY + cpYOffset - mouthHeight * 0.5, mouthBaseX - mouthWidth * 0.5, mouthY); // Top lip curve back to left corner
                ctx.closePath();
                
                // Fill open mouth area
                if (mouthShapeDef.tongue && mouthShapeDef.tongue !== 'none' && mouthShapeDef.tongue !== 'tip_visible') {
                    ctx.fillStyle = mouthCharCfg.tongueColor; ctx.fill();
                } else if (!mouthShapeDef.teeth) { // Fill if not showing teeth and not special tongue
                     ctx.fillStyle = this.adjustColor(mouthCharCfg.color || char.color, 0.4); ctx.fill();
                }
            }
        }
        ctx.stroke(); 

        // Draw Teeth
        if (mouthShapeDef.teeth && mouthShapeDef.teeth !== 'none') {
            ctx.fillStyle = mouthCharCfg.teethColor;
            const teethH = Math.max(headR * 0.01, mouthHeight * 0.35); // Min teeth height
            const teethYOffset = mouthHeight * 0.1; // Position teeth slightly inside mouth opening

            if (mouthShapeDef.teeth === 'both' || mouthShapeDef.teeth === 'both_smile' || mouthShapeDef.teeth === 'both_close' || mouthShapeDef.teeth === 'upper_subtle' || mouthShapeDef.teeth === 'upper_touch_lower_lip') { // Upper teeth
                ctx.fillRect(mouthBaseX - mouthWidth * 0.4, mouthY - teethH * 0.5 - teethYOffset * (mouthShapeDef.teeth === 'upper_touch_lower_lip'?0.3:1) , mouthWidth * 0.8, teethH);
            }
            if (mouthShapeDef.teeth === 'both' || mouthShapeDef.teeth === 'both_smile' || (mouthShapeDef.teeth === 'both_close' && mouthHeight > headR * 0.02) ) { // Lower teeth
                 ctx.fillRect(mouthBaseX - mouthWidth * 0.35, mouthY + teethYOffset * 0.5, mouthWidth * 0.7, teethH * 0.8);
            }
        }
        // Draw Tongue Tip
        if (mouthShapeDef.tongue === 'tip_visible') {
            ctx.fillStyle = mouthCharCfg.tongueColor;
            ctx.beginPath();
            const tongueTipY = mouthY + mouthHeight * 0.1; // Tip slightly below center line
            ctx.ellipse(mouthBaseX, tongueTipY, mouthWidth*0.25, mouthHeight*0.3, 0, 0, Math.PI*2);
            ctx.fill();
        }
    }

    _drawCharacterHair(char, headR, visualFacingMode, visualFacingSign) {
        const ctx = this.ctx;
        const app = char.appearance;
        if (!app.hairStyle || app.hairStyle === 'none' || !app.hairColor) return;
        
        const isHatBlockingHair = (app.hat === 'tophat' || app.hat === 'fedora');
        if (isHatBlockingHair && app.hairStyle !== 'ponytail_stub' && !app.hairStyle.startsWith('side_part')) { // Allow some styles with hats
             // return; // Simplified: most hair drawn, hat goes on top. Specific clipping might be needed.
        }

        ctx.fillStyle = app.hairColor;
        ctx.strokeStyle = this.adjustColor(app.hairColor, -0.12); 
        ctx.lineWidth = Math.max(1, headR * 0.035);
        
        // pf: perspective factor for X compression/width of hair mass
        const pfMap = {'profile': 0.7, 'threeQuarter': 0.85, 'front': 1.0};
        let pf = pfMap[visualFacingMode] || 1.0;
        // xShift determines how much hair mass shifts to the "back" of head
        let xShift = headR * 0.10 * (visualFacingMode === 'profile' ? 1 : (visualFacingMode === 'threeQuarter' ? 0.6 : 0)) * -visualFacingSign;
        
        ctx.save();
        ctx.translate(xShift, 0); // Shift entire hair mass based on view

        const hairTopYAnchor = -headR * 0.80; // Base Y where hair starts above head circle
        const hairBaseRadius = headR * 1.0; // Hair generally extends slightly beyond head circle

        switch (app.hairStyle) {
            case 'round_cap':
                ctx.beginPath();
                // Arc covers top-back of head. Adjust start/end angles for perspective.
                const capCoverageStartAngle = Math.PI * (1 - 0.1 * pf * visualFacingSign);
                const capCoverageEndAngle = Math.PI * (0 + 0.1 * pf * visualFacingSign);
                ctx.arc(0, hairTopYAnchor + headR * 0.25, hairBaseRadius * 0.9 * pf, capCoverageStartAngle, capCoverageEndAngle, visualFacingSign < 0);
                ctx.closePath(); ctx.fill();
                break;
            case 'short_spiky':
                ctx.save();
                ctx.translate(0, hairTopYAnchor + headR * 0.15); // Spikes originate from slightly above head
                const numSpikes = 7;
                const spikeAngleCoverage = Math.PI * pf * 0.85; // Spikes cover less in profile
                const angleStartOffset = Math.PI + (Math.PI - spikeAngleCoverage)/2;
                for (let i = 0; i < numSpikes; i++) {
                    let angle = angleStartOffset + (i * spikeAngleCoverage / (numSpikes -1 ));
                    if(visualFacingSign < 0) angle = Math.PI - (angle - Math.PI); // Mirror for left facing

                    // Avoid spikes covering face in profile/3Q
                    if (visualFacingMode !== 'front' && visualFacingSign * Math.cos(angle) > (visualFacingMode === 'profile' ? 0.3 : 0.1) ) continue;

                    let spikeLength = hairBaseRadius * (0.25 + Math.sin(i * 2.5 + char.posePhase * 0.15) * 0.06);
                    let spikeOuterOffset = hairBaseRadius * (0.80 * pf); // Spikes closer to head in profile

                    ctx.beginPath();
                    ctx.moveTo(Math.cos(angle - 0.08) * spikeOuterOffset, Math.sin(angle - 0.08) * spikeOuterOffset * 0.8); // Thinner base
                    ctx.lineTo(Math.cos(angle) * (spikeOuterOffset + spikeLength), Math.sin(angle) * (spikeOuterOffset + spikeLength) * 0.8);
                    ctx.lineTo(Math.cos(angle + 0.08) * spikeOuterOffset, Math.sin(angle + 0.08) * spikeOuterOffset * 0.8);
                    ctx.closePath(); ctx.fill();
                }
                ctx.restore();
                break;
            case 'side_part_right': 
            case 'side_part_left':
                const partSign = app.hairStyle === 'side_part_right' ? 1 : -1;
                const sideHairTopY = hairTopYAnchor - headR * 0.1; // Part starts high
                ctx.beginPath();
                // Part line is more towards center in front view, shifted in profile/3Q
                const partOriginX = headR * 0.3 * (visualFacingMode === 'front' ? partSign * 0.5 : (visualFacingMode === 'threeQuarter' ? partSign*0.2 : 0) );
                
                // Front sweep (bangs area)
                const frontSweepX = headR * 0.7 * pf * visualFacingSign * partSign; // Direction of sweep
                const frontSweepYEnd = hairTopYAnchor + headR * (visualFacingMode === 'profile' ? 0.6 : 0.9);
                
                ctx.moveTo(partOriginX, sideHairTopY); // Start of part
                // Curve over top/front to create fringe
                ctx.quadraticCurveTo(frontSweepX * 0.3, sideHairTopY - headR * 0.3, frontSweepX, frontSweepYEnd);
                
                // Side/back coverage
                const backCoverageX = -headR * 0.8 * pf * visualFacingSign; // Back of head hair mass
                const backCoverageY = hairTopYAnchor + headR * 1.5; // Lower back hair
                ctx.quadraticCurveTo(frontSweepX * 0.8, backCoverageY * 0.8, backCoverageX, backCoverageY);
                
                // Curve back up to part origin
                ctx.quadraticCurveTo(partOriginX * 0.5 - headR * 0.3 * visualFacingSign, sideHairTopY + headR, partOriginX, sideHairTopY);
                ctx.closePath();
                ctx.fill();
                break;
            case 'simple_bob':
                ctx.beginPath();
                const bobTopY = hairTopYAnchor + headR * 0.1;
                // Arc over the top
                ctx.arc(0, bobTopY, hairBaseRadius * 1.05 * pf, Math.PI * 1.05, Math.PI * -0.05);
                
                // Determine front and back points of bob "hemline"
                // Front point should not obscure face
                let frontHemXFactor = visualFacingMode === 'profile' ? 0.15 : (visualFacingMode === 'threeQuarter' ? 0.35 : 0.6);
                const frontHemX = headR * frontHemXFactor * visualFacingSign;
                // Back point provides volume at back of head
                const backHemX = -headR * 0.7 * visualFacingSign * pf; 
                const hemY = hairTopYAnchor + headR * 1.4; // Bob length

                ctx.lineTo(frontHemX - xShift, hemY); // Counteract xShift for front edge to align with face
                ctx.quadraticCurveTo(0, hemY + headR * 0.1, backHemX, hemY - headR*0.05); // Slightly curved hemline
                ctx.closePath();
                ctx.fill();
                break;
            case 'ponytail_stub':
                // Basic cap of hair
                ctx.beginPath(); 
                ctx.arc(0, hairTopYAnchor + headR * 0.25, hairBaseRadius * 0.9 * pf, Math.PI, 0); // Covers top half
                ctx.closePath(); ctx.fill();
                
                // Ponytail stub
                ctx.beginPath();
                const stubX = -headR * (0.55 + 0.15 * (1-pf)) * visualFacingSign; // Stub at back of head
                const stubY = hairTopYAnchor + headR * 0.7;
                ctx.ellipse(stubX, stubY, headR * 0.22 * pf, headR * 0.33, -15 * visualFacingSign * Math.PI/180, 0, Math.PI * 2);
                ctx.fill();
                break;
        }
        ctx.restore();
    }

    _drawCharacterAccessories(char, headR, rawHeadTilt, visualFacingMode, visualFacingSign) {
        const ctx = this.ctx;
        const app = char.appearance;
        
        // pf: perspective factor for X compression [profile, threeQuarter, front]
        const pfMapHat = {'profile': 0.8, 'threeQuarter': 0.9, 'front': 1.0}; // Hats often look wider
        const pfMapBeard = {'profile': 0.7, 'threeQuarter': 0.85, 'front': 1.0};

        let hatPf = pfMapHat[visualFacingMode] || 1.0;
        let beardPf = pfMapBeard[visualFacingMode] || 1.0;
        
        // xShift for accessories: more subtle, mainly for profile/3Q to suggest depth
        let xShiftAcc = headR * 0.03 * (visualFacingMode === 'profile' ? 1 : (visualFacingMode === 'threeQuarter' ? 0.4:0)) * -visualFacingSign;
        
        // Use pose-defined head tilt (rawHeadTilt) for accessory sway reference, not the lookAt-modified tilt
        const accessorySwayAngleRad = char.behaviors.accessorySway.angle * Math.PI / 180;

        if (app.beard !== 'none' && app.beardColor) {
            ctx.fillStyle = app.beardColor;
            const mouthY = headR * 0.42; // Reference mouth Y
            // Beard center slightly offset by perspective, more so in profile
            const beardXCenter = headR * (visualFacingMode === 'profile' ? 0.25 : (visualFacingMode === 'threeQuarter' ? 0.1 : 0)) * visualFacingSign;
            
            ctx.save(); 
            if (app.beard === 'full_beard') ctx.rotate(accessorySwayAngleRad * 0.3); // Full beard sways a bit
            ctx.translate(xShiftAcc + beardXCenter, 0); // Apply shift and centering
            
            switch(app.beard) {
                case 'goatee':
                    ctx.beginPath();
                    const goateeWidth = headR*0.12*beardPf;
                    ctx.moveTo(-goateeWidth, mouthY + headR*0.03); // Start near mouth corner
                    ctx.quadraticCurveTo(0, mouthY + headR*0.35*beardPf, goateeWidth, mouthY + headR*0.03);
                    ctx.closePath(); ctx.fill();
                    break;
                case 'full_beard':
                    ctx.beginPath();
                    const beardTopWidth = headR * 0.35 * beardPf;
                    const beardBottomWidth = headR * 0.25 * beardPf;
                    const beardLength = headR * 0.5 * beardPf;
                    
                    ctx.moveTo(-beardTopWidth, mouthY - headR*0.1); // Sideburn start
                    ctx.lineTo(beardTopWidth, mouthY - headR*0.1);   // Across upper lip/cheek
                    ctx.quadraticCurveTo(beardTopWidth * 0.8, mouthY + beardLength * 0.7, beardBottomWidth * 0.5, mouthY + beardLength); // Right jawline
                    ctx.quadraticCurveTo(0, mouthY + beardLength * 1.1, -beardBottomWidth * 0.5, mouthY + beardLength); // Chin bottom
                    ctx.quadraticCurveTo(-beardTopWidth * 0.8, mouthY + beardLength * 0.7, -beardTopWidth, mouthY - headR*0.1); // Left jawline
                    ctx.closePath(); ctx.fill();
                    break;
            }
            ctx.restore();
        }

        if (app.hat !== 'none' && app.hatColor) {
            ctx.fillStyle = app.hatColor;
            ctx.strokeStyle = this.adjustColor(app.hatColor, -0.20); 
            ctx.lineWidth = Math.max(1, headR * 0.025);
            
            ctx.save();
            // Most hats sway with head, yarmulke less so or not at all
            if (app.hat !== 'yarmulke') {
                 ctx.rotate(accessorySwayAngleRad);
            }
            ctx.translate(xShiftAcc, 0); // Apply general accessory shift
            
            const hatBaseY = -headR * 0.85; // Where hat sits on head
            switch(app.hat) {
                case 'yarmulke': 
                    ctx.beginPath();
                    const yarmulkeRadius = headR * 0.50;
                    const yarmulkeY = hatBaseY + headR*0.30;
                    // Ellipse for perspective, more circular in front view
                    ctx.ellipse(0, yarmulkeY, yarmulkeRadius * hatPf, yarmulkeRadius * (visualFacingMode==='front'? 0.9 : (visualFacingMode==='threeQuarter' ? 0.7 : 0.5)), 0, Math.PI, 0, visualFacingSign > 0);
                    ctx.closePath();
                    ctx.fill();
                    if (app.hatColor !== 'black' && app.hatColor !== '#000000' && app.hatColor !== '#222222' && !app.hatColor.startsWith('#1')) ctx.stroke(); // Stroke if not very dark
                    break;
                case 'baseball_cap':
                    const capCrownY = hatBaseY + headR*0.25;
                    const capRadius = headR*0.75;
                    ctx.beginPath(); 
                    // Crown shape, slightly elliptical based on view
                    ctx.arc(0, capCrownY, capRadius * hatPf, Math.PI * (1-0.02*hatPf*visualFacingSign), -Math.PI*0.02 * (1-0.02*hatPf*-visualFacingSign), visualFacingSign < 0); 
                    ctx.fill(); ctx.stroke();
                    
                    // Brim
                    ctx.save();
                    ctx.fillStyle = app.hatColor; 
                    let brimWidthFactor = visualFacingMode === 'front' ? 1.3 : (visualFacingMode === 'threeQuarter' ? 1.0 : 0.6);
                    let brimHeightFactor = 0.45;
                    let brimX = headR * 0.4 * hatPf * visualFacingSign * (visualFacingMode === 'profile' ? 0.9 : (visualFacingMode === 'threeQuarter' ? 1.1 : 0));
                    let brimY = capCrownY + headR*0.15;

                    ctx.beginPath(); 
                    ctx.ellipse(brimX, brimY, capRadius*brimWidthFactor*0.5, capRadius*brimHeightFactor*0.5, visualFacingSign * (visualFacingMode === 'profile' ? 0 : (visualFacingMode === 'threeQuarter' ? 5 : 0)) * Math.PI/180, 0, Math.PI*2);
                    ctx.fill(); ctx.stroke();
                    ctx.restore();
                    break;
                 case 'fedora': // Or Tophat
                 case 'tophat':
                    const isTophat = app.hat === 'tophat';
                    const brimBaseY = hatBaseY + headR * (isTophat ? 0.20 : 0.30);
                    const brimWidth = headR * 1.05 * hatPf;
                    const brimDepth = headR * (isTophat ? 0.25 : 0.35); // Shallower brim for tophat
                    ctx.beginPath();
                    ctx.ellipse(0, brimBaseY, brimWidth, brimDepth, 0, 0, Math.PI*2); // Brim
                    ctx.fill(); ctx.stroke();
                    
                    // Crown
                    const crownWidthFactor = isTophat ? 0.55 : 0.60;
                    const crownHeightFactor = isTophat ? 1.0 : 0.8;
                    const crownWidth = headR * crownWidthFactor * hatPf;
                    const crownHeight = headR * crownHeightFactor;
                    ctx.fillRect(-crownWidth/2, brimBaseY - crownHeight, crownWidth, crownHeight);
                    ctx.strokeRect(-crownWidth/2, brimBaseY - crownHeight, crownWidth, crownHeight);
                    
                    // Hat Band
                    const bandHeight = headR * 0.18;
                    ctx.fillStyle = this.adjustColor(app.hatColor, -0.35); 
                    ctx.fillRect(-crownWidth/2 * 1.02, brimBaseY - bandHeight, crownWidth * 1.04, bandHeight);
                    break;
            }
            ctx.restore();
        }
    }

    adjustColor(color, percent) {
        if (!color || typeof color !== 'string' || !color.startsWith("#")) return color; 
        try {
            let num = parseInt(color.replace("#",""), 16);
            let amt = Math.round(2.55 * percent * 10); // percent is -100 to 100
            let R = (num >> 16) + amt;
            let G = (num >> 8 & 0x00FF) + amt;
            let B = (num & 0x0000FF) + amt;
            R = Math.max(0, Math.min(255, R));
            G = Math.max(0, Math.min(255, G));
            B = Math.max(0, Math.min(255, B));
            return "#" + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1).toUpperCase();
        } catch (e) {
            console.warn("Error adjusting color:", color, e);
            return color; // Return original on error
        }
    }

    _calculateSpeechBubbleScreenMetrics(character) {
        const text = character.dialogueText;
        if (!text || typeof text !== 'string' || text.trim() === "") return null;

        const cfg = this.speechBubbleConfig;
        const pose = this._getCharacterPoseDetails(character); 
        if (!pose || !pose.head) return null; // Can't place bubble if no pose

        const headScreenPos = this._worldToScreen(pose.head.x, pose.head.y - pose.head.r * 0.5); // Anchor slightly above head center
        const charScreenX = headScreenPos[0];
        const charScreenAnchorY = headScreenPos[1];

        this.ctx.font = `${cfg.fontSizeScreen}px ${cfg.fontFamily}`;
        this.ctx.textAlign = 'left'; this.ctx.textBaseline = 'top';

        const maxWidthBubble = Math.max(cfg.minWidthScreen, this.canvas.width * cfg.maxWidthScreenFactor);
        const lines = this._wrapTextScreen(text, maxWidthBubble);
        if (!lines.length) return null;

        let textBlockHeight = lines.length * (cfg.fontSizeScreen * cfg.lineHeightFactor);
        if (lines.length === 1 && lines[0] === "") textBlockHeight = 0; // Handle empty string after wrapping
        
        let textBlockWidth = 0;
        lines.forEach(line => { textBlockWidth = Math.max(textBlockWidth, this.ctx.measureText(line).width); });

        const bubbleWidthScreen = textBlockWidth + 2 * cfg.paddingScreen;
        const bubbleHeightScreen = textBlockHeight + 2 * cfg.paddingScreen;

        let bubbleScreenX = charScreenX - bubbleWidthScreen / 2;
        let bubbleScreenY = charScreenAnchorY - cfg.marginScreen.top - bubbleHeightScreen - cfg.pointerHeightScreen;
        let pointerPointsUp = false; // Pointer points from bubble down to character head

        const canvasPadding = 15; // Increased padding
        if (bubbleScreenY < canvasPadding) { // Bubble too high, flip to be below character
            bubbleScreenY = charScreenAnchorY + cfg.marginScreen.top + pose.head.r * this.cameraState.zoom * 0.2; 
            pointerPointsUp = true; // Pointer points from bubble up to character head
        }
        // Ensure bubble (with pointer) doesn't go off bottom
        if (bubbleScreenY + bubbleHeightScreen + (pointerPointsUp ? cfg.pointerHeightScreen : 0) > this.canvas.height - canvasPadding) {
             bubbleScreenY = this.canvas.height - canvasPadding - bubbleHeightScreen - (pointerPointsUp ? cfg.pointerHeightScreen : 0);
        }
        // Ensure bubble (with pointer) doesn't go off top if flipped
        if (pointerPointsUp && bubbleScreenY < canvasPadding + cfg.pointerHeightScreen) {
            bubbleScreenY = canvasPadding + cfg.pointerHeightScreen;
        }

        // Horizontal constraints
        if (bubbleScreenX < canvasPadding) bubbleScreenX = canvasPadding;
        if (bubbleScreenX + bubbleWidthScreen > this.canvas.width - canvasPadding) {
            bubbleScreenX = this.canvas.width - canvasPadding - bubbleWidthScreen;
        }
        
        return {
            lines, text,
            charScreenX, charScreenAnchorY, 
            screenX: bubbleScreenX, screenY: bubbleScreenY,
            widthScreen: bubbleWidthScreen, heightScreen: bubbleHeightScreen,
            pointerHeightScreen: cfg.pointerHeightScreen,
            pointerWidthScreen: cfg.pointerWidthScreen,
            paddingScreen: cfg.paddingScreen,
            cornerRadiusScreen: cfg.cornerRadiusScreen,
            pointerPointsUp: pointerPointsUp, // True if bubble is BELOW character, pointer aims UP
            cfg
        };
    }
    _drawSpeechBubbleScreenSpace(character) {
        const m = this._calculateSpeechBubbleScreenMetrics(character);
        if (!m) return;
        const ctx = this.ctx;

        ctx.save();
        if (m.cfg.shadow && m.cfg.shadow.blur > 0) { 
            ctx.shadowColor = m.cfg.shadow.color;
            ctx.shadowBlur = m.cfg.shadow.blur;
            ctx.shadowOffsetX = m.cfg.shadow.offsetX; 
            ctx.shadowOffsetY = m.cfg.shadow.offsetY;
        }

        ctx.fillStyle = m.cfg.bgColor; ctx.strokeStyle = m.cfg.borderColor; ctx.lineWidth = 1.5;

        // Draw main bubble rectangle with rounded corners
        ctx.beginPath();
        ctx.moveTo(m.screenX + m.cornerRadiusScreen, m.screenY);
        ctx.lineTo(m.screenX + m.widthScreen - m.cornerRadiusScreen, m.screenY); // Top edge
        ctx.quadraticCurveTo(m.screenX + m.widthScreen, m.screenY, m.screenX + m.widthScreen, m.screenY + m.cornerRadiusScreen); // Top-right corner
        ctx.lineTo(m.screenX + m.widthScreen, m.screenY + m.heightScreen - m.cornerRadiusScreen); // Right edge
        ctx.quadraticCurveTo(m.screenX + m.widthScreen, m.screenY + m.heightScreen, m.screenX + m.widthScreen - m.cornerRadiusScreen, m.screenY + m.heightScreen); // Bottom-right corner
        ctx.lineTo(m.screenX + m.cornerRadiusScreen, m.screenY + m.heightScreen); // Bottom edge
        ctx.quadraticCurveTo(m.screenX, m.screenY + m.heightScreen, m.screenX, m.screenY + m.heightScreen - m.cornerRadiusScreen); // Bottom-left corner
        ctx.lineTo(m.screenX, m.screenY + m.cornerRadiusScreen); // Left edge
        ctx.quadraticCurveTo(m.screenX, m.screenY, m.screenX + m.cornerRadiusScreen, m.screenY); // Top-left corner
        ctx.closePath();
        ctx.fill();
        if (m.cfg.shadow && m.cfg.shadow.blur > 0) { // Clear shadow for stroke and pointer
             ctx.shadowColor = 'transparent'; 
             ctx.shadowBlur = 0; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;
        }
        ctx.stroke(); 

        // Draw pointer
        ctx.fillStyle = m.cfg.bgColor; // Pointer should match bubble fill
        ctx.beginPath();
        let pointerBaseY, pointerTipY_actual;
        let pointerAttachX = m.charScreenX; // Ideal attachment point on bubble X-axis
        
        // Clamp pointerAttachX to be within bubble body (not on rounded corners)
        const minAttachX = m.screenX + m.pointerWidthScreen / 2 + m.cornerRadiusScreen * 0.5;
        const maxAttachX = m.screenX + m.widthScreen - m.pointerWidthScreen / 2 - m.cornerRadiusScreen * 0.5;
        pointerAttachX = Math.max(minAttachX, Math.min(maxAttachX, pointerAttachX));

        if (m.pointerPointsUp) { // Bubble is BELOW character, pointer aims UP
            pointerBaseY = m.screenY; // Base of pointer is top edge of bubble
            pointerTipY_actual = m.charScreenAnchorY; // Tip is at character's anchor
            ctx.moveTo(pointerAttachX - m.pointerWidthScreen / 2, pointerBaseY);
            ctx.lineTo(pointerAttachX + m.pointerWidthScreen / 2, pointerBaseY);
            ctx.lineTo(m.charScreenX, pointerTipY_actual - m.pointerHeightScreen); // Point "upwards"
        } else { // Bubble is ABOVE character, pointer aims DOWN
            pointerBaseY = m.screenY + m.heightScreen; // Base of pointer is bottom edge of bubble
            pointerTipY_actual = m.charScreenAnchorY;
            ctx.moveTo(pointerAttachX - m.pointerWidthScreen / 2, pointerBaseY);
            ctx.lineTo(pointerAttachX + m.pointerWidthScreen / 2, pointerBaseY);
            ctx.lineTo(m.charScreenX, pointerTipY_actual + m.pointerHeightScreen); // Point "downwards"
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke(); // Stroke pointer too
        ctx.restore(); // Restore from shadow-clearing state if any

        // Draw text
        ctx.fillStyle = m.cfg.textColor;
        ctx.font = `${m.cfg.fontSizeScreen}px ${m.cfg.fontFamily}`;
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        m.lines.forEach((line, i) => {
            if (line.trim() === "") return;
            const lineWidth = ctx.measureText(line).width;
            // Center text lines horizontally within the bubble
            const lineX = m.screenX + (m.widthScreen - lineWidth) / 2;
