            },
            'talk_excited_bouncing': {
                bobOffset: (p, H, chr) => Math.abs(Math.sin(p * 1.5)) * H * 0.035, // Faster, larger bob
                headTilt: (p, H, chr) => Math.sin(p * 1.5) * 5,
                l_arm: { type: 'ik_target', targetId: 'body', targetPoint: { xF: -0.1, yF: 0 }, handOffsetDynamic: { xF: p=>-0.05, yF: p => Math.sin(p*1.5)*0.1 } },
                r_arm: { type: 'ik_target', targetId: 'body', targetPoint: { xF: 0.1, yF: 0 }, handOffsetDynamic: { xF: p=>0.05, yF: p => Math.cos(p*1.5)*0.1 } },
            },
            'talk_skeptical_headtilt': {
                headTilt: (p, H, chr) => (chr.facing === 'left' ? -1 : 1) * (25 + Math.sin(p*0.2)*3), // Sharp constant tilt
                l_arm: { type: 'ik_target', targetId: 'body', targetPoint: { xF: 0.15, yF: -0.25 }, handOffset: { xF: 0, yF: 0 } }, // Arms crossed
                r_arm: { type: 'ik_target', targetId: 'body', targetPoint: { xF: -0.15, yF: -0.25 }, handOffset: { xF: 0, yF: 0 } },
            },
            'talk_calm_hands_folded': {
                headTilt: (p, H, chr) => Math.sin(p * 0.5) * 1.5,
                l_arm: { type: 'ik_target', targetId: 'body', targetPoint: { xF: 0.0, yF: 0.35 }, handOffset: { xF: -0.015, yF: 0 } }, // Clasped bit higher
                r_arm: { type: 'ik_target', targetId: 'body', targetPoint: { xF: 0.0, yF: 0.35 }, handOffset: { xF: 0.015, yF: 0 } },
            },
        };
        for (const poseName in this.poseDefinitions) {
            const pDef = this.poseDefinitions[poseName];
            if (!pDef.l_leg) pDef.l_leg = this.poseDefinitions.idle_default.l_leg;
            if (!pDef.r_leg) pDef.r_leg = this.poseDefinitions.idle_default.r_leg;
            if (!pDef.l_arm && this.poseDefinitions.idle_default.l_arm) pDef.l_arm = this.poseDefinitions.idle_default.l_arm;
            if (!pDef.r_arm && this.poseDefinitions.idle_default.r_arm) pDef.r_arm = this.poseDefinitions.idle_default.r_arm;

        }
    }

    _getCharacterPoseDetails(char) {
        const H = this.FIGURE_BASE_HEIGHT * char.size;
        
        const currentVisualFacingSign = char.behaviors.turning.isActive ? char.behaviors.turning.visualFacingSign : (char.facing === 'left' ? -1 : 1);
        const currentVisualFacingMode = char.behaviors.turning.isActive ? char.behaviors.turning.visualFacingMode : char.facingMode;

        const p_y_levels = {
            hipCenterY: char.y - (this.LEG_UPPER_F + this.LEG_LOWER_F) * H,
            neckBaseY: char.y - (this.LEG_UPPER_F + this.LEG_LOWER_F + this.BODY_LENGTH_F) * H,
            headCenterY: char.y - (this.LEG_UPPER_F + this.LEG_LOWER_F + this.BODY_LENGTH_F + this.NECK_LENGTH_F + this.HEAD_RADIUS_F) * H,
            shoulderY: char.y - (this.LEG_UPPER_F + this.LEG_LOWER_F + this.BODY_LENGTH_F * 0.9) * H,
        };
        
        const facingModeFactors = { // [profile, threeQuarter, front]
            shoulderWidth: [1.0, 0.7, 0.3],
            hipWidth: [1.0, 0.6, 0.3], // Hips might appear wider in profile than shoulders for stick figs
            limbPerspective: [1.0, 0.8, 0.4] // How much limbs are foreshortened/angled in X
        };
        const facingModeIndex = currentVisualFacingMode === 'profile' ? 0 : (currentVisualFacingMode === 'threeQuarter' ? 1 : 2);

        const shoulderWidth = this.SHOULDER_WIDTH_F * H * facingModeFactors.shoulderWidth[facingModeIndex];
        const hipWidth = this.HIP_WIDTH_F * H * facingModeFactors.hipWidth[facingModeIndex];
        const limbPerspectiveFactor = facingModeFactors.limbPerspective[facingModeIndex];
        
        const p_origins = {
            l_arm_sx: char.x - shoulderWidth * 0.5 * currentVisualFacingSign,
            l_arm_sy: p_y_levels.shoulderY,
            r_arm_sx: char.x + shoulderWidth * 0.5 * currentVisualFacingSign,
            r_arm_sy: p_y_levels.shoulderY,
            l_leg_hx: char.x - hipWidth * 0.5 * currentVisualFacingSign,
            l_leg_hy: p_y_levels.hipCenterY,
            r_leg_hx: char.x + hipWidth * 0.5 * currentVisualFacingSign,
            r_leg_hy: p_y_levels.hipCenterY,
            head_center_x: char.x, // Base head X before lean
            head_center_y: p_y_levels.headCenterY,
            neck_base_x: char.x,
            neck_base_y: p_y_levels.neckBaseY,
            hip_center_x: char.x,
            hip_center_y: p_y_levels.hipCenterY,
        };
        
        const phase = char.posePhase;
        
        let activePName = char.activePoseName;
        if (activePName === 'talk') activePName = char.currentTalkPose || 'talk_gesture1';
        if (activePName === 'idle') activePName = char.behaviors.idleBehavior.currentIdleVariation || 'idle_default';
        
        let prevPName = char.previousPoseName;
        if (prevPName === 'talk') prevPName = char.currentTalkPose; 
        if (prevPName === 'idle') prevPName = char.behaviors.idleBehavior.currentIdleVariation || 'idle_default';
        
        const sPoseDataCurrent = this._getSpecificPoseData(char, prevPName, H, p_origins, p_y_levels, currentVisualFacingSign, limbPerspectiveFactor, phase, currentVisualFacingMode);
        const sPoseDataTarget = this._getSpecificPoseData(char, activePName, H, p_origins, p_y_levels, currentVisualFacingSign, limbPerspectiveFactor, phase, currentVisualFacingMode);
        
        const specificPoseData = this._interpolatePoseDetails(sPoseDataCurrent, sPoseDataTarget, char.poseTransitionProgress);        
        
        // Apply shoulder offset from poses like shrug
        const shoulderOffsetY = specificPoseData.shoulderOffsetY || 0;
        p_origins.l_arm_sy += shoulderOffsetY;
        p_origins.r_arm_sy += shoulderOffsetY;
        p_y_levels.neckBaseY += shoulderOffsetY; // Neck base also moves with shoulders

        let rawHeadTilt = specificPoseData.headTilt;
        let finalHeadTilt = rawHeadTilt;
        if (char.behaviors.lookAt.isActive) {
            finalHeadTilt += char.behaviors.lookAt.currentHeadAngle;
        }
        finalHeadTilt = Math.max(-85, Math.min(85, finalHeadTilt));

        let pose = {
            head: { x: p_origins.head_center_x + (specificPoseData.bodyLean || 0), y: p_y_levels.headCenterY, r: this.HEAD_RADIUS_F * H, headTilt: finalHeadTilt, rawTilt: rawHeadTilt },
            body: { x1: p_origins.hip_center_x, y1: p_y_levels.hipCenterY, x2: p_origins.neck_base_x + (specificPoseData.bodyLean || 0) + (specificPoseData.bodyX2Offset || 0), y2: p_y_levels.neckBaseY },
            l_arm: { sx: p_origins.l_arm_sx + (specificPoseData.bodyLean || 0), sy: p_origins.l_arm_sy, ...specificPoseData.l_arm },
            r_arm: { sx: p_origins.r_arm_sx + (specificPoseData.bodyLean || 0), sy: p_origins.r_arm_sy, ...specificPoseData.r_arm },
            l_leg: { hx: p_origins.l_leg_hx, hy: p_origins.l_leg_hy, ...specificPoseData.l_leg },
            r_leg: { hx: p_origins.r_leg_hx, hy: p_origins.r_leg_hy, ...specificPoseData.r_leg }
        };

        let bobOffset = typeof specificPoseData.bobOffset === 'number' ? specificPoseData.bobOffset : 0;
        const partsToBob = [pose.head, pose.body, pose.l_arm, pose.r_arm, pose.l_leg, pose.r_leg];
        partsToBob.forEach(part => {
            for (const key in part) {
                if ((key.endsWith('y') || key.endsWith('y1') || key.endsWith('y2') || 
                     key.endsWith('sy') || key.endsWith('ey') || key.endsWith('hy') || 
                     key.endsWith('ky') || key.endsWith('fy')) && typeof part[key] === 'number') {
                    part[key] -= bobOffset;
                }
            }
        });
        
        return pose;
    }

        _getSpecificPoseData(char, poseName, H, p_origins, p_y_levels, facingSign, limbPerspectiveFactor, phase, facingMode) {
        const A_U = this.ARM_UPPER_F * H; const A_L = this.ARM_LOWER_F * H;
        const L_U = this.LEG_UPPER_F * H; const L_L = this.LEG_LOWER_F * H;
        const { l_arm_sx, l_arm_sy, r_arm_sx, r_arm_sy, l_leg_hx, l_leg_hy, r_leg_hx, r_leg_hy } = p_origins;

        let outputPoseData = { headTilt: 0, bobOffset: 0, bodyX2Offset: 0, bodyLean: 0, shoulderOffsetY:0, l_arm: {}, r_arm: {}, l_leg: {}, r_leg: {} };
        const bodyCenterAllowance = H * 0.02;

        const pDef = this.poseDefinitions[poseName] || this.poseDefinitions['idle_default'];

        const evalParam = (param, p, H, chr) => typeof param === 'function' ? param(p, H, chr) : param;

        // Calculate these first as they might be needed by IK targets or other calculations
        if (pDef.headTilt) outputPoseData.headTilt = evalParam(pDef.headTilt, phase, H, char) * facingSign;
        if (pDef.bobOffset) outputPoseData.bobOffset = evalParam(pDef.bobOffset, phase, H, char);
        if (pDef.bodyX2Offset) outputPoseData.bodyX2Offset = evalParam(pDef.bodyX2Offset, phase, H, char) * facingSign;
        if (pDef.bodyLean) outputPoseData.bodyLean = evalParam(pDef.bodyLean, phase, H, char) * facingSign;
        if (pDef.shoulderOffsetYDynamic) outputPoseData.shoulderOffsetY = evalParam(pDef.shoulderOffsetYDynamic, phase, H, char);
        else if (pDef.shoulderOffsetY) outputPoseData.shoulderOffsetY = pDef.shoulderOffsetY;

        // Store the calculated bodyLean for use within this function pass, especially for IK
        const currentBodyLean = outputPoseData.bodyLean || 0;


        if (poseName === 'walk' || poseName === 'run') {
            const isRunning = poseName === 'run';
            const cycle = Math.sin(phase * 0.5); 
            const absCycle = Math.abs(cycle);

            let legAngleRange = isRunning ? { fwd: 75, back: 55, kneeLift: 60 } : { fwd: 60, back: 45, kneeLift: 40 };
            let armAngleRange = isRunning ? { fwd: 70, back: 60 } : { fwd: 55, back: 45 };
            
            let lLegAngleDeg = cycle * (cycle > 0 ? legAngleRange.fwd : legAngleRange.back);
            let lKneeBend = (0.3 + absCycle * 0.6) * (isRunning ? 1.2 : 1);
            outputPoseData.l_leg.kx = l_leg_hx + L_U * Math.sin(lLegAngleDeg * Math.PI/180 * 0.5 * lKneeBend) * facingSign * limbPerspectiveFactor;
            outputPoseData.l_leg.ky = l_leg_hy + L_U * Math.cos(lLegAngleDeg * Math.PI/180 * 0.5 * lKneeBend);
            outputPoseData.l_leg.fx = outputPoseData.l_leg.kx + L_L * Math.sin(lLegAngleDeg * Math.PI/180) * facingSign * limbPerspectiveFactor;
            outputPoseData.l_leg.fy = outputPoseData.l_leg.ky + L_L * Math.cos(lLegAngleDeg * Math.PI/180);

            let rLegAngleDeg = -cycle * (cycle < 0 ? legAngleRange.fwd : legAngleRange.back);
            let rKneeBend = (0.3 + absCycle * 0.6) * (isRunning ? 1.2 : 1);
            outputPoseData.r_leg.kx = r_leg_hx + L_U * Math.sin(rLegAngleDeg * Math.PI/180 * 0.5 * rKneeBend) * facingSign * limbPerspectiveFactor;
            outputPoseData.r_leg.ky = r_leg_hy + L_U * Math.cos(rLegAngleDeg * Math.PI/180 * 0.5 * rKneeBend);
            outputPoseData.r_leg.fx = outputPoseData.r_leg.kx + L_L * Math.sin(rLegAngleDeg * Math.PI/180) * facingSign * limbPerspectiveFactor;
            outputPoseData.r_leg.fy = outputPoseData.r_leg.ky + L_L * Math.cos(rLegAngleDeg * Math.PI/180);

            let rArmAngleDeg = cycle * (cycle > 0 ? armAngleRange.fwd : armAngleRange.back);
            outputPoseData.r_arm.ex = r_arm_sx + A_U * Math.sin(rArmAngleDeg * Math.PI/180 * 0.6) * facingSign * limbPerspectiveFactor;
            outputPoseData.r_arm.ey = r_arm_sy + A_U * Math.cos(rArmAngleDeg * Math.PI/180 * 0.6);
            outputPoseData.r_arm.hx = outputPoseData.r_arm.ex + A_L * Math.sin(rArmAngleDeg * Math.PI/180) * facingSign * limbPerspectiveFactor;
            outputPoseData.r_arm.hy = outputPoseData.r_arm.ey + A_L * Math.cos(rArmAngleDeg * Math.PI/180);
            
            let lArmAngleDeg = -cycle * (cycle < 0 ? armAngleRange.fwd : armAngleRange.back);
            outputPoseData.l_arm.ex = l_arm_sx + A_U * Math.sin(lArmAngleDeg * Math.PI/180 * 0.6) * facingSign * limbPerspectiveFactor;
            outputPoseData.l_arm.ey = l_arm_sy + A_U * Math.cos(lArmAngleDeg * Math.PI/180 * 0.6);
            outputPoseData.l_arm.hx = outputPoseData.l_arm.ex + A_L * Math.sin(lArmAngleDeg * Math.PI/180) * facingSign * limbPerspectiveFactor;
            outputPoseData.l_arm.hy = outputPoseData.l_arm.ey + A_L * Math.cos(lArmAngleDeg * Math.PI/180);
        } else { 
            ['l_arm', 'r_arm'].forEach(limbKey => {
                const armDef = pDef[limbKey];
                const S_X = limbKey === 'l_arm' ? l_arm_sx : r_arm_sx;
                const S_Y = limbKey === 'l_arm' ? l_arm_sy : r_arm_sy;
                const preferClockwiseBend = limbKey === 'r_arm';

                if (armDef) {
                    if (armDef.type === 'ik_target') {
                        let targetX_abs, targetY_abs;
                        
                        if (armDef.targetId === 'body') {
                            if (typeof armDef.targetPoint === 'string') {
                                if (armDef.targetPoint === 'hip_left') { targetX_abs = p_origins.l_leg_hx; targetY_abs = p_origins.l_leg_hy; }
                                else if (armDef.targetPoint === 'hip_right') { targetX_abs = p_origins.r_leg_hx; targetY_abs = p_origins.r_leg_hy; }
                                else { targetX_abs = p_origins.hip_center_x + currentBodyLean; targetY_abs = p_origins.hip_center_y; }
                            } else { 
                                targetX_abs = p_origins.hip_center_x + currentBodyLean + evalParam(armDef.targetPoint.xF, phase, H, char) * H * facingSign;
                                targetY_abs = p_origins.hip_center_y + evalParam(armDef.targetPoint.yF, phase, H, char) * H;
                            }
                        } else if (armDef.targetId === 'head') {
                            if (armDef.targetPoint === 'chin') {
                                targetX_abs = p_origins.head_center_x + currentBodyLean;
                                targetY_abs = p_origins.head_center_y + this.HEAD_RADIUS_F * H * 0.8;
                            } else if (armDef.targetPoint === 'chin_side') {
                                targetX_abs = p_origins.head_center_x + currentBodyLean + (this.HEAD_RADIUS_F * H * 0.3 * facingSign * limbPerspectiveFactor);
                                targetY_abs = p_origins.head_center_y + this.HEAD_RADIUS_F * H * 0.7;
                            }
                            else { targetX_abs = p_origins.head_center_x + currentBodyLean; targetY_abs = p_origins.head_center_y; }
                        } else { 
                            targetX_abs = p_origins.hip_center_x + currentBodyLean + 0.1 * H * facingSign;
                            targetY_abs = p_origins.hip_center_y + 0.1 * H;
                        }

                        let handOffsetX = 0, handOffsetY = 0;
                        if (armDef.handOffset) {
                            handOffsetX = evalParam(armDef.handOffset.xF, phase, H, char) * H * facingSign;
                            handOffsetY = evalParam(armDef.handOffset.yF, phase, H, char) * H;
                        } else if (armDef.handOffsetDynamic) {
                            handOffsetX = evalParam(armDef.handOffsetDynamic.xF, phase, H, char) * H * facingSign;
                            handOffsetY = evalParam(armDef.handOffsetDynamic.yF, phase, H, char) * H;
                        }
                        
                        const handTargetX = targetX_abs + handOffsetX;
                        const handTargetY = targetY_abs + handOffsetY;

                        const armSolution = this._solveArmIK(S_X, S_Y, handTargetX, handTargetY, A_U, A_L, preferClockwiseBend, facingSign);
                        outputPoseData[limbKey].ex = armSolution.elbow.x;
                        outputPoseData[limbKey].ey = armSolution.elbow.y;
                        outputPoseData[limbKey].hx = armSolution.hand.x;
                        outputPoseData[limbKey].hy = armSolution.hand.y;

                    } else if (armDef.type === 'factors') { 
                        outputPoseData[limbKey].ex = S_X + armDef.exF * A_U * facingSign * limbPerspectiveFactor;
                        outputPoseData[limbKey].ey = S_Y + armDef.eyF * A_U;
                        outputPoseData[limbKey].hx = outputPoseData[limbKey].ex + armDef.hxF * A_L * facingSign * limbPerspectiveFactor;
                        outputPoseData[limbKey].hy = outputPoseData[limbKey].ey + armDef.hyF * A_L;
                    }
                    
                    if (facingMode !== 'profile') {
                        const bodyCenterXWithLean = p_origins.hip_center_x + currentBodyLean;
                        if ((outputPoseData[limbKey].ex - bodyCenterXWithLean) * facingSign < -bodyCenterAllowance && facingSign > 0 ||
                            (outputPoseData[limbKey].ex - bodyCenterXWithLean) * facingSign > bodyCenterAllowance && facingSign < 0 ) {
                               outputPoseData[limbKey].ex = bodyCenterXWithLean - bodyCenterAllowance * facingSign * (limbKey === 'l_arm' ? 1 : -1);
                        }
                        if ((outputPoseData[limbKey].hx - bodyCenterXWithLean) * facingSign < -bodyCenterAllowance && facingSign > 0 ||
                            (outputPoseData[limbKey].hx - bodyCenterXWithLean) * facingSign > bodyCenterAllowance && facingSign < 0 ) {
                               outputPoseData[limbKey].hx = bodyCenterXWithLean - bodyCenterAllowance * facingSign * (limbKey === 'l_arm' ? 1 : -1);
                        }
                    }
                }
            });

            ['l_leg', 'r_leg'].forEach(limbKey => {
                const legDef = pDef[limbKey] || this.poseDefinitions.idle_default[limbKey];
                const H_X = limbKey === 'l_leg' ? l_leg_hx : r_leg_hx;
                const H_Y = limbKey === 'l_leg' ? l_leg_hy : r_leg_hy;
                if (legDef) {
                    outputPoseData[limbKey].kx = H_X + evalParam(legDef.kxF || legDef.kxFDynamic, phase, H, char) * L_U * facingSign * limbPerspectiveFactor;
                    outputPoseData[limbKey].ky = H_Y + evalParam(legDef.kyF || legDef.kyFDynamic, phase, H, char) * L_U;
                    outputPoseData[limbKey].fx = outputPoseData[limbKey].kx + evalParam(legDef.fxF || legDef.fxFDynamic, phase, H, char) * L_L * facingSign * limbPerspectiveFactor;
                    outputPoseData[limbKey].fy = outputPoseData[limbKey].ky + evalParam(legDef.fyF || legDef.fyFDynamic, phase, H, char) * L_L;
                }
            });
        }
        return outputPoseData;
    }
    
    _interpolatePoseDetails(poseA, poseB, t) {
        const interpolated = { headTilt: 0, bobOffset: 0, bodyX2Offset:0, bodyLean:0, shoulderOffsetY:0, l_arm: {}, r_arm: {}, l_leg: {}, r_leg: {} };
        const lerp = (a, b, t) => (a === undefined || b === undefined) ? (a === undefined ? b : a) || 0 : a + (b - a) * t;

        interpolated.headTilt = lerp(poseA.headTilt, poseB.headTilt, t);
        interpolated.bobOffset = lerp(poseA.bobOffset, poseB.bobOffset, t);
        interpolated.bodyX2Offset = lerp(poseA.bodyX2Offset, poseB.bodyX2Offset, t);
        interpolated.bodyLean = lerp(poseA.bodyLean, poseB.bodyLean, t);
        interpolated.shoulderOffsetY = lerp(poseA.shoulderOffsetY, poseB.shoulderOffsetY, t);

        ['l_arm', 'r_arm'].forEach(limbKey => {
            ['ex', 'ey', 'hx', 'hy'].forEach(coordKey => {
                interpolated[limbKey][coordKey] = lerp(poseA[limbKey]?.[coordKey], poseB[limbKey]?.[coordKey], t);
            });
        });
        ['l_leg', 'r_leg'].forEach(limbKey => {
            ['kx', 'ky', 'fx', 'fy'].forEach(coordKey => {
                interpolated[limbKey][coordKey] = lerp(poseA[limbKey]?.[coordKey], poseB[limbKey]?.[coordKey], t);
            });
        });
        return interpolated;
    }

    // 2-Link IK Solver
    _solveArmIK(sx, sy, hx_target, hy_target, L1, L2, preferClockwiseBend, facingSignForBendPreference) {
        let dx = hx_target - sx;
        let dy = hy_target - sy;
        let d_sq = dx * dx + dy * dy;
        let d = Math.sqrt(d_sq);

        let hx_actual = hx_target;
        let hy_actual = hy_target;
        const epsilon = 0.001; // Small value for float comparisons

        // If target is too far
        if (d > L1 + L2 - epsilon) {
            const ratio = (L1 + L2) / (d < epsilon ? epsilon : d); // Avoid div by zero if d is tiny
            hx_actual = sx + dx * ratio;
            hy_actual = sy + dy * ratio;
            d = L1 + L2; // Update distance to clamped
        }
        // If target is too close
        else if (d < Math.abs(L1 - L2) + epsilon && L1 + L2 > epsilon) {
            const min_reach = Math.abs(L1 - L2);
            if (d < epsilon && min_reach < epsilon) { // Target at shoulder, L1 approx L2 (fully folded)
                return { elbow: { x: sx + L1 * facingSignForBendPreference, y: sy }, hand: { x: sx, y: sy } };
            }
            const ratio = min_reach / (d < epsilon ? epsilon : d);
            hx_actual = sx + dx * ratio;
            hy_actual = sy + dy * ratio;
            d = min_reach; 
        }
        
        dx = hx_actual - sx; // Update dx, dy based on potentially clamped hand position
        dy = hy_actual - sy;

        if (d < epsilon) { // Hand is at shoulder (or very close)
            if (Math.abs(L1 - L2) < epsilon) { // L1 approx L2, fully folded
                return { elbow: { x: sx + L1 * facingSignForBendPreference, y: sy }, hand: { x: sx, y: sy } };
            } else { // L1 != L2, arm straight along a default
                const straightDirX = (L1 - L2 > 0) ? 1 : -1; // Default to X axis
                return { elbow: { x: sx + L1 * straightDirX, y: sy }, hand: { x: sx + (L1 - L2) * straightDirX, y: sy } };
            }
        }

        // 'a' is distance from shoulder to projection of elbow onto shoulder-hand line
        const a = (L1*L1 - L2*L2 + d*d) / (2 * d);
        let h_sq = L1*L1 - a*a;
        if (h_sq < 0) h_sq = 0; // Clamp due to precision issues for straight arms
        const h = Math.sqrt(h_sq);

        const p_mid_x = sx + a * (dx / d);
        const p_mid_y = sy + a * (dy / d);

        let ex, ey;
        // preferClockwiseBend is true for right arm (usually). facingSignForBendPreference is char's visual facing.
        // This logic determines if elbow is "above" or "below" the shoulder-hand line.
        // True CW bend for right arm, true CCW for left arm looks natural.
        const bendDirSign = preferClockwiseBend ? 1 : -1; 
        
        ex = p_mid_x + bendDirSign * h * (dy / d);
        ey = p_mid_y - bendDirSign * h * (dx / d);
        
        return { elbow: { x: ex, y: ey }, hand: { x: hx_actual, y: hy_actual } };
    }


    _drawCharacter(char) {
        const d = this._getCharacterPoseDetails(char); 
        const ctx = this.ctx;
        const lineW = Math.max(1.5, this.STICK_THICKNESS_BASE * char.size); // Use full base thickness
        ctx.strokeStyle = char.color; ctx.fillStyle = char.color;
        ctx.lineWidth = lineW; ctx.lineCap = 'round'; ctx.lineJoin = 'round';

        ctx.beginPath(); ctx.moveTo(d.body.x1, d.body.y1); ctx.lineTo(d.body.x2, d.body.y2); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(d.l_leg.hx, d.l_leg.hy); ctx.lineTo(d.l_leg.kx, d.l_leg.ky); ctx.lineTo(d.l_leg.fx, d.l_leg.fy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(d.r_leg.hx, d.r_leg.hy); ctx.lineTo(d.r_leg.kx, d.r_leg.ky); ctx.lineTo(d.r_leg.fx, d.r_leg.fy); ctx.stroke();
        
        if (char.appearance.hasTzitzit) this._drawCharacterTzitzit(char, d);

        ctx.beginPath(); ctx.moveTo(d.l_arm.sx, d.l_arm.sy); ctx.lineTo(d.l_arm.ex, d.l_arm.ey); ctx.lineTo(d.l_arm.hx, d.l_arm.hy); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(d.r_arm.sx, d.r_arm.sy); ctx.lineTo(d.r_arm.ex, d.r_arm.ey); ctx.lineTo(d.r_arm.hx, d.r_arm.hy); ctx.stroke();

        ctx.save();
        ctx.translate(d.head.x, d.head.y);
        ctx.rotate(d.head.headTilt * Math.PI / 180); 
        ctx.beginPath(); ctx.arc(0, 0, d.head.r, 0, Math.PI * 2);
        ctx.fillStyle = char.color; ctx.fill();
        
        const activeExpression = this._getActiveExpression(char);
        const visualFacingMode = char.behaviors.turning.isActive ? char.behaviors.turning.visualFacingMode : char.facingMode;
        const visualFacingSign = char.behaviors.turning.isActive ? char.behaviors.turning.visualFacingSign : (char.facing === 'left' ? -1 : 1);

        this._drawCharacterFace(char, d.head.r, activeExpression, visualFacingMode, visualFacingSign); 
        this._drawCharacterHair(char, d.head.r, visualFacingMode, visualFacingSign);
        this._drawCharacterAccessories(char, d.head.r, d.head.rawTilt, visualFacingMode, visualFacingSign);
        ctx.restore();
    }

    _drawCharacterTzitzit(char, poseDetails) {
        const ctx = this.ctx;
        const H = this.FIGURE_BASE_HEIGHT * char.size;
        const tzitzitLength = this.TZITZIT_LENGTH_F * H;
        const hipY = poseDetails.body.y1; 

        const visualFacingMode = char.behaviors.turning.isActive ? char.behaviors.turning.visualFacingMode : char.facingMode;
        const visualFacingSign = char.behaviors.turning.isActive ? char.behaviors.turning.visualFacingSign : (char.facing === 'left' ? -1 : 1);
        
        const facingModeFactors = { 'profile': 0.4, 'threeQuarter': 0.8, 'front': 1.0 };
        const bodyActualWidthAtHip = this.HIP_WIDTH_F * H * (facingModeFactors[visualFacingMode] || 1.0);
        const tzitzitAnchorOffset = bodyActualWidthAtHip * this.TZITZIT_HIP_ANCHOR_X_FACTOR;

        const stringCount = 2; 
        const spreadFromAnchor = H * 0.01;

        const swayAmplitude = char.behaviors.accessorySway.currentTzitzitSwayAmplitude;
        const baseSwayPhase = char.swayPhase; 

        ctx.save();
        ctx.strokeStyle = char.appearance.tzitzitColor || 'white';
        ctx.lineWidth = Math.max(1, char.size * 1.1); 

        const rightSideAnchorX = poseDetails.body.x1 + tzitzitAnchorOffset * visualFacingSign + (poseDetails.bodyLean || 0);
        for (let i = 0; i < stringCount; i++) {
            ctx.beginPath();
            const individualSwayPhase = baseSwayPhase + i * 0.5; 
            const swayOffsetX = Math.sin(individualSwayPhase) * swayAmplitude * char.size * (Math.random()*0.4 + 0.8);
            const startX = rightSideAnchorX + ( (i - (stringCount-1)/2) * spreadFromAnchor * visualFacingSign );
            ctx.moveTo(startX, hipY + H*0.02); 
            const endX = startX + (swayOffsetX * visualFacingSign) + (Math.random()-0.5)*spreadFromAnchor*0.3*visualFacingSign;
            ctx.lineTo(endX, hipY + tzitzitLength + (Math.random()-0.5)*H*0.03);
            ctx.stroke();
        }

        const leftSideAnchorX = poseDetails.body.x1 - tzitzitAnchorOffset * visualFacingSign + (poseDetails.bodyLean || 0);
        for (let i = 0; i < stringCount; i++) {
            ctx.beginPath();
            const individualSwayPhase = baseSwayPhase + i * 0.5 + Math.PI/4; 
            const swayOffsetX = Math.sin(individualSwayPhase) * swayAmplitude * char.size * (Math.random()*0.4 + 0.8);
            const startX = leftSideAnchorX + ( (i - (stringCount-1)/2) * spreadFromAnchor * visualFacingSign );
            ctx.moveTo(startX, hipY + H*0.02);
            const endX = startX + (swayOffsetX * visualFacingSign) + (Math.random()-0.5)*spreadFromAnchor*0.3*visualFacingSign;
            ctx.lineTo(endX, hipY + tzitzitLength + (Math.random()-0.5)*H*0.03);
            ctx.stroke();
        }
        ctx.restore();
    }
    
    _getExpressionDefinition(expressionName) {
        const baseExpressions = {
            'neutral': { eyebrowTilt: 0, eyebrowRaiseF: 0, eyeOpenF: 1.0, pupilSizeF: 1.0, mouthCurve: 0, mouthDefaultShape: 'neutral' },
            'happy': { eyebrowTilt: -15, eyebrowRaiseF: -0.2, eyeOpenF: 0.85, pupilSizeF: 1.0, mouthCurve: 0.8, mouthDefaultShape: 'smile' },
            'sad': { eyebrowTilt: 20, eyebrowRaiseF: 0.05, eyeOpenF: 0.8, pupilSizeF: 1.0, mouthCurve: -0.7, mouthDefaultShape: 'frown_subtle' },
            'angry': { eyebrowTilt: (chr, vfm, vfs) => (vfm === 'front' ? 0 : (vfs === -1 ? 30 : -30)), eyebrowRaiseF: 0.1, eyeOpenF: 0.7, pupilSizeF: 1.0, mouthCurve: -0.4, mouthDefaultShape: 'frown_subtle' },
            'surprised': { eyebrowTilt: -10, eyebrowRaiseF: -0.4, eyeOpenF: 1.15, pupilSizeF: 0.8, mouthDefaultShape: 'o_large' },
            'focused': { eyebrowTilt: (chr, vfm, vfs) => (vfs === -1 ? 15 : -15), eyebrowRaiseF: 0.05, eyeOpenF: 0.9, pupilSizeF: 0.9, mouthCurve: -0.1, mouthDefaultShape: 'neutral' },
            'subtle_emphasis': { eyebrowTilt: -5, eyebrowRaiseF: -0.1, eyeOpenF: 1.0, pupilSizeF: 1.0, mouthCurve: 0.2, mouthDefaultShape: 'slight_open' },
            'skeptical': { eyebrowTilt: (chr, vfm, vfs) => (vfs === -1 ? -20 : 10), eyebrowRaiseF: (chr, vfm, vfs) => (vfs === -1 ? -0.3 : 0.1), eyeOpenF: 0.9, pupilSizeF: 1.0, mouthCurve: -0.2, mouthDefaultShape: 'neutral' },
        };
        return baseExpressions[expressionName] || baseExpressions['neutral'];
    }

    _getActiveExpression(char) {
        const visualFacingMode = char.behaviors.turning.isActive ? char.behaviors.turning.visualFacingMode : char.facingMode;
        const visualFacingSign = char.behaviors.turning.isActive ? char.behaviors.turning.visualFacingSign : (char.facing === 'left' ? -1 : 1);

        const defA = this._getExpressionDefinition(char.previousExpressionName);
        const defB = this._getExpressionDefinition(char.activeExpressionName);
        const t = char.expressionTransitionProgress;
        const lerp = (a, b, t) => (a === undefined || b === undefined) ? (a || b || 0) : a + (b - a) * t;

        let interpolated = { name: char.activeExpressionName, mouthDefaultShape: (t < 0.5 ? defA.mouthDefaultShape : defB.mouthDefaultShape) || 'neutral' };
        for (const key in defA) {
            if (key === 'mouthDefaultShape' || key === 'name') continue;

            const valA_raw = defA[key];
            const valB_raw = defB[key];
            const valA = typeof valA_raw === 'function' ? valA_raw(char, visualFacingMode, visualFacingSign) : valA_raw;
            const valB = typeof valB_raw === 'function' ? valB_raw(char, visualFacingMode, visualFacingSign) : valB_raw;
            
            interpolated[key] = lerp(valA, valB, t);
        }
        return interpolated;
    }


    _drawCharacterFace(char, headR, activeExpression, visualFacingMode, visualFacingSign) {
        const ctx = this.ctx;
        this._drawEyes(char, headR, activeExpression, ctx, visualFacingMode, visualFacingSign);
        this._drawEyebrows(char, headR, activeExpression, ctx, visualFacingMode, visualFacingSign);
        this._drawMouthAndNose(char, headR, activeExpression, ctx, visualFacingMode, visualFacingSign);
    }

    _drawEyes(char, headR, expression, ctx, visualFacingMode, visualFacingSign) {
        const app = char.appearance;
        const blinkBehav = char.behaviors.blinking;
        const dartBehav = char.behaviors.eyeDarts;
        
        let intensityFactor = 1.0;
        if (char.behaviors.emphasis.active) intensityFactor = this.EXPRESSION_INTENSITY_FACTOR * (char.behaviors.emphasis.intensity / 1.5);

        // featurePerspectiveFactor: [profile, threeQuarter, front]
        const fpfMap = {'profile': 1.0, 'threeQuarter': 0.75, 'front': 0.3}; // Increased front separation slightly
        let featurePerspectiveFactor = fpfMap[visualFacingMode] || 1.0;

        const eyeR_base = headR * 0.22;
        const pupilRBase = eyeR_base * 0.5;
        const eyeBaseOffsetX = headR * 0.33 * featurePerspectiveFactor * visualFacingSign; // Slightly more offset for profile
        const eyeYPos = -headR * 0.15;
        
        // Eye separation based on facing mode
        let eyeSeparation = 0;
        if (visualFacingMode === 'threeQuarter') eyeSeparation = headR * 0.15 * visualFacingSign;
        else if (visualFacingMode === 'front') eyeSeparation = headR * 0.25 * visualFacingSign;
        // In profile, eyeSeparation is 0, so lEyeX and rEyeX might be the same. Draw only one.
        
        const mainEyeX = eyeBaseOffsetX - eyeSeparation * 0.5; // Shift main eye towards center
        const farEyeX = eyeBaseOffsetX + eyeSeparation * 0.5;  // Far eye (if visible)

        let pupilR = pupilRBase * expression.pupilSizeF;
        let eyeOpenFactor = expression.eyeOpenF;
        
        if (expression.name === 'surprised') pupilR *= Math.max(0.8, 1 / intensityFactor); 
        if (expression.name === 'angry') eyeOpenFactor = Math.max(0.1, eyeOpenFactor / intensityFactor);
        if (expression.name === 'sad') eyeOpenFactor = Math.max(0.1, eyeOpenFactor / intensityFactor);

        if (blinkBehav.isBlinking) {
            const currentBlinkPhase = blinkBehav.blinkProgress < 1 ? blinkBehav.blinkProgress : 2 - blinkBehav.blinkProgress;
            eyeOpenFactor *= (1 - Math.sin(currentBlinkPhase * Math.PI * 0.5) * 0.99);
        }
        eyeOpenFactor = Math.max(0.01, eyeOpenFactor);

        const finalPupilShiftX = dartBehav.currentPupilShiftX;
        const finalPupilShiftY = dartBehav.currentPupilShiftY + (expression.name === 'sad' ? eyeR_base * 0.1 * intensityFactor : 0);

        // Draw far eye first if threeQuarter or front
        if (visualFacingMode !== 'profile') {
            ctx.fillStyle = this.adjustColor(app.eyeColor || 'white', -0.05); // Slightly darker far eye
            const farEyeRadiusFactor = (visualFacingMode === 'threeQuarter') ? 0.9 : 1.0;
            ctx.beginPath(); ctx.ellipse(farEyeX, eyeYPos, eyeR_base * farEyeRadiusFactor, eyeR_base * eyeOpenFactor * farEyeRadiusFactor, 0, 0, Math.PI*2); ctx.fill();
            if (eyeOpenFactor > 0.1) {
                ctx.fillStyle = this.adjustColor(app.pupilColor || 'black', -0.05);
                ctx.beginPath(); ctx.arc(farEyeX + finalPupilShiftX * 0.8, eyeYPos + finalPupilShiftY, pupilR * farEyeRadiusFactor * 0.9, 0, Math.PI*2); ctx.fill();
            }
        }
        
        // Draw main/front eye
        ctx.fillStyle = app.eyeColor || 'white';
        ctx.beginPath(); ctx.ellipse(mainEyeX, eyeYPos, eyeR_base, eyeR_base * eyeOpenFactor, 0, 0, Math.PI*2); ctx.fill();

        if (eyeOpenFactor > 0.1) {
            ctx.fillStyle = app.pupilColor || 'black';
            ctx.beginPath(); ctx.arc(mainEyeX + finalPupilShiftX, eyeYPos + finalPupilShiftY, pupilR, 0, Math.PI*2); ctx.fill();
            
            ctx.fillStyle = 'rgba(255,255,255,0.7)';
            const highlightR = pupilR * 0.35;
            ctx.beginPath(); ctx.arc(mainEyeX + finalPupilShiftX + pupilR*0.3, eyeYPos + finalPupilShiftY - pupilR*0.3, highlightR, 0, Math.PI*2); ctx.fill();
             if (visualFacingMode !== 'profile') { // Highlight for far eye
                ctx.beginPath(); ctx.arc(farEyeX + finalPupilShiftX*0.8 + pupilR*0.3, eyeYPos + finalPupilShiftY - pupilR*0.3, highlightR*0.8, 0, Math.PI*2); ctx.fill();
            }
        }
    }

    _drawEyebrows(char, headR, expression, ctx, visualFacingMode, visualFacingSign) {
        const app = char.appearance;
        // featurePerspectiveFactor: [profile, threeQuarter, front]
        const fpfMap = {'profile': 1.0, 'threeQuarter': 0.75, 'front': 0.3};
        let featurePerspectiveFactor = fpfMap[visualFacingMode] || 1.0;

        const eyeR_base = headR * 0.22;
        const eyeBaseOffsetX = headR * 0.33 * featurePerspectiveFactor * visualFacingSign;
        const eyeYPos = -headR * 0.15;
        
        let eyeSeparation = 0;
        if (visualFacingMode === 'threeQuarter') eyeSeparation = headR * 0.15 * visualFacingSign;
        else if (visualFacingMode === 'front') eyeSeparation = headR * 0.25 * visualFacingSign;
        
        const mainEyeX = eyeBaseOffsetX - eyeSeparation * 0.5;
        const farEyeX = eyeBaseOffsetX + eyeSeparation * 0.5;

        ctx.strokeStyle = app.hairColor || app.beardColor || 'black';
        ctx.lineWidth = Math.max(1.5, headR * 0.08);
        
        const eyebrowYBase = eyeYPos - eyeR_base * 1.3; // Base Y pos above eye
        const eyebrowLengthBase = headR * 0.3; 
        
        let eyebrowTilt = typeof expression.eyebrowTilt === 'function' ? expression.eyebrowTilt(char, visualFacingMode, visualFacingSign) : expression.eyebrowTilt;
        let eyebrowRaise = (typeof expression.eyebrowRaiseF === 'function' ? expression.eyebrowRaiseF(char, visualFacingMode, visualFacingSign) : expression.eyebrowRaiseF) * eyeR_base;

        // Draw far eyebrow first
        if (visualFacingMode !== 'profile') {
            const farBrowLength = eyebrowLengthBase * (visualFacingMode === 'threeQuarter' ? 0.85 : 1.0);
            let farTilt = eyebrowTilt;
            if (visualFacingMode === 'front' && expression.name === 'angry') farTilt = -eyebrowTilt; // Opposite tilt for angry front
            this._drawOneEyebrow(ctx, farEyeX, eyebrowYBase + eyebrowRaise, farBrowLength, farTilt, visualFacingSign, visualFacingMode, true);
        }
        // Draw main/front eyebrow
        this._drawOneEyebrow(ctx, mainEyeX, eyebrowYBase + eyebrowRaise, eyebrowLengthBase, eyebrowTilt, visualFacingSign, visualFacingMode, false);
    }

    _drawOneEyebrow(ctx, eyeX, yBase, length, tiltDegrees, facingSign, facingMode, isFarSide) {
        ctx.save();
        ctx.translate(eyeX, yBase);
        
        let actualTilt = tiltDegrees;
        if (facingMode === 'front' && !isFarSide && Math.abs(tiltDegrees) > 5) { // Main eyebrow in front view, slight outward tilt if expressive
           // actualTilt += 5 * Math.sign(eyeX); // Tilt away from center slightly - eyeX can be tricky here due to visualFacingSign
        } else if (facingMode !== 'front') {
            actualTilt *= facingSign; // Normal tilt for profile/3Q
        }
        // If isFarSide and front view, tilt might need special handling (e.g. angry expression)

        ctx.rotate(actualTilt * Math.PI / 180);
        
        ctx.beginPath();
        ctx.moveTo(-length / 2, 0);
        // Make eyebrow curve more pronounced if tilted expressively
        const curveIntensity = 0.15 * (1 + Math.abs(tiltDegrees) / 45); 
        ctx.quadraticCurveTo(0, -length * curveIntensity , length/2, 0);
        ctx.stroke();
        ctx.restore();
    }

    _drawMouthAndNose(char, headR, expression, ctx, visualFacingMode, visualFacingSign) {
        const app = char.appearance;
        const mouthCfg = app.mouth;
        
        const fpfMap = {'profile': 1.0, 'threeQuarter': 0.75, 'front': 0.1}; // Mouth more centered in front view
        let featurePerspectiveFactor = fpfMap[visualFacingMode] || 1.0;
        const mouthBaseXOffset = headR * 0.3 * featurePerspectiveFactor * visualFacingSign; // Based on eye logic
        const mouthY = headR * 0.45;
        
        if (app.nose && visualFacingMode !== 'front') {
            ctx.strokeStyle = this.adjustColor(char.color, -0.2);
            ctx.lineWidth = Math.max(1, headR * 0.03);
            ctx.beginPath();
            const noseBridgeY = -headR * 0.05;
            const noseTipY = headR * 0.15;
            // Nose X position needs to be on the profile contour
            const noseRootX = mouthBaseXOffset + headR * 0.05 * visualFacingSign * (visualFacingMode === 'profile' ? 0.3 : 0.6);
            const noseTipX = mouthBaseXOffset + headR * 0.20 * visualFacingSign * (visualFacingMode === 'profile' ? 1.0 : 0.8);
            ctx.moveTo(noseRootX, noseBridgeY);
            ctx.lineTo(noseTipX, noseTipY);
            if (visualFacingMode === 'profile') {
                ctx.lineTo(noseTipX - headR * 0.05 * visualFacingSign, noseTipY + headR * 0.05);
            }
            ctx.stroke();
        }

        const mouthBehav = char.behaviors.mouth;
        let baseShape = mouthBehav.currentShape;
        if (mouthBehav.shapeTransitionProgress < 1) { baseShape = mouthBehav.targetShape; }
        
        let intensity = 1.0;
        if (char.behaviors.emphasis.active) intensity = this.EXPRESSION_INTENSITY_FACTOR;
        if (expression.name === 'surprised') intensity *= 1.2;

        let isTalkingPose = false;
        if (typeof char.activePoseName === 'string') {
            isTalkingPose = char.activePoseName === 'talk' || char.activePoseName.startsWith("talk_");
        }
        const mouthAnimScalar = (char.isSpeakingTTS || isTalkingPose) ? (0.4 + Math.sin(mouthBehav.animPhase * Math.PI * 2) * 0.6) : 0;
        ctx.strokeStyle = mouthCfg.color || char.color;
        ctx.lineWidth = Math.max(1, headR * 0.04);
        ctx.fillStyle = mouthCfg.color || char.color;

        let mouthWidthFactor = 0.25, mouthHeightFactor = 0.03, curveFactor = 0;
        let showTeeth = false, showTongue = false, isOval = false;

        switch(baseShape) {
            case 'neutral':       mouthWidthFactor = 0.2; mouthHeightFactor = 0.015; break;
            case 'slight_open':   mouthWidthFactor = 0.22; mouthHeightFactor = 0.05 + mouthAnimScalar * 0.03; break;
            case 'ah':            isOval = true; mouthWidthFactor = 0.15 + mouthAnimScalar * 0.1; mouthHeightFactor = 0.15 + mouthAnimScalar * 0.1; showTongue = mouthAnimScalar > 0.3; break;
            case 'o': case 'o_small': isOval = true; mouthWidthFactor = 0.1 + mouthAnimScalar * 0.05; mouthHeightFactor = 0.1 + mouthAnimScalar * 0.05; if(baseShape==='o_small'){mouthWidthFactor*=0.7; mouthHeightFactor*=0.7;} break;
            case 'o_large':       isOval = true; mouthWidthFactor = 0.2; mouthHeightFactor = 0.25; break; // For surprise
            case 'ee':            mouthWidthFactor = 0.3 + mouthAnimScalar * 0.05; mouthHeightFactor = 0.02 + mouthAnimScalar * 0.01; showTeeth=true; break;
            case 's':             mouthWidthFactor = 0.28; mouthHeightFactor = 0.025 + mouthAnimScalar * 0.01; showTeeth=true; break;
            case 'fv':            mouthWidthFactor = 0.25; mouthHeightFactor = 0.03 + mouthAnimScalar * 0.01; curveFactor = -0.1; showTeeth = 'upper_only_subtle'; break; // Upper teeth touch lower lip idea
            case 'mbp':           mouthWidthFactor = 0.26; mouthHeightFactor = 0.01; break; // Lips closed
            case 'l': case 'th':  mouthWidthFactor = 0.22; mouthHeightFactor = 0.06 + mouthAnimScalar * 0.03; showTongue = 'tip_visible'; break;
            case 'smile':         mouthWidthFactor = 0.28; mouthHeightFactor = 0.04; curveFactor = 0.8; showTeeth=true; break;
            case 'frown_subtle':  mouthWidthFactor = 0.25; mouthHeightFactor = 0.03; curveFactor = -0.4; break;
        }
        
        let mouthWidth = headR * mouthWidthFactor * intensity * (visualFacingMode === 'profile' ? 0.7 : (visualFacingMode === 'threeQuarter' ? 0.85 : 1));
        let mouthHeight = headR * mouthHeightFactor * intensity;
        
        const mouthX = mouthBaseXOffset + (visualFacingMode === 'profile' ? headR * 0.08 * visualFacingSign : 0);

        ctx.beginPath();
        if (isOval) {
            ctx.ellipse(mouthX, mouthY + mouthHeight * 0.1, mouthWidth * 0.5, mouthHeight * 0.5, 0, 0, Math.PI * 2);
            if (baseShape !== 'o_small' || expression.name === 'surprised') {
                ctx.fillStyle = showTongue ? mouthCfg.tongueColor : this.adjustColor(mouthCfg.color || char.color, 0.4);
                ctx.fill();
            }
        } else {
            const yTop = mouthY - mouthHeight * 0.5;
            const yBottom = mouthY + mouthHeight * 0.5;
            const cpY = mouthY + curveFactor * headR * 0.1 * intensity;
            ctx.moveTo(mouthX - mouthWidth * 0.5, mouthY);
            ctx.quadraticCurveTo(mouthX, cpY + mouthHeight * 0.5, mouthX + mouthWidth * 0.5, mouthY);
            if (mouthHeight > headR * 0.025 || baseShape === 'ee' || baseShape === 'smile' || baseShape === 's' || baseShape === 'fv' || baseShape === 'l' || baseShape === 'th') {
                ctx.quadraticCurveTo(mouthX, cpY - mouthHeight * 0.5, mouthX - mouthWidth * 0.5, mouthY);
                ctx.closePath();
                if (showTongue && baseShape !== 'l' && baseShape !== 'th') { // Full tongue fill
                    ctx.fillStyle = mouthCfg.tongueColor; ctx.fill();
                } else if (!showTeeth) { // Fill if not showing teeth (and not special tongue case)
                     ctx.fillStyle = this.adjustColor(mouthCfg.color || char.color, 0.3); ctx.fill();
                }
            }
        }
        ctx.stroke(); 

        if (showTeeth) {
            ctx.fillStyle = mouthCfg.teethColor;
            const teethH = mouthHeight * 0.4;
            if (showTeeth === true || showTeeth === 'upper_only_subtle') { // Upper teeth
                ctx.fillRect(mouthX - mouthWidth * 0.45, mouthY - teethH * (baseShape==='fv'? 0.3:0.7) , mouthWidth * 0.9, teethH * (baseShape==='fv'? 0.5:0.8));
            }
            if (showTeeth === true && baseShape !== 'fv' && (baseShape === 'smile' || baseShape === 'ee' || baseShape === 's') && mouthHeight > headR * 0.03) { // Lower teeth
                 ctx.fillRect(mouthX - mouthWidth * 0.4, mouthY + teethH * 0.1, mouthWidth * 0.8, teethH * 0.6);
            }
        }
        if (showTongue === 'tip_visible' && (baseShape === 'l' || baseShape === 'th')) {
            ctx.fillStyle = mouthCfg.tongueColor;
            ctx.beginPath();
            const tongueTipY = mouthY + (baseShape === 'l' ? -mouthHeight*0.1 : mouthHeight*0.05);
            ctx.ellipse(mouthX, tongueTipY, mouthWidth*0.2, mouthHeight*0.25, 0, 0, Math.PI*2);
            ctx.fill();
        }
    }

    _drawCharacterHair(char, headR, visualFacingMode, visualFacingSign) {
        const ctx = this.ctx;
        const app = char.appearance;
        if (app.hairStyle === 'none' || !app.hairColor) return;
        
        const isHatCovering = (app.hat === 'tophat' || app.hat === 'fedora' || (app.hat === 'baseball_cap' && app.hairStyle !== 'ponytail_stub'));
        if (isHatCovering && !(app.hat === 'yarmulke' && (app.hairStyle === 'short_spiky' || app.hairStyle.includes('side_part') || app.hairStyle === 'simple_bob'))) {
             //return; // Allow some hair with yarmulke
        }


        ctx.fillStyle = app.hairColor;
        ctx.strokeStyle = this.adjustColor(app.hairColor, -0.1); 
        ctx.lineWidth = Math.max(1, headR * 0.03);
        
        // pf: perspective factor for X compression [profile, threeQuarter, front]
        const pfMap = {'profile': 1.0, 'threeQuarter': 0.7, 'front': 0.4};
        let pf = pfMap[visualFacingMode] || 1.0;
        // xShift determines how much hair mass shifts to the "back" of head in profile/3Q
        let xShiftBase = headR * 0.15; // Base shift amount
        let xShift = xShiftBase * (visualFacingMode === 'profile' ? 1 : (visualFacingMode === 'threeQuarter' ? 0.5 : 0)) * -visualFacingSign;
        
        ctx.save();
        ctx.translate(xShift, 0);

        const hairTopY = -headR * (app.hat === 'yarmulke' ? 0.6 : 0.85); 
        const hairBaseRadius = headR * (app.hat === 'yarmulke' ? 0.95 : 1.0);

        switch (app.hairStyle) {
            case 'round_cap':
                ctx.beginPath();
                ctx.arc(0, hairTopY + headR * 0.2, hairBaseRadius * 0.9 * pf, Math.PI * (1 - 0.1 * pf * visualFacingSign), Math.PI * (0 + 0.1 * pf * visualFacingSign), visualFacingSign < 0);
                ctx.closePath(); ctx.fill();
                break;
            case 'short_spiky':
                ctx.save();
                ctx.translate(0, hairTopY + headR * 0.1);
                const numSpikes = app.hat === 'yarmulke' ? 5 : 7;
                const spikeAngleCoverage = Math.PI * pf * 0.8; 
                const angleOffset = Math.PI + (Math.PI - spikeAngleCoverage)/2;
                for (let i = 0; i < numSpikes; i++) {
                    var angle = angleOffset + (i * spikeAngleCoverage / (numSpikes -1 ));
                    if(visualFacingSign < 0) angle = Math.PI - (angle - Math.PI); // Mirror for left facing

                    let spikeLength = hairBaseRadius * (0.3 + Math.sin(i * 2.5 + char.posePhase * 0.1) * 0.05);
                    let spikeOuterOffset = hairBaseRadius * 0.85;
                    if(app.hat === 'yarmulke' && (angle < Math.PI*0.85 || angle > Math.PI*2.15)) continue;

                    ctx.beginPath();
                    ctx.moveTo(Math.cos(angle - 0.1) * spikeOuterOffset, Math.sin(angle - 0.1) * spikeOuterOffset);
                    ctx.lineTo(Math.cos(angle) * (spikeOuterOffset + spikeLength), Math.sin(angle) * (spikeOuterOffset + spikeLength));
                    ctx.lineTo(Math.cos(angle + 0.1) * spikeOuterOffset, Math.sin(angle + 0.1) * spikeOuterOffset);
                    ctx.closePath(); ctx.fill();
                }
                ctx.restore();
                break;
            case 'side_part_right': 
            case 'side_part_left':
                const partSign = app.hairStyle === 'side_part_right' ? 1 : -1;
                const sideHairTopY = -headR * (app.hat === 'yarmulke' ? 0.5 : 0.9);
                ctx.beginPath();
                // Adjust points based on pf and visualFacingSign to keep hair from obscuring face
                const mainMassXFactor = 0.7 * pf * visualFacingSign * partSign;
                const sweepFactor = 0.9 * pf * visualFacingSign * partSign;
                const coverageFactor = 1.6;
                
                ctx.moveTo(-mainMassXFactor * headR, sideHairTopY ); // Start of part
                // Curve over top/front
                ctx.quadraticCurveTo(sweepFactor * headR * 0.1, sideHairTopY - headR * 0.4, sweepFactor * headR, sideHairTopY + headR * 0.4);
                // Side coverage
                ctx.quadraticCurveTo(sweepFactor * headR * 1.1, sideHairTopY + headR * 0.9, sweepFactor * headR * 0.5, hairTopY + headR * coverageFactor);
                // Back under to start
                ctx.quadraticCurveTo(-mainMassXFactor * headR * 0.5, hairTopY + headR * (coverageFactor - 0.1), -mainMassXFactor * headR, sideHairTopY );
                ctx.closePath();
                ctx.fill();
                break;
            case 'simple_bob': // Make it frame the face
                ctx.beginPath();
                const bobTopPointY = hairTopY + headR * 0.7;
                // Arc over the top, less wide in X for profile/3Q
                ctx.arc(0, bobTopPointY, hairBaseRadius * 1.1 * (visualFacingMode === 'front' ? 1 : (visualFacingMode === 'threeQuarter' ? 0.85 : 0.65)), Math.PI * 1.1, Math.PI * -0.1);
                
                // Cheeks points, pulled back in profile/3Q
                let cheekXFactor = 0.6;
                if (visualFacingMode === 'threeQuarter') cheekXFactor = 0.45;
                else if (visualFacingMode === 'profile') cheekXFactor = 0.15; // Barely peeks past centerline
                
                const frontCheekX = headR * cheekXFactor * visualFacingSign - xShift; // Counteract overall xShift for front part
                const backCheekX = -headR * 0.6 * visualFacingSign; // Back of head always covered more
                
                ctx.lineTo(frontCheekX, hairTopY + headR * 1.3);
                ctx.lineTo(backCheekX, hairTopY + headR * 1.3); // Simplified back point
                ctx.closePath();
                ctx.fill();
                break;
            case 'ponytail_stub':
                ctx.beginPath(); 
                ctx.arc(0, hairTopY + headR * 0.2, hairBaseRadius * 0.9 * pf, Math.PI, 0);
                ctx.closePath(); ctx.fill();
                
                ctx.beginPath();
                // Position stub clearly at the back
                const stubX = -headR * (0.6 + 0.2 * (1-pf)) * visualFacingSign; // Further back in profile
                const stubY = hairTopY + headR * 0.8;
                ctx.ellipse(stubX, stubY, headR * 0.2, headR * 0.3, -20 * visualFacingSign * Math.PI/180, 0, Math.PI * 2);
                ctx.fill();
                break;
        }
        ctx.restore();
    }

    _drawCharacterAccessories(char, headR, rawHeadTilt, visualFacingMode, visualFacingSign) {
        const ctx = this.ctx;
        const app = char.appearance;
        
        const pfMap = {'profile': 1.0, 'threeQuarter': 0.75, 'front': 0.2};
        let pf = pfMap[visualFacingMode] || 1.0;
        let xShift = headR * 0.05 * (visualFacingMode === 'profile' ? 1 : (visualFacingMode === 'threeQuarter' ? 0.5:0)) * -visualFacingSign; // Slight shift for accessories
        const accessorySwayAngle = char.behaviors.accessorySway.angle;

        if (app.beard !== 'none' && app.beardColor) {
            ctx.fillStyle = app.beardColor;
            const mouthY = headR * 0.45; 
            const beardXCenter = headR * 0.3 * (visualFacingMode === 'front' ? 0 : pf) * visualFacingSign + xShift;
            
            ctx.save(); 
            if (app.beard === 'full_beard') ctx.rotate(accessorySwayAngle * 0.2 * Math.PI / 180);
            // No ctx.translate(xShift,0) here as beardXCenter already includes it relative to head rotation center
            
            switch(app.beard) {
                case 'goatee':
                    ctx.beginPath();
                    ctx.moveTo(beardXCenter - headR*0.08*pf, mouthY + headR*0.05);
                    ctx.quadraticCurveTo(beardXCenter, mouthY + headR*0.4*pf, beardXCenter + headR*0.08*pf, mouthY + headR*0.05);
                    ctx.closePath(); ctx.fill();
                    break;
                case 'full_beard':
                    ctx.beginPath();
                    // Fuller shape covering more of lower face contour
                    const jawFrontX = headR * 0.4 * pf * visualFacingSign + xShift;
                    const jawBottomY = headR * 0.65;
                    const jawBackX = -headR * 0.3 * pf * visualFacingSign + xShift;

                    ctx.moveTo(jawFrontX - headR*0.1*pf, mouthY - headR*0.1); // Near mouth side
                    ctx.quadraticCurveTo(jawFrontX, jawBottomY, jawFrontX - headR*0.15*pf*visualFacingSign, jawBottomY + headR*0.1); // Chin
                    ctx.lineTo(jawBackX + headR*0.1*pf*visualFacingSign, jawBottomY + headR*0.05); // Under jaw
                    ctx.quadraticCurveTo(jawBackX, mouthY, jawBackX + headR*0.1*pf, mouthY - headR*0.1); // Sideburn area
                    ctx.closePath(); ctx.fill();
                    break;
            }
            ctx.restore();
        }

        if (app.hat !== 'none' && app.hatColor) {
            ctx.fillStyle = app.hatColor;
            ctx.strokeStyle = this.adjustColor(app.hatColor, -0.15); 
            ctx.lineWidth = Math.max(1, headR * 0.02);
            
            ctx.save();
            if (app.hat !== 'yarmulke') {
                 ctx.rotate(accessorySwayAngle * Math.PI / 180);
            }
            ctx.translate(xShift, 0);
            
            const hatBaseY = -headR * 0.9;
            switch(app.hat) {
                case 'yarmulke': 
                    ctx.beginPath();
                    ctx.arc(0, hatBaseY + headR*0.35, headR * 0.55 * (visualFacingMode==='front'?1:pf*0.9), Math.PI * (1 - 0.1*pf*visualFacingSign), Math.PI * (0 + 0.1*pf*visualFacingSign), visualFacingSign < 0);
                    ctx.closePath();
                    ctx.fill();
                    if (app.hatColor !== 'black' && app.hatColor !== '#000000' && app.hatColor !== '#222222') ctx.stroke();
                    break;
                case 'baseball_cap':
                    const capCrownY = hatBaseY + headR*0.2;
                    ctx.beginPath(); 
                    ctx.arc(0, capCrownY, headR*0.8 * (visualFacingMode==='front'?1:pf*0.95), Math.PI * (1-0.05*pf*visualFacingSign), -Math.PI*0.05 * (1-0.05*pf*-visualFacingSign), visualFacingSign < 0); 
                    ctx.fill(); ctx.stroke();
                    
                    ctx.save();
                    ctx.fillStyle = app.hatColor; 
                    let brimWidthFactor = visualFacingMode === 'front' ? 1.2 : (visualFacingMode === 'threeQuarter' ? 0.9 : 0.5);
                    let brimHeightFactor = 0.4;
                    let brimX = headR * 0.5 * pf * visualFacingSign * (visualFacingMode === 'profile' ? 0.8 : 1);
                    if (visualFacingMode === 'front') brimX = 0;

                    ctx.beginPath(); 
                    ctx.ellipse(brimX, capCrownY + headR*0.25 + brimHeightFactor*headR*0.4, headR*brimWidthFactor*0.6, headR*brimHeightFactor*0.6, pf * visualFacingSign * 0.05, 0, Math.PI*2);
                    ctx.fill(); ctx.stroke();
                    ctx.restore();
                    break;
                 case 'fedora':
                    const fedoraHatBaseY = hatBaseY + headR * 0.35;
                    ctx.beginPath();
                    ctx.ellipse(0, fedoraHatBaseY, headR*1.1*pf, headR*0.4, 0, 0, Math.PI*2); // Brim more elliptical in profile/3Q
                    ctx.fill(); ctx.stroke();
                    
                    ctx.beginPath(); // Crown
                    const crownWidth = headR*0.6*pf;
                    ctx.rect(-crownWidth/2, fedoraHatBaseY - headR*0.9, crownWidth, headR*0.9);
                    // Could add pinch details to crown for fedora
                    ctx.fill(); ctx.stroke();
                    
                    ctx.fillStyle = this.adjustColor(app.hatColor, -0.25); 
                    ctx.fillRect(-crownWidth/2 * 1.05, fedoraHatBaseY - headR*0.15, crownWidth * 1.05, headR*0.15); // Band
                    break;
                case 'tophat':
                    const tophatBaseY = hatBaseY + headR * 0.25;
                    ctx.beginPath();
                    ctx.ellipse(0, tophatBaseY, headR*1.0*pf, headR*0.3, 0, 0, Math.PI*2);
                    ctx.fill(); ctx.stroke();
                    
                    const tophatCrownW = headR*0.5*pf;
                    ctx.fillRect(-tophatCrownW, tophatBaseY - headR*0.9, tophatCrownW*2, headR*0.9);
                    ctx.strokeRect(-tophatCrownW, tophatBaseY - headR*0.9, tophatCrownW*2, headR*0.9);
                    
                    ctx.fillStyle = this.adjustColor(app.hatColor, -0.25); 
                    ctx.fillRect(-tophatCrownW * 1.02, tophatBaseY - headR*0.15, tophatCrownW * 2.04, headR*0.15);
                    break;
            }
            ctx.restore();
        }
    }

    adjustColor(color, percent) {
        if (!color || typeof color !== 'string' || !color.startsWith("#")) return color; 
        let num = parseInt(color.replace("#",""), 16),
        amt = Math.round(2.55 * percent * 10), 
        R = (num >> 16) + amt,
        G = (num >> 8 & 0x00FF) + amt,
        B = (num & 0x0000FF) + amt;
        R = Math.max(0, Math.min(255, R));
        G = Math.max(0, Math.min(255, G));
        B = Math.max(0, Math.min(255, B));
        return "#" + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1).toUpperCase();
    }

    _calculateSpeechBubbleScreenMetrics(character) {
        const text = character.dialogueText;
        if (!text) return null;

        const cfg = this.speechBubbleConfig;
        const pose = this._getCharacterPoseDetails(character); 
        const headScreenPos = this._worldToScreen(pose.head.x, pose.head.y);
        const charScreenX = headScreenPos[0];
        // Anchor Y slightly above head center, to make pointer target mid/upper head
        const charScreenAnchorY = headScreenPos[1] - pose.head.r * this.cameraState.zoom * 0.5;


        this.ctx.font = `${cfg.fontSizeScreen}px ${cfg.fontFamily}`;
        this.ctx.textAlign = 'left'; this.ctx.textBaseline = 'top';

        const maxWidthBubble = Math.max(cfg.minWidthScreen, this.canvas.width * cfg.maxWidthScreenFactor);
        const lines = this._wrapTextScreen(text, maxWidthBubble);
        if (!lines.length) return null;

        let textBlockHeight = lines.length * (cfg.fontSizeScreen * cfg.lineHeightFactor);
        let textBlockWidth = 0;
        lines.forEach(line => { textBlockWidth = Math.max(textBlockWidth, this.ctx.measureText(line).width); });

        const bubbleWidthScreen = textBlockWidth + 2 * cfg.paddingScreen;
        const bubbleHeightScreen = textBlockHeight + 2 * cfg.paddingScreen;

        let bubbleScreenX = charScreenX - bubbleWidthScreen / 2;
        let bubbleScreenY = charScreenAnchorY - cfg.marginScreen.top - bubbleHeightScreen - cfg.pointerHeightScreen;
        let pointerPointsUp = false; 

        const canvasPadding = 10;
        if (bubbleScreenY < canvasPadding) { // Bubble too high, flip below
            bubbleScreenY = charScreenAnchorY + cfg.marginScreen.top + pose.head.r * this.cameraState.zoom * 0.5; 
            pointerPointsUp = true;
        }
        // Ensure bubble doesn't go off bottom
        if (bubbleScreenY + bubbleHeightScreen + (pointerPointsUp ? cfg.pointerHeightScreen : 0) > this.canvas.height - canvasPadding) {
             bubbleScreenY = this.canvas.height - canvasPadding - bubbleHeightScreen - (pointerPointsUp ? cfg.pointerHeightScreen : 0);
        }
        // Ensure bubble doesn't go off top if flipped
        if (pointerPointsUp && bubbleScreenY < canvasPadding + cfg.pointerHeightScreen) {
            bubbleScreenY = canvasPadding + cfg.pointerHeightScreen;
        }


        if (bubbleScreenX < canvasPadding) bubbleScreenX = canvasPadding;
        if (bubbleScreenX + bubbleWidthScreen > this.canvas.width - canvasPadding) {
            bubbleScreenX = this.canvas.width - canvasPadding - bubbleWidthScreen;
        }
        
        return {
            lines, text,
            charScreenX, charScreenAnchorY, 
            screenX: bubbleScreenX, screenY: bubbleScreenY,
            widthScreen: bubbleWidthScreen, heightScreen: bubbleHeightScreen,
            pointerHeightScreen: cfg.pointerHeightScreen,
            pointerWidthScreen: cfg.pointerWidthScreen,
            paddingScreen: cfg.paddingScreen,
            cornerRadiusScreen: cfg.cornerRadiusScreen,
            pointerPointsUp: pointerPointsUp,
            cfg
        };
    }
    _drawSpeechBubbleScreenSpace(character) {
        const m = this._calculateSpeechBubbleScreenMetrics(character);
        if (!m) return;
        const ctx = this.ctx;

        ctx.save();
        if (m.cfg.shadow) { 
            ctx.shadowColor = m.cfg.shadow.color;
            ctx.shadowBlur = m.cfg.shadow.blur;
            ctx.shadowOffsetX = m.cfg.shadow.offsetX; 
            ctx.shadowOffsetY = m.cfg.shadow.offsetY;
        }

        ctx.fillStyle = m.cfg.bgColor; ctx.strokeStyle = m.cfg.borderColor; ctx.lineWidth = 1.5;

        ctx.beginPath();
        ctx.moveTo(m.screenX + m.cornerRadiusScreen, m.screenY);
        ctx.lineTo(m.screenX + m.widthScreen - m.cornerRadiusScreen, m.screenY);
        ctx.quadraticCurveTo(m.screenX + m.widthScreen, m.screenY, m.screenX + m.widthScreen, m.screenY + m.cornerRadiusScreen);
        ctx.lineTo(m.screenX + m.widthScreen, m.screenY + m.heightScreen - m.cornerRadiusScreen);
        ctx.quadraticCurveTo(m.screenX + m.widthScreen, m.screenY + m.heightScreen, m.screenX + m.widthScreen - m.cornerRadiusScreen, m.screenY + m.heightScreen);
        ctx.lineTo(m.screenX + m.cornerRadiusScreen, m.screenY + m.heightScreen);
        ctx.quadraticCurveTo(m.screenX, m.screenY + m.heightScreen, m.screenX, m.screenY + m.heightScreen - m.cornerRadiusScreen);
        ctx.lineTo(m.screenX, m.screenY + m.cornerRadiusScreen);
        ctx.quadraticCurveTo(m.screenX, m.screenY, m.screenX + m.cornerRadiusScreen, m.screenY);
        ctx.closePath();
        ctx.fill();
        if (m.cfg.shadow) { 
             ctx.shadowColor = 'transparent'; 
        }
        ctx.stroke(); 

        ctx.fillStyle = m.cfg.bgColor; 
        ctx.beginPath();
        let pointerBaseY, pointerTipY;
        
        if (m.pointerPointsUp) { // Pointer is above bubble, pointing up to character
            pointerBaseY = m.screenY; 
            pointerTipY = m.charScreenAnchorY; // This is anchor Y from character
        } else { // Pointer is below bubble, pointing down to character
            pointerBaseY = m.screenY + m.heightScreen; 
            pointerTipY = m.charScreenAnchorY;
        }

        let pointerBubbleAttachX = m.charScreenX; // Target pointer to character's X
        const minAttachX = m.screenX + m.pointerWidthScreen / 2 + m.cornerRadiusScreen * 0.8;
        const maxAttachX = m.screenX + m.widthScreen - m.pointerWidthScreen / 2 - m.cornerRadiusScreen * 0.8;
        pointerBubbleAttachX = Math.max(minAttachX, Math.min(maxAttachX, pointerBubbleAttachX));

        ctx.moveTo(pointerBubbleAttachX - m.pointerWidthScreen / 2, pointerBaseY);
        ctx.lineTo(pointerBubbleAttachX + m.pointerWidthScreen / 2, pointerBaseY);
        ctx.lineTo(m.charScreenX, pointerTipY); 
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore(); 

        ctx.fillStyle = m.cfg.textColor;
        ctx.font = `${m.cfg.fontSizeScreen}px ${m.cfg.fontFamily}`;
        ctx.textAlign = 'left'; ctx.textBaseline = 'top';
        m.lines.forEach((line, i) => {
            const lineWidth = ctx.measureText(line).width;
            const lineX = m.screenX + (m.widthScreen - lineWidth) / 2; 
            ctx.fillText(line, lineX, m.screenY + m.paddingScreen + i * (m.cfg.fontSizeScreen * m.cfg.lineHeightFactor));
        });
    }
    _wrapTextScreen(text, maxWidthScreen) {
        const words = text.split(' '); let lines = [];
        if (!words.length) return lines;
        let currentLine = words[0];
        for (let i = 1; i < words.length; i++) {
            const word = words[i];
            const testLine = currentLine + " " + word;
            if (this.ctx.measureText(testLine).width < maxWidthScreen || currentLine === "") {
                currentLine = testLine;
            } else { lines.push(currentLine); currentLine = word; }
        }
        lines.push(currentLine); return lines;
    }

    _worldToScreen(worldX, worldY) {
        const screenX = (worldX - this.cameraState.x) * this.cameraState.zoom + this.canvas.width / 2;
        const screenY = (worldY - this.cameraState.y) * this.cameraState.zoom + this.canvas.height / 2;
        return [screenX, screenY];
    }
    _screenToWorld(screenX, screenY) {
        const worldX = (screenX - this.canvas.width / 2) / this.cameraState.zoom + this.cameraState.x;
        const worldY = (screenY - this.canvas.height / 2) / this.cameraState.zoom + this.cameraState.y;
        return [worldX, worldY];
    }

    _drawObjectInstance(objInstance) {
        if (!objInstance || !objInstance.blueprint) return;
        const ctx = this.ctx;
        ctx.save();
        ctx.translate(objInstance.x, objInstance.y);
        ctx.rotate(objInstance.rotation * Math.PI / 180);
        ctx.scale(objInstance.scale.x, objInstance.scale.y);

        objInstance.blueprint.components.forEach((comp, index) => {
            const effectiveComp = {...comp};
            // Apply instance-level overrides to the component for drawing
            if (objInstance.fillColor !== undefined) effectiveComp.fillColor = objInstance.fillColor;
            if (objInstance.strokeColor !== undefined) effectiveComp.strokeColor = objInstance.strokeColor;
            if (objInstance.lineWidth !== undefined) effectiveComp.lineWidth = objInstance.lineWidth;
            // Could add more overridable properties here (e.g. texture details if instance needs to vary them)

            this._drawComponent(effectiveComp); // Pass the component with potential overrides
            if (index === 0 && objInstance.isTargetedByLook) { // Highlight based on original component definition
                this._drawObjectHighlight(comp);
            }
        });
        ctx.restore();
    }
    _drawObjectHighlight(comp) {
        const ctx = this.ctx;
        ctx.save();
        if (comp.x !== undefined && comp.y !== undefined) ctx.translate(comp.x, comp.y);
        if (comp.rotation) ctx.rotate(comp.rotation * Math.PI / 180);
        if (comp.scale) ctx.scale(comp.scale.x === undefined ? comp.scale : comp.scale.x, comp.scale.y === undefined ? comp.scale : comp.scale.y);

        const highlightColor = "rgba(255, 255, 0, 0.4)"; 
        const highlightLineWidth = (comp.lineWidth || 1) + 4; 
        ctx.strokeStyle = highlightColor;
        ctx.lineWidth = highlightLineWidth;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        switch (comp.shape) {
            case 'rect':
                ctx.strokeRect(-comp.width / 2 -2, -comp.height / 2 -2, comp.width + 4, comp.height + 4);
                break;
            case 'circle':
                ctx.beginPath();
                ctx.arc(0, 0, comp.radius + 2, 0, Math.PI * 2);
                ctx.stroke();
                break;
            case 'path':
                if (comp.pathData && comp.pathData.length > 0) {
                    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                    comp.pathData.forEach(p => { // Basic AABB for path
                        if (p.x !== undefined) { minX = Math.min(minX, p.x); maxX = Math.max(maxX, p.x); }
                        if (p.y !== undefined) { minY = Math.min(minY, p.y); maxY = Math.max(maxY, p.y); }
                    });
                    if (minX !== Infinity) {
                        ctx.strokeRect(minX - 2, minY - 2, (maxX - minX) + 4, (maxY - minY) + 4);
                    }
                }
                break;
        }
        ctx.restore();
    }

    _drawComponent(comp) { // comp here is the effective component with overrides
        const ctx = this.ctx;
        ctx.save();
        if (comp.x !== undefined && comp.y !== undefined) ctx.translate(comp.x, comp.y);
        if (comp.rotation) ctx.rotate(comp.rotation * Math.PI / 180);
        if (comp.scale) ctx.scale(comp.scale.x === undefined ? comp.scale : comp.scale.x, comp.scale.y === undefined ? comp.scale : comp.scale.y);

        ctx.fillStyle = comp.fillColor || 'gray'; // Use the (potentially overridden) fillColor
        ctx.strokeStyle = comp.strokeColor || 'black';
        ctx.lineWidth = comp.lineWidth || 1;

        let localBounds;
        switch (comp.shape) {
            case 'rect':
                const rectX = -comp.width / 2; const rectY = -comp.height / 2;
                localBounds = {x: rectX, y: rectY, width: comp.width, height: comp.height};
                if (comp.texture) this._drawProceduralTexture(comp.texture, localBounds);
                else ctx.fillRect(rectX, rectY, comp.width, comp.height); // fillRect uses current fillStyle
                if (comp.strokeColor && comp.lineWidth > 0) ctx.strokeRect(rectX, rectY, comp.width, comp.height);
                break;
            case 'circle':
                localBounds = {x: -comp.radius, y: -comp.radius, width: comp.radius*2, height: comp.radius*2};
                ctx.beginPath(); ctx.arc(0, 0, comp.radius, 0, Math.PI * 2);
                if (comp.texture) { ctx.save(); ctx.clip(); this._drawProceduralTexture(comp.texture, localBounds); ctx.restore(); }
                else ctx.fill();
                if (comp.strokeColor && comp.lineWidth > 0) ctx.stroke();
                break;
            case 'path':
                if (comp.pathData && comp.pathData.length > 0) {
                    ctx.beginPath();
                    comp.pathData.forEach(p => {
                        switch(p.cmd.toUpperCase()) {
                            case 'M': ctx.moveTo(p.x, p.y); break;
                            case 'L': ctx.lineTo(p.x, p.y); break;
                            case 'Q': ctx.quadraticCurveTo(p.x1, p.y1, p.x, p.y); break;
                            case 'C': ctx.bezierCurveTo(p.x1, p.y1, p.x2, p.y2, p.x, p.y); break;
                            case 'A': ctx.arcTo(p.x1, p.y1, p.x2, p.y2, p.radius); break;
                            case 'Z': ctx.closePath(); break;
                        }
                    });
                    if (comp.fillColor) ctx.fill(); // fill uses current fillStyle
                    if (comp.strokeColor && comp.lineWidth > 0) ctx.stroke();
                }
                break;
        }
        ctx.restore();
    }

    _drawProceduralTexture(textureConfig, bounds) {
        const ctx = this.ctx;
        if (!bounds) return; 

        ctx.save();
        ctx.beginPath(); 
        ctx.rect(bounds.x, bounds.y, bounds.width, bounds.height);
        ctx.clip();

        const baseColor = textureConfig.baseColor || '#CCCCCC';
        const patternColor = textureConfig.patternColor || '#AAAAAA';
        ctx.fillStyle = baseColor;
        ctx.fillRect(bounds.x, bounds.y, bounds.width, bounds.height); 

        ctx.fillStyle = patternColor;
        ctx.strokeStyle = patternColor; 

        const density = textureConfig.density || 10; 

        switch (textureConfig.type) {
            case 'stripes':
                const stripeWidth = bounds.width / (density * 2); 
                for (let i = 0; i < density * 2; i += 2) {
                    ctx.fillRect(bounds.x + i * stripeWidth, bounds.y, stripeWidth, bounds.height);
                }
                break;
            case 'dots':
                const dotRadius = Math.min(bounds.width, bounds.height) / (density * 3);
                const spacingX = bounds.width / density;
                const spacingY = bounds.height / density;
                for (let i = 0; i < density; i++) {
                    for (let j = 0; j < density; j++) {
                        ctx.beginPath();
                        ctx.arc(bounds.x + spacingX * (i + 0.5), bounds.y + spacingY * (j + 0.5), dotRadius, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
                break;
            case 'checkered':
                const cellWidth = bounds.width / density;
                const cellHeight = bounds.height / density;
                for (let i = 0; i < density; i++) {
                    for (let j = 0; j < density; j++) {
                        if ((i + j) % 2 === 0) { 
                            ctx.fillRect(bounds.x + i * cellWidth, bounds.y + j * cellHeight, cellWidth, cellHeight);
                        }
                    }
                }
                break;
        }
        ctx.restore(); 
    }

    exportAnimation() {
        if (!this.animationData) {
            this.ui.statusDiv.textContent = "No animation data to export.";
            return;
        }
        const htmlContent = document.documentElement.outerHTML;
        let finalHtml = htmlContent.replace(/<script id="mainAnimationScript">[\s\S]*?<\/script>/, 
                                            `<script id="mainAnimationScript">${document.getElementById('mainAnimationScript').textContent}<\/script>`);
        
        const existingDataJson = /<script id="animationDataJson" type="application\/json">[\s\S]*?<\/script>/;
        if (finalHtml.match(existingDataJson)) {
            finalHtml = finalHtml.replace(existingDataJson, 
                `<script id="animationDataJson" type="application/json">${JSON.stringify(this.animationData, null, 2)}<\/script>`);
        } else {
            finalHtml = finalHtml.replace('</body>', 
                `<script id="animationDataJson" type="application/json">${JSON.stringify(this.animationData, null, 2)}<\/script>\n</body>`);
        }
        
        const minimalStyleOverride = `
        body.exported-body { justify-content: center; align-items: center; min-height: 100vh; padding-top: 20px; }
        h1.exported-h1 { margin-bottom: 10px; font-size: 1.6em; }
        #inputContainer { display: none !important; } 
        #exportBtn { display: none !important; } 
        `;
        if (finalHtml.includes('/* Exported player minimal style overrides */')) { 
             finalHtml = finalHtml.replace('/* Exported player minimal style overrides */', 
                `/* Exported player minimal style overrides */\n${minimalStyleOverride}`);
        } else if (finalHtml.includes('</style>')) { 
            finalHtml = finalHtml.replace('</style>', `${minimalStyleOverride}\n</style>`);
        }

        const blob = new Blob([finalHtml], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'animation_export_v2_refactored.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
        this.ui.statusDiv.textContent = "Animation exported as HTML file.";
    }
} // End of Animator Class

        loadJsonBtn: document.getElementById('loadJsonBtn'), statusDiv: document.getElementById('status'),
        animationCanvas: document.getElementById('animationCanvas'),
        playbackControlsContainer: document.getElementById('playbackControlsContainer'),
        playStopBtn: document.getElementById('playStopBtn'), restartBtn: document.getElementById('restartBtn'),
        exportBtn: document.getElementById('exportBtn'),
        inputContainer: document.getElementById('inputContainer')
    };
    window.animatorInstance = new Animator(uiElements.animationCanvas, uiElements);
});
