<script id="mainAnimationScript">
// Utility Functions
const Utils = {
    lerp: (a, b, t) => a + (b - a) * t,
    smoothStep: (t) => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2,
    degToRad: (deg) => deg * (Math.PI / 180),
    radToDeg: (rad) => rad * (180 / Math.PI),
    clamp: (val, min, max) => Math.min(Math.max(val, min), max),
    randomRange: (min, max) => Math.random() * (max - min) + min,
    adjustColor: (color, percent) => {
        if (!color || typeof color !== 'string' || !color.startsWith("#")) return color;
        try {
            let num = parseInt(color.replace("#",""), 16);
            let amt = Math.round(2.55 * percent * 10);
            let R = Utils.clamp((num >> 16) + amt, 0, 255);
            let G = Utils.clamp(((num >> 8) & 0x00FF) + amt, 0, 255);
            let B = Utils.clamp((num & 0x0000FF) + amt, 0, 255);
            return "#" + (0x1000000 + R * 0x10000 + G * 0x100 + B).toString(16).slice(1).toUpperCase();
        } catch (e) { return color; }
    },
    solve2LinkIK: (startX, startY, targetX, targetY, len1, len2, preferClockwiseBend = false) => {
        const dx = targetX - startX;
        const dy = targetY - startY;
        let distSq = dx * dx + dy * dy;
        let dist = Math.sqrt(distSq);

        // Clamp target if unreachable
        if (dist > len1 + len2 - 0.01) {
            const ratio = (len1 + len2) / (dist || 1);
            targetX = startX + dx * ratio;
            targetY = startY + dy * ratio;
            dist = len1 + len2; // Update dist
        } else if (dist < Math.abs(len1 - len2) + 0.01) {
            const ratio = Math.abs(len1 - len2) / (dist || 1);
            targetX = startX + dx * ratio;
            targetY = startY + dy * ratio;
            dist = Math.abs(len1 - len2);
        }
        
        const a = (len1 * len1 - len2 * len2 + dist * dist) / (2 * dist || 1);
        let hSq = len1 * len1 - a * a;
        const h = hSq > 0 ? Math.sqrt(hSq) : 0;

        const midX = startX + a * (dx / (dist || 1));
        const midY = startY + a * (dy / (dist || 1));
        
        const bendSign = preferClockwiseBend ? 1 : -1;
        const elbowX = midX + bendSign * h * (dy / (dist || 1));
        const elbowY = midY - bendSign * h * (dx / (dist || 1));

        return { elbow: { x: elbowX, y: elbowY }, hand: { x: targetX, y: targetY } };
    }
};

class Animator {
    constructor(canvasElement, uiElements) {
        this.canvas = canvasElement;
        this.ctx = this.canvas.getContext('2d');
        this.ui = uiElements;

        this.animationData = null;
        this.isPlaying = false;
        this.animationFrameId = null;
        this.lastTimestamp = 0;

        this.eventTimeline = [];
        this.currentEventGroupIndex = -1;
        this.activeEventGroup = null;
        this.activeEventGroupStatus = {};

        this.charactersState = {};
        this.objectsState = {}; // Kept for potential future object interactions
        this.cameraState = {
            x: 0, y: 0, zoom: 1,
            targetX: 0, targetY: 0, targetZoom: 1,
            focusEntities: [],
            panSpeed: 0.09,
            lerpCompleteThreshold: 0.01,
            zoomLerpCompleteThreshold: 0.0005,
            minZoom: 0.1, maxZoom: 5.0,
            verticalFocusBias: 0.1 // e.g., 0.1 means camera aims 10% lower than true center of focused entities
        };

        this.sceneLayers = [];
        this.defaultLayerName = 'main';

        // Behavior Constants
        this.BLINK_DURATION = 0.18;
        this.BLINK_INTERVAL_MIN = 2000; this.BLINK_INTERVAL_MAX = 5000;
        this.DART_DURATION = 0.15;
        this.DART_INTERVAL_MIN = 2500; this.DART_INTERVAL_MAX = 6000;
        this.IDLE_VARIATION_INTERVAL_MIN = 6000; this.IDLE_VARIATION_INTERVAL_MAX = 12000;
        this.IDLE_TRANSITION_DURATION = 0.8;
        this.POSE_TRANSITION_DURATION = 0.35;
        this.EXPRESSION_TRANSITION_DURATION = 0.3;
        this.TURN_ANIMATION_DURATION = 0.55;
        this.ACCESSORY_SWAY_SPRING = 0.15;
        this.ACCESSORY_SWAY_DAMPING = 0.88;

        this.speechBubbleConfig = {
            fontFamily: "Arial, sans-serif", fontSizeScreen: 14, paddingScreen: 10,
            marginScreen: { top: 20, side: 5 }, pointerHeightScreen: 18, pointerWidthScreen: 24,
            lineHeightFactor: 1.25, maxWidthScreenFactor: 0.35, minWidthScreen: 100,
            cornerRadiusScreen: 10, bgColor: "rgba(255, 255, 255, 0.98)",
            borderColor: "rgba(30, 30, 30, 0.9)", textColor: "#1A202C",
            shadow: { offsetX: 1, offsetY: 2, blur: 4, color: "rgba(0,0,0,0.18)" }
        };

        this.speechSynthesis = window.speechSynthesis;
        this.availableVoices = [];
        // TTS setup (same as before)
        if (this.speechSynthesis) {
            const loadVoices = () => {
                this.availableVoices = this.speechSynthesis.getVoices();
                console.log("Available TTS voices:", this.availableVoices.map(v => ({name: v.name, lang: v.lang})));
                if (this.ui.statusDiv && !this.animationData) {
                    this.ui.statusDiv.textContent = `TTS voices loaded (${this.availableVoices.length}). Load JSON.`;
                }
            };
            if (this.speechSynthesis.onvoiceschanged !== undefined) {
                this.speechSynthesis.onvoiceschanged = loadVoices;
            }
            loadVoices();
        } else {
            console.warn("Speech Synthesis not supported.");
            if (this.ui.statusDiv && !this.animationData) this.ui.statusDiv.textContent = "Speech Synthesis not supported. Load JSON.";
        }

        this._defineCharacterTemplates();
        this._definePoses();
        this._defineExpressions();
        this._defineMouthShapes(); // Called within _defineExpressions or CharacterParts

        this._bindUIEvents();
        this._checkForEmbeddedData();
    }
    
    // --- Core Definitions (Character, Poses, Expressions) ---
    _defineCharacterTemplates() {
        Animator.CHARACTER_TEMPLATES = {
            'human_default': {
                baseHeight: 160, // Reference height for part scaling

                    // Torso (root for this example)
                    { id: 'torso', parentId: null, pivot: { x: 0.5, y: 0.9 }, // Pivot at hip line center

                    // Head
                    { id: 'head', parentId: 'torso', anchorToParent: { x: 0.5, y: 0.05 }, pivot: { x: 0.5, y: 0.8 }, // Neck pivot

                    // Facial Features (parented to head)

                    { id: 'eyeR', parentId: 'head', anchorToParent: { x: 0.7, y: 0.4 }, shape: { type: 'eye', width: 0.08, height: 0.05, pupilSize: 0.03, fill: 'eyeWhiteColor', pupilFill: 'pupilColor', zIndex: 6 } },
                    { id: 'eyebrowL', parentId: 'head', anchorToParent: { x: 0.3, y: 0.25 }, shape: { type: 'line', length: 0.1, thickness: 0.015, color: 'hairColor', zIndex: 7 } },
                    { id: 'eyebrowR', parentId: 'head', anchorToParent: { x: 0.7, y: 0.25 }, shape: { type: 'line', length: 0.1, thickness: 0.015, color: 'hairColor', zIndex: 7 } },
                    { id: 'mouth', parentId: 'head', anchorToParent: { x: 0.5, y: 0.75 }, shape: { type: 'mouth', width: 0.15, initialShape: 'neutral', color: 'mouthColor', zIndex: 6 } },
                    { id: 'nose', parentId: 'head', anchorToParent: {x: 0.5, y: 0.55}, shape: { type: 'line', length: 0.04, thickness: 0.01, color: 'skinDarkerColor', zIndex: 6, angle: 90}},
                    // Hair (example)
                    { id: 'hair', parentId: 'head', anchorToParent: {x:0.5, y:0.1}, shape: { type: 'ellipse', width:0.32, height:0.32, fill: 'hairColor', zIndex:4} }, // Simple cap hair
                    // Limbs (L=Character's Left, R=Character's Right)
                    // Far Side (drawn first if profile/3q)
                    { id: 'armUpperL_far', parentId: 'torso', anchorToParent: { x: 0.15, y: 0.15 }, pivot: {x:0.5, y:0.1}, shape: { type: 'rect', width: 0.08, height: 0.25, fill: 'sleeveColor', zIndex: -1 } },
                    { id: 'armLowerL_far', parentId: 'armUpperL_far', anchorToParent: {x:0.5, y:0.9}, pivot: {x:0.5, y:0.1}, shape: { type: 'rect', width: 0.07, height: 0.22, fill: 'sleeveColor', zIndex: -1 } },
                    { id: 'handL_far', parentId: 'armLowerL_far', anchorToParent: {x:0.5, y:0.95}, pivot: {x:0.5, y:0.1}, shape: { type: 'ellipse', width: 0.07, height: 0.07, fill: 'skinColor', zIndex: -1 } },
                    { id: 'legUpperL_far', parentId: 'torso', anchorToParent: {x:0.3, y:0.9}, pivot: {x:0.5, y:0.1}, shape: { type: 'rect', width: 0.1, height: 0.3, fill: 'pantsColor', zIndex: -2 } },
                    { id: 'legLowerL_far', parentId: 'legUpperL_far', anchorToParent: {x:0.5, y:0.9}, pivot: {x:0.5, y:0.1}, shape: { type: 'rect', width: 0.09, height: 0.28, fill: 'pantsColor', zIndex: -2 } },
                    { id: 'footL_far', parentId: 'legLowerL_far', anchorToParent: {x:0.5, y:0.95}, pivot: {x:0.2, y:0.5}, shape: { type: 'ellipse', width: 0.12, height: 0.06, fill: 'shoeColor', zIndex: -2 } },
                    // Near Side
                    { id: 'armUpperR_near', parentId: 'torso', anchorToParent: { x: 0.85, y: 0.15 }, pivot: {x:0.5, y:0.1}, shape: { type: 'rect', width: 0.08, height: 0.25, fill: 'sleeveColor', zIndex: 1 } },
                    { id: 'armLowerR_near', parentId: 'armUpperR_near', anchorToParent: {x:0.5, y:0.9}, pivot: {x:0.5, y:0.1}, shape: { type: 'rect', width: 0.07, height: 0.22, fill: 'sleeveColor', zIndex: 1 } },
                    { id: 'handR_near', parentId: 'armLowerR_near', anchorToParent: {x:0.5, y:0.95}, pivot: {x:0.5, y:0.1}, shape: { type: 'ellipse', width: 0.07, height: 0.07, fill: 'skinColor', zIndex: 1 } },
                    { id: 'legUpperR_near', parentId: 'torso', anchorToParent: {x:0.7, y:0.9}, pivot: {x:0.5, y:0.1}, shape: { type: 'rect', width: 0.1, height: 0.3, fill: 'pantsColor', zIndex: -1 } }, // Behind torso but in front of far leg
                    { id: 'legLowerR_near', parentId: 'legUpperR_near', anchorToParent: {x:0.5, y:0.9}, pivot: {x:0.5, y:0.1}, shape: { type: 'rect', width: 0.09, height: 0.28, fill: 'pantsColor', zIndex: -1 } },
                    { id: 'footR_near', parentId: 'legLowerR_near', anchorToParent: {x:0.5, y:0.95}, pivot: {x:0.2, y:0.5}, shape: { type: 'ellipse', width: 0.12, height: 0.06, fill: 'shoeColor', zIndex: -1 } },
                     // Tzitzit (example, assuming male character variant)
                    { id: 'tzitzit_FL', parentId: 'torso', anchorToParent: {x:0.25, y:0.85}, shape: { type: 'tzitzit_strand', length: 0.2, numStrings: 2, color: 'tzitzitColor', zIndex: 2 }},
                    { id: 'tzitzit_FR', parentId: 'torso', anchorToParent: {x:0.75, y:0.85}, shape: { type: 'tzitzit_strand', length: 0.2, numStrings: 2, color: 'tzitzitColor', zIndex: 2 }},
                    { id: 'tzitzit_BL', parentId: 'torso', anchorToParent: {x:0.25, y:0.85}, shape: { type: 'tzitzit_strand', length: 0.2, numStrings: 2, color: 'tzitzitColor', zIndex: -3 }}, // Back tzitzit
                    { id: 'tzitzit_BR', parentId: 'torso', anchorToParent: {x:0.75, y:0.85}, shape: { type: 'tzitzit_strand', length: 0.2, numStrings: 2, color: 'tzitzitColor', zIndex: -3 }},
                ],
                // Default color palette
                palette: {
                    skinColor: '#FCD9B6', skinDarkerColor: '#E0AF8C',
                    hairColor: '#4A3B31', pupilColor: '#333333', eyeWhiteColor: '#FFFFFF',
                    mouthColor: '#8C4A51', shirtColor: '#3498DB', sleeveColor: '#3498DB',
                    pantsColor: '#2C3E50', shoeColor: '#59453A', tzitzitColor: '#F0F0F0',
                    outlineColor: '#222222'
                },
                // Facing mode specific part properties (scale, offset, zIndex overrides)
                facingOverrides: {

                        armUpperR_near: { visible: false }, legUpperR_near: { visible: false },

                        eyebrowR: { anchorToParent: {x:0.4, y:0.25}},
                        eyebrowL: { visible: false },

                        legUpperR_near: { idAlias: 'legUpper_profile', zIndex: 0 },
                        tzitzit_FL: { visible: false}, tzitzit_BL: { visible: false},
                        tzitzit_FR: { anchorToParent: {x:0.5, y:0.85} }, tzitzit_BR: { anchorToParent: {x:0.5, y:0.85} }
                    },

                        eyeR: { anchorToParent: {x:0.75, y:0.42}, shape: {width:0.06, height:0.04} }, // Far eye smaller, slightly shifted

    _definePoses() {
        // Poses define transformations (x, y, rotation, scale) for character parts
        // Values are relative to the part's own pivot. Rotations in degrees.
        // For IK, specify target part and target point on that part.
        Animator.POSES = {
            'idle_default': {
                bobOffsetFactor: 0.01,
                head: { rotation: (phase) => Math.sin(phase * 0.75) * 2.5 },
                torso: { y: (phase) => Math.sin(phase * 0.5) * 0.01 }, // Subtle body sway
                armUpperL_far: { rotation: 10 }, armLowerL_far: { rotation: 5 },
                armUpperR_near: { rotation: -10 }, armLowerR_near: { rotation: -5 },
                legUpperL_far: { rotation: 2 }, legUpperR_near: { rotation: -2 }
            },
            'walk': {
                bobOffsetFactor: 0.03,
                head: { rotation: (phase) => Math.sin(phase) * 3 },
                torso: { rotation: (phase) => Math.sin(phase) * 2, y:(phase) => Math.abs(Math.sin(phase*0.5)) * -0.02},
                // Arms and legs swing based on phase
                armUpperL_far: { rotation: (phase) => 45 * Math.sin(phase) },

            reader.onload = (e) => {
                try {
                    const jsonData = JSON.parse(e.target.result);
                    this.ui.jsonInput.value = e.target.result; // Display loaded JSON
                    this.loadAnimation(jsonData);
                } catch (err) {
                    this.ui.statusDiv.textContent = "Error parsing JSON file: " + err.message;
                    console.error("JSON File Parse Error:", err);

            reader.readAsText(file);

    loadAnimation(data) {
        if (!data || !data.scene || !data.characters || !data.timeline || !Array.isArray(data.timeline)) {
            this.ui.statusDiv.textContent = "Invalid JSON: Missing scene, characters, or valid timeline array.";
            return;
        }
        this.stopAnimation();
        this.animationData = data;

        // Event timeline setup (same as original)
        this.eventTimeline = this.animationData.timeline.map((group, groupIndex) =>
            group.map((event, eventIndex) => ({ ...event, _instanceId: `g${groupIndex}_e${eventIndex}` }))
        );

        // Canvas and scene setup
        this.canvas.width = this.animationData.scene.width || 800;
        this.canvas.height = this.animationData.scene.height || 600;
        this.canvas.style.backgroundColor = this.animationData.scene.backgroundColor || "#F0F8FF";

        this.sceneLayers = (this.animationData.scene.layers || [{ name: this.defaultLayerName, zIndex: 10, parallaxFactor: 1.0 }])
            .sort((a,b) => a.zIndex - b.zIndex);
        if (!this.sceneLayers.find(l => l.name === this.defaultLayerName)) {
             this.sceneLayers.push({ name: this.defaultLayerName, zIndex: 10, parallaxFactor: 1.0 });
             this.sceneLayers.sort((a,b) => a.zIndex - b.zIndex);
        }
        
        // Camera setup (largely same, includes verticalFocusBias)
        this.cameraState = {
            ...this.cameraState, 
            x: this.animationData.scene.initialCamera?.x ?? (this.canvas.width / 2), 
            y: this.animationData.scene.initialCamera?.y ?? (this.canvas.height / 2), 
            zoom: this.animationData.scene.initialCamera?.zoom ?? 1,
            targetX: this.animationData.scene.initialCamera?.x ?? (this.canvas.width / 2), 
            targetY: this.animationData.scene.initialCamera?.y ?? (this.canvas.height / 2), 
            targetZoom: this.animationData.scene.initialCamera?.zoom ?? 1, 
            focusEntities: null,
            verticalFocusBias: this.animationData.scene.initialCamera?.verticalFocusBias ?? 0.1,
        };
        if(this.eventTimeline.length > 0 && this.eventTimeline[0].length > 0) {
            this.eventTimeline[0].forEach(event => {
                if (event.type === 'camera') this._applyCameraEvent(event, true);
            });
        }

        // Initialize Characters with new structure
        this.charactersState = {};
        this.animationData.characters.forEach(charDef => {
            const template = Animator.CHARACTER_TEMPLATES[charDef.templateId || 'human_default'];
            if (!template) {
                console.warn(`Character template "${charDef.templateId}" not found for character "${charDef.id}". Skipping.`);
                return;
            }

            const charState = {
                id: charDef.id,
                templateId: charDef.templateId || 'human_default',
                x: charDef.initialPosition.x, y: charDef.initialPosition.y,
                targetX: charDef.initialPosition.x, targetY: charDef.initialPosition.y,
                startXForWalk: charDef.initialPosition.x, startYForWalk: charDef.initialPosition.y,
                facing: charDef.facing || 'right',
                facingMode: charDef.facingMode || 'profile', // 'profile', 'threeQuarter', 'front'
                
                activePoseName: charDef.initialPose || 'idle_default',
                previousPoseName: charDef.initialPose || 'idle_default',
                poseTransitionProgress: 1.0,
                poseTransitionDuration: this.POSE_TRANSITION_DURATION,
                
                activeExpressionName: charDef.appearance?.expression || 'neutral',
                previousExpressionName: charDef.appearance?.expression || 'neutral',
                expressionTransitionProgress: 1.0,
                expressionTransitionDuration: this.EXPRESSION_TRANSITION_DURATION,

                dialogueText: null, isSpeakingTTS: false, currentActions: [],
                layer: charDef.layer || this.defaultLayerName,
                size: charDef.size || 1.0, // Overall character scale
                
                // Deep clone parts and apply appearance overrides
                parts: JSON.parse(JSON.stringify(template.parts)),
                palette: { ...template.palette, ...(charDef.appearance?.palette || {}) },
                
                // Dynamic behavior states
                behaviors: this._getDefaultBehaviorState(), // (To be implemented similarly to original)
                posePhase: Math.random() * Math.PI * 2,
                swayPhase: Math.random() * Math.PI * 2, // For tzitzit, etc.

                // Store final computed transforms for each part
                partTransforms: {},
                // Appearance flags
                hasTzitzit: charDef.appearance?.hasTzitzit !== undefined ? charDef.appearance.hasTzitzit : (charDef.gender === 'male'),
                // ... other appearance flags like hat type, hair style if they modify part visibility/shape
            };
            this._initializeCharacterParts(charState); // Initialize partTransforms
            this.charactersState[charDef.id] = charState;
        });

        // Objects (simplified for now, can be expanded like characters)
        this.objectsState = {};
        if (this.animationData.objects && this.animationData.assets && this.animationData.assets.objectBlueprints) {
            this.animationData.objects.forEach(objInstance => { /* Same as original */ });
        }

        this.ui.statusDiv.textContent = `Animation loaded. ${this.eventTimeline.length} event groups. Characters: ${Object.keys(this.charactersState).length}.`;
        this.ui.playbackControlsContainer.classList.remove('hidden');
        this.drawScene();
    }

    _initializeCharacterParts(charState) {
        charState.partTransforms = {};
        const template = Animator.CHARACTER_TEMPLATES[charState.templateId];
        template.parts.forEach(partDef => {
            charState.partTransforms[partDef.id] = {
                x: 0, y: 0, // Relative to parent's anchor + own pivot
                rotation: 0, // Degrees
                scaleX: 1, scaleY: 1,
                alpha: 1,
                visible: true,
                // Store resolved shape & drawing properties based on palette, appearance, facing mode
                computedShape: {},
                // Store original definition for reference
                definition: partDef 
            };
        });
    }

    // --- Animation Loop & State Update (Event processing largely similar) ---
    togglePlayStop() { /* Identical to original */ 
        if (!this.animationData) return;
        if (this.isPlaying) this.stopAnimation();
        else this.playAnimation();
    }
    playAnimation() { /* Identical to original (logic-wise) */
        if (!this.animationData || this.isPlaying) return;
        this.isPlaying = true;
        this.ui.playStopBtn.textContent = "Stop";
        if (this.currentEventGroupIndex === -1 || this.currentEventGroupIndex >= this.eventTimeline.length) {
            this.restartAnimationPrerequisites(); 
        }
        this.lastTimestamp = performance.now();
        this.processNextEventGroup();
        if (!this.animationFrameId) this.animationLoop();
    }
    stopAnimation() { /* Identical to original (logic-wise) */
        this.isPlaying = false;
        this.ui.playStopBtn.textContent = "Play";
        if (this.animationFrameId) {
            cancelAnimationFrame(this.animationFrameId);
            this.animationFrameId = null;
        }
        if (this.speechSynthesis) this.speechSynthesis.cancel();
        Object.values(this.charactersState).forEach(c => { if(c) c.isSpeakingTTS = false; });
        this.drawScene();
    }
    restartAnimationPrerequisites() { /* Calls new _resetCharacterStatesToInitial */
        this.currentEventGroupIndex = -1;
        this.activeEventGroup = null;
        this.activeEventGroupStatus = {};
        if (this.speechSynthesis) this.speechSynthesis.cancel();
        this._resetCharacterStatesToInitial();
    }
    restartAnimation() { /* Identical to original (logic-wise) */
        if (!this.animationData) return;
        const wasPlaying = this.isPlaying;
        this.stopAnimation(); 
        this.restartAnimationPrerequisites();
        this.drawScene(); 
        if (wasPlaying) setTimeout(() => this.playAnimation(), 50);
    }

    _resetCharacterStatesToInitial() {
        if (!this.animationData || !this.animationData.characters) return;
        this.animationData.characters.forEach(charDef => {
            const charState = this.charactersState[charDef.id];
            if (!charState) return;

            charState.x = charDef.initialPosition.x; charState.y = charDef.initialPosition.y;
            charState.targetX = charDef.initialPosition.x; charState.targetY = charDef.initialPosition.y;
            charState.startXForWalk = charDef.initialPosition.x; charState.startYForWalk = charDef.initialPosition.y;
            charState.facing = charDef.facing || 'right';
            charState.facingMode = charDef.facingMode || 'profile';
            
            this._setPose(charState, charDef.initialPose || 'idle_default', 0.01);
            this._setExpression(charState, charDef.appearance?.expression || 'neutral', 0.01);

            charState.dialogueText = null; charState.isSpeakingTTS = false; charState.currentActions = [];
            charState.behaviors = this._getDefaultBehaviorState();
            charState.posePhase = Math.random() * Math.PI * 2;
            charState.swayPhase = Math.random() * Math.PI * 2;
            this._updateCharacterPartDefinitions(charState); // Apply facing mode overrides
        });
        // Reset objects if any
        Object.values(this.objectsState).forEach(obj => obj.isTargetedByLook = false);

        // Reset camera
        this.cameraState.targetX = this.animationData.scene.initialCamera?.x ?? (this.canvas.width / 2);
        this.cameraState.targetY = this.animationData.scene.initialCamera?.y ?? (this.canvas.height / 2);
        this.cameraState.targetZoom = this.animationData.scene.initialCamera?.zoom ?? 1.0;
        this.cameraState.focusEntities = null;
        if(this.eventTimeline.length > 0 && this.eventTimeline[0].length > 0) {
            this.eventTimeline[0].forEach(event => {
                if (event.type === 'camera') this._applyCameraEvent(event, true);
            });
        }
        this.cameraState.x = this.cameraState.targetX;
        this.cameraState.y = this.cameraState.targetY;
        this.cameraState.zoom = this.cameraState.targetZoom;
    }


    animationLoop() { /* Logic similar to original, calls new _updateState */
        if (!this.isPlaying && (!this.activeEventGroup || Object.keys(this.activeEventGroupStatus).length === 0)) {
            this.animationFrameId = null;
            return;
        }
        const now = performance.now();
        const deltaTime = Math.min(0.1, (now - this.lastTimestamp) / 1000 || 0); // Cap deltaTime
        this.lastTimestamp = now;
        
        this._updateState(deltaTime, now); 
        this.drawScene();
        this.animationFrameId = requestAnimationFrame(() => this.animationLoop());
    }

    // Event processing (_initiateEvent, _finalizeEvent, etc.) would be similar to original,
    // but actions like 'pose' or 'expression' would call the new _setPose and _setExpression.
    // _setPose and _setExpression are crucial:
    _setPose(character, newPoseName, duration = this.POSE_TRANSITION_DURATION) {
        if (!character || !Animator.POSES[newPoseName]) {
            console.warn(`Pose "${newPoseName}" not found for char ${character.id}. Using idle_default.`);
            newPoseName = 'idle_default';
        }
        if (character.activePoseName === newPoseName && character.poseTransitionProgress >= 1) return;
        
        character.previousPoseName = character.activePoseName;
        character.activePoseName = newPoseName;
        character.poseTransitionProgress = 0;
        character.poseTransitionDuration = duration > 0.01 ? duration : 0.01;
    }

    _setExpression(character, newExpressionName, duration = this.EXPRESSION_TRANSITION_DURATION) {
        if (!character || !Animator.EXPRESSIONS[newExpressionName]) {
            console.warn(`Expression "${newExpressionName}" not found for char ${character.id}. Using neutral.`);
            newExpressionName = 'neutral';
        }
         if (character.activeExpressionName === newExpressionName && !character.behaviors.emphasis.active && character.expressionTransitionProgress >=1) return;

        character.previousExpressionName = character.activeExpressionName;
        character.activeExpressionName = newExpressionName;
        character.expressionTransitionProgress = 0;
        character.expressionTransitionDuration = duration > 0.01 ? duration : 0.01;
    }

    // _initiateEvent, _finalizeEvent, processNextEventGroup, etc. would retain their logic flow from the original
    // but adapt to calling new state management and character update functions.
    // For brevity, I'll skip re-listing them as their core control flow is similar.
    // Key difference: 'action' event for pose change would call `this._setPose(...)`.
    // The following methods are representative of the logic needed but were in the original.
    _initiateEvent(event, groupStartTime) { /* Similar logic flow to original, but calls new methods */ }
    _finalizeEvent(event, currentTimePerformance) { /* Similar logic flow to original */ }
    processNextEventGroup() { /* Similar logic flow to original */ }
    _checkAndProceedIfGroupCompleted() { /* Similar logic flow to original */ }
    _applyCameraEvent(event, immediate = false) { /* Similar logic flow to original */ }

    // --- Main Update Logic ---
    _updateState(deltaTime, currentTime) {
        // Update camera
        this._updateCameraTarget(false);
        const camState = this.cameraState;
        if (Math.abs(camState.targetX - camState.x) > camState.lerpCompleteThreshold ||
            Math.abs(camState.targetY - camState.y) > camState.lerpCompleteThreshold) {
            camState.x = Utils.lerp(camState.x, camState.targetX, camState.panSpeed);
            camState.y = Utils.lerp(camState.y, camState.targetY, camState.panSpeed);
        } else { camState.x = camState.targetX; camState.y = camState.targetY; }

        if (Math.abs(camState.targetZoom - camState.zoom) > camState.zoomLerpCompleteThreshold) {
             camState.zoom = Utils.lerp(camState.zoom, camState.targetZoom, camState.panSpeed);
        } else { camState.zoom = camState.targetZoom; }
        camState.zoom = Utils.clamp(camState.zoom, camState.minZoom, camState.maxZoom);

        // Update characters
        Object.values(this.charactersState).forEach(char => {
            this._updateCharacterState(char, deltaTime, currentTime);
        });

        // Update event group completion (from original, adapted)
        if (this.activeEventGroup) {
            let allCompletedInGroup = true;
            for (const event of this.activeEventGroup) {
                const status = this.activeEventGroupStatus[event._instanceId];
                if (!status || status.completed) continue;
                if (status.type === 'timed' && currentTime >= status.startTime + status.duration * 1000) {
                    status.completed = true;
                    this._finalizeEvent(event, currentTime); 
                }
                if (!status.completed) allCompletedInGroup = false;
            }
            if (allCompletedInGroup) this._finalizeAndProceedFromGroup();
        }
         this._cleanupExpiredNonBlockingStates(currentTime);

    }
    _finalizeAndProceedFromGroup() { /* Same as original */ }
    _cleanupExpiredNonBlockingStates(currentTimePerformance) { /* Same as original */ }


    _updateCameraTarget(immediate = false) { // Modified for vertical bias
        let explicitPanOverride = false;
        let explicitZoomOverride = false;

        if (this.activeEventGroup) { /* ... same override check as original ... */ }
        
        if (this.cameraState.focusEntities && this.cameraState.focusEntities.length > 0 && (!explicitPanOverride || !explicitZoomOverride)) {
            let focusBounds = { minX: Infinity, minY: Infinity, maxX: -Infinity, maxY: -Infinity, count: 0 };
            this.cameraState.focusEntities.forEach(entityId => {
                const character = this.charactersState[entityId];
                if (character) {
                    const charHeight = Animator.CHARACTER_TEMPLATES[character.templateId].baseHeight * character.size;
                    const charWidthApprox = charHeight * 0.5; // Rough width
                    focusBounds.minX = Math.min(focusBounds.minX, character.x - charWidthApprox / 2);
                    focusBounds.maxX = Math.max(focusBounds.maxX, character.x + charWidthApprox / 2);
                    focusBounds.minY = Math.min(focusBounds.minY, character.y - charHeight); // Top of character
                    focusBounds.maxY = Math.max(focusBounds.maxY, character.y); // Bottom of character (feet)
                    focusBounds.count++;
                }
                // ... add object logic if needed ...
            });

            if (focusBounds.count > 0) {
                if (!explicitPanOverride) {
                    this.cameraState.targetX = (focusBounds.minX + focusBounds.maxX) / 2;
                    // Apply vertical bias: center slightly lower to keep feet in frame better
                    const verticalCenter = (focusBounds.minY + focusBounds.maxY) / 2;
                    const bboxHeight = focusBounds.maxY - focusBounds.minY;
                    this.cameraState.targetY = verticalCenter + bboxHeight * this.cameraState.verticalFocusBias;
                }
                if (!explicitZoomOverride) { /* ... same zoom logic as original ... */
                    const paddingFactor = 0.3; 
                    const bboxWidth = Math.max(100, focusBounds.maxX - focusBounds.minX) * (1 + paddingFactor * 2);
                    const bboxHeight = Math.max(100, focusBounds.maxY - focusBounds.minY) * (1 + paddingFactor * 2);
                    
                    const zoomToFitWidth = this.canvas.width / bboxWidth;
                    const zoomToFitHeight = this.canvas.height / bboxHeight;
                    let targetZoomVal = Math.min(zoomToFitWidth, zoomToFitHeight);
                    this.cameraState.targetZoom = Utils.clamp(targetZoomVal, this.cameraState.minZoom, this.cameraState.maxZoom);
                }
            }
        }
        if (immediate) {
            this.cameraState.x = this.cameraState.targetX;

            if ( (actEvent.action === 'walk' || actEvent.action === 'run') && eventStatus && !eventStatus.completed) {
                // This needs to be adapted from original stick figure walk interpolation
                const duration = eventStatus.duration;
                const timeIntoWalk = Math.min(duration, (currentTime - eventStatus.startTime)/1000); 
                const walkProgress = duration > 0.001 ? Math.min(1, timeIntoWalk / duration) : 1;
                char.x = char.startXForWalk + (actEvent.targetPosition.x - char.startXForWalk) * walkProgress;
                char.y = char.startYForWalk + (actEvent.targetPosition.y - char.startYForWalk) * walkProgress;
                if (!char.behaviors.turning.isActive && !actEvent.facing) {

    // --- Pose & Expression Application ---
    _calculateCharacterPartTransforms(char) {
        const currentPoseDef = Animator.POSES[char.activePoseName] || Animator.POSES['idle_default'];
        const prevPoseDef = Animator.POSES[char.previousPoseName] || Animator.POSES['idle_default'];
        const tPose = Utils.smoothStep(char.poseTransitionProgress);

        const currentExprDef = Animator.EXPRESSIONS[char.activeExpressionName] || Animator.EXPRESSIONS['neutral'];
        const prevExprDef = Animator.EXPRESSIONS[char.previousExpressionName] || Animator.EXPRESSIONS['neutral'];
        const tExpr = Utils.smoothStep(char.expressionTransitionProgress);

        // Bobbing
        let bobOffset = 0;
        const currentBobFactor = typeof currentPoseDef.bobOffsetFactor === 'function' ? currentPoseDef.bobOffsetFactor(char.posePhase) : (currentPoseDef.bobOffsetFactor || 0);
        const prevBobFactor = typeof prevPoseDef.bobOffsetFactor === 'function' ? prevPoseDef.bobOffsetFactor(char.posePhase) : (prevPoseDef.bobOffsetFactor || 0);
        bobOffset = Utils.lerp(prevBobFactor, currentBobFactor, tPose) * Animator.CHARACTER_TEMPLATES[char.templateId].baseHeight * char.size;

            // Initial validation for partState and its resolved definition

            // Visibility check (use visibility from partState.definition which includes facing mode overrides)
            if (!partState.definition.visible) {

            partState.visible = true; // Mark as visible for processing if definition says so


            const pDef = partState.definition; // Resolved definition for this frame

            // --- 1. Initialize Local Transforms ---
            let localX = 0, localY = 0, localRot = 0, localSX = 1, localSY = 1;

            // --- 2. Apply Pose Transformations ---
            const getPoseVal = (poseDef, prop, defaultVal = 0) => {
                const partPose = poseDef[idForPose];
                if (partPose && partPose[prop] !== undefined) {
                    return typeof partPose[prop] === 'function' ? partPose[prop](char.posePhase) : partPose[prop];
                }
                return defaultVal;
            };

            localRot = Utils.lerp(getPoseVal(prevPoseDef, 'rotation'), getPoseVal(currentPoseDef, 'rotation'), tPose);
            localX = Utils.lerp(getPoseVal(prevPoseDef, 'x'), getPoseVal(currentPoseDef, 'x'), tPose) * baseHeight;
            localY = Utils.lerp(getPoseVal(prevPoseDef, 'y'), getPoseVal(currentPoseDef, 'y'), tPose) * baseHeight;
            // localSX and localSY can also be driven by poses if needed

            // --- 3. Apply IK (Placeholder - complex integration needed for full IK) ---
            const currentPartPose = currentPoseDef[idForPose];
            if (currentPartPose && currentPartPose.ikTarget) {
                // Full IK would involve solving for 'localRot' of this part and its relevant ancestors
                // based on the 'ikTarget' and limb lengths.
                // For now, this section is a conceptual placeholder.
            }

            // --- 4. Apply Expression Modifications (mainly for facial features) ---
            const getExprVal = (exprDef, partKey, propPath, defaultVal) => {
                const partExpr = exprDef[partKey]; // Use direct partKey (pDef.id) for expressions
                if (partExpr) {
                    let val = partExpr;
                    propPath.forEach(p => { if (val) val = val[p]; });
                    if (val !== undefined) return val;
                }
                return defaultVal;
            };

            if (pDef.id.includes('eye') || pDef.id.includes('eyebrow') || pDef.id.includes('mouth')) {
                let shapeParams = { ...(partState.computedShape.params || {}) };
                if (pDef.id.includes('eye')) {
                    shapeParams.eyeOpenFactor = Utils.lerp(getExprVal(prevExprDef, pDef.id, ['shapeParams', 'eyeOpenFactor'], 1), getExprVal(currentExprDef, pDef.id, ['shapeParams', 'eyeOpenFactor'], 1), tExpr);
                    shapeParams.pupilShiftX = Utils.lerp(getExprVal(prevExprDef, pDef.id, ['shapeParams', 'pupilShiftX'], 0), getExprVal(currentExprDef, pDef.id, ['shapeParams', 'pupilShiftX'], 0), tExpr) + char.behaviors.eyeDarts.currentPupilShiftX * baseHeight * 0.002;

            if (pDef.id === 'head') {

            // --- 6. Calculate Anchor Offset from Parent ---
            let anchorXOffsetFromParentOrigin = 0;
            let anchorYOffsetFromParentOrigin = 0;

            if (pDef.parentId && pDef.anchorToParent && parentTransform) { // parentTransform should always exist for children
                // Ensure parentTransform dimensions are valid numbers
                const parentWidth = typeof parentTransform.width === 'number' ? parentTransform.width : baseHeight * 0.1; // Default if invalid
                const parentHeight = typeof parentTransform.height === 'number' ? parentTransform.height : baseHeight * 0.1;
                
                anchorXOffsetFromParentOrigin = (typeof pDef.anchorToParent.x === 'number' ? pDef.anchorToParent.x : 0.5) * parentWidth;
                anchorYOffsetFromParentOrigin = (typeof pDef.anchorToParent.y === 'number' ? pDef.anchorToParent.y : 0.5) * parentHeight;
            }
            // Rotate this anchor offset by parent's rotation
            const cosP = Math.cos(Utils.degToRad(parentTransform.rotation));
            const sinP = Math.sin(Utils.degToRad(parentTransform.rotation));
            const rotatedAnchorX = anchorXOffsetFromParentOrigin * cosP - anchorYOffsetFromParentOrigin * sinP;
            const rotatedAnchorY = anchorXOffsetFromParentOrigin * sinP + anchorYOffsetFromParentOrigin * cosP;

            // --- 7. Calculate Pivot Offset for This Part ---
            // Ensure pDef.pivot and its coords are valid
            const pivotDefX = (pDef.pivot && typeof pDef.pivot.x === 'number') ? pDef.pivot.x : 0.5;
            const pivotDefY = (pDef.pivot && typeof pDef.pivot.y === 'number') ? pDef.pivot.y : 0.5;

            // Get base dimensions of THIS part for its pivot calculation
            let partBaseWidthForPivot, partBaseHeightForPivot;
            if (!pDef.shape) { // Should have been caught earlier if pDef.shape was issue
                 console.error(`Shape undefined for pivot calculation on part ${partId}`);
                 partBaseWidthForPivot = baseHeight * 0.1; partBaseHeightForPivot = baseHeight * 0.1;
            } else if (pDef.shape.type === 'line') {
                partBaseWidthForPivot = (typeof pDef.shape.length === 'number' ? pDef.shape.length : 0.1) * baseHeight;
                partBaseHeightForPivot = (typeof pDef.shape.thickness === 'number' ? pDef.shape.thickness : 0.01) * baseHeight;
            } else if (pDef.shape.type === 'tzitzit_strand') {
                partBaseHeightForPivot = (typeof pDef.shape.length === 'number' ? pDef.shape.length : 0.1) * baseHeight;
                partBaseWidthForPivot = (pDef.shape.numStrings || 2) * baseHeight * 0.01;
            } else { // Default for rect, ellipse, eye, mouth, hair (assuming they have width/height)
                partBaseWidthForPivot = (typeof pDef.shape.width === 'number' ? pDef.shape.width : 0.1) * baseHeight;
                partBaseHeightForPivot = (typeof pDef.shape.height === 'number' ? pDef.shape.height : 0.1) * baseHeight;
            }
            
            const pivotX = pivotDefX * partBaseWidthForPivot;
            const pivotY = pivotDefY * partBaseHeightForPivot;

            // Rotate this pivot offset by this part's local rotation
            const cosL = Math.cos(Utils.degToRad(localRot));
            const sinL = Math.sin(Utils.degToRad(localRot));
            const rotatedPivotX = pivotX * cosL - pivotY * sinL;
            const rotatedPivotY = pivotX * sinL + pivotY * cosL;

            // --- 8. Finalize Part's World-Relative Transform (relative to character root) ---
            partState.x = parentTransform.x + rotatedAnchorX - rotatedPivotX + localX;
            partState.y = parentTransform.y + rotatedAnchorY - rotatedPivotY + localY;
            partState.rotation = parentTransform.rotation + localRot;

            const effectiveParentTransformForChildren = {

                rotation: partState.rotation,

                height: partBaseHeightForPivot * partState.scaleY,

                alpha: partState.alpha

            template.parts.forEach(childPartDef => {

                    if (childPartState) { // Child state must exist

    _drawCharacter(char) {
        this.ctx.save();
        this.ctx.translate(char.x, char.y); // Position character root
        this.ctx.scale(char.size, char.size); // Overall character size

        const baseHeight = Animator.CHARACTER_TEMPLATES[char.templateId].baseHeight;

        // Sort parts by zIndex for correct layering within the character
        const sortedPartIds = Object.keys(char.partTransforms)
            .sort((a, b) => (char.partTransforms[a].definition.zIndex || 0) - (char.partTransforms[b].definition.zIndex || 0));

        sortedPartIds.forEach(partId => {
            const partState = char.partTransforms[partId];
            if (!partState || !partState.visible) return;

            const pDef = partState.definition; // This is the resolved definition for current frame
            this.ctx.save();
            this.ctx.translate(partState.x, partState.y);
            this.ctx.rotate(Utils.degToRad(partState.rotation));
            this.ctx.scale(partState.scaleX, partState.scaleY);
            this.ctx.globalAlpha = partState.alpha;

            // Draw the part shape
            const shape = pDef.shape;
            this.ctx.fillStyle = shape.fill || char.palette.defaultFill || '#CCCCCC';
            this.ctx.strokeStyle = shape.stroke || char.palette.outlineColor || '#000000';
            this.ctx.lineWidth = (shape.lineWidth || 0.01) * baseHeight * 0.1; // Make lineWidth relative

            switch (shape.type) {

                case 'ellipse':
                    this.ctx.beginPath();
                    this.ctx.ellipse(0, 0, shape.width * baseHeight / 2, shape.height * baseHeight / 2, 0, 0, Math.PI * 2);
                    this.ctx.fill();
                    if (shape.stroke && shape.lineWidth > 0) this.ctx.stroke();
                    break;
                case 'line': // For eyebrows, simple nose
                    this.ctx.strokeStyle = shape.color || char.palette.outlineColor;
                    this.ctx.lineWidth = (shape.thickness || 0.01) * baseHeight;
                    this.ctx.beginPath();
                    this.ctx.moveTo(-shape.length * baseHeight / 2, 0);
                    this.ctx.lineTo(shape.length * baseHeight / 2, 0);
                    this.ctx.stroke();
                    break;
                case 'eye':
                    this._drawEyePart(char, partState, shape, baseHeight);
                    break;
                case 'mouth':
                    this._drawMouthPart(char, partState, shape, baseHeight);
                    break;
                case 'tzitzit_strand':

            }
            this.ctx.restore();

    _drawEyePart(char, partState, shapeDef, baseHeight) {
        const ctx = this.ctx;
        const params = partState.computedShape.params || {};
        const openFactor = params.eyeOpenFactor !== undefined ? params.eyeOpenFactor : 1.0;
        const pupilSFX = params.pupilShiftX || 0;
        const pupilSFY = params.pupilShiftY || 0;
        const pupilScaleFactor = params.pupilSizeFactor || 1.0;

        const eyeWidth = shapeDef.width * baseHeight;
        const eyeHeight = shapeDef.height * baseHeight * openFactor;
        const pupilRadius = shapeDef.pupilSize * baseHeight * pupilScaleFactor;

        // Eye White
        ctx.fillStyle = shapeDef.fill;
        ctx.beginPath();
        ctx.ellipse(0, 0, eyeWidth / 2, eyeHeight / 2, 0, 0, Math.PI * 2);
        ctx.fill();
        if (shapeDef.stroke && shapeDef.lineWidth > 0) ctx.stroke();

        // Pupil (if eye is open enough)
        if (eyeHeight > pupilRadius * 0.5) {
            ctx.fillStyle = shapeDef.pupilFill;
            ctx.beginPath();
            // Clamp pupil shift to stay within eye bounds
            const maxPupilX = eyeWidth/2 - pupilRadius;
            const maxPupilY = eyeHeight/2 - pupilRadius;
            const pX = Utils.clamp(pupilSFX, -maxPupilX, maxPupilX);
            const pY = Utils.clamp(pupilSFY, -maxPupilY, maxPupilY);
            ctx.arc(pX, pY, pupilRadius, 0, Math.PI * 2);
            ctx.fill();

            // Highlight
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            ctx.beginPath();
            ctx.arc(pX + pupilRadius * 0.3, pY - pupilRadius * 0.3, pupilRadius * 0.3, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    _drawMouthPart(char, partState, shapeDef, baseHeight) {
        const ctx = this.ctx;

        const mouthWidth = shapeDef.width * baseHeight * (actualMouthDef.widthFactor || 1);
        const mouthHeight = shapeDef.width * baseHeight * (actualMouthDef.heightFactor || 0.1); // Use base width for height scale too
        
        ctx.strokeStyle = shapeDef.color;

        ctx.lineWidth = (shapeDef.lineWidth || 0.005) * baseHeight;

        ctx.beginPath();
        if (actualMouthDef.type === 'ellipse') {
            ctx.ellipse(0, 0, mouthWidth / 2, mouthHeight / 2, 0, 0, Math.PI * 2);
        } else if (actualMouthDef.path) {
            actualMouthDef.path.forEach(cmd => {
                const p = cmd; // for brevity
                switch(p.cmd.toUpperCase()){
                    case 'M': ctx.moveTo(p.x * mouthWidth, p.y * mouthHeight); break;
                    case 'L': ctx.lineTo(p.x * mouthWidth, p.y * mouthHeight); break;
                    case 'Q': ctx.quadraticCurveTo(p.x1*mouthWidth, p.y1*mouthHeight, p.x*mouthWidth, p.y*mouthHeight); break;
                    // Add C, A, Z if needed
                }
            });
            if(actualMouthDef.openFactor > 0.1) ctx.closePath();
        }
        if(actualMouthDef.openFactor > 0.1) ctx.fill(); // Fill if considered "open"
        ctx.stroke();
    }

    _drawTzitzitPart(char, partState, shapeDef, baseHeight) {
        const ctx = this.ctx;
        ctx.strokeStyle = shapeDef.color;
        ctx.lineWidth = Math.max(1, baseHeight * 0.008 * char.size); // Ensure min width
        
        const length = shapeDef.length * baseHeight;
        const numStrings = shapeDef.numStrings || 2;
        const spread = baseHeight * 0.01;

        const swayFactor = Math.sin(char.swayPhase + (partState.definition.anchorToParent.x > 0.5 ? 0 : Math.PI/2) ) * baseHeight * 0.03;

        for (let i=0; i < numStrings; i++) {
            ctx.beginPath();
            const startX = (i - (numStrings-1)/2) * spread;
            ctx.moveTo(startX, 0); // Anchored at part's origin
            ctx.lineTo(startX + swayFactor + Utils.randomRange(-spread*0.2, spread*0.2), length + Utils.randomRange(-length*0.05, length*0.05));
            ctx.stroke();
        }
    }

    _drawSpeechBubbleScreenSpace(character) { // Needs adaptation for new head data
        const headPartState = character.partTransforms['head'];
        if (!headPartState) return;

        // Calculate visual top of the character's head, including hair/hat
        let visualTopY = headPartState.worldY - (headPartState.definition.shape.height * Animator.CHARACTER_TEMPLATES[character.templateId].baseHeight * character.size * headPartState.scaleY / 2);
        // Consider hair/hat if they extend above head part
        if (character.partTransforms['hair'] && character.partTransforms['hair'].visible) {
            const hairDef = character.partTransforms['hair'].definition;
            const hairTop = character.partTransforms['hair'].worldY - (hairDef.shape.height * Animator.CHARACTER_TEMPLATES[character.templateId].baseHeight * character.size * character.partTransforms['hair'].scaleY / 2);
            visualTopY = Math.min(visualTopY, hairTop);
        }
        // ... (add for hat too) ...

        const headScreenPos = this._worldToScreen(headPartState.worldX, visualTopY);
        // Rest of the logic adapted from original, using headScreenPos[0] (charScreenX) and headScreenPos[1] (charScreenAnchorY)
        // ... (This part of the speech bubble drawing is complex and detailed. Refer to original logic and adapt variable names)
         const m = this._calculateSpeechBubbleScreenMetrics(character, headScreenPos[0], headScreenPos[1]); // Pass anchor
        if (!m) return;
        // ... rest of drawing using 'm' structure as in original _drawSpeechBubbleScreenSpace ...
    }

    // --- Export ---
    exportAnimation() { /* Identical to original, ensure it handles the new classes for hiding */ 
        if (!this.animationData) {
            this.ui.statusDiv.textContent = "No animation data to export.";
            return;
        }
        const htmlContent = document.documentElement.outerHTML;
        
        let finalHtml = htmlContent.replace(/<script id="mainAnimationScript">[\s\S]*?<\/script>/, 
                                            `<script id="mainAnimationScript">${document.getElementById('mainAnimationScript').textContent.replace(/<\/script>/g, '<\\/script>')}<\/script>`);
        
        const animationDataString = JSON.stringify(this.animationData, null, 2).replace(/<\/script>/g, '<\\/script>');
        const existingDataJson = /<script id="animationDataJson" type="application\/json">[\s\S]*?<\/script>/;

        if (finalHtml.match(existingDataJson)) {
            finalHtml = finalHtml.replace(existingDataJson, 
                `<script id="animationDataJson" type="application/json">${animationDataString}<\/script>`);
        } else {
            finalHtml = finalHtml.replace('</body>', 
                `<script id="animationDataJson" type="application/json">${animationDataString}<\/script>\n</body>`);
        }
        
        // Ensure the correct classes are used for hiding elements in exported version
        const minimalStyleOverride = `
        body.exported-body { justify-content: center; align-items: center; min-height: 100vh; padding-top: 20px; }
        h1.exported-h1 { margin-bottom: 10px; font-size: 1.6em; }
        #inputContainer.hidden-exported { display: none !important; } 
        #exportBtn.hidden-exported { display: none !important; }
        `;
        if (finalHtml.includes('/* Exported player minimal style overrides */')) { 
             finalHtml = finalHtml.replace('/* Exported player minimal style overrides */', 
                `/* Exported player minimal style overrides */\n${minimalStyleOverride}`);
        } else if (finalHtml.includes('</style>')) { 
            finalHtml = finalHtml.replace('</style>', `${minimalStyleOverride}\n</style>`);
        }

        const blob = new Blob([finalHtml], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'animation_phoenix_engine_v1.html';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(a.href);
        this.ui.statusDiv.textContent = "Animation exported as HTML file.";
    }
