    <!-- The Vertex Shaders, the sacred geometry that shapes what is to come. -->
    <script id="cosmicRiverVertexShader" type="x-shader/x-vertex">
        uniform float uTime;
        uniform float uSpeed;
        varying vec2 vUv;
        void main() {
            vUv = uv;
            vec3 pos = position;
            float wave1 = sin(pos.x * 2.5 + uTime * uSpeed * 0.4) * 0.07;
            float wave2 = sin(pos.z * 1.8 + uTime * uSpeed * 0.6) * 0.07;
            pos.y += (wave1 + wave2) * 0.5;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
    </script>

    <!-- The Fragment Shaders, the divine light that gives color and form to the void. -->
    <script id="cosmicRiverFragmentShader" type="x-shader/x-fragment">
        uniform float uTime;
        uniform float uSpeed;
        uniform vec3 uColor;
        uniform float uOpacity;
        varying vec2 vUv;

        float random(vec2 st) { return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123); }
        float noise(vec2 st) {
            vec2 i = floor(st); vec2 f = fract(st);
            float a = random(i); float b = random(i + vec2(1.0, 0.0));
            float c = random(i + vec2(0.0, 1.0)); float d = random(i + vec2(1.0, 1.0));
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.y * u.x;
        }

        void main() {
            vec2 uv = vUv;
            uv.y -= uTime * uSpeed * 0.07;
            vec2 noiseUv = uv * vec2(1.0, 4.0) + vec2(0.0, uTime * uSpeed * 0.1);
            float n = noise(noiseUv * 5.0) * 0.5 + noise(noiseUv * 15.0) * 0.2;
            vec3 riverColor = uColor + vec3(0.0, 0.0, 0.1) + n * 0.1;
            vec2 roadUv = vUv;
            roadUv.y = fract(roadUv.y * 10.0 + uTime * uSpeed * 0.15);
            float laneWidth = 0.08;
            float lanePos1 = 0.5 - laneWidth/2.0; float lanePos2 = 0.5 + laneWidth/2.0;
            float line = smoothstep(0.4, 0.41, roadUv.y) - smoothstep(0.5, 0.51, roadUv.y);
            float leftDash = step(lanePos1, roadUv.x) - step(lanePos1 + 0.01, roadUv.x);
            float rightDash = step(lanePos2, roadUv.x) - step(lanePos2 + 0.01, roadUv.x);
            vec3 finalColor = riverColor;
            if ((leftDash > 0.0 || rightDash > 0.0) && line > 0.0) {
                finalColor = mix(finalColor, vec3(1.0, 0.84, 0.0), 0.7);
            }
            gl_FragColor = vec4(finalColor, uOpacity);
        }
    </script>
    <script id="torahPortalShader" type="x-shader/x-fragment">
        uniform float uTime; varying vec2 vUv;
        float random(in vec2 _st) { return fract(sin(dot(_st.xy, vec2(12.9898,78.233))) * 43758.5453123); }
        float noise(in vec2 _st) { vec2 i = floor(_st); vec2 f = fract(_st); float a = random(i); float b = random(i + vec2(1.0, 0.0)); float c = random(i + vec2(0.0, 1.0)); float d = random(i + vec2(1.0, 1.0)); vec2 u = f * f * (3.0 - 2.0 * f); return mix(a, b, u.x) + (c - a)*u.y*(1.0-u.x) + (d - b)*u.y*u.x; }
        #define NUM_OCTAVES 5
        float fbm(in vec2 _st) { float v = 0.0; float a = 0.5; vec2 shift = vec2(100.0); mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.50)); for (int i = 0; i < NUM_OCTAVES; ++i) { v += a * noise(_st); _st = rot * _st * 2.0 + shift; a *= 0.5; } return v; }
        void main() { vec2 st = vUv; st.x *= 1.0 + (st.y - 1.0) * 0.1; st.x += (st.y - 1.0) * -0.1; vec2 q = vec2(0.); q.x = fbm( st + 0.1*uTime); q.y = fbm( st + vec2(1.0)); vec2 r = vec2(0.); r.x = fbm( st + 1.0*q + vec2(1.7,9.2)+ 0.15*uTime ); r.y = fbm( st + 1.0*q + vec2(8.3,2.8)+ 0.126*uTime); float f = fbm(st+r); vec3 color = mix(vec3(0.1,0.6,0.66), vec3(0.66,0.66,0.5), clamp((f*f)*4.0,0.0,1.0)); color = mix(color, vec3(0,0,0.16), clamp(length(q),0.0,1.0)); color = mix(color, vec3(0.66,1,1), clamp(length(r.x),0.0,1.0)); gl_FragColor = vec4((f*f*f+.6*f*f+.5*f)*color, 1.); }
    </script>
    
    <script type="module">
        /**

        main();
