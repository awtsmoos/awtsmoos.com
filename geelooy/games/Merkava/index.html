
<!--B"H-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merkava: The Celestial Journey</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Cinzel+Decorative:wght@700&family=Rashi&display=swap');
        :root {
            --glow-color: #00ddff;
            --shefa-color: #ffd700;
            --klipot-color: #ff2d2d;
            --mitzvot-color: #ffffff;
            --nefesh-color: #c0c0c0;
            --outline-color: #000000;
        }
        body { margin: 0; overflow: hidden; font-family: 'Orbitron', 'Arial', sans-serif; color: white; background-color: #050008; }
        canvas { display: block; }

        #flashOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: white; z-index: 1001; pointer-events: none;
            opacity: 0;
        }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; background-color: rgba(0, 0, 10, 0.85);
            backdrop-filter: blur(8px); opacity: 0; visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            overflow-y: auto; 
            pointer-events: none; 
        }
        .overlay.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto; 
        }
        
        .ui-text { text-shadow: 0 0 8px currentColor, 0 0 15px currentColor, 0 0 2px black; }
        #mitzvotDisplay, #nefeshDisplay { transition: transform 0.1s ease-out; }
        
        #mitzvotDisplay { position: absolute; top: 10px; left: 10px; font-size: 1.3em; background-color: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 5px; color: var(--mitzvot-color); }
        #nefeshDisplay { position: absolute; top: 10px; right: 10px; font-size: 1.3em; background-color: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 5px; color: var(--nefesh-color); }
        #bhText { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 1.5em; color: var(--glow-color); z-index: 999; }
        
        #shefaContainer { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 50%; max-width: 400px; height: 15px; background-color: rgba(0,0,0,0.5); border: 2px solid var(--shefa-color); border-radius: 10px; z-index: 999; overflow: hidden; }
        #shefaBar { width: 0%; height: 100%; background: var(--shefa-color); box-shadow: 0 0 10px var(--shefa-color), 0 0 5px var(--shefa-color) inset; transition: width 0.3s ease-out; }

        #ascensionNotifier, #comboNotifier {
            position: absolute; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            pointer-events: none; z-index: 1002; opacity: 0;
            transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.8s cubic-bezier(0.19, 1, 0.22, 1), left 0.5s ease, top 0.5s ease;
            text-transform: uppercase;
        }
        #ascensionNotifier { top: 20%; font-size: 2.2em; color: #d8a8ff; text-shadow: 0 0 10px #d8a8ff, 0 0 20px #d8a8ff, 0 0 30px #d8a8ff; }
        #comboNotifier { top: 30%; font-size: 2.0em; color: var(--shefa-color); text-shadow: 0 0 8px var(--shefa-color), 0 0 15px var(--shefa-color); }
        
        #ascensionNotifier.side-mode { left: 18%; top: 25%; }
        #comboNotifier.side-mode { left: 18%; top: 35%; }

        #ascensionNotifier.show, #comboNotifier.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        
        #ascensionNotifier.side-mode.show { transform: translate(-50%, -50%) scale(0.65); opacity: 1; }
        #comboNotifier.side-mode.show { transform: translate(-50%, -50%) scale(0.65); opacity: 1; }

        .game-title { font-size: 4em; margin-bottom: 20px; text-align: center; color: var(--glow-color); text-transform: uppercase; }
        .game-subtitle { font-size: 1.5em; color: var(--mitzvot-color); margin-bottom: 40px; text-align: center; }

        .menu-button-group { display: flex; flex-direction: column; gap: 20px; width: 80%; max-width: 400px; padding: 20px 0; }
        .menu-button { padding: 15px; font-size: 1.8em; background: linear-gradient(145deg, #0077ff, #0033aa); color: white; border: 2px solid var(--glow-color); border-radius: 8px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(0, 100, 255, 0.3), inset 0 0 5px rgba(255,255,255,0.3); text-transform: uppercase; }
        .menu-button:hover { background: linear-gradient(145deg, #0088ff, #0044bb); transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 25px rgba(0, 120, 255, 0.5), inset 0 0 8px rgba(255,255,255,0.4); }
        .menu-button:active { transform: translateY(1px) scale(1.02); box-shadow: 0 2px 10px rgba(0, 120, 255, 0.4), inset 0 0 8px rgba(255,255,255,0.4); }
        
        #customPrayerTextarea {
            width: 100%; height: 200px; font-size: 1em; color: white; background-color: rgba(0,0,0,0.7);
            border: 2px solid var(--glow-color); border-radius: 8px; padding: 10px;
            font-family: 'Arial', sans-serif;
        }

        #prayerDisplayContainer {
            position: absolute; top: 55px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 800px;
            background-color: rgba(0,0,0,0.5);
            border-radius: 10px; padding: 10px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 998;
            opacity: 0; visibility: hidden; transition: opacity 0.5s, visibility 0.5s;
            pointer-events: none; 
        }
        #prayerDisplayContainer.visible { opacity: 1; visibility: visible; pointer-events: auto; }
        
        #prayerTextContainer { position: relative; flex-grow: 1; display: flex; justify-content: center; align-items: center; }
        #prayerDropdownBtn {
            position: absolute;
            top: -15px; 
            font-size: 1.5em;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            opacity: 0.3;
            transition: opacity 0.2s;
            z-index: 1004;
        }
        #prayerDropdownBtn:hover { opacity: 1; }

        #prayerText {
            flex-grow: 1; text-align: center; font-size: 1.2em; color: white;
            text-shadow: 2px 2px 4px #000000;
            white-space: normal;
            word-wrap: break-word;
            padding: 10px 0;
            min-height: 50px; /* Ensure container has height even if text is short */
        }
        .prayer-nav-button {
            background: none; border: 2px solid white; color: white; font-size: 2em;
            cursor: pointer; padding: 0 15px; border-radius: 5px;
            transition: background-color 0.2s, transform 0.1s;
            user-select: none;
        }
        .prayer-nav-button:hover { background-color: rgba(255,255,255,0.2); }
        .prayer-nav-button:active { transform: scale(0.95); }
        
        .setting-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            margin-bottom: 20px;
        }
        .setting-item.row {
            flex-direction: row;
            align-items: center;
            justify-content: space-between;
        }
        .setting-item h3 {
             width: 100%; text-align: center; color: var(--shefa-color);
             margin-top: 25px; margin-bottom: 15px; border-bottom: 1px solid var(--shefa-color); padding-bottom: 8px;
             text-transform: uppercase; letter-spacing: 1px;
        }
        .setting-item label {
            font-size: 1.2em;
            margin-bottom: 8px;
            color: var(--glow-color);
        }
        .setting-item input[type="text"],
        .setting-item select,
        .setting-item textarea,
        .setting-item input[type="color"] {
            width: 100%;
            font-size: 1em;
            color: white;
            background-color: rgba(0,0,0,0.7);
            border: 2px solid var(--glow-color);
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box; 
            font-family: 'Arial', sans-serif;
        }
        .setting-item.row label { margin-bottom: 0; margin-right: 15px;}
        .setting-item.row input[type="color"] { width: 60px; height: 40px; padding: 2px; }

        .setting-item textarea { height: 100px; resize: vertical; }
        .setting-item input[type="range"] { width: 100%; }
        #customFontInput { display: none; margin-top: 10px; }

        #prayerListOverlay { z-index: 1003; }
        .prayer-list-modal {
            width: 90%;
            max-width: 700px;
            background: rgba(10, 0, 20, 0.95);
            border: 2px solid var(--glow-color);
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .scrollable-list {
            max-height: 60vh;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 221, 255, 0.3);
            border-radius: 5px;
            padding: 5px;
        }
        .prayer-list-item {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 1.1em;
        }
        .prayer-list-item:hover { background-color: rgba(0, 100, 255, 0.3); }
        .prayer-list-item.active { background-color: var(--shefa-color); color: #000; font-weight: bold; }
        .prayer-list-controls { display: flex; flex-direction: column; gap: 10px; }
        .prayer-list-controls button {
             padding: 10px; font-size: 1.2em; background: linear-gradient(145deg, #333, #111); color: white; border: 1px solid var(--glow-color); border-radius: 5px; cursor: pointer;
        }
        #prayerSettingsPanel {
            display: none;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            border: 1px dashed var(--glow-color);
            border-radius: 5px;
        }
         #prayerSettingsPanel label { font-size: 1em; color: var(--glow-color); }
        
        #webcamFeed { display: none; }
        #globalErrorNotifier {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(200, 0, 0, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            z-index: 9999;
            font-family: 'Arial', sans-serif;
            font-size: 1.2em;
            box-shadow: 0 0 15px black;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <video id="webcamFeed" autoplay playsinline></video>
    <div id="globalErrorNotifier"></div>

    <div id="bhText" class="ui-text">ב"ה</div>
    <div id="flashOverlay"></div>
    <div id="ascensionNotifier"></div>
    <div id="comboNotifier"></div>

    <div id="prayerDisplayContainer">
        <button id="prevPrayerBtn" class="prayer-nav-button">&lt;</button>
        <div id="prayerTextContainer">
            <button id="prayerDropdownBtn">📜</button>
            <div id="prayerText"></div>
        </div>
        <button id="nextPrayerBtn" class="prayer-nav-button">&gt;</button>
    </div>

    <div id="statsContainer">
        <div id="mitzvotDisplay" class="ui-text">MITZVOT: 0</div>
        <div id="nefeshDisplay" class="ui-text">NEFESH: 0</div>
    </div>
    <div id="shefaContainer"><div id="shefaBar"></div></div>

    <div id="gameOverOverlay" class="overlay"><div class="menu-button-group">
        <div class="game-title ui-text" style="color: var(--klipot-color);">THE MERKAVA HAS FALLEN</div>
        <div id="finalMitzvotDisplay" class="game-subtitle">You gathered 0 Mitzvot.</div>
        <button id="tryAgainButton" class="menu-button">ATTEMPT THE JOURNEY AGAIN</button>
    </div></div>

    <div id="customMenuOverlay" class="overlay"><div class="menu-button-group">
        <div class="game-title ui-text">CUSTOM JOURNEY</div>
        <div class="game-subtitle" style="margin-bottom: 20px;">Paste prayers below, separated by two new lines.</div>
        <textarea id="customPrayerTextarea" placeholder="Prayer 1...&#10;&#10;Prayer 2..."></textarea>
        <button id="btnGoCustom" class="menu-button">BEGIN</button>
        <button id="btnBackToMain" class="menu-button" style="background: linear-gradient(145deg, #555, #222);">BACK</button>
    </div></div>
    
    <div id="mainMenuOverlay" class="overlay visible"><div class="menu-button-group">
        <div class="game-title ui-text">MERKAVA</div>
        <div class="game-subtitle">The Celestial Journey</div>
        <button id="btnBegin" class="menu-button">BEGIN THE JOURNEY</button>
        <button id="btnCustom" class="menu-button">CUSTOM JOURNEY</button>
        <button id="btnSettings" class="menu-button">SETTINGS</button>
    </div></div>

    <div id="settingsOverlay" class="overlay"><div class="menu-button-group" style="max-width: 600px; width: 90%;">
        <div class="game-title ui-text">SETTINGS</div>

        <h3>Gameplay</h3>
        <div class="setting-item">
            <label for="maxNefeshSlider">Max Nefesh: <span id="maxNefeshValue">100</span></label>
            <input type="range" id="maxNefeshSlider" min="10" max="248" step="1">
        </div>
        <div class="setting-item">
            <label for="particleSpawnRadiusSlider">Particle Spawn Radius: <span id="particleSpawnRadiusValue">60</span></label>
            <input type="range" id="particleSpawnRadiusSlider" min="10" max="200" step="5">
        </div>

        <h3>Visual Effects</h3>
         <div class="setting-item">
            <label for="particleWebSlider">Particle Web Connections: <span id="particleWebValue">3</span></label>
            <input type="range" id="particleWebSlider" min="0" max="10" step="1">
        </div>
         <div class="setting-item">
            <label for="energyTendrilsSlider">Energy Tendrils: <span id="energyTendrilsValue">3</span></label>
            <input type="range" id="energyTendrilsSlider" min="0" max="10" step="1">
        </div>
        <div class="setting-item">
            <label for="shakeIntensitySlider">Screen Shake: <span id="shakeIntensityValue">1</span></label>
            <input type="range" id="shakeIntensitySlider" min="0" max="5" step="0.1">
        </div>
        <div class="setting-item">
            <label for="flashIntensitySlider">Flash Intensity: <span id="flashIntensityValue">1</span></label>
            <input type="range" id="flashIntensitySlider" min="0" max="1" step="0.05">
        </div>
        <div class="setting-item">
            <label for="effectsIntensitySlider">Special Effect Intensity (FOV, Particles): <span id="effectsIntensityValue">1</span></label>
            <input type="range" id="effectsIntensitySlider" min="0" max="2" step="0.1">
        </div>
        
        <h3>Graphics</h3>
        <div class="setting-item">
            <label for="particleCharsTextarea">Particle Characters (comma separated):</label>
            <textarea id="particleCharsTextarea"></textarea>
        </div>
        <div class="setting-item">
            <label for="minParticleSizeSlider">Min Particle Size: <span id="minParticleSizeValue">2</span></label>
            <input type="range" id="minParticleSizeSlider" min="0.5" max="10" step="0.1">
        </div>
        <div class="setting-item">
            <label for="maxParticleSizeSlider">Max Particle Size: <span id="maxParticleSizeValue">5</span></label>
            <input type="range" id="maxParticleSizeSlider" min="1" max="20" step="0.1">
        </div>
         <div class="setting-item">
            <label for="shatterCountSlider">Shatter Particle Count: <span id="shatterCountValue">20</span></label>
            <input type="range" id="shatterCountSlider" min="1" max="100" step="1">
        </div>
        <div class="setting-item">
            <label for="shatterSpeedSlider">Shatter Particle Speed: <span id="shatterSpeedValue">25</span></label>
            <input type="range" id="shatterSpeedSlider" min="1" max="50" step="1">
        </div>

        <h3>Theme Colors</h3>
        <div class="setting-item row">
            <label for="glowColorPicker">Glow Color:</label>
            <input type="color" id="glowColorPicker">
        </div>
        <div class="setting-item row">
            <label for="shefaColorPicker">Shefa Color:</label>
            <input type="color" id="shefaColorPicker">
        </div>
        <div class="setting-item row">
            <label for="klipotColorPicker">Klipot Color:</label>
            <input type="color" id="klipotColorPicker">
        </div>

        <h3>Custom Captions</h3>
        <div class="setting-item">
            <label for="captionFontSelect">Caption Font:</label>
            <select id="captionFontSelect"></select>
            <input type="text" id="customFontInput" placeholder="Enter custom font family...">
        </div>
        <div class="setting-item">
            <label for="captionColorPicker">Caption Color:</label>
            <input type="color" id="captionColorPicker">
        </div>

        <h3>Webcam</h3>
        <div class="setting-item">
             <label for="webcamModeSelect">Webcam Display Mode:</label>
             <select id="webcamModeSelect">
                <option value="off">Off</option>
                <option value="leader">Leader Only</option>
                <option value="all">All Nefesh</option>
                <option value="central">Central</option>
                <option value="all_central">All + Central</option>
             </select>
        </div>

        <button id="btnBackToMainFromSettings" class="menu-button" style="background: linear-gradient(145deg, #555, #222); margin-top: 20px;">BACK</button>
    </div></div>

    <div id="prayerListOverlay" class="overlay">
        <div class="prayer-list-modal">
            <div id="prayerList" class="scrollable-list"></div>
            <div class="prayer-list-controls">
                 <button id="prayerSettingsToggleBtn">Settings</button>
                 <div id="prayerSettingsPanel">
                     <label for="inGameCaptionFontSelect">Font:</label>
                     <select id="inGameCaptionFontSelect"></select>
                     <input type="text" id="inGameCustomFontInput" placeholder="Enter custom font...">
                     <label for="inGameCaptionColorPicker">Color:</label>
                     <input type="color" id="inGameCaptionColorPicker">
                 </div>
                 <button id="backToMenuFromGameBtn" style="background: linear-gradient(145deg, #772222, #441111);">Back to Menu</button>
                 <button id="closePrayerListBtn">Close</button>
            </div>
        </div>
    </div>


    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        // --- GLOBAL ERROR HANDLING ---
        // NOTE: The "Did not find ethereum or web3" message is from a browser extension (e.g., a crypto wallet)
        // and is not an error in this game's code. It can be safely ignored.
        function displayGlobalError(message) {
            const errorDiv = document.getElementById('globalErrorNotifier');
            if (errorDiv) {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                setTimeout(() => { errorDiv.style.display = 'none'; }, 6000);
            }
        }
        window.addEventListener('error', function(event) {
            console.error('B"H: A critical error was caught!', event.error);
            displayGlobalError(`A critical error occurred: ${event.message}. Check console for details.`);
        });
        window.addEventListener('unhandledrejection', function(event) {
            console.error('B"H: An unhandled promise rejection was caught!', event.reason);
            displayGlobalError(`An async error occurred. Check console for details.`);
        });


        // --- GLOBAL SETUP ---
        const scene = new THREE.Scene();
        const hemisphereLight = new THREE.HemisphereLight(0xccccff, 0x333366, 0.8);
        scene.add(hemisphereLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const originalCameraPos = new THREE.Vector3(0, 8, 11);
        const cameraTargetPos = new THREE.Vector3().copy(originalCameraPos);
        const originalFOV = 75;
        camera.position.copy(originalCameraPos);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        const initialClearColor = new THREE.Color(0x050008);
        renderer.setClearColor(initialClearColor);
        document.body.appendChild(renderer.domElement);

        // --- UI ELEMENT CACHING ---
        const ui = {
            mainMenu: document.getElementById('mainMenuOverlay'),
            gameOver: document.getElementById('gameOverOverlay'),
            customMenu: document.getElementById('customMenuOverlay'),
            settingsOverlay: document.getElementById('settingsOverlay'),
            ascensionNotifier: document.getElementById('ascensionNotifier'),
            comboNotifier: document.getElementById('comboNotifier'),
            flashOverlay: document.getElementById('flashOverlay'),
            btnBegin: document.getElementById('btnBegin'),
            tryAgainButton: document.getElementById('tryAgainButton'),
            btnCustom: document.getElementById('btnCustom'),
            btnGoCustom: document.getElementById('btnGoCustom'),
            btnBackToMain: document.getElementById('btnBackToMain'),
            btnSettings: document.getElementById('btnSettings'),
            btnBackToMainFromSettings: document.getElementById('btnBackToMainFromSettings'),
            customPrayerTextarea: document.getElementById('customPrayerTextarea'),
            prayerDisplayContainer: document.getElementById('prayerDisplayContainer'),
            prayerText: document.getElementById('prayerText'),
            prevPrayerBtn: document.getElementById('prevPrayerBtn'),
            nextPrayerBtn: document.getElementById('nextPrayerBtn'),
            mitzvotDisplay: document.getElementById('mitzvotDisplay'),
            nefeshDisplay: document.getElementById('nefeshDisplay'),
            finalMitzvotDisplay: document.getElementById('finalMitzvotDisplay'),
            shefaBar: document.getElementById('shefaBar'),
            particleCharsTextarea: document.getElementById('particleCharsTextarea'),
            shakeIntensitySlider: document.getElementById('shakeIntensitySlider'),
            shakeIntensityValue: document.getElementById('shakeIntensityValue'),
            flashIntensitySlider: document.getElementById('flashIntensitySlider'),
            flashIntensityValue: document.getElementById('flashIntensityValue'),
            effectsIntensitySlider: document.getElementById('effectsIntensitySlider'),
            effectsIntensityValue: document.getElementById('effectsIntensityValue'),
            shatterCountSlider: document.getElementById('shatterCountSlider'),
            shatterCountValue: document.getElementById('shatterCountValue'),
            shatterSpeedSlider: document.getElementById('shatterSpeedSlider'),
            shatterSpeedValue: document.getElementById('shatterSpeedValue'),
            captionFontSelect: document.getElementById('captionFontSelect'),
            customFontInput: document.getElementById('customFontInput'),
            captionColorPicker: document.getElementById('captionColorPicker'),
            minParticleSizeSlider: document.getElementById('minParticleSizeSlider'),
            minParticleSizeValue: document.getElementById('minParticleSizeValue'),
            maxParticleSizeSlider: document.getElementById('maxParticleSizeSlider'),
            maxParticleSizeValue: document.getElementById('maxParticleSizeValue'),
            particleSpawnRadiusSlider: document.getElementById('particleSpawnRadiusSlider'),
            particleSpawnRadiusValue: document.getElementById('particleSpawnRadiusValue'),
            webcamModeSelect: document.getElementById('webcamModeSelect'),
            maxNefeshSlider: document.getElementById('maxNefeshSlider'),
            maxNefeshValue: document.getElementById('maxNefeshValue'),
            prayerDropdownBtn: document.getElementById('prayerDropdownBtn'),
            prayerListOverlay: document.getElementById('prayerListOverlay'),
            prayerList: document.getElementById('prayerList'),
            closePrayerListBtn: document.getElementById('closePrayerListBtn'),
            prayerSettingsToggleBtn: document.getElementById('prayerSettingsToggleBtn'),
            prayerSettingsPanel: document.getElementById('prayerSettingsPanel'),
            inGameCaptionFontSelect: document.getElementById('inGameCaptionFontSelect'),
            inGameCustomFontInput: document.getElementById('inGameCustomFontInput'),
            inGameCaptionColorPicker: document.getElementById('inGameCaptionColorPicker'),
            backToMenuFromGameBtn: document.getElementById('backToMenuFromGameBtn'),
            glowColorPicker: document.getElementById('glowColorPicker'),
            shefaColorPicker: document.getElementById('shefaColorPicker'),
            klipotColorPicker: document.getElementById('klipotColorPicker'),
            particleWebSlider: document.getElementById('particleWebSlider'),
            particleWebValue: document.getElementById('particleWebValue'),
            energyTendrilsSlider: document.getElementById('energyTendrilsSlider'),
            energyTendrilsValue: document.getElementById('energyTendrilsValue'),
        };

        // --- GAME STATE & CONSTANTS ---
        let gameState = {};
        const clock = new THREE.Clock();
        const worldPosVec = new THREE.Vector3();

        function toGematria(n) {
            if (n === 15) return 'ט״ו'; if (n === 16) return 'ט״ז';
            let str = ''; let val = Math.abs(n);
            const sortedKeys = Object.keys(gematriaMap).map(Number).sort((a, b) => b - a);
            while (val > 0) { for (const key of sortedKeys) { if (val >= key) { str += gematriaMap[key]; val -= key; break; } } }
            if(str.length > 1) str = str.slice(0, -1) + '״' + str.slice(-1); else if (str.length === 1) str += '׳';
            return str;
        }

        async function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);
                request.onerror = event => { console.error("DB Error:", event.target.errorCode); reject("Error opening DB"); };
                request.onsuccess = event => {
                    db = event.target.result;
                    resolve();
                };
                request.onupgradeneeded = event => {
                    let db = event.target.result;
                    if (!db.objectStoreNames.contains('settings')) {
                        db.createObjectStore('settings', { keyPath: 'id' });
                    }
                };
            });
        }

        async function saveSetting(id, value) {
            if (!db) return;
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['settings'], 'readwrite');
                transaction.oncomplete = () => resolve();
                transaction.onerror = (event) => reject(event.target.error);
                const store = transaction.objectStore('settings');
                store.put({ id, value });
            });
        }

        async function loadSetting(id, defaultValue) {
            if (!db) return defaultValue;
            return new Promise((resolve) => {
                const transaction = db.transaction(['settings'], 'readonly');
                const store = transaction.objectStore('settings');
                const request = store.get(id);
                request.onsuccess = event => {
                    resolve(event.target.result ? event.target.result.value : defaultValue);
                };
                request.onerror = () => resolve(defaultValue);
            });
        }

        function createTextTexture(text, gematriaText, bgColor, font = '900 240px Orbitron', textColor = '#fff') {
            const canvas = document.createElement('canvas'); const size = 1024;
            canvas.width = size; canvas.height = size; const ctx = canvas.getContext('2d');
            ctx.fillStyle = bgColor; ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.font = font;
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.strokeStyle = 'black'; ctx.lineWidth = 20;

            const hasGematria = gematriaText && gematriaText !== '';
            const textY = hasGematria ? canvas.height / 2 - 120 : canvas.height / 2;
            ctx.strokeText(text, canvas.width / 2, textY);
            ctx.fillStyle = textColor;
            ctx.fillText(text, canvas.width / 2, textY);
            
            if(hasGematria) {
                const gematriaFont = 'normal 260px "Times New Roman"';
                ctx.font = gematriaFont;
                const gematriaY = canvas.height / 2 + 120;
                ctx.strokeText(gematriaText, canvas.width / 2, gematriaY);
                ctx.fillStyle = textColor;
                ctx.fillText(gematriaText, canvas.width / 2, gematriaY);
            }
            return new THREE.CanvasTexture(canvas);
        }

        // Generic object pool for reusing objects and improving performance.
        class ObjectPool {
            constructor(creator, initialSize) {
                this.creator = creator;
                this.pool = [];
                this.active = new Set();
                for (let i = 0; i < initialSize; i++) {
                    const obj = this.creator();
                    obj.visible = false;
                    scene.add(obj);
                    this.pool.push(obj);
                }
            }
            activate() {
                let obj = this.pool.length > 0 ? this.pool.pop() : this.creator();
                if (!obj.parent) scene.add(obj);
                obj.visible = true;
                this.active.add(obj);
                return obj;
            }
            deactivate(obj) {
                obj.visible = false;
                this.active.delete(obj);
                this.pool.push(obj);
            }
            deactivateAll() {
                [...this.active].forEach(obj => this.deactivate(obj));
            }
        }

                const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
                gradient.addColorStop(0, 'rgba(255,255,255,1)');
                gradient.addColorStop(0.2, 'rgba(255,255,255,0.7)');
                gradient.addColorStop(0.8, 'rgba(255,255,255,0.2)');
                gradient.addColorStop(1, 'rgba(255,255,255,0)');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 64, 64);
                bloomSpriteMaterial = new THREE.SpriteMaterial({
                    map: new THREE.CanvasTexture(canvas),
                    blending: THREE.AdditiveBlending,
                    depthWrite: false,
                    transparent: true,
                });
            }
            const sprite = new THREE.Sprite(bloomSpriteMaterial.clone());
            sprite.material.color.set(color);
            return sprite;
        }

                if (troop) {
                    const radius = radiusStep * Math.sqrt(i + 1);
                    if (radius > maxRadius) maxRadius = radius;
                }
            });

            const scaleFactor = (maxRadius * 2 > roadWidth) ? (roadWidth / 2) / maxRadius : 1;

            magenDavidTroops.forEach((troop, i) => {
                if (troop) {
                    const radius = radiusStep * Math.sqrt(i + 1) * scaleFactor;
                    const angle = i * angleStep;
                    const x = Math.cos(angle) * radius;
                    const z = Math.sin(angle) * radius;
                    troop.userData.targetPos.set(x, 0.4, z - 1.5); // Moved closer
                }
            });
        }
        
        function destroyNefesh(troop) {
             const index = magenDavidTroops.indexOf(troop);
             if (index !== -1) {
                createParticleExplosion(troop.getWorldPosition(worldPosVec), 30, gameSettings.klipotColor, 15);
                shatterObject(troop.children[0]);
                minyanGroup.remove(troop);
                // Note: Proper disposal of geometries and materials can be complex with shared assets.
                // For now, removing from the scene graph prevents rendering and major leaks.
                magenDavidTroops[index] = null;
             }
        }

        function adjustNefeshCount(change) {
            const initialNefesh = gameState.nefesh;
            if (change > 0) {
                let added = 0;
                for(let i = 0; i < MAX_NEFESH && added < change; i++) {
                    if (magenDavidTroops[i] === null) {
                        const newTroop = createMagenDavid(); newTroop.scale.set(0.01, 0.01, 0.01);
                        magenDavidTroops[i] = newTroop; minyanGroup.add(newTroop);
                        newTroop.userData.targetScale = 1; 
                        createParticleExplosion(minyanGroup.position, 15, gameSettings.glowColor, 10);
                        added++;
                    }
                }
            } else if (change < 0) {
                let removed = 0;
                const toRemove = -change;
                for (let i = MAX_NEFESH - 1; i >= 0 && removed < toRemove; i--) {
                    if (magenDavidTroops[i]) {
                        destroyNefesh(magenDavidTroops[i]);
                        removed++;
                    }
                }
            }

            gameState.nefesh = magenDavidTroops.filter(t => t !== null).length;
            positionNefesh();
            
            if (gameState.nefesh < initialNefesh) {
                shatterElement(ui.nefeshDisplay);
            }

            if (gameState.nefesh === 0 && gameState.current === 'playing') endGame();
            if (ui.nefeshDisplay) {
                ui.nefeshDisplay.style.transform = "scale(1.2)"; 
                setTimeout(() => { if (ui.nefeshDisplay) ui.nefeshDisplay.style.transform = "scale(1.0)"; }, 100);
            }
        }

        // --- VISUAL EFFECTS ---
        function createParticleExplosion(position, count, color, speed) {
            const scaledCount = Math.floor(count * (gameSettings.effectsIntensity || 1));
            for(let i=0; i < scaledCount; i++) {
                const p = particlePool.activate(); if(!p) continue;
                p.position.copy(position);
                p.material.color.set(color);
                p.userData = { type: 'particle', velocity: new THREE.Vector3().randomDirection().multiplyScalar(Math.random() * speed), life: 1.2 };
            }
        }
        
        function shatterObject(object) {
            if (!object?.geometry || !object?.material) return;
            const geom = object.geometry; const mat = object.material;
            const shatterCount = gameSettings.shatterCount;
            const shatterSpeed = gameSettings.shatterSpeed;
            for(let i=0; i < shatterCount; i++) {
                const shard = new THREE.Mesh(geom, mat.clone()); 
                shard.scale.setScalar(0.2 + Math.random()*0.3);
                shard.position.copy(object.getWorldPosition(worldPosVec));
                shard.rotation.copy(object.rotation);
                scene.add(shard);
                // Add emissive highlights to some shards for extra sparkle
                if(Math.random() > 0.8 && shard.material.emissive) {
                    shard.material.emissive = new THREE.Color(0xffffff);
                    shard.material.emissiveIntensity = Math.random() * 2;
                }
                shard.userData = { type: 'shard', velocity: new THREE.Vector3().randomDirection().multiplyScalar(Math.random() * shatterSpeed), life: 2.0, rotationSpeed: new THREE.Vector3().random().multiplyScalar(5) };
                dynamicShards.add(shard);
            }
        }
        
        function shatterElement(element) {
            if (!element) return;
            const rect = element.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;
            const container = document.createElement('div');
            Object.assign(container.style, {
                position: 'fixed', left: `${rect.left}px`, top: `${rect.top}px`,
                width: `${rect.width}px`, height: `${rect.height}px`,
                overflow: 'hidden', pointerEvents: 'none', zIndex: '2000'
            });
            document.body.appendChild(container);
            const shatterCount = Math.max(5, Math.floor(gameSettings.shatterCount / 2));
            const shatterSpeed = gameSettings.shatterSpeed * 0.2;
            for (let i = 0; i < shatterCount; i++) {
                const shard = document.createElement('div');
                Object.assign(shard.style, {
                    position: 'absolute', backgroundColor: getComputedStyle(element).color || 'white',
                    width: `${Math.random() * 15 + 5}px`, height: `${Math.random() * 15 + 5}px`,
                    left: `${Math.random() * rect.width}px`, top: `${Math.random() * rect.height}px`,
                    transition: 'transform 1s ease-out, opacity 1s ease-out'
                });
                container.appendChild(shard);
                requestAnimationFrame(() => { 
                    const vx = (Math.random() - 0.5) * shatterSpeed * 8;
                    const vy = (Math.random() - 0.5) * shatterSpeed * 8;
                    shard.style.transform = `translate(${vx}px, ${vy}px) rotate(${Math.random() * 720}deg)`;
                    shard.style.opacity = '0';
                });
            }
            setTimeout(() => { if (container.parentElement) document.body.removeChild(container); }, 1000);
        }

        let road, starField1, starField2;
        function createRoadTexture() {
            const canvas = document.createElement('canvas');
            const width = 128; const height = 512;
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = 'rgba(0,0,0,0)'; ctx.fillRect(0, 0, width, height);
            ctx.fillStyle = 'rgba(255, 255, 0, 0.7)';
            for(let y = 0; y < height; y += 40) {
                ctx.fillRect(width/2 - 3, y, 6, 20);
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        function createWorld() {
            // Road
            const roadGeo = new THREE.PlaneGeometry(roadWidth, 200, 1, 1);
            const roadMat = new THREE.MeshLambertMaterial({ 
                color: 0x202040, 
                map: createRoadTexture(),
                transparent: true
            });
            roadMat.map.repeat.set(1, 10);
            road = new THREE.Mesh(roadGeo, roadMat); 
            road.rotation.x = -Math.PI / 2; 
            road.position.y = roadLevelY;
            scene.add(road);

            // Road Outline
            const outlineGeo = new THREE.PlaneGeometry(roadWidth + 0.2, 200, 1, 1);
            const outlineMat = new THREE.MeshBasicMaterial({ color: gameSettings.glowColor || defaultSettings.glowColor, side: THREE.BackSide});
            const roadOutline = new THREE.Mesh(outlineGeo, outlineMat);
            roadOutline.rotation.x = -Math.PI/2;
            roadOutline.position.y = roadLevelY - 0.01;
            road.add(roadOutline); // Add as child so it moves with road texture offset

            // Starfields
            const createField = () => {
                const vertices = [];

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                const material = new THREE.PointsMaterial({ size: 0.2, color: 0xaa88ff });

                    transparent: true,
                    side: THREE.DoubleSide,

                });
                centralWebcamPlane = new THREE.Mesh(centralGeo, centralMat);
                centralWebcamPlane.rotation.y = Math.PI / 2;
                centralWebcamPlane.position.set(0, 0.5, -2);
                centralWebcamPlane.visible = false;
                minyanGroup.add(centralWebcamPlane);

        // --- ENERGY TENDRIL CREATION ---
        function createEnergyTendril() {
            const numPoints = 100;
            const points = [];
            let x = (Math.random() - 0.5) * 100;
            let y = (Math.random() - 0.5) * 100;
            const z = -200;
            const xSpeed = (Math.random() - 0.5) * 0.5;
            const ySpeed = (Math.random() - 0.5) * 0.5;

            for (let i = 0; i < numPoints; i++) {
                points.push(new THREE.Vector3(x, y, z + i * 4));
                x += xSpeed * (Math.random() * 2);
                y += ySpeed * (Math.random() * 2);
            }
            const curve = new THREE.CatmullRomCurve3(points);
            const tubeGeo = new THREE.TubeGeometry(curve, 64, 0.1, 8, false);
            const color = new THREE.Color().setHSL(Math.random(), 0.8, 0.5);
            const tubeMat = new THREE.MeshBasicMaterial({ 
                color,
                transparent: true,
                opacity: 0.3,
                blending: THREE.AdditiveBlending
            });
            const tendril = new THREE.Mesh(tubeGeo, tubeMat);
            tendril.userData = { life: 5 + Math.random() * 5, baseHue: color.getHSL({h:0,s:0,l:0}).h };

            activeTendrils.add(tendril);
