<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merkava: The Celestial Journey</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');
        :root {
            --glow-color: #00ddff;
            --shefa-color: #ffd700;
            --klipot-color: #ff2d2d;
            --mitzvot-color: #ffffff;
            --nefesh-color: #c0c0c0;
            --outline-color: #000000;
        }
        body { margin: 0; overflow: hidden; font-family: 'Orbitron', 'Arial', sans-serif; color: white; background-color: #050008; }
        canvas { display: block; }

        #flashOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: white; z-index: 1001; pointer-events: none;
            opacity: 0;
        }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; background-color: rgba(0, 0, 10, 0.85);
            backdrop-filter: blur(8px); opacity: 0; visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            overflow-y: auto; 
            pointer-events: none; 
        }
        .overlay.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto; 
        }
        
        .ui-text { text-shadow: 0 0 8px currentColor, 0 0 15px currentColor, 0 0 2px black; }
        #mitzvotDisplay, #nefeshDisplay { transition: transform 0.1s ease-out; }
        
        #mitzvotDisplay { position: absolute; top: 10px; left: 10px; font-size: 1.3em; background-color: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 5px; }
        #nefeshDisplay { position: absolute; top: 10px; right: 10px; font-size: 1.3em; background-color: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 5px; }
        #bhText { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 1.5em; color: var(--glow-color); z-index: 999; }
        
        #shefaContainer { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 50%; max-width: 400px; height: 15px; background-color: rgba(0,0,0,0.5); border: 2px solid var(--shefa-color); border-radius: 10px; z-index: 999; overflow: hidden; }
        #shefaBar { width: 0%; height: 100%; background: var(--shefa-color); box-shadow: 0 0 10px var(--shefa-color), 0 0 5px var(--shefa-color) inset; transition: width 0.3s ease-out; }

        #ascensionNotifier, #comboNotifier {
            position: absolute; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            pointer-events: none; z-index: 1002; opacity: 0;
            transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.8s cubic-bezier(0.19, 1, 0.22, 1), left 0.5s ease, top 0.5s ease;
            text-transform: uppercase;
        }
        #ascensionNotifier { top: 20%; font-size: 2.2em; color: #d8a8ff; text-shadow: 0 0 10px #d8a8ff, 0 0 20px #d8a8ff; }
        #comboNotifier { top: 30%; font-size: 2.0em; color: var(--shefa-color); text-shadow: 0 0 8px var(--shefa-color); }
        
        #ascensionNotifier.side-mode { left: 18%; top: 25%; }
        #comboNotifier.side-mode { left: 18%; top: 35%; }

        #ascensionNotifier.show, #comboNotifier.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        
        #ascensionNotifier.side-mode.show { transform: translate(-50%, -50%) scale(0.65); opacity: 1; }
        #comboNotifier.side-mode.show { transform: translate(-50%, -50%) scale(0.65); opacity: 1; }

        .game-title { font-size: 4em; margin-bottom: 20px; text-align: center; color: var(--glow-color); text-transform: uppercase; }
        .game-subtitle { font-size: 1.5em; color: var(--mitzvot-color); margin-bottom: 40px; text-align: center; }

        .menu-button-group { display: flex; flex-direction: column; gap: 20px; width: 80%; max-width: 400px; padding: 20px 0; }
        .menu-button { padding: 15px; font-size: 1.8em; background: linear-gradient(145deg, #0077ff, #0033aa); color: white; border: 2px solid var(--glow-color); border-radius: 8px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(0, 100, 255, 0.3), inset 0 0 5px rgba(255,255,255,0.3); text-transform: uppercase; }
        .menu-button:hover { background: linear-gradient(145deg, #0088ff, #0044bb); transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 25px rgba(0, 120, 255, 0.5), inset 0 0 8px rgba(255,255,255,0.4); }
        .menu-button:active { transform: translateY(1px) scale(1.02); box-shadow: 0 2px 10px rgba(0, 120, 255, 0.4), inset 0 0 8px rgba(255,255,255,0.4); }
        
        #customPrayerTextarea {
            width: 100%; height: 200px; font-size: 1em; color: white; background-color: rgba(0,0,0,0.7);
            border: 2px solid var(--glow-color); border-radius: 8px; padding: 10px;
            font-family: 'Arial', sans-serif;
        }

        #prayerDisplayContainer {
            position: absolute; top: 55px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 800px;
            background-color: rgba(0,0,0,0.5);
            border-radius: 10px; padding: 10px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 998;
            opacity: 0; visibility: hidden; transition: opacity 0.5s, visibility 0.5s;
            pointer-events: none; 
        }
        #prayerDisplayContainer.visible { opacity: 1; visibility: visible; pointer-events: auto; }
        
        #prayerTextContainer { position: relative; flex-grow: 1; display: flex; justify-content: center; align-items: center; }
        #prayerDropdownBtn {
            position: absolute;
            top: -15px; 
            font-size: 1.5em;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            opacity: 0.3;
            transition: opacity 0.2s;
            z-index: 1004;
        }
        #prayerDropdownBtn:hover { opacity: 1; }

        #prayerText {
            flex-grow: 1; text-align: center; font-size: 1.2em; color: white;
            text-shadow: 2px 2px 4px #000000;
            white-space: normal;
            word-wrap: break-word;
            padding: 10px 0;
            min-height: 50px; /* Ensure container has height even if text is short */
        }
        .prayer-nav-button {
            background: none; border: 2px solid white; color: white; font-size: 2em;
            cursor: pointer; padding: 0 15px; border-radius: 5px;
            transition: background-color 0.2s, transform 0.1s;
            user-select: none;
        }
        .prayer-nav-button:hover { background-color: rgba(255,255,255,0.2); }
        .prayer-nav-button:active { transform: scale(0.95); }

        .setting-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            margin-bottom: 20px;
        }
         .setting-item.checkbox {
            flex-direction: row;
            align-items: center;
        }
        .setting-item.checkbox label { margin-bottom: 0; margin-left: 10px; }
        .setting-item.checkbox input { width: auto; }

        .setting-item h3 {
             width: 100%; text-align: center; color: var(--shefa-color);
             margin-top: 25px; margin-bottom: 15px; border-bottom: 1px solid var(--shefa-color); padding-bottom: 8px;
             text-transform: uppercase; letter-spacing: 1px;
        }

        .setting-item label {
            font-size: 1.2em;
            margin-bottom: 8px;
            color: var(--glow-color);
        }
        .setting-item input[type="text"],
        .setting-item textarea,
        .setting-item input[type="color"] {
            width: 100%;
            font-size: 1em;
            color: white;
            background-color: rgba(0,0,0,0.7);
            border: 2px solid var(--glow-color);
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box; 
            font-family: 'Arial', sans-serif;
        }
        .setting-item textarea {
            height: 100px;
            resize: vertical;
        }
        .setting-item input[type="range"] {
            width: 100%;
        }

        #prayerListOverlay { z-index: 1003; }
        .prayer-list-modal {
            width: 90%;
            max-width: 700px;
            background: rgba(10, 0, 20, 0.95);
            border: 2px solid var(--glow-color);
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .scrollable-list {
            max-height: 60vh;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 221, 255, 0.3);
            border-radius: 5px;
            padding: 5px;
        }
        .prayer-list-item {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 1.1em;
        }
        .prayer-list-item:hover { background-color: rgba(0, 100, 255, 0.3); }
        .prayer-list-item.active { background-color: var(--shefa-color); color: #000; font-weight: bold; }
        .prayer-list-controls { display: flex; flex-direction: column; gap: 10px; }
        .prayer-list-controls button {
             padding: 10px; font-size: 1.2em; background: linear-gradient(145deg, #333, #111); color: white; border: 1px solid var(--glow-color); border-radius: 5px; cursor: pointer;
        }
        #prayerSettingsPanel {
            display: none;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            border: 1px dashed var(--glow-color);
            border-radius: 5px;
        }
         #prayerSettingsPanel label { font-size: 1em; color: var(--glow-color); }
        
        #webcamFeed {
            display: none;
        }
        #globalErrorNotifier {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(200, 0, 0, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            z-index: 9999;
            font-family: 'Arial', sans-serif;
            font-size: 1.2em;
            box-shadow: 0 0 15px black;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <video id="webcamFeed" autoplay playsinline></video>
    <div id="globalErrorNotifier"></div>

    <div id="bhText" class="ui-text">ב"ה</div>
    <div id="flashOverlay"></div>
    <div id="ascensionNotifier"></div>
    <div id="comboNotifier"></div>

    <!-- REWRITTEN LOGIC: The prayer display and its dropdown button are now the primary way to access in-game options,
         including the newly added 'Back to Menu' button. This makes the UI consistent. -->
    <div id="prayerDisplayContainer">
        <button id="prevPrayerBtn" class="prayer-nav-button">&lt;</button>
        <div id="prayerTextContainer">
            <button id="prayerDropdownBtn">📜</button>
            <div id="prayerText"></div>
        </div>
        <button id="nextPrayerBtn" class="prayer-nav-button">&gt;</button>
    </div>

    <div id="statsContainer">
        <div id="mitzvotDisplay" class="ui-text">MITZVOT: 0</div>
        <div id="nefeshDisplay" class="ui-text">NEFESH: 0</div>
    </div>
    <div id="shefaContainer"><div id="shefaBar"></div></div>

    <div id="gameOverOverlay" class="overlay"><div class="menu-button-group">
        <div class="game-title ui-text" style="color: var(--klipot-color);">THE MERKAVA HAS FALLEN</div>
        <div id="finalMitzvotDisplay" class="game-subtitle">You gathered 0 Mitzvot.</div>
        <button id="tryAgainButton" class="menu-button">ATTEMPT THE JOURNEY AGAIN</button>
    </div></div>

    <div id="customMenuOverlay" class="overlay"><div class="menu-button-group">
        <div class="game-title ui-text">CUSTOM JOURNEY</div>
        <div class="game-subtitle" style="margin-bottom: 20px;">Paste prayers below, separated by two new lines.</div>
        <textarea id="customPrayerTextarea" placeholder="Prayer 1...&#10;&#10;Prayer 2..."></textarea>
        <button id="btnGoCustom" class="menu-button">BEGIN</button>
        <button id="btnBackToMain" class="menu-button" style="background: linear-gradient(145deg, #555, #222);">BACK</button>
    </div></div>
    
    <div id="mainMenuOverlay" class="overlay visible"><div class="menu-button-group">
        <div class="game-title ui-text">MERKAVA</div>
        <div class="game-subtitle">The Celestial Journey</div>
        <button id="btnBegin" class="menu-button">BEGIN THE JOURNEY</button>
        <button id="btnCustom" class="menu-button">CUSTOM JOURNEY</button>
        <button id="btnSettings" class="menu-button">SETTINGS</button>
    </div></div>

    <div id="settingsOverlay" class="overlay"><div class="menu-button-group" style="max-width: 600px; width: 90%;">
        <div class="game-title ui-text">SETTINGS</div>

        <h3>Gameplay</h3>
        <div class="setting-item">
            <label for="maxNefeshSlider">Max Nefesh: <span id="maxNefeshValue">100</span></label>
            <input type="range" id="maxNefeshSlider" min="10" max="248" step="1">
        </div>
        <div class="setting-item">
            <label for="particleSpawnRadiusSlider">Particle Spawn Radius: <span id="particleSpawnRadiusValue">60</span></label>
            <input type="range" id="particleSpawnRadiusSlider" min="10" max="200" step="5">
        </div>

        <h3>Visual Effects</h3>
        <div class="setting-item">
            <label for="shakeIntensitySlider">Screen Shake: <span id="shakeIntensityValue">1</span></label>
            <input type="range" id="shakeIntensitySlider" min="0" max="5" step="0.1">
        </div>
        <div class="setting-item">
            <label for="flashIntensitySlider">Flash Intensity: <span id="flashIntensityValue">1</span></label>
            <input type="range" id="flashIntensitySlider" min="0" max="1" step="0.05">
        </div>
        <div class="setting-item">
            <label for="effectsIntensitySlider">Special Effect Intensity (FOV, Particles): <span id="effectsIntensityValue">1</span></label>
            <input type="range" id="effectsIntensitySlider" min="0" max="2" step="0.1">
        </div>
        
        <h3>Graphics</h3>
        <div class="setting-item">
            <label for="particleCharsTextarea">Particle Characters (comma separated):</label>
            <textarea id="particleCharsTextarea"></textarea>
        </div>
        <div class="setting-item">
            <label for="minParticleSizeSlider">Min Particle Size: <span id="minParticleSizeValue">2</span></label>
            <input type="range" id="minParticleSizeSlider" min="0.5" max="10" step="0.1">
        </div>
        <div class="setting-item">
            <label for="maxParticleSizeSlider">Max Particle Size: <span id="maxParticleSizeValue">5</span></label>
            <input type="range" id="maxParticleSizeSlider" min="1" max="20" step="0.1">
        </div>
         <div class="setting-item">
            <label for="shatterCountSlider">Shatter Particle Count: <span id="shatterCountValue">20</span></label>
            <input type="range" id="shatterCountSlider" min="1" max="100" step="1">
        </div>
        <div class="setting-item">
            <label for="shatterSpeedSlider">Shatter Particle Speed: <span id="shatterSpeedValue">25</span></label>
            <input type="range" id="shatterSpeedSlider" min="1" max="50" step="1">
        </div>

        <h3>Custom Captions</h3>
        <div class="setting-item">
            <label for="captionFontInput">Caption Font:</label>
            <input type="text" id="captionFontInput">
        </div>
        <div class="setting-item">
            <label for="captionColorPicker">Caption Color:</label>
            <input type="color" id="captionColorPicker">
        </div>

        <h3>Webcam</h3>
        <div class="setting-item checkbox">
             <input type="checkbox" id="enableWebcamCheckbox">
             <label for="enableWebcamCheckbox">Enable Webcam Overlay</label>
        </div>
        <div class="setting-item checkbox">
             <input type="checkbox" id="webcamPerNefeshCheckbox">
             <label for="webcamPerNefeshCheckbox">Show on every Nefesh</label>
        </div>

        <button id="btnBackToMainFromSettings" class="menu-button" style="background: linear-gradient(145deg, #555, #222); margin-top: 20px;">BACK</button>
    </div></div>

    <div id="prayerListOverlay" class="overlay">
        <div class="prayer-list-modal">
            <div id="prayerList" class="scrollable-list"></div>
            <div class="prayer-list-controls">
                 <button id="prayerSettingsToggleBtn">Settings</button>
                 <div id="prayerSettingsPanel">
                     <label for="inGameCaptionFontInput">Font:</label>
                     <input type="text" id="inGameCaptionFontInput">
                     <label for="inGameCaptionColorPicker">Color:</label>
                     <input type="color" id="inGameCaptionColorPicker">
                 </div>
                 <!-- FIX: This button allows the player to exit to the main menu during gameplay, as requested. -->
                 <button id="backToMenuFromGameBtn" style="background: linear-gradient(145deg, #772222, #441111);">Back to Menu</button>
                 <button id="closePrayerListBtn">Close</button>
            </div>
        </div>
    </div>


    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        // --- GLOBAL ERROR HANDLING ---
        
        /**
         * A robust error handler to catch and display issues without crashing the entire experience.
         * @param {string} message - The error message to display to the user.
         */
        function displayGlobalError(message) {
            const errorDiv = document.getElementById('globalErrorNotifier');
            if (errorDiv) {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                setTimeout(() => { errorDiv.style.display = 'none'; }, 6000);
            }
        }
        window.addEventListener('error', function(event) {
            console.error('B"H: A critical error was caught!', event.error);
            displayGlobalError(`A critical error occurred: ${event.message}. Check console for details.`);
        });
        window.addEventListener('unhandledrejection', function(event) {
            console.error('B"H: An unhandled promise rejection was caught!', event.reason);
            displayGlobalError(`An async error occurred. Check console for details.`);
        });


        // --- GLOBAL SETUP ---
        // Basic Three.js components: scene, lighting, camera, renderer.
        const scene = new THREE.Scene();
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const originalCameraPos = new THREE.Vector3(0, 8, 11);
        const cameraTargetPos = new THREE.Vector3().copy(originalCameraPos);
        const originalFOV = 75;
        camera.position.copy(originalCameraPos);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        const initialClearColor = new THREE.Color(0x483d8b);
        renderer.setClearColor(initialClearColor);
        document.body.appendChild(renderer.domElement);

        // --- UI ELEMENT CACHING ---
        // Storing all DOM element references in one place for easy access and performance.
        const ui = {
            mainMenu: document.getElementById('mainMenuOverlay'),
            gameOver: document.getElementById('gameOverOverlay'),
            customMenu: document.getElementById('customMenuOverlay'),
            settingsOverlay: document.getElementById('settingsOverlay'),
            ascensionNotifier: document.getElementById('ascensionNotifier'),
            comboNotifier: document.getElementById('comboNotifier'),
            flashOverlay: document.getElementById('flashOverlay'),
            btnBegin: document.getElementById('btnBegin'),
            tryAgainButton: document.getElementById('tryAgainButton'),
            btnCustom: document.getElementById('btnCustom'),
            btnGoCustom: document.getElementById('btnGoCustom'),
            btnBackToMain: document.getElementById('btnBackToMain'),
            btnSettings: document.getElementById('btnSettings'),
            btnBackToMainFromSettings: document.getElementById('btnBackToMainFromSettings'),
            customPrayerTextarea: document.getElementById('customPrayerTextarea'),
            prayerDisplayContainer: document.getElementById('prayerDisplayContainer'),
            prayerText: document.getElementById('prayerText'),
            prevPrayerBtn: document.getElementById('prevPrayerBtn'),
            nextPrayerBtn: document.getElementById('nextPrayerBtn'),
            mitzvotDisplay: document.getElementById('mitzvotDisplay'),
            nefeshDisplay: document.getElementById('nefeshDisplay'),
            finalMitzvotDisplay: document.getElementById('finalMitzvotDisplay'),
            shefaBar: document.getElementById('shefaBar'),
            particleCharsTextarea: document.getElementById('particleCharsTextarea'),
            shakeIntensitySlider: document.getElementById('shakeIntensitySlider'),
            shakeIntensityValue: document.getElementById('shakeIntensityValue'),
            flashIntensitySlider: document.getElementById('flashIntensitySlider'),
            flashIntensityValue: document.getElementById('flashIntensityValue'),
            effectsIntensitySlider: document.getElementById('effectsIntensitySlider'),
            effectsIntensityValue: document.getElementById('effectsIntensityValue'),
            shatterCountSlider: document.getElementById('shatterCountSlider'),
            shatterCountValue: document.getElementById('shatterCountValue'),
            shatterSpeedSlider: document.getElementById('shatterSpeedSlider'),
            shatterSpeedValue: document.getElementById('shatterSpeedValue'),
            captionFontInput: document.getElementById('captionFontInput'),
            captionColorPicker: document.getElementById('captionColorPicker'),
            minParticleSizeSlider: document.getElementById('minParticleSizeSlider'),
            minParticleSizeValue: document.getElementById('minParticleSizeValue'),
            maxParticleSizeSlider: document.getElementById('maxParticleSizeSlider'),
            maxParticleSizeValue: document.getElementById('maxParticleSizeValue'),
            particleSpawnRadiusSlider: document.getElementById('particleSpawnRadiusSlider'),
            particleSpawnRadiusValue: document.getElementById('particleSpawnRadiusValue'),
            enableWebcamCheckbox: document.getElementById('enableWebcamCheckbox'),
            webcamPerNefeshCheckbox: document.getElementById('webcamPerNefeshCheckbox'),
            maxNefeshSlider: document.getElementById('maxNefeshSlider'),
            maxNefeshValue: document.getElementById('maxNefeshValue'),
            prayerDropdownBtn: document.getElementById('prayerDropdownBtn'),
            prayerListOverlay: document.getElementById('prayerListOverlay'),
            prayerList: document.getElementById('prayerList'),
            closePrayerListBtn: document.getElementById('closePrayerListBtn'),
            prayerSettingsToggleBtn: document.getElementById('prayerSettingsToggleBtn'),
            prayerSettingsPanel: document.getElementById('prayerSettingsPanel'),
            inGameCaptionFontInput: document.getElementById('inGameCaptionFontInput'),
            inGameCaptionColorPicker: document.getElementById('inGameCaptionColorPicker'),
            backToMenuFromGameBtn: document.getElementById('backToMenuFromGameBtn'),
        };

        // --- GAME STATE & CONSTANTS ---
        let gameState = {}; // The main object holding all dynamic game data.
        const clock = new THREE.Clock(); // For calculating delta time.
        let animationFrameId; // To control the game loop.
        
        let MAX_NEFESH = 100; // Default max, can be changed in settings.
        const MAX_SPARKS = 400; // Max concurrent player projectiles.
        const roadWidth = 9;
        const roadLength = 200; // Define road length for texture calculations.
        const roadLevelY = -0.5;
        let roadBaseSpeed = 12;

        // Reusable vectors and objects to prevent reallocation in the game loop.
        const worldPosVec = new THREE.Vector3(); 
        const dummyObject = new THREE.Object3D();
        const collisionVec2 = new THREE.Vector2();

        // --- UTILITY FUNCTIONS ---
        
        // Gematria is a system of assigning numerical value to Hebrew letters. This adds a thematic layer to the UI.
        const gematriaMap = { 1: 'א', 2: 'ב', 3: 'ג', 4: 'ד', 5: 'ה', 6: 'ו', 7: 'ז', 8: 'ח', 9: 'ט', 10: 'י', 20: 'כ', 30: 'ל', 40: 'מ', 50: 'נ', 60: 'ס', 70: 'ע', 80: 'פ', 90: 'צ', 100: 'ק', 200: 'ר', 300: 'ש', 400: 'ת' };
        /**
         * Converts a number to its Hebrew Gematria representation for thematic UI.
         * Handles special cases for 15 and 16 to avoid constructing the name of G-d.
         * @param {number} n - The number to convert.
         * @returns {string} The Gematria representation of the number.
         */
        function toGematria(n) {
            if (n === 15) return 'ט״ו'; // 9+6 instead of 10+5
            if (n === 16) return 'ט״ז'; // 9+7 instead of 10+6
            let str = ''; 
            let val = Math.abs(n);
            const sortedKeys = Object.keys(gematriaMap).map(Number).sort((a, b) => b - a);

                        str += gematriaMap[key]; 
                        val -= key; 
                        break; 
                    } 
                } 
            }
            // Add traditional punctuation for multi-letter or single-letter Gematria.
            if(str.length > 1) str = str.slice(0, -1) + '״' + str.slice(-1);

            return str;

        async function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(dbName, 1);
                request.onerror = event => { 
                    console.error("IndexedDB Error:", event.target.errorCode); 
                    reject("Error opening DB"); 
                };
                request.onsuccess = event => {
                    db = event.target.result;
                    resolve();
                };
                request.onupgradeneeded = event => {
                    let db = event.target.result;
                    if (!db.objectStoreNames.contains('settings')) {
                        db.createObjectStore('settings', { keyPath: 'id' });
                    }
                };
            });
        }

         * @returns {Promise<void>} A promise that resolves when the setting is saved.
         */
        async function saveSetting(id, value) {
            if (!db) return;
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['settings'], 'readwrite');
                transaction.oncomplete = () => resolve();
                transaction.onerror = (event) => reject(event.target.error);
                const store = transaction.objectStore('settings');
                store.put({ id, value });
            });
        }

        function createTextTexture(text, gematriaText, bgColor, font = '900 240px Orbitron', textColor = '#fff') {
            const canvas = document.createElement('canvas'); 
            const size = 1024;
            canvas.width = size; 
            canvas.height = size; 
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.font = font;
            ctx.textAlign = 'center'; 
            ctx.textBaseline = 'middle';
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 20;

            const hasGematria = gematriaText && gematriaText !== '';
            const textY = hasGematria ? canvas.height / 2 - 120 : canvas.height / 2;
            ctx.strokeText(text, canvas.width / 2, textY);

                ctx.fillStyle = textColor;
                ctx.fillText(gematriaText, canvas.width / 2, gematriaY);
            }
            return new THREE.CanvasTexture(canvas);

        /**
         * A generic class for managing pools of reusable objects to improve performance
         * by avoiding repeated creation and destruction of objects in the game loop.
         */
        class ObjectPool {
            /**
             * @param {function(): THREE.Object3D} createFunc - A function that creates a new object for the pool.
             * @param {number} initialSize - The number of objects to pre-populate the pool with.
             */
            constructor(createFunc, initialSize) {
                this.createFunc = createFunc;
                this.pool = [];
                this.active = new Set();
                for (let j = 0; j < initialSize; j++) {
                    const obj = this.createFunc();
                    obj.visible = false;
                    scene.add(obj);
                    this.pool.push(obj);
                }
            }

            /**
             * Retrieves an object from the pool, making it active and visible.
             * If the pool is empty, it creates a new object.
             * @returns {THREE.Object3D | null} An active object.
             */
            activate() {
                let obj = this.pool.length > 0 ? this.pool.pop() : this.createFunc();
                if (!obj.parent) scene.add(obj); // Ensure object is in scene if created on-the-fly
                obj.visible = true;
                this.active.add(obj);
                return obj;
            }

            /**
             * Returns an object to the pool, making it inactive and invisible.
             * @param {THREE.Object3D} obj - The object to deactivate.
             */
            deactivate(obj) {
                obj.visible = false;
                this.active.delete(obj);
                this.pool.push(obj);
            }

            /**
             * Deactivates all currently active objects in the pool. Used for game reset.
             */
            deactivateAll() {
                // Iterating over a copy of the set is safer as deactivate modifies the set.
                [...this.active].forEach(obj => this.deactivate(obj));
            }
        }

         * This ensures the formation is stable and units don't shift around when others are destroyed.

        function setupInstancedNefesh() {
            // Clean up old meshes if they exist (e.g., when changing MAX_NEFESH in settings).

            let maxRadius = radiusStep * Math.sqrt(MAX_NEFESH);

                const x = Math.cos(angle) * radius;
                const z = Math.sin(angle) * radius;

        let nextSparkIndex = 0;

        /**
         * REWRITTEN FIRING LOGIC: Activates a spark instance from the pool to fire a projectile.
         * This function is now completely robust, solving the "shooting stops" bug.
         * It performs a circular search through the entire projectile pool, starting from the last known position (`nextSparkIndex`).
         * This guarantees that if any free slot exists in the entire `sparkState` array, it will be found and used.
         * This ensures shooting is continuous and never stops as long as there are active Nefesh units.
         *
         * @param {THREE.Vector3} position - The world position where the spark should be fired from.
         * @param {number} damage - The damage value of the spark.
         * @param {boolean} hasPierce - Whether the spark can pierce enemies (from the 'Hod's Splendor' upgrade).
         */
        function fireSpark(position, damage, hasPierce) {
            // This loop iterates up to MAX_SPARKS times to ensure we check every single slot
            // in the pool if necessary. This is the core of the fix.
            for (let i = 0; i < MAX_SPARKS; i++) {
                // We check the slots in a circle, starting from where we left off.
                // The modulo operator (%) ensures the index wraps around from the end of the array to the start.
                const index = (nextSparkIndex + i) % MAX_SPARKS;
                
                // If we find a spark that is not currently active, we can use it.
                if (!sparkState[index].active) {
                    const spark = sparkState[index];
                    spark.active = true;
                    spark.position.copy(position);
                    spark.damage = damage;
                    // If the spark cannot pierce, we set its pierced counter to a high number, meaning it can only hit once.
                    // Otherwise, it can pierce one enemy (pierced < 1).
                    spark.pierced = hasPierce ? 0 : 999; 
                    
                    // CRITICAL: We set the next starting point for the search to be the slot *after* the one we just used.
                    // This makes the search highly efficient, as it usually finds a free slot immediately on the next call.
                    nextSparkIndex = (index + 1) % MAX_SPARKS;
                    return; // Exit the function since we have successfully fired a spark.
                }
            }
            // If the loop completes without finding a free spark, it means the entire pool is active.
            // This is a rare "bullet hell" scenario, and no new spark can be fired this frame.
            // This is expected behavior when the screen is full of projectiles and is not a bug.
        }

        function adjustNefeshCount(change) {
            const initialNefesh = gameState.nefesh;

            if (change > 0) {
                let added = 0;
                // Add new units by finding the first available inactive slots (filling from the inside out).
                for(let i = 0; i < MAX_NEFESH && added < change; i++) {

                let removed = 0;
                const toRemove = -change;
                // Remove units from the outermost active slots first.
                for (let i = MAX_NEFESH - 1; i >= 0 && removed < toRemove; i--) {
                    if (nefeshState[i].active) {
                        // Here we call destroyNefesh with the specific index `i`. This is intentional for Klipah gates,
                        // as they are designed to strip away the outer layers of the formation first.
                        destroyNefesh(i);
                        removed++;
                    }
                }
            }

            // Recalculate the current count and update UI.
            gameState.nefesh = nefeshState.filter(s => s.active).length;
            
            if (gameState.nefesh < initialNefesh) {
                shatterElement(ui.nefeshDisplay);
            }
            // Check for game over condition.
            if (gameState.nefesh <= 0 && gameState.current === 'playing') endGame();
            ui.nefeshDisplay.style.transform = "scale(1.2)"; setTimeout(() => ui.nefeshDisplay.style.transform = "scale(1.0)", 100);
        }

        // --- OBSTACLE CREATION FUNCTIONS ---

        function updateKlipahGateVisuals(gate) {

        // "Tohu" means "chaos" or "formlessness", representing raw, uncontained energy.

        // --- VISUAL EFFECTS ---

        /**
         * Creates a burst of simple particles for explosions and other effects.
         * @param {THREE.Vector3} position - The world position for the explosion.
         * @param {number} count - The number of particles to create.
         * @param {THREE.Color | number} color - The color of the particles.

         */
        function createParticleExplosion(position, count, color, speed) {
            const scaledCount = Math.floor(count * (gameSettings.effectsIntensity || 1));
            for(let i=0; i < scaledCount; i++) {
                const p = particlePool.activate(); 
                if(!p) continue;
                p.position.copy(position);

        /**
         * Creates a shatter effect for a 3D object upon its destruction.
         * @param {THREE.Mesh} object - The mesh to shatter.
         */
        function shatterObject(object) {
            const geom = object.geometry; 
            const mat = object.material;
            const shatterCount = gameSettings.shatterCount;
            const shatterSpeed = gameSettings.shatterSpeed;
            for(let i=0; i < shatterCount; i++) {
                const shard = new THREE.Mesh(geom, mat); 
                shard.scale.setScalar(0.2 + Math.random()*0.3);
                shard.position.copy(object.getWorldPosition(worldPosVec));
                shard.rotation.copy(object.rotation);
                scene.add(shard);
                shard.userData = { 
                    type: 'shard',

                    life: 2.0, 
                    rotationSpeed: new THREE.Vector3().random().multiplyScalar(5) 
                };
                dynamicShards.add(shard);
            }
        }
        
        /**
         * Creates a visual shatter effect for an HTML element.
         * @param {HTMLElement} element - The HTML element to shatter.
         */
        function shatterElement(element) {
            if (!element) return;
            const rect = element.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;
            const container = document.createElement('div');
            Object.assign(container.style, {
                position: 'fixed', left: `${rect.left}px`, top: `${rect.top}px`,
                width: `${rect.width}px`, height: `${rect.height}px`,
                overflow: 'hidden', pointerEvents: 'none', zIndex: '2000'
            });
            document.body.appendChild(container);
            const shatterCount = Math.max(5, gameSettings.shatterCount / 2);
            const shatterSpeed = gameSettings.shatterSpeed * 0.2;
            for (let i = 0; i < shatterCount; i++) {
                const shard = document.createElement('div');
                Object.assign(shard.style, {
                    position: 'absolute', backgroundColor: 'white',
                    width: `${Math.random() * 15 + 5}px`, height: `${Math.random() * 15 + 5}px`,
                    left: `${Math.random() * rect.width}px`, top: `${Math.random() * rect.height}px`,
                    transition: 'transform 1s ease-out, opacity 1s ease-out'
                });
                container.appendChild(shard);
                requestAnimationFrame(() => { 
                    const vx = (Math.random() - 0.5) * shatterSpeed * 8;
                    const vy = (Math.random() - 0.5) * shatterSpeed * 8;
                    shard.style.transform = `translate(${vx}px, ${vy}px) rotate(${Math.random() * 720}deg)`;
                    shard.style.opacity = '0';
                });
            }
            setTimeout(() => { if (container.parentElement) document.body.removeChild(container); }, 1000);
        }

        let shakeIntensity = 0; 
        let fovKick = 0;

        /**
         * Triggers a camera shake effect.
         * @param {number} intensity - The base intensity of the shake.
         */
        function triggerScreenShake(intensity) { 
            shakeIntensity = Math.max(shakeIntensity, intensity * gameSettings.shakeIntensity); 
        }
        
        /**
         * Triggers a field-of-view "kick" effect, making the camera zoom out briefly.
         * @param {number} intensity - The base intensity of the FOV kick.
         */
        function triggerFovKick(intensity) { 
            fovKick = Math.max(fovKick, intensity * gameSettings.effectsIntensity); 
        }
        
        /**
         * Triggers a full-screen color flash.
         * @param {string} color - The CSS color of the flash.
         * @param {number} duration - The duration of the flash fade-out in milliseconds.
         */
        function triggerFlash(color, duration) {
            const intensity = gameSettings.flashIntensity;
            if (intensity <= 0) return;
            ui.flashOverlay.style.backgroundColor = color; 
            ui.flashOverlay.style.transition = 'opacity 0s';
            ui.flashOverlay.style.opacity = (0.7 * intensity).toString();
            setTimeout(() => { 
                ui.flashOverlay.style.transition = `opacity ${duration}ms`; 
                ui.flashOverlay.style.opacity = '0';

        // --- GAMEPLAY SYSTEMS ---
        
        // Upgrades are themed around the Sefirot, the divine emanations in Kabbalah.
        const allUpgrades = {
            'gevurah': { name: "GEVURAH'S MIGHT", desc: "Projectile damage increased. (Gevurah: Strength/Severity)", apply: () => gameState.player.projectileDamage++ },
            'netzach': { name: "NETZACH'S SWIFTNESS", desc: "Increases fire rate. (Netzach: Endurance/Victory)", apply: () => gameState.player.fireRate *= 0.85 },
            'hod': { name: "HOD'S SPLENDOR", desc: "Projectiles pierce one enemy. (Hod: Splendor/Glory)", nonStackable: true, apply: () => gameState.player.hasPierce = true },
            'chesed': { name: "CHESED'S GRACE", desc: "Periodically gain a shield that blocks one hit. (Chesed: Kindness/Grace)", nonStackable: true, apply: () => gameState.player.hasShield = true },
            'tikkun': { name: "TIKKUN OLAM", desc: "Slowly regenerate lost Nefesh over time. (Tikkun Olam: Repairing the World)", nonStackable: true, apply: () => gameState.player.hasRegen = true },
        };
        const acquiredUpgrades = new Set();
        
        /**
         * Grants a random, unacquired upgrade to the player upon leveling up.
         */
        function grantRandomEmanation() {
            const availableUpgrades = Object.keys(allUpgrades).filter(key => !allUpgrades[key].nonStackable || !acquiredUpgrades.has(key));
            if(availableUpgrades.length === 0) return;

            const chosenKey = availableUpgrades[Math.floor(Math.random() * availableUpgrades.length)];
            const upgrade = allUpgrades[chosenKey];
            
            upgrade.apply();
            if(upgrade.nonStackable) acquiredUpgrades.add(chosenKey);

            ui.ascensionNotifier.textContent = upgrade.name; 
            ui.ascensionNotifier.classList.add('show');
            createParticleExplosion(nefeshGroup.position, 150, 0xd8a8ff, 20);
            triggerFlash('#d8a8ff', 500); 
            triggerFovKick(15);

            // Push background particles away upon ascension.
            for (const p of specialParticlePool.active) {
                const direction = p.position.clone().sub(nefeshGroup.position).normalize();
                p.userData.velocity.addScaledVector(direction, 40);
                p.userData.life = Math.min(p.userData.life, 2.0);
            }
            setTimeout(() => ui.ascensionNotifier.classList.remove('show'), 2500);

            // Change the world color to match the new level.
            const nextColorIndex = Math.min(gameState.level - 1, levelColors.length - 1);
            gameState.color.target.copy(levelColors[nextColorIndex]);
        }
        
        /**
         * Manages the combo system for collecting Shefa (divine influx/bounty).
         */
        function updateCombo(newPoints, position) {
            gameState.combo.count++; 
            gameState.combo.timer = 3.0; // Reset combo timer.
            const shefaGained = newPoints * gameState.combo.count;
            const numOrbs = Math.min(15, Math.floor(shefaGained / 10));
            if(numOrbs === 0) return;

            const valuePerOrb = shefaGained / numOrbs;
            for(let i=0; i < numOrbs; i++) {
                const orb = shefaOrbPool.activate();
                if(orb) {
                    orb.position.copy(position).add(new THREE.Vector3((Math.random()-0.5)*3, (Math.random()-0.5)*3, 0));
                    orb.userData.value = valuePerOrb;
                    orb.userData.velocity = new THREE.Vector3().randomDirection().multiplyScalar(Math.random() * 8);
                }
            }
            // Update and show the combo UI notifier.
            ui.comboNotifier.textContent = `COMBO x${gameState.combo.count}`;
            ui.comboNotifier.classList.remove('show'); 
            void ui.comboNotifier.offsetWidth; // Force reflow to restart CSS animation.
            ui.comboNotifier.classList.add('show');
        }
        
        // --- WORLD CREATION ---
        let road, starField1, starField2;
        // This value is critical for synchronizing the road texture speed with object speed.
        let roadTextureTileLength;

        /**
         * Creates the procedural texture for the road.
         * @returns {THREE.CanvasTexture} The generated road texture.
         */
        function createRoadTexture() {
            const canvas = document.createElement('canvas');
            const width = 128; const height = 512;
            canvas.width = width; canvas.height = height;
            const ctx = canvas.getContext('2d');

            ctx.fillStyle = 'rgba(0,0,0,0)';
            ctx.fillRect(0, 0, width, height);

            // Center lane markings.
            ctx.fillStyle = 'rgba(255, 255, 0, 0.7)';
            for(let y = 0; y < height; y += 40) {
                ctx.fillRect(width/2 - 3, y, 6, 20);
            }
            
            // Side lane markings.
            ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.fillRect(width * 0.1 - 1, 0, 2, height);
            ctx.fillRect(width * 0.9 - 1, 0, 2, height);
            
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        /**
         * Creates the main world objects: the road and the starfield background.
         */
        function createWorld() {
            const roadTextureRepeats = 10;
            const roadGeo = new THREE.PlaneGeometry(roadWidth, roadLength, 1, 20);
            const roadMat = new THREE.MeshLambertMaterial({ 
                color: 0x483d8b,
                map: createRoadTexture(),
                transparent: true
            });
            roadMat.map.repeat.set(1, roadTextureRepeats);

            // FIX: Calculate the length of a single texture tile in world units.
            // This is essential for synchronizing the texture scroll speed with game object movement.
            roadTextureTileLength = roadLength / roadTextureRepeats;

            road = new THREE.Mesh(roadGeo, roadMat); 
            road.rotation.x = -Math.PI / 2; // Lay the plane flat.
            road.position.y = roadLevelY;
            scene.add(road);

            // Create two layers of starfields for a parallax effect.
            const createField = () => {
                const vertices = [];
                for (let i = 0; i < 5000; i++) { 
                    vertices.push( (Math.random() - 0.5) * 250, (Math.random() - 0.5) * 250, (Math.random() - 0.5) * 500 ); 
                }
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                const material = new THREE.PointsMaterial({ size: 0.2, color: 0xaa88ff });
                return new THREE.Points(geometry, material);
            };
            starField1 = createField(); 
            starField2 = createField(); 
            starField2.position.z = -500; // Place the second field further back.
            scene.add(starField1, starField2);
        }

        // --- OBSTACLE SPAWNING ---
        const lanePositions = [-3.0, 0, 3.0];
        const obstacleRemovalZ = camera.position.z + 5; // Z-coordinate at which to despawn objects.
        
        /**
         * Spawns a specific type of obstacle in a given lane and Z position.
         * @param {string} type - The type of obstacle to spawn ('klipah_gate', 'jar', etc.).
         * @param {number} laneIndex - The index of the lane (0, 1, or 2).
         * @param {number} zPos - The initial Z position of the obstacle.
         */
        function spawnObstacle(type, laneIndex, zPos) {
            const position = new THREE.Vector3(lanePositions[laneIndex], roadLevelY, zPos);
            const levelFactor = 1 + (gameState.level / 10); // Difficulty scaling.

            switch(type) {
                case 'klipah_gate': {
                    const gate = klipahGatePool.activate(); if(!gate) return;
                    gate.position.copy(position); gate.position.y += 2;
                    // Klipah gates start with a negative value.
                    Object.assign(gate.userData, { currentValue: - (5 + Math.floor(Math.random() * 15 * levelFactor)), isPurified: false });
                    updateKlipahGateVisuals(gate);
                    break;
                }
                case 'jar': {
                    const jar = jarPool.activate(); if(!jar) return;
                    jar.position.copy(position); jar.position.y += 0.75;
                    const health = Math.floor(30 + Math.random() * 40 * levelFactor);
                    Object.assign(jar.userData, { health, maxHealth: health });
                    updateJarHealthVisuals(jar);
                    break;
                }
                case 'tohu_shard': {
                    const shard = tohuShardPool.activate(); if(!shard) return;
                    shard.position.copy(position);
                    break;
                }
                case 'golem_sentry': {
                    const golem = golemSentryPool.activate(); if(!golem) return;
                    golem.position.copy(position);
                    golem.userData.health = Math.floor(120 * levelFactor);
                    golem.userData.lastShotTime = 0; // Reset shot timer.
                    break;
                }
            }
        }
        
        // --- TACTICAL SPAWN PATTERNS ---
        // These functions define pre-set arrangements of obstacles to create varied challenges.
        function pattern_Wall(z) {
            const wallType = Math.random() < 0.7 ? 'jar' : 'klipah_gate';
            spawnObstacle(wallType, 0, z);
            spawnObstacle(wallType, 1, z);
            spawnObstacle(wallType, 2, z);
        }
        function pattern_Gauntlet(z) {
            const lane = Math.floor(Math.random() * 3);
            for(let i = 0; i < 4; i++) {
                spawnObstacle('tohu_shard', lane, z - i * 15);
            }
        }
        function pattern_SentryGuard(z) {
            const lane = Math.floor(Math.random() * 3);
            spawnObstacle('golem_sentry', lane, z - 10);
            spawnObstacle('jar', lane, z);
            const sideLane = lane === 1 ? (Math.random() < 0.5 ? 0 : 2) : 1;
            spawnObstacle('jar', sideLane, z - 5);
        }
        function pattern_KlipahWeave(z) {
            const startLane = Math.random() < 0.5 ? 0 : 2;
            spawnObstacle('klipah_gate', startLane, z);
            spawnObstacle('klipah_gate', 1, z - 15);
            spawnObstacle('klipah_gate', 2 - startLane, z - 30);
            if (gameState.level > 5) spawnObstacle('jar', startLane, z - 45);
        }
        function pattern_GolemFlank(z) {
            spawnObstacle('golem_sentry', 0, z);
            spawnObstacle('golem_sentry', 2, z-5);
            spawnObstacle('jar', 1, z);
        }
        function pattern_RandomMix(z) {
            const lane1 = Math.floor(Math.random() * 3);
            let lane2 = Math.floor(Math.random() * 3);
            while(lane2 === lane1) { lane2 = Math.floor(Math.random() * 3); }
            
            spawnObstacle('jar', lane1, z);
            spawnObstacle('klipah_gate', lane2, z - 10);
            if (Math.random() > 0.4) {
                spawnObstacle('tohu_shard', 3 - lane1 - lane2, z - 20);
            }
        }
        function pattern_Crossfire(z) {
            spawnObstacle('golem_sentry', 0, z);
            spawnObstacle('golem_sentry', 2, z - 10);
            if (Math.random() < 0.5 * (gameState.level / 10)) {
                spawnObstacle('jar', 1, z-20);
            }
        }
        function pattern_TrapCorridor(z) {
            const openLane = Math.floor(Math.random() * 3);
            for(let i=0; i<3; i++) {
                if (i !== openLane) {
                    spawnObstacle('jar', i, z);
                    spawnObstacle('jar', i, z - 15);
                } else {
                     spawnObstacle('tohu_shard', i, z - 7.5);
                }
            }
        }
        
        // Pattern sets are grouped by difficulty, unlocking as the player levels up.
        const patternSets = [
            [pattern_RandomMix, pattern_Wall],
            [pattern_RandomMix, pattern_Wall, pattern_Gauntlet, pattern_SentryGuard],
            [pattern_Gauntlet, pattern_SentryGuard, pattern_KlipahWeave, pattern_Crossfire],
            [pattern_SentryGuard, pattern_KlipahWeave, pattern_GolemFlank, pattern_Crossfire, pattern_TrapCorridor],
        ];

        /**
         * Checks the state of the road and decides when and which obstacle pattern to spawn next.
         */
        function trySpawnPattern() {
            let rearmostZ = 0;
            const allObstacles = [...klipahGatePool.active, ...jarPool.active, ...tohuShardPool.active, ...golemSentryPool.active];
            for(const obs of allObstacles) {
                if (obs.position.z < rearmostZ) rearmostZ = obs.position.z;
            }
            
            // If the last obstacle is getting close to the screen, spawn a new pattern far ahead.
            if (rearmostZ > -80) {
                 const patternSetIndex = Math.min(patternSets.length - 1, Math.floor((gameState.level -1) / 3));
                 const availablePatterns = patternSets[patternSetIndex];
                 const chosenPattern = availablePatterns[Math.floor(Math.random() * availablePatterns.length)];
                 chosenPattern(-120 - Math.random() * 40);
            }
        }
        
        /**
         * Spawns decorative background particles (stars, etc.).
         */
        function spawnSpecialParticle() {
            if (specialParticleTextures.length === 0) return;
            const p = specialParticlePool.activate();
            if (!p) return;
            
            const spawnRadius = gameSettings.particleSpawnRadius;
            const spawnZ = -150; // Spawn far away.
            const x = (Math.random() - 0.5) * spawnRadius * 2;
            const y = (Math.random() - 0.5) * spawnRadius;
            // Ensure particles don't spawn right in the center view path.
            p.position.set(Math.abs(x) < 20 && Math.abs(y) < 20 ? (x > 0 ? 20 : -20) : x, y, spawnZ);
            
            const texture = specialParticleTextures[Math.floor(Math.random() * specialParticleTextures.length)];
            p.material.map = texture;
            p.material.opacity = 0.1 + Math.random() * 0.5; p.material.needsUpdate = true;
            
            const scale = gameSettings.minParticleSize + Math.random() * (gameSettings.maxParticleSize - gameSettings.minParticleSize);
            p.scale.set(scale, scale, scale);
            
            p.userData.life = 5.0; // Lifetime in seconds.

            const baseSpeed = 40 + (gameState.level * 3);
            const randomSpeed = 20 + gameState.level * 2;
            p.userData.velocity = new THREE.Vector3(0, 0, baseSpeed + Math.random() * randomSpeed);
        }

        // --- GAME STATE MANAGEMENT ---

        /**
         * Initializes or resets the game state for a new run.
         * @returns {Promise<void>}
         */
        async function initializeGame() {
            try {
                if (animationFrameId) cancelAnimationFrame(animationFrameId); // Stop previous game loop.
                
                // Deactivate all pooled objects and clear dynamic sets to ensure a clean slate.
                [golemProjectilePool, golemFastProjectilePool, golemHeavyProjectilePool, particlePool, shefaOrbPool, specialParticlePool, klipahGatePool, jarPool, tohuShardPool, golemSentryPool].forEach(pool => pool.deactivateAll());
                dynamicShards.forEach(s => scene.remove(s)); dynamicShards.clear();
                activeLights.forEach(l => scene.remove(l)); activeLights.clear();
                activeShockwaves.forEach(sw => scene.remove(sw.mesh)); activeShockwaves.clear();

                // Reset all object states.
                nefeshState.forEach(s => s.active = false);
                sparkState.forEach(s => s.active = false);

                // Start webcam if enabled.
                if(gameSettings.enableWebcam) await webcamManager.start();
                else webcamManager.stop();
                
                // Define the initial game state object.
                gameState = {
                    current: 'playing', mitzvot: 0, nefesh: 0, shefa: 0, shefaToAscend: 100, level: 1,
                    player: { fireRate: 350, projectileDamage: 1, hasRegen: false, regenTimer: 0, hasPierce: false, hasShield: false },
                    combo: { count: 0, timer: 0 },
                    customPrayers: gameSettings.customPrayers || null,
                    color: { current: new THREE.Color(initialClearColor), target: new THREE.Color(levelColors[0]) }
                };
                
                scene.fog = new THREE.Fog(gameState.color.current, 50, 200);
                renderer.setClearColor(gameState.color.current);

                acquiredUpgrades.clear();
                if(!road) createWorld(); // Create world objects if this is the first run.
                
                // Show prayer UI if custom prayers are loaded. Otherwise, always show the dropdown button.
                ui.prayerDropdownBtn.style.display = 'block'; // Make sure the menu button is always visible.
                if (gameState.customPrayers && gameState.customPrayers.phrases.length > 0) {
                    ui.prayerDisplayContainer.classList.add('visible');
                    updatePrayerDisplay();
                    ui.ascensionNotifier.classList.add('side-mode');
                    ui.comboNotifier.classList.add('side-mode');
                } else {
                    ui.prayerDisplayContainer.classList.remove('visible');
                    ui.ascensionNotifier.classList.remove('side-mode');
                    ui.comboNotifier.classList.remove('side-mode');
                }
                
                adjustNefeshCount(10); // Start the player with 10 Nefesh units.
                targetCubeX = 0; nefeshGroup.position.x = 0; // Reset player position.
                
                // Pre-spawn some initial patterns.
                for (let i=0; i < 3; i++) {
                    const chosenPattern = patternSets[0][Math.floor(Math.random() * patternSets[0].length)];
                    chosenPattern(-40 - i * 50);
                }
                
                // Hide all menus.
                ui.mainMenu.classList.remove('visible');
                ui.gameOver.classList.remove('visible');
                ui.customMenu.classList.remove('visible');
                ui.settingsOverlay.classList.remove('visible');
                
                updateUIDisplays();
                clock.start();
                animationFrameId = requestAnimationFrame(animate); // Start the game loop.
            } catch (error) {
                console.error("An error occurred during game initialization:", error);
                showMainMenu();
            }
        }

        /**
         * Adds Shefa (experience points) to the player's total and handles leveling up.
         * @param {number} amount - The amount of Shefa to add.
         */
        function addShefa(amount) {
            gameState.shefa += amount;
            if (gameState.shefa >= gameState.shefaToAscend) {
                gameState.shefa -= gameState.shefaToAscend; 
                gameState.level++;
                gameState.shefaToAscend *= 1.5; // Increase XP requirement for next level.
                grantRandomEmanation();
            }
        }

        /**
         * Ends the current game session and displays the game over screen.
         */
        function endGame() {
            gameState.current = 'gameOver';
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = undefined;
            ui.finalMitzvotDisplay.textContent = `You gathered ${Math.floor(gameState.mitzvot)} Mitzvot.`;
            ui.gameOver.classList.add('visible');
            ui.prayerDisplayContainer.classList.remove('visible');
            ui.prayerDropdownBtn.style.display = 'none'; // Hide menu button on game over.
            webcamManager.stop();
        }

        /**
         * Returns the player to the main menu screen.
         */
        function showMainMenu() {
            gameState.current = 'mainMenu';
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = undefined;
            // Hide all in-game overlays and show the main menu.
            ui.gameOver.classList.remove('visible');
            ui.customMenu.classList.remove('visible');
            ui.settingsOverlay.classList.remove('visible');
            ui.mainMenu.classList.add('visible');
            ui.prayerDisplayContainer.classList.remove('visible');
            ui.prayerListOverlay.classList.remove('visible');
            ui.prayerDropdownBtn.style.display = 'none'; // Hide menu button in main menu.
            webcamManager.stop();
        }
        
        // --- INPUT HANDLING ---
        let isDragging = false, lastTouchX = 0, targetCubeX = 0;
        
        /**
         * Handles player movement input from mouse or touch drag events.
         * @param {number} clientX - The horizontal coordinate of the input event.
         */
        const handleMove = (clientX) => {
            if (!isDragging || gameState.current !== 'playing') return;
            const deltaX = clientX - lastTouchX;
            const moveScale = 0.03; // Controls sensitivity.
            targetCubeX += deltaX * moveScale;
            lastTouchX = clientX;
        };

        /**
         * Handles the start of a player movement interaction (mousedown or touchstart).
         * @param {MouseEvent | TouchEvent} e - The input event.
         * @param {number} clientX - The horizontal coordinate of the input event.
         */
        const handleInteractionStart = (e, clientX) => {
            if (gameState.current !== 'playing') return;
            // Ignore clicks on UI buttons.
            const targetElement = e.target;
            if (targetElement.closest('.prayer-nav-button, #prayerDropdownBtn, #prayerListOverlay')) {
                return; 
            }
            isDragging = true;
            lastTouchX = clientX;
            if (e.type === 'touchstart') e.preventDefault(); // Prevent screen scrolling on mobile.
        };

        document.addEventListener('mousedown', e => handleInteractionStart(e, e.clientX));
        document.addEventListener('mousemove', e => handleMove(e.clientX));
        document.addEventListener('mouseup', () => isDragging = false);
        document.addEventListener('touchstart', e => handleInteractionStart(e, e.touches[0].clientX), { passive: false });
        document.addEventListener('touchmove', e => handleMove(e.touches[0].clientX), { passive: false });
        document.addEventListener('touchend', () => isDragging = false);
        
        // --- UI EVENT LISTENERS ---
        ui.tryAgainButton.addEventListener('click', () => { shatterElement(ui.tryAgainButton); initializeGame(); });
        ui.btnBegin.addEventListener('click', () => { shatterElement(ui.btnBegin); gameSettings.customPrayers = null; initializeGame(); });
        ui.btnCustom.addEventListener('click', () => { ui.mainMenu.classList.remove('visible'); ui.customMenu.classList.add('visible'); });
        ui.btnGoCustom.addEventListener('click', () => {

            const prayers = ui.customPrayerTextarea.value.split('\n\n').map(p => p.trim()).filter(p => p.length > 0);

        ui.btnSettings.addEventListener('click', () => { ui.mainMenu.classList.remove('visible'); ui.settingsOverlay.classList.add('visible'); });
        ui.btnBackToMainFromSettings.addEventListener('click', showMainMenu);
        // FIX: This listener allows the player to return to the menu from within the game, fulfilling the request.
        ui.backToMenuFromGameBtn.addEventListener('click', showMainMenu);

        /**

        function populatePrayerList() {
