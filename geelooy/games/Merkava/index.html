<script id="riverVertexShader" type="x-shader/x-vertex">
    uniform float uTime;
    uniform float uSpeed;
    varying vec2 vUv;
    #include <fog_pars_vertex>
    void main() {
        vUv = uv;
        vec3 pos = position;
        pos.y += (sin(pos.x * 2.5 + uTime * uSpeed * 0.4) + sin(pos.z * 1.8 + uTime * uSpeed * 0.6)) * 0.035;
        vec4 modelViewPosition = modelViewMatrix * vec4(pos, 1.0);
        gl_Position = projectionMatrix * modelViewPosition;
        #include <fog_vertex>
    }
</script>
<script id="riverFragmentShader" type="x-shader/x-fragment">
    uniform float uTime;
    uniform float uSpeed;
    uniform vec3 uColor;
    varying vec2 vUv;
    #include <fog_pars_fragment>
    void main() {
        vec2 roadUv = vUv;
        roadUv.y = fract(roadUv.y * 10.0 + uTime * uSpeed * 0.15);
        float line = smoothstep(0.4, 0.41, roadUv.y) - smoothstep(0.5, 0.51, roadUv.y);
        float dash = step(0.45, roadUv.x) - step(0.55, roadUv.x);
        vec3 finalColor = uColor * (1.0 - dash * line * 0.5);
        if (dash > 0.0 && line > 0.0) {
            finalColor = mix(finalColor, vec3(1.0, 0.84, 0.0), 0.7);
        }
        gl_FragColor = vec4(finalColor, 1.0);
        #include <fog_fragment>
    }
</script>

<script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

    // ===================================================================================
    // B"H - ATZILUT (אצילות) - World of Emanation: The Divine Blueprint

    // The rest of the application is an interpreter for this world.

    const KabbalahData = {

        OlamHaGashmi: {}, // Persistent Settings
        Gilgulim: { totalMitzvot: 0, upgrades: {}, tabletFragments: 0 }, // Player Progression

        Materials: { /* Populated at init */ },
        Geometries: { /* Populated at init */ },

        Archetypes: {
            // Player-related Archetypes
            merkava: {
                components: [
                    { type: 'position', x: 0, y: 0, z: 5 },

            },

                    { type: 'renderable', factory: 'nefesh' },

                ]
            },

                    { type: 'projectile_logic', damage: 1, pierce: 0 },

                ]
            },
            // Klipot Archetypes
            klipah_gate: {
                components: [
                    { type: 'position' },
                    { type: 'velocity', x: 0, y: 0, z: 0 },
                    { type: 'renderable', factory: 'klipah_gate' },
                    { type: 'collidable', shape: 'box', size: { x: 3, y: 4, z: 0.5 }, allegiance: 'klipah' },
                    { type: 'klipah_logic', health: 1, onHit: 'klipah_gate' }
                ]
            },
            torah_scroll: {
                components: [
                    { type: 'position' },
                    { type: 'velocity' },
                    { type: 'renderable', factory: 'torah_scroll' },
                    { type: 'collidable', shape: 'box', size: { x: 3.5, y: 3.5, z: 1 }, allegiance: 'klipah' },
                    { type: 'klipah_logic', health: 999, onHit: 'torah_scroll' }
                ]
            }
        },

        Settings: {
            "World Parameters": [
                { id: 'klipahHealthScale', label: 'Klipah Health Scalar', type: 'range', min: 0.5, max: 5, step: 0.1, default: 1.0 },
                { id: 'klipahSpeedScale', label: 'Klipah Speed Scalar', type: 'range', min: 0.5, max: 3, step: 0.1, default: 1.0 },
                { id: 'shatterCount', label: 'Shatter Particle Count', type: 'range', min: 1, max: 100, step: 1, default: 20 },
                { id: 'shatterSpeed', label: 'Shatter Particle Speed', type: 'range', min: 1, max: 50, step: 1, default: 25 },
            ],
            "Visual Effects": [
                { id: 'shakeIntensity', label: 'Screen Shake', type: 'range', min: 0, max: 5, step: 0.1, default: 1.0 },
                { id: 'flashIntensity', label: 'Flash Intensity', type: 'range', min: 0, max: 1, step: 0.05, default: 1.0 },
            ]
        },

        UI: { /* see Beriah.generateUI */ }
    };

    // ===================================================================================
    // B"H - BERIAH (בריאה) - World of Creation: The Factories
    // These functions take archetypes from Atzilut and create concrete instances (entities).
    // ===================================================================================
    const Beriah = {
        entityCounter: 0,
        createEntity(archetypeKey, overrides = {}) {
            const archetype = KabbalahData.Archetypes[archetypeKey];
            if (!archetype) { console.error(`Archetype not found: ${archetypeKey}`); return null; }

            const entity = { id: this.entityCounter++, archetype: archetypeKey, components: {} };
            
            archetype.components.forEach(compTpl => {
                const newComp = JSON.parse(JSON.stringify(compTpl)); // Deep clone
                entity.components[newComp.type] = newComp;
            });

            // Apply overrides (e.g., initial position)
            for (const compType in overrides) {
                if (entity.components[compType]) {
                    Object.assign(entity.components[compType], overrides[compType]);
                }
            }
            
            // If it's renderable, create the mesh
            const renderComp = entity.components.renderable;
            if (renderComp) {
                const mesh = this.createMesh(renderComp);
                if (mesh) {
                    renderComp.mesh = mesh;
                    scene.add(mesh);
                }
            }
            
            Olam.entities.set(entity.id, entity);
            return entity;
        },

        createMesh(renderComponent) {
            switch(renderComponent.factory) {
                case 'merkava': {
                    const group = new THREE.Group();
                    group.add(new THREE.Mesh(KabbalahData.Geometries.chariot_floor, KabbalahData.Materials.chariot_floor));
                    const wheels = [];
                    [[-1.7, 1.2], [1.7, 1.2], [-1.7, -1.2], [1.7, -1.2]].forEach(([x,z]) => {
                        const wheel = new THREE.Mesh(KabbalahData.Geometries.chariot_wheel, KabbalahData.Materials.chariot_wheel);
                        wheel.rotation.z = Math.PI / 2;
                        wheel.position.set(x, 0, z);
                        group.add(wheel);
                        wheels.push(wheel);
                    });
                    group.userData.wheels = wheels;
                    return group;
                }
                case 'nefesh': {
                    const group = new THREE.Group();
                    const top = new THREE.Mesh(KabbalahData.Geometries.cone, KabbalahData.Materials.magenDavid);
                    top.position.y = 0.2;
                    const bottom = top.clone();
                    bottom.rotation.x = Math.PI;
                    bottom.position.y = -0.2;
                    group.add(top, bottom);
                    return group;
                }
                case 'klipah_gate': {
                    const group = new THREE.Group();
                    group.add(new THREE.Mesh(new THREE.BoxGeometry(3, 4, 0.5), KabbalahData.Materials.klipah_gate));
                    return group;
                }
                 case 'torah_scroll': {
                    const group = new THREE.Group();
                    const handleGeom = new THREE.CylinderGeometry(0.2, 0.2, 3.5, 8);
                    const scrollGeom = new THREE.CylinderGeometry(0.5, 0.5, 3, 16);
                    group.add(new THREE.Mesh(handleGeom, KabbalahData.Materials.torah_handle).translateX(-1.75));
                    group.add(new THREE.Mesh(handleGeom, KabbalahData.Materials.torah_handle).translateX(1.75));
                    group.add(new THREE.Mesh(scrollGeom, KabbalahData.Materials.torah_parchment).translateX(-1.25));
                    group.add(new THREE.Mesh(scrollGeom, KabbalahData.Materials.torah_parchment).translateX(1.25));
                    group.rotation.y = Math.PI / 2;
                    return group;
                }
                case 'sphere': return new THREE.Mesh(new THREE.SphereGeometry(renderComponent.scale, 6, 6), KabbalahData.Materials[renderComponent.material]);
            }
            return null;
        },
        
        generateDynamicUI(containerId, data, itemRenderer) {
            const container = Asiyah_IO.elements[containerId];
            if (!container) return;
            container.innerHTML = '';
            for (const key in data) {
                container.appendChild(itemRenderer(key, data[key]));
            }
        },
        
        generateSettingsUI() {
            const container = Asiyah_IO.elements.settingsContent;
            container.innerHTML = '';
            for (const category in KabbalahData.Settings) {
                const header = document.createElement('h3');
                header.className = 'setting-item';
                header.textContent = category;
                container.appendChild(header);

                KabbalahData.Settings[category].forEach(setting => {
                    const item = document.createElement('div');
                    item.className = 'setting-item';
                    const label = document.createElement('label');
                    label.htmlFor = setting.id;
                    const valueSpan = document.createElement('span');
                    valueSpan.textContent = ` ${KabbalahData.OlamHaGashmi[setting.id]}`;
                    label.textContent = setting.label + ':';
                    label.appendChild(valueSpan);

                    const input = document.createElement('input');
                    Object.assign(input, { id: setting.id, type: setting.type, min: setting.min, max: setting.max, step: setting.step, value: KabbalahData.OlamHaGashmi[setting.id] });

                    input.addEventListener('input', () => valueSpan.textContent = ` ${input.value}`);
                    input.addEventListener('change', async () => {
                        const value = input.type === 'checkbox' ? input.checked : parseFloat(input.value);
                        KabbalahData.OlamHaGashmi[setting.id] = value;
                        await Asiyah_IO.Database.save(setting.id, value);
                    });
                    
                    item.append(label, input);
                    container.appendChild(item);
                });
            }
        }
    };

    // ===================================================================================
    // B"H - YETZIRAH (יצירה) - World of Formation: The Systems
    // These are the "forces" or "angels" that act upon the created entities.
    // ===================================================================================
    const Yetzirah = {
        update(deltaTime) {
            this.Movement.update(deltaTime);
            this.Merkava.update(deltaTime);
            this.Nefesh.update(deltaTime);
            this.Klipah.update(deltaTime);
            this.Collision.update();
            this.Lifetime.update(deltaTime);
            this.Render.update();
            this.GameFlow.update(deltaTime);
        },
        
        Movement: {
            update(dt) {
                for (const entity of Olam.entities.values()) {
                    if (entity.components.position && entity.components.velocity) {
                        entity.components.position.x += entity.components.velocity.x * dt;
                        entity.components.position.y += entity.components.velocity.y * dt;
                        entity.components.position.z += entity.components.velocity.z * dt;
                    }
                }
            }
        },

        Merkava: {
            update(dt) {
                const merkavaEntity = Olam.merkava;
                if (!merkavaEntity) return;
                
                const pos = merkavaEntity.components.position;
                const logic = merkavaEntity.components.merkava_logic;
                const render = merkavaEntity.components.renderable;

                pos.x = THREE.MathUtils.lerp(pos.x, logic.targetX, 0.1);
                
                const speed = Olam.level * 1.5 + 12;
                if (render.mesh && render.mesh.userData.wheels) {
                    render.mesh.userData.wheels.forEach(w => w.rotation.x -= dt * speed * 0.2);
                }
            }
        },
        
        Nefesh: {
            update(dt) {
                const merkavaPos = Olam.merkava.components.position;
                Olam.nefeshEntities.forEach(entity => {
                    const pos = entity.components.position;
                    const logic = entity.components.nefesh_logic;
                    pos.x = THREE.MathUtils.lerp(pos.x, logic.targetPos.x, 0.15);
                    pos.y = THREE.MathUtils.lerp(pos.y, logic.targetPos.y, 0.15);
                    pos.z = THREE.MathUtils.lerp(pos.z, logic.targetPos.z, 0.15);

                    // Firing logic
                    if (Asiyah_Engine.time - logic.lastShotTime > Olam.merkavaLogic.fireRate) {
                        logic.lastShotTime = Asiyah_Engine.time;
                        const worldPos = new THREE.Vector3(pos.x + merkavaPos.x, pos.y, pos.z + merkavaPos.z);
                        Beriah.createEntity('ohr_projectile', { position: worldPos });
                    }
                });
            }
        },
        
        Klipah: {
            update(dt) {
                const speed = (Olam.level * 1.5 + 12) * KabbalahData.OlamHaGashmi.klipahSpeedScale;
                for (const entity of Olam.entities.values()) {
                    if (entity.archetype.includes('klipah')) {
                        entity.components.velocity.z = speed;
                    }
                }
            }
        },

        Collision: {
            update() {
                const playerProjectiles = [];
                const klipot = [];
                // This is a simplified sort. A real spatial hash would be better.
                for (const entity of Olam.entities.values()) {
                    if (entity.components.collidable) {
                        if (entity.components.collidable.allegiance === 'player') playerProjectiles.push(entity);
                        if (entity.components.collidable.allegiance === 'klipah') klipot.push(entity);
                    }
                }

                for (const proj of playerProjectiles) {
                    for (const klipah of klipot) {
                         const pPos = proj.components.position;
                         const kPos = klipah.components.position;
                         // Simplified distance check for demo
                         if (new THREE.Vector3(pPos.x, pPos.y, pPos.z).distanceTo(new THREE.Vector3(kPos.x, kPos.y, kPos.z)) < 2.0) {
                             this.handleCollision(proj, klipah);
                         }
                    }
                }
            },
            handleCollision(entityA, entityB) {
                // Destroy projectile
                Asiyah_Engine.destroyEntity(entityA.id);
                // Damage Klipah
                const klipahLogic = entityB.components.klipah_logic;
                if (klipahLogic) {
                    klipahLogic.health--;
                    if (klipahLogic.health <= 0) {
                        Asiyah_Engine.destroyEntity(entityB.id);
                    }
                }
            }
        },

        Lifetime: {
            update(dt) {
                for (const entity of Olam.entities.values()) {
                    const lifetime = entity.components.lifetime;
                    if (lifetime) {
                        lifetime.duration -= dt;
                        if (lifetime.duration <= 0) {
                            Asiyah_Engine.destroyEntity(entity.id);
                        }
                    }
                }
            }
        },
        
        Render: {
            update() {
                for (const entity of Olam.entities.values()) {
                    if (entity.components.position && entity.components.renderable && entity.components.renderable.mesh) {
                        const {mesh} = entity.components.renderable;
                        const pos = entity.components.position;
                        if(entity.archetype === 'nefesh'){
                            // Nefesh are relative to Merkava
                            const merkavaPos = Olam.merkava.components.position;
                            mesh.position.set(pos.x + merkavaPos.x, pos.y, pos.z + merkavaPos.z);
                        } else {
                            mesh.position.set(pos.x, pos.y, pos.z);
                        }
                    }
                }
            }
        },

        GameFlow: { /* Manages wave spawning, level progression, etc. */ update(dt){} }
    };

    // ===================================================================================
    // B"H - ASIYAH (עשיה) - World of Action: The Engine & I/O
    // This is the concrete implementation that connects to the browser and runs the loop.
    // ===================================================================================
    const Asiyah_Engine = {
        time: 0,
        
        init() {
            // Connect to the physical DOM
            Asiyah_IO.init();
            
            // Finalize data definitions
            this.populateData();

            // Load persistent data
            Asiyah_IO.Database.loadAll().then(() => {
                Beriah.generateSettingsUI();
                Asiyah_IO.showOverlay('mainMenuOverlay');
            });
            
            this.mainLoop();
        },

        populateData() {
             KabbalahData.Geometries = {
                cone: new THREE.ConeGeometry(0.4, 0.6, 3),
                chariot_floor: new THREE.PlaneGeometry(3, 4).rotateX(-Math.PI/2).translate(0, 0.25, 0),
                chariot_wheel: new THREE.CylinderGeometry(0.4, 0.4, 0.2, 16),
            };
             KabbalahData.Materials = {
                magenDavid: new THREE.MeshLambertMaterial({ color: 0x00aaff, emissive: 0x00aaff, emissiveIntensity: 0.5 }),
                ohr: new THREE.MeshBasicMaterial({ color: 0x00ffff, fog: false }),
                chariot_floor: new THREE.MeshStandardMaterial({color: 0x3a2d0c, metalness: 0.4, roughness: 0.6}),
                chariot_wheel: new THREE.MeshStandardMaterial({color: 0x553b0e}),
                klipah_gate: new THREE.MeshStandardMaterial({color: 0x550000, emissive: 0xff0000, emissiveIntensity: 1.0, roughness: 0.9}),
                torah_parchment: new THREE.MeshStandardMaterial({ color: 0xf5deb3, roughness: 0.8 }),
                torah_handle: new THREE.MeshStandardMaterial({ color: 0x8b4513, roughness: 0.6 }),
             };
        },
        
        startGame(isCustom) {
            // Beriah - Create the world anew
            Olam = {
                current: 'playing',
                entities: new Map(),
                // ... other state properties from defaults
            };

            Olam.merkava = Beriah.createEntity('merkava');
            Olam.merkavaLogic = Olam.merkava.components.merkava_logic;
            
            Olam.nefeshEntities = [];
            const numNefesh = 10;
            const angleStep = Math.PI * (3 - Math.sqrt(5));
            for(let i=0; i<numNefesh; i++){
                const radius = 0.45 * Math.sqrt(i + 1);
                const angle = i * angleStep;
                const nefesh = Beriah.createEntity('nefesh');
                nefesh.components.nefesh_logic.targetPos.set(Math.cos(angle) * radius, 0.8, Math.sin(angle) * radius);
                Olam.nefeshEntities.push(nefesh);
            }

            Asiyah_IO.showOverlay(null); // Hide all overlays
        },

        endGame() {
            Olam.current = 'menu';
            // ... cleanup logic ...
            Asiyah_IO.showOverlay('gameOverOverlay');
        },

        destroyEntity(entityId) {
            const entity = Olam.entities.get(entityId);
            if (entity) {
                if (entity.components.renderable && entity.components.renderable.mesh) {
                    scene.remove(entity.components.renderable.mesh);
                }
                Olam.entities.delete(entityId);
            }
        },
        
        mainLoop() {
            animationFrameId = requestAnimationFrame(Asiyah_Engine.mainLoop);
            const deltaTime = Math.min(0.05, clock.getDelta());
            Asiyah_Engine.time = clock.getElapsedTime();
            
            if (Olam.current === 'playing') {
                Yetzirah.update(deltaTime);
            }
            
            renderer.render(scene, Asiyah_IO.camera);
        }
    };

    const Asiyah_IO = {
        camera: new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000),
        renderer: new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" }),
        elements: {},
        
        init() {
            // Cache DOM elements
            const ids = ['ui-root', 'mainMenuOverlay', 'gameOverOverlay', 'customMenuOverlay', 'upgradeShopOverlay', 'settingsOverlay', 'settingsContent'];
            ids.forEach(id => this.elements[id] = document.getElementById(id));

            // Setup renderer and camera
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.insertBefore(this.renderer.domElement, this.elements['ui-root']);
            this.camera.position.set(0, 8, 11);
            this.camera.lookAt(0,2,0);
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            scene.add(new THREE.DirectionalLight(0xffffff, 1.0).position.set(5,10,7.5));
            scene.fog = new THREE.Fog(0x050008, 50, 200);

            // Setup declarative event listeners
            const eventConfig = {
                btnBegin: { click: () => Asiyah_Engine.startGame(false) },
                tryAgainButton: { click: () => Asiyah_Engine.startGame(false) },
                // ... and so on for all buttons
            };
            
            // Add movement handlers separately
            document.addEventListener('mousedown', (e) => this.handleInteractionStart(e.clientX, e));
            document.addEventListener('mousemove', (e) => this.handleMove(e.clientX, e));
            document.addEventListener('mouseup', () => Yetzirah.Merkava.isDragging = false);
            document.addEventListener('touchstart', (e) => this.handleInteractionStart(e.touches[0].clientX, e), {passive: false});
            document.addEventListener('touchmove', (e) => this.handleMove(e.touches[0].clientX, e), {passive: false});
            document.addEventListener('touchend', () => Yetzirah.Merkava.isDragging = false);
        },
        handleInteractionStart(clientX, e){
            if(Olam.current !== 'playing' || e.target.closest('button')) return;
            Yetzirah.Merkava.isDragging = true;
            Yetzirah.Merkava.lastTouchX = clientX;
            e.preventDefault();
        },
        handleMove(clientX, e){
            if(!Yetzirah.Merkava.isDragging) return;
            const deltaX = clientX - Yetzirah.Merkava.lastTouchX;
            Yetzirah.Merkava.targetX += deltaX * 0.03;
            Yetzirah.Merkava.lastTouchX = clientX;
        },

        showOverlay(id) {
            for (const key in this.elements) {
                if (key.includes('Overlay')) {
                    this.elements[key].classList.toggle('visible', key === id);
                }
            }
        },

        Database: {
            db: null,
            async init() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open("MerkavaDB_v7", 1);
                    request.onerror = () => reject("DB Error");
                    request.onsuccess = e => { this.db = e.target.result; resolve(); };
                    request.onupgradeneeded = e => {
                        if (!e.target.result.objectStoreNames.contains('OlamHaGashmi')) {
                            e.target.result.createObjectStore('OlamHaGashmi', { keyPath: 'id' });
                        }
                    };
                });
            },
            async save(id, value) {
                if (!this.db) return;
                const tx = this.db.transaction('OlamHaGashmi', 'readwrite');
                tx.objectStore('OlamHaGashmi').put({ id, value });
                return new Promise(resolve => tx.oncomplete = resolve);
            },
            async load(id) {
                if (!this.db) return undefined;
                return new Promise(resolve => {
                    const req = this.db.transaction('OlamHaGashmi').objectStore('OlamHaGashmi').get(id);
                    req.onsuccess = e => resolve(e.target.result ? e.target.result.value : undefined);
                    req.onerror = () => resolve(undefined);
                });
            },
            async loadAll() {
                for (const category of Object.values(KabbalahData.Settings)) {
                    for (const setting of category) {
                        const val = await this.load(setting.id);
                        KabbalahData.OlamHaGashmi[setting.id] = val !== undefined ? val : setting.default;
                    }
                }
            }
        }
    };

    // Let there be light.
    Asiyah_Engine.init();

</script>
</body>
</html>
