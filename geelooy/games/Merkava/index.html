<!DOCTYPE html>
<!--
ב"ה B"H
Merkava: The Celestial Journey v4.5
Developer: Gemini
Date: 2025-08-22

This file is a complete, self-contained application. This version is a major feature and stability update based on user feedback.

* **Stability & Performance:**
*   Resolved a crash during boss battles caused by excessive particle generation on defeat by significantly reducing particle counts.
*   Overhauled the Nefesh collision system for better accuracy, especially with complex obstacles like Tohu Shards.
*   Corrected fleet regeneration logic to ensure new Nefesh properly fill gaps in the formation from all sources.
*   Replaced the non-functional road shader with a new, stable "River of Eden" effect that is always visible and dynamic.
*   Removed the "Celestial Wind" effect to improve gameplay focus and resolve related issues.
*   Added numerous checks to prevent errors from uninitialized or missing game objects.

* **Boss Battle Overhaul:**
*   The "Heichalot Guardian" boss now has active attack patterns, including projectile volleys and sweeping attacks.
*   The boss has been given a vibrant, high-contrast material and a distinct outline for better visibility.
*   A "HEICHALOT GUARDIAN APPROACHING" notifier now heralds the boss's arrival.

* **New Features & Enhancements:**
*   **Gameplay Pacing:** The early-game difficulty has been significantly increased. More complex and challenging enemy patterns now appear from the start of the journey.
*   **New Obstacle: Torah Scroll:** A new dynamic obstacle, the Torah Scroll, now appears in later levels, presenting a unique challenge.
*   **Enhanced Constellations:** The celestial network system now dynamically connects not only distant stars but also the special Hebrew letter particles, creating a more interconnected and living cosmos.
*   **Dynamic Lightning:** Added a new lightning effect that can trigger on "Perfect Waves" and other key moments.
*   **Webcam System Rework (Major Fixes):**
    *   **FIXED:** The rendering logic has been rewritten. Sign posts now "grow" upwards from the ground and no longer clip through the road plane.
    *   **FIXED:** The right-side webcam sign post no longer freezes on the first frame and now plays the video correctly.
    *   The left post correctly shows a mirrored image.
    *   A new in-game, real-time control panel allows for on-the-fly adjustment of sign post distance, height, and size.

* **All Features & Fixes from v4.4 Retained.**
-->

    <script id="riverVertexShader" type="x-shader/x-vertex">
        uniform float uTime;
        uniform float uSpeed;
        varying vec2 vUv;
        void main() {
            vUv = uv;
            vec3 pos = position;
            float wave1 = sin(pos.x * 2.5 + uTime * uSpeed * 0.4) * 0.07;
            float wave2 = sin(pos.z * 1.8 + uTime * uSpeed * 0.6) * 0.07;
            pos.y += (wave1 + wave2) * 0.5;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
    </script>
    <script id="riverFragmentShader" type="x-shader/x-fragment">
        uniform float uTime;
        uniform float uSpeed;
        uniform vec3 uColor;
        varying vec2 vUv;

        float random(vec2 st) {
            return fract(sin(dot(st.xy, vec2(12.9898, 78.233))) * 43758.5453123);
        }

        float noise(vec2 st) {
            vec2 i = floor(st);
            vec2 f = fract(st);
            float a = random(i);
            float b = random(i + vec2(1.0, 0.0));
            float c = random(i + vec2(0.0, 1.0));
            float d = random(i + vec2(1.0, 1.0));
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(a, b, u.x) + (c - a) * u.y * (1.0 - u.x) + (d - b) * u.y * u.x;
        }

        void main() {
            vec2 uv = vUv;
            uv.y -= uTime * uSpeed * 0.07;

            // Flowing river effect
            vec2 noiseUv = uv * vec2(1.0, 4.0) + vec2(0.0, uTime * uSpeed * 0.1);
            float n = noise(noiseUv * 5.0) * 0.5 + noise(noiseUv * 15.0) * 0.2;
            vec3 riverColor = uColor + vec3(0.0, 0.0, 0.1) + n * 0.1;

            // Dotted yellow lines
            vec2 roadUv = vUv;
            roadUv.y = fract(roadUv.y * 10.0 - uTime * uSpeed * 0.15);
            float laneWidth = 0.08;
            float lanePos1 = 0.5 - laneWidth/2.0;
            float lanePos2 = 0.5 + laneWidth/2.0;
            
            float line = smoothstep(0.4, 0.41, roadUv.y) - smoothstep(0.5, 0.51, roadUv.y);
            float leftDash = step(lanePos1, roadUv.x) - step(lanePos1 + 0.01, roadUv.x);
            float rightDash = step(lanePos2, roadUv.x) - step(lanePos2 + 0.01, roadUv.x);
            
            vec3 finalColor = riverColor;
            if ((leftDash > 0.0 || rightDash > 0.0) && line > 0.0) {
                finalColor = mix(finalColor, vec3(1.0, 0.84, 0.0), 0.7);
            }
            
            gl_FragColor = vec4(finalColor, 1.0);
        }
    </script>
    <script id="torahPortalShader" type="x-shader/x-fragment">
        uniform float uTime;
        varying vec2 vUv;

        float random (in vec2 _st) {
            return fract(sin(dot(_st.xy, vec2(12.9898,78.233))) * 43758.5453123);
        }

        float noise (in vec2 _st) {
            vec2 i = floor(_st);
            vec2 f = fract(_st);
            float a = random(i);
            float b = random(i + vec2(1.0, 0.0));
            float c = random(i + vec2(0.0, 1.0));
            float d = random(i + vec2(1.0, 1.0));
            vec2 u = f * f * (3.0 - 2.0 * f);
            return mix(a, b, u.x) + (c - a)*u.y*(1.0-u.x) + (d - b)*u.y*u.x;
        }

        #define NUM_OCTAVES 5

        float fbm ( in vec2 _st) {
            float v = 0.0;
            float a = 0.5;
            vec2 shift = vec2(100.0);
            mat2 rot = mat2(cos(0.5), sin(0.5), -sin(0.5), cos(0.50));
            for (int i = 0; i < NUM_OCTAVES; ++i) {
                v += a * noise(_st);
                _st = rot * _st * 2.0 + shift;
                a *= 0.5;
            }
            return v;
        }

        void main() {
            vec2 st = vUv;
            st.x *= 1.0 + (st.y - 1.0) * 0.1;
            st.x += (st.y - 1.0) * -0.1;

            vec2 q = vec2(0.);
            q.x = fbm( st + 0.1*uTime);
            q.y = fbm( st + vec2(1.0));

            vec2 r = vec2(0.);
            r.x = fbm( st + 1.0*q + vec2(1.7,9.2)+ 0.15*uTime );
            r.y = fbm( st + 1.0*q + vec2(8.3,2.8)+ 0.126*uTime);

            float f = fbm(st+r);

            vec3 color = mix(vec3(0.101961,0.619608,0.666667),
                             vec3(0.666667,0.666667,0.498039),
                             clamp((f*f)*4.0,0.0,1.0));

            color = mix(color,
                        vec3(0,0,0.164706),
                        clamp(length(q),0.0,1.0));

            color = mix(color,
                        vec3(0.666667,1,1),
                        clamp(length(r.x),0.0,1.0));

            gl_FragColor = vec4((f*f*f+.6*f*f+.5*f)*color, 1.);
        }
    </script>

        function toGematria(n) {
            if (n === 15) return 'ט״ו';
            if (n === 16) return 'ט״ז';
            let str = '';
            let val = Math.abs(n);
            const sortedKeys = Object.keys(gematriaMap).map(Number).sort((a, b) => b - a);
            while (val > 0) {
                for (const key of sortedKeys) {
                    if (val >= key) {
                        str += gematriaMap[key];
                        val -= key;
                        break;

            }

                request.onsuccess = event => { db = event.target.result; resolve(); };
                request.onupgradeneeded = event => {

                        event.target.result.createObjectStore('settings', { keyPath: 'id' });
                    }

                    obj = this.createFn();

                if (!obj) return;
                obj.visible = false;

            async initialize() {
                if (this.isInitialized || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                    displayGlobalError("Webcam not supported by this browser.");
                    return false;
                }
                try {
                    this.stream = await navigator.mediaDevices.getUserMedia({ video: true });
                    this.videoElement.srcObject = this.stream;
                    await this.videoElement.play();
                    
                    // B"H FIX: Create two separate VideoTexture instances from the same element
                    // to solve the frozen frame issue on the non-mirrored texture.
                    this.videoTexture = new THREE.VideoTexture(this.videoElement);
                    this.videoTexture.colorSpace = THREE.SRGBColorSpace;
                    
                    this.videoTextureMirrored = new THREE.VideoTexture(this.videoElement);
                    this.videoTextureMirrored.colorSpace = THREE.SRGBColorSpace;
                    this.videoTextureMirrored.wrapS = THREE.RepeatWrapping;
                    this.videoTextureMirrored.repeat.x = -1;

                    this.createCentralDisplay();
                    this.createSignPosts();
                    this.isInitialized = true;
                    return true;

                    console.error("B\"H: Error accessing webcam.", err);

                if(this.signPostLeft) scene.remove(this.signPostLeft);

                const createPost = (isMirrored) => {
                    const group = new THREE.Group();
                    // B"H FIX: Use a unit-height pole with its base at the origin.
                    // This allows it to be scaled vertically from the ground up.
                    const postGeo = new THREE.CylinderGeometry(0.1, 0.1, 1, 12);
                    postGeo.translate(0, 0.5, 0); // Move base to y=0
                    const postMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.8 });
                    const post = new THREE.Mesh(postGeo, postMat);
                    
                    const signGeo = new THREE.CircleGeometry(1, 32); // Base radius of 1, will be scaled
                    const signMat = new THREE.MeshBasicMaterial({
                        map: isMirrored ? this.videoTextureMirrored : this.videoTexture,
                        side: THREE.DoubleSide
                    });
                    const sign = new THREE.Mesh(signGeo, signMat);

                    group.add(post, sign);
                    group.visible = false;
                    // Store refs and state data. currentY will now represent height.
                    group.userData = { signMesh: sign, postMesh: post, currentY: -8 };
                    scene.add(group);
                    return group;
                }
                this.signPostLeft = createPost(true);
                this.signPostRight = createPost(false);
            },
            stop() {
                if (this.stream) { this.stream.getTracks().forEach(track => track.stop()); }
                this.videoElement.srcObject = null;
                this.stream = null; this.isInitialized = false; this.updateVisibility();
            },
            updateVisibility() {
                const mode = gameSettings.webcamMode || 'off';
                const side = gameSettings.signpostSide || 'left';
                const showCentral = this.isInitialized && (mode === 'central' || mode === 'both' || mode === 'central_signpost');
                const showSignposts = this.isInitialized && (mode === 'signpost' || mode === 'central_signpost');

                if (this.centralDisplay) { this.centralDisplay.visible = showCentral; }
                if (this.signPostLeft) { this.signPostLeft.visible = showSignposts && (side === 'left' || side === 'both'); }
                if (this.signPostRight) { this.signPostRight.visible = showSignposts && (side === 'right' || side === 'both'); }
                
                const showOnIndividual = this.isInitialized && (mode === 'individual' || mode === 'both');

                ui.toggleSignpostControlsBtn.style.display = showSignposts ? 'block' : 'none';
            },
            update(deltaTime) {
                if (!this.isInitialized) return;
                const posts = [this.signPostLeft, this.signPostRight].filter(p => p);

                posts.forEach((post, index) => {
                    let isVisible = post.visible;
                    if (isVisible && gameSettings.signpostAlternating && gameSettings.signpostSide === 'both') {
                        const period = 2.0;
                        const phase = index === 0 ? 0.0 : period / 2.0;
                        isVisible = Math.sin((clock.getElapsedTime() + phase) * Math.PI / period) > 0;
                    }
                    
                    const { signMesh, postMesh } = post.userData;
                    
                    // B"H REWORK: Animate height instead of group Y-position
                    const targetHeight = isVisible ? gameSettings.signpostHeight : -8;
                    post.userData.currentY = THREE.MathUtils.lerp(post.userData.currentY, targetHeight, 4 * deltaTime);
                    const currentHeight = Math.max(0, post.userData.currentY);

                    // Position the whole group on the XZ plane at road level
                    post.position.set(
                        (index === 0 ? -1 : 1) * gameSettings.signpostDistance,
                        roadLevelY,
                        0 // Z position relative to camera, can be adjusted
                    );
                    
                    // Scale the pole to connect the ground to the sign
                    if (postMesh) {
                        postMesh.scale.y = currentHeight;
                    }

                    // Position the sign at the top of the pole and scale it
                    if (signMesh) {
                        signMesh.position.y = currentHeight;
                        signMesh.scale.setScalar(gameSettings.signpostSize);
                        signMesh.lookAt(camera.position);
                    }
                });
            }
        };

            if (activeLightning) scene.remove(activeLightning);

                for (let j = 0; j < points.length - 1; j++) {

                    let mid = p1.clone().lerp(p2, 0.5);
                    let offset = new THREE.Vector3().randomDirection().multiplyScalar(p1.distanceTo(p2) * 0.3);
                    mid.add(offset);

                newPoints.push(points[points.length - 1]);

            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({ color: 0xffffff, transparent: true, fog: false, blending: THREE.AdditiveBlending });

        function createNebula() {
            const geo = new THREE.PlaneGeometry(500, 500);
            const canvas = document.createElement('canvas');
            const size = 512;
            canvas.width = size; canvas.height = size;
            const ctx = canvas.getContext('2d');
            const color1 = `hsla(${Math.random() * 360}, 70%, 50%, 0.7)`;
            ctx.fillStyle = `hsla(${Math.random() * 360}, 80%, 60%, 0.5)`;
            const gradient = ctx.createRadialGradient(size/2, size/2, 0, size/2, size/2, size/2);
            gradient.addColorStop(0, color1);
            gradient.addColorStop(1, 'rgba(0,0,0,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0,0,size,size);
            for (let i=0; i<50; i++) {
                ctx.fillStyle = `hsla(${Math.random() * 360}, 90%, 80%, ${Math.random() * 0.1})`;
                ctx.beginPath();
                ctx.arc(Math.random() * size, Math.random() * size, Math.random() * 100, 0, Math.PI * 2);
                ctx.fill();
            }
            const texture = new THREE.CanvasTexture(canvas);
            const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false });
            return new THREE.Mesh(geo, mat);

        function regenerateWorld() {
            if (world.road) scene.remove(world.road);
            if (world.starfield) scene.remove(world.starfield);
            if (world.constellationNetwork) scene.remove(world.constellationNetwork);
            if (world.specialParticleNetwork) scene.remove(world.specialParticleNetwork);

        function createWorld() {
            const roadGeo = new THREE.PlaneGeometry(roadWidth, roadLength, 20, 100);
            // B"H FIX: Use the functional custom shader for the road
            const roadMat = new THREE.ShaderMaterial({
                vertexShader: document.getElementById('riverVertexShader').textContent,
                fragmentShader: document.getElementById('riverFragmentShader').textContent,
                uniforms: {
                    uTime: { value: 0.0 }, uSpeed: { value: 1.0 },
                    uColor: { value: new THREE.Color(0x483d8b) },
                },
            });
            world.road = new THREE.Mesh(roadGeo, roadMat);
            world.road.rotation.x = -Math.PI / 2;
            world.road.position.y = roadLevelY;
            scene.add(world.road);

            const numStars = gameSettings.starfieldDensity || 2000;
            const starVertices = [];
            for (let i = 0; i < numStars; i++) {
                const x = (Math.random() - 0.5) * 500;
                const y = (Math.random() - 0.5) * 250;
                const z = (Math.random() - 0.5) * 1000;
                starVertices.push(x, y, z);
                starfieldParticles.push({ position: new THREE.Vector3(x, y, z), neighbors: [] });
            }
            const starGeometry = new THREE.BufferGeometry();
            starGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starVertices, 3));
            const starMaterial = new THREE.PointsMaterial({ size: 0.2, color: 0xaa88ff, fog: false });
            world.starfield = new THREE.Points(starGeometry, starMaterial);
            scene.add(world.starfield);

            if (gameSettings.enableConstellations) {
                const connections = [];
                const maxDistSq = Math.pow(gameSettings.constellationDistance, 2);
                const connectionsPerStar = gameSettings.constellationConnections;
                for (let i = 0; i < starfieldParticles.length; i++) {
                    const star1 = starfieldParticles[i];
                    let neighbors = [];
                    for (let j = 0; j < starfieldParticles.length; j++) {
                        if (i === j) continue;
                        const star2 = starfieldParticles[j];
                        const distSq = star1.position.distanceToSquared(star2.position);
                        if (distSq < maxDistSq) {
                            neighbors.push({ index: j, distSq });
                        }
                    }
                    neighbors.sort((a, b) => a.distSq - b.distSq);
                    for (let k = 0; k < neighbors.length && k < connectionsPerStar; k++) {
                        const neighborIndex = neighbors[k].index;
                        if (i < neighborIndex) {
                            connections.push(star1.position, starfieldParticles[neighborIndex].position);
                        }
                    }
                }
                const lineGeo = new THREE.BufferGeometry().setFromPoints(connections);
                const lineMat = new THREE.LineBasicMaterial({ color: 0x445599, transparent: true, opacity: 0.2, fog: false });
                world.constellationNetwork = new THREE.LineSegments(lineGeo, lineMat);
                scene.add(world.constellationNetwork);
            }
            
            if (gameSettings.enableParticleNetwork) {
                const maxLines = 500;
                const lineGeo = new THREE.BufferGeometry();
                const positions = new Float32Array(maxLines * 2 * 3);
                lineGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3).setUsage(THREE.DynamicDrawUsage));
                const lineMat = new THREE.LineBasicMaterial({ color: 0x88aaff, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending, fog: false });
                world.specialParticleNetwork = new THREE.LineSegments(lineGeo, lineMat);
                world.specialParticleNetwork.frustumCulled = false;
                scene.add(world.specialParticleNetwork);
            }


            for(let i=0; i<5; i++) {
                const nebula = createNebula();
                nebula.position.set((Math.random() - 0.5) * 400, (Math.random() - 0.5) * 200, -500 - Math.random() * 400);
                world.nebulae.push(nebula);
                scene.add(nebula);
            }
            world.isInitialized = true;
        }

        function pattern_Wall(z) { return [spawnObstacle('jar', 0, z), spawnObstacle('jar', 1, z), spawnObstacle('jar', 2, z)].filter(Boolean); }
        function pattern_Gauntlet(z) { const enemies = []; const lane = Math.floor(Math.random() * 3); for(let i = 0; i < 4; i++) { enemies.push(spawnObstacle('tohu_shard', lane, z - i * 15)); } return enemies.filter(Boolean); }
        function pattern_SentryGuard(z) { const lane = Math.floor(Math.random() * 3); const sideLane = lane === 1 ? (Math.random() < 0.5 ? 0 : 2) : 1; return [spawnObstacle('golem_sentry', lane, z - 10), spawnObstacle('jar', lane, z), spawnObstacle('jar', sideLane, z - 5)].filter(Boolean); }
        function pattern_KlipahWeave(z) { const startLane = Math.random() < 0.5 ? 0 : 2; return [spawnObstacle('klipah_gate', startLane, z), spawnObstacle('klipah_gate', 1, z - 15), spawnObstacle('klipah_gate', 2 - startLane, z - 30)].filter(Boolean); }
        function pattern_TomeKeeperGuard(z) { const enemies = []; const protectedLane = Math.floor(Math.random() * 3); const keeperLane = (protectedLane + 1 + Math.floor(Math.random() * 2)) % 3; const protectedEnemy = spawnObstacle('golem_sentry', protectedLane, z); if (protectedEnemy) { enemies.push(protectedEnemy); const tomeKeeper = spawnObstacle('tome_keeper', keeperLane, z - 5); if (tomeKeeper) { enemies.push(tomeKeeper); tomeKeeper.userData.shieldedEnemy = protectedEnemy; protectedEnemy.userData.isShielded = true; if (!protectedEnemy.userData.shieldVisual) { protectedEnemy.userData.shieldVisual = new THREE.Mesh(new THREE.SphereGeometry(1.5, 16, 16), shieldMaterial); protectedEnemy.add(protectedEnemy.userData.shieldVisual); } protectedEnemy.userData.shieldVisual.visible = true; } } return enemies; }
        function pattern_WeaverDance(z) { return [spawnObstacle('weaver', 0, z), spawnObstacle('weaver', 2, z - 10)].filter(Boolean); }
        function pattern_ShattererAmbush(z) { const lane = Math.floor(Math.random() * 3); return [spawnObstacle('shatterer', lane, z), spawnObstacle('jar', (lane + 1) % 3, z - 15), spawnObstacle('jar', (lane + 2) % 3, z - 15)].filter(Boolean); }
        function pattern_Minefield(z) { const lane = Math.floor(Math.random()*3); return [spawnObstacle('minelayer', lane, z)].filter(Boolean); }
        function pattern_MinerAndThorns(z) { const lane = Math.floor(Math.random()*3); return [spawnObstacle('minelayer', lane, z), spawnObstacle('tohu_shard', (lane+1)%3, z-20), spawnObstacle('tohu_shard', (lane+2)%3, z-20)].filter(Boolean); }
        function pattern_TorahWall(z) { return [spawnObstacle('torah_scroll', 0, z), spawnObstacle('torah_scroll', 2, z)].filter(Boolean); }
        const patternSets = {
            early: [pattern_Wall, pattern_KlipahWeave, pattern_SentryGuard],
            mid: [pattern_Gauntlet, pattern_SentryGuard, pattern_WeaverDance, pattern_Minefield, pattern_TomeKeeperGuard],
            late: [pattern_TomeKeeperGuard, pattern_ShattererAmbush, pattern_KlipahWeave, pattern_MinerAndThorns, pattern_TorahWall],
            expert: [pattern_TomeKeeperGuard, pattern_WeaverDance, pattern_ShattererAmbush, pattern_MinerAndThorns, pattern_TorahWall]
        };
        function getPatternSet() {
            // B"H: Difficulty ramp adjusted to be more challenging earlier.
            if (gameState.level < 3) return patternSets.early;
            if (gameState.level < 7) return [...patternSets.early, ...patternSets.mid];
            if (gameState.level < 12) return [...patternSets.mid, ...patternSets.late];
            return [...patternSets.late, ...patternSets.expert];
        }
        function spawnWave(patternFunction, z) {
            if (!patternFunction) return;
            const enemies = patternFunction(z);
            if (enemies.length === 0) return;
            gameState.wave.isTracking = true;
            gameState.wave.hitsTakenThisWave = 0;
            gameState.wave.waveId = gameState.nextWaveId++;
            gameState.wave.enemiesInWave.clear();
            enemies.forEach(enemy => {
                if (enemy) {
                    enemy.userData.waveId = gameState.wave.waveId;
                    gameState.wave.enemiesInWave.add(enemy);
                }
            });
        }
        function trySpawnNextWave() {
            if (gameState.wave.isTracking || (gameState.bossManager && gameState.bossManager.isActive)) return;
            let rearmostZ = 0;
            const allObstacles = [...klipahGatePool.active, ...jarPool.active, ...tohuShardPool.active, ...golemSentryPool.active, ...tomeKeeperPool.active, ...weaverPool.active, ...shattererPool.active, ...minelayerPool.active, ...torahScrollPool.active];
            for(const obs of allObstacles) {
                if (obs && obs.position.z < rearmostZ) rearmostZ = obs.position.z;
            }
            // B"H: Increased spawn aggression. Waves spawn when the screen is clearer.
            if (rearmostZ > -100) {
                const availablePatterns = getPatternSet();
                const chosenPattern = availablePatterns[Math.floor(Math.random() * availablePatterns.length)];
                spawnWave(chosenPattern, -130 - Math.random() * 40);
            }
        }
        function spawnSpecialParticle() {

            p.material.opacity = 0.1 + Math.random() * 0.5;

            p.scale.set(scale, scale, scale);

            const randomSpeed = 20 + gameState.level * 2;
            p.userData.velocity = new THREE.Vector3(0, 0, baseSpeed + Math.random() * randomSpeed);
            p.userData.type = 'special_particle';
        }

        const bossManager = {
            isActive: false, bossObject: null, state: 'inactive', stateTimer: 0, health: 0, maxHealth: 500,
            create() {
                const group = new THREE.Group();
                const coreGeom = new THREE.IcosahedronGeometry(2, 1);
                const coreMat = new THREE.MeshStandardMaterial({color: 0x220033, metalness: 0.8, roughness: 0.2, emissive: 0xaa00ff, emissiveIntensity: 1.5});
                const core = new THREE.Mesh(coreGeom, coreMat);

                const coreOutline = new THREE.Mesh(coreGeom, outlineMaterial);

                ring1.rotation.x = Math.PI / 2;
                ring2.rotation.x = Math.PI / 4;
                group.add(core, coreOutline, ring1, ring2);
                group.userData = {core, ring1, ring2};
                this.bossObject = group;
                scene.add(this.bossObject);
            },
            start() {
                if (!this.bossObject) this.create();
                this.isActive = true;
                this.state = 'intro';
                this.health = this.maxHealth * (1 + (gameState.level / 10));
                this.stateTimer = 5;

                setTimeout(() => ui.bossNotifier.classList.remove('show'), 4500);
                triggerFlash('#ff0000', 1000);
            },
            update(deltaTime) {
                if (!this.isActive || !this.bossObject) return;
                this.stateTimer -= deltaTime;
                this.bossObject.userData.ring1.rotation.z += deltaTime * 0.5;
                this.bossObject.userData.ring2.rotation.y -= deltaTime * 0.3;
                this.bossObject.userData.core.rotation.y += deltaTime * 0.2;
                switch(this.state) {
                    case 'intro':
                        this.bossObject.position.z = THREE.MathUtils.lerp(this.bossObject.position.z, -30, 0.05);
                        if(this.stateTimer <= 0) { this.state = 'attacking_volley'; this.stateTimer = 4; }
                        break;
                    case 'attacking_volley':
                         if(this.stateTimer <= 0) {
                            for(let i = 0; i < 5; i++) {
                                const proj = golemFastProjectilePool.activate();
                                if(proj) {
                                    const angle = (i / 5) * Math.PI - Math.PI / 2;
                                    const direction = new THREE.Vector3(Math.cos(angle), Math.sin(angle), 1).normalize();
                                    proj.position.copy(this.bossObject.position).add(new THREE.Vector3(0, 3, 0));
                                    proj.userData.velocity = direction.multiplyScalar(30);
                                    proj.userData.type = 'fast';
                                }
                            }
                            this.state = 'attacking_sweep';
                            this.stateTimer = 3.5 - Math.min(2, gameState.level * 0.1);
                        }
                        break;
                    case 'attacking_sweep':
                        if (this.stateTimer <= 0) {
                            const lane = Math.floor(Math.random() * 3);
                             for(let i = 0; i < 3; i++) {
                                if (i === lane) continue; // Leave one lane open
                                const proj = golemHeavyProjectilePool.activate();
                                if(proj) {
                                    proj.position.copy(this.bossObject.position).add(new THREE.Vector3(lanePositions[i], 2, 0));
                                    proj.userData.type = 'heavy';
                                    proj.userData.damage = 10;
                                    proj.userData.velocity = new THREE.Vector3(0, 0, 18);
                                }
                            }
                            this.state = 'vulnerable';
                            this.stateTimer = 3.0;
                        }
                        break;
                    case 'vulnerable':
                         this.bossObject.userData.core.material.emissive.setHex(0xffaa00);
                         if (this.stateTimer <= 0) {
                             this.bossObject.userData.core.material.emissive.setHex(0xaa00ff);
                             this.state = 'attacking_volley';
                             this.stateTimer = 2.0;
                         }
                         break;

                }
            },
            takeDamage(amount) {
                if (!this.isActive || this.state === 'intro') return;
                this.health -= amount;
                createParticleExplosion(this.bossObject.position, 10, '#ff8800', 15);
                triggerScreenShake(0.2);
                if (this.health <= 0) {
                    this.defeat();
                }
            },
            defeat() {
                this.isActive = false; this.state = 'defeated';
                // B"H: Defeat sequence now uses a controlled particle burst to prevent crashes.
                createParticleExplosion(this.bossObject.position, 75, '#ffaa00', 30);
                createParticleExplosion(this.bossObject.position, 50, '#aa00ff', 40);
                this.bossObject.visible = false;
                addShefa(200);
                gameState.mitzvot += 1000 * (1 + (playerStats.upgrades.mitzvotGain?.level || 0) * 0.02);
                triggerFlash('#ffffff', 1500);
                triggerFovKick(30);
                setTimeout(() => { if (gameState.bossManager) gameState.bossManager.state = 'inactive'; }, 3000);
            }
        };

        function populatePrayerList() {
            ui.prayerList.innerHTML = '';
            if (gameState.customPrayers && gameState.customPrayers.phrases.length > 0) {
                gameState.customPrayers.phrases.forEach((phrase, index) => {
                    const item = document.createElement('div');
                    item.className = 'prayer-list-item';
                    item.textContent = phrase;
                    if (index === gameState.customPrayers.currentIndex) item.classList.add('active');
                    item.addEventListener('click', () => {
                        gameState.customPrayers.currentIndex = index;
                        updatePrayerDisplay();
                        populatePrayerList();
                    });
                    ui.prayerList.appendChild(item);
                });
                ui.prayerSettingsToggleBtn.style.display = 'block';
            } else {

                item.style.fontStyle = 'italic';

            const activeItem = ui.prayerList.querySelector('.active');

        }
        ui.prayerDropdownBtn.addEventListener('click', () => { populatePrayerList(); ui.prayerListOverlay.classList.add('visible'); });
        ui.closePrayerListBtn.addEventListener('click', () => ui.prayerListOverlay.classList.remove('visible'));
        ui.prayerSettingsToggleBtn.addEventListener('click', () => {
            const panel = ui.prayerSettingsPanel;
