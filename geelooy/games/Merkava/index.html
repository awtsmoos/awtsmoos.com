        });
        ui.toggleSignpostControlsBtn.addEventListener('click', () => {
            const panel = ui.inGameSignpostControls;
            panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
        });

        const setupSettingListener = (element, settingName, parseFunc, valueSpan = null, isAsync = false, callback = null) => {
            if (!element) return;
            const eventType = element.type === 'range' ? 'input' : 'change';
            if (valueSpan) {
                element.addEventListener('input', e => { valueSpan.textContent = e.target.value; });
            }
            element.addEventListener('change', async e => {
                try {
                    const value = parseFunc(e.target.value, e.target.checked);
                    await saveSetting(settingName, value);
                    gameSettings[settingName] = value;
                    if (isAsync && callback) { await callback(); }
                    else if (!isAsync) { await applySettings(); }
                } catch(err) {
                    console.error(`Failed to save setting ${settingName}:`, err);
                }
            });
        };
        setupSettingListener(ui.maxNefeshSlider, 'maxNefesh', parseInt, ui.maxNefeshValue);
        setupSettingListener(ui.shakeIntensitySlider, 'shakeIntensity', parseFloat, ui.shakeIntensityValue);
        setupSettingListener(ui.flashIntensitySlider, 'flashIntensity', parseFloat, ui.flashIntensityValue);
        setupSettingListener(ui.effectsIntensitySlider, 'effectsIntensity', parseFloat, ui.effectsIntensityValue);
        setupSettingListener(ui.starfieldDensitySlider, 'starfieldDensity', parseInt, ui.starfieldDensityValue);
        setupSettingListener(ui.particleCharsTextarea, 'particleChars', val => val);
        setupSettingListener(ui.minParticleSizeSlider, 'minParticleSize', parseFloat, ui.minParticleSizeValue);
        setupSettingListener(ui.maxParticleSizeSlider, 'maxParticleSize', parseFloat, ui.maxParticleSizeValue);
        setupSettingListener(ui.shatterCountSlider, 'shatterCount', parseInt, ui.shatterCountValue);
        setupSettingListener(ui.shatterSpeedSlider, 'shatterSpeed', parseInt, ui.shatterSpeedValue);
        setupSettingListener(ui.enableFleetConduitsCheckbox, 'enableFleetConduits', (val, checked) => checked);
        setupSettingListener(ui.fleetConduitCountSlider, 'fleetConduitCount', parseInt, ui.fleetConduitCountValue);
        setupSettingListener(ui.enableConstellationsCheckbox, 'enableConstellations', (val, checked) => checked);
        setupSettingListener(ui.enableParticleNetworkCheckbox, 'enableParticleNetwork', (val, checked) => checked);
        setupSettingListener(ui.constellationConnectionsSlider, 'constellationConnections', parseInt, ui.constellationConnectionsValue);
        setupSettingListener(ui.constellationDistanceSlider, 'constellationDistance', parseInt, ui.constellationDistanceValue);
        setupSettingListener(ui.webcamModeSelect, 'webcamMode', val => val, null, true, updateWebcamState);
        setupSettingListener(ui.signpostSideSelect, 'signpostSide', val => val, null, true, updateWebcamState);
        setupSettingListener(ui.signpostAlternatingCheckbox, 'signpostAlternating', (val, checked) => checked, null, true, updateWebcamState);
        // In-game controls
        const setupInGameSlider = (slider, valueSpan, settingName, parseFunc = parseFloat) => {
            slider.addEventListener('input', e => {
                const value = parseFunc(e.target.value);
                valueSpan.textContent = value.toFixed(1);
                gameSettings[settingName] = value;
            });
            slider.addEventListener('change', e => {
                saveSetting(settingName, parseFunc(e.target.value));
            });
        };
        setupInGameSlider(ui.signpostDistanceSlider, ui.signpostDistanceValue, 'signpostDistance');
        setupInGameSlider(ui.signpostHeightSlider, ui.signpostHeightValue, 'signpostHeight');
        setupInGameSlider(ui.signpostSizeSlider, ui.signpostSizeValue, 'signpostSize');
        

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            updateCameraTarget();
        });
        function checkInstancedCollision(nefeshStateItem, otherObject) {
            if (!nefeshStateItem || !otherObject) return false;
            otherObject.getWorldPosition(worldPosVec);
            collisionVec2.set(worldPosVec.x, worldPosVec.z);
            return nefeshStateItem.collisionBox2D.containsPoint(collisionVec2);
        }
        function updateCameraTarget() {
            if (!gameState || gameState.nefesh === undefined) return;
            const activeNefeshCount = gameState.nefesh;
            if (activeNefeshCount <= 0) {
                cameraTargetPos.copy(originalCameraPos);
                return;
            }
            const radiusStep = 0.45;
            let maxRadiusForLayout = radiusStep * Math.sqrt(MAX_NEFESH);
            const scaleFactor = (maxRadiusForLayout * 2 > roadWidth) ? (roadWidth / 2) / maxRadiusForLayout : 1;
            const formationRadius = radiusStep * Math.sqrt(activeNefeshCount) * scaleFactor;
            const fovRad = THREE.MathUtils.degToRad(camera.fov);
            const requiredZDist = (formationRadius / Math.tan(fovRad / 2)) / camera.aspect;
            const requiredYDist = formationRadius / Math.tan(fovRad / 2);
            const distance = Math.max(requiredYDist, requiredZDist);
            const baseCamPos = new THREE.Vector3(0, 7, 9);
            cameraTargetPos.z = baseCamPos.z + distance * 1.4;
            cameraTargetPos.y = baseCamPos.y + distance * 0.8;
            cameraTargetPos.x = 0;
            cameraLookAtTarget.set(nefeshGroup.position.x, 2, 0);
        }

        function animate(currentTime) {
            animationFrameId = requestAnimationFrame(animate);
            try {
                if(gameState.current !== 'playing' || !gameState) return;
                const deltaTime = Math.min(0.05, clock.getDelta());
                const time = clock.getElapsedTime();
                const currentRoadSpeed = roadBaseSpeed + gameState.level * 1.5;

                if (!gameState.color.current.equals(gameState.color.target)) {
                    gameState.color.current.lerp(gameState.color.target, 0.5 * deltaTime);
                    renderer.setClearColor(gameState.color.current);
                    if(world.road) world.road.material.uniforms.uColor.value.copy(gameState.color.current);
                    if(scene.fog) scene.fog.color.copy(gameState.color.current);
                }
                if(world.road) {
                    world.road.material.uniforms.uTime.value = time;
                    world.road.material.uniforms.uSpeed.value = currentRoadSpeed / 20.0;
                }
                torahPortalMaterial.uniforms.uTime.value = time;
                if(webcam.isInitialized) webcam.update(deltaTime);

                const scrollSpeed = currentRoadSpeed * 0.1;
                if(world.starfield) {
                    const positions = world.starfield.geometry.attributes.position.array;
                    for (let i = 2; i < positions.length; i += 3) {
                        positions[i] += scrollSpeed * deltaTime;
                        if (positions[i] > camera.position.z) positions[i] -= 1000;
                    }
                    world.starfield.geometry.attributes.position.needsUpdate = true;
                }
                updateConstellationNetwork(deltaTime, scrollSpeed);

                if (Math.random() < Math.min(0.95, 0.4 + (gameState.level * 0.025))) spawnSpecialParticle();
                for (const p of specialParticlePool.active) {
                    if (!p.position) { specialParticlePool.deactivate(p); continue; }
                    p.position.addScaledVector(p.userData.velocity, deltaTime);
                    p.userData.life -= deltaTime;
                    if (p.userData.type === 'ein_sof_glimmer') {
                        p.material.opacity = 0.5 + Math.sin(time * 5) * 0.5;
                        const boundingSphere = new THREE.Sphere(nefeshGroup.position, 5);
                        if (boundingSphere.containsPoint(p.position)) {
                            showSurpriseNotifier("✨ EIN SOF'S BLESSING! ✨", "#ffffff");
                            gameState.effects.invincibleTimer = 5.0;
                            gameState.effects.allCritTimer = 5.0;
                            triggerFlash("#ffffff", 800);
                            p.userData.life = 0;
                        }
                    } else {
                        p.material.opacity = Math.sin(Math.max(0, p.userData.life) * 0.5 * Math.PI) * 0.7;
                    }
                    if (p.userData.life <= 0 || p.position.z > camera.position.z) {
                        specialParticlePool.deactivate(p);
                    }
                }
                updateSpecialParticleNetwork();

                let minX = Infinity, maxX = -Infinity;
                nefeshState.forEach(state => {
                    if (state.active && !destroyedNefeshIndices.has(nefeshState.indexOf(state))) {
                        if (state.targetPos.x < minX) minX = state.targetPos.x;
                        if (state.targetPos.x > maxX) maxX = state.targetPos.x;
                    }
                });
                if (minX !== Infinity) {
                    const leftBound = -roadWidth / 2 - minX;
                    const rightBound = roadWidth / 2 - maxX;
                    targetCubeX = Math.max(leftBound, Math.min(rightBound, targetCubeX));
                }
                nefeshGroup.position.x = THREE.MathUtils.lerp(nefeshGroup.position.x, targetCubeX, 0.1);
                cameraLookAtTarget.x = THREE.MathUtils.lerp(cameraLookAtTarget.x, nefeshGroup.position.x / 2, 0.1);

                if(gameState.combo.timer > 0) gameState.combo.timer -= deltaTime;
                else if (gameState.combo.count > 0) { gameState.combo.count = 0; ui.comboNotifier.classList.remove('show'); }
                if(gameState.player.hasRegen) {
                    gameState.player.regenTimer += deltaTime;
                    if(gameState.player.regenTimer > 15) { gameState.player.regenTimer = 0; if(gameState.nefesh > 0 && gameState.nefesh < MAX_NEFESH) adjustNefeshCount(1); }
                }
                if(gameState.effects.sefirahResonance > 0) gameState.effects.sefirahResonance -= deltaTime;
                if(gameState.effects.globalShield > 0) gameState.effects.globalShield -= deltaTime;
                if(gameState.effects.invincibleTimer > 0) gameState.effects.invincibleTimer -= deltaTime;
                if(gameState.effects.allCritTimer > 0) gameState.effects.allCritTimer -= deltaTime;

                const troopHalfSize = 0.4;
                let activeNefeshCount = 0;
                const tempMatrix = new THREE.Matrix4();
                const tempQuaternion = new THREE.Quaternion();
                const activeNefeshForLinks = [];
                nefeshState.forEach((state, i) => {
                    if (!state.active) {
                        tempMatrix.makeScale(0, 0, 0);
                        if(nefeshTopInstanced) nefeshTopInstanced.setMatrixAt(i, tempMatrix);
                        if(nefeshBottomInstanced) nefeshBottomInstanced.setMatrixAt(i, tempMatrix);
                        if (nefeshWebcamInstanced) nefeshWebcamInstanced.setMatrixAt(i, tempMatrix);
                        return;
                    }
                    activeNefeshCount++;
                    state.currentPos.lerp(state.targetPos, 0.15);
                    const worldPos = state.currentPos.clone().add(nefeshGroup.position);
                    activeNefeshForLinks.push({ pos: worldPos });
                    const worldX = nefeshGroup.position.x + state.currentPos.x;
                    const worldZ = nefeshGroup.position.z + state.currentPos.z;
                    state.collisionBox2D.min.set(worldX - troopHalfSize, worldZ - troopHalfSize);
                    state.collisionBox2D.max.set(worldX + troopHalfSize, worldZ + troopHalfSize);
                    if(state.currentScale < state.targetScale) {
                        state.currentScale = THREE.MathUtils.lerp(state.currentScale, state.targetScale, 0.2);
                    }
                    state.yRotation += deltaTime * 2;
                    if (!destroyedNefeshIndices.has(i) && currentTime - state.lastShotTime > gameState.player.fireRate) {
                        fireSpark(new THREE.Vector3(worldX, 0.4, worldZ), gameState.player.projectileDamage, gameState.player.hasPierce);
                        state.lastShotTime = currentTime;
                    }
                    tempQuaternion.setFromEuler(new THREE.Euler(0, state.yRotation, 0));
                    tempMatrix.compose(new THREE.Vector3(state.currentPos.x, state.currentPos.y + 0.2, state.currentPos.z), tempQuaternion, new THREE.Vector3(state.currentScale, state.currentScale, state.currentScale));
                    if(nefeshTopInstanced) nefeshTopInstanced.setMatrixAt(i, tempMatrix);
                    tempQuaternion.setFromEuler(new THREE.Euler(Math.PI, -state.yRotation, 0));
                    tempMatrix.compose(new THREE.Vector3(state.currentPos.x, state.currentPos.y - 0.2, state.currentPos.z), tempQuaternion, new THREE.Vector3(state.currentScale, state.currentScale, state.currentScale));
                    if(nefeshBottomInstanced) nefeshBottomInstanced.setMatrixAt(i, tempMatrix);
                    if (nefeshWebcamInstanced && nefeshWebcamInstanced.visible) {
                        tempMatrix.compose(new THREE.Vector3(state.currentPos.x, state.currentPos.y + 0.8, state.currentPos.z), new THREE.Quaternion(), new THREE.Vector3(state.currentScale, state.currentScale, state.currentScale));
                        nefeshWebcamInstanced.setMatrixAt(i, tempMatrix);
                    }
                });
                if (nefeshTopInstanced) { nefeshTopInstanced.instanceMatrix.needsUpdate = true; nefeshTopInstanced.count = activeNefeshCount; }
                if (nefeshBottomInstanced) { nefeshBottomInstanced.instanceMatrix.needsUpdate = true; nefeshBottomInstanced.count = activeNefeshCount; }
                if (nefeshWebcamInstanced) { nefeshWebcamInstanced.instanceMatrix.needsUpdate = true; nefeshWebcamInstanced.count = activeNefeshCount; }
                updateFleetConduits(activeNefeshForLinks);

                if (gameState.bossManager.isActive) {
                    gameState.bossManager.update(deltaTime);
                } else {
                    const allPools = [klipahGatePool, jarPool, tohuShardPool, golemSentryPool, tomeKeeperPool, weaverPool, shattererPool, minelayerPool, minePool, torahScrollPool];
                    allPools.forEach(pool => pool.active.forEach(obstacle => processObstacle(obstacle, deltaTime, currentRoadSpeed)));
                }

                updateEnemyProjectiles(deltaTime);
                updatePlayerProjectiles(deltaTime);
                updateDynamicEffects(deltaTime);
                updateCelestialEchos(deltaTime);

                camera.position.lerp(cameraTargetPos, 0.04);
                camera.lookAt(cameraLookAtTarget);
                if (shakeIntensity > 0) {
                    camera.position.add(new THREE.Vector3().randomDirection().multiplyScalar(shakeIntensity));
                    shakeIntensity = Math.max(0, shakeIntensity - deltaTime * 4.0);
                }
                if (fovKick > 0) {
                    camera.fov = originalFOV + fovKick;
                    fovKick = Math.max(0, fovKick - deltaTime * 50);
                } else {
                    camera.fov = THREE.MathUtils.lerp(camera.fov, originalFOV, 0.1);
                }
                camera.updateProjectionMatrix();

                checkWaveCompletion();
                trySpawnNextWave();
                processNefeshDestruction();
                updateUIDisplays();
                renderer.render(scene, camera);
            } catch (error) {
                console.error("A critical error occurred in the animation loop:", error);
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                displayGlobalError("A critical error in the game loop forced a stop.");
                showMainMenu();
            }
        }
        
        function updateConstellationNetwork(deltaTime, scrollSpeed) {
            if (!world.constellationNetwork || !gameSettings.enableConstellations || !world.constellationNetwork.geometry || !world.constellationNetwork.geometry.attributes.position) {
                return;
            }
            const positions = world.constellationNetwork.geometry.attributes.position.array;
            const wrapZ = camera.position.z;
            const spawnZ = -1000;
            const wrapDistance = Math.abs(spawnZ - wrapZ);
            for (let i = 2; i < positions.length; i += 3) {
                positions[i] += scrollSpeed * deltaTime;
                if (positions[i] > wrapZ) {
                    positions[i] -= wrapDistance;
                }
            }
            world.constellationNetwork.geometry.attributes.position.needsUpdate = true;
        }

        function updateSpecialParticleNetwork() {
            if (!world.specialParticleNetwork || !gameSettings.enableParticleNetwork) return;
            const positions = world.specialParticleNetwork.geometry.attributes.position.array;
            let lineIndex = 0;
            const maxLines = positions.length / 6;
            const maxDistSq = 40*40;
            const activeParticles = [...specialParticlePool.active];

            if (activeParticles.length < 2) {
                world.specialParticleNetwork.geometry.setDrawRange(0, 0);
                return;
            }

            for (let i = 0; i < activeParticles.length; i++) {
                const p1 = activeParticles[i];
                if (lineIndex >= maxLines) break;
                for (let j = i + 1; j < activeParticles.length; j++) {
                    if (lineIndex >= maxLines) break;
                    const p2 = activeParticles[j];
                    if (p1.position.distanceToSquared(p2.position) < maxDistSq) {
                        positions[lineIndex * 6 + 0] = p1.position.x;
                        positions[lineIndex * 6 + 1] = p1.position.y;
                        positions[lineIndex * 6 + 2] = p1.position.z;
                        positions[lineIndex * 6 + 3] = p2.position.x;
                        positions[lineIndex * 6 + 4] = p2.position.y;
                        positions[lineIndex * 6 + 5] = p2.position.z;
                        lineIndex++;
                    }
                }
            }
            world.specialParticleNetwork.geometry.setDrawRange(0, lineIndex * 2);
            world.specialParticleNetwork.geometry.attributes.position.needsUpdate = true;
        }

        function updateFleetConduits(activeNefesh) {
            if (!fleetConduitNetwork || !fleetConduitNetwork.geometry) return;
            const positions = fleetConduitNetwork.geometry.attributes.position.array;
            let lineIndex = 0;
            const maxLines = positions.length / 6;
            if (!gameSettings.enableFleetConduits || activeNefesh.length < 2) {
                fleetConduitNetwork.geometry.setDrawRange(0, 0);
                return;
            }
            for (let i = 0; i < activeNefesh.length; i++) {
                const p1Data = activeNefesh[i];
                let neighbors = [];
                for (let j = 0; j < activeNefesh.length; j++) {
                    if (i === j) continue;
                    neighbors.push({ index: j, distSq: p1Data.pos.distanceToSquared(activeNefesh[j].pos) });
                }
                neighbors.sort((a,b) => a.distSq - b.distSq);
                for (let k = 0; k < gameSettings.fleetConduitCount && k < neighbors.length; k++) {
                    const neighborIndex = neighbors[k].index;
                    if (i < neighborIndex) {
                        if (lineIndex >= maxLines) break;
                        const p2Data = activeNefesh[neighborIndex];
                        const p1 = p1Data.pos;
                        const p2 = p2Data.pos;
                        positions[lineIndex * 6 + 0] = p1.x;
                        positions[lineIndex * 6 + 1] = p1.y;
                        positions[lineIndex * 6 + 2] = p1.z;
                        positions[lineIndex * 6 + 3] = p2.x;
                        positions[lineIndex * 6 + 4] = p2.y;
                        positions[lineIndex * 6 + 5] = p2.z;
                        lineIndex++;
                    }
                }
                if (lineIndex >= maxLines) break;
            }
            fleetConduitNetwork.geometry.setDrawRange(0, lineIndex * 2);
            fleetConduitNetwork.geometry.attributes.position.needsUpdate = true;
        }

        function processObstacle(obstacle, deltaTime, speed) {
            if (!obstacle || !obstacle.userData) return;
            obstacle.position.z += speed * deltaTime;
            let obsSizeX = 1, obsSizeZ = 1;
            switch(obstacle.userData.type) {
                case 'klipah_gate': obsSizeX = 3.0; obsSizeZ = 0.5; break;
                case 'jar': obsSizeX = 1.6; obsSizeZ = 1.6; break;
                case 'golem_sentry': obsSizeX = 1.5; obsSizeZ = 1.5; break;
                case 'tome_keeper': obsSizeX = 1.4; obsSizeZ = 1.4; break;
                case 'weaver': obsSizeX = 1.2; obsSizeZ = 1.2; break;
                case 'shatterer': obsSizeX = 1.6; obsSizeZ = 1.6; break;
                case 'minelayer': obsSizeX = 1.2; obsSizeZ = 1.8; break;
                case 'mine': obsSizeX = 0.8; obsSizeZ = 0.8; obstacle.position.z += (speed * 0.2) * deltaTime; break;
                case 'torah_scroll': obsSizeX = 3.5; obsSizeZ = 0.5; break;
            }
            if (obstacle.userData.collisionBox2D) {
                obstacle.userData.collisionBox2D.setFromCenterAndSize({ x: obstacle.position.x, y: obstacle.position.z }, { x: obsSizeX, y: obsSizeZ });
            }
            if (obstacle.position.z > camera.position.z + 10) {
                deactivateObstacle(obstacle);
                return;
            }
            if (obstacle.userData.isFriendly) {
                if (obstacle.userData.type === 'golem_sentry') {
                    obstacle.userData.lifeTimer -= deltaTime;
                    if (obstacle.userData.lifeTimer <= 0) { createParticleExplosion(obstacle.position, 50, 0x8B4513, 5); deactivateObstacle(obstacle); return; }
                    if (clock.elapsedTime - obstacle.userData.lastShotTime > 2.0) {
                        obstacle.userData.lastShotTime = clock.elapsedTime;
                        const proj = friendlyGolemProjectilePool.activate();
                        if (proj) { obstacle.userData.eye.getWorldPosition(proj.position); proj.userData.velocity = new THREE.Vector3(0, 0, -30); }
                    }
                }
            } else if (obstacle.userData.type === 'golem_sentry' && !obstacle.userData.isShielded && clock.elapsedTime - obstacle.userData.lastShotTime > 3.5 - (gameState.level * 0.1)) {
                obstacle.userData.lastShotTime = clock.elapsedTime;
                obstacle.userData.eye.material.color.setHex(0xffffff);
                setTimeout(() => { if (obstacle.userData.eye) obstacle.userData.eye.material.color.setHex(0xff0000) }, 200);
                let projPool = Math.random() < 0.33 && gameState.level > 5 ? golemHeavyProjectilePool : (Math.random() < 0.66 && gameState.level > 2 ? golemFastProjectilePool : golemProjectilePool);
                let proj = projPool.activate();
                if (proj) {
                    obstacle.userData.eye.getWorldPosition(proj.position);
                    proj.userData.type = projPool === golemHeavyProjectilePool ? 'heavy' : (projPool === golemFastProjectilePool ? 'fast' : 'normal');
                    proj.userData.velocity = new THREE.Vector3(0, 0, 25 + gameState.level);
                    if(proj.userData.type === 'heavy') proj.userData.damage = 5 + Math.floor(gameState.level / 4);
                }
            }
            if (obstacle.userData.type === 'weaver') {
                obstacle.position.x += obstacle.userData.moveDirection * obstacle.userData.moveSpeed * deltaTime;
                if (Math.abs(obstacle.position.x) > roadWidth / 2 - 0.5) { obstacle.userData.moveDirection *= -1; }
                if (!obstacle.userData.isShielded && clock.elapsedTime - obstacle.userData.lastShotTime > 1.0) {
                    obstacle.userData.lastShotTime = clock.elapsedTime;
                    const proj = weaverProjectilePool.activate();
                    if(proj) { proj.position.copy(obstacle.position); proj.userData.velocity = new THREE.Vector3(0, 0, 35); }
                }
            }
            if (obstacle.userData.type === 'minelayer' && clock.elapsedTime - obstacle.userData.lastMineTime > 4.0) {
                obstacle.userData.lastMineTime = clock.elapsedTime;
                const mine = minePool.activate();
                if(mine) { mine.position.set(obstacle.position.x, roadLevelY + 0.1, obstacle.position.z); }
            }
            if (obstacle.userData.isFriendly) return;
            const effectiveShield = gameState.player.hasShield || gameState.effects.globalShield > 0 || gameState.effects.invincibleTimer > 0;
            
            nefeshState.forEach((state, index) => {
                if (!state.active || destroyedNefeshIndices.has(index)) return;

                let collided = false;
                if (obstacle.userData.type === 'tohu_shard') {
                    // B"H FIX: Increased collision box size for spikes to make collisions more reliable.
                    const spikeHalfSize = 0.45;
                    for(const spikeGroup of obstacle.userData.body.children) {
                        spikeGroup.getWorldPosition(worldPosVec);
                        spikeGroup.userData.collisionBox2D.setFromCenterAndSize({x: worldPosVec.x, y: worldPosVec.z}, {x: spikeHalfSize, y: spikeHalfSize});
                        if (spikeGroup.userData.collisionBox2D.intersectsBox(state.collisionBox2D)) {
                            collided = true;
                            if(effectiveShield) { if (gameState.effects.invincibleTimer <= 0) gameState.player.hasShield = false; }
                            else { markNefeshForDestruction(index); triggerFlash('#ff00ff', 200); }
                            break; 
                        }
                    }
                } else {
                     if (obstacle.userData.collisionBox2D.intersectsBox(state.collisionBox2D)) {
                        collided = true;
                        if(effectiveShield) { if (gameState.effects.invincibleTimer <= 0) gameState.player.hasShield = false; }
                        else {
                            switch (obstacle.userData.type) {
                                case 'jar': if(!obstacle.userData.isShielded) { markNefeshForDestruction(index); triggerScreenShake(0.1); obstacle.userData.health--; if(obstacle.userData.health <= 0) { deactivateObstacle(obstacle); updateCombo(50, obstacle.position); shatterObject(obstacle.userData.body); } else { updateJarHealthVisuals(obstacle); } } break;
                                case 'klipah_gate': adjustNefeshCount(obstacle.userData.currentValue); if (!obstacle.userData.isPurified) triggerScreenShake(0.4); else createParticleExplosion(obstacle.position, 20, 0x00ff00, 10); deactivateObstacle(obstacle); break;
                                case 'mine': markNefeshForDestruction(index); triggerScreenShake(0.5); createParticleExplosion(obstacle.position, 60, 0xffa500, 20); deactivateObstacle(obstacle); break;
                                case 'torah_scroll': createParticleExplosion(obstacle.position, 80, 0xf5deb3, 15); break; // Non-damaging
                                default: if (!obstacle.userData.isShielded) { markNefeshForDestruction(index); triggerScreenShake(0.2); } break;
                            }
                        }
                    }
                }
            });
        }
        function deactivateObstacle(obstacle) {
            if (!obstacle || !obstacle.userData) return;
            if (gameState.wave.enemiesInWave.has(obstacle)) {
                gameState.wave.enemiesInWave.delete(obstacle);
            }
            const type = obstacle.userData.type;
            const poolMap = { klipah_gate: klipahGatePool, jar: jarPool, tohu_shard: tohuShardPool, golem_sentry: golemSentryPool, tome_keeper: tomeKeeperPool, weaver: weaverPool, shatterer: shattererPool, minelayer: minelayerPool, mine: minePool, torah_scroll: torahScrollPool, heavy: golemHeavyProjectilePool, fast: golemFastProjectilePool, normal: golemProjectilePool, redemption_orb: redemptionOrbPool };
            if(poolMap[type]) poolMap[type].deactivate(obstacle);
        }
        function updateEnemyProjectiles(deltaTime) {
            const allEnemyProjPools = [golemProjectilePool, golemFastProjectilePool, golemHeavyProjectilePool, weaverProjectilePool, shattererShardPool, friendlyGolemProjectilePool];
            allEnemyProjPools.forEach(pool => {
                pool.active.forEach(proj => {
                    if (proj.userData.velocity) {
                        proj.position.addScaledVector(proj.userData.velocity, deltaTime);
                    } else {
                        proj.position.z += 25 * deltaTime; // Fallback speed
                    }

                    if(proj.position.z > camera.position.z + 10 || proj.position.z < -150) { pool.deactivate(proj); return; }

                    const effectiveShield = gameState.player.hasShield || gameState.effects.globalShield > 0 || gameState.effects.invincibleTimer > 0;
                    if (pool === friendlyGolemProjectilePool) {
                        const allEnemies = [...klipahGatePool.active, ...jarPool.active, ...golemSentryPool.active.values()].filter(e => !e.userData.isFriendly);
                        for (const enemy of allEnemies) {
                            if (enemy.position.distanceTo(proj.position) < 1.5) {
                                processSparkCollision({ position: proj.position, damage: 5, pierceCounter: 0, isCrit: false, isEcho: false, active: true }, enemy);
                                pool.deactivate(proj); return;
                            }
                        }
                    } else {
                        nefeshState.forEach((state, index) => {
                            if(!state.active || destroyedNefeshIndices.has(index)) return;
                            if(checkInstancedCollision(state, proj)) {
                                if(effectiveShield) { if(gameState.effects.invincibleTimer <= 0) gameState.player.hasShield = false; pool.deactivate(proj); return; }
                                const color = proj.material.color.getHexString();
                                if(proj.userData.type === 'heavy') { adjustNefeshCount(-(proj.userData.damage || 5)); triggerFlash(`#${color}`, 400); triggerScreenShake(0.6); }
                                else { markNefeshForDestruction(index); triggerFlash(`#${color}`, 300); triggerScreenShake(0.3); }
                                createParticleExplosion(proj.position, 20, `#${color}`, 15);
                                pool.deactivate(proj);
                            }
                        });
                    }
                });
            });
        }
        function updatePlayerProjectiles(deltaTime) {
            const tempSparkMatrix = new THREE.Matrix4();
            const tempEchoSparkMatrix = new THREE.Matrix4();
            let activeSparkCount = 0;
            let activeEchoSparkCount = 0;
            const allObstacles = [...klipahGatePool.active, ...jarPool.active, ...golemSentryPool.active, ...tomeKeeperPool.active, ...weaverPool.active, ...shattererPool.active, ...minelayerPool.active, ...torahScrollPool.active];
            for (let i = 0; i < MAX_SPARKS; i++) {
                const spark = sparkState[i];
                if (!spark.active) {
                    if (spark.isEcho) { tempEchoSparkMatrix.makeScale(0, 0, 0); celestialEchoSparkInstancedMesh.setMatrixAt(i, tempEchoSparkMatrix); }
                    else { tempSparkMatrix.makeScale(0, 0, 0); sparkInstancedMesh.setMatrixAt(i, tempSparkMatrix); }
                    continue;
                }
                spark.position.addScaledVector(spark.velocity, deltaTime);
                if (spark.position.z < -150 || spark.position.z > 20 || Math.abs(spark.position.x) > roadWidth * 2) { spark.active = false; continue; }
                if (gameState.bossManager.isActive && gameState.bossManager.bossObject) {
                    const bossBox = new THREE.Box3().setFromObject(gameState.bossManager.bossObject);
                    if(bossBox.containsPoint(spark.position)) { gameState.bossManager.takeDamage(spark.damage); spark.active = false; }
                } else {
                    for(const obstacle of allObstacles) {
                        if (!spark.active || !obstacle.visible || obstacle.userData.isShielded || Math.abs(obstacle.position.z - spark.position.z) > 2 || obstacle.userData.isFriendly) continue;
                        collisionVec2.set(spark.position.x, spark.position.z);
                        if (obstacle.userData.collisionBox2D && obstacle.userData.collisionBox2D.containsPoint(collisionVec2)) {
                            processSparkCollision(spark, obstacle);
                        }
                    }
                }
                if (spark.active) {
                    if (spark.isEcho) { activeEchoSparkCount++; tempEchoSparkMatrix.makeTranslation(spark.position.x, spark.position.y, spark.position.z); celestialEchoSparkInstancedMesh.setMatrixAt(i, tempEchoSparkMatrix); }
                    else { activeSparkCount++; tempSparkMatrix.makeTranslation(spark.position.x, spark.position.y, spark.position.z); sparkInstancedMesh.setMatrixAt(i, tempSparkMatrix); }
                } else {
                    if (spark.isEcho) { tempEchoSparkMatrix.makeScale(0, 0, 0); celestialEchoSparkInstancedMesh.setMatrixAt(i, tempEchoSparkMatrix); }
                    else { tempSparkMatrix.makeScale(0, 0, 0); sparkInstancedMesh.setMatrixAt(i, tempSparkMatrix); }
                }
            }
            if(sparkInstancedMesh) { sparkInstancedMesh.instanceMatrix.needsUpdate = true; sparkInstancedMesh.count = activeSparkCount; }
            if(celestialEchoSparkInstancedMesh) { celestialEchoSparkInstancedMesh.instanceMatrix.needsUpdate = true; celestialEchoSparkInstancedMesh.count = activeEchoSparkCount; }
        }
        function processSparkCollision(spark, obstacle) {
            if (!obstacle || obstacle.userData.isFriendly) return;
            if (spark.pierceCounter <= 0) { spark.active = false; } else { spark.pierceCounter--; }
            const particleColor = spark.isCrit ? '#ffaa00' : (spark.isEcho ? '#ffd700' : '#ffffff');
            switch(obstacle.userData.type) {
                case 'klipah_gate':
                    if (obstacle.userData.isPurified) { obstacle.userData.currentValue++; createParticleExplosion(spark.position, 1, '#aaffaa', 2); }
                    else {
                        obstacle.userData.currentValue += spark.damage;
                        createParticleExplosion(spark.position, 3, '#888888', 5);
                        if (obstacle.userData.currentValue >= 0) {
                            obstacle.userData.isPurified = true;
                            obstacle.userData.currentValue = 0;
                            updateCombo(25, obstacle.position);
                            createParticleExplosion(obstacle.position, 40, 0x00ff00, 18);
                            const shockwave = new THREE.Mesh(new THREE.TorusGeometry(1, 0.1, 8, 32), new THREE.MeshBasicMaterial({color: 0x00ff00, transparent: true, opacity: 0.8}));
                            shockwave.position.copy(obstacle.position);
                            shockwave.rotation.x = Math.PI / 2;
                            scene.add(shockwave);
                            activeShockwaves.add({mesh: shockwave, life: 1.0});
                            triggerKlipahRedemption(obstacle.position);
                        }
                    }
                    updateKlipahGateVisuals(obstacle);
                    break;
                case 'torah_scroll':
                     // Torah scrolls are indestructible by normal means
                    createParticleExplosion(spark.position, 5, '#f5deb3', 5);
                    break;
                default:
                    if (typeof obstacle.userData.health !== 'number') break;
                    obstacle.userData.health -= spark.damage;
                    createParticleExplosion(spark.position, 5, particleColor, 8);
                    if (obstacle.userData.health <= 0) {
                        triggerScreenShake(0.3);
                        if (obstacle.userData.body) shatterObject(obstacle.userData.body);
                        createParticleExplosion(obstacle.position, 80, 0xffe4b5, 25);
                        updateCombo(75, obstacle.position);
                        const light = new THREE.PointLight(0xffaa55, 8, 30, 2);
                        light.position.copy(obstacle.position);
                        scene.add(light);
                        activeLights.add(light);
                        if(obstacle.userData.type === 'jar' && Math.random() < 0.15) {
                            showSurpriseNotifier("A Vessel of Light Shatters!", "#ffffff");
                            for (let i = 0; i < 8; i++) {
                                const angle = (i / 8) * Math.PI * 2;
                                const velocity = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle)).multiplyScalar(40);
                                fireSpark(obstacle.position, 1, true, false, velocity);
                            }
                        }
                        if(obstacle.userData.type === 'shatterer') {
                            for(let i = 0; i < 12; i++) {
                                const shard = shattererShardPool.activate();
                                if(shard) {
                                    shard.position.copy(obstacle.position);
                                    shard.userData.velocity = new THREE.Vector3().randomDirection().setY(0).normalize().multiplyScalar(20 + Math.random() * 10);
                                }
                            }
                        }
                        if(obstacle.userData.type === 'tome_keeper' && obstacle.userData.shieldedEnemy) {
                            obstacle.userData.shieldedEnemy.userData.isShielded = false;
                            if (obstacle.userData.shieldedEnemy.userData.shieldVisual) obstacle.userData.shieldedEnemy.userData.shieldVisual.visible = false;
                        }
                        deactivateObstacle(obstacle);
                    } else if (obstacle.userData.type === 'jar') {
                        updateJarHealthVisuals(obstacle);
                    }
                    break;
            }
        }
        function updateDynamicEffects(deltaTime) {
            for(const orb of shefaOrbPool.active) {
                orb.position.lerp(nefeshGroup.position, 0.08);
                orb.position.addScaledVector(orb.userData.velocity, deltaTime);
                orb.userData.velocity.lerp(new THREE.Vector3(0,0,0), 0.1);
                if(orb.position.distanceTo(nefeshGroup.position) < 1.5) {
                    addShefa( orb.userData.value );
                    createParticleExplosion(orb.position, 3, 0xffd700, 5);
                    shefaOrbPool.deactivate(orb);
                }
            }
            for(const orb of mitzvahOrbPool.active) {
                orb.position.lerp(nefeshGroup.position, 0.1);
                orb.position.addScaledVector(orb.userData.velocity, deltaTime);
                orb.userData.velocity.lerp(new THREE.Vector3(0,0,0), 0.15);
                if(orb.position.distanceTo(nefeshGroup.position) < 1.5) {
                    gameState.mitzvot += orb.userData.value;
                    createParticleExplosion(orb.position, 2, 0xffffff, 4);
                    mitzvahOrbPool.deactivate(orb);
                }
            }
            for(const orb of redemptionOrbPool.active) {
                orb.position.z -= 25 * deltaTime;
                const allEnemies = [...klipahGatePool.active, ...jarPool.active, ...golemSentryPool.active, ...tomeKeeperPool.active, ...weaverPool.active, ...shattererPool.active, ...minelayerPool.active].filter(e => e && !e.userData.isFriendly);
                for(const enemy of allEnemies) {
                    if (orb.position.distanceTo(enemy.position) < 2.0) {
                        createParticleExplosion(orb.position, 80, 0xaaffaa, 20);
                        if(enemy.userData.health) enemy.userData.health = 0;
                        processSparkCollision({position: orb.position, damage: 9999, pierceCounter: 0, active: false, isCrit: false, isEcho: false}, enemy);
                        redemptionOrbPool.deactivate(orb);
                        break;
                    }
                }
                if (orb.position.z < -150) { redemptionOrbPool.deactivate(orb); }
            }
            const updateDynamicParticle = p => {
                p.position.addScaledVector(p.userData.velocity, deltaTime);
                p.userData.velocity.y -= 25 * deltaTime;
                p.userData.life -= deltaTime;
                if(p.material && p.material.opacity) p.material.opacity = p.userData.life;
                if (p.userData.type === 'shard') {
                    p.rotation.x += p.userData.rotationSpeed.x * deltaTime;
                    p.rotation.y += p.userData.rotationSpeed.y * deltaTime;
                }
                if (p.userData.life <= 0) {
                    if(p.userData.type === 'particle') particlePool.deactivate(p);
                    else { scene.remove(p); dynamicShards.delete(p); }
                }
            };
            particlePool.active.forEach(updateDynamicParticle);
            dynamicShards.forEach(updateDynamicParticle);
            activeLights.forEach(light => {
                light.intensity -= 25 * deltaTime;
                if(light.intensity <= 0) { scene.remove(light); activeLights.delete(light); }
            });
            tomeKeeperPool.active.forEach(keeper => {
                const shielded = keeper.userData.shieldedEnemy;
                if (shielded && shielded.visible) {
                    const beam = keeper.userData.shieldBeam;
                    beam.visible = true;
                    const positions = beam.geometry.attributes.position.array;
                    const keeperPos = keeper.getWorldPosition(new THREE.Vector3());
                    const shieldedPos = shielded.getWorldPosition(new THREE.Vector3());
                    positions[0] = keeperPos.x; positions[1] = keeperPos.y; positions[2] = keeperPos.z;
                    positions[3] = shieldedPos.x; positions[4] = shieldedPos.y; positions[5] = shieldedPos.z;
                    beam.geometry.attributes.position.needsUpdate = true;
                } else {
                    keeper.userData.shieldBeam.visible = false;
                    if(shielded) shielded.userData.isShielded = false;
                    keeper.userData.shieldedEnemy = null;
                }
            });
            activeShockwaves.forEach(sw => {
                sw.life -= 2 * deltaTime;
                sw.mesh.scale.multiplyScalar(1 + (sw.isPrayerWave ? 2 : 5) * deltaTime);
                sw.mesh.material.opacity = sw.life;
                if(sw.isPrayerWave) {
                    const waveRadius = sw.mesh.geometry.parameters.radius * sw.mesh.scale.x;
                    [...klipahGatePool.active, ...jarPool.active, ...golemSentryPool.active, ...tomeKeeperPool.active, ...weaverPool.active, ...shattererPool.active, ...minelayerPool.active].filter(e => e && !e.userData.isFriendly).forEach(enemy => {
                        if(enemy.position.distanceTo(sw.mesh.position) < waveRadius) {
                            if(enemy.userData.type === 'klipah_gate' && !enemy.userData.isPurified) {
                                enemy.userData.currentValue = 0; enemy.userData.isPurified = true; updateKlipahGateVisuals(enemy);
                            } else if(enemy.userData.health) {
                                enemy.userData.health -= 30 * deltaTime;
                                if(enemy.userData.health <= 0) { deactivateObstacle(enemy); if(enemy.userData.body) shatterObject(enemy.userData.body); }
                            }
                        }
                    });
                }
                if(sw.life <= 0) { scene.remove(sw.mesh); activeShockwaves.delete(sw); }
            });
             if (activeLightning) {
                activeLightning.userData.life -= deltaTime;
                activeLightning.material.opacity = activeLightning.userData.life * 2;
                if (activeLightning.userData.life <= 0) {
                    scene.remove(activeLightning);
                    activeLightning = null;
                }
            }
        }
        function triggerCelestialEcho() {
            nefeshState.forEach((state, i) => {
                if(state.active) {
                    const worldPos = new THREE.Vector3().copy(state.currentPos).add(nefeshGroup.position);
                    activeEchos.push({ position: worldPos, life: 1.5, maxLife: 1.5, hasFired: false, });
                }
            });
        }
        function updateCelestialEchos(deltaTime) {
            for (let i = activeEchos.length - 1; i >= 0; i--) {
                const echo = activeEchos[i];
                echo.life -= deltaTime;
                if (!echo.hasFired && echo.life < echo.maxLife * 0.75) {
                    fireSpark(echo.position, 2, true, true);
                    echo.hasFired = true;
                }
                if (echo.life <= 0) { activeEchos.splice(i, 1); }
            }
        }
        function checkWaveCompletion() {
            if (gameState.wave.isTracking && gameState.wave.enemiesInWave.size === 0) {
                if (gameState.wave.hitsTakenThisWave === 0) {
                    ui.perfectWaveNotifier.textContent = "PERFECT WAVE!";
                    ui.perfectWaveNotifier.classList.add('show');
                    setTimeout(() => ui.perfectWaveNotifier.classList.remove('show'), 2000);
                    addShefa(50);
                    gameState.mitzvot += 100;
                    if(Math.random() < 0.25 && playerStats.upgrades.commandmentsAuthority?.level < 10) {
                        playerStats.tabletFragments++;
                        savePlayerStats();
                        showSurpriseNotifier(`Tablet Fragment Found! (${playerStats.tabletFragments}/10)`, "#00f0ff");
                    }
                    createParticleExplosion(nefeshGroup.position, 100, 0x00f0ff, 25);
                    triggerCelestialEcho();
                    createLightning();
                }
                gameState.wave.isTracking = false;
            }
        }
        function processNefeshDestruction() {
            if (destroyedNefeshIndices.size > 0) {
                destroyedNefeshIndices.forEach(index => neutralizeNefesh(index));
                const currentNefesh = nefeshState.filter(s => s.active).length;
                if (currentNefesh !== gameState.nefesh) {
                    if (currentNefesh < gameState.nefesh) shatterElement(ui.nefeshDisplay);
                    gameState.nefesh = currentNefesh;
                }
                destroyedNefeshIndices.clear();
                if (currentNefesh <= 0 && gameState.current === 'playing') {
                    endGame();
                }
                updateCameraTarget();
            }
        }
        function updateUIDisplays() {
            if (!gameState || gameState.current !== 'playing') return;
            ui.mitzvotDisplay.textContent = `MITZVOT: ${Math.floor(gameState.mitzvot)}`;
            ui.nefeshDisplay.textContent = `NEFESH: ${gameState.nefesh}`;
            ui.shefaBar.style.width = `${Math.min(100, (gameState.shefa / gameState.shefaToAscend) * 100)}%`;
        }

        (async () => {
            try {
                await initDB();
            } catch (dbError) {
                console.warn("Could not initialize IndexedDB. Settings will not be saved or loaded.", dbError);
            }
            try {
                loadPlayerStats();
                setupInstancedNefesh();
                await applySettings();
                showMainMenu();
            } catch(setupError) {
                console.error("Critical error during initial game setup:", setupError);
                document.body.innerHTML = `<div style="color: white; text-align: center; padding-top: 50px; font-size: 2em; font-family: Arial, sans-serif;">A critical error occurred during setup. Please refresh the page or check the console for details.</div>`;
                displayGlobalError("Fatal error during startup. The application cannot continue.");
            }
        })();
    </script>
</body>
