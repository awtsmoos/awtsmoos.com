        // --- OBSTACLE SPAWNING ---
        const lanePositions = [-3.0, 0, 3.0];
        const obstacleRemovalZ = camera.position.z + 5;
        
        function spawnObstacle(type, laneIndex, zPos) {
            const position = new THREE.Vector3(lanePositions[laneIndex], roadLevelY, zPos);
            const levelFactor = 1 + (gameState.level / 10);
            let obstacle;

            switch(type) {
                case 'klipah_gate': {
                    const gate = klipahGatePool.activate(); if(!gate) return null;
                    Object.assign(gate.userData, { currentValue: - (5 + Math.floor(Math.random() * 15 * levelFactor)), isPurified: false });
                    updateKlipahGateVisuals(gate);
                    obstacle = gate;
                    break;
                }
                case 'jar': {
                    const jar = jarPool.activate(); if(!jar) return null;
                    const health = Math.floor(30 + Math.random() * 40 * levelFactor);
                    Object.assign(jar.userData, { health, maxHealth: health });
                    updateJarHealthVisuals(jar);
                    obstacle = jar;
                    break;
                }
                case 'tohu_shard': {
                    const shard = tohuShardPool.activate(); if(!shard) return null;
                    obstacle = shard;
                    break;
                }
                case 'golem_sentry': {
                    const golem = golemSentryPool.activate(); if(!golem) return null;
                    golem.userData.health = Math.floor(120 * levelFactor);
                    golem.userData.lastShotTime = 0;
                    obstacle = golem;
                    break;
                }
                case 'void_orb': {
                    const orb = voidOrbPool.activate(); if(!orb) return null;
                    orb.userData.health = Math.floor(50 * levelFactor);
                    obstacle = orb;
                    break;
                }
            }

            if(obstacle) {
                obstacle.position.copy(position);
                if(obstacle.userData.body) obstacle.position.y += (obstacle.userData.type === 'jar' ? 0.75 : (obstacle.userData.type === 'void_orb' ? 1.5 : 2.0));
                obstacle.userData.drift = (Math.random() - 0.5) * 0.05;
                obstacle.userData.rotSpeed = (Math.random() - 0.5) * 0.2;
            }
            return obstacle;
        }
        
        // --- NEW PROCEDURAL WAVE SPAWNER ---
        const enemyTypes = ['jar', 'klipah_gate', 'golem_sentry', 'tohu_shard', 'void_orb'];
        function generateWave() {
            const zStart = -120 - Math.random() * 40;
            const difficulty = Math.min(10, 1 + gameState.level * 0.5);
            
            const patterns = [
                () => { // Wall
                    const type = Math.random() < 0.7 ? 'jar' : 'klipah_gate';
                    spawnObstacle(type, 0, zStart); spawnObstacle(type, 1, zStart); spawnObstacle(type, 2, zStart);
                },
                () => { // Gauntlet
                    const lane = Math.floor(Math.random() * 3);
                    for (let i = 0; i < 3; i++) spawnObstacle('tohu_shard', lane, zStart - i * 15);
                },
                () => { // Pincer
                    spawnObstacle('golem_sentry', 0, zStart); spawnObstacle('golem_sentry', 2, zStart - 10);
                },
                () => { // Weaving Snake
                    const startLane = Math.random() < 0.5 ? 0 : 2;
                    spawnObstacle('klipah_gate', startLane, zStart); spawnObstacle('klipah_gate', 1, zStart - 15);
                    spawnObstacle('klipah_gate', 2 - startLane, zStart - 30);
                },
                () => { // Ambush
                    const lane = Math.floor(Math.random() * 3);
                    spawnObstacle('jar', lane, zStart); spawnObstacle('golem_sentry', lane, zStart - 15);
                },
                () => { // Gravitational Trap
                    spawnObstacle('void_orb', 1, zStart - 20);
                    spawnObstacle('jar', 0, zStart); spawnObstacle('jar', 2, zStart);
                    spawnObstacle('klipah_gate', 1, zStart - 40);
                }
            ];
            
            // Choose a random pattern for this wave
            const chosenPattern = patterns[Math.floor(Math.random() * patterns.length)];
            chosenPattern();

            gameState.spawnTimer = Math.max(2.0, 8.0 - difficulty * 0.5);
        }

        function spawnSpecialParticle() {
            if (specialParticleTextures.length === 0) return;
            const p = specialParticlePool.activate();
            if (!p) return;
            
            const spawnRadius = gameSettings.particleSpawnRadius;
            const spawnZ = -150;
            const x = (Math.random() - 0.5) * spawnRadius * 2;
            const y = (Math.random() - 0.5) * spawnRadius;
            p.position.set(Math.abs(x) < 20 && Math.abs(y) < 20 ? (x > 0 ? 20 : -20) : x, y, spawnZ);
            
            const texture = specialParticleTextures[Math.floor(Math.random() * specialParticleTextures.length)];
            p.material.map = texture;
            p.material.opacity = 0.1 + Math.random() * 0.5; p.material.needsUpdate = true;
            
            const scale = gameSettings.minParticleSize + Math.random() * (gameSettings.maxParticleSize - gameSettings.minParticleSize);
            p.scale.set(scale, scale, scale);
            p.userData.life = 5.0;

            const baseSpeed = 40 + (gameState.level * 3);
            p.userData.velocity = new THREE.Vector3(0, 0, baseSpeed + Math.random() * 20);

            // Particle Web Logic
            const connections = gameSettings.particleWebConnections;
            if (connections > 0) {
                const neighbors = [...specialParticlePool.active]
                    .filter(other => other !== p && other.position.z > p.position.z)
                    .sort((a, b) => a.position.distanceToSquared(p.position) - b.position.distanceToSquared(p.position))
                    .slice(0, connections);

                neighbors.forEach(neighbor => {
                    const positions = [p.position.x, p.position.y, p.position.z, neighbor.position.x, neighbor.position.y, neighbor.position.z];
                    const geometry = new THREE.BufferGeometry();
                    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                    const material = new THREE.LineBasicMaterial({
                        color: new THREE.Color(gameSettings.glowColor || defaultSettings.glowColor),
                        transparent: true,
                        opacity: 0.1,
                        blending: THREE.AdditiveBlending
                    });
                    const line = new THREE.Line(geometry, material);
                    line.userData = { life: 2.0, p1: p, p2: neighbor };
                    activeParticleWebs.add(line);
                    scene.add(line);
                });
            }
        }

        // --- GAME STATE MANAGEMENT ---
        async function initializeGame() {
            try {
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                
                [sparkPool, klipahGatePool, jarPool, tohuShardPool, golemSentryPool, golemProjectilePool, particlePool, shefaOrbPool, specialParticlePool, voidOrbPool].forEach(pool => pool?.deactivateAll());
                dynamicShards.forEach(s => scene.remove(s)); dynamicShards.clear();
                activeLights.forEach(l => scene.remove(l)); activeLights.clear();
                activeParticleWebs.forEach(w => scene.remove(w)); activeParticleWebs.clear();
                activeTendrils.forEach(t => scene.remove(t)); activeTendrils.clear();

                magenDavidTroops.forEach(t => { if(t) minyanGroup.remove(t); });
                magenDavidTroops.length = 0;

                if(gameSettings.webcamMode !== 'off') await webcamManager.start();
                else webcamManager.stop();
                
                gameState = {
                    current: 'playing', mitzvot: 0, nefesh: 0, shefa: 0, shefaToAscend: 100, level: 1,
                    player: { fireRate: 350, projectileDamage: 1, hasRegen: false, regenTimer: 0, hasPierce: false },
                    combo: { count: 0, timer: 0 },
                    customPrayers: gameSettings.customPrayers || null,
                    color: { current: new THREE.Color(initialClearColor), target: new THREE.Color(levelColors[0] || initialClearColor) },
                    spawnTimer: 1.0,
                };
                
                scene.fog = new THREE.Fog(gameState.color.current, 50, 250);
                renderer.setClearColor(gameState.color.current);

                acquiredUpgrades.clear();
                if(!road) createWorld();
                
                for(let i=0; i < MAX_NEFESH; i++) { magenDavidTroops.push(null); }

                if (gameState.customPrayers && gameState.customPrayers.phrases.length > 0) {
                    if(ui.prayerDisplayContainer) ui.prayerDisplayContainer.classList.add('visible');
                    updatePrayerDisplay();
                    if(ui.ascensionNotifier) ui.ascensionNotifier.classList.add('side-mode');
                    if(ui.comboNotifier) ui.comboNotifier.classList.add('side-mode');
                } else {
                    if(ui.prayerDisplayContainer) ui.prayerDisplayContainer.classList.remove('visible');
                    if(ui.ascensionNotifier) ui.ascensionNotifier.classList.remove('side-mode');
                    if(ui.comboNotifier) ui.comboNotifier.classList.remove('side-mode');
                }

                adjustNefeshCount(10);
                targetCubeX = 0; minyanGroup.position.x = 0;

                if(ui.mainMenu) ui.mainMenu.classList.remove('visible');
                if(ui.gameOver) ui.gameOver.classList.remove('visible');
                if(ui.customMenu) ui.customMenu.classList.remove('visible');
                if(ui.settingsOverlay) ui.settingsOverlay.classList.remove('visible');
                
                updateUIDisplays();
                clock.start();
                animationFrameId = requestAnimationFrame(animate);
            } catch (error) {
                console.error("An error occurred during game initialization:", error);
                displayGlobalError("Game Init Failed. Check console.");
                showMainMenu();
            }
        }

        function addShefa(amount) {
            gameState.shefa += amount;
            if (gameState.shefa >= gameState.shefaToAscend) {
                gameState.shefa -= gameState.shefaToAscend; gameState.level++;
                gameState.shefaToAscend *= 1.5; 
                grantRandomEmanation();
            }
        }

        function endGame() {
            gameState.current = 'gameOver';
            if(animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = undefined;
            if(ui.finalMitzvotDisplay) ui.finalMitzvotDisplay.textContent = `You gathered ${Math.floor(gameState.mitzvot)} Mitzvot.`;
            if(ui.gameOver) ui.gameOver.classList.add('visible');
            if(ui.prayerDisplayContainer) ui.prayerDisplayContainer.classList.remove('visible');
            webcamManager.stop();
        }

        function showMainMenu() {
            gameState.current = 'mainMenu';
            if (animationFrameId) cancelAnimationFrame(animationFrameId);
            animationFrameId = undefined;
            if(ui.gameOver) ui.gameOver.classList.remove('visible');
            if(ui.customMenu) ui.customMenu.classList.remove('visible');
            if(ui.settingsOverlay) ui.settingsOverlay.classList.remove('visible');
            if(ui.mainMenu) ui.mainMenu.classList.add('visible');
            if(ui.prayerDisplayContainer) ui.prayerDisplayContainer.classList.remove('visible');
            if(ui.prayerListOverlay) ui.prayerListOverlay.classList.remove('visible');
            webcamManager.stop();
        }
        
        // --- INPUT HANDLING ---
        let isDragging = false, lastTouchX = 0, targetCubeX = 0;
        const handleMove = (clientX) => {
            if (!isDragging || gameState.current !== 'playing') return;
            const deltaX = clientX - lastTouchX;
            const moveScale = 0.03;
            targetCubeX += deltaX * moveScale;
            lastTouchX = clientX;
        };

        const handleInteractionStart = (e, clientX) => {
            if (gameState.current !== 'playing') return;
            const targetElement = e.target;
            if (targetElement.closest('.prayer-nav-button, #prayerDropdownBtn, #prayerListOverlay')) {
                return; 
            }
            isDragging = true;
            lastTouchX = clientX;
            if (e.type === 'touchstart') e.preventDefault();
        };

        document.addEventListener('mousedown', e => handleInteractionStart(e, e.clientX));
        document.addEventListener('mousemove', e => handleMove(e.clientX));
        document.addEventListener('mouseup', () => isDragging = false);
        document.addEventListener('touchstart', e => handleInteractionStart(e, e.touches[0].clientX), { passive: false });
        document.addEventListener('touchmove', e => handleMove(e.touches[0].clientX), { passive: false });
        document.addEventListener('touchend', () => isDragging = false);
        
        // --- UI EVENT LISTENERS ---
        if(ui.tryAgainButton) ui.tryAgainButton.addEventListener('click', () => { shatterElement(ui.tryAgainButton); initializeGame(); });
        if(ui.btnBegin) ui.btnBegin.addEventListener('click', () => { shatterElement(ui.btnBegin); gameSettings.customPrayers = null; initializeGame(); });
        if(ui.btnCustom) ui.btnCustom.addEventListener('click', () => { if(ui.mainMenu) ui.mainMenu.classList.remove('visible'); if(ui.customMenu) ui.customMenu.classList.add('visible'); });
        if(ui.btnGoCustom) ui.btnGoCustom.addEventListener('click', () => {
            shatterElement(ui.btnGoCustom);
            const prayers = ui.customPrayerTextarea.value.split('\n\n').map(p => p.trim()).filter(p => p.length > 0);
            gameSettings.customPrayers = (prayers.length > 0) ? { phrases: prayers, currentIndex: 0 } : null;
            initializeGame();
        });
        if(ui.btnBackToMain) ui.btnBackToMain.addEventListener('click', showMainMenu);
        if(ui.btnSettings) ui.btnSettings.addEventListener('click', () => { if(ui.mainMenu) ui.mainMenu.classList.remove('visible'); if(ui.settingsOverlay) ui.settingsOverlay.classList.add('visible'); });
        if(ui.btnBackToMainFromSettings) ui.btnBackToMainFromSettings.addEventListener('click', showMainMenu);
        if(ui.backToMenuFromGameBtn) ui.backToMenuFromGameBtn.addEventListener('click', showMainMenu);

        function updatePrayerDisplay() {
            const prayers = gameState.customPrayers;
            if(prayers && prayers.phrases.length > 0 && ui.prayerText) {
                ui.prayerText.textContent = prayers.phrases[prayers.currentIndex];
                applyCaptionStyle();
            }
        }
        if(ui.prevPrayerBtn) ui.prevPrayerBtn.addEventListener('click', () => {
            const prayers = gameState.customPrayers;
            if (prayers && prayers.phrases.length > 0) {
                prayers.currentIndex = (prayers.currentIndex - 1 + prayers.phrases.length) % prayers.phrases.length;
                updatePrayerDisplay();
                shatterElement(ui.prayerText);
            }
        });
        if(ui.nextPrayerBtn) ui.nextPrayerBtn.addEventListener('click', () => {
            const prayers = gameState.customPrayers;
            if (prayers && prayers.phrases.length > 0) {
                prayers.currentIndex = (prayers.currentIndex + 1) % prayers.phrases.length;
                updatePrayerDisplay();
                shatterElement(ui.prayerText);
            }
        });
        
        function populatePrayerList() {
            if (!ui.prayerList) return;
            ui.prayerList.innerHTML = '';
            const prayers = gameState.customPrayers;
            if (!prayers || prayers.phrases.length === 0) {
                const item = document.createElement('div');
                item.className = 'prayer-list-item';
                item.textContent = "No custom prayers active.";
                item.style.fontStyle = 'italic';
                ui.prayerList.appendChild(item);
                return;
            }

            prayers.phrases.forEach((phrase, index) => {
                const item = document.createElement('div');
                item.className = 'prayer-list-item';
                item.textContent = phrase;
                if (index === prayers.currentIndex) item.classList.add('active');
                item.addEventListener('click', () => {
                    prayers.currentIndex = index;
                    updatePrayerDisplay();
                    populatePrayerList();
                });
                ui.prayerList.appendChild(item);
            });
            const activeItem = ui.prayerList.querySelector('.active');
            if (activeItem) activeItem.scrollIntoView({ block: 'center', behavior: 'smooth' });
        }
        if(ui.prayerDropdownBtn) ui.prayerDropdownBtn.addEventListener('click', () => {
            populatePrayerList();
            if(ui.prayerListOverlay) ui.prayerListOverlay.classList.add('visible');
        });
        if(ui.closePrayerListBtn) ui.closePrayerListBtn.addEventListener('click', () => { if(ui.prayerListOverlay) ui.prayerListOverlay.classList.remove('visible'); });
        if(ui.prayerSettingsToggleBtn) ui.prayerSettingsToggleBtn.addEventListener('click', () => {
            const panel = ui.prayerSettingsPanel;
            if (panel) panel.style.display = panel.style.display === 'none' ? 'flex' : 'none';
        });

        const setupSettingListener = (element, settingName, parseFunc, valueSpan = null, callback = null) => {
            if(!element) return;
            element.addEventListener('input', e => { if(valueSpan) valueSpan.textContent = e.target.value; });
            element.addEventListener('change', async e => {
                try {
                    const value = parseFunc(e.target.value, e.target.checked);
                    await saveSetting(settingName, value);
                    await applySettings();
                    if(callback) callback(value);
                } catch(err) {
                    console.error(`Failed to save setting ${settingName}:`, err);
                }
            });
        };
        
        setupSettingListener(ui.maxNefeshSlider, 'maxNefesh', parseInt, ui.maxNefeshValue);
        if(ui.particleCharsTextarea) ui.particleCharsTextarea.addEventListener('change', async e => { try { await saveSetting('particleChars', e.target.value); await applySettings(); } catch(err) { console.error('Failed to save particle chars:', err); } });
        setupSettingListener(ui.shakeIntensitySlider, 'shakeIntensity', parseFloat, ui.shakeIntensityValue);
        setupSettingListener(ui.flashIntensitySlider, 'flashIntensity', parseFloat, ui.flashIntensityValue);
        setupSettingListener(ui.effectsIntensitySlider, 'effectsIntensity', parseFloat, ui.effectsIntensityValue);
        setupSettingListener(ui.shatterCountSlider, 'shatterCount', parseInt, ui.shatterCountValue);
        setupSettingListener(ui.shatterSpeedSlider, 'shatterSpeed', parseInt, ui.shatterSpeedValue);
        setupSettingListener(ui.minParticleSizeSlider, 'minParticleSize', parseFloat, ui.minParticleSizeValue);
        setupSettingListener(ui.maxParticleSizeSlider, 'maxParticleSize', parseFloat, ui.maxParticleSizeValue);
        setupSettingListener(ui.particleSpawnRadiusSlider, 'particleSpawnRadius', parseInt, ui.particleSpawnRadiusValue);
        setupSettingListener(ui.webcamModeSelect, 'webcamMode', val => val);
        setupSettingListener(ui.glowColorPicker, 'glowColor', val => val);
        setupSettingListener(ui.shefaColorPicker, 'shefaColor', val => val);
        setupSettingListener(ui.klipotColorPicker, 'klipotColor', val => val);
        setupSettingListener(ui.particleWebSlider, 'particleWebConnections', parseInt, ui.particleWebValue);
        setupSettingListener(ui.energyTendrilsSlider, 'energyTendrils', parseInt, ui.energyTendrilsValue);

        const handleFontChange = async (selectElement, inputElement) => {
            if (!selectElement || !inputElement) return;
            let valueToSave = selectElement.value;
            if (valueToSave === 'custom') {
                inputElement.style.display = 'block';
                valueToSave = inputElement.value;
            } else {
                inputElement.style.display = 'none';
            }
            await saveSetting('captionFont', valueToSave);
            await applySettings();
        };

        if(ui.captionFontSelect) ui.captionFontSelect.addEventListener('change', () => handleFontChange(ui.captionFontSelect, ui.customFontInput));
        if(ui.customFontInput) ui.customFontInput.addEventListener('change', () => handleFontChange(ui.captionFontSelect, ui.customFontInput));
        if(ui.inGameCaptionFontSelect) ui.inGameCaptionFontSelect.addEventListener('change', () => handleFontChange(ui.inGameCaptionFontSelect, ui.inGameCustomFontInput));
        if(ui.inGameCustomFontInput) ui.inGameCustomFontInput.addEventListener('change', () => handleFontChange(ui.inGameCaptionFontSelect, ui.inGameCustomFontInput));

        setupSettingListener(ui.captionColorPicker, 'captionColor', val => val, null, () => {
             if(ui.inGameCaptionColorPicker && ui.captionColorPicker) ui.inGameCaptionColorPicker.value = ui.captionColorPicker.value;
        });
        setupSettingListener(ui.inGameCaptionColorPicker, 'captionColor', val => val, null, () => {
            if(ui.captionColorPicker && ui.inGameCaptionColorPicker) ui.captionColorPicker.value = ui.inGameCaptionColorPicker.value;
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        const collisionVec2 = new THREE.Vector2();
        function check2DCollision(obj, troop) {
            obj.getWorldPosition(worldPosVec);
            collisionVec2.set(worldPosVec.x, worldPosVec.z);
            return troop.userData.collisionBox2D.containsPoint(collisionVec2);
        }

        // --- THE MAIN GAME LOOP ---
        function animate(currentTime) {
            animationFrameId = requestAnimationFrame(animate);
            try {
                if(gameState.current !== 'playing' || !gameState) return;
                
                const deltaTime = Math.min(0.05, clock.getDelta());
                const currentRoadSpeed = roadBaseSpeed + gameState.level * 1.5;

                // --- WORLD & VISUALS UPDATE ---
                if (!gameState.color.current.equals(gameState.color.target)) {
                    gameState.color.current.lerp(gameState.color.target, 0.5 * deltaTime);
                    renderer.setClearColor(gameState.color.current);
                    if(scene.fog) scene.fog.color.copy(gameState.color.current);
                    hemisphereLight.groundColor.lerp(gameState.color.current.clone().multiplyScalar(0.5), 0.5 * deltaTime);
                }
                
                if(road && road.material.map) {
                    road.material.map.offset.y -= (currentRoadSpeed / 100) * deltaTime;
                }

                const starSpeed = 20 + gameState.level * 2;
                if(starField1) starField1.position.z += starSpeed * deltaTime; 
                if(starField2) starField2.position.z += starSpeed * deltaTime;
                if(starField1 && starField1.position.z > 250) starField1.position.z -= 500; 
                if(starField2 && starField2.position.z > 250) starField2.position.z -= 500;
                
                if (Math.random() < 0.95) spawnSpecialParticle();

                // Update particle web
                for(const line of activeParticleWebs) {
                    line.userData.life -= deltaTime;
                    line.material.opacity = Math.max(0, line.userData.life / 2.0) * 0.1;
                    if(line.userData.life <= 0) {
                        scene.remove(line);
                        line.geometry.dispose();
                        activeParticleWebs.delete(line);
                    } else if (line.userData.p1?.position && line.userData.p2?.position){
                        const positions = line.geometry.attributes.position.array;
                        positions[0] = line.userData.p1.position.x;
                        positions[1] = line.userData.p1.position.y;
                        positions[2] = line.userData.p1.position.z;
                        positions[3] = line.userData.p2.position.x;
                        positions[4] = line.userData.p2.position.y;
                        positions[5] = line.userData.p2.position.z;
                        line.geometry.attributes.position.needsUpdate = true;
                    }
                }
                
                // Update energy tendrils
                if (activeTendrils.size < gameSettings.energyTendrils && Math.random() < 0.05) {
                    createEnergyTendril();
                }
                for(const tendril of activeTendrils) {
                    tendril.userData.life -= deltaTime;
                    tendril.material.opacity = Math.sin(Math.PI * (tendril.userData.life / 10)) * 0.3;
                    tendril.material.color.setHSL(tendril.userData.baseHue, 0.8, 0.3 + Math.sin(currentTime * 5 + tendril.userData.baseHue) * 0.2);

                    if (tendril.userData.life <= 0) {
                        scene.remove(tendril);
                        tendril.geometry.dispose();
                        activeTendrils.delete(tendril);
                    }
                }

                for (const p of specialParticlePool.active) {
                    p.position.addScaledVector(p.userData.velocity, deltaTime);
                    p.userData.life -= deltaTime;
                    p.material.opacity = Math.sin(Math.max(0, p.userData.life) * 0.5 * Math.PI) * 0.7;
                    if (p.userData.life <= 0 || p.position.z > camera.position.z) {
                        specialParticlePool.deactivate(p);
                    }
                }

                // --- PLAYER MOVEMENT & FORMATION ---
                for (const orb of voidOrbPool.active) {
                    const distanceX = minyanGroup.position.x - orb.position.x;
                    const pullStrength = 30 / (distanceX * distanceX + 10); // Inverse square with dampening
                    targetCubeX -= Math.sign(distanceX) * pullStrength * deltaTime;

                    // Visual feedback: pull nearby particles towards the orb
                     for (const p of [...specialParticlePool.active, ...particlePool.active]) {
                        if (p.position.distanceTo(orb.position) < 30) {
                             const direction = orb.position.clone().sub(p.position).normalize();
                             p.userData.velocity.addScaledVector(direction, 25 * deltaTime);
                        }
                     }
                }

                let minX = 0, maxX = 0;
                magenDavidTroops.forEach(troop => {
                    if (troop) {
                        if(troop.userData.targetPos.x < minX) minX = troop.userData.targetPos.x;
                        if(troop.userData.targetPos.x > maxX) maxX = troop.userData.targetPos.x;
                    }
                });
                const halfFormationWidth = (maxX - minX) / 2;
                const maxMove = (roadWidth / 2) - halfFormationWidth;
                targetCubeX = Math.max(-maxMove, Math.min(maxMove, targetCubeX));
                minyanGroup.position.x = THREE.MathUtils.lerp(minyanGroup.position.x, targetCubeX, 0.1);
                minyanGroup.position.z = THREE.MathUtils.lerp(minyanGroup.position.z, 0, 0.2);
                cameraTargetPos.x = minyanGroup.position.x / 4;
                
                // --- GAME LOGIC (Combo, Regen, etc.) ---
                if(gameState.combo.timer > 0) gameState.combo.timer -= deltaTime;
                else if (gameState.combo.count > 0) { gameState.combo.count = 0; if(ui.comboNotifier) ui.comboNotifier.classList.remove('show'); }

                if(gameState.player.hasRegen) {
                    gameState.player.regenTimer += deltaTime;
                    if(gameState.player.regenTimer > 15) {
                        gameState.player.regenTimer = 0;
                        if(gameState.nefesh > 0 && gameState.nefesh < MAX_NEFESH) adjustNefeshCount(1);
                    }
                }
                
                // --- NEFESH & PROJECTILE UPDATE ---
                const troopHalfSize = 0.4;
                magenDavidTroops.forEach((troop, index) => {
                    if(!troop) return;
                    troop.position.lerp(troop.userData.targetPos, 0.15);

                    const webcamPlane = troop.getObjectByName('webcam_plane');
                    if (webcamPlane) {
                        webcamPlane.lookAt(camera.position);
                        const mode = gameSettings.webcamMode;
                        webcamPlane.visible = (mode === 'all' || mode === 'all_central' || (mode === 'leader' && index === 0));
                    }
                    if (centralWebcamPlane) {
                        const mode = gameSettings.webcamMode;
                        centralWebcamPlane.visible = (mode === 'central' || mode === 'all_central');
                    }

                    troop.getWorldPosition(worldPosVec);
                    troop.userData.collisionBox2D.min.set(worldPosVec.x - troopHalfSize, worldPosVec.z - troopHalfSize);
                    troop.userData.collisionBox2D.max.set(worldPosVec.x + troopHalfSize, worldPosVec.z + troopHalfSize);

                    if(troop.userData.targetScale) {
                        troop.scale.lerp(new THREE.Vector3(troop.userData.targetScale, troop.userData.targetScale, troop.userData.targetScale), 0.2);
                        if(Math.abs(troop.scale.x - troop.userData.targetScale) < 0.01) troop.userData.targetScale = null;
                    }
                    if(troop.children[0]) troop.children[0].rotation.y += deltaTime * 2; 
                    if(troop.children[1]) troop.children[1].rotation.y -= deltaTime * 2;
                    if (currentTime - troop.userData.lastShotTime > gameState.player.fireRate) {
                        troop.getWorldPosition(worldPosVec); worldPosVec.z -= 0.5; worldPosVec.y = 0.4;
                        const spark = sparkPool.activate();
                        if(spark) { spark.position.copy(worldPosVec); spark.userData.damage = gameState.player.projectileDamage; spark.userData.pierced = 0; }
                        troop.userData.lastShotTime = currentTime;
                    }
                });

                // --- OBSTACLE & ENEMY UPDATE ---
                const troopsToRemove = new Set();
                const allObstacles = [...klipahGatePool.active, ...jarPool.active, ...tohuShardPool.active, ...golemSentryPool.active, ...voidOrbPool.active];
                for (const obstacle of allObstacles) {
                    obstacle.position.z += currentRoadSpeed * deltaTime;
                    obstacle.position.x += obstacle.userData.drift * deltaTime * currentRoadSpeed;
                    if(Math.abs(obstacle.position.x) > roadWidth/2) obstacle.userData.drift *= -1;
                    if(obstacle.userData.body) obstacle.userData.body.rotation.y += obstacle.userData.rotSpeed * deltaTime;

                    if (obstacle.position.z > obstacleRemovalZ) {
                        if (obstacle.userData.type === 'klipah_gate') klipahGatePool.deactivate(obstacle);
                        else if (obstacle.userData.type === 'jar') jarPool.deactivate(obstacle);
                        else if (obstacle.userData.type === 'tohu_shard') tohuShardPool.deactivate(obstacle);
                        else if (obstacle.userData.type === 'golem_sentry') golemSentryPool.deactivate(obstacle);
                        else if (obstacle.userData.type === 'void_orb') voidOrbPool.deactivate(obstacle);
                        continue;
                    }
                    
                    if (obstacle.userData.type === 'golem_sentry' && obstacle.userData.eye && currentTime - obstacle.userData.lastShotTime > 3500 - (gameState.level * 100)) {
                        obstacle.userData.lastShotTime = currentTime;
                        const eyeBloom = obstacle.userData.eye.children[0];
                        if (eyeBloom?.material) {
                            eyeBloom.material.color.setHex(0xffffff);
                            setTimeout(() => eyeBloom.material.color.set(gameSettings.klipotColor || defaultSettings.klipotColor), 200);
                        }
                        const proj = golemProjectilePool.activate();
                        if (proj) obstacle.userData.eye.getWorldPosition(proj.position);
                    }
                    
                    if (obstacle.userData.type === 'tohu_shard' && obstacle.userData.body?.children) {
                        const spikeHalfSize = 0.3;
                        obstacle.userData.body.children.forEach(spikeGroup => {
                            spikeGroup.getWorldPosition(worldPosVec);
                            spikeGroup.userData.collisionBox2D.setFromCenterAndSize({x: worldPosVec.x, y: worldPosVec.z}, {x: spikeHalfSize, y: spikeHalfSize});
                            for(const troop of magenDavidTroops) {
                                if (!troop || troopsToRemove.has(troop)) continue;
                                if (spikeGroup.userData.collisionBox2D.intersectsBox(troop.userData.collisionBox2D)) {
                                    troopsToRemove.add(troop);
                                    triggerFlash('#ff00ff', 200);
                                    break; 
                                }
                            }
                        });
                    } else {
                        const obsSize = obstacle.userData.type === 'jar' ? 1.5 : (obstacle.userData.type === 'void_orb' ? 2.4 : 1.5);
                        obstacle.userData.collisionBox2D.setFromCenterAndSize({x: obstacle.position.x, y: obstacle.position.z}, {x: obsSize, y: obsSize});
                        magenDavidTroops.forEach((troop) => {
                            if (!troop || troopsToRemove.has(troop)) return;
                            if (obstacle.userData.collisionBox2D.intersectsBox(troop.userData.collisionBox2D)) {
                                switch (obstacle.userData.type) {
                                    case 'jar':
                                        troopsToRemove.add(troop); triggerScreenShake(0.1);
                                        obstacle.userData.health--;
                                        if(obstacle.userData.health <= 0) {
                                            jarPool.deactivate(obstacle); updateCombo(50, obstacle.position);
                                            shatterObject(obstacle.userData.body);
                                        } else { updateJarHealthVisuals(obstacle); }
                                        break;
                                    case 'klipah_gate':
                                        if(obstacle.userData.currentValue > 0 && ui.mitzvotDisplay) {
                                            gameState.mitzvot += obstacle.userData.currentValue;
                                            ui.mitzvotDisplay.style.transform = "scale(1.2)"; setTimeout(() => { if (ui.mitzvotDisplay) ui.mitzvotDisplay.style.transform = "scale(1.0)";}, 100);
                                        }
                                        adjustNefeshCount(obstacle.userData.currentValue);
                                        if (!obstacle.userData.isPurified) triggerScreenShake(0.4);
                                        else createParticleExplosion(obstacle.position, 20, 0x00ff00, 10);
                                        klipahGatePool.deactivate(obstacle);
                                        break;
                                    case 'golem_sentry':
                                        troopsToRemove.add(troop);
                                        triggerScreenShake(0.2);
                                        break;
                                    case 'void_orb':
                                        break;
                                }
                            }
                        });
                    }
                }

                // --- ENEMY PROJECTILE UPDATE ---
                for(const proj of golemProjectilePool.active) {
                    proj.position.z += 25 * deltaTime;
                    if(proj.position.z > obstacleRemovalZ) {
                        golemProjectilePool.deactivate(proj);
                        continue;
                    }
                    for(const troop of magenDavidTroops) {
                        if(!troop || troopsToRemove.has(troop)) continue;
                        if(check2DCollision(proj, troop)) {
                            troopsToRemove.add(troop);
                            createParticleExplosion(proj.position, 20, gameSettings.klipotColor, 15);
                            triggerFlash(gameSettings.klipotColor, 300); triggerFovKick(10); triggerScreenShake(0.3);
                            golemProjectilePool.deactivate(proj);
                            break; 
                        }
                    };
                }

                if(troopsToRemove.size > 0) {
                    shatterElement(ui.nefeshDisplay);
                    troopsToRemove.forEach(troop => destroyNefesh(troop));
                    gameState.nefesh = magenDavidTroops.filter(t => t !== null).length;
                    positionNefesh();
                    if (gameState.nefesh === 0 && gameState.current === 'playing') endGame();
                }

                // --- PLAYER PROJECTILE COLLISION ---
                for (const spark of sparkPool.active) {
                    spark.position.z -= 60 * deltaTime;
                    if (spark.position.z < -100) { sparkPool.deactivate(spark); continue; }
                    for (const obstacle of allObstacles) {
                        if (obstacle.visible && obstacle.userData.collisionBox2D.containsPoint({x: spark.position.x, y: spark.position.z})) {
                            let deactivateSpark = true;
                            switch(obstacle.userData.type) {
                                case 'klipah_gate':
                                    obstacle.userData.currentValue += spark.userData.damage;
                                    createParticleExplosion(spark.position, 3, obstacle.userData.isPurified ? gameSettings.shefaColor : '#888888', 5);
                                    if (!obstacle.userData.isPurified && obstacle.userData.currentValue >= 0) {
                                        obstacle.userData.isPurified = true; updateCombo(25, obstacle.position);
                                        createParticleExplosion(obstacle.position, 40, 0x00ff00, 18);
                                    }
                                    updateKlipahGateVisuals(obstacle);
                                    break;
                                case 'jar': case 'golem_sentry': case 'void_orb':
                                    obstacle.userData.health -= spark.userData.damage;
                                    createParticleExplosion(spark.position, 5, '#ffffff', 8);
                                    if (gameState.player.hasPierce && spark.userData.pierced < 1) { spark.userData.pierced++; deactivateSpark = false; }
                                    if (obstacle.userData.health <= 0) {
                                        triggerScreenShake(0.3); shatterObject(obstacle.userData.body);
                                        createParticleExplosion(obstacle.position, 80, 0xffe4b5, 25);
                                        updateCombo(75, obstacle.position);
                                        const light = new THREE.PointLight(0xffaa55, 5, 30, 2);
                                        light.position.copy(obstacle.position); scene.add(light); activeLights.add(light);
                                        if(obstacle.userData.type === 'jar') jarPool.deactivate(obstacle); 
                                        else if(obstacle.userData.type === 'golem_sentry') golemSentryPool.deactivate(obstacle);
                                        else if(obstacle.userData.type === 'void_orb') voidOrbPool.deactivate(obstacle);
                                    } else if (obstacle.userData.type === 'jar') { updateJarHealthVisuals(obstacle); }
                                    break;
                            }
                            if (deactivateSpark) { sparkPool.deactivate(spark); break; }
                        }
                    }
                }

                // --- PARTICLE & EFFECTS UPDATE ---
                for(const orb of shefaOrbPool.active) {
                    orb.position.lerp(minyanGroup.position, 0.08); orb.position.addScaledVector(orb.userData.velocity, deltaTime);
                    orb.userData.velocity.lerp(new THREE.Vector3(0,0,0), 0.1);
                    if(orb.position.distanceTo(minyanGroup.position) < 1.5) { addShefa(orb.userData.value); createParticleExplosion(orb.position, 3, gameSettings.shefaColor, 5); shefaOrbPool.deactivate(orb); }
                }
                [...particlePool.active, ...dynamicShards].forEach(p => {
                    p.position.addScaledVector(p.userData.velocity, deltaTime); p.userData.velocity.y -= 25 * deltaTime; p.userData.life -= deltaTime;
                    if(p.material && p.material.opacity) p.material.opacity = p.userData.life;
                    if (p.userData.type === 'shard') { p.rotation.x += p.userData.rotationSpeed.x * deltaTime; p.rotation.y += p.userData.rotationSpeed.y * deltaTime; }
                    if (p.userData.life <= 0) { 
                        if(p.userData.type === 'particle') {
                            particlePool.deactivate(p);
                        } else { 
                            if(p.material) p.material.dispose(); // Clean up cloned material
                            scene.remove(p); 
                            dynamicShards.delete(p); 
                        } 
                    }
                });

                activeLights.forEach(light => { light.intensity -= 15 * deltaTime; if(light.intensity <= 0) { scene.remove(light); activeLights.delete(light); } });

                // --- CAMERA & RENDER ---
                camera.position.lerp(cameraTargetPos, 0.1);
                if (shakeIntensity > 0) {
                    camera.position.add(new THREE.Vector3().randomDirection().multiplyScalar(shakeIntensity));
                    shakeIntensity = Math.max(0, shakeIntensity - deltaTime * 4.0);
                }
                if (fovKick > 0) {
                    camera.fov = originalFOV + fovKick;
                    fovKick = Math.max(0, fovKick - deltaTime * 50);
                } else { camera.fov = THREE.MathUtils.lerp(camera.fov, originalFOV, 0.1); }
                camera.updateProjectionMatrix();
                
                gameState.spawnTimer -= deltaTime;
                if(gameState.spawnTimer <= 0) generateWave();
                
                updateUIDisplays();
                renderer.render(scene, camera);
            } catch (error) {
                console.error("A critical error occurred in the animation loop:", error);
                displayGlobalError("Loop Error. Game stopped.");
                if (animationFrameId) cancelAnimationFrame(animationFrameId);
                endGame();
            }
        }
        
        function updateUIDisplays() {
            if (!gameState || gameState.current !== 'playing') return;
            if (ui.mitzvotDisplay) ui.mitzvotDisplay.textContent = `MITZVOT: ${Math.floor(gameState.mitzvot)}`;
            if (ui.nefeshDisplay) ui.nefeshDisplay.textContent = `NEFESH: ${gameState.nefesh}`;
            const shefaPercentage = Math.min(100, (gameState.shefa / gameState.shefaToAscend) * 100);
            if (ui.shefaBar) ui.shefaBar.style.width = `${shefaPercentage}%`;
        }
        
        // --- INITIALIZATION ---
        (async () => {
            try {
                await initDB();
                populateFontSelects();
                await applySettings();
                showMainMenu();
            } catch(error) {
                console.error("Critical error during initial setup:", error);
                document.body.innerHTML = `<div style="color: white; text-align: center; padding-top: 50px; font-size: 2em; font-family: Arial, sans-serif;">A critical error occurred during setup. Please refresh the page or check the console.</div>`;
                displayGlobalError("Fatal error during startup. App cannot continue.");
            }
        })();

    </script>
</body>
</html>
