ב"ה
B"H

Merkava: The Celestial Journey v4.1
Developer: Gemini
Date: 2025-08-20

This file is a complete, self-contained application.
This version is a major feature update based on a detailed development report, focusing on the new Celestial Constellation network.

*   **New Feature 1: Celestial Constellation Network:**
    *   A new system now connects the background starfield particles.
    *   Built for performance using a single, dynamic `LineSegments` object.
    *   Stars find their nearest neighbors upon creation to form natural-looking clusters.
    *   The entire network flows with the starfield, creating a dynamic background.
    *   Fully configurable in Settings: Enable/Disable, Connections Per Star, and Max Connection Distance.

*   **New Feature 2: Fleet Energy Conduits:**
    *   The original "particle network" idea is now applied specifically to the player's fleet.
    *   Uses a pool of `TubeGeometry` to draw energy lines between active Nefesh units, creating a distinct visual for the fleet.

*   **New Feature 3: "Weaver" Enemy & "Celestial Winds" Hazard:**
    *   The new Weaver enemy and the Celestial Winds environmental event have been fully implemented as described in the development report.

*   **New Surprise Events: "Celestial Echo" & "Vessel of Light":**
    *   These new reward events for "Perfect Waves" and "Jar" destruction have been added to the game.

*   **Enhancement: Reorganized & Expanded Settings:**
    *   The Settings menu is now clearly organized with sections.
    *   New controls for both the Constellation Network and the Fleet Conduits have been added.

*   **Bug Fixes from All Previous Versions Retained.**

-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merkava: The Celestial Journey</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');
        :root {
            --glow-color: #00ddff;
            --shefa-color: #ffd700;
            --klipot-color: #ff2d2d;
            --mitzvot-color: #ffffff;
            --nefesh-color: #c0c0c0;
            --outline-color: #000000;
        }
        body { margin: 0; overflow: hidden; font-family: 'Orbitron', 'Arial', sans-serif; color: white; background-color: #050008; }
        canvas { display: block; }

        #flashOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: white; z-index: 1001; pointer-events: none;
            opacity: 0;
        }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; background-color: rgba(0, 0, 10, 0.85);
            backdrop-filter: blur(8px); opacity: 0; visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            overflow-y: auto;
            pointer-events: none;
        }
        .overlay.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        .ui-text { text-shadow: 0 0 8px currentColor, 0 0 15px currentColor, 0 0 2px black; }
        #mitzvotDisplay, #nefeshDisplay { transition: transform 0.1s ease-out; }

        #mitzvotDisplay { position: absolute; top: 10px; left: 10px; font-size: 1.3em; background-color: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 5px; }
        #nefeshDisplay { position: absolute; top: 10px; right: 10px; font-size: 1.3em; background-color: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 5px; }
        #bhText { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 1.5em; color: var(--glow-color); z-index: 999; }

        #shefaContainer { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 50%; max-width: 400px; height: 15px; background-color: rgba(0,0,0,0.5); border: 2px solid var(--shefa-color); border-radius: 10px; z-index: 999; overflow: hidden; }
        #shefaBar { width: 0%; height: 100%; background: var(--shefa-color); box-shadow: 0 0 10px var(--shefa-color), 0 0 5px var(--shefa-color) inset; transition: width 0.3s ease-out; }

        /* --- B"H: REWORKED NOTIFIER STYLES --- */
        #ascensionNotifier, #comboNotifier, #perfectWaveNotifier, #surpriseNotifier {
            position: absolute;
            left: 20%; /* Moved to the side */
            transform: translate(-50%, -50%) scale(0.5);
            pointer-events: none;
            z-index: 1002;
            opacity: 0;
            transition: transform 0.7s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.7s ease, top 0.6s ease;
            text-transform: uppercase;
            text-align: center;
        }
        #ascensionNotifier { top: 30%; font-size: 1.7em; color: #d8a8ff; text-shadow: 0 0 8px #d8a8ff; }
        #comboNotifier { top: 40%; font-size: 1.5em; color: var(--shefa-color); text-shadow: 0 0 6px var(--shefa-color); }
        #perfectWaveNotifier { top: 50%; font-size: 1.9em; color: #00f0ff; text-shadow: 0 0 8px #00f0ff, 0 0 15px #00f0ff; }
        #surpriseNotifier { top: 60%; font-size: 1.8em; color: #aaffaa; text-shadow: 0 0 8px #aaffaa; }

        #ascensionNotifier.show, #comboNotifier.show, #perfectWaveNotifier.show, #surpriseNotifier.show {
            transform: translate(-50%, -50%) scale(0.85); /* Smaller final scale for less intrusion */
            opacity: 1;
        }
        /* End of reworked notifier styles */

        .game-title { font-size: 4em; margin-bottom: 20px; text-align: center; color: var(--glow-color); text-transform: uppercase; }
        .game-subtitle { font-size: 1.5em; color: var(--mitzvot-color); margin-bottom: 40px; text-align: center; }

        .menu-button-group { display: flex; flex-direction: column; gap: 20px; width: 80%; max-width: 400px; padding: 20px 0; }
        .menu-button, .select-menu { padding: 15px; font-size: 1.8em; background: linear-gradient(145deg, #0077ff, #0033aa); color: white; border: 2px solid var(--glow-color); border-radius: 8px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(0, 100, 255, 0.3), inset 0 0 5px rgba(255,255,255,0.3); text-transform: uppercase; font-family: 'Orbitron', 'Arial', sans-serif; }
        .menu-button:hover, .select-menu:hover { background: linear-gradient(145deg, #0088ff, #0044bb); transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 25px rgba(0, 120, 255, 0.5), inset 0 0 8px rgba(255,255,255,0.4); }
        .menu-button:active, .select-menu:active { transform: translateY(1px) scale(1.02); box-shadow: 0 2px 10px rgba(0, 120, 255, 0.4), inset 0 0 8px rgba(255,255,255,0.4); }

        #customPrayerTextarea {
            width: 100%; height: 200px; font-size: 1em; color: white; background-color: rgba(0,0,0,0.7);
            border: 2px solid var(--glow-color); border-radius: 8px; padding: 10px;
            font-family: 'Arial', sans-serif;
        }

        #prayerDisplayContainer {
            position: absolute; top: 55px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 800px;
            background-color: rgba(0,0,0,0.5);
            border-radius: 10px; padding: 10px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 998;
            opacity: 0; visibility: hidden; transition: opacity 0.5s, visibility 0.5s;
            pointer-events: none;
        }
        #prayerDisplayContainer.visible { opacity: 1; visibility: visible; pointer-events: auto; }

        #prayerTextContainer { position: relative; flex-grow: 1; display: flex; justify-content: center; align-items: center; }
        #prayerDropdownBtn {
            position: absolute;
            top: -15px;
            font-size: 1.5em;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            opacity: 0.3;
            transition: opacity 0.2s;
            z-index: 1004;
        }
        #prayerDropdownBtn:hover { opacity: 1; }

        #prayerText {
            flex-grow: 1; text-align: center; font-size: 1.2em; color: white;
            text-shadow: 2px 2px 4px #000000;
            white-space: normal;
            word-wrap: break-word;
            padding: 10px 0;
            min-height: 50px;
        }
        .prayer-nav-button {
            background: none; border: 2px solid white; color: white; font-size: 2em;
            cursor: pointer; padding: 0 15px; border-radius: 5px;
            transition: background-color 0.2s, transform 0.1s;
            user-select: none;
        }
        .prayer-nav-button:hover { background-color: rgba(255,255,255,0.2); }
        .prayer-nav-button:active { transform: scale(0.95); }

        .setting-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            margin-bottom: 20px;
        }
         .setting-item.checkbox {
            flex-direction: row;
            align-items: center;
        }
        .setting-item.checkbox label { margin-bottom: 0; margin-left: 10px; }
        .setting-item.checkbox input { width: auto; }

        /* B"H: New Setting Styles */
        .setting-item h3 {
             width: 100%; text-align: center; color: var(--shefa-color);
             margin-top: 25px; margin-bottom: 15px; border-bottom: 1px solid var(--shefa-color); padding-bottom: 8px;
             text-transform: uppercase; letter-spacing: 1px;
        }

        .setting-item label {
            font-size: 1.2em;
            margin-bottom: 8px;
            color: var(--glow-color);
        }
        .setting-item input[type="text"],
        .setting-item textarea,
        .setting-item input[type="color"],
        .setting-item select {
            width: 100%;
            font-size: 1em;
            color: white;
            background-color: rgba(0,0,0,0.7);
            border: 2px solid var(--glow-color);
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        .setting-item select {
            -moz-appearance: none;
            -webkit-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2300DDFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-13%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2013l128%20127.9c3.6%203.6%207.8%205.4%2013%205.4s9.4-1.8%2013-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-13%200-5-1.9-9.4-5.4-13z%22/%3E%3C/svg%3E');
            background-repeat: no-repeat;
            background-position: right 1em top 50%;
            background-size: .65em auto;
            padding-right: 2.5em; /* Make space for the arrow */
        }
         .setting-item select option {
            background-color: #050008;
            color: white;
            padding: 10px;
        }

        .setting-item textarea {
            height: 100px;
            resize: vertical;
        }
        .setting-item input[type="range"] {
            width: 100%;
        }

        #prayerListOverlay { z-index: 1003; }
        .prayer-list-modal {
            width: 90%;
            max-width: 700px;
            background: rgba(10, 0, 20, 0.95);
            border: 2px solid var(--glow-color);
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .scrollable-list {
            max-height: 60vh;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 221, 255, 0.3);
            border-radius: 5px;
            padding: 5px;
        }
        .prayer-list-item {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 1.1em;
        }
        .prayer-list-item:hover { background-color: rgba(0, 100, 255, 0.3); }
        .prayer-list-item.active { background-color: var(--shefa-color); color: #000; font-weight: bold; }
        .prayer-list-controls { display: flex; flex-direction: column; gap: 10px; }
        .prayer-list-controls button {
             padding: 10px; font-size: 1.2em; background: linear-gradient(145deg, #333, #111); color: white; border: 1px solid var(--glow-color); border-radius: 5px; cursor: pointer;
        }
        #prayerSettingsPanel {
            display: none;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            border: 1px dashed var(--glow-color);
            border-radius: 5px;
        }
         #prayerSettingsPanel label { font-size: 1em; color: var(--glow-color); }

        #webcamFeed {
            display: none; /* B"H: Webcam feed is not displayed directly, but used as a texture */
        }
        #globalErrorNotifier {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(200, 0, 0, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            z-index: 9999;
            font-family: 'Arial', sans-serif;
            font-size: 1.2em;
            box-shadow: 0 0 15px black;
            display: none;
            text-align: center;
        }

        #upgradeShopOverlay {
            padding: 20px;
            box-sizing: border-box;
        }
        #totalMitzvotDisplay {
            font-size: 1.8em;
            color: var(--mitzvot-color);
            margin-bottom: 20px;
            background: rgba(0,0,0,0.5);
            padding: 10px 20px;
            border-radius: 10px;
            border: 1px solid var(--mitzvot-color);
        }
        .upgrade-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            width: 95%;
            max-width: 1200px;
            max-height: 70vh;
            overflow-y: auto;
            padding: 15px;
        }
        .upgrade-card {
            background: rgba(10, 20, 40, 0.8);
            border: 2px solid var(--glow-color);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .upgrade-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px var(--glow-color);
        }
        .upgrade-card h3 {
            font-size: 1.5em;
            color: var(--shefa-color);
            margin: 0;
            text-align: center;
        }
        .upgrade-card p {
            font-family: 'Arial', sans-serif;
            font-size: 1em;
            margin: 0;
            flex-grow: 1;
        }
        .upgrade-card .level-display {
            font-size: 1.1em;
            text-align: center;
            color: var(--glow-color);
        }
        .upgrade-button {
            padding: 10px;
            font-size: 1.2em;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            color: white;
            background: linear-gradient(145deg, #2a9d8f, #264653);
            border: 1px solid #77e6d9;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .upgrade-button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px #77e6d9;
        }
        .upgrade-button.disabled {
            background: linear-gradient(145deg, #555, #222);
            color: #888;
            border-color: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .upgrade-button.maxed {
            background: linear-gradient(145deg, #ffd700, #b8860b);
            color: black;
            border-color: #fff;
            cursor: default;
        }

    </style>
</head>
<body>
    <video id="webcamFeed" autoplay playsinline muted></video>
    <div id="globalErrorNotifier"></div>

    <div id="bhText" class="ui-text">ב"ה</div>
    <div id="flashOverlay"></div>
    <div id="ascensionNotifier"></div>
    <div id="comboNotifier"></div>
    <div id="perfectWaveNotifier"></div>
    <div id="surpriseNotifier"></div>

    <div id="prayerDisplayContainer">
        <button id="prevPrayerBtn" class="prayer-nav-button">&lt;</button>
        <div id="prayerTextContainer">
            <button id="prayerDropdownBtn">📜</button>
            <div id="prayerText"></div>
        </div>
        <button id="nextPrayerBtn" class="prayer-nav-button">&gt;</button>
    </div>

    <div id="statsContainer">
        <div id="mitzvotDisplay" class="ui-text">MITZVOT: 0</div>
        <div id="nefeshDisplay" class="ui-text">NEFESH: 0</div>
    </div>
    <div id="shefaContainer"><div id="shefaBar"></div></div>

    <div id="gameOverOverlay" class="overlay"><div class="menu-button-group">
        <div class="game-title ui-text" style="color: var(--klipot-color);">THE MERKAVA HAS FALLEN</div>
        <div id="finalMitzvotDisplay" class="game-subtitle">You gathered 0 Mitzvot.</div>
        <button id="tryAgainButton" class="menu-button">ATTEMPT THE JOURNEY AGAIN</button>
        <button id="btnBackToMainFromGameOver" class="menu-button" style="background: linear-gradient(145deg, #555, #222);">BACK TO MAIN MENU</button>
    </div></div>

    <div id="customMenuOverlay" class="overlay"><div class="menu-button-group">
        <div class="game-title ui-text">CUSTOM JOURNEY</div>
        <div class="game-subtitle" style="margin-bottom: 20px;">Paste prayers below, separated by two new lines.</div>
        <textarea id="customPrayerTextarea" placeholder="Prayer 1...&#10;&#10;Prayer 2..."></textarea>
        <button id="btnGoCustom" class="menu-button">BEGIN</button>
        <button id="btnBackToMain" class="menu-button" style="background: linear-gradient(145deg, #555, #222);">BACK</button>
    </div></div>

    <div id="mainMenuOverlay" class="overlay visible"><div class="menu-button-group">
        <div class="game-title ui-text">MERKAVA</div>
        <div class="game-subtitle">The Celestial Journey</div>
        <button id="btnBegin" class="menu-button">BEGIN THE JOURNEY</button>
        <button id="btnUpgradeShop" class="menu-button" style="background: linear-gradient(145deg, #2a9d8f, #264653);">OTZAR HA'SEFIROT</button>
        <button id="btnCustom" class="menu-button">CUSTOM JOURNEY</button>
        <button id="btnSettings" class="menu-button">SETTINGS</button>
    </div></div>

    <!-- B"H: REORGANIZED SETTINGS MENU -->
    <div id="settingsOverlay" class="overlay"><div class="menu-button-group" style="max-width: 600px; width: 90%;">
        <div class="game-title ui-text">SETTINGS</div>

        <h3>Gameplay</h3>
        <div class="setting-item">
            <label for="maxNefeshSlider">Max Nefesh: <span id="maxNefeshValue">100</span></label>
            <input type="range" id="maxNefeshSlider" min="10" max="248" step="1">
        </div>

        <h3>Visual Effects</h3>
        <div class="setting-item">
            <label for="shakeIntensitySlider">Screen Shake: <span id="shakeIntensityValue">1</span></label>
            <input type="range" id="shakeIntensitySlider" min="0" max="5" step="0.1">
        </div>
        <div class="setting-item">
            <label for="flashIntensitySlider">Flash Intensity: <span id="flashIntensityValue">1</span></label>
            <input type="range" id="flashIntensitySlider" min="0" max="1" step="0.05">
        </div>
        <div class="setting-item">
            <label for="effectsIntensitySlider">Special Effect Intensity (FOV, Particles): <span id="effectsIntensityValue">1</span></label>
            <input type="range" id="effectsIntensitySlider" min="0" max="2" step="0.1">
        </div>

        <h3>Graphics & Particles</h3>
        <div class="setting-item">
            <label for="starfieldDensitySlider">Starfield Density: <span id="starfieldDensityValue">2000</span></label>
            <input type="range" id="starfieldDensitySlider" min="100" max="10000" step="100">
        </div>
        <div class="setting-item">
            <label for="particleCharsTextarea">Special Particle Characters (no commas needed):</label>
            <textarea id="particleCharsTextarea"></textarea>
        </div>
        <div class="setting-item">
            <label for="minParticleSizeSlider">Min Particle Size: <span id="minParticleSizeValue">2</span></label>
            <input type="range" id="minParticleSizeSlider" min="0.5" max="10" step="0.1">
        </div>
        <div class="setting-item">
            <label for="maxParticleSizeSlider">Max Particle Size: <span id="maxParticleSizeValue">5</span></label>
            <input type="range" id="maxParticleSizeSlider" min="1" max="20" step="0.1">
        </div>
         <div class="setting-item">
            <label for="shatterCountSlider">Shatter Particle Count: <span id="shatterCountValue">20</span></label>
            <input type="range" id="shatterCountSlider" min="1" max="100" step="1">
        </div>
        <div class="setting-item">
            <label for="shatterSpeedSlider">Shatter Particle Speed: <span id="shatterSpeedValue">25</span></label>
            <input type="range" id="shatterSpeedSlider" min="1" max="50" step="1">
        </div>

        <h3>Network Systems</h3>
        <div class="setting-item checkbox">
            <input type="checkbox" id="enableFleetConduitsCheckbox">
            <label for="enableFleetConduitsCheckbox">Enable Fleet Energy Conduits</label>
        </div>
        <div class="setting-item">
            <label for="fleetConduitCountSlider">Conduits per Nefesh: <span id="fleetConduitCountValue">2</span></label>
            <input type="range" id="fleetConduitCountSlider" min="1" max="5" step="1">
        </div>
        <div class="setting-item checkbox">
            <input type="checkbox" id="enableConstellationsCheckbox">
            <label for="enableConstellationsCheckbox">Enable Celestial Constellations</label>
        </div>
        <div class="setting-item">
            <label for="constellationConnectionsSlider">Connections per Star: <span id="constellationConnectionsValue">2</span></label>
            <input type="range" id="constellationConnectionsSlider" min="1" max="5" step="1">
        </div>
        <div class="setting-item">
            <label for="constellationDistanceSlider">Max Connection Distance: <span id="constellationDistanceValue">30</span></label>
            <input type="range" id="constellationDistanceSlider" min="5" max="100" step="1">
        </div>

            <label for="webcamModeSelect">Webcam Display Mode:</label>

                <option value="both">Central + Individual</option>

            <label for="signpostSideSelect">Sign Post Side:</label>

                <option value="left">Left</option>
                <option value="right">Right</option>
                <option value="both">Both</option>
            </select>
        </div>

        <button id="btnBackToMainFromSettings" class="menu-button" style="background: linear-gradient(145deg, #555, #222); margin-top: 20px;">BACK</button>
    </div></div>

    <div id="prayerListOverlay" class="overlay">
        <div class="prayer-list-modal">
            <div id="prayerList" class="scrollable-list"></div>
            <div class="prayer-list-controls">
                 <button id="prayerSettingsToggleBtn">Settings</button>
                 <div id="prayerSettingsPanel">
                     <label for="inGameCaptionFontInput">Font:</label>
                     <input type="text" id="inGameCaptionFontInput">
                     <label for="inGameCaptionColorPicker">Color:</label>

    <script id="roadVertexShader" type="x-shader/x-vertex">
        uniform float uTime;
        uniform float uSpeed;
        varying vec2 vUv;
        void main() {
            vUv = uv;
            vec3 pos = position;
            // Add a gentle, wave-like undulation to the road surface
            pos.y += sin(pos.x * 2.0 + uTime * uSpeed * 0.5) * 0.05;
            pos.y += sin(pos.z * 1.5 + uTime * uSpeed * 0.3) * 0.05;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
        }
    </script>
    <script id="roadFragmentShader" type="x-shader/x-fragment">
        uniform float uTime;
        uniform float uSpeed;
        uniform vec3 uColor;
        uniform sampler2D uTexture1;
        uniform sampler2D uTexture2;
        varying vec2 vUv;

        void main() {
            // Scroll two textures at different speeds to create a parallax, flowing effect
            vec2 uv1 = vUv;
            vec2 uv2 = vUv;
            uv1.y += uTime * uSpeed * 0.05;
            uv2.y += uTime * uSpeed * 0.08;

            vec4 tex1 = texture2D(uTexture1, uv1);
            vec4 tex2 = texture2D(uTexture2, uv2);

            // Blend the two textures together
            vec4 finalColor = mix(tex1, tex2, 0.5);

            // Multiply by the base color and add a subtle glow
            gl_FragColor = vec4(uColor, 1.0) * finalColor;
            gl_FragColor.rgb += vec3(0.05, 0.05, 0.1); // Add a little ambient light
        }
    </script>

        /**
         * A generic object pooling system to reuse objects and improve performance.
         */
        class ObjectPool {
            constructor(createFn, initialSize) {
                this.createFn = createFn;
                this.pool = [];
                this.active = new Set();
                for (let i = 0; i < initialSize; i++) {
                    const obj = this.createFn();
                    obj.visible = false;
                    scene.add(obj);
                    this.pool.push(obj);
                }
            }
            activate() {
                let obj = this.pool.length > 0 ? this.pool.pop() : this.createFn();
                if (!obj) return null;
                if (!obj.parent) scene.add(obj);
                obj.visible = true;
                this.active.add(obj);
                return obj;
            }
            deactivate(obj) {
                obj.visible = false;
                this.active.delete(obj);
                this.pool.push(obj);
            }
            deactivateAll() {
                [...this.active].forEach(obj => this.deactivate(obj));

        function createFlowingTexture() {
            const size = 512;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');

            // Base gradient for depth
            const gradient = ctx.createLinearGradient(0, 0, 0, size);
            gradient.addColorStop(0, '#020018');
            gradient.addColorStop(0.5, '#080428');
            gradient.addColorStop(1, '#020018');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, size, size);

            // Function to generate soft, cloud-like nebula patterns
            function drawNebulaCloud(centerX, centerY, maxRadius, color, iterations) {
                for (let i = 0; i < iterations; i++) {
                    const radius = Math.random() * maxRadius;
                    const angle = Math.random() * 2 * Math.PI;
                    const x = centerX + Math.cos(angle) * (radius * Math.random());
                    const y = centerY + Math.sin(angle) * (radius * Math.random());
                    const particleRadius = (1 - (radius / maxRadius)) * 20 + 5;
                    const grad = ctx.createRadialGradient(x, y, 0, x, y, particleRadius);
                    grad.addColorStop(0, `rgba(${color}, 0.15)`);
                    grad.addColorStop(1, `rgba(${color}, 0)`);
                    ctx.fillStyle = grad;
                    ctx.fillRect(x - particleRadius, y - particleRadius, particleRadius * 2, particleRadius * 2);
                }
            }

            // Draw multiple layers of nebula clouds for a rich texture
            drawNebulaCloud(size * 0.25, size * 0.5, size * 0.3, '80, 120, 255', 100); // Blueish
            drawNebulaCloud(size * 0.75, size * 0.5, size * 0.4, '180, 80, 255', 150); // Purplish

            // Add sharp, directional streaks for a sense of speed
            for (let i = 0; i < 50; i++) {
                const startX = Math.random() * size;
                const startY = Math.random() * size;
                const length = Math.random() * 150 + 75;
                const L = `rgba(200, 220, 255, ${Math.random() * 0.2 + 0.05})`;
                ctx.strokeStyle = L;
                ctx.lineWidth = Math.random() * 1.2;
                ctx.beginPath();
                ctx.moveTo(startX, startY);
                ctx.lineTo(startX, startY + length);
                ctx.stroke();
            }

            // Add fine "space dust" particles
            for (let i = 0; i < 2000; i++) {
                const x = Math.random() * size;
                const y = Math.random() * size;
                const brightness = Math.random() * 0.7 + 0.3;
                ctx.fillStyle = `rgba(255, 255, 255, ${brightness * 0.6})`;
                ctx.fillRect(x, y, 1, 1);
            }

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

                        const star2 = starfieldParticles[j];
                        const distSq = star1.position.distanceToSquared(star2.position);
                        if (distSq < maxDistSq) {
                            neighbors.push({ index: j, distSq });
                        }
                    }

            if (activeNefeshCount <= 0) {
                cameraTargetPos.copy(originalCameraPos); // Reset to default if no nefesh
                return;
            }

            const radiusStep = 0.45;
            let maxRadiusForLayout = radiusStep * Math.sqrt(MAX_NEFESH);
            const scaleFactor = (maxRadiusForLayout * 2 > roadWidth) ? (roadWidth / 2) / maxRadiusForLayout : 1;
            const formationRadius = radiusStep * Math.sqrt(activeNefeshCount) * scaleFactor;

            const fovRad = THREE.MathUtils.degToRad(camera.fov);
            const requiredZDist = (formationRadius / Math.tan(fovRad / 2)) / camera.aspect;
            const requiredYDist = formationRadius / Math.tan(fovRad / 2);
            const distance = Math.max(requiredYDist, requiredZDist);

            const baseCamPos = new THREE.Vector3(0, 7, 9);
            cameraTargetPos.z = baseCamPos.z + distance * 1.4;
            cameraTargetPos.y = baseCamPos.y + distance * 0.8;

                const time = clock.getElapsedTime();

                if (!gameState.color.current.equals(gameState.color.target)) {
                    gameState.color.current.lerp(gameState.color.target, 0.5 * deltaTime);

                }
                if(world.road) {
                    world.road.material.uniforms.uTime.value = time;
                    world.road.material.uniforms.uSpeed.value = currentRoadSpeed / 20.0;
                    // B"H: Added failsafe for road visibility
                    if (!world.road.visible) world.road.visible = true;
                }
                if(webcam.isInitialized) webcam.update(deltaTime);

                const scrollSpeed = currentRoadSpeed * 0.1;

                        positions[i] += scrollSpeed * deltaTime;
                        if (positions[i] > camera.position.z) positions[i] -= 1000;

                }

                // --- Celestial Winds Update ---

                let minX = Infinity, maxX = -Infinity;

        function updateConstellationNetwork(deltaTime, scrollSpeed) {
            const positions = world.constellationNetwork.geometry.attributes.position.array;
            const originalPositions = world.constellationNetwork.userData.originalPositions;
            for (let i = 0; i < positions.length; i += 3) {
                positions[i] = originalPositions[i];
                positions[i+1] = originalPositions[i+1];
                positions[i+2] = originalPositions[i+2] + (world.starfield.position.z + (time * scrollSpeed)) % 1000;
            }

        function updateFleetConduits(activeNefesh) {
            fleetConduitPool.deactivateAll();
            if (activeNefesh.length < 2) return;
            
            for (let i = 0; i < activeNefesh.length; i++) {
                const p1Data = activeNefesh[i];
                let neighbors = [];
                for (let j = 0; j < activeNefesh.length; j++) {
                    if (i === j) continue;
                    neighbors.push({ index: j, distSq: p1Data.pos.distanceToSquared(activeNefesh[j].pos) });
                }
                neighbors.sort((a,b) => a.distSq - b.distSq);

                for (let k = 0; k < gameSettings.fleetConduitCount && k < neighbors.length; k++) {
                    const p2Data = activeNefesh[neighbors[k].index];
                    if (i < neighbors[k].index) { // Avoid duplicate tubes
                        const tube = fleetConduitPool.activate();
                        if (tube) {
                            const curve = new THREE.Line3(p1Data.pos, p2Data.pos);
                            tube.geometry.dispose();
                            tube.geometry = new THREE.TubeGeometry(curve, 1, 0.02, 3, false);
                        }
                    }
                }
            }
        }


        function processObstacle(obstacle, deltaTime, speed) {
            obstacle.position.z += speed * deltaTime;

            switch(obstacle.userData.type) {
                case 'klipah_gate': obsSizeX = 3.0; obsSizeZ = 0.5; break;
                case 'jar': obsSizeX = 1.6; obsSizeZ = 1.6; break;
                case 'golem_sentry': obsSizeX = 1.5; obsSizeZ = 1.5; break;
                case 'tome_keeper': obsSizeX = 1.4; obsSizeZ = 1.4; break;
                case 'weaver': obsSizeX = 1.2; obsSizeZ = 1.2; break;
                case 'shatterer': obsSizeX = 1.6; obsSizeZ = 1.6; break;
                case 'minelayer': obsSizeX = 1.2; obsSizeZ = 1.8; break;

            }
            if (obstacle.userData.collisionBox2D) { obstacle.userData.collisionBox2D.setFromCenterAndSize({ x: obstacle.position.x, y: obstacle.position.z }, { x: obsSizeX, y: obsSizeZ }); }

            else if (obstacle.userData.type === 'golem_sentry' && !obstacle.userData.isShielded && clock.elapsedTime - obstacle.userData.lastShotTime > 3.5 - (gameState.level * 0.1)) { obstacle.userData.lastShotTime = clock.elapsedTime; obstacle.userData.eye.material.color.setHex(0xffffff); setTimeout(() => obstacle.userData.eye.material.color.setHex(0xff0000), 200); let projPool = Math.random() < 0.33 && gameState.level > 5 ? golemHeavyProjectilePool : (Math.random() < 0.66 && gameState.level > 2 ? golemFastProjectilePool : golemProjectilePool); let proj = projPool.activate(); if (proj) { obstacle.userData.eye.getWorldPosition(proj.position); proj.userData.type = projPool === golemHeavyProjectilePool ? 'heavy' : (projPool === golemFastProjectilePool ? 'fast' : 'normal'); if(proj.userData.type === 'heavy') proj.userData.damage = 5 + Math.floor(gameState.level / 4); } }
            if (obstacle.userData.type === 'weaver') { obstacle.position.x += obstacle.userData.moveDirection * obstacle.userData.moveSpeed * deltaTime; if (Math.abs(obstacle.position.x) > roadWidth / 2 - 0.5) { obstacle.userData.moveDirection *= -1; } if (!obstacle.userData.isShielded && clock.elapsedTime - obstacle.userData.lastShotTime > 1.0) { obstacle.userData.lastShotTime = clock.elapsedTime; const proj = weaverProjectilePool.activate(); if(proj) { proj.position.copy(obstacle.position); proj.userData.velocity = new THREE.Vector3(0, 0, 35); } } }
            if (obstacle.userData.type === 'minelayer' && clock.elapsedTime - obstacle.userData.lastMineTime > 4.0) { obstacle.userData.lastMineTime = clock.elapsedTime; const mine = minePool.activate(); if(mine) { mine.position.set(obstacle.position.x, roadLevelY + 0.1, obstacle.position.z); } }

            // Player-Obstacle collision
            if (obstacle.userData.isFriendly) return;
            const effectiveShield = gameState.player.hasShield || gameState.effects.globalShield > 0 || gameState.effects.invincibleTimer > 0;
            if (obstacle.userData.type === 'tohu_shard') { const spikeHalfSize = 0.3; obstacle.userData.body.children.forEach(spikeGroup => { spikeGroup.getWorldPosition(worldPosVec); spikeGroup.userData.collisionBox2D.setFromCenterAndSize({x: worldPosVec.x, y: worldPosVec.z}, {x: spikeHalfSize, y: spikeHalfSize}); nefeshState.forEach((state, index) => { if (!state.active || destroyedNefeshIndices.has(index)) return; if (spikeGroup.userData.collisionBox2D.intersectsBox(state.collisionBox2D)) { if(effectiveShield) { if (gameState.effects.invincibleTimer <= 0) gameState.player.hasShield = false; return; } markNefeshForDestruction(index); triggerFlash('#ff00ff', 200); } }); }); } else { nefeshState.forEach((state, index) => { if (!state.active || destroyedNefeshIndices.has(index)) return; if (obstacle.userData.collisionBox2D.intersectsBox(state.collisionBox2D)) { if(effectiveShield) { if (gameState.effects.invincibleTimer <= 0) gameState.player.hasShield = false; return; } switch (obstacle.userData.type) { case 'jar': if(!obstacle.userData.isShielded) { markNefeshForDestruction(index); triggerScreenShake(0.1); obstacle.userData.health--; if(obstacle.userData.health <= 0) { deactivateObstacle(obstacle); updateCombo(50, obstacle.position); shatterObject(obstacle.userData.body); } else { updateJarHealthVisuals(obstacle); } } break; case 'klipah_gate': adjustNefeshCount(obstacle.userData.currentValue); if (!obstacle.userData.isPurified) triggerScreenShake(0.4); else createParticleExplosion(obstacle.position, 20, 0x00ff00, 10); deactivateObstacle(obstacle); break; case 'mine': markNefeshForDestruction(index); triggerScreenShake(0.5); createParticleExplosion(obstacle.position, 60, 0xffa500, 20); deactivateObstacle(obstacle); break; default: if (!obstacle.userData.isShielded) { markNefeshForDestruction(index); triggerScreenShake(0.2); } break; } } }); }
        }

        function deactivateObstacle(obstacle) {
            if (gameState.wave.enemiesInWave.has(obstacle)) { gameState.wave.enemiesInWave.delete(obstacle); }
            const type = obstacle.userData.type;
            const poolMap = {
                klipah_gate: klipahGatePool, jar: jarPool, tohu_shard: tohuShardPool,
                golem_sentry: golemSentryPool, tome_keeper: tomeKeeperPool, weaver: weaverPool,
                shatterer: shattererPool, minelayer: minelayerPool, mine: minePool,
                heavy: golemHeavyProjectilePool, fast: golemFastProjectilePool, normal: golemProjectilePool,
                redemption_orb: redemptionOrbPool

            if(poolMap[type]) poolMap[type].deactivate(obstacle);

        function updateEnemyProjectiles(deltaTime) {
            const allEnemyProjPools = [golemProjectilePool, golemFastProjectilePool, golemHeavyProjectilePool, weaverProjectilePool, shattererShardPool, friendlyGolemProjectilePool];
            allEnemyProjPools.forEach(pool => {
                pool.active.forEach(proj => {
                    let speed = 25;
                    if(proj.userData.type === 'fast') speed = 45;
                    else if (proj.userData.type === 'heavy') speed = 18;

                    if (proj.userData.velocity) {
                        proj.position.addScaledVector(proj.userData.velocity, deltaTime);
                    } else {
                        proj.position.z += speed * deltaTime;
                    }


                    if(proj.position.z > camera.position.z + 10 || proj.position.z < -150) { pool.deactivate(proj); return; }
                    
                    const effectiveShield = gameState.player.hasShield || gameState.effects.globalShield > 0 || gameState.effects.invincibleTimer > 0;
                    if (pool === friendlyGolemProjectilePool) {
                        const allEnemies = [...klipahGatePool.active, ...jarPool.active, ...golemSentryPool.active.values()].filter(e => !e.userData.isFriendly);
                         for (const enemy of allEnemies) {
                            if (enemy.position.distanceTo(proj.position) < 1.5) {
                                processSparkCollision({ position: proj.position, damage: 5, pierceCounter: 0, isCrit: false, isEcho: false, active: true }, enemy);
                                pool.deactivate(proj);
                                return;
                            }
                        }
                    } else {
                         nefeshState.forEach((state, index) => {
                            if(!state.active || destroyedNefeshIndices.has(index)) return;
                            if(checkInstancedCollision(state, proj)) {

                                const color = proj.material.color.getHexString();
                                if(proj.userData.type === 'heavy') { adjustNefeshCount(-proj.userData.damage); triggerFlash(`#${color}`, 400); triggerScreenShake(0.6); }
                                else { markNefeshForDestruction(index); triggerFlash(`#${color}`, 300); triggerScreenShake(0.3); }
                                createParticleExplosion(proj.position, 20, `#${color}`, 15);

        }

        function updatePlayerProjectiles(deltaTime) {
            const tempSparkMatrix = new THREE.Matrix4();
            const tempEchoSparkMatrix = new THREE.Matrix4();
            let activeSparkCount = 0;
            let activeEchoSparkCount = 0;
            const allObstacles = [...klipahGatePool.active, ...jarPool.active, ...golemSentryPool.active, ...tomeKeeperPool.active, ...weaverPool.active, ...shattererPool.active, ...minelayerPool.active];

            for (let i = 0; i < MAX_SPARKS; i++) {
                const spark = sparkState[i];
                if (!spark.active) {
                    if (spark.isEcho) { tempEchoSparkMatrix.makeScale(0, 0, 0); celestialEchoSparkInstancedMesh.setMatrixAt(i, tempEchoSparkMatrix); }
                    else { tempSparkMatrix.makeScale(0, 0, 0); sparkInstancedMesh.setMatrixAt(i, tempSparkMatrix); }
                    continue;
                }

                spark.position.addScaledVector(spark.velocity, deltaTime);
                if (spark.position.z < -150 || spark.position.z > 20 || Math.abs(spark.position.x) > roadWidth * 2) { spark.active = false; continue; }

                if (gameState.bossManager.isActive) {
                    const bossBox = new THREE.Box3().setFromObject(gameState.bossManager.bossObject);
                    if(bossBox.containsPoint(spark.position)) {
                        gameState.bossManager.takeDamage(spark.damage);
                        spark.active = false;
                    }
                } else {
                    for(const obstacle of allObstacles) {
                        if (!spark.active || obstacle.userData.isShielded || Math.abs(obstacle.position.z - spark.position.z) > 2 || obstacle.userData.isFriendly) continue;
                        collisionVec2.set(spark.position.x, spark.position.z);
                        if (obstacle.userData.collisionBox2D && obstacle.userData.collisionBox2D.containsPoint(collisionVec2)) {
                            processSparkCollision(spark, obstacle);
                        }
                    }
                }

                if (spark.active) {
                    if (spark.isEcho) {
                        activeEchoSparkCount++;
                        tempEchoSparkMatrix.makeTranslation(spark.position.x, spark.position.y, spark.position.z);
                        celestialEchoSparkInstancedMesh.setMatrixAt(i, tempEchoSparkMatrix);
                    } else {
                        activeSparkCount++;
                        tempSparkMatrix.makeTranslation(spark.position.x, spark.position.y, spark.position.z);
                        sparkInstancedMesh.setMatrixAt(i, tempSparkMatrix);
                    }
                } else {
                    if (spark.isEcho) { tempEchoSparkMatrix.makeScale(0, 0, 0); celestialEchoSparkInstancedMesh.setMatrixAt(i, tempEchoSparkMatrix); }
                    else { tempSparkMatrix.makeScale(0, 0, 0); sparkInstancedMesh.setMatrixAt(i, tempSparkMatrix); }
                }
            }
            sparkInstancedMesh.instanceMatrix.needsUpdate = true;
            sparkInstancedMesh.count = activeSparkCount;
            celestialEchoSparkInstancedMesh.instanceMatrix.needsUpdate = true;
            celestialEchoSparkInstancedMesh.count = activeEchoSparkCount;
        }

        function processSparkCollision(spark, obstacle) {
            if (obstacle.userData.isFriendly) return;
            if (spark.pierceCounter <= 0) { spark.active = false; } else { spark.pierceCounter--; }
            const particleColor = spark.isCrit ? '#ffaa00' : (spark.isEcho ? '#ffd700' : '#ffffff');

            switch(obstacle.userData.type) {
                case 'klipah_gate':
                    if (obstacle.userData.isPurified) {
                        obstacle.userData.currentValue++;
                        createParticleExplosion(spark.position, 1, '#aaffaa', 2);
                    } else {
                        obstacle.userData.currentValue += spark.damage;
                        createParticleExplosion(spark.position, 3, '#888888', 5);
                        if (obstacle.userData.currentValue >= 0) {
                            obstacle.userData.isPurified = true;
                            obstacle.userData.currentValue = 0; // Reset to 0 upon purification
                            updateCombo(25, obstacle.position);
                            createParticleExplosion(obstacle.position, 40, 0x00ff00, 18);
                            const shockwave = new THREE.Mesh(new THREE.TorusGeometry(1, 0.1, 8, 32), new THREE.MeshBasicMaterial({color: 0x00ff00, transparent: true, opacity: 0.8}));
                            shockwave.position.copy(obstacle.position);
                            shockwave.rotation.x = Math.PI / 2;
                            scene.add(shockwave);
                            activeShockwaves.add({mesh: shockwave, life: 1.0});
                            triggerKlipahRedemption(obstacle.position);
                        }
                    }
                    updateKlipahGateVisuals(obstacle);
                    break;
                default: 
                    obstacle.userData.health -= spark.damage; 
                    createParticleExplosion(spark.position, 5, particleColor, 8); 
                    if (obstacle.userData.health <= 0) {
                        triggerScreenShake(0.3); shatterObject(obstacle.userData.body); createParticleExplosion(obstacle.position, 80, 0xffe4b5, 25); updateCombo(75, obstacle.position); const light = new THREE.PointLight(0xffaa55, 8, 30, 2); light.position.copy(obstacle.position); scene.add(light); activeLights.add(light);
                        if(obstacle.userData.type === 'jar' && Math.random() < 0.15) { // Increased chance for Vessel of Light
                            showSurpriseNotifier("A Vessel of Light Shatters!", "#ffffff"); for (let i = 0; i < 8; i++) { const angle = (i / 8) * Math.PI * 2; const velocity = new THREE.Vector3(Math.cos(angle), 0, Math.sin(angle)).multiplyScalar(40); fireSpark(obstacle.position, 1, true, false, velocity); } 
                        }
                        if(obstacle.userData.type === 'shatterer') {
                            for(let i = 0; i < 12; i++) { const shard = shattererShardPool.activate(); if(shard) { shard.position.copy(obstacle.position); shard.userData.velocity = new THREE.Vector3().randomDirection().setY(0).normalize().multiplyScalar(20 + Math.random() * 10); } }
                        }
                        if(obstacle.userData.type === 'tome_keeper' && obstacle.userData.shieldedEnemy) {
                            obstacle.userData.shieldedEnemy.userData.isShielded = false;
                            if (obstacle.userData.shieldedEnemy.userData.shieldVisual) obstacle.userData.shieldedEnemy.userData.shieldVisual.visible = false;
                        }
                        deactivateObstacle(obstacle);
                    } else if (obstacle.userData.type === 'jar') { updateJarHealthVisuals(obstacle); } 
                    break;
            }
        }

        function updateDynamicEffects(deltaTime) {
            for(const orb of shefaOrbPool.active) { orb.position.lerp(nefeshGroup.position, 0.08); orb.position.addScaledVector(orb.userData.velocity, deltaTime); orb.userData.velocity.lerp(new THREE.Vector3(0,0,0), 0.1); if(orb.position.distanceTo(nefeshGroup.position) < 1.5) { addShefa( orb.userData.value ); createParticleExplosion(orb.position, 3, 0xffd700, 5); shefaOrbPool.deactivate(orb); } }
            for(const orb of mitzvahOrbPool.active) { orb.position.lerp(nefeshGroup.position, 0.1); orb.position.addScaledVector(orb.userData.velocity, deltaTime); orb.userData.velocity.lerp(new THREE.Vector3(0,0,0), 0.15); if(orb.position.distanceTo(nefeshGroup.position) < 1.5) { gameState.mitzvot += orb.userData.value; createParticleExplosion(orb.position, 2, 0xffffff, 4); mitzvahOrbPool.deactivate(orb); } }
            for(const orb of redemptionOrbPool.active) { orb.position.z -= 25 * deltaTime; const allEnemies = [...klipahGatePool.active, ...jarPool.active, ...golemSentryPool.active, ...tomeKeeperPool.active, ...weaverPool.active, ...shattererPool.active, ...minelayerPool.active].filter(e => !e.userData.isFriendly); for(const enemy of allEnemies) { if (orb.position.distanceTo(enemy.position) < 2.0) { createParticleExplosion(orb.position, 80, 0xaaffaa, 20); if(enemy.userData.health) enemy.userData.health = 0; processSparkCollision({position: orb.position, damage: 9999, pierceCounter: 0, active: false, isCrit: false, isEcho: false}, enemy); redemptionOrbPool.deactivate(orb); break; } } if (orb.position.z < -150) { redemptionOrbPool.deactivate(orb); } }
            const updateDynamicParticle = p => { p.position.addScaledVector(p.userData.velocity, deltaTime); p.userData.velocity.y -= 25 * deltaTime; p.userData.life -= deltaTime; if(p.material && p.material.opacity) p.material.opacity = p.userData.life; if (p.userData.type === 'shard') { p.rotation.x += p.userData.rotationSpeed.x * deltaTime; p.rotation.y += p.userData.rotationSpeed.y * deltaTime; } if (p.userData.life <= 0) { if(p.userData.type === 'particle') particlePool.deactivate(p); else { scene.remove(p); dynamicShards.delete(p); } } };
            particlePool.active.forEach(updateDynamicParticle);
            dynamicShards.forEach(updateDynamicParticle);
            activeLights.forEach(light => { light.intensity -= 25 * deltaTime; if(light.intensity <= 0) { scene.remove(light); activeLights.delete(light); } });
            tomeKeeperPool.active.forEach(keeper => { const shielded = keeper.userData.shieldedEnemy; if (shielded && shielded.visible) { const beam = keeper.userData.shieldBeam; beam.visible = true; const positions = beam.geometry.attributes.position.array; const keeperPos = keeper.getWorldPosition(new THREE.Vector3()); const shieldedPos = shielded.getWorldPosition(new THREE.Vector3()); positions[0] = keeperPos.x; positions[1] = keeperPos.y; positions[2] = keeperPos.z; positions[3] = shieldedPos.x; positions[4] = shieldedPos.y; positions[5] = shieldedPos.z; beam.geometry.attributes.position.needsUpdate = true; } else { keeper.userData.shieldBeam.visible = false; if(shielded) shielded.userData.isShielded = false; keeper.userData.shieldedEnemy = null; } });
            activeShockwaves.forEach(sw => { sw.life -= 2 * deltaTime; sw.mesh.scale.multiplyScalar(1 + (sw.isPrayerWave ? 2 : 5) * deltaTime); sw.mesh.material.opacity = sw.life; if(sw.isPrayerWave) { const waveRadius = sw.mesh.geometry.parameters.radius * sw.mesh.scale.x; [...klipahGatePool.active, ...jarPool.active, ...golemSentryPool.active, ...tomeKeeperPool.active, ...weaverPool.active, ...shattererPool.active, ...minelayerPool.active].filter(e => !e.userData.isFriendly).forEach(enemy => { if(enemy.position.distanceTo(sw.mesh.position) < waveRadius) { if(enemy.userData.type === 'klipah_gate' && !enemy.userData.isPurified) { enemy.userData.currentValue = 0; enemy.userData.isPurified = true; updateKlipahGateVisuals(enemy); } else if(enemy.userData.health) { enemy.userData.health -= 30 * deltaTime; if(enemy.userData.health <= 0) { deactivateObstacle(enemy); shatterObject(enemy.userData.body); } } } }); } if(sw.life <= 0) { scene.remove(sw.mesh); activeShockwaves.delete(sw); } });
        }

        /**
         * B"H: Triggers the Celestial Echo effect, creating a ghost fleet that fires a volley.
         */
        function triggerCelestialEcho() {
            nefeshState.forEach((state, i) => {
                if(state.active) {
                    const worldPos = new THREE.Vector3().copy(state.currentPos).add(nefeshGroup.position);
                    activeEchos.push({
                        position: worldPos,
                        life: 1.5,
                        maxLife: 1.5,
                        hasFired: false,
                    });
                }
            });
        }

        /**
         * B"H: Updates all active Celestial Echoes.
         * @param {number} deltaTime - The time since the last frame.
         */
        function updateCelestialEchos(deltaTime) {
            for (let i = activeEchos.length - 1; i >= 0; i--) {
                const echo = activeEchos[i];
                echo.life -= deltaTime;

                if (!echo.hasFired && echo.life < echo.maxLife * 0.75) {
                    fireSpark(echo.position, 2, true, true);
                    echo.hasFired = true;
                }

                if (echo.life <= 0) {
                    activeEchos.splice(i, 1);
                }
            }
        }


        function checkWaveCompletion() {
            if (gameState.wave.isTracking && gameState.wave.enemiesInWave.size === 0) {
                if (gameState.wave.hitsTakenThisWave === 0) {
                    ui.perfectWaveNotifier.textContent = "PERFECT WAVE!";
                    ui.perfectWaveNotifier.classList.add('show');
                    setTimeout(() => ui.perfectWaveNotifier.classList.remove('show'), 2000);
                    addShefa(50);
                    gameState.mitzvot += 100;
                    if(Math.random() < 0.25 && playerStats.upgrades.commandmentsAuthority?.level < 10) {
                        playerStats.tabletFragments++;
                        savePlayerStats();
                        showSurpriseNotifier(`Tablet Fragment Found! (${playerStats.tabletFragments}/10)`, "#00f0ff");
                    }
                    createParticleExplosion(nefeshGroup.position, 100, 0x00f0ff, 25);
                    triggerCelestialEcho();
                }
                gameState.wave.isTracking = false;
            }
        }

        function processNefeshDestruction() {
            if (destroyedNefeshIndices.size > 0) {
                destroyedNefeshIndices.forEach(index => neutralizeNefesh(index));

                const currentNefesh = nefeshState.filter(s => s.active).length;
                if (currentNefesh !== gameState.nefesh) {
                   if (currentNefesh < gameState.nefesh) shatterElement(ui.nefeshDisplay);
                   gameState.nefesh = currentNefesh;
                }
                destroyedNefeshIndices.clear();

                if (currentNefesh <= 0 && gameState.current === 'playing') {
                    endGame();
                }
                updateCameraTarget();
            }
        }

        function updateUIDisplays() {
            if (!gameState || gameState.current !== 'playing') return;
            ui.mitzvotDisplay.textContent = `MITZVOT: ${Math.floor(gameState.mitzvot)}`;
            ui.nefeshDisplay.textContent = `NEFESH: ${gameState.nefesh}`;
            ui.shefaBar.style.width = `${Math.min(100, (gameState.shefa / gameState.shefaToAscend) * 100)}%`;
        }

        // --- INITIALIZATION ---
        (async () => {
            try {
                await initDB();
            } catch (dbError) {
                console.warn("Could not initialize IndexedDB. Settings will not be saved or loaded.", dbError);
            }

            try {
                loadPlayerStats();
                setupInstancedNefesh();
                await applySettings();
                showMainMenu();
            } catch(setupError) {
                console.error("Critical error during initial game setup:", setupError);
                document.body.innerHTML = `<div style="color: white; text-align: center; padding-top: 50px; font-size: 2em; font-family: Arial, sans-serif;">A critical error occurred during setup. Please refresh the page or check the console for details.</div>`;
                displayGlobalError("Fatal error during startup. The application cannot continue.");
            }
        })();

    </script>
</body>
</html>
