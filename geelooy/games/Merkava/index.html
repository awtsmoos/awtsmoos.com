<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merkava: The Celestial Journey</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap');
        :root {
            --glow-color: #00ddff;
            --shefa-color: #ffd700;
            --klipot-color: #ff2d2d;
            --mitzvot-color: #ffffff;
            --nefesh-color: #c0c0c0;
            --outline-color: #000000;
        }
        body { margin: 0; overflow: hidden; font-family: 'Orbitron', 'Arial', sans-serif; color: white; background-color: #050008; }
        canvas { display: block; }

        #flashOverlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-color: white; z-index: 1001; pointer-events: none;
            opacity: 0;
        }
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 1000; background-color: rgba(0, 0, 10, 0.85);
            backdrop-filter: blur(8px); opacity: 0; visibility: hidden;
            transition: opacity 0.5s ease, visibility 0.5s ease;
            overflow-y: auto; 
            pointer-events: none; 
        }
        .overlay.visible {
            opacity: 1;
            visibility: visible;
            pointer-events: auto; 
        }
        
        .ui-text { text-shadow: 0 0 8px currentColor, 0 0 15px currentColor, 0 0 2px black; }
        #mitzvotDisplay, #nefeshDisplay { transition: transform 0.1s ease-out; }
        
        #mitzvotDisplay { position: absolute; top: 10px; left: 10px; font-size: 1.3em; background-color: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 5px; }
        #nefeshDisplay { position: absolute; top: 10px; right: 10px; font-size: 1.3em; background-color: rgba(0,0,0,0.4); padding: 5px 10px; border-radius: 5px; }
        #bhText { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); font-size: 1.5em; color: var(--glow-color); z-index: 999; }
        
        #shefaContainer { position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%); width: 50%; max-width: 400px; height: 15px; background-color: rgba(0,0,0,0.5); border: 2px solid var(--shefa-color); border-radius: 10px; z-index: 999; overflow: hidden; }
        #shefaBar { width: 0%; height: 100%; background: var(--shefa-color); box-shadow: 0 0 10px var(--shefa-color), 0 0 5px var(--shefa-color) inset; transition: width 0.3s ease-out; }

        #ascensionNotifier, #comboNotifier {
            position: absolute; left: 50%; transform: translate(-50%, -50%) scale(0.5);
            pointer-events: none; z-index: 1002; opacity: 0;
            transition: transform 0.8s cubic-bezier(0.19, 1, 0.22, 1), opacity 0.8s cubic-bezier(0.19, 1, 0.22, 1), left 0.5s ease, top 0.5s ease;
            text-transform: uppercase;
        }
        #ascensionNotifier { top: 20%; font-size: 2.2em; color: #d8a8ff; text-shadow: 0 0 10px #d8a8ff, 0 0 20px #d8a8ff; }
        #comboNotifier { top: 30%; font-size: 2.0em; color: var(--shefa-color); text-shadow: 0 0 8px var(--shefa-color); }
        
        #ascensionNotifier.side-mode { left: 18%; top: 25%; }
        #comboNotifier.side-mode { left: 18%; top: 35%; }

        #ascensionNotifier.show, #comboNotifier.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        
        #ascensionNotifier.side-mode.show { transform: translate(-50%, -50%) scale(0.65); opacity: 1; }
        #comboNotifier.side-mode.show { transform: translate(-50%, -50%) scale(0.65); opacity: 1; }

        .game-title { font-size: 4em; margin-bottom: 20px; text-align: center; color: var(--glow-color); text-transform: uppercase; }
        .game-subtitle { font-size: 1.5em; color: var(--mitzvot-color); margin-bottom: 40px; text-align: center; }

        .menu-button-group { display: flex; flex-direction: column; gap: 20px; width: 80%; max-width: 400px; padding: 20px 0; }
        .menu-button, .select-menu { padding: 15px; font-size: 1.8em; background: linear-gradient(145deg, #0077ff, #0033aa); color: white; border: 2px solid var(--glow-color); border-radius: 8px; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 4px 15px rgba(0, 100, 255, 0.3), inset 0 0 5px rgba(255,255,255,0.3); text-transform: uppercase; font-family: 'Orbitron', 'Arial', sans-serif; }
        .menu-button:hover, .select-menu:hover { background: linear-gradient(145deg, #0088ff, #0044bb); transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 25px rgba(0, 120, 255, 0.5), inset 0 0 8px rgba(255,255,255,0.4); }
        .menu-button:active, .select-menu:active { transform: translateY(1px) scale(1.02); box-shadow: 0 2px 10px rgba(0, 120, 255, 0.4), inset 0 0 8px rgba(255,255,255,0.4); }
        
        #customPrayerTextarea {
            width: 100%; height: 200px; font-size: 1em; color: white; background-color: rgba(0,0,0,0.7);
            border: 2px solid var(--glow-color); border-radius: 8px; padding: 10px;
            font-family: 'Arial', sans-serif;
        }

        #prayerDisplayContainer {
            position: absolute; top: 55px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 800px;
            background-color: rgba(0,0,0,0.5);
            border-radius: 10px; padding: 10px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 998;
            opacity: 0; visibility: hidden; transition: opacity 0.5s, visibility 0.5s;
            pointer-events: none; 
        }
        #prayerDisplayContainer.visible { opacity: 1; visibility: visible; pointer-events: auto; }
        
        #prayerTextContainer { position: relative; flex-grow: 1; display: flex; justify-content: center; align-items: center; }
        #prayerDropdownBtn {
            position: absolute;
            top: -15px; 
            font-size: 1.5em;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            opacity: 0.3;
            transition: opacity 0.2s;
            z-index: 1004;
        }
        #prayerDropdownBtn:hover { opacity: 1; }

        #prayerText {
            flex-grow: 1; text-align: center; font-size: 1.2em; color: white;
            text-shadow: 2px 2px 4px #000000;
            white-space: normal;
            word-wrap: break-word;
            padding: 10px 0;
            min-height: 50px;
        }
        .prayer-nav-button {
            background: none; border: 2px solid white; color: white; font-size: 2em;
            cursor: pointer; padding: 0 15px; border-radius: 5px;
            transition: background-color 0.2s, transform 0.1s;
            user-select: none;
        }
        .prayer-nav-button:hover { background-color: rgba(255,255,255,0.2); }
        .prayer-nav-button:active { transform: scale(0.95); }

        .setting-item {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            width: 100%;
            margin-bottom: 20px;
        }
         .setting-item.checkbox {
            flex-direction: row;
            align-items: center;
        }
        .setting-item.checkbox label { margin-bottom: 0; margin-left: 10px; }
        .setting-item.checkbox input { width: auto; }

        .setting-item h3 {
             width: 100%; text-align: center; color: var(--shefa-color);
             margin-top: 25px; margin-bottom: 15px; border-bottom: 1px solid var(--shefa-color); padding-bottom: 8px;
             text-transform: uppercase; letter-spacing: 1px;
        }

        .setting-item label {
            font-size: 1.2em;
            margin-bottom: 8px;
            color: var(--glow-color);
        }
        .setting-item input[type="text"],
        .setting-item textarea,
        .setting-item input[type="color"],
        .setting-item select {
            width: 100%;
            font-size: 1em;
            color: white;
            background-color: rgba(0,0,0,0.7);
            border: 2px solid var(--glow-color);
            border-radius: 8px;
            padding: 10px;
            box-sizing: border-box; 
            font-family: 'Arial', sans-serif;
        }
        .setting-item select {
            -moz-appearance: none;
            -webkit-appearance: none;
            appearance: none;
            background-image: url('data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2300DDFF%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-13%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2013l128%20127.9c3.6%203.6%207.8%205.4%2013%205.4s9.4-1.8%2013-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-13%200-5-1.9-9.4-5.4-13z%22/%3E%3C/svg%3E');
            background-repeat: no-repeat;
            background-position: right 1em top 50%;
            background-size: .65em auto;
            padding-right: 2.5em; /* Make space for the arrow */
        }
         .setting-item select option {
            background-color: #050008;
            color: white;
            padding: 10px;
        }

        .setting-item textarea {
            height: 100px;
            resize: vertical;
        }
        .setting-item input[type="range"] {
            width: 100%;
        }

        #prayerListOverlay { z-index: 1003; }
        .prayer-list-modal {
            width: 90%;
            max-width: 700px;
            background: rgba(10, 0, 20, 0.95);
            border: 2px solid var(--glow-color);
            border-radius: 10px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }
        .scrollable-list {
            max-height: 60vh;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid rgba(0, 221, 255, 0.3);
            border-radius: 5px;
            padding: 5px;
        }
        .prayer-list-item {
            padding: 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: background-color 0.2s;
            font-size: 1.1em;
        }
        .prayer-list-item:hover { background-color: rgba(0, 100, 255, 0.3); }
        .prayer-list-item.active { background-color: var(--shefa-color); color: #000; font-weight: bold; }
        .prayer-list-controls { display: flex; flex-direction: column; gap: 10px; }
        .prayer-list-controls button {
             padding: 10px; font-size: 1.2em; background: linear-gradient(145deg, #333, #111); color: white; border: 1px solid var(--glow-color); border-radius: 5px; cursor: pointer;
        }
        #prayerSettingsPanel {
            display: none;
            flex-direction: column;
            gap: 10px;
            padding: 10px;
            border: 1px dashed var(--glow-color);
            border-radius: 5px;
        }
         #prayerSettingsPanel label { font-size: 1em; color: var(--glow-color); }
        
        #webcamFeed {
            display: none; /* B"H: Webcam feed is not displayed directly, but used as a texture */
        }
        #globalErrorNotifier {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(200, 0, 0, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 8px;
            z-index: 9999;
            font-family: 'Arial', sans-serif;
            font-size: 1.2em;
            box-shadow: 0 0 15px black;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>
    <video id="webcamFeed" autoplay playsinline muted></video>
    <div id="globalErrorNotifier"></div>

    <div id="bhText" class="ui-text">ב"ה</div>
    <div id="flashOverlay"></div>
    <div id="ascensionNotifier"></div>
    <div id="comboNotifier"></div>

    <div id="prayerDisplayContainer">
        <button id="prevPrayerBtn" class="prayer-nav-button">&lt;</button>
        <div id="prayerTextContainer">
            <button id="prayerDropdownBtn">📜</button>
            <div id="prayerText"></div>
        </div>
        <button id="nextPrayerBtn" class="prayer-nav-button">&gt;</button>
    </div>

    <div id="statsContainer">
        <div id="mitzvotDisplay" class="ui-text">MITZVOT: 0</div>
        <div id="nefeshDisplay" class="ui-text">NEFESH: 0</div>
    </div>
    <div id="shefaContainer"><div id="shefaBar"></div></div>

    <div id="gameOverOverlay" class="overlay"><div class="menu-button-group">
        <div class="game-title ui-text" style="color: var(--klipot-color);">THE MERKAVA HAS FALLEN</div>
        <div id="finalMitzvotDisplay" class="game-subtitle">You gathered 0 Mitzvot.</div>
        <button id="tryAgainButton" class="menu-button">ATTEMPT THE JOURNEY AGAIN</button>
        <button id="btnBackToMainFromGameOver" class="menu-button" style="background: linear-gradient(145deg, #555, #222);">BACK TO MAIN MENU</button>
    </div></div>

    <div id="customMenuOverlay" class="overlay"><div class="menu-button-group">
        <div class="game-title ui-text">CUSTOM JOURNEY</div>
        <div class="game-subtitle" style="margin-bottom: 20px;">Paste prayers below, separated by two new lines.</div>
        <textarea id="customPrayerTextarea" placeholder="Prayer 1...&#10;&#10;Prayer 2..."></textarea>
        <button id="btnGoCustom" class="menu-button">BEGIN</button>
        <button id="btnBackToMain" class="menu-button" style="background: linear-gradient(145deg, #555, #222);">BACK</button>
    </div></div>
    
    <div id="mainMenuOverlay" class="overlay visible"><div class="menu-button-group">
        <div class="game-title ui-text">MERKAVA</div>
        <div class="game-subtitle">The Celestial Journey</div>
        <button id="btnBegin" class="menu-button">BEGIN THE JOURNEY</button>
        <button id="btnCustom" class="menu-button">CUSTOM JOURNEY</button>
        <button id="btnSettings" class="menu-button">SETTINGS</button>
    </div></div>

    <div id="settingsOverlay" class="overlay"><div class="menu-button-group" style="max-width: 600px; width: 90%;">
        <div class="game-title ui-text">SETTINGS</div>

        <h3>Gameplay</h3>
        <div class="setting-item">
            <label for="maxNefeshSlider">Max Nefesh: <span id="maxNefeshValue">100</span></label>
            <input type="range" id="maxNefeshSlider" min="10" max="248" step="1">
        </div>
        <div class="setting-item">
            <label for="particleSpawnRadiusSlider">Particle Spawn Radius: <span id="particleSpawnRadiusValue">60</span></label>
            <input type="range" id="particleSpawnRadiusSlider" min="10" max="200" step="5">
        </div>

        <h3>Visual Effects</h3>
        <div class="setting-item">
            <label for="shakeIntensitySlider">Screen Shake: <span id="shakeIntensityValue">1</span></label>
            <input type="range" id="shakeIntensitySlider" min="0" max="5" step="0.1">
        </div>
        <div class="setting-item">
            <label for="flashIntensitySlider">Flash Intensity: <span id="flashIntensityValue">1</span></label>
            <input type="range" id="flashIntensitySlider" min="0" max="1" step="0.05">
        </div>
        <div class="setting-item">
            <label for="effectsIntensitySlider">Special Effect Intensity (FOV, Particles): <span id="effectsIntensityValue">1</span></label>
            <input type="range" id="effectsIntensitySlider" min="0" max="2" step="0.1">
        </div>
        
        <h3>Graphics</h3>
        <div class="setting-item">
            <label for="particleCharsTextarea">Particle Characters (comma separated):</label>
            <textarea id="particleCharsTextarea"></textarea>
        </div>
        <div class="setting-item">
            <label for="minParticleSizeSlider">Min Particle Size: <span id="minParticleSizeValue">2</span></label>
            <input type="range" id="minParticleSizeSlider" min="0.5" max="10" step="0.1">
        </div>
        <div class="setting-item">
            <label for="maxParticleSizeSlider">Max Particle Size: <span id="maxParticleSizeValue">5</span></label>
            <input type="range" id="maxParticleSizeSlider" min="1" max="20" step="0.1">
        </div>
         <div class="setting-item">
            <label for="shatterCountSlider">Shatter Particle Count: <span id="shatterCountValue">20</span></label>
            <input type="range" id="shatterCountSlider" min="1" max="100" step="1">
        </div>
        <div class="setting-item">
            <label for="shatterSpeedSlider">Shatter Particle Speed: <span id="shatterSpeedValue">25</span></label>
            <input type="range" id="shatterSpeedSlider" min="1" max="50" step="1">
        </div>

        <h3>Custom Captions</h3>
        <div class="setting-item">
            <label for="captionFontInput">Caption Font:</label>
            <input type="text" id="captionFontInput">
        </div>
        <div class="setting-item">
            <label for="captionColorPicker">Caption Color:</label>
            <input type="color" id="captionColorPicker">
        </div>

        <h3>Webcam</h3>
        <div class="setting-item">
            <label for="webcamModeSelect">Webcam Display Mode:</label>
            <select id="webcamModeSelect">
                <option value="off">Off</option>
                <option value="central">Central Display</option>
                <option value="individual">Individual Nefesh</option>
                <option value="both">Both</option>
            </select>
        </div>

        <button id="btnBackToMainFromSettings" class="menu-button" style="background: linear-gradient(145deg, #555, #222); margin-top: 20px;">BACK</button>
    </div></div>

    <div id="prayerListOverlay" class="overlay">
        <div class="prayer-list-modal">
            <div id="prayerList" class="scrollable-list"></div>
            <div class="prayer-list-controls">
                 <button id="prayerSettingsToggleBtn">Settings</button>
                 <div id="prayerSettingsPanel">
                     <label for="inGameCaptionFontInput">Font:</label>
                     <input type="text" id="inGameCaptionFontInput">
                     <label for="inGameCaptionColorPicker">Color:</label>
                     <input type="color" id="inGameCaptionColorPicker">
                 </div>
                 <button id="backToMenuFromGameBtn" style="background: linear-gradient(145deg, #772222, #441111);">Back to Menu</button>
                 <button id="closePrayerListBtn">Close</button>
            </div>
        </div>
    </div>


    <script type="module">
        import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';

        // --- GLOBAL ERROR HANDLING ---
        
        /**
         * B"H: A handler to catch disruptions in the flow of creation.
         * Displays a global error message at the bottom of the screen.
         * @param {string} message The error message to display.
         */
        function displayGlobalError(message) {
            const errorDiv = document.getElementById('globalErrorNotifier');
            if (errorDiv) {
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                setTimeout(() => { errorDiv.style.display = 'none'; }, 6000);
            }
        }
        window.addEventListener('error', function(event) {
            console.error('B"H: A critical error was caught!', event.error);
            displayGlobalError(`A critical error occurred: ${event.message}. Check console for details.`);
        });
        window.addEventListener('unhandledrejection', function(event) {
            console.error('B"H: An unhandled promise rejection was caught!', event.reason);
            displayGlobalError(`An async error occurred. Check console for details.`);
        });

        // --- GLOBAL SETUP ---
        // B"H: Atzmut - The essential, unmanifest reality from which all Kelim (vessels) are formed.
        // These are the primary Kelim through which the journey is perceived.
        const scene = new THREE.Scene();
        scene.add(new THREE.AmbientLight(0xffffff, 0.6));
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(5, 10, 7.5);
        scene.add(dirLight);
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const originalCameraPos = new THREE.Vector3(0, 8, 11);
        const cameraTargetPos = new THREE.Vector3().copy(originalCameraPos);
        const originalFOV = 75;
        camera.position.copy(originalCameraPos);
        camera.lookAt(0, 0, 0);
        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        const initialClearColor = new THREE.Color(0x483d8b);
        renderer.setClearColor(initialClearColor);
        document.body.appendChild(renderer.domElement);

        // --- UI ELEMENT CACHING ---
        // B"H: References to the manifest layers of the interface.
        const ui = {
            mainMenu: document.getElementById('mainMenuOverlay'),
            gameOver: document.getElementById('gameOverOverlay'),
            customMenu: document.getElementById('customMenuOverlay'),
            settingsOverlay: document.getElementById('settingsOverlay'),
            ascensionNotifier: document.getElementById('ascensionNotifier'),
            comboNotifier: document.getElementById('comboNotifier'),
            flashOverlay: document.getElementById('flashOverlay'),
            btnBegin: document.getElementById('btnBegin'),
            tryAgainButton: document.getElementById('tryAgainButton'),
            btnCustom: document.getElementById('btnCustom'),
            btnGoCustom: document.getElementById('btnGoCustom'),
            btnBackToMain: document.getElementById('btnBackToMain'),
            btnSettings: document.getElementById('btnSettings'),
            btnBackToMainFromSettings: document.getElementById('btnBackToMainFromSettings'),
            btnBackToMainFromGameOver: document.getElementById('btnBackToMainFromGameOver'),
            customPrayerTextarea: document.getElementById('customPrayerTextarea'),
            prayerDisplayContainer: document.getElementById('prayerDisplayContainer'),
            prayerText: document.getElementById('prayerText'),
            prevPrayerBtn: document.getElementById('prevPrayerBtn'),
            nextPrayerBtn: document.getElementById('nextPrayerBtn'),
            mitzvotDisplay: document.getElementById('mitzvotDisplay'),
            nefeshDisplay: document.getElementById('nefeshDisplay'),
            finalMitzvotDisplay: document.getElementById('finalMitzvotDisplay'),
            shefaBar: document.getElementById('shefaBar'),
            particleCharsTextarea: document.getElementById('particleCharsTextarea'),
            shakeIntensitySlider: document.getElementById('shakeIntensitySlider'),
            shakeIntensityValue: document.getElementById('shakeIntensityValue'),
            flashIntensitySlider: document.getElementById('flashIntensitySlider'),
            flashIntensityValue: document.getElementById('flashIntensityValue'),
            effectsIntensitySlider: document.getElementById('effectsIntensitySlider'),
            effectsIntensityValue: document.getElementById('effectsIntensityValue'),
            shatterCountSlider: document.getElementById('shatterCountSlider'),
            shatterCountValue: document.getElementById('shatterCountValue'),
            shatterSpeedSlider: document.getElementById('shatterSpeedSlider'),
            shatterSpeedValue: document.getElementById('shatterSpeedValue'),
            captionFontInput: document.getElementById('captionFontInput'),
            captionColorPicker: document.getElementById('captionColorPicker'),
            minParticleSizeSlider: document.getElementById('minParticleSizeSlider'),
            minParticleSizeValue: document.getElementById('minParticleSizeValue'),
            maxParticleSizeSlider: document.getElementById('maxParticleSizeSlider'),
            maxParticleSizeValue: document.getElementById('maxParticleSizeValue'),
            particleSpawnRadiusSlider: document.getElementById('particleSpawnRadiusSlider'),
            particleSpawnRadiusValue: document.getElementById('particleSpawnRadiusValue'),
            webcamModeSelect: document.getElementById('webcamModeSelect'),
            maxNefeshSlider: document.getElementById('maxNefeshSlider'),
            maxNefeshValue: document.getElementById('maxNefeshValue'),
            prayerDropdownBtn: document.getElementById('prayerDropdownBtn'),
            prayerListOverlay: document.getElementById('prayerListOverlay'),
            prayerList: document.getElementById('prayerList'),
            closePrayerListBtn: document.getElementById('closePrayerListBtn'),
            prayerSettingsToggleBtn: document.getElementById('prayerSettingsToggleBtn'),
            prayerSettingsPanel: document.getElementById('prayerSettingsPanel'),
            inGameCaptionFontInput: document.getElementById('inGameCaptionFontInput'),
            inGameCaptionColorPicker: document.getElementById('inGameCaptionColorPicker'),
            backToMenuFromGameBtn: document.getElementById('backToMenuFromGameBtn'),
        };

        // --- GAME STATE & CONSTANTS ---
        // B"H: Atzmut - The simple unity that precedes all complexity. Here, we define the boundaries of the manifest world.
        let gameState = {};
        const clock = new THREE.Clock();
        let animationFrameId;

        class ObjectPool {
            /**
             * @param {Function} createFn A function that creates a new object for the pool.
             * @param {number} initialSize The number of objects to create initially.
             */
            constructor(createFn, initialSize) {
                this.createFn = createFn;
                this.pool = [];
                this.active = new Set();
                for (let i = 0; i < initialSize; i++) {
                    const obj = this.createFn();
                    obj.visible = false;
                    scene.add(obj);
                    this.pool.push(obj);
                }
            }
            /**
             * Retrieves an object from the pool, making it active and visible.
             * @returns {object} An object from the pool.
             */
            activate() {
                let obj = this.pool.length > 0 ? this.pool.pop() : this.createFn();
                if (!obj.parent) scene.add(obj);
                obj.visible = true;
                this.active.add(obj);
                return obj;
            }
            /**
             * Returns an object to the pool, making it inactive and invisible.
             * @param {object} obj The object to deactivate.
             */
            deactivate(obj) {
                obj.visible = false;
                this.active.delete(obj);
                this.pool.push(obj);
            }
            /** Deactivates all currently active objects in the pool. */
            deactivateAll() {

        setupSettingListener(ui.maxNefeshSlider, ui.maxNefeshValue, 'maxNefesh', parseInt); setupSettingListener(ui.particleCharsTextarea, null, 'particleChars', val => val); setupSettingListener(ui.shakeIntensitySlider, ui.shakeIntensityValue, 'shakeIntensity', parseFloat); setupSettingListener(ui.flashIntensitySlider, ui.flashIntensityValue, 'flashIntensity', parseFloat); setupSettingListener(ui.effectsIntensitySlider, ui.effectsIntensityValue, 'effectsIntensity', parseFloat); setupSettingListener(ui.shatterCountSlider, ui.shatterCountValue, 'shatterCount', parseInt); setupSettingListener(ui.shatterSpeedSlider, ui.shatterSpeedValue, 'shatterSpeed', parseInt); setupSettingListener(ui.minParticleSizeSlider, ui.minParticleSizeValue, 'minParticleSize', parseFloat); setupSettingListener(ui.maxParticleSizeSlider, ui.maxParticleSizeValue, 'maxParticleSize', parseFloat); setupSettingListener(ui.particleSpawnRadiusSlider, ui.particleSpawnRadiusValue, 'particleSpawnRadius', parseInt); setupSettingListener(ui.captionFontInput, null, 'captionFont', val => val); setupSettingListener(ui.captionColorPicker, null, 'captionColor', val => val); setupSettingListener(ui.inGameCaptionFontInput, null, 'captionFont', val => val); setupSettingListener(ui.inGameCaptionColorPicker, null, 'captionColor', val => val);

        window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });
        function checkInstancedCollision(nefeshStateItem, otherObject) { otherObject.getWorldPosition(worldPosVec); collisionVec2.set(worldPosVec.x, worldPosVec.z); return nefeshStateItem.collisionBox2D.containsPoint(collisionVec2); }

        // --- THE MAIN GAME LOOP ---
        
        /**
         * B"H: Atzmut - The constant flow of Divine Will (Ratzon) that sustains creation moment by moment. "No thought can grasp You at all."
         * This is the main animation loop, running every frame.
         * @param {DOMHighResTimeStamp} currentTime The current time provided by `requestAnimationFrame`.
         */
        function animate(currentTime) {
            animationFrameId = requestAnimationFrame(animate);
            try {
                if(gameState.current !== 'playing' || !gameState) return;
                
                const deltaTime = Math.min(0.05, clock.getDelta());
                const currentRoadSpeed = roadBaseSpeed + gameState.level * 1.5;

                // --- World & Visuals Update ---
                if (!gameState.color.current.equals(gameState.color.target)) { gameState.color.current.lerp(gameState.color.target, 0.5 * deltaTime); renderer.setClearColor(gameState.color.current); if(scene.fog) scene.fog.color.copy(gameState.color.current); }
                if(road && road.material.map && roadTextureTileLength > 0) { road.material.map.offset.y += (currentRoadSpeed / roadTextureTileLength) * deltaTime; }
                const starSpeed = 20 + gameState.level * 2; starField1.position.z += starSpeed * deltaTime; starField2.position.z += starSpeed * deltaTime; if(starField1.position.z > 250) starField1.position.z -= 500; if(starField2.position.z > 250) starField2.position.z -= 500;
                if (Math.random() < Math.min(0.95, 0.4 + (gameState.level * 0.025))) spawnSpecialParticle();
                for (const p of specialParticlePool.active) { p.position.addScaledVector(p.userData.velocity, deltaTime); p.userData.life -= deltaTime; p.material.opacity = Math.sin(Math.max(0, p.userData.life) * 0.5 * Math.PI) * 0.7; if (p.userData.life <= 0 || p.position.z > camera.position.z) { specialParticlePool.deactivate(p); } }

                // --- Player Movement ---
                let minX = 0, maxX = 0; nefeshState.forEach(state => { if (state.active) { if(state.targetPos.x < minX) minX = state.targetPos.x; if(state.targetPos.x > maxX) maxX = state.targetPos.x; } });
                const halfFormationWidth = (maxX - minX) / 2; const maxMove = (roadWidth / 2) - halfFormationWidth; targetCubeX = Math.max(-maxMove, Math.min(maxMove, targetCubeX));
                nefeshGroup.position.x = THREE.MathUtils.lerp(nefeshGroup.position.x, targetCubeX, 0.1); nefeshGroup.position.z = THREE.MathUtils.lerp(nefeshGroup.position.z, 0, 0.2); cameraTargetPos.x = nefeshGroup.position.x / 4;
                
                // --- Player State & Nefesh Update ---
                if(gameState.combo.timer > 0) gameState.combo.timer -= deltaTime; else if (gameState.combo.count > 0) { gameState.combo.count = 0; ui.comboNotifier.classList.remove('show'); }
                if(gameState.player.hasRegen) { gameState.player.regenTimer += deltaTime; if(gameState.player.regenTimer > 15) { gameState.player.regenTimer = 0; if(gameState.nefesh > 0 && gameState.nefesh < MAX_NEFESH) adjustNefeshCount(1); } }
                const troopHalfSize = 0.4; let activeNefeshCount = 0; const tempMatrix = new THREE.Matrix4(); const tempQuaternion = new THREE.Quaternion();
                nefeshState.forEach((state, i) => {
                    if (!state.active) { tempMatrix.makeScale(0, 0, 0); nefeshTopInstanced.setMatrixAt(i, tempMatrix); nefeshBottomInstanced.setMatrixAt(i, tempMatrix); return; }
                    activeNefeshCount++;
                    state.currentPos.lerp(state.targetPos, 0.15);
                    state.collisionBox2D.min.set(nefeshGroup.position.x + state.currentPos.x - troopHalfSize, nefeshGroup.position.z + state.currentPos.z - troopHalfSize);
                    state.collisionBox2D.max.set(nefeshGroup.position.x + state.currentPos.x + troopHalfSize, nefeshGroup.position.z + state.currentPos.z + troopHalfSize);
                    if(state.currentScale < state.targetScale) { state.currentScale = THREE.MathUtils.lerp(state.currentScale, state.targetScale, 0.2); }
                    state.yRotation += deltaTime * 2;
                    // B"H Bugfix: Ensure shooting only happens for truly active units at the time of firing.
                    if (state.active && currentTime - state.lastShotTime > gameState.player.fireRate) { worldPosVec.copy(state.currentPos).add(nefeshGroup.position); worldPosVec.y = 0.4; fireSpark(worldPosVec, gameState.player.projectileDamage, gameState.player.hasPierce); state.lastShotTime = currentTime; }
                    tempQuaternion.setFromEuler(new THREE.Euler(0, state.yRotation, 0)); tempMatrix.compose(new THREE.Vector3(state.currentPos.x, state.currentPos.y + 0.2, state.currentPos.z), tempQuaternion, new THREE.Vector3(state.currentScale, state.currentScale, state.currentScale)); nefeshTopInstanced.setMatrixAt(i, tempMatrix);
                    tempQuaternion.setFromEuler(new THREE.Euler(Math.PI, -state.yRotation, 0)); tempMatrix.compose(new THREE.Vector3(state.currentPos.x, state.currentPos.y - 0.2, state.currentPos.z), tempQuaternion, new THREE.Vector3(state.currentScale, state.currentScale, state.currentScale)); nefeshBottomInstanced.setMatrixAt(i, tempMatrix);
                });
                nefeshTopInstanced.instanceMatrix.needsUpdate = true; nefeshBottomInstanced.instanceMatrix.needsUpdate = true; nefeshTopInstanced.count = activeNefeshCount; nefeshBottomInstanced.count = activeNefeshCount;

                // --- Obstacle & Enemy Logic ---
                const troopsToDestroy = new Set();
                
                // B"H: This function processes a single obstacle. It's called for each active obstacle from each pool
                // to avoid creating a new array of all obstacles every frame, which improves performance.
                const processObstacle = (obstacle) => {
                    obstacle.position.z += currentRoadSpeed * deltaTime;
                    if (obstacle.userData.collisionBox2D) { const obsSizeX = obstacle.userData.type === 'jar' ? 1.6 : (obstacle.userData.type === 'golem_sentry' ? 1.5 : 3.0); const obsSizeZ = obstacle.userData.type === 'jar' ? 1.6 : (obstacle.userData.type === 'golem_sentry' ? 1.5 : 0.5); obstacle.userData.collisionBox2D.setFromCenterAndSize({ x: obstacle.position.x, y: obstacle.position.z }, { x: obsSizeX, y: obsSizeZ }); }
                    if (obstacle.position.z > obstacleRemovalZ) { if (obstacle.userData.type === 'klipah_gate') klipahGatePool.deactivate(obstacle); else if (obstacle.userData.type === 'jar') jarPool.deactivate(obstacle); else if (obstacle.userData.type === 'tohu_shard') tohuShardPool.deactivate(obstacle); else if (obstacle.userData.type === 'golem_sentry') golemSentryPool.deactivate(obstacle); return; }
                    if (obstacle.userData.type === 'golem_sentry' && currentTime - obstacle.userData.lastShotTime > 3500 - (gameState.level * 100)) { obstacle.userData.lastShotTime = currentTime; obstacle.userData.eye.material.color.setHex(0xffffff); setTimeout(() => obstacle.userData.eye.material.color.setHex(0xff0000), 200); let projPool = Math.random() < 0.33 && gameState.level > 5 ? golemHeavyProjectilePool : (Math.random() < 0.66 && gameState.level > 2 ? golemFastProjectilePool : golemProjectilePool); let proj = projPool.activate(); if (proj) { obstacle.userData.eye.getWorldPosition(proj.position); proj.userData.type = projPool === golemHeavyProjectilePool ? 'heavy' : (projPool === golemFastProjectilePool ? 'fast' : 'normal'); if(proj.userData.type === 'heavy') proj.userData.damage = 5 + Math.floor(gameState.level / 4); } }
                    if (obstacle.userData.type === 'tohu_shard') { const spikeHalfSize = 0.3; obstacle.userData.body.children.forEach(spikeGroup => { spikeGroup.getWorldPosition(worldPosVec); spikeGroup.userData.collisionBox2D.setFromCenterAndSize({x: worldPosVec.x, y: worldPosVec.z}, {x: spikeHalfSize, y: spikeHalfSize}); nefeshState.forEach((state, index) => { if (!state.active || troopsToDestroy.has(index)) return; if (spikeGroup.userData.collisionBox2D.intersectsBox(state.collisionBox2D)) { troopsToDestroy.add(index); triggerFlash('#ff00ff', 200); } }); }); } else { nefeshState.forEach((state, index) => { if (!state.active || troopsToDestroy.has(index)) return; if (obstacle.userData.collisionBox2D.intersectsBox(state.collisionBox2D)) { switch (obstacle.userData.type) { case 'jar': troopsToDestroy.add(index); triggerScreenShake(0.1); obstacle.userData.health--; if(obstacle.userData.health <= 0) { jarPool.deactivate(obstacle); updateCombo(50, obstacle.position); shatterObject(obstacle.userData.body); } else { updateJarHealthVisuals(obstacle); } break; case 'klipah_gate': if(obstacle.userData.currentValue > 0) { gameState.mitzvot += obstacle.userData.currentValue; ui.mitzvotDisplay.style.transform = "scale(1.2)"; setTimeout(() => ui.mitzvotDisplay.style.transform = "scale(1.0)", 100); } adjustNefeshCount(obstacle.userData.currentValue); if (!obstacle.userData.isPurified) triggerScreenShake(0.4); else createParticleExplosion(obstacle.position, 20, 0x00ff00, 10); klipahGatePool.deactivate(obstacle); break; case 'golem_sentry': troopsToDestroy.add(index); triggerScreenShake(0.2); break; } } }); }
                }

                // B"H: Iterate over each obstacle pool directly to avoid creating a new array each frame.
                klipahGatePool.active.forEach(processObstacle);
                jarPool.active.forEach(processObstacle);
                tohuShardPool.active.forEach(processObstacle);
                golemSentryPool.active.forEach(processObstacle);

                for(const proj of [...golemProjectilePool.active, ...golemFastProjectilePool.active, ...golemHeavyProjectilePool.active]) { const speed = proj.userData.type === 'fast' ? 45 : (proj.userData.type === 'heavy' ? 18 : 25); proj.position.z += speed * deltaTime; if(proj.position.z > obstacleRemovalZ) { if (proj.userData.type === 'normal') golemProjectilePool.deactivate(proj); else if (proj.userData.type === 'fast') golemFastProjectilePool.deactivate(proj); else golemHeavyProjectilePool.deactivate(proj); continue; } nefeshState.forEach((state, index) => { if(!state.active || troopsToDestroy.has(index)) return; if(checkInstancedCollision(state, proj)) { const color = proj.material.color.getHexString(); if(proj.userData.type === 'heavy') { adjustNefeshCount(-proj.userData.damage); createParticleExplosion(proj.position, 40, `#${color}`, 20); triggerFlash(`#${color}`, 400); triggerFovKick(15); triggerScreenShake(0.6); } else { troopsToDestroy.add(index); createParticleExplosion(proj.position, 20, `#${color}`, 15); triggerFlash(`#${color}`, 300); triggerFovKick(10); triggerScreenShake(0.3); } if (proj.userData.type === 'normal') golemProjectilePool.deactivate(proj); else if (proj.userData.type === 'fast') golemFastProjectilePool.deactivate(proj); else golemHeavyProjectilePool.deactivate(proj); } }); }
                if(troopsToDestroy.size > 0) { shatterElement(ui.nefeshDisplay); troopsToDestroy.forEach(index => destroyNefesh(index)); gameState.nefesh = nefeshState.filter(s => s.active).length; if (gameState.nefesh <= 0 && gameState.current === 'playing') endGame(); }
                
                // ======================================================================================
                // B"H: Atzmut - The interaction between Light (Ohr) and Vessel (Kli), where potential is actualized.
                // --- [START] ROBUST PLAYER PROJECTILE UPDATE & COLLISION LOOP ---
                // ======================================================================================
                const tempSparkMatrix = new THREE.Matrix4();
                let activeSparkCount = 0;
                
                // B"H: This function checks for collision between a single spark and a single obstacle.
                const checkSparkCollision = (spark, obstacle) => {
                    if (!spark.active || Math.abs(obstacle.position.z - spark.position.z) > 2) return;
                    
                    collisionVec2.set(spark.position.x, spark.position.z);
                    if (obstacle.userData.collisionBox2D && obstacle.userData.collisionBox2D.containsPoint(collisionVec2)) {
                        if (spark.pierceCounter <= 0) { spark.active = false; }
                        else { spark.pierceCounter--; }

                        switch(obstacle.userData.type) {
                            case 'klipah_gate':
                                obstacle.userData.currentValue += spark.damage;
                                createParticleExplosion(spark.position, 3, obstacle.userData.isPurified ? '#ffd700' : '#888888', 5);
                                if (!obstacle.userData.isPurified && obstacle.userData.currentValue >= 0) {
                                    obstacle.userData.isPurified = true; updateCombo(25, obstacle.position); createParticleExplosion(obstacle.position, 40, 0x00ff00, 18);
                                    const shockwave = new THREE.Mesh(new THREE.TorusGeometry(1, 0.1, 8, 32), new THREE.MeshBasicMaterial({color: 0x00ff00, transparent: true, opacity: 0.8})); shockwave.position.copy(obstacle.position); shockwave.rotation.x = Math.PI / 2; scene.add(shockwave); activeShockwaves.add({mesh: shockwave, life: 1.0});
                                }
                                updateKlipahGateVisuals(obstacle);
                                break;
                            case 'jar':
                            case 'golem_sentry':
                                obstacle.userData.health -= spark.damage;
                                createParticleExplosion(spark.position, 5, '#ffffff', 8);
                                if (obstacle.userData.health <= 0) {
                                    triggerScreenShake(0.3); shatterObject(obstacle.userData.body); createParticleExplosion(obstacle.position, 80, 0xffe4b5, 25); updateCombo(75, obstacle.position); const light = new THREE.PointLight(0xffaa55, 8, 30, 2); light.position.copy(obstacle.position); scene.add(light); activeLights.add(light);
                                    if(obstacle.userData.type === 'jar') jarPool.deactivate(obstacle); else golemSentryPool.deactivate(obstacle);
                                } else if (obstacle.userData.type === 'jar') {

                                }

                        }

                };

                for (let i = 0; i < MAX_SPARKS; i++) {

                        continue;
                    }
                    
                    // B"H: Check spark collision against each obstacle pool directly for performance.
                    klipahGatePool.active.forEach(obstacle => checkSparkCollision(spark, obstacle));
                    jarPool.active.forEach(obstacle => checkSparkCollision(spark, obstacle));
                    tohuShardPool.active.forEach(obstacle => checkSparkCollision(spark, obstacle));
                    golemSentryPool.active.forEach(obstacle => checkSparkCollision(spark, obstacle));
                    
                    if (spark.active) {
                        tempSparkMatrix.makeTranslation(spark.position.x, spark.position.y, spark.position.z);
                        sparkInstancedMesh.setMatrixAt(i, tempSparkMatrix);
                    } else {
                        tempSparkMatrix.makeScale(0, 0, 0);
                        sparkInstancedMesh.setMatrixAt(i, tempSparkMatrix);
                    }
                }
                sparkInstancedMesh.instanceMatrix.needsUpdate = true;
                sparkInstancedMesh.count = activeSparkCount;
                // ======================================================================================
                // --- [END] PROJECTILE LOGIC ---
                // ======================================================================================

                // --- Final Updates ---
                for(const orb of shefaOrbPool.active) { orb.position.lerp(nefeshGroup.position, 0.08); orb.position.addScaledVector(orb.userData.velocity, deltaTime); orb.userData.velocity.lerp(new THREE.Vector3(0,0,0), 0.1); if(orb.position.distanceTo(nefeshGroup.position) < 1.5) { addShefa( orb.userData.value ); createParticleExplosion(orb.position, 3, 0xffd700, 5); shefaOrbPool.deactivate(orb); } }
                
                const updateDynamicParticle = p => {
                     p.position.addScaledVector(p.userData.velocity, deltaTime);
                     p.userData.velocity.y -= 25 * deltaTime;
                     p.userData.life -= deltaTime;
                     if(p.material && p.material.opacity) p.material.opacity = p.userData.life;
                     if (p.userData.type === 'shard') { p.rotation.x += p.userData.rotationSpeed.x * deltaTime; p.rotation.y += p.userData.rotationSpeed.y * deltaTime; }
                     if (p.userData.life <= 0) {
                         if(p.userData.type === 'particle') particlePool.deactivate(p);
                         else { scene.remove(p); dynamicShards.delete(p); }
                     }
                };

                particlePool.active.forEach(updateDynamicParticle);
                dynamicShards.forEach(updateDynamicParticle);

                activeLights.forEach(light => { light.intensity -= 25 * deltaTime; if(light.intensity <= 0) { scene.remove(light); activeLights.delete(light); } });
                activeShockwaves.forEach(sw => { sw.life -= 2 * deltaTime; sw.mesh.scale.multiplyScalar(1 + 5 * deltaTime); sw.mesh.material.opacity = sw.life; if(sw.life <= 0) { scene.remove(sw.mesh); activeShockwaves.delete(sw); } });
                camera.position.lerp(cameraTargetPos, 0.1);
                if (shakeIntensity > 0) { camera.position.add(new THREE.Vector3().randomDirection().multiplyScalar(shakeIntensity)); shakeIntensity = Math.max(0, shakeIntensity - deltaTime * 4.0); }
                if (fovKick > 0) { camera.fov = originalFOV + fovKick; fovKick = Math.max(0, fovKick - deltaTime * 50); } else { camera.fov = THREE.MathUtils.lerp(camera.fov, originalFOV, 0.1); }

        function updateUIDisplays() {

        }
        
        // --- INITIALIZATION ---
        // B"H: The beginning of the journey, where the Will to Create becomes the Act of Creation.
        (async () => {
            try {
                // Attempt to initialize the database, but don't let it stop the game if it fails

                await initDB();
            } catch (dbError) {
                console.warn("Could not initialize IndexedDB. Settings will not be saved or loaded.", dbError);

                displayGlobalError("Fatal error during startup. The application cannot continue.");
            }
        })();
