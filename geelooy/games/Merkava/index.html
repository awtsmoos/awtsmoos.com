        /**
         * A universal function for setting up listeners for the settings panel controls.
         * It handles input, change events, saving to the database, and reapplying settings.
         * @param {HTMLElement} element - The input element (slider, checkbox, etc.).
         * @param {HTMLElement | null} valueSpan - The span element to display the current value, if any.
         * @param {string} settingName - The key of the setting in IndexedDB.
         * @param {function(*, boolean?): *} parseFunc - A function to parse the value from the element.
         */
        const setupSettingListener = (element, valueSpan, settingName, parseFunc) => {
            element.addEventListener('input', e => { if(valueSpan) valueSpan.textContent = e.target.value; });
            element.addEventListener('change', async e => {
                try {
                    const value = parseFunc(e.target.value, e.target.checked);
                    await saveSetting(settingName, value);
                    await applySettings();
                } catch(err) {
                    console.error(`Failed to save setting ${settingName}:`, err);
                }
            });
        };
        
        setupSettingListener(ui.maxNefeshSlider, ui.maxNefeshValue, 'maxNefesh', parseInt);
        ui.particleCharsTextarea.addEventListener('change', async e => { try { await saveSetting('particleChars', e.target.value); await applySettings(); } catch(err) { console.error('Failed to save particle chars:', err); } });
        setupSettingListener(ui.shakeIntensitySlider, ui.shakeIntensityValue, 'shakeIntensity', parseFloat);
        setupSettingListener(ui.flashIntensitySlider, ui.flashIntensityValue, 'flashIntensity', parseFloat);
        setupSettingListener(ui.effectsIntensitySlider, ui.effectsIntensityValue, 'effectsIntensity', parseFloat);
        setupSettingListener(ui.shatterCountSlider, ui.shatterCountValue, 'shatterCount', parseInt);
        setupSettingListener(ui.shatterSpeedSlider, ui.shatterSpeedValue, 'shatterSpeed', parseInt);
        setupSettingListener(ui.minParticleSizeSlider, ui.minParticleSizeValue, 'minParticleSize', parseFloat);
        setupSettingListener(ui.maxParticleSizeSlider, ui.maxParticleSizeValue, 'maxParticleSize', parseFloat);
        setupSettingListener(ui.particleSpawnRadiusSlider, ui.particleSpawnRadiusValue, 'particleSpawnRadius', parseInt);
        setupSettingListener(ui.captionFontInput, null, 'captionFont', val => val);
        setupSettingListener(ui.captionColorPicker, null, 'captionColor', val => val);
        setupSettingListener(ui.inGameCaptionFontInput, null, 'captionFont', val => val);
        setupSettingListener(ui.inGameCaptionColorPicker, null, 'captionColor', val => val);
        setupSettingListener(ui.enableWebcamCheckbox, null, 'enableWebcam', (val, checked) => checked);
        setupSettingListener(ui.webcamPerNefeshCheckbox, null, 'webcamPerNefesh', (val, checked) => checked);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; 
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        /**
         * Checks for collision between an instanced nefesh unit and another 3D object's point-like position.
         * This is used for projectiles hitting the player formation.
         * @param {object} nefeshStateItem - The state object of the nefesh instance from the `nefeshState` array.
         * @param {THREE.Object3D} otherObject - The other object (projectile) to check collision against.
         * @returns {boolean} True if a collision is detected, false otherwise.
         */
        function checkInstancedCollision(nefeshStateItem, otherObject) {
             otherObject.getWorldPosition(worldPosVec);
             collisionVec2.set(worldPosVec.x, worldPosVec.z);
             return nefeshStateItem.collisionBox2D.containsPoint(collisionVec2);
        }

        /**
         * REWRITTEN LOGIC: The main game loop, called by requestAnimationFrame.
         * This function has been heavily revised to fix all major gameplay bugs.
         * - Collision detection for both player projectiles and enemy projectiles is now accurate.
         * - Bounding boxes are updated correctly every frame.
         * - An atomic destruction system (`troopsToDestroy`) prevents incorrect player units from being destroyed.
         * @param {DOMHighResTimeStamp} currentTime - The current time provided by the browser.
         */
        function animate(currentTime) {
            animationFrameId = requestAnimationFrame(animate);
            try {
                if(gameState.current !== 'playing' || !gameState) return;
                
                const deltaTime = Math.min(0.05, clock.getDelta()); // Delta time, capped to prevent physics bugs on lag.
                const currentRoadSpeed = roadBaseSpeed + gameState.level * 1.5;

                // Smoothly transition background color between levels.
                if (!gameState.color.current.equals(gameState.color.target)) {
                    gameState.color.current.lerp(gameState.color.target, 0.5 * deltaTime);
                    renderer.setClearColor(gameState.color.current);
                    if(scene.fog) scene.fog.color.copy(gameState.color.current);
                }
                
                // Animate road texture to give illusion of forward movement in sync with enemies.
                if(road && road.material.map && roadTextureTileLength > 0) {
                    road.material.map.offset.y += (currentRoadSpeed / roadTextureTileLength) * deltaTime;
                }
                
                // Animate and loop the starfields.
                const starSpeed = 20 + gameState.level * 2;
                starField1.position.z += starSpeed * deltaTime; starField2.position.z += starSpeed * deltaTime;
                if(starField1.position.z > 250) starField1.position.z -= 500;
                if(starField2.position.z > 250) starField2.position.z -= 500;
                
                // Randomly spawn special background particles.
                const spawnChance = Math.min(0.95, 0.4 + (gameState.level * 0.025));
                if (Math.random() < spawnChance) spawnSpecialParticle();
                
                // Update special particles (movement, lifetime, fade out).
                for (const p of specialParticlePool.active) {
                    p.position.addScaledVector(p.userData.velocity, deltaTime);
                    p.userData.life -= deltaTime;
                    p.material.opacity = Math.sin(Math.max(0, p.userData.life) * 0.5 * Math.PI) * 0.7;
                    if (p.userData.life <= 0 || p.position.z > camera.position.z) {
                        specialParticlePool.deactivate(p);
                    }
                }

                // --- PLAYER MOVEMENT ---
                // Calculate the width of the current formation to clamp movement within the road.
                let minX = 0, maxX = 0;
                nefeshState.forEach(state => {
                    if (state.active) {
                        if(state.targetPos.x < minX) minX = state.targetPos.x;
                        if(state.targetPos.x > maxX) maxX = state.targetPos.x;
                    }
                });
                const halfFormationWidth = (maxX - minX) / 2;
                const maxMove = (roadWidth / 2) - halfFormationWidth;
                targetCubeX = Math.max(-maxMove, Math.min(maxMove, targetCubeX)); // Clamp target position.
                // Smoothly interpolate the group's position towards the target.
                nefeshGroup.position.x = THREE.MathUtils.lerp(nefeshGroup.position.x, targetCubeX, 0.1);
                nefeshGroup.position.z = THREE.MathUtils.lerp(nefeshGroup.position.z, 0, 0.2); // Bobbing effect.
                cameraTargetPos.x = nefeshGroup.position.x / 4; // Camera follows player slightly.
                
                // Update combo timer and reset if it runs out.
                if(gameState.combo.timer > 0) gameState.combo.timer -= deltaTime;
                else if (gameState.combo.count > 0) { gameState.combo.count = 0; ui.comboNotifier.classList.remove('show'); }

                // Handle passive Nefesh regeneration if upgrade is acquired.
                if(gameState.player.hasRegen) {
                    gameState.player.regenTimer += deltaTime;
                    if(gameState.player.regenTimer > 15) {
                        gameState.player.regenTimer = 0;
                        if(gameState.nefesh > 0 && gameState.nefesh < MAX_NEFESH) adjustNefeshCount(1);
                    }
                }
                
                // --- NEFESH UPDATE AND SHOOTING ---
                const troopHalfSize = 0.4;
                let activeNefeshCount = 0;
                const tempMatrix = new THREE.Matrix4();
                const tempQuaternion = new THREE.Quaternion();

                nefeshState.forEach((state, i) => {
                    if (!state.active) { // If inactive, scale to zero to hide it.
                        tempMatrix.makeScale(0, 0, 0);
                        nefeshTopInstanced.setMatrixAt(i, tempMatrix);
                        nefeshBottomInstanced.setMatrixAt(i, tempMatrix);
                        return;
                    }
                    activeNefeshCount++;

                    // Move the Nefesh from its current position towards its fixed target position in the formation.
                    state.currentPos.lerp(state.targetPos, 0.15);

                    // CRITICAL FIX: We must update the 2D bounding box for *this specific Nefesh unit* (`state`)
                    // using its unique `currentPos` relative to the moving `nefeshGroup` on EVERY FRAME.
                    // This ensures its collision box is exactly where the unit appears on screen.
                    state.collisionBox2D.min.set(nefeshGroup.position.x + state.currentPos.x - troopHalfSize, nefeshGroup.position.z + state.currentPos.z - troopHalfSize);
                    state.collisionBox2D.max.set(nefeshGroup.position.x + state.currentPos.x + troopHalfSize, nefeshGroup.position.z + state.currentPos.z + troopHalfSize);
                    
                    // Animate scale-in effect when first spawned.
                    if(state.currentScale < state.targetScale) {
                        state.currentScale = THREE.MathUtils.lerp(state.currentScale, state.targetScale, 0.2);
                    }
                    
                    state.yRotation += deltaTime * 2; // Constant rotation.

                    // Check fire rate and fire a projectile if ready using the NEW, ROBUST fireSpark function.
                    if (currentTime - state.lastShotTime > gameState.player.fireRate) {
                        // Calculate the precise world position of this specific Nefesh unit to fire from.
                        worldPosVec.copy(state.currentPos).add(nefeshGroup.position);
                        worldPosVec.y = 0.4;
                        // Call the corrected, reliable fireSpark function.
                        fireSpark(worldPosVec, gameState.player.projectileDamage, gameState.player.hasPierce);
                        state.lastShotTime = currentTime;
                    }
                    
                    // Update the matrices for the instanced meshes (top and bottom cones).
                    tempQuaternion.setFromEuler(new THREE.Euler(0, state.yRotation, 0));
                    tempMatrix.compose(
                        new THREE.Vector3(state.currentPos.x, state.currentPos.y + 0.2, state.currentPos.z),
                        tempQuaternion,
                        new THREE.Vector3(state.currentScale, state.currentScale, state.currentScale)
                    );
                    nefeshTopInstanced.setMatrixAt(i, tempMatrix);
                    
                    tempQuaternion.setFromEuler(new THREE.Euler(Math.PI, -state.yRotation, 0)); // Inverted for bottom cone.
                    tempMatrix.compose(
                        new THREE.Vector3(state.currentPos.x, state.currentPos.y - 0.2, state.currentPos.z),
                        tempQuaternion,
                        new THREE.Vector3(state.currentScale, state.currentScale, state.currentScale)
                    );
                    nefeshBottomInstanced.setMatrixAt(i, tempMatrix);
                });
                // Tell Three.js to update the instanced mesh data on the GPU.
                nefeshTopInstanced.instanceMatrix.needsUpdate = true;
                nefeshBottomInstanced.instanceMatrix.needsUpdate = true;
                nefeshTopInstanced.count = activeNefeshCount;
                nefeshBottomInstanced.count = activeNefeshCount;

                // --- OBSTACLE UPDATE AND COLLISION (PLAYER vs OBSTACLE) ---
                // An atomic Set is used to collect the indices of Nefesh units that need to be destroyed *in this frame*.
                // This prevents race conditions where a single unit might be added multiple times.
                const troopsToDestroy = new Set();
                const allActiveObstacles = [...klipahGatePool.active, ...jarPool.active, ...tohuShardPool.active, ...golemSentryPool.active];
                
                for (const obstacle of allActiveObstacles) {
                    // Move obstacle towards player, in sync with the road.
                    obstacle.position.z += currentRoadSpeed * deltaTime;

                    // CRITICAL COLLISION FIX: The bounding box for each obstacle must be updated every frame to match
                    // its new position. This was the primary bug causing player-obstacle collision to fail.
                    if (obstacle.userData.collisionBox2D) {
                        const obsSizeX = obstacle.userData.type === 'jar' ? 1.6 : (obstacle.userData.type === 'golem_sentry' ? 1.5 : 3.0);
                        const obsSizeZ = obstacle.userData.type === 'jar' ? 1.6 : (obstacle.userData.type === 'golem_sentry' ? 1.5 : 0.5);
                        obstacle.userData.collisionBox2D.setFromCenterAndSize(
                            { x: obstacle.position.x, y: obstacle.position.z },
                            { x: obsSizeX, y: obsSizeZ }
                        );
                    }
                    
                    // Deactivate obstacles that have passed the camera.
                    if (obstacle.position.z > obstacleRemovalZ) {
                        if (obstacle.userData.type === 'klipah_gate') klipahGatePool.deactivate(obstacle);
                        else if (obstacle.userData.type === 'jar') jarPool.deactivate(obstacle);
                        else if (obstacle.userData.type === 'tohu_shard') tohuShardPool.deactivate(obstacle);
                        else if (obstacle.userData.type === 'golem_sentry') golemSentryPool.deactivate(obstacle);
                        continue;
                    }
                    
                    // Handle Golem Sentry shooting logic.
                    if (obstacle.userData.type === 'golem_sentry' && currentTime - obstacle.userData.lastShotTime > 3500 - (gameState.level * 100)) {
                        obstacle.userData.lastShotTime = currentTime;
                        obstacle.userData.eye.material.color.setHex(0xffffff); // Flash eye before shooting.
                        setTimeout(() => obstacle.userData.eye.material.color.setHex(0xff0000), 200);

                        const attackRoll = Math.random();
                        let projPool = attackRoll < 0.33 && gameState.level > 5 ? golemHeavyProjectilePool : (attackRoll < 0.66 && gameState.level > 2 ? golemFastProjectilePool : golemProjectilePool);
                        let proj = projPool.activate();
                        if (proj) {
                           obstacle.userData.eye.getWorldPosition(proj.position);
                           proj.userData.type = projPool === golemHeavyProjectilePool ? 'heavy' : (projPool === golemFastProjectilePool ? 'fast' : 'normal');
                           if(proj.userData.type === 'heavy') proj.userData.damage = 5 + Math.floor(gameState.level / 4);
                        }
                    }
                    
                    // CORRECTED COLLISION: Check for direct Nefesh-Obstacle impact using the newly updated bounding boxes.
                    if (obstacle.userData.type === 'tohu_shard') {
                        // For complex shapes like the tohu shard, we check each individual spike.
                        const spikeHalfSize = 0.3;
                        obstacle.userData.body.children.forEach(spikeGroup => {
                            spikeGroup.getWorldPosition(worldPosVec);
                            spikeGroup.userData.collisionBox2D.setFromCenterAndSize({x: worldPosVec.x, y: worldPosVec.z}, {x: spikeHalfSize, y: spikeHalfSize});
                            nefeshState.forEach((state, index) => {
                                // Important: Only check active units that haven't already been marked for destruction this frame.
                                if (!state.active || troopsToDestroy.has(index)) return;
                                // If this specific spike's box intersects with this specific Nefesh's box...
                                if (spikeGroup.userData.collisionBox2D.intersectsBox(state.collisionBox2D)) {
                                    // ...we add THIS Nefesh's specific index to the set. This ensures the correct one is destroyed.
                                    troopsToDestroy.add(index);
                                    triggerFlash('#ff00ff', 200);
                                }
                            });
                        });
                    } else {
                        // For simpler obstacles, check against the main body's updated collision box.
                        nefeshState.forEach((state, index) => {
                            if (!state.active || troopsToDestroy.has(index)) return;
                            // If the obstacle's box intersects with this specific Nefesh's box...
                            if (obstacle.userData.collisionBox2D.intersectsBox(state.collisionBox2D)) {
                                // ...the logic proceeds for this specific `index`.
                                switch (obstacle.userData.type) {
                                    case 'jar':
                                        troopsToDestroy.add(index); triggerScreenShake(0.1);
                                        obstacle.userData.health--;
                                        if(obstacle.userData.health <= 0) {
                                            jarPool.deactivate(obstacle); updateCombo(50, obstacle.position);
                                            shatterObject(obstacle.userData.body);
                                        } else { updateJarHealthVisuals(obstacle); }
                                        break;
                                    case 'klipah_gate':
                                        // A Klipah gate collision is special: it affects the whole formation, not just one unit.
                                        if(obstacle.userData.currentValue > 0) { 
                                            gameState.mitzvot += obstacle.userData.currentValue;
                                            ui.mitzvotDisplay.style.transform = "scale(1.2)"; setTimeout(() => ui.mitzvotDisplay.style.transform = "scale(1.0)", 100);
                                        }
                                        adjustNefeshCount(obstacle.userData.currentValue);
                                        if (!obstacle.userData.isPurified) triggerScreenShake(0.4);
                                        else createParticleExplosion(obstacle.position, 20, 0x00ff00, 10);
                                        klipahGatePool.deactivate(obstacle);
                                        break;
                                    case 'golem_sentry':
                                        // A direct collision with a Golem also destroys the specific touching Nefesh.
                                        troopsToDestroy.add(index);
                                        triggerScreenShake(0.2);
                                        break;
                                }
                            }
                        });
                    }
                }
                
                // --- PROJECTILE UPDATE AND COLLISION (ENEMY vs PLAYER) ---
                // Handle enemy projectile movement and collision with player.
                for(const proj of [...golemProjectilePool.active, ...golemFastProjectilePool.active, ...golemHeavyProjectilePool.active]) {
                    const speed = proj.userData.type === 'fast' ? 45 : (proj.userData.type === 'heavy' ? 18 : 25);
                    proj.position.z += speed * deltaTime;
                    if(proj.position.z > obstacleRemovalZ) { // Despawn if off-screen.
                        if (proj.userData.type === 'normal') golemProjectilePool.deactivate(proj);
                        else if (proj.userData.type === 'fast') golemFastProjectilePool.deactivate(proj);
                        else golemHeavyProjectilePool.deactivate(proj);
                        continue;
                    }
                    // Check for collision with each active Nefesh using its up-to-date collision box.
                    nefeshState.forEach((state, index) => {
                        if(!state.active || troopsToDestroy.has(index)) return;
                        // Use the point-based collision for small projectiles.
                        if(checkInstancedCollision(state, proj)) {
                            const color = proj.material.color.getHexString();
                            if(proj.userData.type === 'heavy') {
                                // Heavy projectiles cause bulk damage via adjustNefeshCount.
                                adjustNefeshCount(-proj.userData.damage);
                                createParticleExplosion(proj.position, 40, `#${color}`, 20);
                                triggerFlash(`#${color}`, 400); triggerFovKick(15); triggerScreenShake(0.6);
                            } else {
                                // Normal projectiles destroy only the specific unit they hit.
                                troopsToDestroy.add(index);
                                createParticleExplosion(proj.position, 20, `#${color}`, 15);
                                triggerFlash(`#${color}`, 300); triggerFovKick(10); triggerScreenShake(0.3);
                            }
                            // Deactivate projectile on hit.
                            if (proj.userData.type === 'normal') golemProjectilePool.deactivate(proj);
                            else if (proj.userData.type === 'fast') golemFastProjectilePool.deactivate(proj);
                            else golemHeavyProjectilePool.deactivate(proj);
                        }
                    });
                }
                
                // ATOMIC DESTRUCTION: After all collision checks for the frame are done, process all destructions at once.
                // This atomic operation prevents the "wrong" Nefesh from being destroyed and other race conditions.
                if(troopsToDestroy.size > 0) {
                    shatterElement(ui.nefeshDisplay);
                    // We call destroyNefesh for each unique index that was flagged in a collision.
                    troopsToDestroy.forEach(index => destroyNefesh(index));
                    // After destruction, we recount the active Nefesh.
                    gameState.nefesh = nefeshState.filter(s => s.active).length;
                    if (gameState.nefesh <= 0 && gameState.current === 'playing') endGame();
                }
                
                // ======================================================================================
                // --- [START] REWRITTEN PLAYER PROJECTILE LOGIC ---
                // This entire block replaces the old, flawed logic for player bullets.
                // It ensures bullets are moved, checked for collision, and deactivated correctly,
                // which prevents the bullet pool from saturating and stopping the player from firing.
                // ======================================================================================
                let activeSparkCount = 0;
                const tempSparkMatrix = new THREE.Matrix4(); // A reusable matrix for performance.

                sparkState.forEach((spark, i) => {
                    // 1. SKIP INACTIVE SPARKS: If a spark isn't active, hide its matrix and skip all processing.
                    if (!spark.active) {
                        tempSparkMatrix.makeScale(0, 0, 0); // An invisible matrix.
                        sparkInstancedMesh.setMatrixAt(i, tempSparkMatrix);
                        return; // Continue to the next spark in the loop.
                    }
                    activeSparkCount++;
                    
                    // 2. MOVEMENT: Move the active spark forward (away from the player).
                    spark.position.z -= 60 * deltaTime;
                    
                    // 3. OFF-SCREEN CHECK: This is a crucial deactivation step. If the spark is too far,
                    // deactivate it so its slot can be reused. This prevents pool saturation.
                    if (spark.position.z < -100) {
                        spark.active = false;
                        return; // The spark is now inactive, so we can skip to the next one.
                    }
                    
                    // 4. COLLISION DETECTION: Check this spark against all active obstacles.
                    for (const obstacle of allActiveObstacles) {
                        // Optimization: A quick check to see if the obstacle is even close to the spark on the Z-axis.
                        if (!obstacle.userData.collisionBox2D || obstacle.position.z > spark.position.z + 1 || obstacle.position.z < spark.position.z - 1) {
                            continue; // Skip to next obstacle if it's not nearby.
                        }

                        // The CORE COLLISION CHECK: Use the obstacle's continuously-updated 2D bounding box
                        // to see if it contains the spark's 3D position.
                        if (obstacle.userData.collisionBox2D.containsPoint(spark.position)) {
                            let deactivateSpark = true; // Assume the spark will be destroyed on hit.
                            
                            switch(obstacle.userData.type) {
                                case 'klipah_gate':
                                    obstacle.userData.currentValue += spark.damage; // Shooting a gate purifies it.
                                    createParticleExplosion(spark.position, 3, obstacle.userData.isPurified ? '#ffd700' : '#888888', 5);
                                    if (!obstacle.userData.isPurified && obstacle.userData.currentValue >= 0) {
                                        obstacle.userData.isPurified = true; updateCombo(25, obstacle.position);
                                        createParticleExplosion(obstacle.position, 40, 0x00ff00, 18);
                                        const shockwave = new THREE.Mesh(new THREE.TorusGeometry(1, 0.1, 8, 32), new THREE.MeshBasicMaterial({color: 0x00ff00, transparent: true, opacity: 0.8}));
                                        shockwave.position.copy(obstacle.position); shockwave.rotation.x = Math.PI / 2;
                                        scene.add(shockwave); activeShockwaves.add({mesh: shockwave, life: 1.0});
                                    }
                                    updateKlipahGateVisuals(obstacle);
                                    break;
                                case 'jar': case 'golem_sentry':
                                    obstacle.userData.health -= spark.damage;
                                    createParticleExplosion(spark.position, 5, '#ffffff', 8);
                                    
                                    // PIERCE LOGIC: If the player has the pierce upgrade and the spark hasn't hit anything yet,
                                    // we increment its pierced counter and tell it *not* to deactivate.
                                    if (gameState.player.hasPierce && spark.pierced < 1) {
                                        spark.pierced++;
                                        deactivateSpark = false; // Override deactivation.
                                    }

                                    if (obstacle.userData.health <= 0) { // If obstacle is destroyed...
                                        triggerScreenShake(0.3); shatterObject(obstacle.userData.body);
                                        createParticleExplosion(obstacle.position, 80, 0xffe4b5, 25);
                                        updateCombo(75, obstacle.position);
                                        const light = new THREE.PointLight(0xffaa55, 8, 30, 2);
                                        light.position.copy(obstacle.position); scene.add(light); activeLights.add(light);
                                        if(obstacle.userData.type === 'jar') jarPool.deactivate(obstacle); else golemSentryPool.deactivate(obstacle);
                                    } else if (obstacle.userData.type === 'jar') {
                                        updateJarHealthVisuals(obstacle);
                                    }
                                    break;
                            }
                            
                            // 5. DEACTIVATION ON HIT: If the spark should be deactivated, flip its state.
                            if (deactivateSpark) {
                                spark.active = false;
                                break; // IMPORTANT: Exit the inner for-loop (obstacles). This spark is spent and needs no more checks.
                            }
                        }
                    }
                    
                    // 6. UPDATE INSTANCE MATRIX: After all checks, if the spark is *still* active, update its
                    // matrix to its new position for rendering. Otherwise, its matrix has already been hidden.
                    if (spark.active) {
                        tempSparkMatrix.makeTranslation(spark.position.x, spark.position.y, spark.position.z);
                        sparkInstancedMesh.setMatrixAt(i, tempSparkMatrix);
                    } else {
                        // If the spark was deactivated in the collision logic, ensure its matrix is now hidden.
                         tempSparkMatrix.makeScale(0,0,0);
                         sparkInstancedMesh.setMatrixAt(i, tempSparkMatrix);
                    }
                });
                // After checking all sparks, tell THREE.js to upload the new matrix data to the GPU.
                sparkInstancedMesh.instanceMatrix.needsUpdate = true;
                sparkInstancedMesh.count = activeSparkCount;
                // ======================================================================================
                // --- [END] REWRITTEN PLAYER PROJECTILE LOGIC ---
                // ======================================================================================
                
                // --- OTHER DYNAMIC OBJECTS ---
                // Update Shefa orbs (move towards player).
                for(const orb of shefaOrbPool.active) {
                    orb.position.lerp(nefeshGroup.position, 0.08); 
                    orb.position.addScaledVector(orb.userData.velocity, deltaTime);
                    orb.userData.velocity.lerp(new THREE.Vector3(0,0,0), 0.1);
                    if(orb.position.distanceTo(nefeshGroup.position) < 1.5) { 
                        addShefa(orb.userData.value); 
                        createParticleExplosion(orb.position, 3, 0xffd700, 5); 
                        shefaOrbPool.deactivate(orb); 
                    }
                }
                // Update simple particles and shards (gravity, lifetime).
                [...particlePool.active, ...dynamicShards].forEach(p => {
                    p.position.addScaledVector(p.userData.velocity, deltaTime); 
                    p.userData.velocity.y -= 25 * deltaTime; // Simple gravity.
                    p.userData.life -= deltaTime;
                    if(p.material && p.material.opacity) p.material.opacity = p.userData.life;
                    if (p.userData.type === 'shard') { p.rotation.x += p.userData.rotationSpeed.x * deltaTime; p.rotation.y += p.userData.rotationSpeed.y * deltaTime; }
                    if (p.userData.life <= 0) { 
                        if(p.userData.type === 'particle') particlePool.deactivate(p); 
                        else { scene.remove(p); dynamicShards.delete(p); } 
                    }
                });

                // Update temporary lights and shockwaves (fade out).
                activeLights.forEach(light => { light.intensity -= 25 * deltaTime; if(light.intensity <= 0) { scene.remove(light); activeLights.delete(light); } });
                activeShockwaves.forEach(sw => {
                    sw.life -= 2 * deltaTime; sw.mesh.scale.multiplyScalar(1 + 5 * deltaTime); sw.mesh.material.opacity = sw.life;
                    if(sw.life <= 0) { scene.remove(sw.mesh); activeShockwaves.delete(sw); }
                });

                // --- CAMERA UPDATE ---
                camera.position.lerp(cameraTargetPos, 0.1);
                if (shakeIntensity > 0) {
                    camera.position.add(new THREE.Vector3().randomDirection().multiplyScalar(shakeIntensity));
                    shakeIntensity = Math.max(0, shakeIntensity - deltaTime * 4.0);
                }
                if (fovKick > 0) {
                    camera.fov = originalFOV + fovKick;
                    fovKick = Math.max(0, fovKick - deltaTime * 50);
                } else { camera.fov = THREE.MathUtils.lerp(camera.fov, originalFOV, 0.1); }
                camera.updateProjectionMatrix();
                
                // --- FINAL FRAME LOGIC ---
                trySpawnPattern(); // Check if new obstacles need to be spawned.
                updateUIDisplays(); // Update all HUD elements.
                renderer.render(scene, camera); // Render the final frame.
            } catch (error) {
                console.error("A critical error occurred in the animation loop:", error);
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                }
                displayGlobalError("A critical error in the game loop forced a stop.");
                showMainMenu(); // Fallback to main menu instead of game over, more stable
            }
        }
        
        /**
         * Updates the main heads-up display (Mitzvot, Nefesh, Shefa bar).
         */
        function updateUIDisplays() {
            if (!gameState || gameState.current !== 'playing') return;
            ui.mitzvotDisplay.textContent = `MITZVOT: ${Math.floor(gameState.mitzvot)}`;
            ui.nefeshDisplay.textContent = `NEFESH: ${gameState.nefesh}`;
            const shefaPercentage = Math.min(100, (gameState.shefa / gameState.shefaToAscend) * 100);
            ui.shefaBar.style.width = `${shefaPercentage}%`;
        }
        
        /**
         * This is the entry point of the entire script. It initializes the database,
         * sets up game objects, loads settings, and shows the main menu.
         */
        (async () => {
            try {
                await initDB();
                setupInstancedNefesh(); // This now sets up the static formation.
                await applySettings();
                showMainMenu();
            } catch(error) {
                console.error("Critical error during initial setup:", error);
                document.body.innerHTML = `<div style="color: white; text-align: center; padding-top: 50px; font-size: 2em; font-family: Arial, sans-serif;">A critical error occurred during setup. Please refresh the page or check the console.</div>`;
                displayGlobalError("Fatal error during startup. App cannot continue.");
            }
        })();

    </script>
</body>
