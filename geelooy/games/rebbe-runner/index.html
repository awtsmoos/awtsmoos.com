<!-- B"H — Rebbe Runner: 3-lane endless runner through Brooklyn. -->
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
	<meta name="theme-color" content="#0b1426">
	<title>Rebbe Runner — Run Through Brooklyn</title>
	<link rel="stylesheet" href="./runner.css?v=5025eb19d1">
	<link rel="stylesheet" href="/games/scripts/wardrobe/wardrobe.css?v=75fe2ac447">
	<link rel="stylesheet" href="/games/css/awtsmoos-webgl-check.css?v=b21e0bf110">
	<link rel="stylesheet" href="/games/css/awtsmoos-game-base.css?v=128b430115">
</head>
<body class="rr">
	<div id="rr-root" class="rr__root">
		<canvas id="rr-canvas" class="rr__canvas" aria-label="Rebbe Runner gameplay"></canvas>

		<!-- Loading screen -->
		<div id="rr-loading" class="rr__loading" role="status" aria-live="polite">
			<div class="rr__loading-card">
				<div class="rr__loading-aleph" aria-hidden="true">א</div>
				<h1 class="rr__loading-title">Rebbe Runner</h1>
				<p class="rr__loading-sub">Run through Brooklyn · Collect the Torah</p>
				<div class="rr__loading-bar"><span id="rr-loading-fill"></span></div>
				<p id="rr-loading-tip" class="rr__loading-tip">Swipe left / right to switch lanes</p>
				<button id="rr-start" class="rr__btn rr__btn--primary" type="button" hidden>Tap to Run</button>
				<p id="rr-loading-error" class="rr__loading-error" hidden></p>
			</div>
		</div>

		<!-- HUD -->
		<div id="rr-hud" class="rr__hud" hidden>
			<div class="rr__hud-left">
				<div class="rr__score"><span id="rr-score">0</span><small>SCORE</small></div>
				<div class="rr__best"><span id="rr-best">0</span><small>BEST</small></div>
			</div>
			<div class="rr__hud-right">
				<div class="rr__hearts" id="rr-hearts" aria-label="Hearts">♥♥♥</div>
				<div class="rr__torah"><span aria-hidden="true">📜</span><span id="rr-torah">0</span></div>
				<button id="rr-pause" class="rr__iconbtn" type="button" aria-label="Pause">⏸</button>
			</div>
		</div>

		<!-- Touch controls -->
		<div id="rr-controls" class="rr__controls" hidden>
			<div class="rr__controls-left">
				<button class="rr__ctl" type="button" data-move="left" aria-label="Move left">◀</button>
				<button class="rr__ctl" type="button" data-move="right" aria-label="Move right">▶</button>
			</div>
			<div class="rr__controls-right">
				<button class="rr__ctl rr__ctl--jump" type="button" data-move="jump" aria-label="Jump">⤒<small>jump</small></button>
				<button class="rr__ctl" type="button" data-move="slide" aria-label="Slide">⤓<small>slide</small></button>
			</div>
		</div>

		<!-- Pause / game-over overlay -->
		<div id="rr-overlay" class="rr__overlay" hidden>
			<div class="rr__card">
				<h2 id="rr-card-title">Paused</h2>
				<p id="rr-card-sub" class="rr__card-sub"></p>
				<div class="rr__card-stats">
					<div><span id="rr-final-score">0</span><small>score</small></div>
					<div><span id="rr-final-torah">0</span><small>torahs</small></div>
					<div><span id="rr-final-dist">0m</span><small>distance</small></div>
				</div>
				<button id="rr-primary" class="rr__btn rr__btn--primary" type="button">Run Again</button>
				<button id="rr-resume" class="rr__btn" type="button" hidden>Resume</button>
			</div>
		</div>

		<div id="rr-flash" class="rr__flash" aria-hidden="true"></div>
	</div>
	<script src="/games/js/awtsmoos-webgl-check.js?v=6498bdf075"></script>
	<script type="module" src="./js/rr/boot.js?v=b66c3b6efc"></script>
</body>
</html>
