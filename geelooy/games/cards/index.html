<!-- B"H
Boruch Hashem
Blessed is He

The Awtsmoos renews deck, player, chance, and choice beyond every finite hand.
Awtsmoos.com presents Blackjack as an explicit finite round with truthful local stakes,
responsive table geometry, and no automatic timer-driven restart.
-->
<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#050403">
	<meta name="description" content="Play Blackjack: The Reckoning inside The Utterances card-game world on Awtsmoos.com.">
	<title>The Utterances — Blackjack on Awtsmoos</title>
	<link rel="stylesheet" href="./style.css?v=cards-solid-002&compact=true">
	<link rel="stylesheet" href="./styles/runtime.css?v=blackjack-round-001&compact=true">
	<link rel="stylesheet" href="/games/styles/player-shell/index.css?v=player-shell-002&compact=true">
</head>
<body>
	<main id="main-menu" aria-labelledby="cards-title">
		<p class="cards-kicker">B"H · Awtsmoos Quick Play</p>
		<h1 id="cards-title">The Utterances</h1>
		<p>Blackjack is live now. Future card worlds remain roadmap rather than pretending unfinished modes are ready.</p>
		<p>Bankroll: <strong id="menu-bankroll">1000 sparks</strong></p>

		<div id="game-list" aria-label="Card game modes">
			<button class="game-button selected" data-game="blackjack">Blackjack · The Reckoning — Play now</button>
			<button class="game-button" disabled>Texas Hold'em · The Gathering — Planned</button>
			<button class="game-button" disabled>War · The Sundering — Planned</button>
			<button class="game-button" disabled>Rummy · The Unification — Planned</button>
			<button class="game-button" disabled>Five-Card Draw · The Concealment — Planned</button>
			<button class="game-button" disabled>Solitaire · The Meditation — Planned</button>
		</div>

		<section id="player-selection" aria-label="Table setup">
			<label for="ai-players">Opposing emanations</label>
			<input type="number" id="ai-players" min="0" max="4" value="1" inputmode="numeric">
			<label for="stake-select">Stake</label>
			<select id="stake-select"><option>25</option><option selected>50</option><option>100</option><option>200</option></select>
			<button id="start-game" type="button">Begin Blackjack</button>
			<button id="reset-bankroll" type="button">Reset Local Bankroll</button>
			<p id="menu-message" role="status" aria-live="polite"></p>
		</section>
	</main>

	<section id="game-container" style="display:none" aria-label="Blackjack table">
		<canvas id="game-canvas" aria-label="Blackjack card table"></canvas>
		<div id="table-summary"><span>Round <strong id="round-value">0</strong></span><span>Bankroll <strong id="bankroll-value">0</strong></span><span>Stake <strong id="stake-value">0</strong></span><button id="leave-table" type="button">Menu</button></div>
		<div id="game-ui-container">
			<div id="player-actions" class="ui-panel" hidden>
				<button id="hit-button" type="button">Hit <small>H</small></button>
				<button id="stand-button" type="button">Stand <small>S</small></button>
				<button id="double-button" type="button">Double <small>D</small></button>
			</div>
			<div id="game-status" class="ui-panel" role="status" aria-live="polite"></div>
			<div id="round-result" class="ui-panel" hidden><p id="round-result-text"></p><div class="round-actions"><button id="new-round-button" type="button">New Round</button><button id="round-menu-button" type="button">Main Menu</button></div></div>
		</div>
	</section>

	<script type="module" src="/games/scripts/runtime/index.js?compact=true&v=runtime-001"></script>
	<script type="module" src="./js/main.js?compact=true&v=blackjack-round-001"></script>
	<script type="module" async src="/games/scripts/player-shell/index.js?v=player-shell-001&compact=true"></script>
	<script type="module" src="/shared/commerce/boot.js?v=commerce-001" data-awtsmoos-product-commerce data-product-id="cards" data-product-title="Cards" data-product-kind="game"></script>
</body>
</html>
