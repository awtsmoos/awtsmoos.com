<!doctype html>
<!--B"H-->
<!--Boruch Hashem-->
<!--Blessed is He-->
<!--
	Sefira Clash is a many-doored vessel: lived cities, physical interiors, shlichus,
	measured hands and feet, Expedition roads, synchronization, Adventure, VS, and co-op.
	The Awtsmoos renews them through Awtsmoos.com while this document keeps landmarks clear.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"
		/>
		<meta name="theme-color" content="#07040d" />
		<meta
			name="description"
			content="Sefira Clash: a 2D lived Open World with walk-in cities, shlichus, merchants, trainers, Expedition roads, co-op, Adventure, and pure arena VS."
		/>
		<title>Sefira Clash · Open World, Expedition, Co-op, Adventure &amp; VS</title>
		<link rel="stylesheet" href="./style.css" />
		<link rel="stylesheet" href="./css/expedition.css" />
		<link rel="stylesheet" href="./css/expedition-components.css" />
		<link rel="stylesheet" href="./css/expedition-services.css" />
		<link rel="stylesheet" href="./css/expedition-weather.css" />
		<link rel="stylesheet" href="./css/expedition-sync.css" />
		<link rel="stylesheet" href="./css/open-world.css" />
		<link rel="stylesheet" href="./css/open-world-services.css" />
	</head>
	<body>
		<main class="shell">
			<section class="topbar" aria-label="game settings">
				<div>
					<h1>Sefira Clash</h1>
					<p id="statusText">
						Lived 2D cities · shlichus · measured combat · Expedition · co-op ·
						Adventure · VS
					</p>
				</div>
				<label>
					<span>Bots</span>
					<select id="botSelect">
						<option>3</option>
						<option selected>5</option>
						<option>7</option>
					</select>
				</label>
				<label>
					<span>Sound</span>
					<select id="soundSelect">
						<option value="all">All</option>
						<option value="hits">Hits</option>
						<option value="world">World</option>
						<option value="off">Off</option>
					</select>
				</label>
				<button id="restart" type="button">Menu</button>
				<button id="debugToggle" type="button">Debug</button>
			</section>

			<canvas id="olam" aria-label="Sefira Clash battlefield and lived city"></canvas>
			<section id="menuOverlay" class="menuOverlay" aria-live="polite"></section>
			<section
				id="openWorldOverlay"
				class="openWorldOverlay hidden"
				aria-live="polite"
				aria-label="open world civic service"
			></section>

			<section id="touchControls" class="touchControls" aria-label="mobile game controls">
				<div id="stick" class="stick" aria-label="move, aim, fast-fall, and ledge drop">
					<span></span>
				</div>
				<div class="touchButtons">
					<button class="primary" data-act="punch" aria-label="punch">
						<span class="touchIcon">👊</span><span class="touchLabel">Punch</span>
					</button>
					<button class="primary" data-act="kick" aria-label="kick">
						<span class="touchIcon">🦵</span><span class="touchLabel">Kick</span>
					</button>
					<button class="primary jumpButton" data-act="jump" aria-label="jump">
						<span class="touchIcon">↟</span><span class="touchLabel">Jump</span>
					</button>
					<button class="utility" data-act="interact" aria-label="interact or enter">
						<span class="touchIcon">↵</span><span class="touchLabel">Enter</span>
					</button>
					<button class="utility" data-act="grab" aria-label="grab">
						<span class="touchIcon">🤝</span><span class="touchLabel">Grab</span>
					</button>
					<button class="utility" data-act="shield" aria-label="shield">
						<span class="touchIcon">🛡️</span><span class="touchLabel">Guard</span>
					</button>
					<button class="utility wide" data-act="special" aria-label="special recovery">
						<span class="touchIcon">✨</span
						><span class="touchLabel">Special / Recover</span>
					</button>
				</div>
			</section>
		</main>
		<script type="module" src="./js/main.js"></script>
	</body>
</html>
