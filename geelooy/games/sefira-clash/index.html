<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Sefira Clash</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div>
        <h1>Sefira Clash</h1>
        <p id="statusText">A/D move · W/Space jump · F punch · G kick</p>
      </div>
      <label>Bots <select id="botSelect"><option>3</option><option selected>5</option><option>7</option></select></label>
      <label>Sound <select id="soundSelect"><option value="all">All</option><option value="hits">Hits</option><option value="world">World</option><option value="off">Off</option></select></label>
      <button id="restart">Menu</button>
      <button id="debugToggle">Debug</button>
    </section>
    <canvas id="olam"></canvas>
    <section id="menuOverlay" class="menuOverlay"></section>
    <section id="touchControls" class="touchControls">
      <div id="stick" class="stick" aria-label="move; push up to jump"><span></span></div>
      <div class="touchButtons">
        <button data-act="punch" aria-label="punch">👊</button>
        <button data-act="kick" aria-label="kick">🦵</button>
      </div>
    </section>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
