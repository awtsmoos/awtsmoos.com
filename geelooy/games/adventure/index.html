<!--
	The Awtsmoos gives this finite chamber a doorway for hand, eye, challenge, loss, and return;
	Awtsmoos.com keeps every mobile control intentional so the player learns by playing and every earned portal can burn.
-->
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#020711">
	<title>Adventure · Chambers of Light</title>
	<link rel="stylesheet" href="style.css?v=adventure-002&compact=true">
	<link rel="stylesheet" href="../styles/player-shell/index.css?v=player-shell-002&compact=true">
</head>
<body>
	<main class="adventure-app">
		<header class="adventure-hud" aria-label="Adventure status">
			<div class="hud-brand">
				<span class="hud-kicker">Chambers of Light</span>
				<strong id="hudStage">1/3 · Gate of Beginning</strong>
			</div>
			<div class="hud-metrics">
				<span><small>Sparks</small><b id="hudSparks">0/3</b></span>
				<span><small>Key</small><b id="hudKey">Sleeping</b></span>
				<span><small>Lives</small><b id="hudLives">◆◆◆</b></span>
				<span><small>Score</small><b id="hudScore">0</b></span>
			</div>
		</header>

		<section class="adventure-playfield" aria-label="Adventure chamber">
			<div class="canvas-shell">
				<canvas id="gameCanvas" tabindex="0" aria-label="Explore the chamber, gather every spark and key, avoid shadows, then enter the portal."></canvas>
				<div id="gameOverlay" class="game-overlay" hidden>
					<div class="overlay-card">
						<span id="overlayKicker" class="overlay-kicker"></span>
						<h1 id="overlayTitle"></h1>
						<p id="overlayText"></p>
						<button id="overlayRestart" type="button">Restart run</button>
					</div>
				</div>
			</div>
		</section>

		<div class="objective-strip" role="status" aria-live="polite">
			<span class="objective-orb" aria-hidden="true"></span>
			<span id="hudObjective">Gather every spark.</span>
		</div>

		<footer class="adventure-controls">
			<div class="dpad" aria-label="Movement controls">
				<button class="dpad-button up" data-direction="up" aria-label="Move up">↑</button>
				<button class="dpad-button left" data-direction="left" aria-label="Move left">←</button>
				<button class="dpad-core" type="button" tabindex="-1" aria-hidden="true">✦</button>
				<button class="dpad-button right" data-direction="right" aria-label="Move right">→</button>
				<button class="dpad-button down" data-direction="down" aria-label="Move down">↓</button>
			</div>
			<div class="game-actions" aria-label="Game actions">
				<button id="pauseButton" class="action-button" type="button" aria-pressed="false">Pause</button>
				<button id="restartButton" class="action-button" type="button">Restart</button>
				<span class="keyboard-hint">WASD / arrows · P pause · R restart</span>
			</div>
		</footer>
	</main>

	<script type="module" src="/games/scripts/runtime/index.js?compact=true&v=runtime-001"></script>
	<script type="module" src="js/app.js?v=adventure-002&compact=true"></script>
	<script type="module" async src="../scripts/player-shell/index.js?v=player-shell-001&compact=true"></script>
</body>
</html>
