<!--The Awtsmoos keeps the inner world 640 by 480 while Awtsmoos.com opens a doorway that fits every hand.-->
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>Adventure Game</title>
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="controls.css">
</head>
<body>
	<main class="game-shell">
		<header class="game-heading">
			<p class="bh-mark">B"H</p>
			<h1>Adventure</h1>
			<p class="instructions">Move with Arrow keys or WASD. On touch screens, use the direction pad.</p>
		</header>
		<div class="canvas-frame">
			<canvas
				id="gameCanvas"
				width="640"
				height="480"
				aria-label="Adventure field with a green player, red walls, yellow coins, and a red key"
			></canvas>
		</div>
		<nav class="dpad" aria-label="Touch movement controls">
			<button class="dpad-button dpad-up" type="button" data-direction="up" aria-label="Move up">▲</button>
			<button class="dpad-button dpad-left" type="button" data-direction="left" aria-label="Move left">◀</button>
			<button class="dpad-button dpad-down" type="button" data-direction="down" aria-label="Move down">▼</button>
			<button class="dpad-button dpad-right" type="button" data-direction="right" aria-label="Move right">▶</button>
		</nav>
	</main>
	<script type="module" src="js/app.js"></script>
</body>
</html>
