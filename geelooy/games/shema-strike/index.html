<!-- B"H — Shema Strike: 2D platformer with the chossid. Strike with the Shema. -->
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
	<meta name="theme-color" content="#0b1426">
	<title>Shema Strike — 2D Platformer</title>
	<link rel="stylesheet" href="./platformer.css?v=12966af8e1">
	<link rel="stylesheet" href="/games/css/awtsmoos-webgl-check.css?v=b21e0bf110">
	<link rel="stylesheet" href="/games/css/awtsmoos-game-base.css?v=128b430115">
</head>
<body class="ss">
	<script src="/games/shared/awt-loading-screen.js?v=c26d57a33e"
		data-cover="https://awtsmoos.com/api/social/drive/public/awtsmoos/covers/games/game-shema-strike.webp?v=50ac06d11e"
		data-title="Shema Strike"
		data-kicker="B&quot;H · Awtsmoos Games"
		data-tips="Strike with the Shema — every gate awakens in turn.|Dash through danger; invulnerability is brief.|Spend פרוטות wisely at the Night Market."
		data-accent="#ffd700"></script>
	<div id="ss-root" class="ss__root">
		<canvas id="ss-canvas" class="ss__canvas" aria-label="Shema Strike gameplay"></canvas>

		<!-- Loading screen -->
		<div id="ss-loading" class="ss__loading" role="status" aria-live="polite">
			<div class="ss__loading-card">
				<div class="ss__loading-shema" aria-hidden="true">שמע</div>
				<h1 class="ss__loading-title">Shema Strike</h1>
				<p class="ss__loading-sub">Strike with the Shema · Gather the sparks</p>
				<div class="ss__loading-bar"><span id="ss-loading-fill"></span></div>
				<p id="ss-loading-tip" class="ss__loading-tip">Arrow keys or swipe to move — jump the gaps</p>
				<button id="ss-start" class="ss__btn ss__btn--primary" type="button" hidden>Tap to Strike</button>
				<p id="ss-loading-error" class="ss__loading-error" hidden></p>
			</div>
		</div>

		<!-- HUD -->
		<div id="ss-hud" class="ss__hud" hidden>
			<div class="ss__hud-left">
				<div class="ss__koach"><span class="ss__koach-label">KOACH</span><div class="ss__koach-bar"><span id="ss-health"></span></div></div>
				<div class="ss__level"><span id="ss-level-name">Gate 1</span></div>
			</div>
			<div class="ss__hud-right">
				<div class="ss__sparks"><span aria-hidden="true">✦</span><span id="ss-sparks">0</span></div>
				<button id="ss-pause" class="ss__iconbtn" type="button" aria-label="Pause">⏸</button>
			</div>
		</div>

		<!-- Touch controls -->
		<div id="ss-controls" class="ss__controls" hidden>
			<div class="ss__controls-left">
				<button class="ss__ctl" type="button" data-move="left" aria-label="Move left">◀</button>
				<button class="ss__ctl" type="button" data-move="right" aria-label="Move right">▶</button>
			</div>
			<div class="ss__controls-right">
				<button class="ss__ctl ss__ctl--jump" type="button" data-move="jump" aria-label="Jump">⤒<small>jump</small></button>
				<button class="ss__ctl ss__ctl--strike" type="button" data-move="strike" aria-label="Strike">ש<small>strike</small></button>
			</div>
		</div>

		<!-- Pause / level-complete / game-over overlay -->
		<div id="ss-overlay" class="ss__overlay" hidden>
			<div class="ss__card">
				<h2 id="ss-card-title">Paused</h2>
				<p id="ss-card-sub" class="ss__card-sub"></p>
				<div class="ss__card-stats">
					<div><span id="ss-final-sparks">0</span><small>sparks</small></div>
					<div><span id="ss-final-level">1</span><small>gate</small></div>
				</div>
				<button id="ss-primary" class="ss__btn ss__btn--primary" type="button">Strike Again</button>
				<button id="ss-resume" class="ss__btn" type="button" hidden>Resume</button>
				<button id="ss-next" class="ss__btn ss__btn--primary" type="button" hidden>Next Gate →</button>
			</div>
		</div>

		<div id="ss-flash" class="ss__flash" aria-hidden="true"></div>
	</div>
	<script src="/games/js/awtsmoos-webgl-check.js?v=6498bdf075"></script>
	<script type="module" src="./js/ss/boot.js?v=9f6d3e6bf5"></script>
</body>
</html>
