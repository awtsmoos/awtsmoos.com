<!DOCTYPE html>
<!-- The `lang` attribute helps screen readers and search engines understand the page's language. -->
<html lang="en">
<head>
    <!-- Specifies the character encoding for the document. UTF-8 is the standard. -->
    <meta charset="UTF-8">

    <!--
      The viewport meta tag is crucial for responsive design and mobile devices.
      - `width=device-width`: Sets the width of the page to follow the screen-width of the device.
      - `initial-scale=1.0`: Sets the initial zoom level when the page is first loaded.
      - `user-scalable=no`: Prevents the user from zooming in/out, which is desirable for a fullscreen game experience.
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- The title that appears in the browser tab. -->
    <title>Shema's Edge</title>

    <!-- Links the external CSS file to style the HTML elements. -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!--
      This is the main container for the entire game.
      It's used to establish a positioning context (`position: relative` in CSS)
      so that all child elements (canvas, UI screens, controls) can be absolutely
      positioned within it. It also controls the game's aspect ratio.
    -->
    <div id="game-container">

        <!--
          The Canvas element is the drawing board for the game.
          Initially, it lives on the main DOM, but its rendering control
          will be transferred to a Web Worker via OffscreenCanvas to
          ensure smooth, non-blocking graphics.
        -->
        <canvas id="gameCanvas"></canvas>

        <!--
          This container holds all on-screen controls for mobile/touch devices.
          It is hidden by default (`display: none` in CSS) and will be made visible
          by JavaScript (`controls.js`) only if a touch device is detected.
        -->
        <div id="mobile-controls">
            <!-- The left area for the virtual joystick. -->
            <div id="joystick-area">
                <div id="joystick-thumb"></div>
            </div>
            <!-- The right area for the primary action (strike) button. -->
            <div id="action-button-area">
                <div id="action-button">⚔️</div>
            </div>
        </div>

        <!--
          The Start Screen overlay. This is a simple div that sits on top of the
          canvas until the player starts the game. It uses absolute positioning
          and a high z-index to appear in front.
        -->
        <div id="start-screen">
            <h1>Shema's Edge</h1>
            <p>The forces of chaos gather. Wield the blade of Unity.</p>
            <p><b>Desktop:</b> Arrow Keys/WASD to Move & Jump. SPACE to Strike.</p>
            <p><b>Mobile:</b> Use Joystick and Strike Button.</p>
            <button id="start-button">BEGIN THE FIGHT</button>
        </div>

        <!--
          The Game Over screen overlay. It is hidden by default and will be
          made visible by `main.js` when it receives a 'gameOver' message
          from the game worker.
        -->
        <div id="game-over-screen">
            <h1>GAME OVER</h1>
            <p>The darkness has prevailed... for now.</p>
            <button id="restart-button">FIGHT AGAIN</button>
        </div>
    </div>

    <!-- ================================== -->
    <!--          SCRIPT LOADING            -->
    <!-- ================================== -->
    <!--
      IMPORTANT: The script loading strategy has changed for the Web Worker architecture.
      We only load the scripts that are absolutely necessary for the main UI thread to function.
      All other game logic scripts (player, enemy, world, etc.) are now loaded *inside*
      the `game-worker.js` file using the `importScripts()` function.
    -->

    <!--
      1. `controls.js`: This must be loaded first because `main.js` creates an instance
         of the `Controls` class to listen for user input.
    -->
    <script src="js/controls.js"></script>

    <!--
      2. `main.js`: This is the main entry point for the UI thread. It sets up the worker,
         handles UI overlays, and passes control events to the worker. It must be loaded last.
    -->
    <script src="js/main.js"></script>

</body>
</html>
