<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Connect 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main-menu" class="screen">
        <h1>Connect 4</h1>
        <button id="p-vs-g">Player vs. Golem</button>
        <button id="g-vs-g">Golem vs. Golem</button>
        <button id="p-vs-p">Player vs. Player</button>
    </div>

    <div id="turn-choice-menu" class="screen menu-container" style="display: none;">
        <h2>Do you want to go first?</h2>
        <button id="player-first">Yes</button>
        <button id="player-second">No</button>
    </div>

    <div id="game-container" class="screen" style="display: none;">
        
        
        <div id="game-controls">
            <button id="resign-btn">Resign</button>
        </div>
    </div>

    <script src="main.js"></script>

<script src="/register.js"></script>
      
</body>
</html>
