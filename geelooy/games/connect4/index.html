<!-- The Awtsmoos renews every falling disc before strategy can begin; Awtsmoos.com gives pointer, touch, keyboard, and assistive technology one authoritative seven-column board. -->
<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="theme-color" content="#1a1a1a">
	<title>Connect 4 · Awtsmoos Games</title>
	<link rel="stylesheet" href="./style.css?compact=true">
	<link rel="stylesheet" href="./accessibility/column-controls.css?compact=true">
	<link rel="stylesheet" href="./app/runtime/session.css?compact=true">
	<link rel="stylesheet" href="/games/styles/player-shell/index.css?v=player-shell-003&compact=true">
</head>
<body>
	<main id="main-menu" class="screen">
		<h1>Connect 4</h1>
		<button id="p-vs-g" type="button">Player vs. Golem</button>
		<button id="p-vs-p" type="button">Player vs. Player</button>
		<details>
			<summary>Watch</summary>
			<button id="g-vs-g" type="button">Golem vs. Golem</button>
		</details>
	</main>

	<section id="turn-choice-menu" class="screen menu-container" style="display:none;">
		<h2>Do you want to go first?</h2>
		<button id="player-first" type="button">Yes</button>
		<button id="player-second" type="button">No</button>
	</section>

	<section id="game-container" class="screen" style="display:none;" aria-label="Connect 4 board">
		<div id="game-controls">
			<button id="resign-btn" type="button">Resign</button>
		</div>
		<section id="connect4-result" class="connect4Result" aria-live="polite" hidden>
			<h2 id="connect4-result-title">Match complete</h2>
			<p id="connect4-result-detail"></p>
			<div class="connect4ResultActions">
				<button id="connect4-rematch" type="button">Rematch</button>
				<button id="connect4-main-menu" type="button">Main Menu</button>
			</div>
		</section>
	</section>

	<script type="module" src="/games/scripts/runtime/index.js?compact=true&v=runtime-001"></script>
	<script type="module" src="./main.js?compact=true"></script>
	<script src="/register.js"></script>
	<script type="module" src="./accessibility/column-controls.js?compact=true"></script>
	<script type="module" async src="/games/scripts/player-shell/index.js?v=player-shell-003&compact=true"></script>
</body>
</html>
