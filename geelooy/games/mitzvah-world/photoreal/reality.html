<!DOCTYPE html>
<!-- B"H — Reality Engine photorealism scene (branch: reality-photorealism) -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reality Engine — Photorealism</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0f14; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  #hud { position: fixed; left: 12px; bottom: 10px; color: #cfe3d0; font: 12px/1.4 system-ui, sans-serif;
         background: rgba(10,20,12,.55); padding: 6px 10px; border-radius: 8px; pointer-events: none; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">reality-photorealism · <span id="viewname"></span></div>
<script type="module">
import { buildRealityScene } from './js/reality-scene.mjs';
const params = new URLSearchParams(location.search);
const view = params.get('view') || 'forest';
const tod = params.get('tod') || 'golden';
const rs = params.has('rs') ? Math.min(1, Math.max(0.5, parseFloat(params.get('rs')) || 1)) : 1;
document.getElementById('viewname').textContent = view + (tod !== 'golden' ? ' · ' + tod : '');
try {
  await buildRealityScene(document.getElementById('app'), { view, fast: params.get('fast') === '1', tod, renderScale: rs });
  window.__realityReady = true;
  window.__realityView = view;
  // B"H speed mission: event-driven readiness signal (no CDP polling stalls).
  const signalPort = params.get('signalPort');
  if (signalPort) {
    fetch(`http://127.0.0.1:${signalPort}/ready?view=${encodeURIComponent(view)}`).catch(() => {});
  }
} catch (err) {
  window.__realityError = String(err && err.stack || err);
  document.getElementById('hud').textContent = 'ERROR: ' + window.__realityError.slice(0, 300);
  // report to the daemon/capture harness if present
  try {
    const qs = new URLSearchParams(location.search);
    const signalPort = qs.get('signalPort'), sp = qs.get('sp');
    if (signalPort) {
      fetch(`http://127.0.0.1:${signalPort}/err?${sp ? `sp=${encodeURIComponent(sp)}` : ''}`, {
        method: 'POST', body: window.__realityError.slice(0, 2000),
      }).catch(() => {});
    }
  } catch {}
}
</script>
</body>
</html>
