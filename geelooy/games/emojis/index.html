class ShooterEnemy extends Enemy { constructor(x, y, size, emoji, speed, health) { super(x, y, size, emoji, speed, health); this.state = 'descending'; this.stopY = k.height - (Math.random() * (k.height * 0.3) + (k.height * 0.1)); this.shootTimer = Date.now() + 1500; this.baseScore = 200; } update(timeScale=1) { super.update(timeScale); if (this.state === 'descending') { if (this.y <= this.stopY) this.state = 'shooting'; } else if (this.state === 'shooting' && player) { if (Date.now() > this.shootTimer) { const angle = Math.atan2(player.y - this.y, player.x - this.x); const speed = 7 * Math.sqrt(difficulty); const vx = Math.cos(angle) * speed; const vy = Math.sin(angle) * speed; gameObjects.push(new EnemyBullet(this.x, this.y, vx, vy)); playSound('enemy_shoot'); this.shootTimer = Date.now() + (2500 / difficulty); } } } }
class DasherEnemy extends Enemy { constructor(x, y, size, emoji, speed, health) { super(x, y, size, emoji, speed, health); this.state = 'descending'; this.stopY = k.height - (Math.random() * (k.height * 0.4) + (k.height * 0.1)); this.pauseTime = 0; this.vx = 0; this.vy = 0; this.baseScore = 250; } update(timeScale=1) { if (this.state === 'descending') { this.y -= this.speed * timeScale; if (this.y <= this.stopY) { this.state = 'pausing'; this.pauseTime = Date.now() + 750 / Math.sqrt(difficulty); } } else if (this.state === 'pausing') { if (Date.now() >= this.pauseTime && player) { this.state = 'dashing'; playSound('dash'); const angle = Math.atan2(player.y - this.y, player.x - this.x); this.vx = Math.cos(angle) * this.speed * 3; this.vy = Math.sin(angle) * this.speed * 3; } } else if (this.state === 'dashing') { this.x += this.vx * timeScale; this.y += this.vy * timeScale; if (this.y > k.height + this.size || this.y < -this.size || this.x < -this.size || this.x > k.width + this.size) this.toBeRemoved = true; } } }
class HeavyEnemy extends Enemy { constructor(x,y,size,emoji,speed,health) { super(x,y,size,emoji,speed,health); this.baseScore=500; } }
class GematriaBox extends Enemy { constructor(x,y) { super(x,y,70, '💠', 1.5, 100); this.value = -10; this.baseScore = 0; } takeDamage() { this.value++; this.hitTimer=5; playSound('hit'); return false; } draw() { super.draw(); const valueColor = this.value < 0 ? `rgb(255, ${Math.floor(255 * (1 - Math.abs(this.value)/10))}, ${Math.floor(255 * (1 - Math.abs(this.value)/10))})` : `rgb(${Math.floor(255 * (1 - Math.min(this.value,26)/26))}, 255, ${Math.floor(255 * (1 - Math.min(this.value,26)/26))})`; ctx.fillStyle = valueColor; ctx.font = 'bold 24px Arial'; ctx.fillText(this.value, this.x, this.y + this.radius); ctx.font = 'bold 20px Arial'; ctx.fillText(numberToGematria(this.value), this.x, this.y + this.radius + 25); } }
class PowerUp extends GameObject { constructor(x, y, type) { const c=POWERUP_TYPES[type]; super(x, y, 50, c.emoji); this.type=type; this.speed=2; } update(timeScale=1) { this.y -= this.speed * timeScale; if (this.y < -this.size) this.toBeRemoved = true; } draw() { ctx.save(); const gr = this.radius + 10 * Math.abs(Math.sin(Date.now()*0.005)); const grad = ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,gr); grad.addColorStop(0, 'rgba(0,255,255,0.7)'); grad.addColorStop(1, 'rgba(0,255,255,0)'); ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(this.x,this.y,gr,0,Math.PI*2); ctx.fill(); ctx.restore(); super.draw(); } }
class Particle extends GameObject { constructor(x, y, emoji) { super(x, y, 20, emoji); this.vx=(Math.random()-0.5)*12; this.vy=(Math.random()-0.5)*12; this.life=1.0; this.size = Math.random() * 15 + 10; } update(timeScale=1) { this.x+=this.vx * timeScale; this.y+=this.vy * timeScale; this.life-=0.04 * timeScale; this.vy += 0.1 * timeScale; if (this.life <= 0) this.toBeRemoved = true; } draw() { ctx.globalAlpha=this.life; super.draw(); ctx.globalAlpha=1.0; } }
class ScorePopup extends GameObject { constructor(x, y, text) { super(x, y, 30, text); this.vy=2; this.life=1.0; } update() { this.y+=this.vy; this.life-=0.02; if (this.life <= 0) this.toBeRemoved = true; } draw() { ctx.globalAlpha=this.life; ctx.fillStyle="#ffff00"; ctx.font=`bold ${this.size}px Arial`; ctx.fillText(this.emoji, this.x, this.y); ctx.globalAlpha=1.0; ctx.fillStyle="white"; } }

// --- GAME LOGIC ---
function resetGame() {
    isGameOver=false; isTouching=false; currentScore=0; playerLives=3; lastShotTime=0; activePowerUps={};
    player = new Player(k.width/2, k.height * 0.2);
    gameObjects=[]; bullets=[]; particles=[]; spawnQueue=[];
    currentWave = 0; waveState = 'INTERMISSION'; waveTransitionTime = Date.now() + 1000; difficulty = 1.0;
    comboCount = 0; lastKillTime = 0;
    updateUI();
}
function startGame(isCustom) {
    customMode = isCustom;
    resetGame();
    mainMenu.style.display='none'; gameOverMenu.style.display='none'; settingsMenu.style.display='none'; customCaptionsMenu.style.display='none'; captionListMenu.style.display = 'none';
    document.querySelector('#topInfo').style.display = 'block';
    document.querySelector('#highScoreInfo').style.display = 'block';
    showGameMessage("3", 1000, () => showGameMessage("2", 1000, () => showGameMessage("1", 1000, () => {
        showGameMessage("GO!", 500, () => {
            playSound('gameStart');
            if (gameLoopId) cancelAnimationFrame(gameLoopId);
            gameLoopId = requestAnimationFrame(gameLoop);
        });
    })));
}
function showGameMessage(text, duration, callback) {
    gameMessageDisplay.textContent = text;
    gameMessageDisplay.style.opacity = 1; gameMessageDisplay.style.transform = 'translate(-50%, -50%) scale(1)';
    setTimeout(() => {
        gameMessageDisplay.style.opacity = 0; gameMessageDisplay.style.transform = 'translate(-50%, -50%) scale(0.5)';
        if (callback) setTimeout(callback, 300);
    }, duration);
}
function gameLoop() {
    if (isGameOver) return;
    const now = Date.now();
    const timeScale = activePowerUps['TIME_WARP'] ? 0.4 : 1.0;
    
    drawBackground();
    manageWaves(now);
    manageSpawning(now);
    
    const shootDelay = activePowerUps['RAPID_FIRE'] ? PLAYER_RAPID_FIRE_DELAY : PLAYER_SHOOT_DELAY;
    if (isTouching && now - lastShotTime > shootDelay) { shoot(); lastShotTime = now; }
    
    // Update objects
    player.update();
    player.helpers.forEach(h => h.update());
    bullets.forEach(b => b.update());
    gameObjects.forEach(obj => obj.update(timeScale));
    particles.forEach(p => p.update(timeScale));
    
    player.shielded = !!activePowerUps['SHIELD'];
    
    // Draw objects
    player.draw();
    player.helpers.forEach(h => h.draw());
    gameObjects.forEach(obj => obj.draw());
    bullets.forEach(obj => obj.draw());
    particles.forEach(obj => obj.draw());

    handleCollisions(); cleanupObjects(); updatePowerUps(now); updateCombo(now); updateUI(); updateCaptionDisplay();
    gameLoopId = requestAnimationFrame(gameLoop);
}
function drawBackground() {
    ctx.save();
    if(screenShake.time > 0) {
        ctx.translate((Math.random()-0.5)*screenShake.intensity, (Math.random()-0.5)*screenShake.intensity);
        screenShake.time--;
    }
    ctx.fillStyle = "#090a0f"; ctx.fillRect(0, 0, k.width, k.height);
    if (webcamActive && showWebcamInBackground && webcamFeed.readyState >= 2) {
        ctx.globalAlpha = 0.2;
        const h = k.width / webcamFeed.videoWidth * webcamFeed.videoHeight;
        ctx.drawImage(webcamFeed, 0, (k.height-h)/2, k.width, h);
        ctx.globalAlpha = 1;
    }
    ctx.fillStyle = "white";
    stars.forEach(s => { s.y -= s.speed; if (s.y < 0) { s.y = k.height; s.x = Math.random()*k.width; } ctx.fillRect(s.x, s.y, s.size, s.size); });
    if(screenFlash.time > 0) {
        ctx.fillStyle = screenFlash.color;
        ctx.globalAlpha = screenFlash.time / 10;
        ctx.fillRect(0,0,k.width,k.height);
        screenFlash.time--;
    }
    ctx.restore();
}
function handleCollisions() {
    bullets.forEach(b => { gameObjects.forEach(o => { if (o instanceof Enemy && checkCollision(b, o)) { b.toBeRemoved=true; if (o.takeDamage()) destroyEnemy(o); } }); });
    gameObjects.forEach(o => { if (checkCollision(player, o)) { if (o instanceof Enemy) handlePlayerHit(o); else if (o instanceof PowerUp) { activatePowerUp(o.type); o.toBeRemoved=true; playSound('powerup'); } else if (o instanceof EnemyBullet) { o.toBeRemoved = true; handlePlayerHit(o); } } });
}
function checkCollision(o1, o2) { if(!o1 || !o2) return false; const dx=o1.x-o2.x, dy=o1.y-o2.y; return Math.sqrt(dx*dx+dy*dy) < o1.radius+o2.radius; }
function handlePlayerHit(enemy) {
    if (Date.now()<playerInvincibilityEnd) return;
    if (player.shielded) { delete activePowerUps['SHIELD']; playerInvincibilityEnd = Date.now() + 1000; playSound('hit'); createExplosion(enemy.x, enemy.y, enemy.emoji); enemy.toBeRemoved=true; return; }
    playerLives--; playSound('playerHit'); shakeScreen(20, 40); screenFlash = {time: 12, color: 'rgba(255,0,0,0.6)'};
    if (playerLives <= 0) endGame(); else { playerInvincibilityEnd = Date.now() + PLAYER_INVINCIBILITY_DURATION; createExplosion(enemy.x, enemy.y, enemy.emoji); enemy.toBeRemoved=true; }
}
function endGame() { isGameOver = true; cancelAnimationFrame(gameLoopId); finalScoreValue.textContent=currentScore; gameOverMenu.style.display = 'flex'; captionDisplayBox.style.display = 'none'; player.helpers = []; playSound('gameOver'); }
function shoot() { playSound('shoot'); if (activePowerUps['SPREAD_SHOT']) { bullets.push(new SpreadBullet(player.x,player.y+player.radius,-0.2)); bullets.push(new SpreadBullet(player.x,player.y+player.radius,0)); bullets.push(new SpreadBullet(player.x,player.y+player.radius,0.2)); } else { bullets.push(new Bullet(player.x,player.y+player.radius)); } }

// --- DYNAMIC WAVE SYSTEM ---
function manageWaves(now) {
    const activeEnemies = gameObjects.filter(o => o instanceof Enemy).length;
    if (activeEnemies === 0 && spawnQueue.length === 0 && waveState === 'ACTIVE') {
        waveState = 'INTERMISSION';
        waveTransitionTime = now + 2500; // Wait 2.5 seconds
        showGameMessage("Wave Clear!", 1500);
        screenFlash = {time: 10, color: 'rgba(0,255,100,0.3)'};
    } else if (waveState === 'INTERMISSION' && now > waveTransitionTime) {
        startNextWave(now);
    }
}
function manageSpawning(now) {
    for (let i = spawnQueue.length - 1; i >= 0; i--) {
        const spawn = spawnQueue[i];
        if (now >= spawn.time) {
            spawnEnemy(spawn.type);
            spawnQueue.splice(i, 1);
        }
    }
}
function startNextWave(now) {
    waveState = 'SPAWNING';
    currentWave++;
    difficulty = 1 + (currentWave * 0.15) + (currentScore / 20000);
    showGameMessage(`Wave ${currentWave}`, 1500);
    waveTransitionTime = now + 2000; // 2 seconds for message to display
    generateWave(now + 2000); // Start queueing spawns after 2 seconds
}
function generateWave(startTime) {
    const budget = 12 + currentWave * 8;
    let spent = 0;
    let spawnTimeOffset = 0;
    const enemyTypes = [ {type:'swarmer', cost:1}, {type:'sine', cost:2}, {type:'shooter', cost:3.5}, {type:'heavy', cost:5}, {type:'dasher', cost:4}, {type:'good', cost: 2}, {type:'gematria', cost: 6} ];

    while(spent < budget) {
        let availableTypes = enemyTypes.filter(e => e.cost <= budget - spent);
        if (currentWave < 2 && availableTypes.some(e => e.type === 'dasher')) availableTypes = availableTypes.filter(e => e.type !== 'dasher');
        if (currentWave < 3 && availableTypes.some(e => e.type === 'gematria')) availableTypes = availableTypes.filter(e => e.type !== 'gematria');
        if(availableTypes.length === 0) break;
        
        const choice = availableTypes[Math.floor(Math.random() * availableTypes.length)];
        let count = 1;
        if(choice.type === 'swarmer') count = Math.min(Math.floor((budget-spent)/choice.cost), Math.floor(Math.random()*5)+3);
        
        for (let i = 0; i < count; i++) {
            spawnQueue.push({ type: choice.type, time: startTime + spawnTimeOffset });
            spawnTimeOffset += (450 / difficulty);
        }
        spent += choice.cost * count;
    }
    setTimeout(() => { if (!isGameOver) waveState = 'ACTIVE'; }, spawnTimeOffset + 2000);
}
function spawnEnemy(type) {
    const size = Math.random() * 20 + 40;
    const x = Math.random() * (k.width - size) + size / 2;
    const y = k.height + size;
    const speed = (Math.random() * 2.0 + 1.5) * Math.sqrt(difficulty);
    const health = 1 * difficulty;
    let enemy;
    switch(type) {
        case 'sine': enemy = new SineWaveEnemy(x, y, size, '🦋', speed, Math.ceil(health*1.2)); break;
        case 'shooter': enemy = new ShooterEnemy(x, y, size + 10, '👿', speed * 0.8, Math.ceil(health*1.5)); break;
        case 'dasher': enemy = new DasherEnemy(x, y, size, '🦇', speed * 1.2, Math.ceil(health*0.8)); break;
        case 'heavy': enemy = new HeavyEnemy(x, y, size + 20, '🦣', speed * 0.5, Math.ceil(health*4)); break;
        case 'good': enemy = new GoodEmoji(x, y, size, goodEmojis[Math.floor(Math.random() * goodEmojis.length)], speed); break;
        case 'gematria': enemy = new GematriaBox(x, y); break;
        case 'swarmer': default: enemy = new Enemy(x, y, size, badEmojis[Math.floor(Math.random() * badEmojis.length)], speed, Math.ceil(health)); break;
    }
    gameObjects.push(enemy);
}

function destroyEnemy(enemy) { 
    enemy.toBeRemoved=true; 
    const now = Date.now();
    if (enemy instanceof GematriaBox) {
        if(enemy.value > 0) player.addHelpers(enemy.value);
    } else if (enemy instanceof GoodEmoji) {
        currentScore += enemy.baseScore;
        const types=Object.keys(POWERUP_TYPES); 
        gameObjects.push(new PowerUp(enemy.x,enemy.y,types[Math.floor(Math.random()*types.length)]));
    } else {
        if(now - lastKillTime < COMBO_TIMEOUT) { comboCount++; } else { comboCount = 1; }
        lastKillTime = now;
        playSound('combo', comboCount);
        const scoreGain = Math.floor(enemy.baseScore * (1 + (comboCount-1)*0.1));
        currentScore+=scoreGain; 
        gameObjects.push(new ScorePopup(enemy.x,enemy.y,`+${scoreGain}`)); 
        if(Math.random()<0.15){const types=Object.keys(POWERUP_TYPES); gameObjects.push(new PowerUp(enemy.x,enemy.y,types[Math.floor(Math.random()*types.length)]));} 
    }
    if (currentScore>highScore) { highScore=currentScore; localStorage.setItem('emojiShooterHighScore',highScore); } 
    createExplosion(enemy.x,enemy.y,enemy.emoji); 
    playSound('destroy'); 
    if (enemy instanceof HeavyEnemy) shakeScreen(10, 20);
}
function createExplosion(x,y,emoji) { for(let i=0;i<15;i++)particles.push(new Particle(x,y,emoji)); screenFlash = {time: 4, color: 'rgba(255,255,150,0.4)'}; }
function activatePowerUp(type) { const config=POWERUP_TYPES[type]; if(type==='BOMB'){gameObjects.forEach(o=>{if(o instanceof Enemy && !(o instanceof GoodEmoji))destroyEnemy(o)});playSound('destroy'); shakeScreen(20,40); screenFlash={time:15, color:'rgba(255,255,255,0.8)'}; return;} activePowerUps[type]=Date.now()+config.duration; if (type === 'TIME_WARP') playSound('timewarp_on'); }
function updatePowerUps(now) { let html=''; for(const type in activePowerUps){ const endTime=activePowerUps[type]; if(now>endTime){ if (type === 'TIME_WARP') playSound('timewarp_off'); delete activePowerUps[type]; continue;} const config=POWERUP_TYPES[type],timeLeft=endTime-now,percent=(timeLeft/config.duration)*100; html+=`<div class="power-up-active"><span class="power-up-icon">${config.emoji}</span><div class="power-up-timer"><div class="power-up-timer-bar" style="width:${percent}%;"></div></div></div>`; } powerUpContainer.innerHTML=html; }
function cleanupObjects() { bullets=bullets.filter(b=>!b.toBeRemoved); gameObjects=gameObjects.filter(o=>!o.toBeRemoved); particles=particles.filter(p=>!p.toBeRemoved); }
function updateUI() { currentScoreValue.textContent=currentScore; highScoreValue.textContent=highScore; playerLivesValue.textContent=playerLives; }
function updateCombo(now) {
    if (now - lastKillTime > COMBO_TIMEOUT && comboCount > 0) comboCount = 0;
    if (comboCount > 1) {
        comboInfo.textContent = `x${comboCount} COMBO`; comboInfo.style.opacity = '1'; comboInfo.style.transform = `scale(${1 + Math.min(comboCount / 50, 0.5)})`;
    } else {
        comboInfo.style.opacity = '0'; comboInfo.style.transform = 'scale(0.8)';
    }
}
function shakeScreen(intensity, duration) { screenShake.intensity = intensity; screenShake.time = duration; }

// --- WEBCAM FUNCTIONS ---
function saveWebcamSettings() {
    showWebcamOnPlayer = document.getElementById('enableWebcamPlayer').checked;
    showWebcamInBackground = document.getElementById('enableWebcamBg').checked;
    localStorage.setItem('webcamPlayer', showWebcamOnPlayer);
    localStorage.setItem('webcamBg', showWebcamInBackground);
    if(showWebcamOnPlayer || showWebcamInBackground) {
        initWebcam();
    } else {
        stopWebcam();
        alert("Webcam settings saved. Webcam is disabled.");
    }
}
async function initWebcam() {
    const statusEl = document.getElementById('webcamStatus');
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusEl.textContent = "Webcam not supported by this browser."; statusEl.style.color = 'red'; return;
    }
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        webcamFeed.srcObject = stream;
        webcamActive = true;
        statusEl.textContent = "Webcam activated successfully!";
        statusEl.style.color = 'lime';
    } catch (err) {
        webcamActive = false;
        showWebcamOnPlayer = false; showWebcamInBackground = false;
        localStorage.setItem('webcamPlayer', 'false'); localStorage.setItem('webcamBg', 'false');
        document.getElementById('enableWebcamPlayer').checked = false; document.getElementById('enableWebcamBg').checked = false;
        statusEl.textContent = "Webcam access denied or failed.";
        statusEl.style.color = 'red';
        console.error("Webcam Error:", err);
    }
}
function stopWebcam() {
    if(webcamFeed.srcObject) {
        webcamFeed.srcObject.getTracks().forEach(track => track.stop());
        webcamFeed.srcObject = null;
        webcamActive = false;
        const statusEl = document.getElementById('webcamStatus');
        statusEl.textContent = "Webcam is off.";
        statusEl.style.color = '#ffc107';
    }
}

// --- CUSTOM CAPTION FUNCTIONS ---
function showCustomCaptionsMenu() { mainMenu.style.display = 'none'; customCaptionsMenu.style.display = 'flex'; const saved = localStorage.getItem('customCaptionsText'); if (saved) captionsTextarea.value = saved; }
function startCustomGame() {
    const text = captionsTextarea.value.trim(); if (!text) { alert("Please enter some captions!"); return; }
    const captions = text.split('\n\n').filter(s => s.trim() !== ''); if (captions.length === 0) { alert("No valid captions found. Ensure they are separated by two newlines."); return; }
    localStorage.setItem('customCaptionsText', text); currentCaptionIndex = 0;
    customCaptionData = captions.map((caption, index) => ({ text: caption, imageUrl: captionImageUrls.length > 0 ? captionImageUrls[index % captionImageUrls.length] : null, color: `rgba(${Math.floor(Math.random()*100)},${Math.floor(Math.random()*100)},${Math.floor(Math.random()*100)},0.8)` }));
    positionCaptionBox(); startGame(true);
}
function updateCaptionDisplay() {
    if (!customMode || customCaptionData.length === 0) { captionDisplayBox.style.display = 'none'; return; }
    captionDisplayBox.style.display = 'block'; const currentData = customCaptionData[currentCaptionIndex];
    captionTextBox.textContent = currentData.text;
    if (currentData.imageUrl) { captionDisplayBox.style.backgroundImage = `url(${currentData.imageUrl})`; captionDisplayBox.style.backgroundColor = 'rgba(0,0,0,0.5)'; } else { captionDisplayBox.style.backgroundImage = 'none'; captionDisplayBox.style.backgroundColor = currentData.color; }
}
function nextCaption() { currentCaptionIndex = (currentCaptionIndex + 1) % customCaptionData.length; }
function prevCaption() { currentCaptionIndex = (currentCaptionIndex - 1 + customCaptionData.length) % customCaptionData.length; }
function showCaptionList() {
    captionListMenu.style.display = 'flex';
    captionListContainer.innerHTML = '';
    customCaptionData.forEach((data, index) => {
        const item = document.createElement('div');
        item.className = 'caption-list-item';
        item.textContent = `${index + 1}: ${data.text}`;
        item.dataset.index = index;
        item.onclick = () => { currentCaptionIndex = index; hideCaptionList(); };
        captionListContainer.appendChild(item);
    });
}
function hideCaptionList() { captionListMenu.style.display = 'none'; }
function startDrag(e) { const c=e.touches?e.touches[0]:e; isDraggingCaptionBox=true; const rect=captionDisplayBox.getBoundingClientRect(); dragOffsetX=c.clientX-rect.left; dragOffsetY=c.clientY-rect.top; captionDisplayBox.style.cursor='grabbing'; e.preventDefault(); }
function dragCaptionBox(e) { if(!isDraggingCaptionBox)return; const c=e.touches?e.touches[0]:e; let newX=c.clientX-dragOffsetX; let newY=c.clientY-dragOffsetY; newX=Math.max(0,Math.min(newX,k.width-captionDisplayBox.offsetWidth)); newY=Math.max(0,Math.min(newY,k.height-captionDisplayBox.offsetHeight)); captionDisplayBox.style.left=`${newX}px`; captionDisplayBox.style.top=`${newY}px`; captionBoxLastX=newX; captionBoxLastY=newY; e.preventDefault(); }
function endDragCaptionBox() { isDraggingCaptionBox=false; captionDisplayBox.style.cursor='grab'; localStorage.setItem('captionBoxX',captionBoxLastX); localStorage.setItem('captionBoxY',captionBoxLastY); }
function positionCaptionBox() { if (captionBoxLastX !== null && captionBoxLastY !== null) { let x = Math.max(0, Math.min(captionBoxLastX, k.width - captionDisplayBox.offsetWidth)); let y = Math.max(0, Math.min(captionBoxLastY, k.height - captionDisplayBox.offsetHeight)); captionDisplayBox.style.left = `${x}px`; captionDisplayBox.style.top = `${y}px`; } else { captionDisplayBox.style.left = '50%'; captionDisplayBox.style.top = '15%'; captionDisplayBox.style.transform = 'translateX(-50%)'; } }

// --- UTILITY FUNCTIONS ---
function numberToGematria(num) {
    if (num <= 0) return '';
    const letters = { 1:'א', 2:'ב', 3:'ג', 4:'ד', 5:'ה', 6:'ו', 7:'ז', 8:'ח', 9:'ט', 10:'י', 20:'כ', 30:'ל', 40:'מ', 50:'נ', 60:'ס', 70:'ע', 80:'פ', 90:'צ', 100:'ק', 200:'ר', 300:'ש', 400:'ת' };
    let str = '';
    let n = Math.floor(num);
    while(n >= 400) { str += 'ת'; n -= 400; }
    if(n >= 100) { str += letters[Math.floor(n/100)*100]; n %= 100; }
    if(n >= 10) { str += letters[Math.floor(n/10)*10]; n %= 10; }
    if(n > 0) { str += letters[n]; }
    return str.split('').reverse().join(''); // Standard Hebrew writing order
}

// --- EVENT LISTENERS ---
function handlePointerStart(e) {
    setupAudio();
    if (e.target.closest('.caption-nav-button')) return;
    if (e.target.closest('#captionDisplayBox')) { startDrag(e); return; }
    if (captionListMenu.style.display === 'flex') return;
    if (isGameOver) return;
    e.preventDefault();
    isTouching = true;
    const c = e.touches ? e.touches[0] : e;
    lastDragPos.x = c.clientX;
    lastDragPos.y = c.clientY;
}
function handlePointerMove(e) {
    if (isDraggingCaptionBox) { dragCaptionBox(e); return; }
    if (captionListMenu.style.display === 'flex') return;
    if (isGameOver || !isTouching || !player) return;
    e.preventDefault();
    const c = e.touches ? e.touches[0] : e;
    
    const deltaX = c.clientX - lastDragPos.x;
    const deltaY = c.clientY - lastDragPos.y;

    player.x += deltaX;
    player.y += deltaY;

    lastDragPos.x = c.clientX;
    lastDragPos.y = c.clientY;
}
function handlePointerEnd(e) { if (isDraggingCaptionBox) { endDragCaptionBox(e); } isTouching = false; }
function handleResize() {
    k.width=window.innerWidth; k.height=window.innerHeight;
    if(player) { player.x=k.width/2; player.y = k.height * 0.2; }
    positionCaptionBox(); stars = [];
    for (let i = 0; i < 200; i++) { stars.push({ x: Math.random() * k.width, y: Math.random() * k.height, size: Math.random() * 2 + 1, speed: Math.random() * 0.5 + 0.2 }); }
}

window.addEventListener('resize', handleResize);
document.addEventListener('touchstart', handlePointerStart, { passive: false });
document.addEventListener('touchmove', handlePointerMove, { passive: false });
document.addEventListener('touchend', handlePointerEnd);
document.addEventListener('mousedown', handlePointerStart);
document.addEventListener('mousemove', handlePointerMove);
document.addEventListener('mouseup', handlePointerEnd);

imageUploader.addEventListener('change', (e) => {
    captionImageUrls.forEach(url => URL.revokeObjectURL(url)); captionImageUrls = [];
    const files = Array.from(e.target.files);
    files.forEach(file => { captionImageUrls.push(URL.createObjectURL(file)); });
    fileCount.textContent = `${files.length} image${files.length !== 1 ? 's' : ''} selected`;
});

// --- INITIALIZATION ---
handleResize(); loadSettings(); showMainMenu();

</script>
