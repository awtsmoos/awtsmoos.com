<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Star Collector</title>
<link rel="stylesheet" href="css/main.css">
<link rel="stylesheet" href="css/hud.css">
<link rel="stylesheet" href="css/screens.css">
<link rel="stylesheet" href="css/controls.css">
</head>
<body>
<main id="wrap">
	<h1>Star Collector</h1>
	<div id="hud">
		<span class="hud-item">Score: <strong id="hud-score">0</strong></span>
		<span class="hud-item">Lives: <strong id="hud-lives">♥♥♥</strong></span>
		<span class="hud-item">Time: <strong id="hud-timer">0:00</strong></span>
		<span class="hud-item">Level: <strong id="hud-level">1</strong></span>
		<button id="pause" type="button">⏸ Pause</button>
	</div>
	<canvas id="game" width="480" height="640"></canvas>
	<div id="touch-controls">
		<button type="button" class="tbtn" data-dir="left" aria-label="Left">◀</button>
		<button type="button" class="tbtn" data-dir="up" aria-label="Up">▲</button>
		<button type="button" class="tbtn" data-dir="down" aria-label="Down">▼</button>
		<button type="button" class="tbtn" data-dir="right" aria-label="Right">▶</button>
	</div>
	<p id="help">Move with arrow keys or WASD, drag on the field, or hold the touch pad. Catch stars, dodge meteors. P pauses.</p>
	<div id="gameover" class="hidden">
		<div class="panel">
			<h2>Game Over</h2>
			<p>Final score: <strong id="final-score">0</strong></p>
			<p>Survived: <strong id="final-time">0:00</strong></p>
			<button id="restart" type="button">Restart</button>
		</div>
	</div>
</main>
<script src="js/core/state.js"></script>
<script src="js/core/levels.js"></script>
<script src="js/input/keyboard.js"></script>
<script src="js/input/pointer.js"></script>
<script src="js/input/touchbuttons.js"></script>
<script src="js/input/input.js"></script>
<script src="js/entities/ship.js"></script>
<script src="js/entities/star.js"></script>
<script src="js/entities/meteor.js"></script>
<script src="js/entities/spawner.js"></script>
<script src="js/render/renderer.js"></script>
<script src="js/ui/hud.js"></script>
<script src="js/ui/screens.js"></script>
<script src="js/core/game.js"></script>
<script src="js/main.js"></script>
</body>
</html>
