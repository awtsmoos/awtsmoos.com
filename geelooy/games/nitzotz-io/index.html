<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Nitzotz.io Worlds</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="game" aria-label="Nitzotz.io WebGL world"></canvas>
  <canvas id="map" aria-label="spark radar"></canvas>

  <section class="hud" aria-live="polite">
    <div class="brand"><b>Nitzotz.io</b><span id="worldText"> Assiyah</span></div>
    <div class="meters">
      <label>Sparks <meter id="sparkMeter" min="0" max="1" value="0"></meter></label>
      <label>Vessel <span id="sizeText">24</span></label>
      <label>Time <span id="timeText">120</span></label>
      <label>Sefirah <span id="sefText">Malchus</span></label>
      <label>Combo <span id="comboText">x1.0</span></label>
      <label>Best <span id="bestText">0</span></label>
    </div>
    <p id="message">B'H · hit BEGIN. Move, pulse, dodge giants, reveal worlds.</p>
  </section>

  <section id="overlay" class="overlay">
    <div class="overlay-panel">
      <p class="eyebrow">B'H · four worlds · one spark storm</p>
      <h1 id="overlayTitle">Nitzotz.io Worlds</h1>
      <p id="overlayText">Move fast. Eat smaller vessels. Dodge anything too huge until you grow.</p>
      <div class="hero-actions">
        <button id="startBtn" class="button primary">BEGIN</button>
        <button id="restartBtn" class="button ghost">RESTART</button>
      </div>
      <div class="settings" aria-label="quality">
        <button data-perf="low" class="button chip"><b>Smooth</b><span>safe FPS</span></button>
        <button data-perf="medium" class="button chip"><b>Balanced</b><span>clear chaos</span></button>
        <button data-perf="high" class="button chip"><b>Extreme</b><span>hard mode</span></button>
      </div>
      <div class="settings toggles" aria-label="effects">
        <button id="hapticBtn" class="button chip"><b>Haptics</b><span>rumble</span></button>
        <button id="postfxBtn" class="button chip"><b>PostFX</b><span>glow</span></button>
      </div>
      <div class="guide">
        <span>WASD / arrows: move</span><span>Space: pulse</span><span>Enter: start</span><span>N: next world</span>
      </div>
    </div>
  </section>

  <div id="stick"><span>DRAG</span><i></i></div>
  <button id="pulse"><b>PULSE</b><span>OHR</span></button>
  <script type="module" src="./js/main.js?v=20260629_extreme_split"></script>
</body>
</html>
