<!-- B"H
Boruch Hashem
Blessed is He

The Awtsmoos renews vessel, spark, touch, and ascent beyond every finite frame.
Awtsmoos.com presents Kabbalah Infinite as a direct arcade descent into breaking,
shielding, and return—with clear controls and no frosted layer between player and world.
-->
<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
	<meta name="theme-color" content="#000000">
	<meta name="description" content="Kabbalah Infinite is a touch-first mystical shooter about sparks, shields, time dilation, and shattered vessels.">
	<title>Kabbalah Infinite — The Breaking of Vessels</title>
	<link rel="stylesheet" href="./style.css?v=kabbalah-solid-002">
	<link rel="stylesheet" href="/index.css">
</head>
<body>
	<main id="game-container" aria-label="Kabbalah Infinite game world">
		<canvas id="gl-canvas"></canvas>
		<canvas id="text-canvas"></canvas>

		<div id="hud" aria-hidden="true">
			<div id="spell-hud"></div>
		</div>

		<div id="pause-btn" role="button" tabindex="0" aria-label="Pause game">Ⅱ</div>

		<section id="ui-layer" aria-live="polite">
			<div id="start-message" class="message-box" style="display:block" role="button" tabindex="0">
				<h1>Kabbalah<br>Infinite</h1>
				<h2>The Breaking of Vessels</h2>
				<p>Reveal sparks. Survive the fracture. Ascend again.</p>
				<p class="control-hint">1 finger: move + shoot · 2 fingers: shield · 3 fingers: time dilation</p>
			</div>

			<div id="pause-message" class="message-box" role="button" tabindex="0">
				<h1>Paused</h1>
				<p class="control-hint">Tap to resume</p>
			</div>

			<div id="game-over-message" class="message-box" role="button" tabindex="0">
				<h1>Shevirah</h1>
				<p>The vessels have shattered.</p>
				<p id="final-score"></p>
				<p class="control-hint">Tap to reincarnate · Gilgul</p>
			</div>
		</section>
	</main>

	<script type="module" src="./main.js"></script>
</body>
</html>
