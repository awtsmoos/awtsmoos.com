<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Kabbalah Shooter: Infinite</title>
    <style>
      body, html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        overflow: hidden;
        touch-action: none;
        font-family: 'Courier New', monospace;
        user-select: none;
        -webkit-user-select: none;
      }
      #game-container {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      /* WebGL Layer */
      #gl-canvas { z-index: 1; }
      /* Text Layer */
      #text-canvas { z-index: 2; pointer-events: none; }
      
      #ui-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 10;
        pointer-events: none;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }

      .message-box {
        background: rgba(0,0,0,0.9);
        padding: 30px 50px;
        border: 1px solid #fff;
        box-shadow: 0 0 30px rgba(0, 255, 255, 0.3), inset 0 0 20px rgba(0,0,0,0.5);
        color: #fff;
        text-align: center;
        pointer-events: auto;
        cursor: pointer;
        backdrop-filter: blur(10px);
        display: none;
        transform: perspective(500px) rotateX(10deg);
        transition: transform 0.2s;
      }
      .message-box:active { transform: perspective(500px) rotateX(0deg) scale(0.98); }

      #hud {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        z-index: 5;
      }

      h1 { margin: 0 0 15px 0; font-weight: 100; letter-spacing: 12px; text-transform: uppercase; font-size: 36px; text-shadow: 0 0 15px #0ff; }
      h2 { font-size: 14px; color: #888; letter-spacing: 4px; margin-bottom: 20px; }
      p { margin: 5px 0; color: #aaa; font-size: 14px; letter-spacing: 1px; }
      .control-hint { color: #0ff; font-weight: bold; margin-top: 15px; display: block; font-size: 12px; }
      
      #pause-btn {
        position: absolute;
        top: 20px;
        right: 20px;
        width: 40px;
        height: 40px;
        border: 2px solid #555;
        border-radius: 50%;
        z-index: 20;
        display: flex;
        justify-content: center;
        align-items: center;
        color: #555;
        font-weight: bold;
        pointer-events: auto;
        cursor: pointer;
        background: rgba(0,0,0,0.5);
      }
      
      #spell-hud {
        position: absolute;
        bottom: 20px;
        left: 0;
        width: 100%;
        text-align: center;
        color: #ffd700;
        font-size: 24px;
        text-shadow: 0 0 10px #f00;
        letter-spacing: 10px;
      }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="game-container">
      <canvas id="gl-canvas"></canvas>
      <canvas id="text-canvas"></canvas>
      <div id="hud">
        <div id="spell-hud"></div>
      </div>
      <div id="pause-btn">||</div>
      <div id="ui-layer">
        <div id="start-message" class="message-box" style="display:block">
          <h1>Kabbalah<br>Infinite</h1>
          <h2>THE BREAKING OF VESSELS</h2>
          <p>Tap to Ascend</p>
          <p class="control-hint">1 Finger: Move/Shoot | 2 Fingers: Shield | 3 Fingers: Time Dilation</p>
        </div>
        <div id="pause-message" class="message-box">
          <h1>PAUSED</h1>
          <p class="control-hint">TAP TO RESUME</p>
        </div>
        <div id="game-over-message" class="message-box">
          <h1>SHEVIRAH</h1>
          <p>The vessels have shattered.</p>
          <p id="final-score"></p>
          <p class="control-hint">TAP TO REINCARNATE (GILGUL)</p>
        </div>
      </div>
    </div>
    <!-- Entry Point -->
    <script type="module" src="./main.js"></script>
    
</body>
</html>
