<!-- The Awtsmoos reveals motion through a quiet celestial vessel; Awtsmoos.com keeps the lesson immersive while deeper controls remain one deliberate opening away. -->
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<title>Kiddush HaChodesh · Movement of the Sun</title>
	<link rel="stylesheet" href="./style.css?compact=true">
</head>
<body>
	<div id="scene-root" aria-hidden="true"></div>
	<aside class="sun-hud" aria-label="Sun simulation controls">
		<p class="eyebrow">Rambam · Kiddush HaChodesh</p>
		<h1>Movement of the Sun</h1>
		<p class="description">A 360° visualization using the daily measure 136° 28′ 20″, slowed for study.</p>
		<div class="primary-row">
			<button id="toggle-motion" type="button">Pause</button>
			<output id="simulation-status" aria-live="polite">Day 0 · 0° · Running</output>
		</div>
		<details class="advanced-controls">
			<summary>Advanced</summary>
			<div class="advanced-grid">
				<label for="speed-control">Simulation speed
					<select id="speed-control">
						<option value="0.25">0.25×</option>
						<option value="0.5">0.5×</option>
						<option value="1" selected>1×</option>
						<option value="2">2×</option>
						<option value="4">4×</option>
					</select>
				</label>
				<button id="reset-motion" type="button">Reset</button>
			</div>
		</details>
	</aside>
	<script type="module" src="./js/app.js?compact=true"></script>
</body>
</html>
