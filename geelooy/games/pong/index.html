<!-- Pong stays intentionally tiny: deliberate Play, one court, one pause control, one result, one rematch. -->
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="theme-color" content="#000000">
	<meta name="description" content="A fast local Pong match against the AI with touch, keyboard, pause, rematch, and Party result support.">
	<title>Pong · Awtsmoos Games</title>
	<link rel="stylesheet" href="./style.css?v=c59890e553">
	<link rel="stylesheet" href="/games/styles/player-shell/index.css?v=2b7d4f91a3">
	<link rel="stylesheet" href="../styles/awp-polish.css?v=7e4564d6d5">
</head>
<body>
	<!-- B"H Awtsmoos game loading screen: static shell paints on first paint; player-shell hydrates progress/tips/fade. -->
	<div id="awtsmoos-loader" role="status" aria-label="Game loading">
		<div class="awtsmoos-loader-shade"></div>
		<div class="awtsmoos-loader-inner">
			<div class="awtsmoos-loader-kicker">B"H · Awtsmoos Games</div>
			<div class="awtsmoos-loader-title">Pong</div>
			<div class="awtsmoos-loader-bar"><div class="awtsmoos-loader-fill"></div></div>
			<div class="awtsmoos-loader-tip"></div>
	</div>
	</div>

	<main class="pong-stage awp-stage" aria-label="Pong match">
		<canvas id="pongCanvas" tabindex="0" aria-label="Pong court. Drag on the court or use Up and Down arrow keys."></canvas>
		<button id="pongPauseButton" class="pong-pause awp-btn" type="button" aria-pressed="false" hidden>Pause</button>

		<section id="pongReady" class="pong-panel awp-menu" aria-labelledby="pongTitle">
			<p class="pong-kicker awp-eyebrow">B"H · Quick Play</p>
			<h1 id="pongTitle" class="awp-gametitle">Pong</h1>
			<p>Drag the left paddle or use ↑ ↓. First to 10 wins.</p>
			<button id="pongStartButton" class="awp-cta" type="button">Play vs AI</button>
		</section>

		<section id="pongResult" class="pong-panel awp-menu" aria-labelledby="pongResultTitle" hidden>
			<h2 id="pongResultTitle">Match complete</h2>
			<p id="pongResultScore" aria-live="polite">0–0</p>
			<button id="pongRematchButton" class="awp-btn" type="button">Rematch</button>
			<a href="/games/">All Games</a>
		</section>
	</main>

	<script src="./js/particles.js?v=eb87222e44"></script>
	<script src="./js/ball.js?v=5e24e673f7"></script>
	<script src="./js/paddle.js?v=060c091e14"></script>
	<script src="./js/ui.js?v=ee8a1ec3a7"></script>
	<script src="./js/controls.js?v=f85de9baee"></script>
	<script src="./js/match-update.js?v=373c87d649"></script>
	<script src="./js/result.js?v=9201ef29f8"></script>
	<script src="./js/court.js?v=b3b3d0ce18"></script>
	<script src="./js/lifecycle.js?v=c6d0daca87"></script>
	<script src="./js/session-ui.js?v=f2e96138e3"></script>
	<script src="./js/main.js?v=105f8e0fc8"></script>
	<script type="module" src="/games/scripts/runtime/index.js?v=6fd9ae91f1"></script>
	<script type="module" src="./js/wallet-reward.js?v=2c4852bd9f"></script>
	<script type="module" async src="/games/scripts/player-shell/index.js?v=8f3c1a92e4"></script>
</body>
</html>
