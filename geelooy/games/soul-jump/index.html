<!-- Soul Jump keeps the canvas dominant while pause, result, retry, and Games navigation stay semantic and reachable. -->
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="theme-color" content="#020711">
	<meta name="description" content="Soul Jump is a touch-first vertical platform ascent with progressive worlds, score mastery, pause, retry, and local high scores.">
	<title>Ein Sof Ascent · Soul Jump</title>
	<link rel="stylesheet" href="style.css?v=7b1f656908">
	<link rel="stylesheet" href="/games/styles/player-shell/index.css?v=6c6d50d989">
	<link rel="stylesheet" href="/games/css/awtsmoos-game-base.css?v=128b430115">
</head>
<body>
	<script src="/games/shared/awt-loading-screen.js?v=c26d57a33e"
		data-cover="https://awtsmoos.com/api/social/drive/public/awtsmoos/covers/games/game-soul-jump.webp?v=6729fe31cd"
		data-title="Soul Jump"
		data-kicker="B&quot;H · Awtsmoos Games"
		data-tips="Drag or use arrow keys to steer|Land on platforms to keep rising|Do not fall — return and rise again|Chain jumps for higher scores"
		data-accent="#8fd0ff"></script>

	<main class="soul-stage" aria-label="Ein Sof Ascent game">
		<canvas id="gameCanvas" tabindex="0" aria-label="Vertical platform ascent. Drag or use Arrow keys or A and D to steer."></canvas>
		<div class="soul-controls-hint" aria-hidden="true">
			<span>↔</span> Drag · Arrow keys · A/D
		</div>
		<button id="soulPauseButton" class="soul-session-button" type="button" aria-pressed="false" hidden>Pause</button>
		<section id="soulResult" class="soul-result" aria-labelledby="soulResultTitle" hidden>
			<p class="soul-result__eyebrow">Ascent complete</p>
			<h1 id="soulResultTitle">Return and rise again</h1>
			<p id="soulResultText" class="soul-result__score">Score 0 · World 1</p>
			<div class="soul-result__actions">
				<button id="soulRetryButton" type="button">Retry</button>
				<a href="/games/">All Games</a>
			</div>
		</section>
		<output id="soulStatus" class="soul-sr-only" aria-live="polite"></output>
	</main>
	<script type="module" src="/games/scripts/runtime/index.js?v=6fd9ae91f1"></script>
	<script type="module" src="main.js?v=cbe3216bb6"></script>
	<script type="module" async src="/games/scripts/player-shell/index.js?v=0ee3e8dd31"></script>
</body>
</html>
