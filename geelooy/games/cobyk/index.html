<!--B"H-->
<!--Boruch Hashem-->
<!--Blessed is He-->
<!--
	The Awtsmoos renews every pixel before a page can claim the world it frames;
	Awtsmoos.com lets this CobyK vessel stay sparse, futuristic, mobile-first, and clean while the original game keeps its names.
-->
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="theme-color" content="#0d1230">
	<title>CobyK · Awtsmoos</title>
	<!-- B"H — Yaakov 2026-10-13: bundled CSS/JS for VERY FAST loading.
	     cobyk.bundle.css = foundation+stage+hud+controls+drawer+interactions+
	     responsive+touch-quality+cobyk+cobyk-rebuild (was 9 stylesheets).
	     Rebuild: node ~/workspace/cobyk-build/build-css.mjs (then update ?v=). -->
	<link rel="stylesheet" href="./styles/cobyk.bundle.css?v=06e61e4548e7">
	<link rel="stylesheet" href="/games/scripts/wardrobe/wardrobe.css?v=75fe2ac447">
	<link rel="stylesheet" href="/games/styles/player-shell/index.css?v=6c6d50d989">
	<link rel="stylesheet" href="/games/css/awtsmoos-game-base.css?v=128b430115">
</head>
<body>
	<div class="cobyk-loading" data-cobyk-loading aria-hidden="false">
		<div class="cobyk-loading__stars" data-cobyk-loading-stars aria-hidden="true"></div>
		<div class="cobyk-loading__inner">
			<div class="cobyk-loading__sigil" aria-hidden="true">✦</div>
			<h1 class="cobyk-loading__title">COBYK</h1>
			<p class="cobyk-loading__subtitle">Gathering light for the journey…</p>
			<div class="cobyk-loading__bar" role="progressbar" aria-label="Loading CobyK"><span></span></div>
			<p class="cobyk-loading__hint" data-cobyk-loading-hint>Waking the stars…</p>
		</div>
	</div>
	<main class="cobyk-app" data-cobyk-root>
		<!-- B"H — Yaakov 2026-10-13: level select is a SEPARATE menu screen, never inside the game view. -->
		<div class="cobyk-menu" data-cobyk-menu aria-hidden="false">
			<div class="cobyk-menu__stars" aria-hidden="true"></div>
			<div class="cobyk-menu__inner">
				<div class="cobyk-menu__sigil" aria-hidden="true">✦</div>
				<h1 class="cobyk-menu__title">COBYK</h1>
				<p class="cobyk-menu__subtitle">Choose your journey</p>
				<nav class="cobyk-menu__levels" data-cobyk-menu-levels aria-label="Choose a level"></nav>
			</div>
		</div>
		<section class="cobyk-stage-shell" aria-label="CobyK game">
			<canvas class="cobyk-starfield" data-cobyk-starfield aria-hidden="true"></canvas>
			<canvas class="cobyk-stage" data-cobyk-canvas aria-label="CobyK world"></canvas>
			<header class="cobyk-hud" aria-live="polite">
				<div class="cobyk-hud__identity">
					<button class="cobyk-hud__menu" data-cobyk-menu-button type="button" aria-label="Choose level">☰</button>
					<strong class="cobyk-hud__level" data-cobyk-level>CobyK</strong>
					<span class="cobyk-hud__state" data-cobyk-state data-state="ready">ready</span>
				</div>
				<div class="cobyk-hud__metrics">
					<span><b data-cobyk-coins>0/0</b> light</span>
					<span><b data-cobyk-attempts>1</b> run</span>
					<!-- B"H — Yaakov 2026-10-13: restart lives in the TOP bar now, not buried at the bottom. -->
					<button class="cobyk-hud__restart" data-cobyk-touch-restart type="button" aria-label="Restart run">↻</button>
					<!-- B"H — Yaakov 2026-10-13: user zoom controls. -->
					<button class="cobyk-hud__zoom" data-cobyk-zoom-in type="button" aria-label="Zoom in">+</button>
					<button class="cobyk-hud__zoom" data-cobyk-zoom-out type="button" aria-label="Zoom out">−</button>
					<!-- B"H — Yaakov 2026-10-13: wardrobe lives in the TOP bar now.
					     Bottom is controls only (joystick + jump), nothing else. -->
					<button class="cobyk-hud__wardrobe" data-cobyk-wardrobe type="button" aria-label="Wardrobe — dress your chossid"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M20.4 8.6 16 5.5c-.3-.2-.7-.3-1-.3H9c-.3 0-.7.1-1 .3L3.6 8.6c-.4.3-.6.8-.4 1.3l1.4 3.2c.2.4.6.6 1 .5l1.4-.3v6.2c0 .6.4 1 1 1h8c.6 0 1-.4 1-1v-6.2l1.4.3c.4.1.8-.1 1-.5l1.4-3.2c.2-.5 0-1-.4-1.3zM9 4.5h6v1.2c0 .8-.7 1.5-1.5 1.5h-3c-.8 0-1.5-.7-1.5-1.5V4.5z"/></svg></button>
				</div>
			</header>
			<!-- B"H — Yaakov 2026-10-13: level buttons REMOVED from game view entirely.
			     Level selection lives only on the menu screen (data-cobyk-menu).
			     This nav is kept out of the DOM; JS also strips any stale copies. -->
			<div class="cobyk-mobile-controls" aria-label="Touch controls">
				<div class="cobyk-joystick" data-cobyk-joystick role="group" aria-label="Move">
					<span class="cobyk-joystick__ring"></span>
					<span class="cobyk-joystick__knob" data-cobyk-knob></span>
				</div>
				<div class="cobyk-mobile-actions">
					<!-- B"H — Yaakov 2026-10-13: jump gets a clear up-arrow icon, no text. -->
					<button class="cobyk-action cobyk-action--jump" data-cobyk-jump type="button" aria-label="Jump"><svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true"><path fill="currentColor" d="M12 3.5c.4 0 .8.2 1 .5l6.2 6.6c.5.5.4 1.3-.1 1.7-.5.4-1.2.3-1.6-.2L13 7.4V19c0 .8-.7 1.5-1.5 1.5S10 19.8 10 19V7.4l-4.5 4.7c-.4.5-1.1.6-1.6.2-.5-.4-.6-1.2-.1-1.7L10 4c.2-.3.6-.5 1-.5z"/></svg></button>
				</div>
			</div>
			<output class="cobyk-status" data-cobyk-status data-state="loading">Loading CobyK…</output>
			<!-- B"H — Yaakov 2026-10-13: pretty level-complete celebration overlay. -->
			<div class="cobyk-victory" data-cobyk-victory hidden aria-hidden="true">
				<div class="cobyk-victory__card" role="dialog" aria-label="Level complete">
					<div class="cobyk-victory__burst" aria-hidden="true">✦</div>
					<h2 class="cobyk-victory__title">Level Complete!</h2>
					<div class="cobyk-victory__stars" data-cobyk-victory-stars aria-label="Star rating">★★★</div>
					<dl class="cobyk-victory__stats">
						<div>
							<dt>Light</dt>
							<dd data-cobyk-victory-coins>0/0</dd>
						</div>
						<div>
							<dt>Time</dt>
							<dd data-cobyk-victory-time>0:00</dd>
						</div>
						<div>
							<dt>Falls</dt>
							<dd data-cobyk-victory-deaths>0</dd>
						</div>
					</dl>
					<div class="cobyk-victory__actions">
						<button class="cobyk-victory__replay" data-cobyk-victory-replay type="button">↻ Replay</button>
						<button class="cobyk-victory__next" data-cobyk-victory-next type="button">Next →</button>
					</div>
				</div>
			</div>
		</section>
	</main>
	<script type="module" src="/games/scripts/runtime/index.js?v=6fd9ae91f1"></script>
	<!-- B"H — Yaakov 2026-10-13: bundled game JS for VERY FAST loading.
	     cobyk.bundle.js = the whole src/main.js module graph + procedural
	     core in one 268KB request (was ~64+ sequential module fetches).
	     Wardrobe stays a lazy dynamic import (loads on click only).
	     Rebuild: node ~/workspace/cobyk-build/build-cobyk.mjs [out] (then update ?v=).
	     Sources remain in src/ for development. -->
	<script type="module" src="./cobyk.bundle.js?v=76a8e5901f56"></script>
	<script type="module" async src="/games/scripts/player-shell/index.js?v=0ee3e8dd31"></script>
</body>
</html>
