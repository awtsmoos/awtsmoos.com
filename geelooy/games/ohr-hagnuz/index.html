
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>B"H - Ohr HaGnuz - The Hidden Light</title>
  <style>
    :root {
      --gold: #fff176;
      --violet: #7e57c2;
      --cyan: #4dd0e1;
      --deep: #050510;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(126,87,194,.20), transparent 38%),
        radial-gradient(circle at 20% 80%, rgba(77,208,225,.16), transparent 32%),
        linear-gradient(135deg, #020207, #09091f 44%, #03060a);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Share Tech Mono", "Courier New", monospace;
      touch-action: none;
      color: #fffde7;
    }

    body::before {
      content: "א ב ג ד ה ו ז ח ט י כ ל מ נ ס ע פ צ ק ר ש ת";
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      font: 700 72px serif;
      letter-spacing: 18px;
      color: rgba(255,255,255,.035);
      transform: rotate(-8deg);
      pointer-events: none;
      animation: drift 14s linear infinite alternate;
    }

    #game-shell {
      position: relative;
      width: min(96vw, 960px);
      aspect-ratio: 4 / 3;
      display: grid;
      place-items: center;
      border: 2px solid rgba(255,241,118,.45);
      border-radius: 22px;
      box-shadow:
        0 0 42px rgba(126,87,194,.35),
        inset 0 0 40px rgba(255,255,255,.05);
      background: rgba(0,0,0,.30);
      overflow: hidden;
    }

    .vessel-layer {
      position: absolute;
      width: min(92vw, 800px);
      height: auto;
      max-height: 92vh;
      image-rendering: pixelated;
      border-radius: 16px;
      filter: drop-shadow(0 0 12px rgba(255,241,118,.12));
    }

    #layer-bg { z-index: 10; }
    #layer-obj { z-index: 20; }
    #layer-over { z-index: 30; }

    @keyframes drift {
      from { transform: rotate(-8deg) translateY(-10px); }
      to { transform: rotate(-8deg) translateY(18px); }
    }
  </style>
</head>
<body>
  <main id="game-shell" aria-label="Ohr HaGnuz game canvas">
    <canvas id="layer-bg" width="800" height="600" class="vessel-layer"></canvas>
    <canvas id="layer-obj" width="800" height="600" class="vessel-layer"></canvas>
    <canvas id="layer-over" width="800" height="600" class="vessel-layer"></canvas>
  </main>

  <script type="module" src="./src/index.js"></script>
</body>
</html>
