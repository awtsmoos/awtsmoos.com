<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>B&quot;H - Ohr HaGnuz</title>
  <style>
    /** B"H — hard performance shell: no glow, no blur, no selection. */
    :root{--safe-top:max(4px,env(safe-area-inset-top));--safe-right:max(4px,env(safe-area-inset-right));--safe-bottom:max(4px,env(safe-area-inset-bottom));--safe-left:max(4px,env(safe-area-inset-left));--frame-w:calc(100vw - var(--safe-left) - var(--safe-right));--frame-h:calc(100dvh - var(--safe-top) - var(--safe-bottom))}
    *{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;min-height:100%;overflow:hidden;color:#fffde7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none;overscroll-behavior:none;background:#05070b}body{min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left)}button{font:inherit;color:inherit;touch-action:none;appearance:none;-webkit-appearance:none;outline:none}button:focus{outline:none}canvas{touch-action:none;display:block}
    #game-shell{position:relative;width:min(var(--frame-w),1180px);height:var(--frame-h);display:grid;place-items:center;border:1px solid rgba(255,241,118,.6);border-radius:18px;background:#070915;overflow:hidden;isolation:isolate;contain:layout style paint}
    .vessel-layer{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:inherit}.vessel-layer,#layer-over{pointer-events:none}#layer-bg{z-index:10}#layer-obj{z-index:20;pointer-events:auto}#layer-over{z-index:30}
    .ohr-ui-root{position:absolute;inset:0;z-index:45;pointer-events:none;contain:layout style}.ohr-ui-root *{touch-action:none}.ohr-ui-root button{pointer-events:auto;border:1px solid rgba(255,255,255,.34);background:#101421;color:#fffde7;font-weight:850;transition:transform .05s linear}.ohr-ui-root button:active{transform:scale(.96)}.ohr-touch small{display:block;font-size:11px;font-weight:850;margin-top:3px}.ohr-world-card{position:absolute;left:12px;top:76px;max-width:min(190px,48vw);padding:9px 11px;border:1px solid rgba(255,241,118,.5);border-radius:12px;background:#070b19;font-size:13px;line-height:1.25}.ohr-world-card b{display:block;color:#ffe082;margin-bottom:4px}.ohr-world-card span{display:block;color:#fff9df}
    .ohr-joy{position:absolute;left:clamp(14px,4vw,32px);bottom:clamp(14px,4vw,32px);width:116px;height:116px;border-radius:50%;background:#0b1020;border:1px solid rgba(255,255,255,.28);pointer-events:auto}.ohr-joy-core{position:absolute;left:50%;top:50%;width:42px;height:42px;border-radius:50%;transform:translate(-50%,-50%);background:#5130a4}.ohr-joy .ohr-touch{position:absolute;width:38px;height:38px;border-radius:50%;font-size:18px}.ohr-joy .up{left:39px;top:5px}.ohr-joy .down{left:39px;bottom:5px}.ohr-joy .left{left:5px;top:39px}.ohr-joy .right{right:5px;top:39px}
    .ohr-right-rail{position:absolute;right:clamp(12px,3.5vw,28px);top:clamp(86px,16vw,118px);display:grid;gap:10px}.ohr-bottom-actions{position:absolute;right:clamp(12px,4vw,32px);bottom:clamp(18px,4vw,34px);display:flex;gap:12px}.ohr-menu-action{position:absolute;left:clamp(12px,3.5vw,30px);top:clamp(36px,7vw,58px)}.ohr-right-rail .ohr-touch,.ohr-bottom-actions .ohr-touch,.ohr-menu-action .ohr-touch{min-width:58px;min-height:58px;border-radius:18px}.ohr-bottom-actions .ohr-touch:last-child{background:#0d4f86}.ohr-right-rail .ohr-touch{background:#101421}.ohr-menu-action .ohr-touch{background:#101421}
    .ohr-panel-shell{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:90px 16px 150px;pointer-events:none}.ohr-panel-shell[data-open="true"]{display:flex;pointer-events:auto}.ohr-panel{position:relative;width:min(420px,92vw);max-height:min(520px,60vh);overflow:auto;padding:18px;border:1px solid rgba(255,241,118,.72);border-radius:18px;background:#0d1022}.ohr-panel h2{margin:0 40px 8px 0;color:#ffe082;font:900 24px Georgia,serif}.ohr-panel>div{font-size:14px;line-height:1.45;color:#fff8dc;margin-bottom:12px}.ohr-panel section{display:grid;gap:8px}.ohr-panel p{display:flex;justify-content:space-between;gap:16px;margin:0;padding:10px 12px;border:1px solid rgba(255,255,255,.14);border-radius:10px;background:#171b2f}.ohr-panel p b{color:#fff59d}.ohr-panel p span{text-align:right;color:#e8f7ff}.ohr-panel [data-close-panel]{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:50%;font-size:22px;background:#03050c}
    .ohr-battle-actions{display:none;position:absolute;left:16px;right:16px;bottom:10px;justify-content:space-between;align-items:flex-end}.ohr-ui-root[data-realm="battle"] .ohr-joy,.ohr-ui-root[data-realm="battle"] .ohr-right-rail,.ohr-ui-root[data-realm="battle"] .ohr-bottom-actions,.ohr-ui-root[data-realm="battle"] .ohr-menu-action,.ohr-ui-root[data-realm="battle"] .ohr-world-card,.ohr-ui-root[data-realm="battle"] .ohr-panel-shell{display:none}.ohr-ui-root[data-realm="battle"] .ohr-battle-actions{display:flex}.ohr-battle-actions .ohr-touch{min-width:58px;min-height:42px;border-radius:14px;font-size:12px;background:#101421}
    @media (orientation:landscape){#game-shell{width:min(var(--frame-w),1180px);height:min(var(--frame-h),calc(var(--frame-w)*.75))}.ohr-ui-root[data-realm="battle"] .ohr-battle-actions{display:none}.ohr-panel-shell{padding:72px 150px 38px}}
    @media (max-width:480px){body{align-items:stretch}.ohr-world-card{top:78px;max-width:168px;font-size:12px}.ohr-right-rail .ohr-touch,.ohr-bottom-actions .ohr-touch,.ohr-menu-action .ohr-touch{min-width:56px;min-height:56px;border-radius:18px}.ohr-panel{max-height:54vh}.ohr-panel-shell{padding-top:94px}}
  </style>
</head>
<body oncontextmenu="return false" onselectstart="return false" ondragstart="return false">
  <main id="game-shell" aria-label="Ohr HaGnuz game canvas">
    <canvas id="layer-bg" width="390" height="844" class="vessel-layer"></canvas>
    <canvas id="layer-obj" width="390" height="844" class="vessel-layer"></canvas>
    <canvas id="layer-over" width="390" height="844" class="vessel-layer"></canvas>
    <div id="ohr-ui-root" class="ohr-ui-root" aria-label="mobile controls"></div>
  </main>
  <script type="module" src="./src/index.js"></script>
</body>
</html>
