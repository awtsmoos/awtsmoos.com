<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>B&quot;H - Ohr HaGnuz</title>
  <style>
    /**
     * B"H
     * Chapter 54: The screen became a polished phone-world vessel.
     * The Awtsmoos has no body and no form; the CSS only arranges glass,
     * shadow, thumb reach, and breathing space around the generated canvas.
     */
    :root{--gold:#fff176;--violet:#7e57c2;--cyan:#4dd0e1;--safe-top:max(4px,env(safe-area-inset-top));--safe-right:max(4px,env(safe-area-inset-right));--safe-bottom:max(4px,env(safe-area-inset-bottom));--safe-left:max(4px,env(safe-area-inset-left));--frame-w:calc(100vw - var(--safe-left) - var(--safe-right));--frame-h:calc(100dvh - var(--safe-top) - var(--safe-bottom))}
    *{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;overflow:hidden;color:#fffde7;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,sans-serif;touch-action:none;overscroll-behavior:none;background:radial-gradient(circle at 50% 22%,rgba(126,87,194,.28),transparent 36%),radial-gradient(circle at 20% 86%,rgba(77,208,225,.18),transparent 34%),linear-gradient(135deg,#020207,#09091f 46%,#03060a)}
    body{min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left)}
    body:before{content:"א ב ג ד ה ו ז ח ט י כ ל מ נ ס ע פ צ ק ר ש ת";position:fixed;inset:0;display:grid;place-items:center;font:800 clamp(30px,8vw,96px) Georgia,serif;letter-spacing:clamp(8px,2.2vw,20px);color:rgba(255,255,255,.035);transform:rotate(-8deg);pointer-events:none;animation:drift 14s linear infinite alternate}
    #game-shell{position:relative;width:min(var(--frame-w),1180px);height:var(--frame-h);display:grid;place-items:center;border:1px solid rgba(255,241,118,.62);border-radius:clamp(14px,3vw,24px);box-shadow:0 0 42px rgba(126,87,194,.35),inset 0 0 40px rgba(255,255,255,.05);background:rgba(0,0,0,.32);overflow:hidden;isolation:isolate}
    .vessel-layer{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:inherit;filter:drop-shadow(0 0 10px rgba(255,241,118,.1));touch-action:none;user-select:none}#layer-bg{z-index:10}#layer-obj{z-index:20}#layer-over{z-index:30;pointer-events:none}
    .ohr-ui-root{position:absolute;inset:0;z-index:45;pointer-events:none}.ohr-ui-root button{pointer-events:auto;border:1px solid rgba(255,255,255,.38);background:linear-gradient(145deg,rgba(14,17,33,.82),rgba(5,8,18,.7));color:#fffde7;backdrop-filter:blur(7px);box-shadow:0 10px 24px rgba(0,0,0,.35),0 0 18px rgba(126,87,194,.3);font:800 19px Inter,system-ui,sans-serif;transition:transform .12s ease,box-shadow .12s ease}.ohr-ui-root button:active{transform:scale(.94);box-shadow:0 3px 14px rgba(0,0,0,.5),0 0 26px rgba(255,241,118,.32)}.ohr-touch small{display:block;font:800 11px Inter,system-ui,sans-serif;margin-top:4px;text-shadow:0 2px 5px #000}.ohr-world-card{position:absolute;left:14px;top:82px;max-width:min(180px,45vw);padding:10px 12px;border:1px solid rgba(255,241,118,.55);border-radius:14px;background:rgba(3,6,16,.72);box-shadow:0 12px 28px rgba(0,0,0,.34),inset 0 0 20px rgba(255,255,255,.04);backdrop-filter:blur(6px);font-size:13px;line-height:1.25}.ohr-world-card b{display:block;color:#ffe082;margin-bottom:4px}.ohr-world-card span{display:block;color:#fff9df}
    .ohr-joy{position:absolute;left:clamp(16px,5vw,44px);bottom:clamp(18px,5vw,42px);width:148px;height:148px;border-radius:50%;background:radial-gradient(circle,rgba(80,56,124,.28),rgba(0,0,0,.35));border:1px solid rgba(255,255,255,.24);box-shadow:inset 0 0 34px rgba(255,255,255,.05),0 0 22px rgba(126,87,194,.25);pointer-events:auto}.ohr-joy-core{position:absolute;left:50%;top:50%;width:60px;height:60px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#a574ff,#2d155a);box-shadow:0 0 28px rgba(142,92,244,.78),inset 0 0 14px rgba(255,255,255,.18)}.ohr-joy .ohr-touch{position:absolute;width:46px;height:46px;border-radius:50%;font-size:20px}.ohr-joy .up{left:51px;top:7px}.ohr-joy .down{left:51px;bottom:7px}.ohr-joy .left{left:7px;top:51px}.ohr-joy .right{right:7px;top:51px}
    .ohr-right-rail{position:absolute;right:clamp(14px,4vw,34px);top:clamp(82px,15vw,116px);display:grid;gap:14px}.ohr-bottom-actions{position:absolute;right:clamp(14px,5vw,42px);bottom:clamp(22px,5vw,42px);display:flex;gap:16px}.ohr-menu-action{position:absolute;left:clamp(14px,4vw,36px);top:clamp(34px,7vw,56px)}.ohr-right-rail .ohr-touch,.ohr-bottom-actions .ohr-touch,.ohr-menu-action .ohr-touch{min-width:74px;min-height:74px;border-radius:25px}.ohr-right-rail .ohr-touch{border-color:rgba(202,168,255,.55)}.ohr-bottom-actions .ohr-touch:last-child{background:radial-gradient(circle,#1976d2,#0b355d);border-color:rgba(145,220,255,.6)}
    .ohr-battle-actions{display:none;position:absolute;left:16px;right:16px;bottom:10px;justify-content:space-between;align-items:flex-end}.ohr-ui-root[data-realm="battle"] .ohr-joy,.ohr-ui-root[data-realm="battle"] .ohr-right-rail,.ohr-ui-root[data-realm="battle"] .ohr-bottom-actions,.ohr-ui-root[data-realm="battle"] .ohr-menu-action,.ohr-ui-root[data-realm="battle"] .ohr-world-card{display:none}.ohr-ui-root[data-realm="battle"] .ohr-battle-actions{display:flex}.ohr-battle-actions .ohr-touch{min-width:58px;min-height:42px;border-radius:16px;font-size:12px;background:rgba(10,12,25,.72)}
    @media (orientation:landscape){#game-shell{width:min(var(--frame-w),1180px);height:min(var(--frame-h),calc(var(--frame-w)*.75))}.ohr-ui-root[data-realm="battle"] .ohr-battle-actions{display:none}}
    @media (max-width:480px){body{align-items:stretch}.ohr-world-card{top:76px;max-width:154px;font-size:12px}.ohr-right-rail .ohr-touch,.ohr-bottom-actions .ohr-touch,.ohr-menu-action .ohr-touch{min-width:68px;min-height:68px;border-radius:22px}.ohr-joy{width:132px;height:132px}.ohr-joy-core{width:54px;height:54px}.ohr-joy .up{left:43px}.ohr-joy .down{left:43px}.ohr-joy .left{top:43px}.ohr-joy .right{top:43px}}
    @keyframes drift{from{transform:rotate(-8deg) translateY(-10px)}to{transform:rotate(-8deg) translateY(18px)}}
  </style>
</head>
<body>
  <main id="game-shell" aria-label="Ohr HaGnuz game canvas">
    <canvas id="layer-bg" width="390" height="844" class="vessel-layer"></canvas>
    <canvas id="layer-obj" width="390" height="844" class="vessel-layer"></canvas>
    <canvas id="layer-over" width="390" height="844" class="vessel-layer"></canvas>
    <div id="ohr-ui-root" class="ohr-ui-root" aria-label="mobile controls"></div>
  </main>
  <script type="module" src="./src/index.js"></script>
</body>
</html>
