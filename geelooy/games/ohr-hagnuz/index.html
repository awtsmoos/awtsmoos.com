<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>B&quot;H - Ohr HaGnuz - The Hidden Light</title>
  <style>
    /**
     * B"H
     * Chapter 2: The Vessel Learns To Breathe Inside A Small Glass Sky.
     * The Awtsmoos has no body and no form; these rules only shape the finite
     * chamber where pixels receive room, air, and mercy on phone and desktop.
     */
    :root {
      --gold: #fff176;
      --violet: #7e57c2;
      --cyan: #4dd0e1;
      --deep: #050510;
      --safe-top: max(6px, env(safe-area-inset-top));
      --safe-right: max(6px, env(safe-area-inset-right));
      --safe-bottom: max(6px, env(safe-area-inset-bottom));
      --safe-left: max(6px, env(safe-area-inset-left));
      --frame-w: min(calc(100vw - var(--safe-left) - var(--safe-right)), 1180px);
      --frame-h: min(calc(100dvh - var(--safe-top) - var(--safe-bottom)), calc(var(--frame-w) * .75));
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 22%, rgba(126, 87, 194, .28), transparent 36%),
        radial-gradient(circle at 20% 86%, rgba(77, 208, 225, .18), transparent 34%),
        linear-gradient(135deg, #020207, #09091f 46%, #03060a);
      color: #fffde7;
      font-family: "Share Tech Mono", "Courier New", monospace;
      touch-action: none;
      overscroll-behavior: none;
    }

    body {
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    }

    body::before {
      content: "א ב ג ד ה ו ז ח ט י כ ל מ נ ס ע פ צ ק ר ש ת";
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      font: 700 clamp(28px, 7vw, 94px) serif;
      letter-spacing: clamp(6px, 2vw, 18px);
      color: rgba(255, 255, 255, .035);
      transform: rotate(-8deg);
      pointer-events: none;
      animation: drift 14s linear infinite alternate;
    }

    #game-shell {
      position: relative;
      width: var(--frame-w);
      height: var(--frame-h);
      aspect-ratio: 4 / 3;
      display: grid;
      place-items: center;
      border: 1px solid rgba(255, 241, 118, .62);
      border-radius: clamp(10px, 2.6vw, 22px);
      box-shadow: 0 0 42px rgba(126, 87, 194, .35), inset 0 0 40px rgba(255, 255, 255, .05);
      background: rgba(0, 0, 0, .32);
      overflow: hidden;
      isolation: isolate;
    }

    .vessel-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      border-radius: inherit;
      filter: drop-shadow(0 0 10px rgba(255, 241, 118, .10));
      touch-action: none;
      user-select: none;
    }

    #layer-bg { z-index: 10; }
    #layer-obj { z-index: 20; }
    #layer-over { z-index: 30; pointer-events: none; }

    @media (orientation: portrait) {
      :root {
        --frame-w: min(calc(100vw - var(--safe-left) - var(--safe-right)), calc((100dvh - var(--safe-top) - var(--safe-bottom)) * 1.3333));
        --frame-h: calc(var(--frame-w) * .75);
      }

      body {
        align-items: flex-start;
        padding-top: max(var(--safe-top), 10px);
      }
    }

    @media (min-width: 980px) and (min-height: 760px) {
      :root { --frame-w: min(96vw, 1120px); }
    }

    @media (min-width: 1280px) and (min-height: 900px) {
      :root { --frame-w: min(92vw, 1240px); }
      .vessel-layer { image-rendering: auto; }
    }

    @keyframes drift {
      from { transform: rotate(-8deg) translateY(-10px); }
      to { transform: rotate(-8deg) translateY(18px); }
    }
  </style>
</head>
<body>
  <main id="game-shell" aria-label="Ohr HaGnuz game canvas">
    <canvas id="layer-bg" width="800" height="600" class="vessel-layer"></canvas>
    <canvas id="layer-obj" width="800" height="600" class="vessel-layer"></canvas>
    <canvas id="layer-over" width="800" height="600" class="vessel-layer"></canvas>
  </main>

  <script type="module" src="./src/index.js"></script>
</body>
</html>
