<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>B&quot;H - Ohr HaGnuz</title>
  <style>
    /** B"H: Chapter 20 — the phone became a small sanctuary of light. */
    :root{--gold:#fff176;--violet:#7e57c2;--cyan:#4dd0e1;--safe-top:max(6px,env(safe-area-inset-top));--safe-right:max(6px,env(safe-area-inset-right));--safe-bottom:max(6px,env(safe-area-inset-bottom));--safe-left:max(6px,env(safe-area-inset-left));--frame-w:min(calc(100vw - var(--safe-left) - var(--safe-right)),1180px);--frame-h:min(calc(100dvh - var(--safe-top) - var(--safe-bottom)),calc(var(--frame-w)*.75))}
    *{box-sizing:border-box} html,body{margin:0;width:100%;min-height:100%;overflow:hidden;color:#fffde7;font-family:"Share Tech Mono","Courier New",monospace;touch-action:none;overscroll-behavior:none;background:radial-gradient(circle at 50% 22%,rgba(126,87,194,.28),transparent 36%),radial-gradient(circle at 20% 86%,rgba(77,208,225,.18),transparent 34%),linear-gradient(135deg,#020207,#09091f 46%,#03060a)}
    body{min-height:100dvh;display:flex;justify-content:center;align-items:flex-start;padding:var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left)}
    body:before{content:"א ב ג ד ה ו ז ח ט י כ ל מ נ ס ע פ צ ק ר ש ת";position:fixed;inset:0;display:grid;place-items:center;font:700 clamp(28px,7vw,94px) serif;letter-spacing:clamp(6px,2vw,18px);color:rgba(255,255,255,.035);transform:rotate(-8deg);pointer-events:none;animation:drift 14s linear infinite alternate}
    #game-shell{position:relative;width:var(--frame-w);height:var(--frame-h);aspect-ratio:4/3;display:grid;place-items:center;border:1px solid rgba(255,241,118,.62);border-radius:clamp(10px,2.6vw,22px);box-shadow:0 0 42px rgba(126,87,194,.35),inset 0 0 40px rgba(255,255,255,.05);background:rgba(0,0,0,.32);overflow:hidden;isolation:isolate}
    .vessel-layer{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;border-radius:inherit;filter:drop-shadow(0 0 10px rgba(255,241,118,.1));touch-action:none;user-select:none}#layer-bg{z-index:10}#layer-obj{z-index:20}#layer-over{z-index:30;pointer-events:none}
    .ohr-ui-root{position:absolute;inset:0;z-index:45;pointer-events:none}.ohr-ui-root button{pointer-events:auto;border:1px solid rgba(255,255,255,.45);background:rgba(15,15,28,.66);color:#fffde7;backdrop-filter:blur(4px);box-shadow:0 0 18px rgba(126,87,194,.32);font:700 22px monospace}.ohr-touch small{display:block;font:700 12px monospace;margin-top:4px}.ohr-joy{position:absolute;left:clamp(18px,5vw,44px);bottom:clamp(20px,6vw,42px);width:148px;height:148px;border-radius:50%;background:rgba(0,0,0,.36);border:1px solid rgba(255,255,255,.24);pointer-events:auto}.ohr-joy-core{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#8e5cf4,#2d155a);box-shadow:0 0 22px rgba(142,92,244,.72)}.ohr-joy .ohr-touch{position:absolute;width:44px;height:44px;border-radius:50%}.ohr-joy .up{left:52px;top:8px}.ohr-joy .down{left:52px;bottom:8px}.ohr-joy .left{left:8px;top:52px}.ohr-joy .right{right:8px;top:52px}
    .ohr-right-rail{position:absolute;right:clamp(18px,4vw,36px);top:clamp(34px,7vw,56px);display:grid;gap:16px}.ohr-bottom-actions{position:absolute;right:clamp(18px,5vw,42px);bottom:clamp(22px,6vw,42px);display:flex;gap:18px}.ohr-menu-action{position:absolute;left:clamp(18px,4vw,36px);top:clamp(34px,7vw,56px)}.ohr-battle-actions{display:none;position:absolute;left:34px;right:34px;bottom:28px;justify-content:space-between}.ohr-ui-root[data-realm="battle"] .ohr-joy,.ohr-ui-root[data-realm="battle"] .ohr-right-rail,.ohr-ui-root[data-realm="battle"] .ohr-bottom-actions,.ohr-ui-root[data-realm="battle"] .ohr-menu-action{display:none}.ohr-ui-root[data-realm="battle"] .ohr-battle-actions{display:flex}.ohr-right-rail .ohr-touch,.ohr-bottom-actions .ohr-touch,.ohr-menu-action .ohr-touch,.ohr-battle-actions .ohr-touch{min-width:76px;min-height:76px;border-radius:24px}.ohr-bottom-actions .ohr-touch:last-child{background:radial-gradient(circle,#1976d2,#0b355d)}
    @media (orientation:portrait){:root{--frame-w:min(calc(100vw - var(--safe-left) - var(--safe-right)),calc((100dvh - var(--safe-top) - var(--safe-bottom))*1.3333));--frame-h:calc(var(--frame-w)*.75)}body{padding-top:max(var(--safe-top),10px)}}
    @media (min-width:980px) and (min-height:760px){:root{--frame-w:min(96vw,1120px)}}@media (min-width:1280px) and (min-height:900px){:root{--frame-w:min(92vw,1240px)}.vessel-layer{image-rendering:auto}}
    @keyframes drift{from{transform:rotate(-8deg) translateY(-10px)}to{transform:rotate(-8deg) translateY(18px)}}
  </style>
</head>
<body>
  <main id="game-shell" aria-label="Ohr HaGnuz game canvas">
    <canvas id="layer-bg" width="800" height="600" class="vessel-layer"></canvas>
    <canvas id="layer-obj" width="800" height="600" class="vessel-layer"></canvas>
    <canvas id="layer-over" width="800" height="600" class="vessel-layer"></canvas>
    <div id="ohr-ui-root" class="ohr-ui-root" aria-label="mobile controls"></div>
  </main>
  <script type="module" src="./src/index.js"></script>
</body>
</html>
