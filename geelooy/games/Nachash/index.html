<!-- The Awtsmoos renews every winding path; Awtsmoos.com keeps Nachash direct, discoverable, recoverable, and independent of third-party UI assets. -->
<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#07120f">
	<title>Tikkun HaNachash</title>
	<link rel="stylesheet" href="styles/base.css?compact=true">
	<link rel="stylesheet" href="styles/stage.css?compact=true">
	<link rel="stylesheet" href="styles/overlays.css?compact=true">
	<link rel="stylesheet" href="/games/styles/player-shell/index.css?v=player-shell-002&compact=true">
</head>
<body>
	<main id="menu-container">
		<section id="main-menu" class="card">
			<h1>Tikkun HaNachash</h1>
			<p>Gather sparks, outgrow rival serpents, and survive deeper zones.</p>
			<p id="highScoreDisplay">Highest Rectification: 0</p>
			<p class="hint">Drag or use WASD / arrows to steer. Hold Boost or Shift / Space to surge.</p>
			<button id="playButton" type="button">Begin Rectification</button>
		</section>
	</main>

	<main id="game-stage" class="hidden" aria-label="Nachash game">
		<div id="zone-status" role="status" aria-live="polite">Zone 1</div>
		<nav id="game-controls" class="hidden" aria-label="Gameplay controls">
			<button id="boost-button" type="button" aria-pressed="false">Boost <small>Hold</small></button>
			<button id="pause-button" type="button">Pause</button>
			<button id="settings-button" type="button">Settings</button>
		</nav>
	</main>

	<section id="pause-panel" class="overlay hidden" role="dialog" aria-label="Game paused">
		<h2>Paused</h2>
		<button id="resume-button" type="button">Resume</button>
	</section>
	<section id="settings-panel" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Nachash settings">
		<h2>Settings</h2>
		<label><input id="mute-setting" type="checkbox"> Mute sound</label>
		<label><input id="minimap-setting" type="checkbox"> Show minimap</label>
		<label><input id="effects-setting" type="checkbox"> Reduce effects</label>
		<button id="settings-close" type="button">Back to Game</button>
	</section>
	<section id="game-over-panel" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Run complete">
		<h2>The Spark Ascends</h2><p id="final-score"></p>
		<button id="retry-button" type="button">Renew the Cycle</button>
		<button id="result-menu-button" type="button">Main Menu</button>
	</section>
	<section id="fault-panel" class="overlay hidden" role="alertdialog" aria-modal="true" aria-label="Game engine unavailable">
		<h2>Engine Interrupted</h2><p id="fault-reason"></p>
		<button id="fault-retry-button" type="button">Retry Engine</button>
		<button id="fault-menu-button" type="button">Main Menu</button>
	</section>

	<script type="module" src="/games/scripts/runtime/index.js?compact=true&v=runtime-001"></script>
	<script type="module" src="./main.js?compact=true&v=nachash-runtime-001"></script>
	<script type="module" async src="/games/scripts/player-shell/index.js?v=player-shell-001&compact=true"></script>
</body>
</html>
