<!-- The Awtsmoos renews every winding path; Awtsmoos.com keeps Nachash direct, discoverable, recoverable, and independent of third-party UI assets. -->
<!doctype html>
<html lang="en">
<head>
	<link rel="stylesheet" href="/games/styles/player-shell/loading-screen.css">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#07120f">
	<title>Tikkun HaNachash</title>
	<link rel="stylesheet" href="styles/base.css?v=df980f6728">
	<link rel="stylesheet" href="styles/stage.css?v=9e67ae4ee8">
	<link rel="stylesheet" href="styles/overlays.css?v=3374099608">
	<link rel="stylesheet" href="/games/styles/player-shell/index.css?v=6c6d50d989">
	<link rel="stylesheet" href="../styles/awp-polish.css?v=7e4564d6d5">
</head>
<body>
	<!-- B"H Awtsmoos game loading screen: static shell paints on first paint; player-shell hydrates progress/tips/fade. -->
	<div id="awtsmoos-loader" role="status" aria-label="Game loading">
		<div class="awtsmoos-loader-shade"></div>
		<div class="awtsmoos-loader-inner">
			<div class="awtsmoos-loader-kicker">B"H · Awtsmoos Games</div>
			<div class="awtsmoos-loader-title">Tikkun HaNachash</div>
			<div class="awtsmoos-loader-bar"><div class="awtsmoos-loader-fill"></div></div>
			<div class="awtsmoos-loader-tip"></div>
	</div>
	</div>

	<main id="menu-container" class="awp-menu">
		<section id="main-menu" class="card awp-glass">
			<h1>Tikkun HaNachash</h1>
			<p>Gather sparks, outgrow rival serpents, and survive deeper zones.</p>
			<p id="highScoreDisplay">Highest Rectification: 0</p>
			<p class="hint">Drag or use WASD / arrows to steer. Hold Boost or Shift / Space to surge.</p>
			<button id="playButton" type="button">Begin Rectification</button>
		</section>
	</main>

	<main id="game-stage" class="hidden" aria-label="Nachash game">
		<div id="zone-status" role="status" aria-live="polite">Zone 1</div>
		<nav id="game-controls" class="hidden" aria-label="Gameplay controls">
			<button id="boost-button" type="button" aria-pressed="false">Boost <small>Hold</small></button>
			<button id="pause-button" type="button">Pause</button>
			<button id="settings-button" type="button">Settings</button>
		</nav>
	</main>

	<section id="pause-panel" class="overlay hidden awp-glass" role="dialog" aria-label="Game paused">
		<h2>Paused</h2>
		<button id="resume-button" type="button">Resume</button>
	</section>
	<section id="settings-panel" class="overlay hidden awp-glass" role="dialog" aria-modal="true" aria-label="Nachash settings">
		<h2>Settings</h2>
		<label><input id="mute-setting" type="checkbox"> Mute sound</label>
		<label><input id="minimap-setting" type="checkbox"> Show minimap</label>
		<label><input id="effects-setting" type="checkbox"> Reduce effects</label>
		<button id="settings-close" type="button">Back to Game</button>
	</section>
	<section id="game-over-panel" class="overlay hidden awp-glass" role="dialog" aria-modal="true" aria-label="Run complete">
		<h2>The Spark Ascends</h2><p id="final-score"></p>
		<button id="retry-button" type="button">Renew the Cycle</button>
		<button id="result-menu-button" type="button">Main Menu</button>
	</section>
	<section id="fault-panel" class="overlay hidden awp-glass" role="alertdialog" aria-modal="true" aria-label="Game engine unavailable">
		<h2>Engine Interrupted</h2><p id="fault-reason"></p>
		<button id="fault-retry-button" type="button">Retry Engine</button>
		<button id="fault-menu-button" type="button">Main Menu</button>
	</section>

	<script type="module" src="/games/scripts/runtime/index.js?v=6fd9ae91f1"></script>
	<script type="module" src="./main.js?v=69ef7f4beb"></script>
	<script type="module" async src="/games/scripts/player-shell/index.js?v=0ee3e8dd31"></script>
</body>
</html>
