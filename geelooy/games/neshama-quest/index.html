<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="theme-color" content="#050510">
	<title>Neshama Quest · Awtsmoos Games</title>
	<link rel="stylesheet" href="./style.css?compact=true">
	<link rel="stylesheet" href="/games/styles/player-shell/index.css?v=player-shell-003&compact=true">
</head>
<body>
	<header class="gameHeader">
		<h1>Neshama Quest</h1>
		<button id="pauseButton" type="button">Pause</button>
	</header>
	<main id="game-container">
		<canvas id="gameCanvas" aria-label="Neshama Quest maze. Swipe or use arrow keys and WASD to move."></canvas>
		<section id="game-info" aria-label="Run status">
			<span>Score <b id="score">0</b></span>
			<span>Lives <b id="lives">3</b></span>
			<span>Level <b id="level">1</b></span>
		</section>
		<p id="message" role="status" aria-live="polite"></p>
		<section id="resultOverlay" class="resultOverlay" hidden>
			<p class="eyebrow">Run complete</p>
			<h2>Game Over</h2>
			<p id="resultSummary">Score 0 · reached level 1</p>
			<button id="retryButton" type="button">Try Again</button>
		</section>
	</main>

	<script src="./config.js"></script>
	<script src="./maze.js"></script>
	<script src="./entities.js"></script>
	<script src="./input.js"></script>
	<script src="./game/scoring.js"></script>
	<script src="./game/level.js"></script>
	<script src="./game/movement.js"></script>
	<script src="./game/ai.js"></script>
	<script src="./game/collisions.js"></script>
	<script src="./game/renderer.js"></script>
	<script src="./game/loop.js"></script>
	<script src="./game/coordinator.js"></script>
	<script src="./game.js"></script>
	<script type="module" src="/games/scripts/runtime/index.js?compact=true&v=runtime-001"></script>
	<script type="module" async src="/games/scripts/player-shell/index.js?v=player-shell-003&compact=true"></script>
</body>
</html>
