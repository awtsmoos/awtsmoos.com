<body>
	<div id="menuBoot" class="Awtsmoos-menu-boot" role="status" aria-live="polite">
		<section class="Awtsmoos-loading-card">
			<p class="Awtsmoos-loading-kicker">B&quot;H · Mitzvah World</p>
			<h1>Opening the restored living river valley</h1>
			<p id="loadingMessage">Loading the verified world, real Chossid, terrain, road, water, and creatures…</p>
			<div class="Awtsmoos-progress-group">
				<div class="Awtsmoos-progress-heading"><span>World systems</span><output id="worldProgressValue">0%</output></div>
				<progress id="worldProgress" max="100" value="0"></progress>
			</div>
			<div class="Awtsmoos-progress-group">
				<div class="Awtsmoos-progress-heading"><span>Chossid and equipment</span><output id="modelProgressValue">0%</output></div>
				<progress id="modelProgress" max="100" value="0"></progress>
				<small id="modelProgressDetail">Waiting for garment nodes, hand/back weapons, river, lake, trees, and flowers…</small>
			</div>
		</section>
	</div>
	<canvas id="AwtsmoosCanvas" aria-label="Mitzvah World restored living river valley"></canvas>
	<div id="hud" role="status"></div>
	<section id="playerHudShell" class="Awtsmoos-player-hud-shell">
		<button type="button" data-retract-toggle aria-label="Retract player HUD">−</button>
		<div id="npcTarget"></div>
	</section>
	<div id="combatTarget" data-visible="false"></div>
	<div id="npcDialogue"></div>
	<section id="mobileControls" class="Awtsmoos-mobile-shell">
		<button type="button" data-retract-toggle aria-label="Retract mobile controls">−</button>
		<div id="joy"></div>
		<button id="jump" type="button" aria-label="Jump or double jump">↑</button>
	</section>
	<div id="actions"></div>
	<div id="gameRail"></div>
	<div id="combatFx" hidden></div>
	<div id="inventory"></div>
	<div id="meadowMenu"></div>
	<script type="module" src="./experiments/Awtsmoos/src/launcher/MinimalSharedMeadowPage.js?compact=true&rev=20260724-mobile-integration-2"></script>
