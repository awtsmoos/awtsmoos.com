<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#07140b">
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox=%220%200%2064%2064%22%3E%3Ctitle%3EMitzvah%20World%3C%2Ftitle%3E%3Crect%20width=%2264%22%20height=%2264%22%20rx=%2214%22%20fill=%22%2307140b%22%2F%3E%3Ccircle%20cx=%2246%22%20cy=%2217%22%20r=%227%22%20fill=%22%23f4c95d%22%2F%3E%3Cpath%20d=%22M6%2043L22%2027L34%2039L44%2029L58%2043V58H6Z%22%20fill=%22%232f8a59%22%2F%3E%3Cpath%20d=%22M30%2035C38%2040%2024%2045%2033%2050C39%2054%2032%2058%2028%2062%22%20fill=%22none%22%20stroke=%22%2367c5e8%22%20stroke-width=%223%22%20stroke-linecap=%22round%22%2F%3E%3C%2Fsvg%3E">
	<title>B&quot;H Mitzvah World — Restored River Valley</title>
	<script type="importmap">
	{
		"imports": {
			"awtsmoos-procedural-box": "/libs/awtsmoos-procedural/src/mesh/primitives/box.js?compact=true",
			"awtsmoos-procedural-round": "/libs/awtsmoos-procedural/src/mesh/primitives/round.js?compact=true",
			"awtsmoos-procedural-core": "./experiments/Awtsmoos/src/app/MinimalMeadowTreeCoreFacade.js"
		}
	}
	</script>
	<link rel="stylesheet" href="./styles/generated/mitzvah-world.production.css">
</head>
<body>
	<main id="mitzvah-world-root" data-awtsmoos-runtime="starting" data-awtsmoos-entry="waiting">
		<div id="menuBoot" class="Awtsmoos-menu-boot" role="status" aria-live="polite">
			<section class="Awtsmoos-loading-card">
				<p class="Awtsmoos-loading-kicker">B&quot;H · Mitzvah World</p>
				<h1>Opening the restored living river valley</h1>
				<p id="loadingMessage">Preparing movement, combat, inventory, quests, and recovery…</p>
				<div class="Awtsmoos-progress-group">
					<div class="Awtsmoos-progress-heading"><span>Essential world</span><output id="worldProgressValue">0%</output></div>
					<progress id="worldProgress" max="100" value="0"></progress>
				</div>
				<div class="Awtsmoos-progress-group">
					<div class="Awtsmoos-progress-heading"><span>Optional visual hydration</span><output id="modelProgressValue">0%</output></div>
					<progress id="modelProgress" max="100" value="0"></progress>
					<small id="modelProgressDetail">Fallback play begins before remote models and decoration finish.</small>
				</div>
			</section>
		</div>
		<canvas id="AwtsmoosCanvas" aria-label="Mitzvah World restored living river valley"></canvas>
		<div id="hud" role="status"></div>
		<section id="playerHudShell" class="Awtsmoos-player-hud-shell">
			<button type="button" data-retract-toggle aria-label="Retract player HUD">−</button>
			<div id="npcTarget"></div>
		</section>
		<div id="combatTarget" data-visible="false"></div>
		<div id="npcDialogue"></div>
		<section id="mobileControls" class="Awtsmoos-mobile-shell" data-mobile-combat-controls>
			<button type="button" data-retract-toggle aria-label="Retract mobile controls">−</button>
			<div id="joy"></div>
			<button id="jump" type="button" aria-label="Jump or double jump">↑</button>
		</section>
		<div id="actions"></div>
		<div id="gameRail" data-hud-rail></div>
		<div id="combatFx" hidden></div>
		<div id="inventory"></div>
		<div id="meadowMenu"></div>
	</main>
	<script type="module" src="./experiments/Awtsmoos/src/mitzvah-world.compact.js"></script>
</body>
</html>
