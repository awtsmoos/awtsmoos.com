    const phase = String(event?.detail?.phase || event?.detail?.reason || '');
    if (/world_final_ready|rendered first time/i.test(phase)) finalReadySeen = true;
    if (/first-playable-frame|world_final_ready|rendered first time|gameplay-ready/i.test(phase)) {
      playableSeen = true;
      setTimeout(() => hide(phase || 'playable'), 80);
    }
  });
  window.addEventListener('awtsmoos:worker-gameplay-fps', () => { playableSeen = true; soften('Worker is rendering; waiting for final playable world signal.'); });
  const timer = setInterval(() => {
    const proof = canvasProof();
    const loaded = window.__AWTSMOOS_BOOT_LOADED__ || window.__AWTSMOOS_LOADING_FINAL_READY__;
    if (hidden) return clearInterval(timer);
    if (finalReadySeen || (loaded && loaded.playable === true)) hide(loaded?.reason || 'world-final-ready-proof');
    else if (proof.firstCanvasSeen && window.__AWTSMOOS_BOOT_LOADED__) hide('first-visible-canvas-boot-loaded-fast-path');
    else if (proof.firstCanvasSeen && Date.now() - proof.at < 1000) soften('Canvas is visible; entering immediately.');
  }, 160);
  setTimeout(() => { if (!hidden) soften('Still verifying worker, terrain, physics, gameplay, and first playable frame.'); }, 4500);
  setTimeout(() => { if (!hidden) soften('Solid-color world is playable; textures continue in background.'); }, 1800);
})();
</script>
