<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Awtsmoos - Mitzvah World 3D</title>
  <link rel="stylesheet" href="./main.css?v=player-facing-starter-ui-20260615-bh1">
  <link rel="stylesheet" href="./styles/mobile-ui-overlap-fix.css?v=all-at-once-mobile-perf-visual-20260617-bh1" data-awtsmoos-mobile-overlap-fix="true">
  <style>
    :root { --gold:#ffd966; --blue:#12203b; --ink:#050814; --paper:#f8e4b0; --red:#ff6b4a; --green:#9be27a; --gray:#9ca3af; }
    body, html { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #ikar { width:100vw; height:100vh; position:absolute; inset:0; }
    #mitzvahUiBridge { position:fixed; inset:0; pointer-events:none; z-index:9000; font-family:system-ui, sans-serif; color:white; }
    #mitzvahTopLeft, #mitzvahTopRight, #mitzvahBottomCenter, #mitzvahCenter, #mitzvahWorldMarkers { position:absolute; display:flex; gap:8px; }
    #mitzvahTopLeft { top:12px; left:12px; flex-direction:column; width:360px; }
    #mitzvahTopRight { top:12px; right:12px; flex-direction:column; align-items:flex-end; width:360px; }
    #mitzvahBottomCenter { left:50%; bottom:18px; transform:translateX(-50%); flex-direction:column; align-items:center; width:min(560px, 90vw); }
    #mitzvahCenter { left:50%; top:50%; transform:translate(-50%,-50%); flex-direction:column; width:min(520px, 92vw); }
    #mitzvahWorldMarkers { inset:0; display:block; overflow:hidden; }
    .mitzvahPanel { pointer-events:auto; background:linear-gradient(180deg, rgba(12,18,35,.94), rgba(4,7,14,.88)); border:1px solid rgba(255,217,102,.55); border-radius:10px; padding:10px 12px; backdrop-filter:blur(4px); font-size:12px; line-height:1.35; box-shadow:0 0 24px rgba(0,0,0,.45), inset 0 0 16px rgba(255,217,102,.05); }
    .mitzvahPanel strong, .mitzvahTitle { color:var(--gold); font-weight:800; letter-spacing:.02em; }
    .mitzvahPanel small { color:#d9e3ff; opacity:.85; }
    .mitzvahChoice, .mitzvahBtn { display:block; margin-top:6px; padding:7px 9px; border-radius:7px; background:rgba(255,217,102,.12); border:1px solid rgba(255,217,102,.28); color:#fff3c4; }
    .mitzvahReward { color:var(--green); }
    .mitzvahWarn { color:var(--red); }
    .mitzvahQuestLine { margin-top:4px; color:#f3f4f6; }
    .mitzvahDone { color:var(--green); }
    .mitzvahMuted { color:var(--gray); }
    .mitzvahMarker { position:absolute; transform:translate(-50%, -100%); color:var(--gold); font-weight:900; text-shadow:0 2px 6px #000, 0 0 10px var(--gold); font-size:28px; }
    .mitzvahMarker.gray { color:#cbd5e1; text-shadow:0 2px 6px #000; }
    .mitzvahSparkle { color:#ffe8a3; animation:mitzvahPulse 1.2s ease-in-out infinite; }
    .mitzvahCastTrack { height:10px; border-radius:8px; background:#111827; border:1px solid rgba(255,255,255,.2); overflow:hidden; margin-top:6px; }
    .mitzvahCastFill { height:100%; background:linear-gradient(90deg, #f59e0b, #fde68a); }
    @keyframes mitzvahPulse { 0%,100%{opacity:.65; transform:scale(1)} 50%{opacity:1; transform:scale(1.08)} }
    #awtsmoosUiSinks { display:none !important; }
  </style>
</head>
<body>
  <div id="ikar" shaym="ikar"></div>
  <div id="awtsmoosUiSinks" aria-hidden="true">
    <div shaym="torahSkills"></div><div shaym="torahSpellbook"></div><div shaym="knowledgeMenu"></div><div shaym="skillBar"></div><div shaym="torahCodex"></div><div shaym="objectiveProgress"></div><div shaym="torahActionBar"></div><div shaym="macroPanel"></div><div shaym="nameplates"></div><div shaym="playerProgress"></div><div shaym="farmPanel"></div><div shaym="tutorialHint"></div><div shaym="combatLog"></div><div shaym="targetCastBar"></div><div shaym="castBar"></div><div shaym="floatingCombatText"></div><div shaym="questTracker"></div>
  </div>
  <div id="mitzvahUiBridge" aria-hidden="true">
    <div id="mitzvahWorldMarkers"></div>
    <div id="mitzvahTopLeft"></div>
    <div id="mitzvahTopRight"></div>
    <div id="mitzvahCenter"></div>
    <div id="mitzvahBottomCenter"></div>
  </div>

  <script type="module" src="./systems/vehicles/VehicleAutoBoot.js?v=vehicle-world-expansion-20260616-bh1"></script>
  <script type="module" src="./systems/autoplay/AutoPlayBoot.js?v=autoplay-debug-harness-20260616-bh1"></script>
  <script type="module" src="./systems/ui/universe/UniversePastePanel.js"></script>

</body>
</html>
