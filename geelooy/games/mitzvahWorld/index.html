    html,body{margin:0;height:100%;overflow:hidden;background:#06100a;color:#eaffff;font-family:system-ui,Arial}canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block}#hud{position:fixed;left:12px;top:12px;right:12px;max-width:680px;background:rgba(8,24,36,.68);border:1px solid #35ffd8;border-radius:12px;padding:10px 14px;z-index:4;font-size:15px;backdrop-filter:blur(6px)}#joy{position:fixed;left:22px;bottom:84px;width:126px;height:126px;z-index:5}.Awtsmoos-joy-base{position:absolute;inset:0;border-radius:50%;background:rgba(20,60,80,.31);border:1px solid #35ffd8;touch-action:none}.Awtsmoos-joy-knob{position:absolute;left:42px;top:42px;width:42px;height:42px;border-radius:50%;background:#fff2a3;box-shadow:0 0 18px #35ffd8}#jump{position:fixed;right:32px;bottom:104px;width:74px;height:74px;z-index:5}.Awtsmoos-jump-button{width:100%;height:100%;border-radius:50%;border:1px solid #ffd166;background:rgba(255,209,102,.19);color:#fff7d6;font-size:29px;font-weight:800;box-shadow:0 0 18px rgba(255,209,102,.42);touch-action:none}.Awtsmoos-action-host{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:6}.Awtsmoos-action-bar{display:flex;gap:10px;padding:7px 10px;border:1px solid rgba(53,255,216,.42);border-radius:18px;background:rgba(3,10,18,.68);backdrop-filter:blur(7px);box-shadow:0 0 22px rgba(53,255,216,.12)}.Awtsmoos-action-bar button{width:58px;height:52px;border-radius:13px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.08);color:#eaffff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;touch-action:none}.Awtsmoos-action-bar span{font-size:23px}.Awtsmoos-action-bar small{font-size:10px;opacity:.82}.Awtsmoos-inventory-shell{position:fixed;inset:0;pointer-events:none;z-index:9}.Awtsmoos-inventory-panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) scale(.98);width:min(94vw,860px);max-height:82vh;display:none;flex-direction:column;border:1px solid #35ffd8;border-radius:20px;background:rgba(5,10,18,.94);box-shadow:0 0 42px rgba(0,0,0,.82),inset 0 0 24px rgba(53,255,216,.12);padding:12px;color:#eaffff;pointer-events:auto;overflow:visible}.Awtsmoos-inventory-panel[data-open="true"]{display:flex}.Awtsmoos-inventory-panel header{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;border-bottom:1px solid rgba(255,255,255,.14);padding:6px 4px 10px}.Awtsmoos-inventory-panel header b{font-size:18px}.Awtsmoos-inventory-panel header span{color:#ffe9a3;font-weight:800}.Awtsmoos-inventory-panel button{font:inherit;color:#eaffff}.Awtsmoos-inventory-panel [data-close]{background:#401219;color:#fff;border:1px solid #ff6b6b;border-radius:12px;padding:7px 12px}.inv-body{display:grid;grid-template-columns:minmax(190px,260px) 1fr;gap:12px;min-height:0;overflow:auto;padding-top:10px}.inv-body h3{margin:0 0 8px;font-size:14px;color:#a9fff0;text-transform:uppercase;letter-spacing:.08em}.equip-grid{display:grid;grid-template-columns:1fr;gap:7px}.bag-grid{display:grid;grid-template-columns:repeat(6,minmax(58px,1fr));gap:7px}.inv-slot{min-height:62px;border:1px solid rgba(255,255,255,.16);border-radius:12px;background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.035));display:grid;grid-template-columns:auto 1fr;grid-template-rows:1fr auto;gap:0 6px;align-items:center;text-align:left;padding:7px;touch-action:none}.inv-slot span{grid-row:1/3;font-size:25px}.inv-slot b{font-size:12px;line-height:1.05}.inv-slot small{font-size:10px;color:#b8d7d8;overflow:hidden;text-overflow:ellipsis}.inv-slot.empty{opacity:.48;border-style:dashed}.inv-slot.off{filter:grayscale(1);opacity:.55}.inv-slot:focus,.inv-slot:hover{outline:2px solid rgba(53,255,216,.45)}.item-card{margin-top:10px;border:1px solid rgba(255,209,102,.28);border-radius:14px;background:rgba(255,209,102,.08);padding:10px;min-height:94px}.item-card h4{margin:0 0 6px}.item-card p{margin:0 0 9px;line-height:1.35}.item-card output{display:block;margin-top:7px;color:#ffe9a3;font-size:12px}.inv-context-menu{position:fixed;display:none;width:min(220px,78vw);z-index:12;border:1px solid #ffd166;border-radius:14px;background:rgba(8,12,18,.96);box-shadow:0 10px 34px rgba(0,0,0,.65),0 0 18px rgba(255,209,102,.18);padding:10px;pointer-events:auto}.inv-context-menu[data-open="true"]{display:block}.inv-context-menu h4{margin:0 0 6px;font-size:14px}.inv-context-menu p{margin:0 0 8px;font-size:12px;color:#d7eeee;line-height:1.3}.inv-context-menu div{display:flex;gap:6px;flex-wrap:wrap}.inv-context-menu button{border:1px solid rgba(255,255,255,.18);border-radius:10px;background:rgba(255,255,255,.10);padding:7px 9px;color:#fff}@media(max-width:700px){.Awtsmoos-inventory-panel{top:48%;max-height:74vh}.inv-body{grid-template-columns:1fr}.equip-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bag-grid{grid-template-columns:repeat(4,minmax(58px,1fr))}.inv-slot{min-height:56px}.Awtsmoos-action-host{bottom:20px}}
