<body>
  
<div id="awtsmoosNoBlackGuard"><div class="card"><div class="title">B&quot;H — עולם נטען</div><div class="sub">Building visible ground before the first frame.</div></div></div>
<div class="loading" id="awtsmoosLoadingVeil">
    <div class="kabbalah-vortex" aria-hidden="true">
      <div class="sefirot-ring ring-1"></div><div class="sefirot-ring ring-2"></div><div class="sefirot-ring ring-3"></div>
      <div class="sefirot-ring ring-4"></div><div class="sefirot-ring ring-5"></div><div class="sefirot-ring ring-6"></div>
    </div>
    <div class="loading-stars" aria-hidden="true">
      <div class="loading-star s0"></div><div class="loading-star s1"></div><div class="loading-star s2"></div><div class="loading-star s3"></div><div class="loading-star s4"></div><div class="loading-star s5"></div>
      <div class="loading-star s6"></div><div class="loading-star s7"></div><div class="loading-star s8"></div><div class="loading-star s9"></div><div class="loading-star s10"></div><div class="loading-star s11"></div>
      <div class="loading-star s12"></div><div class="loading-star s13"></div><div class="loading-star s14"></div><div class="loading-star s15"></div><div class="loading-star s16"></div><div class="loading-star s17"></div>
    </div>
    <div class="awts-orbital-loader" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div><div class="loadingContent">
      <div class="loading-radial-core"><div class="radial-percent" id="genesisPercentText">0%</div><div class="radial-caption">real boot stream</div></div>
      <h1 class="awtsmoos-title-glow glitch-effect" data-text="MITZVAH WORLD">MITZVAH WORLD</h1>
      <div class="barLoading"><div class="bck"><div id="genesisProgressBar" class="barMitzvah"><div class="light-spark-comet"></div></div></div></div>
      <div class="genesis-stage-panel">
        <div class="genesis-stage-row"><div class="genesis-stage-label">World</div><div class="genesis-stage-track"><div class="genesis-stage-fill" id="genesisWorldBar"></div></div><div class="genesis-stage-note" id="genesisSubActionText">waiting</div></div>
        <div class="genesis-stage-row"><div class="genesis-stage-label">Worker</div><div class="genesis-stage-track"><div class="genesis-stage-fill" id="genesisWorkerBar"></div></div><div class="genesis-stage-note" id="genesisWorkerText">starting</div></div>
        <div class="genesis-stage-row"><div class="genesis-stage-label">Textures</div><div class="genesis-stage-track"><div class="genesis-stage-fill" id="genesisTextureBar"></div></div><div class="genesis-stage-note" id="genesisTextureText">queued</div></div>
      </div>
      <h2 class="txtLoad pulse-text" id="genesisMainLoadingText">Opening the future sphere engine...</h2>
      <h3 class="txtLoad info" id="genesisActionText">Opening the world...</h3>
      <div class="genesis-progress-log" id="genesisProgressLog">B"H  opening loading channel</div>
      <div class="genesis-profiler-log" id="genesisProfilerLog">Profiler armed</div>
    </div>
  </div>
  <script>
    (() => {
      const q = window.__AWTSMOOS_EARLY_LOADING_QUEUE__ = window.__AWTSMOOS_EARLY_LOADING_QUEUE__ || [];
      const ids = { total:"genesisProgressBar", world:"genesisWorldBar", worker:"genesisWorkerBar", texture:"genesisTextureBar", action:"genesisActionText", sub:"genesisSubActionText", percent:"genesisPercentText", workerText:"genesisWorkerText", textureText:"genesisTextureText", log:"genesisProgressLog" };
      const stages = [["html",0],["module",10],["entrypoint",16],["boot-runner",22],["angelic-invoker",28],["vessel_ready",34],["message:pawsawch",40],["soul-loader",50],["load-nivrayim",66],["postbuild",88],["first-render",96],["loadedWorld",98],["world_final_ready",100]];
      const profiler = (() => {
        const start = performance.now();
        const rows = [];
        let currentStage = null, currentAt = start, finalized = false;
        const clean = value => String(value || "unknown").replace(/\s+/g, " ").slice(0, 96);
        const close = at => { if (!currentStage) return; const durationMs = Math.max(0, at - currentAt); const last = rows[rows.length - 1]; if (last && last.stage === currentStage) last.durationMs += durationMs; else rows.push({ stage:currentStage, durationMs, sinceStartMs:currentAt - start }); };
        const render = () => { const el = document.getElementById("genesisProfilerLog"); if (!el) return; const live = currentStage ? [{ stage:currentStage, durationMs:performance.now() - currentAt, live:true }] : []; el.textContent = rows.concat(live).slice(-5).map(row => `${row.live ? "▶" : "✓"} ${row.stage}: ${Math.round(row.durationMs)}ms`).join("\n") || "Profiler armed"; };
        const api = {
          record(input = {}) { if (finalized) return api.snapshot(); const stage = clean(input.stage || input.kind || input.type || "progress"), at = performance.now(); if (stage !== currentStage) { close(at); currentStage = stage; currentAt = at; } render(); return api.snapshot(); },
          finalize(reason = "world_final_ready") { if (finalized) return api.snapshot(); close(performance.now()); finalized = true; render(); const reportRows = rows.map((row, index) => ({ step:index + 1, stage:row.stage, durationMs:Math.round(row.durationMs), sinceStartMs:Math.round(row.sinceStartMs) })); window.__AWTSMOOS_LOAD_PROFILER_REPORT__ = { reason:String(reason), totalMs:Math.round(performance.now() - start), rows:reportRows, seal:"early-load-profiler-20260708-bh1" }; const grouped = new Map(); for (const row of reportRows) { const prev = grouped.get(row.stage) || { stage:row.stage, count:0, totalMs:0, maxMs:0, firstSinceStartMs:row.sinceStartMs }; prev.count += 1; prev.totalMs += row.durationMs; prev.maxMs = Math.max(prev.maxMs, row.durationMs); prev.firstSinceStartMs = Math.min(prev.firstSinceStartMs, row.sinceStartMs); grouped.set(row.stage, prev); } const tableRows = [...grouped.values()].map(row => ({ stage:row.stage, count:row.count, totalMs:Math.round(row.totalMs), maxMs:Math.round(row.maxMs), avgMs:Math.round(row.totalMs / Math.max(1,row.count)), firstSinceStartMs:Math.round(row.firstSinceStartMs) })).sort((a,b)=>b.totalMs-a.totalMs); window.__AWTSMOOS_LOAD_PROFILER_REPORT__ = { reason:String(reason), totalMs:Math.round(performance.now() - start), rows:tableRows, seal:"early-grouped-table-only-profiler-20260708-bh8" }; console.log(`B"H LOAD PROFILER total ${window.__AWTSMOOS_LOAD_PROFILER_REPORT__.totalMs}ms grouped longest-first`); console.table?.(tableRows); return api.snapshot(); },
          snapshot() { return { startedAt:start, currentStage, elapsedMs:Math.round(performance.now() - start), finalized, rows:rows.map(row => ({ ...row, durationMs:Math.round(row.durationMs), sinceStartMs:Math.round(row.sinceStartMs) })) }; }
        };
        window.__AWTSMOOS_LOAD_PROFILER__ = api;
        window.__AWTSMOOS_LOAD_PROFILE__ = () => api.snapshot();
        return api;
      })();
      const state = { total:0, world:0, worker:0, texture:0, hadPositive:false, log:["B\"H  opening loading channel"], real:false };
      const clamp = v => Math.max(0, Math.min(100, Number(v) || 0));
      const byId = id => document.getElementById(id);
      const stagePercent = stage => (stages.find(([prefix]) => String(stage || "").startsWith(prefix)) || [null, state.total])[1];
      const noMidReset = v => state.hadPositive && clamp(v) <= 0 ? state.total : clamp(v);
      function writeBar(id, value) { const el = byId(id); if (el) el.style.width = `${Math.round(clamp(value))}%`; }
      function writeText(id, value) { const el = byId(id); if (el && value != null) el.textContent = String(value); }
      function title(stage) { stage = String(stage || ""); if (stage.includes("postbuild")) return "Building the finished zone..."; if (stage.includes("load-nivrayim") || stage.includes("soul-loader")) return "Creating roads, homes, NPCs, and animals..."; if (stage.includes("texture")) return "Preparing textures..."; if (stage.includes("world_final_ready")) return "World ready"; return "Opening the world..."; }
      function paint(input = {}) {
        const stage = String(input.stage || input.kind || "html:start"), total = noMidReset(input.total ?? input.amount ?? stagePercent(stage));
        state.real ||= input.real !== false && stage !== "html:trickle";
        state.hadPositive ||= total > 0;
        state.total = Math.max(state.total, total);
        if (stage.includes("load") || stage.includes("soul") || stage.includes("postbuild")) state.world = Math.max(state.world, input.world ?? total);
        if (stage.includes("worker") || stage.includes("entrypoint") || stage.includes("message") || stage.includes("vessel")) state.worker = Math.max(state.worker, input.worker ?? total);
        if (input.texture != null) state.texture = Math.max(state.texture, input.texture);
        writeBar(ids.total, state.total); writeBar(ids.world, state.world); writeBar(ids.worker, state.worker); writeBar(ids.texture, state.texture);
        const radial = document.querySelector(".loading-radial-core"); if (radial) radial.style.setProperty("--load", `${Math.round(state.total)}%`);
        writeText(ids.percent, `${Math.round(state.total)}%`); writeText(ids.action, input.action || title(stage));
        writeText(ids.sub, input.subAction || input.label || stage.replace(/[-:]/g, " "));
        writeText(ids.workerText, stage.replace(/[-:]/g, " ").slice(0, 72)); if (input.textureLabel) writeText(ids.textureText, input.textureLabel);
        const line = input.log || input.subAction || stage; if (line && state.log[state.log.length - 1] !== line) state.log = state.log.concat(line).slice(-4);
        writeText(ids.log, state.log.join("\n"));
