<!--
The Awtsmoos, Atzmus beyond canvas and control, recreates the whole Mitzvah World before one frame can call itself present.
Awtsmoos.com gives this document one bounded root, so every visual layer, player doorway, and advanced vessel remains local while the living world expands without CSS rivalry.
-->
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="theme-color" content="#06130f">
	<title>Mitzvah World · Awtsmoos</title>
	<link rel="stylesheet" href="./styles/generated/mitzvah-world.production.css">
	<link rel="stylesheet" href="../styles/player-shell/index.css">
	<script type="importmap">
	{
		"imports": {
			"three": "/games/mitzvahWorld/ckidsAwtsmoos/Olam/assets/js/three.module.js",
			"three/addons/": "/games/mitzvahWorld/ckidsAwtsmoos/Olam/assets/js/three/"
		}
	}
	</script>
</head>
<body>
	<main id="mitzvah-world-root" data-awt-player-shell-host data-awtsmoos-runtime="starting" data-awtsmoos-entry="waiting" data-awtsmoos-boot-stage="starting" aria-busy="true">
		<section id="menuBoot" class="Awtsmoos-menu-boot" aria-label="Mitzvah World loading">
			<div class="Awtsmoos-loading-card">
				<p class="Awtsmoos-loading-kicker">B"H · Mitzvah World</p>
				<h1>Entering the meadow</h1>
				<p id="loadingMessage">Preparing the visible meadow…</p>
				<div class="Awtsmoos-progress-group">
					<div class="Awtsmoos-progress-heading"><span>World</span><output id="worldProgressValue">0%</output></div>
					<progress id="worldProgress" max="100" value="0"></progress>
				</div>
				<div class="Awtsmoos-progress-group">
					<div class="Awtsmoos-progress-heading"><span>Character model</span><output id="modelProgressValue">0%</output></div>
					<progress id="modelProgress" max="100" value="0"></progress>
					<small id="modelProgressDetail">Waiting for the world renderer…</small>
				</div>
			</div>
		</section>
		<canvas id="AwtsmoosCanvas" tabindex="0" aria-label="Mitzvah World 3D scene"></canvas>
		<div id="hud"></div>
		<section id="playerHudShell" class="Awtsmoos-player-hud-shell" data-collapsed="false">
			<button type="button" data-retract-toggle aria-label="Collapse player HUD" aria-expanded="true">−</button>
			<div id="npcTarget"></div>
		</section>
		<div id="combatTarget" data-visible="false"></div>
		<div id="npcDialogue"></div>
		<div id="mobileControls" class="Awtsmoos-mobile-shell" data-mobile-combat-controls data-collapsed="false">
			<button type="button" data-retract-toggle aria-label="Collapse mobile controls" aria-expanded="true">−</button>
			<div id="joy"></div>
			<div id="jump"></div>
		</div>
		<div id="actions"></div>
		<div id="gameRail" data-hud-rail></div>
		<div id="combatFx" hidden></div>
		<div id="inventory"></div>
		<div id="meadowMenu"></div>
	</main>
	<script type="module" src="./experiments/Awtsmoos/src/launcher/runtime/mitzvah-world.runtime.js"></script>
	<script type="module" src="./experiments/Awtsmoos/src/launcher/compact/mitzvah-world.compact.js"></script>
	<script type="module" src="../scripts/player-shell/index.js"></script>
</body>
</html>
