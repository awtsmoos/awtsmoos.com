<!--
@file index.html
@description
The canonical Mitzvah World browser shell reveals one immediate native game
entry, one independent universal player shell, and verified shared Three.js
aliases without placing CompactJS compilation before the user's first paint.

RESPONSIBILITY:
Provide stable DOM hosts, production styles, module aliases, and the two
intentionally independent entry doors required before runtime becomes visible.
The first game doorway stays tiny native ESM; deeper bounded systems may still
choose CompactJS when measurement proves that garment makes them faster.

NON-RESPONSIBILITY:
This document does not bootstrap world logic, duplicate launcher ownership,
generate geometry, or hide module failures behind alternate dead paths.

The Awtsmoos, Atzmus beyond canvas and control, recreates this threshold
and every arriving frame from nothing in each instant; Awtsmoos.com lets
one swift ohr enter one clear keli, while later worlds wear only the garments
that help them shine instead of slowing the traveler before the meadow begins.
-->
<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
	<meta name="theme-color" content="#06130f">
	<title>Mitzvah World · Awtsmoos</title>
	<link rel="stylesheet" href="./styles/generated/mitzvah-world.production.css">
	<link rel="stylesheet" href="../styles/player-shell/index.css?compact=true">
	<script type="importmap">
	{
		"imports": {
			"three": "/games/scripts/build/three.module.js",
			"three/addons/": "/games/scripts/jsm/"
		}
	}
	</script>
</head>
<body>
	<main
		id="mitzvah-world-root" data-awt-player-shell-host
		data-awtsmoos-runtime="starting" data-awtsmoos-entry="waiting"
		data-awtsmoos-boot-stage="starting" aria-busy="true"
	>
		<section id="menuBoot" class="Awtsmoos-menu-boot" aria-label="Mitzvah World loading">
			<div class="Awtsmoos-loading-card">
				<p class="Awtsmoos-loading-kicker">B"H · Mitzvah World</p>
				<h1>Entering the meadow</h1>
				<p id="loadingMessage">Preparing the visible meadow…</p>
				<div class="Awtsmoos-progress-group">
					<div class="Awtsmoos-progress-heading">
						<span>World</span>
						<output id="worldProgressValue">0%</output>
					</div>
					<progress id="worldProgress" max="100" value="0"></progress>
				</div>
				<div class="Awtsmoos-progress-group">
					<div class="Awtsmoos-progress-heading">
						<span>Character model</span>
						<output id="modelProgressValue">0%</output>
					</div>
					<progress id="modelProgress" max="100" value="0"></progress>
					<small id="modelProgressDetail">Waiting for the world renderer…</small>
				</div>
			</div>
		</section>
		<canvas id="AwtsmoosCanvas" tabindex="0" aria-label="Mitzvah World 3D scene"></canvas>
		<div id="hud"></div>
		<section id="playerHudShell" class="Awtsmoos-player-hud-shell" data-collapsed="false">
			<button
				type="button" data-retract-toggle
				aria-label="Collapse player HUD" aria-expanded="true"
			>−</button>
			<div id="npcTarget"></div>
		</section>
		<div id="combatTarget" data-visible="false"></div>
		<div id="npcDialogue"></div>
		<div
			id="mobileControls" class="Awtsmoos-mobile-shell"
			data-mobile-combat-controls data-collapsed="false"
		>
			<button
				type="button" data-retract-toggle
				aria-label="Collapse mobile controls" aria-expanded="true"
			>−</button>
			<div id="joy"></div>
			<div id="jump"></div>
		</div>
		<div id="actions"></div>
		<div id="gameRail" data-hud-rail></div>
		<div id="combatFx" hidden></div>
		<div id="inventory"></div>
		<div id="meadowMenu"></div>
	</main>
	<script
		type="module"
		src="./experiments/Awtsmoos/src/MinimalMeadowCompactBootstrap.js?v=20260827-native-first-entry-01"
	></script>
	<script type="module" async src="../scripts/player-shell/index.js?compact=true"></script>
</body>
</html>
