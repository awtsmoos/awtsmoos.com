<!doctype html><meta charset="utf-8"><title>B"H Chossid GLB Inspector</title>
<style>html,body{margin:0;background:#101820;color:white;font:14px monospace}#hud{position:fixed;left:10px;top:10px;background:#0009;padding:10px;border-radius:8px;white-space:pre;z-index:2}canvas{display:block}</style><div id="hud">B"H loading chossid.glb...</div>
<script type="module">
import * as THREE from "/games/scripts/build/three.module.js";
import { GLTFLoader } from "/games/scripts/jsm/loaders/GLTFLoader.js";
const hud=document.getElementById('hud'), report={ok:false, clips:[], tests:[], generated:[], errors:[]};
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87b7d9);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(0,1.45,4.2);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x335577,2.6));const dir=new THREE.DirectionalLight(0xffffff,2);dir.position.set(3,4,5);scene.add(dir);
const grid=new THREE.GridHelper(5,10,0x335533,0x335533);scene.add(grid);
function log(x){hud.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}
function bounds(root){const b=new THREE.Box3().setFromObject(root),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());return{min:b.min.toArray(),max:b.max.toArray(),size:s.toArray(),center:c.toArray()}}
function norm(root){const b=new THREE.Box3().setFromObject(root),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3());root.position.sub(c);root.position.y+=s.y/2;root.scale.multiplyScalar(1.75/Math.max(.001,s.y));root.updateWorldMatrix(true,true)}
function allBones(root){const a=[];root.traverse(o=>{if(o.isBone)a.push(o)});return a}
function findBone(root,re){return allBones(root).find(b=>re.test(b.name))||null}
function q(x,y,z){const r=new THREE.Quaternion().setFromEuler(new THREE.Euler(x,y,z));return[r.x,r.y,r.z,r.w]}
function qt(n,t,v){return new THREE.QuaternionKeyframeTrack(`${n}.quaternion`,t,v)}
function generatedClip(root){const l=findBone(root,/LeftArm$/),r=findBone(root,/RightArm$/);if(!l||!r)return null;const t=[0,.25,.5,.75,1];return new THREE.AnimationClip('generated_wave_arms_REAL_BONES',1,[qt(l.name,t,[...q(.2,0,.45),...q(-.7,0,1.15),...q(.15,0,.3),...q(-.55,0,1),...q(.2,0,.45)]),qt(r.name,t,[...q(.2,0,-.45),...q(-.7,0,-1.15),...q(.15,0,-.3),...q(-.55,0,-1),...q(.2,0,-.45)])])}
function pose(root){const bones=allBones(root).filter(b=>/Arm|ForeArm|Hand|Leg|UpLeg|Spine|Head/.test(b.name)).slice(0,28);root.updateWorldMatrix(true,true);return bones.map(b=>({name:b.name,p:b.getWorldPosition(new THREE.Vector3()).toArray(),q:b.getWorldQuaternion(new THREE.Quaternion()).toArray()}))}
function delta(a,b){let d=0,n=0;for(const x of a){const y=b.find(z=>z.name===x.name);if(!y)continue;for(let i=0;i<3;i++)d+=Math.abs(x.p[i]-y.p[i]);for(let i=0;i<4;i++)d+=Math.abs(x.q[i]-y.q[i]);n++}return n?d/n:0}
async function testClip(root,mixer,clip){mixer.stopAllAction();const act=mixer.clipAction(clip);act.reset().setLoop(THREE.LoopRepeat).play();mixer.update(.001);const first=pose(root);let max=0;for(let i=0;i<75;i++){mixer.update(1/30);root.updateWorldMatrix(true,true);max=Math.max(max,delta(first,pose(root)));renderer.render(scene,camera);await new Promise(r=>requestAnimationFrame(r))}return{clip:clip.name,tracks:clip.tracks.length,duration:clip.duration,motion:max,pass:max>.0005}}
new GLTFLoader().load('https://models-3122d.web.app/chossid.glb',async gltf=>{try{const root=gltf.scene;norm(root);scene.add(root);const gen=generatedClip(root);const clips=[...gltf.animations];if(gen){clips.push(gen);report.generated.push(gen.name)}report.clips=clips.map(c=>({name:c.name,duration:c.duration,tracks:c.tracks.length,trackNames:c.tracks.slice(0,12).map(t=>t.name)}));const mixer=new THREE.AnimationMixer(root);for(const clip of clips.filter(c=>/walk|run|jump|hands-out|punch|stab|generated/i.test(c.name))){log('testing '+clip.name);report.tests.push(await testClip(root,mixer,clip))}report.bounds=bounds(root);report.bones=allBones(root).map(b=>b.name);report.ok=report.tests.filter(t=>t.pass).length>=4;log(report);window.__CHOSSID_GLB_INSPECTION__=report;window.__CHOSSID_GLB_DONE__=true}catch(e){report.errors.push(String(e.stack||e));log(report);window.__CHOSSID_GLB_INSPECTION__=report;window.__CHOSSID_GLB_DONE__=true}},undefined,e=>{report.errors.push(String(e?.message||e));log(report);window.__CHOSSID_GLB_INSPECTION__=report;window.__CHOSSID_GLB_DONE__=true});
function loop(){renderer.render(scene,camera);requestAnimationFrame(loop)}loop();
</script>
