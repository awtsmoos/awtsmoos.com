function letter(ch,c){const g=new THREE.Group(),s=.22,t=.09,z=.12;const add=(x,y,w,h)=>{const m=box(w,h,z,c);m.position.set(x,y,0);g.add(m)};if(ch==='M'){add(-s,0,t,.9);add(s,0,t,.9);add(-.07,.18,.18,t);add(.07,.18,.18,t)}else if(ch==='I'){add(0,0,t,.9);add(0,.4,.38,t);add(0,-.4,.38,t)}else if(ch==='T'){add(0,.4,.55,t);add(0,0,t,.9)}else if(ch==='Z'){add(0,.4,.55,t);add(0,-.4,.55,t);const m=box(.62,t,z,c);m.rotation.z=-.9;g.add(m)}else if(ch==='V'){const a=box(t,.9,z,c),b=box(t,.9,z,c);a.rotation.z=-.25;b.rotation.z=.25;a.position.x=-.1;b.position.x=.1;g.add(a,b)}else if(ch==='A'){add(-.16,0,t,.9);add(.16,0,t,.9);add(0,.4,.42,t);add(0,0,.34,t)}else if(ch==='H'){add(-.18,0,t,.9);add(.18,0,t,.9);add(0,0,.42,t)}else if(ch==='L'){add(-.12,0,t,.9);add(.08,-.4,.42,t)}else if(ch==='O'){add(-.18,0,t,.9);add(.18,0,t,.9);add(0,.4,.42,t);add(0,-.4,.42,t)}else if(ch==='K'){add(-.18,0,t,.9);const a=box(t,.55,z,c),b=box(t,.55,z,c);a.rotation.z=-.75;b.rotation.z=.75;a.position.set(.04,.17,0);b.position.set(.04,-.17,0);g.add(a,b)}else{add(0,0,.35,.35)}return g}
