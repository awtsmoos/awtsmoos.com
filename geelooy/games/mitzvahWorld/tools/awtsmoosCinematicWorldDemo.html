<!doctype html><meta charset="utf-8"><title>B"H Awtsmoos Cinematic World Demo</title>
<style>html,body{margin:0;overflow:hidden;background:#8fcdf5}#hud{position:fixed;left:10px;top:10px;background:#041320cc;color:white;padding:10px;border-radius:10px;font:13px monospace;z-index:2;white-space:pre}</style><div id="hud">B"H loading cinematic world...</div>
<script type="module">
import * as THREE from "/games/scripts/build/three.module.js";
import { HeightFieldGenerator, CliffBandGenerator, ForestScatterPlanner, JourneyFogController, buildTree, regionAt } from "../geelooy/libs/awtsmoosCinematicWorld/index.js";
const hud=document.getElementById('hud');
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,120);const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x335533,2.2));const sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(6,8,5);scene.add(sun);
const terrain=new HeightFieldGenerator({seed:42,amplitude:4.5});const grid=terrain.grid({size:70,segments:56,regionIndex:2});
const geo=new THREE.PlaneGeometry(grid.size,grid.size,grid.segments,grid.segments);geo.rotateX(-Math.PI/2);for(let i=0;i<geo.attributes.position.count;i++){const x=geo.attributes.position.getX(i),z=geo.attributes.position.getZ(i);geo.attributes.position.setY(i,terrain.heightAt(x,z,2));}geo.computeVertexNormals();scene.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0x42b85c,roughness:.85})));
const forest=new ForestScatterPlanner({seed:18}).plan({count:120,width:52,depth:58,pathWidth:4});for(const t of forest){const tree=buildTree(THREE,t);tree.position.set(t.x,terrain.heightAt(t.x,t.z,2),t.z);scene.add(tree)}
const cliffs=new CliffBandGenerator({seed:7}).makeBands({count:7,startZ:-12,spacing:7});for(const c of cliffs){const m=new THREE.Mesh(new THREE.BoxGeometry(c.length,c.height,1.2),new THREE.MeshStandardMaterial({color:0x7a644d,roughness:.92}));m.position.set(c.x,terrain.heightAt(c.x,c.z,2)+c.height/2,c.z);m.rotation.y=c.roughness*.7;scene.add(m)}
const fogger=new JourneyFogController();const markers=[];for(let i=0;i<5;i++){const r=regionAt(i/4+.001);const g=new THREE.Mesh(new THREE.SphereGeometry(.35,16,12),new THREE.MeshStandardMaterial({color:[0xffd55e,0x66ff99,0x66ccff,0xdd99ff,0xffffff][i]}));g.position.set(-8+i*4,terrain.heightAt(-8+i*4,-6-i*9,2)+1,-6-i*9);g.userData.region=r.id;scene.add(g);markers.push(g)}
let t=0;function loop(){requestAnimationFrame(loop);t=(performance.now()/1000)%24/24;const f=fogger.stateAt(t);scene.fog=new THREE.Fog(f.color,f.near,f.far);camera.position.set(Math.sin(t*Math.PI*2)*22,9+Math.sin(t*6)*2,14+Math.cos(t*Math.PI*2)*26);camera.lookAt(0,2,-18);hud.textContent=`B"H reusable cinematic world\nregion: ${regionAt(t).name}\ntrees: ${forest.length}\ncliffs: ${cliffs.length}\nfog far: ${f.far.toFixed(1)}`;window.__AWTSMOOS_CINEMATIC_WORLD_DEMO_REPORT__={ok:true,trees:forest.length,cliffs:cliffs.length,region:regionAt(t).id,fog:f,markers:markers.map(m=>m.userData.region)};renderer.render(scene,camera)}loop();
</script>
