<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>B"H RAM Meadow</title>
  <style>
    html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(#8fd4ff,#54bb5a);font-family:system-ui,sans-serif;touch-action:none}
    #hud{position:fixed;left:10px;top:10px;z-index:5;color:white;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:9px 11px;font:700 12px/1.3 system-ui;max-width:82vw;white-space:pre-wrap}
    :root{--awts-mobile-safe-bottom:max(calc(env(safe-area-inset-bottom,0px)),10px);--awts-mobile-rail-bottom:calc(var(--awts-mobile-safe-bottom) + 78px)}
    #joystick-container{position:fixed!important;left:max(14px,env(safe-area-inset-left,0px) + 10px)!important;top:auto!important;bottom:var(--awts-mobile-rail-bottom)!important;width:86px!important;height:86px!important;max-width:24vw!important;max-height:24vw!important;min-width:74px!important;min-height:74px!important;z-index:28000!important;pointer-events:auto!important;touch-action:none!important}
    #joystick-base{width:100%!important;height:100%!important;border-radius:50%!important;position:relative!important;background:radial-gradient(circle at 45% 42%,rgba(96,255,242,.16),rgba(0,0,20,.38))!important;border:2px solid rgba(0,255,237,.42)!important;box-shadow:0 0 16px rgba(0,255,237,.22),inset 0 0 24px rgba(0,0,0,.34)!important;pointer-events:auto!important;touch-action:none!important}
    #joystick-thumb{width:42px!important;height:42px!important;border-radius:50%!important;position:absolute!important;left:calc(50% - 21px)!important;top:calc(50% - 21px)!important;background:radial-gradient(circle at 34% 31%,#fff 0%,#bffcff 30%,#46edf5 100%)!important;box-shadow:0 0 20px rgba(83,247,255,.62)!important;transition:transform .03s linear!important;pointer-events:none!important}
    #mobile-jump-button{position:fixed!important;right:max(14px,env(safe-area-inset-right,0px) + 10px)!important;top:auto!important;bottom:var(--awts-mobile-rail-bottom)!important;width:56px!important;height:56px!important;min-width:52px!important;min-height:52px!important;border-radius:50%!important;display:flex!important;align-items:center!important;justify-content:center!important;font:900 31px Arial,sans-serif!important;color:#fff8cc!important;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.18),rgba(13,4,52,.78))!important;border:2px solid rgba(255,215,0,.56)!important;box-shadow:0 7px 16px rgba(0,0,0,.42),0 0 16px rgba(255,215,0,.18)!important;z-index:28010!important;pointer-events:auto!important;user-select:none!important;touch-action:none!important}
    #mobile-jump-button.active-state{transform:scale(.9)!important;background:rgba(255,215,0,.86)!important;color:#2b1500!important}
    #bootPanel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;max-width:82vw;color:white;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:14px 18px;text-align:center;font-weight:900;box-shadow:0 18px 40px rgba(0,0,0,.2)}
  </style>
</head>
<body>
  <div id="app"></div><div id="bootPanel">B"H<br>HTML loaded instantly.<br><small id="bootStatus">Starting module...</small></div><div id="hud">B"H RAM Meadow
HTML alive immediately.</div><div id="joystick-container"><div id="joystick-base"><div id="joystick-thumb"></div></div></div><button id="mobile-jump-button" aria-label="jump">↑</button>
  <script>
    (function(){const status=document.getElementById('bootStatus'),panel=document.getElementById('bootPanel'),hud=document.getElementById('hud');const set=t=>{if(status)status.textContent=t;if(hud)hud.textContent='B"H RAM Meadow\n'+t};window.__RAM_BOOT__={page:'ram-meadow.html',at:Date.now(),events:[]};window.__RAM_BOOT_LOG__=t=>{window.__RAM_BOOT__.events.push({at:Date.now(),text:t});set(t)};window.addEventListener('error',e=>window.__RAM_BOOT_LOG__('ERROR: '+(e.message||e.error||'unknown')));window.addEventListener('unhandledrejection',e=>window.__RAM_BOOT_LOG__('PROMISE ERROR: '+((e.reason&&e.reason.message)||e.reason||'unknown')));window.__RAM_BOOT_LOG__('HTML alive. Importing RAM scene...');setTimeout(()=>{if(!window.__RAM_MEADOW__)window.__RAM_BOOT_LOG__('Still importing after 3s. HTML is not frozen; module/resource is slow or failed.')},3000);import('./ram/RamMeadow.js?v=ram-meadow-bh9-real-chossid-motion').then(()=>{if(window.__RAM_MEADOW__){panel?.remove();window.__RAM_BOOT_LOG__('Scene running. Real Chossid movement model.')}else window.__RAM_BOOT_LOG__('Module loaded but scene did not publish __RAM_MEADOW__.')}).catch(error=>{window.__RAM_BOOT__.importError=String(error&&(error.stack||error.message)||error);window.__RAM_BOOT_LOG__('IMPORT FAILED: '+window.__RAM_BOOT__.importError.slice(0,500))});})();
  </script>
</body>
</html>
