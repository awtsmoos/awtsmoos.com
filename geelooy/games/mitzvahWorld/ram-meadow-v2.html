<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Cache-Control" content="no-store">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <title>B"H RAM Meadow v2</title>
  <style>
    html,body,#app{margin:0;width:100%;height:100%;overflow:hidden;background:linear-gradient(#8fd4ff,#54bb5a);font-family:system-ui,sans-serif;touch-action:none}
    #hud{position:fixed;left:10px;top:10px;z-index:5;color:white;background:rgba(0,0,0,.42);border:1px solid rgba(255,255,255,.25);border-radius:14px;padding:9px 11px;font:700 12px/1.3 system-ui;max-width:82vw;white-space:pre-wrap}
    #joy{position:fixed;left:22px;bottom:calc(24px + env(safe-area-inset-bottom));z-index:6;width:112px;height:112px;border-radius:50%;background:radial-gradient(circle,rgba(117,255,247,.45),rgba(4,68,76,.28));border:2px solid rgba(137,255,247,.8);box-shadow:0 0 18px rgba(0,255,255,.35);touch-action:none}
    #nub{position:absolute;left:36px;top:36px;width:40px;height:40px;border-radius:50%;background:radial-gradient(circle,#eaffff,#6ffff5);box-shadow:0 0 18px #6ffff5}
    #jump{position:fixed;right:26px;bottom:calc(34px + env(safe-area-inset-bottom));z-index:6;width:78px;height:78px;border-radius:50%;background:rgba(255,224,72,.28);border:2px solid rgba(255,224,72,.86);color:white;font-size:34px;font-weight:900;box-shadow:0 0 18px rgba(255,224,72,.42)}
    #bootPanel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;max-width:82vw;color:white;background:rgba(0,0,0,.32);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:14px 18px;text-align:center;font-weight:900;box-shadow:0 18px 40px rgba(0,0,0,.2)}
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="bootPanel">B"H<br>HTML loaded instantly.<br><small id="bootStatus">Starting module...</small></div>
  <div id="hud">B"H RAM Meadow v2
HTML alive immediately.</div>
  <div id="joy"><div id="nub"></div></div>
  <button id="jump" aria-label="jump">↑</button>
  <script>
    (function(){
      const status = document.getElementById('bootStatus');
      const panel = document.getElementById('bootPanel');
      const hud = document.getElementById('hud');
      const set = text => { if(status) status.textContent = text; if(hud) hud.textContent = 'B"H RAM Meadow v2\n' + text; };
      window.__RAM_BOOT__ = { page:'v2', at:Date.now(), events:[] };
      window.__RAM_BOOT_LOG__ = text => { window.__RAM_BOOT__.events.push({ at:Date.now(), text }); set(text); };
      window.addEventListener('error', e => window.__RAM_BOOT_LOG__('ERROR: ' + (e.message || e.error || 'unknown')));
      window.addEventListener('unhandledrejection', e => window.__RAM_BOOT_LOG__('PROMISE ERROR: ' + ((e.reason && e.reason.message) || e.reason || 'unknown')));
      window.__RAM_BOOT_LOG__('HTML alive. Importing RAM scene...');
      setTimeout(() => { if(!window.__RAM_MEADOW__) window.__RAM_BOOT_LOG__('Still importing after 3s. HTML is not frozen; module/resource is slow or failed.'); }, 3000);
      import('./ram/RamMeadow.js?v=ram-meadow-v2-bh1')
        .then(() => {
          if (window.__RAM_MEADOW__) {
            panel?.remove();
            window.__RAM_BOOT_LOG__('Scene running. Drag right side to orbit.');
          } else window.__RAM_BOOT_LOG__('Module loaded but scene did not publish __RAM_MEADOW__.');
        })
        .catch(error => {
          window.__RAM_BOOT__.importError = String(error && (error.stack || error.message) || error);
          window.__RAM_BOOT_LOG__('IMPORT FAILED: ' + window.__RAM_BOOT__.importError.slice(0, 500));
        });
    })();
  </script>
</body>
</html>
