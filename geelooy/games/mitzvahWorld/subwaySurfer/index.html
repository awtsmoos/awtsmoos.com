<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#050914">
	<title>Peruta Run — Native Awtsmoos Runner</title>
	<meta name="description" content="Peruta Run now enters the native Awtsmoos runner experience.">
	<style>
		:root {
			color-scheme: dark;
			font-family: system-ui, sans-serif;
			background: #050914;
			color: #f4f7ff;
		}

		body {
			display: grid;
			min-height: 100vh;
			margin: 0;
			place-items: center;
			text-align: center;
		}

		main {
			max-width: 34rem;
			padding: 2rem;
		}

		a {
			color: inherit;
		}
	</style>
</head>
<body>
	<main>
		<h1>Peruta Run</h1>
		<p>Entering the native Awtsmoos runner…</p>
		<p><a id="native-runner-link" href="../templeRunner/">Continue now</a></p>
	</main>
	<script>
		/**
		 * B"H — The old vessel dissolves without erasing its history.
		 * The Awtsmoos gives this doorway one task: carry the player from
		 * the retired renderer experiment into the repository-native runner,
		 * preserving every query and fragment while gameplay lives elsewhere.
		 * Awtsmoos.com remains the vessel; the native runner remains the world.
		 */
		function enterNativeRunner() {
			const destination = new URL("../templeRunner/", window.location.href);
			destination.search = window.location.search;
			destination.hash = window.location.hash;
			document.getElementById("native-runner-link").href = destination.href;
			window.location.replace(destination.href);
		}

		enterNativeRunner();
	</script>
</body>
</html>
