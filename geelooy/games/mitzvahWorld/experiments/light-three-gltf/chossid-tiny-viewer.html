<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>B&quot;H Tiny WebGL Chossid</title>
  <style>
    html,body{margin:0;height:100%;color:#eaffff;font-family:system-ui,Arial,sans-serif;overflow:hidden;background:radial-gradient(circle at 52% 38%,#29445a 0,#152937 32%,#08161f 65%,#03080c 100%)}
    body:before{content:"";position:fixed;inset:0;background:linear-gradient(transparent 88%,rgba(255,255,255,.04)),repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 82px);opacity:.45;pointer-events:none}
    canvas{width:100vw;height:100vh;display:block;position:fixed;inset:0}
    #hud{position:fixed;left:10px;top:10px;z-index:2;width:min(690px,calc(100vw - 20px));max-height:42vh;overflow:auto;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);border:1px solid #36ffe0;border-radius:12px;padding:9px;font-size:12px;box-shadow:0 0 25px rgba(54,255,224,.13)}
    #hud.collapsed{width:auto;max-height:34px;overflow:hidden}
    #hud.collapsed #details,#hud.collapsed #controls,#hud.collapsed #clipButtons{display:none}
    #controls,#clipButtons{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
    button,select{background:#102436;border:1px solid #36ffe0;color:#eaffff;border-radius:8px;padding:4px 7px;font-size:12px}
    .clipButton{border-color:#6487ff;background:rgba(20,30,70,.68)}
    .clipButton.active{background:#fff2a3;color:#18202a;border-color:#fff2a3}
    pre{white-space:pre-wrap;margin:6px 0 0}.ok{color:#8cffb3}.bad{color:#ff9b9b}code{color:#fff2a3}
    @media(max-width:700px){#hud{max-height:29vh;font-size:11px}button,select{font-size:11px;padding:3px 6px}}
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud">
    <div><button id="hudToggle">hide</button> <span id="title">B&quot;H loading...</span></div>
    <div id="controls">
      <select id="animSelect"></select>
      <button id="bindBtn">bind pose</button>
      <button id="animBtn">pause</button>
      <button id="skelBtn">show skeleton</button>
      <button id="skinBtn">hide skinned</button>
      <button id="rigidBtn">hide rigid</button>
      <button id="helperLinesBtn">show helper lines</button>
      <button id="helperPointsBtn">show helper points</button>
      <button id="nextBtn">next animation</button>
    </div>
    <div id="clipButtons"></div>
    <div id="details"></div>
  </div>
  <script type="module" src="./tiny-chossid-app.js"></script>
</body>
</html>
