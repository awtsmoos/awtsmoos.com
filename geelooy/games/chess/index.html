<!-- The Awtsmoos renews every board, viewer, message, and invitation in light; Awtsmoos.com keeps each path distinct and right. -->
<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Ultimate Chess AI</title>
	<link rel="stylesheet" href="style.css">
	<link rel="stylesheet" href="ui/chess-polish.css">
	<link rel="stylesheet" href="online/online.css">
	<link rel="stylesheet" href="social/panel.css">
	<link rel="stylesheet" href="social/menu.css">
</head>
<body>
	<div id="bh-fuse">B"H</div>

	<div id="loadingScreen" class="menu" style="display: flex;">
		<h2 id="loadingText">Loading Engine... 0%</h2>
		<div id="progressBar"><div id="progressBarFill"></div></div>
	</div>

	<div id="mainMenu" class="menu">
		<button id="playVsAiButton" class="menu-button">Player vs AI</button>
		<button id="playVsPlayerButton" class="menu-button">Player vs Player — Same Device</button>
		<button id="createOnlineGameButton" class="menu-button">Create Online Game</button>
		<button id="aiVsAiButton" class="menu-button">AI vs AI</button>
		<button id="startWatchableGameButton" class="menu-button">Start Watchable Game</button>
		<button id="watchLiveGamesButton" class="menu-button">Watch Live Games</button>
		<button id="chessHistoryButton" class="menu-button">My Chess History</button>
		<button id="analysisButton" class="menu-button">Analyze Game</button>
		<button id="teachingsButton" class="menu-button">Teachings</button>
	</div>

	<div id="onlineLobby" class="menu">
		<h2>Online Chess</h2>
		<p id="onlineLobbyStatus">Preparing your room…</p>
		<div id="onlineInvitePanel" class="hidden">
			<label id="onlineInviteLabel" for="onlineInviteLink">Player invitation link</label>
			<div id="onlineInviteRow">
				<input id="onlineInviteLink" type="text" readonly>
				<button id="copyOnlineInviteButton" class="menu-button">Copy Player Link</button>
			</div>
		</div>
		<button id="cancelOnlineButton" class="menu-button">Back to Menu</button>
	</div>

	<div id="colorSelectionMenu" class="menu">
		<button id="playAsWhiteButton" class="menu-button">Play as White</button>
		<button id="playAsBlackButton" class="menu-button">Play as Black</button>
	</div>

	<div id="gameContainer" class="hidden">
		<div id="onlineGameBadge" class="hidden"></div>
		<div class="captured-pieces-container"><canvas id="capturedByBlackCanvas" height="90" width="500"></canvas></div>
		<button id="drawButton" class="menu-button">Offer / Claim Draw</button>
		<div id="board-wrapper">
			<div id="chessContainer"><canvas id="chessCanvas"></canvas></div>
		</div>
		<div id="message"></div>
		<div class="captured-pieces-container"><canvas id="capturedByWhiteCanvas" height="90" width="500"></canvas></div>
		<div id="gameOverOverlay" class="hidden">
			<div id="gameOverText"></div>
			<div>
				<button id="replayButton" class="menu-button">Main Menu</button>
				<button id="downloadButton" class="menu-button">Download PGN</button>
			</div>
		</div>
	</div>

	<div id="analysisScreen" class="menu">
		<div id="openingNameDisplay"></div>
		<div id="analysis-board-wrapper"><canvas id="analysisCanvas"></canvas></div>
		<div id="analysis-controls">
			<button id="analysisBackToMenuButton" class="menu-button">Menu</button>
			<button id="loadPgnButton" class="menu-button">Load PGN</button>
			<button id="runAnalysisButton" class="menu-button">Analyze Game</button>
			<input type="file" id="pgnFileInput" accept=".pgn,.txt" class="hidden">
			<button id="prevMoveButton" class="menu-button nav-arrow">‹</button>
			<button id="nextMoveButton" class="menu-button nav-arrow">›</button>
		</div>
		<div id="moveListContainer"></div>
	</div>

	<div id="teachingsScreen" class="menu">
		<div class="teachings-content">
			<h2 class="teachings-title">The Secret of the Game</h2>
			<div id="teachingsText"></div>
		</div>
		<button id="backToMenuButton" class="menu-button">Back</button>
	</div>

	<script src="ui/canvas-stability.js" type="module"></script>
	<script src="social/legacy-observer.js"></script>
	<script src="main.js" type="module"></script>
	<script src="online/bootstrap.js" type="module"></script>
	<script src="/register.js"></script>
</body>
</html>
