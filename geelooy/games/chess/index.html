<!--B"H-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Ultimate Chess AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- B"H Inscription in the top-left corner -->
    <div id="bh-fuse">B"H</div>

    <!-- Loading Screen -->
    <div id="loadingScreen" class="menu" style="display: flex;">
        <h2 id="loadingText">Loading Engine... 0%</h2>
        <div id="progressBar">
            <div id="progressBarFill"></div>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="mainMenu" class="menu">
        <button id="playVsAiButton" class="menu-button">Player vs AI</button>
        <button id="playVsPlayerButton" class="menu-button">Player vs Player</button>
        <button id="aiVsAiButton" class="menu-button">AI vs AI</button>
        <button id="analysisButton" class="menu-button">Analyze Game</button>
        <button id="teachingsButton" class="menu-button">Teachings</button>
    </div>

    <!-- Color Selection Menu -->
    <div id="colorSelectionMenu" class="menu">
        <button id="playAsWhiteButton" class="menu-button">Play as White</button>
        <button id="playAsBlackButton" class="menu-button">Play as Black</button>
    </div>
    
    <!-- Main Game Container -->
    <div id="gameContainer" class="hidden">
        <div class="captured-pieces-container">
            <canvas id="capturedByBlackCanvas" height="90" width="500"></canvas>
        </div>
        <button id="drawButton" class="menu-button">Offer / Claim Draw</button>
    
        <div id="board-wrapper">
            <div id="chessContainer">
                <canvas id="chessCanvas"></canvas>
            </div>
        </div>

        <div id="message"></div>
        <div class="captured-pieces-container">
            <canvas id="capturedByWhiteCanvas" height="90" width="500"></canvas>
        </div>
        <div id="gameOverOverlay" class="hidden">
            <div id="gameOverText"></div>
            <div>
                <button id="replayButton" class="menu-button">Main Menu</button>
                <button id="downloadButton" class="menu-button">Download PGN</button>
            </div>
        </div>
    </div>
    
    <!-- B"H -->
	<!-- Analysis Screen -->
	<div id="analysisScreen" class="menu">
	    <div id="openingNameDisplay"></div>
	    <div id="analysis-board-wrapper">
	        <canvas id="analysisCanvas"></canvas>
	    </div>
	
	    <div id="analysis-controls">
	        <button id="analysisBackToMenuButton" class="menu-button">Menu</button>
	        <button id="loadPgnButton" class="menu-button">Load PGN</button>
	        <button id="runAnalysisButton" class="menu-button">Analyze Game</button> 
	        <input type="file" id="pgnFileInput" accept=".pgn,.txt" class="hidden">
	        <button id="prevMoveButton" class="menu-button nav-arrow">‹</button>
	        <button id="nextMoveButton" class="menu-button nav-arrow">›</button>
	    </div>
	
	    <div id="moveListContainer">
	        <!-- The worker will tell us what to put here -->
	    </div>
	</div>
    

    <!-- Teachings Screen -->
    <div id="teachingsScreen" class="menu">
        <div class="teachings-content">
            <h2 class="teachings-title">The Secret of the Game</h2>
            <div id="teachingsText">
                <!-- Content will be loaded by JavaScript -->
            </div>
        </div>
        <button id="backToMenuButton" class="menu-button">Back</button>
    </div>
    
    
    

    <!-- Scripts (main.js is a module to import teachings) -->
    <script src="main.js" type="module" defer></script>
    <script src="/register.js"></script>
      
</body>
</html>
