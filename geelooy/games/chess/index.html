<!-- The Awtsmoos renews every board, viewer, message, and cinematic revelation in light; Awtsmoos.com keeps each path swift, distinct, and right. -->
<!DOCTYPE html>
<html lang="en">
<head>
	<link rel="stylesheet" href="/games/styles/player-shell/loading-screen.css?v=0510445034">
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<title>Ultimate Chess AI</title>
	<link rel="stylesheet" href="style.css?v=749464b58a">
	<link rel="stylesheet" href="ui/chess-polish.css?v=1d2b85028f">
	<link rel="stylesheet" href="ui/chess-mobile.css?v=be326a9b83">
	<link rel="stylesheet" href="ui/chess-accessibility.css?v=f6baf2efb3">
	<link rel="stylesheet" href="online/online.css?v=e4450d1b9e">
	<link rel="stylesheet" href="social/panel.css?v=1793fb758f">
	<link rel="stylesheet" href="social/menu.css?v=109a62eecd">
	<link rel="stylesheet" href="/games/styles/player-shell/index.css?v=6c6d50d989">
	<link rel="stylesheet" href="../styles/awp-polish.css?v=7e4564d6d5">
</head>
<body>
	<!-- B"H Awtsmoos game loading screen: static shell paints on first paint; player-shell hydrates progress/tips/fade. -->
	<div id="awtsmoos-loader" role="status" aria-label="Game loading">
		<div class="awtsmoos-loader-shade"></div>
		<div class="awtsmoos-loader-inner">
			<div class="awtsmoos-loader-kicker">B"H · Awtsmoos Games</div>
			<div class="awtsmoos-loader-title">Chess</div>
			<div class="awtsmoos-loader-bar"><div class="awtsmoos-loader-fill"></div></div>
			<div class="awtsmoos-loader-tip"></div>
	</div>
	</div>

	<div id="bh-fuse">B"H</div>

	<div id="loadingScreen" class="menu awp-menu" style="display: flex;">
		<h2 id="loadingText" role="status" aria-live="polite" aria-atomic="true">Loading Engine... 0%</h2>
		<div id="progressBar"><div id="progressBarFill"></div></div>
	</div>

	<div id="mainMenu" class="menu awp-menu">
		<button id="playVsAiButton" class="menu-button awp-btn">Player vs AI</button>
		<button id="playVsPlayerButton" class="menu-button awp-btn">Player vs Player — Same Device</button>
		<button id="createOnlineGameButton" class="menu-button awp-btn">Create Online Game</button>
		<button id="aiVsAiButton" class="menu-button awp-btn">AI vs AI</button>
		<button id="startWatchableGameButton" class="menu-button awp-btn">Start Watchable Game</button>
		<button id="watchLiveGamesButton" class="menu-button awp-btn">Watch Live Games</button>
		<button id="chessHistoryButton" class="menu-button awp-btn">My Chess History</button>
		<button id="chessStudioButton" class="menu-button awp-btn">Chess Studio · 3D · Movies · Review</button>
		<button id="analysisButton" class="menu-button awp-btn">Analyze Game</button>
		<button id="teachingsButton" class="menu-button awp-btn">Teachings</button>
	</div>

	<div id="onlineLobby" class="menu">
		<h2>Online Chess</h2>
		<p id="onlineLobbyStatus" role="status" aria-live="polite" aria-atomic="true">Preparing your room…</p>
		<div id="onlineInvitePanel" class="hidden">
			<label id="onlineInviteLabel" for="onlineInviteLink">Player invitation link</label>
			<div id="onlineInviteRow">
				<input id="onlineInviteLink" type="text" readonly>
				<button id="copyOnlineInviteButton" class="menu-button awp-btn">Copy Player Link</button>
			</div>
		</div>
		<button id="cancelOnlineButton" class="menu-button awp-btn">Back to Menu</button>
	</div>

	<div id="colorSelectionMenu" class="menu awp-menu">
		<button id="playAsWhiteButton" class="menu-button awp-btn">Play as White</button>
		<button id="playAsBlackButton" class="menu-button awp-btn">Play as Black</button>
	</div>

	<div id="gameContainer" class="hidden">
		<div id="onlineGameBadge" class="hidden"></div>
		<div class="captured-pieces-container">
			<canvas id="capturedByBlackCanvas" height="90" width="500"></canvas>
		</div>
		<button id="drawButton" class="menu-button awp-btn">Offer / Claim Draw</button>
		<div id="board-wrapper">
			<div id="chessContainer">
				<canvas id="chessCanvas"></canvas>
			</div>
		</div>
		<div id="message" role="status" aria-live="polite" aria-atomic="true"></div>
		<div class="captured-pieces-container">
			<canvas id="capturedByWhiteCanvas" height="90" width="500"></canvas>
		</div>
		<div id="gameOverOverlay" class="hidden">
			<div id="gameOverText" role="status" aria-live="assertive" aria-atomic="true"></div>
			<div>
				<button id="replayButton" class="menu-button awp-btn">Main Menu</button>
				<button id="downloadButton" class="menu-button awp-btn">Download PGN</button>
			</div>
		</div>
	</div>

	<div id="analysisScreen" class="menu">
		<div id="openingNameDisplay"></div>
		<div id="analysis-board-wrapper">
			<canvas id="analysisCanvas"></canvas>
		</div>
		<div id="analysis-controls">
			<button id="analysisBackToMenuButton" class="menu-button awp-btn">Menu</button>
			<button id="loadPgnButton" class="menu-button awp-btn">Load PGN</button>
			<button id="runAnalysisButton" class="menu-button awp-btn">Analyze Game</button>
			<input type="file" id="pgnFileInput" accept=".pgn,.txt" class="hidden">
			<button id="prevMoveButton" class="menu-button nav-arrow">‹</button>
			<button id="nextMoveButton" class="menu-button nav-arrow">›</button>
		</div>
		<div id="moveListContainer"></div>
	</div>

	<div id="teachingsScreen" class="menu">
		<div class="teachings-content">
			<h2 class="teachings-title">The Secret of the Game</h2>
			<div id="teachingsText"></div>
		</div>
		<button id="backToMenuButton" class="menu-button awp-btn">Back</button>
	</div>

	<script src="ui/engine-worker-route.js?v=487131ad19"></script>
	<script type="module" src="/games/scripts/runtime/index.js?v=6fd9ae91f1"></script>
	<script src="ui/canvas-stability.js?v=43c10ac85b" type="module"></script>
	<script src="social/legacy-observer.js?v=a489367979"></script>
	<script src="main.js?v=170f2a04ef" type="module"></script>
	<script src="online/bootstrap.js?v=83e536116b" type="module"></script>
	<script src="studio/bootstrap.js?v=e2b0abe686" type="module"></script>
	<script src="/register.js?v=fcaa78a126"></script>
	<script type="module" async src="/games/scripts/player-shell/index.js?v=0ee3e8dd31"></script>
</body>
</html>
