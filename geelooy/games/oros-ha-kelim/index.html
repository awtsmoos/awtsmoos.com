<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
	<meta name="theme-color" content="#070912">
	<title>Oros HaKelim</title>
	<link rel="stylesheet" href="./styles/index.css?v=764ca3ce68">
	<link rel="stylesheet" href="/games/styles/player-shell/index.css?v=6c6d50d989">
	<link rel="stylesheet" href="/games/css/awtsmoos-webgl-check.css?v=b21e0bf110">
	<link rel="stylesheet" href="/games/css/awtsmoos-loading.css?v=ed43c300af">
	<link rel="stylesheet" href="/games/css/awtsmoos-game-base.css?v=128b430115">
	<link rel="stylesheet" href="./styles/visibility.css?v=game-visibility-002">
</head>
<body>
	<script src="/games/shared/awt-loading-screen.js?v=c26d57a33e"
		data-cover="https://awtsmoos.com/api/social/drive/public/awtsmoos/covers/games/game-oros-ha-kelim.webp?v=2617784646"
		data-title="Oros HaKelim"
		data-kicker="B&quot;H · Awtsmoos Games"
		data-tips="Let the light move through you.|WASD or arrows move. Space releases an or.|Collect sparks before the vessel overfills."
		data-accent="#8fd8ff"></script>
	<main class="oros-app">
		<canvas id="game-canvas" aria-label="Oros HaKelim game world"></canvas>
		<section class="hud" aria-label="Round status">
			<div class="hud__metric"><span>Sparks</span><strong id="spark-count">0 / 12</strong></div>
			<div class="hud__metric"><span>Vessel</span><strong id="vessel-count">0 / 8</strong></div>
			<div class="hud__metric"><span>Round</span><strong id="round-count">1</strong></div>
			<button id="pause-button" type="button" aria-label="Pause game">Pause</button>
		</section>
		<section id="intro-overlay" class="overlay overlay--intro">
			<div class="overlay__card">
				<p class="eyebrow">B"H · Let light enter a vessel</p>
				<h1>Oros HaKelim</h1>
				<p>Gather sparks, release light, and keep the vessel from overflowing.</p>
				<button id="start-button" type="button">Enter Asiyah</button>
			</div>
		</section>
		<section id="pause-overlay" class="overlay hidden" aria-hidden="true">
			<div class="overlay__card">
				<p class="eyebrow">The vessel is still</p>
				<h2>Paused</h2>
				<button id="resume-button" type="button">Resume</button>
			</div>
		</section>
		<section id="end-overlay" class="overlay hidden" aria-hidden="true">
			<div class="overlay__card">
				<p class="eyebrow">The vessel received its measure</p>
				<h2>Round Complete</h2>
				<p id="end-summary"></p>
				<button id="next-round-button" type="button">Next Round</button>
			</div>
		</section>
		<section id="mobile-controls" class="mobile-controls" aria-label="Touch controls">
			<div class="mobile-controls__movement">
				<button type="button" data-key="ArrowLeft" aria-label="Move left">←</button>
				<button type="button" data-key="ArrowUp" aria-label="Move up">↑</button>
				<button type="button" data-key="ArrowDown" aria-label="Move down">↓</button>
				<button type="button" data-key="ArrowRight" aria-label="Move right">→</button>
			</div>
			<button class="mobile-controls__action" type="button" data-key="Space">Or</button>
		</section>
	</main>
	<script src="/games/js/awtsmoos-webgl-check.js?v=6498bdf075"></script>
	<script type="module" src="./src/main.js?v=9d99542b14"></script>
	<script type="module" async src="/games/scripts/player-shell/index.js?v=0ee3e8dd31"></script>
</body>
</html>
