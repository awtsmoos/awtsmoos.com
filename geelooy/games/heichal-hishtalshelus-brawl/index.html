<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Heichal Hishtalshelus Brawl</title>
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="shell">
    <section class="topbar">
      <div><h1>Heichal Hishtalshelus Brawl</h1><p>Canvas-only procedural skeleton arena</p></div>
      <label>Map <select id="mapSelect"></select></label>
      <label>Bots <select id="botSelect"><option>3</option><option selected>5</option><option>7</option></select></label>
      <button id="restart">Recreate</button>
      <button id="debugToggle">Debug</button>
    </section>
    <canvas id="olam"></canvas>
    <section id="touchControls" class="touchControls">
      <div id="stick" class="stick"><span></span></div>
      <div class="touchButtons">
        <button data-act="jump">↑</button><button data-act="punch">P</button>
        <button data-act="kick">K</button><button data-act="grab">G</button>
        <button data-act="shield">S</button><button data-act="special">✦</button>
      </div>
    </section>
  </main>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
