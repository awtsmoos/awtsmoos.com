<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Emoji Tower Defense</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-wrapper">
        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
            <div id="in-game-modal" class="hidden">
                 <div id="modal-content"></div>
            </div>
        </div>
        <div id="ui-panel">
            <div id="stats" class="collapsible">
                <div class="collapsible-header">
                    <h3>Stats</h3>
                    <span class="collapse-icon">▾</span>
                </div>
                <div class="collapsible-content">
                    <p>Wave: <span id="wave">1</span></p>
                    <p>💰 Perutas: <span id="perutas">200</span></p>
                    <p>❤️ Health: <span id="health">20</span></p>
                </div>
            </div>
            <div id="tower-selection" class="collapsible">
                <div class="collapsible-header">
                    <h4>Buy Towers</h4>
                    <span class="collapse-icon">▾</span>
                </div>
                <div id="tower-options-content" class="collapsible-content">
                    <!-- Tower options will be dynamically added here by JS -->
                </div>
            </div>
            <button id="start-wave">Start Next Wave</button>
        </div>
    </div>
    <script type="module" src="js/script.js"></script>
</body>
</html>
