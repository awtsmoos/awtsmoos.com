<!DOCTYPE html>
<html>
<head>
    <title>Awtsmoos Quantum Mail</title>

<body>
<div class="all awtsmoospage">
    <?<script> return $a("nav/header.html") </script>?>
    <div class="main">
        
        <!-- Login / Error Overlay -->
        <div id="loginOverlay" class="overlay hidden">
            <div class="glass-card error-card">
                <div class="icon-box">🔒</div>
                <h1>Access Restricted</h1>
                <p>No active alias detected.</p>
                <a href="/login" class="btn-primary">Login / Select Alias</a>
            </div>
        </div>

        <!-- Main App Container -->
        <div id="appContainer" class="app-layout hidden">
            
            <!-- Sidebar -->
            <aside class="sidebar">
                <div class="sidebar-header">
                    <div class="brand-row">
                        <div class="brand">Awtsmoos Mail</div>
                        <!-- Settings Button -->
                        <button onclick="document.getElementById('settingsModal').classList.remove('hidden')" class="btn-icon" title="Settings">⚙️</button>
                    </div>
                    <div class="current-user">
                        <span class="status-dot"></span>
                        <span id="displayAlias">...</span>
                    </div>

                    <!-- NEW: Tabs for Inbox / Requests -->
                    <div class="tabs">
                        <button id="btn-inbox" class="tab-btn active" onclick="toggleView('inbox')">Inbox</button>
                        <button id="btn-requests" class="tab-btn" onclick="toggleView('requests')">Requests</button>
                    </div>
                </div>
                
                <button id="composeBtn" class="btn-compose">
                    <span class="plus">+</span> New Transmission
                </button>

                <div class="threads-list" id="threadsList">
                    <!-- Threads injected via JS -->
                </div>
            </aside>

            <!-- Main Chat Area -->
            <main class="chat-area">
                <header class="chat-header" id="chatHeader">
                 <button class="back-btn" onclick="backToInbox()">←</button>
                    <div class="chat-info hidden" id="activeChatInfo">
                        <h2 id="chatPartnerName">Select a thread</h2>
                        
                        <!-- NEW: Header Actions -->
                        <div class="header-actions">
                            <button id="approveBtn" class="btn-primary hidden" onclick="approveThread()">✓ Approve</button>
                            <button class="btn-danger" onclick="deleteCurrentThread()" title="Delete Thread">🗑️</button>
                        </div>
                    </div>
                </header>

                <div class="messages-container" id="messagesContainer">
                    <div class="empty-state">
                        <div class="logo-faint">Awtsmoos</div>
                        <p>Select a thread to view the infinite light.</p>
                    </div>
                </div>

                <form class="input-area hidden" id="composeForm">
                    <div class="input-wrapper">
                        <input type="text" id="subjectInput" placeholder="Subject (Optional)" class="subject-input">
                        <div class="flex-row">
                            <textarea id="messageInput" placeholder="Write your message..." rows="1"></textarea>
                            <button type="submit" class="btn-send">
                                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                            </button>
                        </div>
                    </div>
                </form>
            </main>
        </div>

        <!-- Compose New Modal -->
        <div id="newMsgModal" class="modal hidden">
            <div class="modal-content glass-card">
                <span class="close-modal">&times;</span>
                <h2>New Transmission</h2>
                <form id="newThreadForm">
                    <div class="form-group">
                        <label>To (Alias or Email)</label>
                        <input type="text" id="newRecipient" placeholder="friend OR friend@gmail.com" required>
                    </div>
                    <div class="form-group">
                        <label>Subject</label>
                        <input type="text" id="newSubject" placeholder="Regarding the cosmos...">
                    </div>
                    <div class="form-group">
                        <label>Message</label>
                        <textarea id="newMessageBody" rows="5" required></textarea>
                    </div>
                    <div class="modal-actions">
                        <button type="submit" class="btn-primary">Send</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- NEW: Settings Modal -->
        <div id="settingsModal" class="modal hidden">
            <div class="modal-content glass-card">
                <span class="close-modal" onclick="document.getElementById('settingsModal').classList.add('hidden')">&times;</span>
                <h2>Mail Settings</h2>
                
                <div class="setting-row">
                    <label class="toggle-label">
                        <input type="checkbox" id="gatekeeperToggle">
                        <span>Gatekeeper Mode</span>
                        <small> (Filter unknown senders into "Requests")</small>
                    </label>
                </div>
                
                <!-- Rule Builder UI -->
		<h3>Logic Rules</h3>
		<div id="rulesContainer" class="rules-list">
		    <!-- Rules will be injected here by JS -->
		</div>
		
		<div class="add-rule-bar">
		    <button onclick="addRuleUI()" class="btn-secondary">+ Add New Rule</button>
		</div>
		
		
		<h3>Global Script (Advanced)</h3>
		<textarea id="customScriptInput" rows="4" class="code-input" placeholder="// Global fallback logic..."></textarea>
		
		
                <div class="modal-actions">
                    <button onclick="saveSettingsUI()" class="btn-primary">Save Settings</button>
                </div>
            </div>
        </div>

        <script defer src="./mail.js"></script>
    </div>
</div>
</body>
</html>
