<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#090d15">
	<title>Awtsmoos Quantum Mail</title>
	<link rel="stylesheet" href="/style/geelooy-app/index.css?v=27fe7b4829">
	<link rel="stylesheet" href="./css/core.css?v=5a20a46aff">
	<link rel="stylesheet" href="./css/sidebar.css?v=0a4e56d6ae">
	<link rel="stylesheet" href="./css/chat.css?v=cfaddf5dc3">
	<link rel="stylesheet" href="./css/composer.css?v=d67d7c45ac">
	<link rel="stylesheet" href="./css/revelation.css?v=1b74a363ad">
	<link rel="stylesheet" href="./css/revelation-v4.css?v=03b1004972">
	<link rel="stylesheet" href="./css/system/mobile-shell.css?v=a8fe49bc93">
	<link rel="stylesheet" href="/css/golden-icons.css?v=7c62c1d746">
	<link rel="stylesheet" href="/css/awtsmoos-visual-assets.css?v=7e62292b8d">
	<link rel="stylesheet" href="/css/video-loader.css?v=fccafca785">
	<link rel="stylesheet" href="/style/animations/micro-interactions.css?v=32a718e837">
	<style>
		/* B"H — Mail boot loader: a CSS ring, zero payload (the old video loader
		   downloaded 224 KB that the drive API serves as image/png, so it could
		   never play and only competed with the app boot for bandwidth). */
		.mail-loader-ring { width:54px; height:54px; border-radius:50%; border:4px solid rgba(190,205,235,.22); border-top-color:#cfe0ff; animation:mailLoaderSpin .9s linear infinite; }
		@keyframes mailLoaderSpin { to { transform:rotate(360deg); } }
		@media (prefers-reduced-motion: reduce) { .mail-loader-ring { animation:none; } }
	</style>
</head>
<body class="geelooy-mail-document awtsmoos-bg-email" data-mail-page data-mail-connectivity="unknown" data-geelooy-route="mail">
	<!-- B"H — Loading screen: CSS ring on the cosmic-blue ground (no video payload) -->
	<div class="awtsmoos-video-loader" id="awtsmoos-video-loader" style="background:#080a26" role="status" aria-label="Loading mail">
		<div class="mail-loader-ring" aria-hidden="true"></div>
	</div>
	<script>
		/* B"H — Fade the video loader once the mail app boots */
		(function() {
			function hideLoader() {
				var el = document.getElementById('awtsmoos-video-loader');
				if (!el || el.getAttribute('data-hidden') === 'true') return;
				el.setAttribute('data-hidden', 'true');
				setTimeout(function() { el.remove(); }, 800);
			}
			/* Hide when mail content renders */
			var check = setInterval(function() {
				var root = document.getElementById('root');
				if (root && root.children.length > 1) { clearInterval(check); setTimeout(hideLoader, 300); }
			}, 500);
			window.addEventListener('load', function() { setTimeout(hideLoader, 4000); });
			setTimeout(function() { clearInterval(check); hideLoader(); }, 12000);
		})();
	</script>
	<main id="root" class="geelooy-page-root root" aria-labelledby="mail-title">
		<h1 class="g-sr-only" id="mail-title">Awtsmoos Quantum Mail</h1>
	</main>
	<script type="module" src="/scripts/awtsmoos/social/shell/boot.js?v=de5da830c1"></script>
	<script type="module" src="./index.js?v=98a8e6a79b"></script>
<script src="/scripts/sw-register.js?v=fd64f071cd"></script>
</body>
</html>
