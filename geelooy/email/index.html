<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="theme-color" content="#090d15">
	<title>Awtsmoos Quantum Mail</title>
	<link rel="stylesheet" href="/style/geelooy-app/index.css?v=f9448616a6&compact=true&bundle=%5B%22%2Fstyle%2Fgeelooy-app%2Findex.css%3Fv%3Df9448616a6%22%2C%22%2Femail%2Fcss%2Fcore.css%3Fv%3D72c4808e92%22%2C%22%2Femail%2Fcss%2Fsidebar.css%3Fv%3D127041e0bb%22%2C%22%2Femail%2Fcss%2Fchat.css%3Fv%3Dd3402c3be0%22%2C%22%2Femail%2Fcss%2Fcomposer.css%3Fv%3Ddf8e2fa7d1%22%2C%22%2Femail%2Fcss%2Frevelation.css%3Fv%3D71cecca592%22%2C%22%2Femail%2Fcss%2Frevelation-v4.css%3Fv%3D3838965e35%22%2C%22%2Femail%2Fcss%2Fsystem%2Fmobile-shell.css%3Fv%3D512c2c513b%22%5D">
	<link rel="stylesheet" href="/css/golden-icons.css?v=0c129d27e5&compact=true&bundle=%5B%22%2Fcss%2Fgolden-icons.css%3Fv%3D0c129d27e5%22%2C%22%2Fcss%2Fawtsmoos-visual-assets.css%3Fv%3De114d6e59c%22%2C%22%2Fcss%2Fvideo-loader.css%3Fv%3Ddce2411c38%22%2C%22%2Fstyle%2Fanimations%2Fmicro-interactions.css%3Fv%3Dfa2d7a2a3f%22%5D">
	<style>
		/* B"H — Mail boot loader: a CSS ring, zero payload (the old video loader
		   downloaded 224 KB that the drive API serves as image/png, so it could
		   never play and only competed with the app boot for bandwidth). */
		.mail-loader-ring { width:54px; height:54px; border-radius:50%; border:4px solid rgba(190,205,235,.22); border-top-color:#cfe0ff; animation:mailLoaderSpin .9s linear infinite; }
		@keyframes mailLoaderSpin { to { transform:rotate(360deg); } }
		@media (prefers-reduced-motion: reduce) { .mail-loader-ring { animation:none; } }
		/* B"H 2026-11-23 (email UI repair): /css/video-loader.css draws a second
		   ring on .awtsmoos-video-loader::after (bottom:9%) — on this page the
		   mail ring above is the one true loader, so the generic ring is
		   suppressed and a wordmark stands under the ring instead of a void. */
		body[data-mail-page] .awtsmoos-video-loader::after { content:none; display:none; }
		body[data-mail-page] .awtsmoos-video-loader { flex-direction:column; }
		.mail-loader-label { margin-top:18px; font:600 15px/1.3 system-ui, sans-serif; letter-spacing:.02em; color:#b8d2fb; }
	</style>
</head>
<body class="geelooy-mail-document awtsmoos-bg-email" data-mail-page data-mail-connectivity="unknown" data-geelooy-route="mail">
	<!-- B"H — Loading screen: CSS ring on the cosmic-blue ground (no video payload) -->
	<div class="awtsmoos-video-loader" id="awtsmoos-video-loader" style="background:#060910" role="status" aria-label="Loading mail">
		<div class="mail-loader-ring" aria-hidden="true"></div>
		<div class="mail-loader-label" aria-hidden="true">Quantum Mail</div>
	</div>
	<script>
		/* B"H — Fade the video loader once the mail app boots */
		(function() {
			function hideLoader() {
				var el = document.getElementById('awtsmoos-video-loader');
				if (!el || el.getAttribute('data-hidden') === 'true') return;
				el.setAttribute('data-hidden', 'true');
				setTimeout(function() { el.remove(); }, 800);
			}
			/* Hide when mail content renders */
			var check = setInterval(function() {
				var root = document.getElementById('root');
				if (root && root.children.length > 1) { clearInterval(check); setTimeout(hideLoader, 300); }
			}, 500);
			window.addEventListener('load', function() { setTimeout(hideLoader, 4000); });
			setTimeout(function() { clearInterval(check); hideLoader(); }, 12000);
		})();
	</script>
	<main id="root" class="geelooy-page-root root" aria-labelledby="mail-title">
		<h1 class="g-sr-only" id="mail-title">Awtsmoos Quantum Mail</h1>
	</main>
	<script type="module" src="/scripts/awtsmoos/social/shell/boot.js?v=0b2253c7f2&compact=true"></script>
	<script type="module" src="./index.js?compact=true"></script>
<script src="/scripts/sw-register.js?v=bac1c44237"></script>
</body>
</html>
