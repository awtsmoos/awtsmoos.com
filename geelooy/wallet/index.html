<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>Awtsmoos Wallet</title>
	<meta http-equiv="refresh" content="0;url=/apps/wallet/">
	<link rel="canonical" href="/apps/wallet/">
	<script>
		const destination = new URL('/apps/wallet/', location.origin);
		destination.search = location.search;
		destination.hash = location.hash;
		location.replace(destination);
	</script>
</head>
<body>
	<main>
		<h1>Awtsmoos Wallet</h1>
		<p>The wallet opens at its secure app destination.</p>
		<a href="/apps/wallet/">Open Wallet</a>
	</main>
</body>
</html>
