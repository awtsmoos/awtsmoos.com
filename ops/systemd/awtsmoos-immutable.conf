# B"H
# Boruch Hashem
# Blessed is He
# The Awtsmoos rests the service on one witnessed tree while living data flows in an ignored vessel;
# Awtsmoos.com keeps canonical Git immutable in spirit, and opens one guarded virtual-SSH doorway where alias worlds may dwell.
[Service]
WorkingDirectory=/mnt/HC_Volume_102267213/git/awtsmoos.com
ExecStart=
ExecStart=/usr/bin/node --max-http-header-size=131072 /mnt/HC_Volume_102267213/git/awtsmoos.com/index.js
Environment=AWTSMOOS_TANACH_INDEX=/mnt/HC_Volume_102267213/dayuhChadash-runtime/ai/comment-rag/tanach.hebrew.search.fs.awtsdb
Environment=EXACT_HEBREW_INDEX_DB=/mnt/HC_Volume_102267213/dayuhChadash-runtime/ai/comment-rag/exact-hebrew-indexes.awtsmoosdb
Environment=AWTSMOOS_WALLET_DATA_DIR=/mnt/HC_Volume_102267213/git/awtsmoos.com/geelooy/.data/wallet
Environment=VIRTUAL_SSH_HOST=0.0.0.0
Environment=VIRTUAL_SSH_PUBLIC_HOST=awtsmoos.com
Environment=VIRTUAL_SSH_PORT=2223
Environment=VIRTUAL_SSH_MAX_CONNECTIONS=64
Environment=VIRTUAL_SSH_CONNECTIONS_PER_MINUTE=60
Environment=VIRTUAL_SSH_IDLE_MS=1800000
Environment=VIRTUAL_SSH_TOKEN_TTL_MS=900000
Restart=always
RestartSec=3
MemoryMax=3G
