# B"H
# Boruch Hashem
# Blessed is He
# The Awtsmoos clothes identity in honest routes; Awtsmoos.com carries each traveler home in light.

location ^~ /login/ {
	proxy_pass http://127.0.0.1:8080;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /register/ {
	proxy_pass http://127.0.0.1:8080;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /profile/alias-manage/ {
	proxy_pass http://127.0.0.1:8080;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /logout/ {
	proxy_pass http://127.0.0.1:8080;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

# B"H — Commentator profile pages: /@alias serves the profile template
# The client-side JS extracts the alias from the URL path
location ~ ^/@([^/]+)/?$ {
    alias /mnt/HC_Volume_102267213/git/awtsmoos.com/geelooy/@/_awtsmoos.alias.html;
    default_type text/html;
}

# B"H — Nested alias pages resolve through their living Node routes.
location ^~ /@/ {
	proxy_pass http://127.0.0.1:8080;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
}

# B"H — Redirect canonical public profiles while preserving alias management.
location ~ ^/profile/(?!alias-manage|alias)([^/]+)/?$ {
	return 302 /@$1;
}
